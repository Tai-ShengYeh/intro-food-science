<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品科學概論 第6週 · 國合班互動練習</title>
<style>
  :root{
    --primary:#2D2A6E; --secondary:#5B4FB8; --accent:#00B8B8; --warm:#F5A623; --green:#2FA36B; --red:#D65B5B; --dark:#1A1A3E; --bg:#F4F5FA; --text:#1F1F2E; --mid:#5A5A75; --muted:#9096ac; --border:#E2E2EC; --card:#fff;
  }
/* 版型樣式 — 逐條取自「第1週_互動教學.html」，末段為新增區塊（cmp / tbl / note）。
   這裡只用 var(--x)；色票由 tokens.js 產生 :root 注入。 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:17px}
header{background:linear-gradient(120deg,var(--dark),var(--primary));color:#fff;
  padding:26px 22px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(0,0,0,.15)}
header h1{font-size:31px;font-weight:800;letter-spacing:.5px}
header .sub{color:#b9c7ff;font-size:16px;margin-top:5px}
nav{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.10);color:#dfe4ff;border:none;padding:12px 18px;
  border-radius:10px 10px 0 0;font-size:16.5px;cursor:pointer;font-weight:600;transition:.15s}
nav button:hover{background:rgba(255,255,255,.2)}
nav button.active{background:var(--bg);color:var(--primary)}
main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
.module{display:none;animation:fade .35s}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead{background:var(--dark);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:22px}
.lead .kicker{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px}
.lead h2{font-size:26px;margin:6px 0 8px}
.lead p{color:#cdd3ee;font-size:16.5px}
.sec-title{font-size:23px;font-weight:800;color:var(--primary);margin:30px 0 6px;
  display:flex;align-items:center;gap:10px}
.sec-title .bar{width:6px;height:25px;background:var(--accent);border-radius:3px;display:inline-block}
.hint{color:var(--mid);font-size:15px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* flip cards */
.flip{perspective:1100px;height:200px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px rgba(30,30,60,.08);border:1px solid var(--border)}
.front{background:var(--card)}
.front .t{font-size:21px;font-weight:800;color:var(--primary)}
.front .en{color:var(--muted);font-size:14px;margin-top:3px;font-style:italic}
.front .tap{margin-top:auto;color:var(--accent);font-size:14px;font-weight:700}
.back{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;transform:rotateY(180deg);overflow:auto}
.back p{font-size:16px}
.cbar{height:6px;border-radius:14px 14px 0 0;position:absolute;top:0;left:0;right:0}

/* expandable */
.exp{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.exp>button{width:100%;text-align:left;background:none;border:none;padding:16px 18px;cursor:pointer;
  display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;color:var(--text)}
.exp .num{background:var(--primary);color:#fff;min-width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.exp .chev{margin-left:auto;color:var(--muted);transition:.25s;font-size:20px}
.exp.on .chev{transform:rotate(90deg);color:var(--accent)}
.exp .body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 18px}
.exp.on .body{padding:0 18px 16px 62px}
.exp .body ul{margin-left:16px;color:var(--mid);font-size:16px}
.exp .body p{color:var(--mid);font-size:15.5px}
.exp .tag{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:8px}

/* info card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.card .h{font-weight:800;color:var(--primary);font-size:18px;margin-bottom:6px}
.card .en{color:var(--muted);font-size:13px;font-style:italic}
.card ul{margin:8px 0 0 18px;font-size:15.5px;color:var(--mid)}

/* timeline */
.tl{display:flex;gap:0;flex-wrap:wrap;counter-reset:s}
.tl .step{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 14px 14px;margin:8px;position:relative}
.tl .dot{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;margin-bottom:8px}
.tl .step h4{color:var(--primary);font-size:17.5px;margin-bottom:4px}
.tl .step p{font-size:15px;color:var(--mid)}

/* matching */
.match-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.pool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--secondary);color:#fff;padding:10px 17px;border-radius:22px;font-weight:700;
  cursor:grab;user-select:none;font-size:16.5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chip.used{opacity:.35;pointer-events:none}
.chip.sel{outline:3px solid var(--warm);outline-offset:2px}
.targets{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;border:2px dashed var(--border);border-radius:12px;padding:10px 14px;background:#fafbff}
.slot .desc{flex:1;font-size:16px;color:var(--text)}
.slot .drop{min-width:130px;min-height:44px;border-radius:8px;background:#eef0f8;display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:15px;padding:8px 12px}
.slot.ok{border-color:var(--green);background:#effaf3}
.slot.ok .drop{background:var(--green);color:#fff;font-weight:700}
.slot.bad{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* quiz */
.quiz-head{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.pbar{height:12px;background:#e7e9f4;border-radius:8px;overflow:hidden;margin-top:10px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--secondary));transition:width .4s}
.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.q .qn{color:var(--accent);font-weight:800;font-size:14px}
.q .qt{font-size:19.5px;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fafbff;border:2px solid var(--border);
  border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;font-size:16.5px;transition:.15s}
.opt:hover{border-color:var(--secondary)}
.opt.correct{border-color:var(--green);background:#effaf3;font-weight:700}
.opt.wrong{border-color:var(--red);background:#fdeeee}
.opt.dim{opacity:.6}
.fb{margin-top:8px;font-size:15.5px;padding:11px 14px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.good{background:#effaf3;color:#1c7a4d} .fb.no{background:#fdeeee;color:#a83b3b}
.scorebox{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:16px;
  padding:26px;text-align:center;margin-top:10px;display:none}
.scorebox.show{display:block}
.scorebox .big{font-size:46px;font-weight:800}
.btn{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:10px;
  font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.18)}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;background:#eef0fb;color:var(--secondary);padding:3px 10px;border-radius:20px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px}

/* ===== 新增區塊 ===== */
/* compare：兩欄對照（梅納 vs 焦糖化、冷藏 vs 冷凍…） */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media(max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 18px 18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06);position:relative;overflow:hidden}
.cmp .col .cbar{position:static;height:6px;margin:0 -18px 14px;border-radius:0}
.cmp .col h4{font-size:20px;font-weight:800;margin-bottom:2px}
.cmp .col .en{color:var(--muted);font-size:13px;font-style:italic;margin-bottom:8px}
.cmp .col ul{margin-left:18px;font-size:15.5px;color:var(--mid)}
.cmp .col li{margin-bottom:5px}
.cmp-note{margin-top:12px;background:#eef0fb;border-left:5px solid var(--secondary);
  border-radius:0 10px 10px 0;padding:12px 16px;font-size:16px;color:var(--primary);font-weight:600}

/* table：資料表（維生素、添加物分類…） */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px}
.tbl th{background:var(--primary);color:#fff;text-align:left;padding:12px 14px;font-weight:700;font-size:15px}
.tbl td{padding:11px 14px;border-top:1px solid var(--border);color:var(--mid);vertical-align:top}
.tbl tr:nth-child(even) td{background:#fafbff}
.tbl td:first-child{color:var(--text);font-weight:700}

/* note：重點提示條 */
.note{background:#fff8e9;border-left:5px solid var(--warm);border-radius:0 12px 12px 0;
  padding:14px 18px;margin:14px 0;font-size:16px;color:var(--text)}
.note b{color:var(--primary)}
.note.key{background:#effaf3;border-left-color:var(--green)}
.note.warn{background:#fdeeee;border-left-color:var(--red)}
/* 國合班 A2 互動練習：拼音與越南文（build_a2.js 產生的內容才會用到） */
.py{display:block;font-size:.78em;font-weight:500;color:var(--mid);margin-top:2px}
.vn{display:block;font-size:.88em;font-weight:500;color:var(--secondary);margin-top:2px}
/* Shared classroom tasks: oral response, sentence support, then sample explanation. */
.class-activity{display:grid;gap:12px;min-width:0}
.class-activity .vn{display:block;color:#0E7C7B;font-size:15px;line-height:1.5;margin-top:4px}
.activity-time{color:#0E7C7B;font-weight:700;font-size:15px}
.activity-prompt{font-size:clamp(18px,2.3vw,23px);line-height:1.5}
.sentence-stem{padding:12px 16px;background:#EFFAF3;border-left:5px solid #2FA36B;color:#1A1A3E;line-height:1.6}
.class-activity label{font-size:14px;color:#52526B}
.activity-response{display:block;width:100%;max-width:100%;min-height:72px;border:1.5px solid #A0A0B5;border-radius:8px;padding:10px 12px;resize:vertical;font:inherit;font-size:17px;background:#fff;color:#1F1F2E}
.activity-answer{border:1px solid #E2E2EC;background:#fff;border-radius:8px;padding:10px 14px;font-size:16px;line-height:1.5}
.activity-answer summary{cursor:pointer;font-weight:700;color:#2D2A6E}
.activity-answer p{margin-top:10px}
.activity-response:focus-visible,.activity-answer summary:focus-visible{outline:3px solid #0E7C7B;outline-offset:3px}
.source-note{font-size:13px;color:#52526B;line-height:1.5;overflow-wrap:anywhere;margin-top:10px}
.source-note .vn{display:block;color:#0E7C7B;font-size:13px}
.lesson-links{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.lesson-links a{color:inherit;text-underline-offset:3px}
.feedback-reason,.feedback-transfer{margin-top:6px}
.feedback-transfer{font-weight:600}
@media(max-width:640px){header{position:relative!important}.class-activity{gap:10px}}
@media print{.activity-response{min-height:64px}}


.back .vn{color:#D7FAF3}.tbl-wrap{overflow-x:auto}
</style>
</head>

<script>window.__LESSON__={"week":6,"series":["#2D2A6E","#2FA36B","#F5A623","#5B4FB8","#00B8B8","#D65B5B"],"modules":[{"id":"m0","nav":"今天 Hôm nay","kicker":"今天學什麼 · Hôm nay học gì","h2":"維生素與礦物質","lead":"wéishēngsù yǔ kuàngwùzhí　·　Vitamin và chất khoáng","blocks":[{"type":"cards","title":"今天學三件事　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Hôm nay học 3 điều\u003c/span>","cols":3,"items":[{"h":"維生素：溶在油，還是溶在水？","p":"\u003cspan class=\"vn\">Vitamin: tan trong chất béo hay tan trong nước?\u003c/span>"},{"h":"礦物質：吃進去，吸收多少？","p":"\u003cspan class=\"vn\">Chất khoáng: ăn vào, hấp thu được bao nhiêu?\u003c/span>"},{"h":"加工與保存如何影響營養？","p":"\u003cspan class=\"vn\" lang=\"vi\">Chế biến và bảo quản ảnh hưởng dinh dưỡng thế nào?\u003c/span>"}]},{"type":"note","title":"看影片：玉米的鹼煮　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Xem video: nấu ngô với chất kiềm\u003c/span>","text":"\u003ca href=\"https://www.youtube.com/watch?v=t_RlMWSPtLU&t=319s\" target=\"_blank\" rel=\"noopener\" style=\"font-weight:700\">▶ 玉米的鹼煮加工\u003c/a>\u003cspan class=\"vn\">Chế biến ngô bằng kiềm\u003c/span>\u003cul style=\"margin:10px 0 0;padding-left:22px\">\u003cli>玉米和什麼一起煮？\u003cspan class=\"vn\">Ngô được nấu cùng với chất gì?\u003c/span>\u003c/li>\u003cli>玉米的水分從幾 % 變成幾 %？\u003cspan class=\"vn\">Hàm lượng nước của ngô tăng từ bao nhiêu % lên bao nhiêu %?\u003c/span>\u003c/li>\u003cli>鹼煮放出了哪一種維生素？\u003cspan class=\"vn\">Nấu với kiềm giải phóng loại vitamin nào?\u003c/span>\u003c/li>\u003c/ul>特定玉米鹼煮可改變菸鹼酸的結合形式與可利用性，也可能損失部分營養；不是所有食品加鹼都更有營養。\u003cspan class=\"vn\" lang=\"vi\">Nấu ngô với kiềm trong điều kiện phù hợp có thể đổi dạng liên kết và khả năng sử dụng niacin, đồng thời mất một phần chất; không phải mọi thực phẩm thêm kiềm đều bổ hơn.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/W0073e/w0073e06.htm\" target=\"_blank\" rel=\"noopener\">玉米加工範圍 / Phạm vi chế biến ngô: FAO ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"一鍋青菜湯：分清三個問題\u003cspan class=\"vn\" lang=\"vi\">Một nồi canh rau: phân biệt ba câu hỏi\u003c/span>","cols":3,"items":[{"h":"① 原料含多少？\u003cspan class=\"vn\" lang=\"vi\">Nguyên liệu có bao nhiêu?\u003c/span>","p":"分清維生素與礦物質；食材含量也會有差異。\u003cspan class=\"vn\" lang=\"vi\">Phân biệt vitamin và chất khoáng; hàm lượng tùy nguyên liệu.\u003c/span>","c":"#2D2A6E"},{"h":"② 煮後留多少？\u003cspan class=\"vn\" lang=\"vi\">Sau nấu giữ được bao nhiêu?\u003c/span>","p":"菜裡、湯裡分開看；溶出和分解不是同一件事。\u003cspan class=\"vn\" lang=\"vi\">Xem riêng rau và nước canh; hòa ra nước khác phân hủy.\u003c/span>","c":"#2FA36B"},{"h":"③ 吃了多少、用多少？\u003cspan class=\"vn\" lang=\"vi\">Ăn vào và sử dụng bao nhiêu?\u003c/span>","p":"看份量與實際吃下的量；含量不等於吸收利用量。\u003cspan class=\"vn\" lang=\"vi\">Xem khẩu phần và lượng ăn thực; hàm lượng khác lượng hấp thu, sử dụng.\u003c/span>","c":"#F5A623"}]}]},{"id":"m1","nav":"生詞 Từ mới","kicker":"生詞 · Từ mới","h2":"本週生詞","lead":"10 個生詞　·　10 từ mới","blocks":[{"type":"flips","cols":3,"items":[{"t":"維生素","en":"wéishēngsù","b":"vitamin"},{"t":"脂溶性","en":"zhīróngxìng","b":"tan trong chất béo"},{"t":"水溶性","en":"shuǐróngxìng","b":"tan trong nước"},{"t":"抗壞血酸","en":"kànghuàixuèsuān","b":"axit ascorbic (vitamin C)"},{"t":"葉酸","en":"yèsuān","b":"axit folic"}],"title":"翻卡：生詞　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Lật thẻ: từ mới\u003c/span>"},{"type":"flips","cols":3,"items":[{"t":"礦物質","en":"kuàngwùzhí","b":"chất khoáng"},{"t":"鐵","en":"tiě","b":"sắt (Fe)"},{"t":"碘","en":"diǎn","b":"iốt (I)"},{"t":"食品強化","en":"shípǐn qiánghuà","b":"tăng cường vi chất"},{"t":"營養標示","en":"yíngyǎng biāoshì","b":"nhãn dinh dưỡng"}]},{"type":"match","title":"配對：中文 ↔ 越南文　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Ghép: tiếng Trung ↔ tiếng Việt\u003c/span>","pairs":[{"label":"維生素","desc":"vitamin"},{"label":"脂溶性","desc":"tan trong chất béo"},{"label":"水溶性","desc":"tan trong nước"},{"label":"抗壞血酸","desc":"axit ascorbic (vitamin C)"},{"label":"葉酸","desc":"axit folic"},{"label":"礦物質","desc":"chất khoáng"},{"label":"鐵","desc":"sắt (Fe)"},{"label":"碘","desc":"iốt (I)"},{"label":"食品強化","desc":"tăng cường vi chất"},{"label":"營養標示","desc":"nhãn dinh dưỡng"}],"done":"✓ 全部答對！Đúng hết!"}]},{"id":"s1","nav":"一 維生素：溶在油，…","kicker":"第一段 · Phần 1","h2":"維生素：溶在油，還是溶在水？","lead":"Vitamin: tan trong chất béo hay tan trong nước?","blocks":[{"type":"cards","title":"維生素的兩種分類\u003cspan class=\"vn\" lang=\"vi\">Hai nhóm vitamin\u003c/span>","cols":2,"items":[{"h":"脂溶性：A、D、E、K\u003cspan class=\"vn\" lang=\"vi\">Tan trong chất béo: A, D, E, K\u003c/span>","p":"吸收與脂肪消化有關，儲存與安定性仍依種類而異。\u003cspan class=\"vn\" lang=\"vi\">Hấp thu liên quan tiêu hóa chất béo; dự trữ và độ bền tùy loại.\u003c/span>","c":"#2D2A6E"},{"h":"水溶性：B 群、C\u003cspan class=\"vn\" lang=\"vi\">Tan trong nước: nhóm B, C\u003c/span>","p":"可能溶入烹調水，但不是全部都同樣怕熱；體內儲存也有差別。\u003cspan class=\"vn\" lang=\"vi\">Có thể hòa vào nước nấu, nhưng không phải đều nhạy nhiệt như nhau; dự trữ trong cơ thể cũng khác.\u003c/span>","c":"#2FA36B"}]},{"type":"note","title":"","text":"水溶性不等於「過量都會排掉，所以一定安全」；脂溶性也不是四種都具有相同過量風險。加工比較應指明哪個營養素、哪種食品和條件。\u003cspan class=\"vn\" lang=\"vi\">Tan trong nước không có nghĩa dư đều thải hết nên luôn an toàn; bốn vitamin tan trong chất béo cũng không có cùng nguy cơ dư. Khi so chế biến cần chỉ rõ chất, thực phẩm và điều kiện.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://ods.od.nih.gov/factsheets/VitaminB6-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">溶解性與過量風險例 / Ví dụ độ tan và nguy cơ dư: NIH ODS B6 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"脂溶性維生素：主要功能例子\u003cspan class=\"vn\" lang=\"vi\">Vitamin tan trong chất béo: ví dụ chức năng\u003c/span>","cols":4,"items":[{"h":"A\u003cspan class=\"vn\" lang=\"vi\">Vitamin A\u003c/span>","p":"參與視覺等功能；深色蔬果可含 β-胡蘿蔔素等前驅物。\u003cspan class=\"vn\" lang=\"vi\">Tham gia thị giác; rau quả sẫm màu có thể chứa tiền chất như beta-carotene.\u003c/span>","c":"#2D2A6E"},{"h":"D\u003cspan class=\"vn\" lang=\"vi\">Vitamin D\u003c/span>","p":"幫助鈣吸收；魚類、部分強化食品可提供。\u003cspan class=\"vn\" lang=\"vi\">Giúp hấp thu canxi; có từ cá và một số thực phẩm tăng cường.\u003c/span>","c":"#2FA36B"},{"h":"E\u003cspan class=\"vn\" lang=\"vi\">Vitamin E\u003c/span>","p":"參與抗氧化；植物油、堅果是常見來源。\u003cspan class=\"vn\" lang=\"vi\">Tham gia chống oxy hóa; dầu thực vật và hạt là nguồn thường gặp.\u003c/span>","c":"#F5A623"},{"h":"K\u003cspan class=\"vn\" lang=\"vi\">Vitamin K\u003c/span>","p":"參與凝血相關蛋白功能；深綠色蔬菜等可提供。\u003cspan class=\"vn\" lang=\"vi\">Tham gia chức năng protein đông máu; có từ rau xanh đậm.\u003c/span>","c":"#5B4FB8"}]},{"type":"cards","title":"水溶性維生素：安定性不一樣\u003cspan class=\"vn\" lang=\"vi\">Vitamin tan trong nước: độ bền khác nhau\u003c/span>","cols":4,"items":[{"h":"B1\u003cspan class=\"vn\" lang=\"vi\">Thiamin\u003c/span>","p":"與能量代謝有關；熱、酸鹼與時間可影響保留。\u003cspan class=\"vn\" lang=\"vi\">Liên quan chuyển hóa năng lượng; nhiệt, pH và thời gian ảnh hưởng giữ lại.\u003c/span>","c":"#2D2A6E"},{"h":"B2\u003cspan class=\"vn\" lang=\"vi\">Riboflavin\u003c/span>","p":"對光敏感，包裝與陳列光照值得注意。\u003cspan class=\"vn\" lang=\"vi\">Nhạy ánh sáng; cần xem bao bì và ánh sáng trưng bày.\u003c/span>","c":"#2FA36B"},{"h":"葉酸 B9\u003cspan class=\"vn\" lang=\"vi\">Folate\u003c/span>","p":"參與細胞分裂；不同形式、熱與氧等影響保留。\u003cspan class=\"vn\" lang=\"vi\">Tham gia phân chia tế bào; dạng, nhiệt và oxy ảnh hưởng giữ lại.\u003c/span>","c":"#F5A623"},{"h":"維生素 C\u003cspan class=\"vn\" lang=\"vi\">Vitamin C / axit ascorbic\u003c/span>","p":"可受熱、氧等影響，也可溶入水；不能代表所有維生素。\u003cspan class=\"vn\" lang=\"vi\">Có thể bị ảnh hưởng bởi nhiệt, oxy và hòa vào nước; không đại diện mọi vitamin.\u003c/span>","c":"#5B4FB8"}]},{"type":"note","title":"","text":"不同食材、營養素與烹調方法會有不同保留結果，不能直接說炒一定比煮好，也不能用 C 的保留保證其他維生素。\u003cspan class=\"vn\" lang=\"vi\">Kết quả giữ lại khác theo nguyên liệu, chất và cách nấu; không kết luận xào luôn hơn luộc hay C giữ được thì mọi vitamin đều giữ được.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.1007/s10068-017-0281-1\" target=\"_blank\" rel=\"noopener\">蔬菜烹調研究 / Nghiên cứu nấu rau: Lee et al., 2018 ↗\u003c/a>\u003c/p>"},{"type":"note","text":"\u003cp class=\"source-note\">\u003ca href=\"https://ods.od.nih.gov/factsheets/Riboflavin-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">B2 與光 / B2 và ánh sáng: NIH ODS ↗\u003c/a>\u003c/p>"},{"type":"note","title":"","text":"B12 可在體內儲存。天然食物來源多為動物性食品，也有添加 B12 的強化食品；不能寫成所有 B12 只存在動物性食品。\u003cspan class=\"vn\" lang=\"vi\">B12 có thể dự trữ trong cơ thể. Nguồn tự nhiên chủ yếu là thức ăn động vật, nhưng cũng có thực phẩm bổ sung B12; không nói B12 chỉ có trong thực phẩm động vật.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://ods.od.nih.gov/factsheets/VitaminB12-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">B12 來源與儲存 / Nguồn và dự trữ B12: NIH ODS ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 1｜湯裡的三種營養素\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 1: Ba chất dinh dưỡng trong canh\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"classify\">\u003cp class=\"activity-time\">1 分鐘 / 1 phút\u003c/p>\u003cp class=\"activity-prompt\">青菜湯裡的維生素 A、維生素 C、鈣，分別屬於脂溶性、水溶性，還是礦物質？只靠分類能預測全部保留量嗎？\u003cspan class=\"vn\" lang=\"vi\">Vitamin A, vitamin C và canxi trong canh thuộc nhóm tan trong chất béo, tan trong nước hay chất khoáng? Chỉ phân loại có dự đoán được mọi lượng giữ lại không?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>＿＿屬於＿＿；保留多少還要看＿＿。\u003cspan class=\"vn\" lang=\"vi\">___ thuộc nhóm ___; giữ lại bao nhiêu còn tùy ___.\u003c/span>\u003c/div>\u003clabel for=\"a2-w6-classify\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w6-classify\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>維生素 A 屬脂溶性，C 屬水溶性，鈣是礦物質；保留多少還要看食材、時間、水量與條件。\u003cspan class=\"vn\" lang=\"vi\">Vitamin A tan trong chất béo, C tan trong nước, canxi là chất khoáng; lượng giữ lại còn tùy nguyên liệu, thời gian, nước và điều kiện.\u003c/span>\u003c/p>\u003cp>溶解性是分類，不是全部安定性。礦物質不因一般烹調而分解成「沒有」，但可能轉移到水或被移除。\u003cspan class=\"vn\" lang=\"vi\">Độ tan là cách phân loại, không phải toàn bộ độ bền. Chất khoáng không biến mất do phân hủy khi nấu thông thường, nhưng có thể chuyển vào nước hoặc bị loại bỏ.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"}]},{"id":"s2","nav":"二 礦物質：吃進去，…","kicker":"第二段 · Phần 2","h2":"礦物質：吃進去，吸收多少？","lead":"Chất khoáng: ăn vào, hấp thu được bao nhiêu?","blocks":[{"type":"cards","title":"礦物質：功能與來源例子\u003cspan class=\"vn\" lang=\"vi\">Chất khoáng: ví dụ chức năng và nguồn\u003c/span>","cols":4,"items":[{"h":"鈣 Ca\u003cspan class=\"vn\" lang=\"vi\">Canxi\u003c/span>","p":"參與骨骼等功能；豆腐含鈣量依凝固劑與製程而異。\u003cspan class=\"vn\" lang=\"vi\">Tham gia xương; canxi trong đậu phụ tùy chất đông tụ và quy trình.\u003c/span>","c":"#2D2A6E"},{"h":"鐵 Fe\u003cspan class=\"vn\" lang=\"vi\">Sắt\u003c/span>","p":"參與血紅素等功能；食物中的鐵有不同形式。\u003cspan class=\"vn\" lang=\"vi\">Tham gia hemoglobin; sắt trong thức ăn có nhiều dạng.\u003c/span>","c":"#2FA36B"},{"h":"鈉 Na\u003cspan class=\"vn\" lang=\"vi\">Natri\u003c/span>","p":"參與體液平衡；標示可幫助計算全天總攝取量。\u003cspan class=\"vn\" lang=\"vi\">Tham gia cân bằng dịch; nhãn giúp tính tổng lượng ăn trong ngày.\u003c/span>","c":"#F5A623"},{"h":"碘 I\u003cspan class=\"vn\" lang=\"vi\">Iốt\u003c/span>","p":"製造甲狀腺激素所需；加碘鹽須看實際標示。\u003cspan class=\"vn\" lang=\"vi\">Cần để tạo hormone tuyến giáp; xem nhãn muối iốt.\u003c/span>","c":"#5B4FB8"}]},{"type":"note","title":"","text":"一般烹調不會把礦物質元素分解掉，但可轉移到水中，或隨去皮、去糠等步驟被移除；化學型態與利用率也可能改變。\u003cspan class=\"vn\" lang=\"vi\">Nấu thông thường không phân hủy nguyên tố khoáng, nhưng chúng có thể chuyển vào nước hoặc bị loại khi gọt vỏ, xay xát; dạng hóa học và khả năng sử dụng cũng có thể đổi.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.ars.usda.gov/research/publications/publication/?seqNo115=225934\" target=\"_blank\" rel=\"noopener\">保留量計算與加工 / Giữ lại và chế biến: USDA ARS ↗\u003c/a>\u003c/p>"},{"type":"note","title":"","text":"國健署衛教建議成人每日鈉攝取不超過 2400 mg，約為 6 g 食鹽所含鈉。這是全天所有食物的總鈉量，不是可額外再加 6 g 鹽，也不是每個年齡的個人處方。\u003cspan class=\"vn\" lang=\"vi\">Giáo dục sức khỏe HPA Đài Loan khuyến nghị người lớn không quá 2400 mg natri/ngày, xấp xỉ natri trong 6 g muối. Đây là tổng natri mọi thức ăn, không phải được thêm 6 g muối hay đơn riêng cho mọi lứa tuổi.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=543&pid=8365\" target=\"_blank\" rel=\"noopener\">成人建議與範圍 / Khuyến nghị người lớn: 台灣國健署 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"含量、吸收與利用，分開看\u003cspan class=\"vn\" lang=\"vi\">Phân biệt hàm lượng, hấp thu và sử dụng\u003c/span>","cols":3,"items":[{"h":"標示含量\u003cspan class=\"vn\" lang=\"vi\">Hàm lượng trên nhãn\u003c/span>","p":"告訴我們食品含多少；還要乘上實際食用份量。\u003cspan class=\"vn\" lang=\"vi\">Cho biết thực phẩm có bao nhiêu; còn nhân với khẩu phần thực ăn.\u003c/span>","c":"#2D2A6E"},{"h":"生物利用率\u003cspan class=\"vn\" lang=\"vi\">Sinh khả dụng\u003c/span>","p":"營養素可被吸收並供身體利用的程度，不是標示數字本身。\u003cspan class=\"vn\" lang=\"vi\">Mức chất được hấp thu và dùng trong cơ thể, không phải chính số trên nhãn.\u003c/span>","c":"#2FA36B"},{"h":"整餐與個人狀態\u003cspan class=\"vn\" lang=\"vi\">Bữa ăn và tình trạng cá nhân\u003c/span>","p":"營養素形式、搭配與身體狀態都可能影響結果。\u003cspan class=\"vn\" lang=\"vi\">Dạng chất, kết hợp món và tình trạng cơ thể đều ảnh hưởng.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"維生素 C 可促進非血基質鐵的吸收。肉類也可同時含血基質與非血基質鐵；不把「肉／菜」各套上一個固定吸收百分比。\u003cspan class=\"vn\" lang=\"vi\">Vitamin C có thể tăng hấp thu sắt không heme. Thịt cũng có thể có cả sắt heme và không heme; không gán một tỷ lệ hấp thu cố định cho thịt hay rau.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://ods.od.nih.gov/factsheets/Iron-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">鐵的形式與吸收 / Dạng và hấp thu sắt: NIH ODS ↗\u003c/a>\u003c/p>"}]},{"id":"s3","nav":"三 加工怎麼讓營養變…","kicker":"第三段 · Phần 3","h2":"加工與保存如何影響營養？","lead":"Chế biến làm mất chất dinh dưỡng thế nào?","blocks":[{"type":"cards","title":"假設資料：同一批原菜，算維生素 C 總量\u003cspan class=\"vn\" lang=\"vi\">Số giả định: cùng mẻ rau, tính tổng vitamin C\u003c/span>","cols":4,"items":[{"h":"原菜 100 mg\u003cspan class=\"vn\" lang=\"vi\">Rau ban đầu: 100 mg\u003c/span>","p":"本批原料的總量，不是每 100 g 食品的含量。\u003cspan class=\"vn\" lang=\"vi\">Tổng của mẻ nguyên liệu, không phải hàm lượng trên 100 g.\u003c/span>","c":"#2D2A6E"},{"h":"煮後菜裡 60 mg\u003cspan class=\"vn\" lang=\"vi\">Trong rau sau nấu: 60 mg\u003c/span>","p":"菜裡留下的部分。\u003cspan class=\"vn\" lang=\"vi\">Phần còn trong rau.\u003c/span>","c":"#2FA36B"},{"h":"煮後湯裡 20 mg\u003cspan class=\"vn\" lang=\"vi\">Trong nước canh: 20 mg\u003c/span>","p":"移到湯中的部分。\u003cspan class=\"vn\" lang=\"vi\">Phần chuyển vào nước canh.\u003c/span>","c":"#F5A623"},{"h":"菜＋湯 80 mg\u003cspan class=\"vn\" lang=\"vi\">Rau + canh: 80 mg\u003c/span>","p":"80 ÷ 100＝80% 保留；並未回到原有總量。\u003cspan class=\"vn\" lang=\"vi\">80 ÷ 100 = giữ lại 80%; chưa về tổng ban đầu.\u003c/span>","c":"#5B4FB8"}]},{"type":"note","title":"","text":"本頁是教學假設，並非實測值或固定流失比例。計算保留量要用相同原料基準與總量；不能只比較煮前後每 100 g 的濃度。\u003cspan class=\"vn\" lang=\"vi\">Đây là giả định học tập, không phải số đo hay tỷ lệ hao hụt cố định. Tính giữ lại cần cùng cơ sở nguyên liệu và tổng lượng; không chỉ so nồng độ mỗi 100 g trước và sau nấu.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.ars.usda.gov/research/publications/publication/?seqNo115=225934\" target=\"_blank\" rel=\"noopener\">總量與保留率方法 / Phương pháp giữ lại: USDA ARS ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"加工影響營養的途徑\u003cspan class=\"vn\" lang=\"vi\">Các đường chế biến ảnh hưởng dinh dưỡng\u003c/span>","cols":4,"items":[{"h":"溶出\u003cspan class=\"vn\" lang=\"vi\">Hòa ra nước\u003c/span>","p":"轉移到水裡不等於分子被破壞；要看水是否被食用。\u003cspan class=\"vn\" lang=\"vi\">Chuyển vào nước không bằng phân hủy phân tử; xem nước có được ăn không.\u003c/span>","c":"#2D2A6E"},{"h":"熱與時間\u003cspan class=\"vn\" lang=\"vi\">Nhiệt và thời gian\u003c/span>","p":"對不同營養素影響不同；不是溫度一高就一定損失最多。\u003cspan class=\"vn\" lang=\"vi\">Tác động tùy chất; không phải cứ nhiệt cao là mất nhiều nhất.\u003c/span>","c":"#2FA36B"},{"h":"氧與光\u003cspan class=\"vn\" lang=\"vi\">Oxy và ánh sáng\u003c/span>","p":"接觸條件、包裝與貯存時間共同影響反應。\u003cspan class=\"vn\" lang=\"vi\">Điều kiện tiếp xúc, bao bì và thời gian bảo quản cùng ảnh hưởng.\u003c/span>","c":"#F5A623"},{"h":"物理移除與重量\u003cspan class=\"vn\" lang=\"vi\">Loại bỏ và khối lượng\u003c/span>","p":"去皮、去糠會移除部分營養；水分改變也會改變每 100 g 的含量。\u003cspan class=\"vn\" lang=\"vi\">Gọt vỏ, xay xát loại một phần chất; đổi lượng nước cũng đổi hàm lượng mỗi 100 g.\u003c/span>","c":"#5B4FB8"}]},{"type":"note","title":"短活動 2｜菜＋湯，算總量\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 2: Rau + nước canh, tính tổng lượng\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"amount\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">假設資料：原菜共含維生素 C 100 mg；煮後菜裡 60 mg、湯裡 20 mg。菜和湯全吃完，共攝入多少？能回到 100 mg 嗎？\u003cspan class=\"vn\" lang=\"vi\">Số liệu giả định: rau ban đầu có tổng 100 mg vitamin C; sau nấu, rau có 60 mg và nước canh có 20 mg. Ăn hết cả hai được bao nhiêu? Có trở lại 100 mg không?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>菜＋湯共有＿＿mg；原來是＿＿mg，所以＿＿。\u003cspan class=\"vn\" lang=\"vi\">Rau + nước canh có ___ mg; ban đầu là ___ mg, nên ___.\u003c/span>\u003c/div>\u003clabel for=\"a2-w6-amount\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w6-amount\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>菜＋湯共有 80 mg；原來是 100 mg，所以保留 80%。喝湯可吃到湯中的 20 mg，但不會恢復原有總量。\u003cspan class=\"vn\" lang=\"vi\">Rau + nước canh có 80 mg; ban đầu 100 mg nên giữ lại 80%. Ăn nước canh lấy được 20 mg trong canh nhưng không khôi phục tổng ban đầu.\u003c/span>\u003c/p>\u003cp>這是教學假設，不是所有青菜的實測值。溶出和分解不同，且攝入量也不等於身體實際吸收量。\u003cspan class=\"vn\" lang=\"vi\">Đây là giả định học tập, không phải số đo mọi loại rau. Hòa ra nước khác phân hủy; lượng ăn vào cũng khác lượng cơ thể hấp thu.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"保留策略：控制條件，再比較\u003cspan class=\"vn\" lang=\"vi\">Giữ dinh dưỡng: kiểm soát điều kiện rồi so sánh\u003c/span>","cols":2,"items":[{"h":"在廚房\u003cspan class=\"vn\" lang=\"vi\">Trong bếp\u003c/span>","p":"縮短不必要的浸泡與久放；比較食材、水量、時間及是否吃湯。\u003cspan class=\"vn\" lang=\"vi\">Giảm ngâm và để lâu không cần thiết; xem nguyên liệu, nước, thời gian và có ăn canh không.\u003c/span>","c":"#2D2A6E"},{"h":"在工廠與保存時\u003cspan class=\"vn\" lang=\"vi\">Khi sản xuất, bảo quản\u003c/span>","p":"評估時間－溫度組合、氧與光、酵素與包裝；兼顧安全和品質。\u003cspan class=\"vn\" lang=\"vi\">Đánh giá tổ hợp thời gian–nhiệt độ, oxy, sáng, enzyme và bao bì; xem cả an toàn và chất lượng.\u003c/span>","c":"#2FA36B"}]},{"type":"note","title":"","text":"蒸、煮、炒、微波或冷凍，沒有適用所有營養素的固定排名。殺菁可能先有損失，也可藉鈍化酵素幫助後續保存；需看整段製程。\u003cspan class=\"vn\" lang=\"vi\">Hấp, luộc, xào, vi sóng hay đông lạnh không có thứ hạng chung cho mọi chất. Chần có thể gây mất ban đầu nhưng bất hoạt enzyme giúp bảo quản sau; cần xét toàn quy trình.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.1007/s10068-017-0281-1\" target=\"_blank\" rel=\"noopener\">依食材與營養素比較 / So theo rau và chất: Lee et al., 2018 ↗\u003c/a>\u003c/p>"},{"type":"note","title":"","text":"喝烹調用湯可攝入其中部分溶出的營養素，卻不能補回已分解的部分。烹調湯汁與清洗、汆燙廢水不同，不能直接建議全部拿來喝。\u003cspan class=\"vn\" lang=\"vi\">Ăn nước canh có thể lấy một phần chất hòa ra nhưng không khôi phục phần đã phân hủy. Nước canh khác nước rửa hay nước chần bỏ đi, không khuyên uống tất cả.\u003c/span>"},{"type":"cards","title":"食品強化：看產品與計畫\u003cspan class=\"vn\" lang=\"vi\">Tăng cường vi chất: xem sản phẩm và chương trình\u003c/span>","cols":3,"items":[{"h":"食鹽加碘\u003cspan class=\"vn\" lang=\"vi\">Muối bổ sung iốt\u003c/span>","p":"刻意增加碘含量；不是所有食鹽都可直接視為加碘鹽。\u003cspan class=\"vn\" lang=\"vi\">Chủ động tăng iốt; không xem mọi muối đều là muối iốt.\u003c/span>","c":"#2D2A6E"},{"h":"食品添加維生素\u003cspan class=\"vn\" lang=\"vi\">Thêm vitamin vào thực phẩm\u003c/span>","p":"例如部分食品添加 D 或 B12，實際成分與含量須看標示。\u003cspan class=\"vn\" lang=\"vi\">Một số thực phẩm thêm D hoặc B12; xem thành phần và hàm lượng trên nhãn.\u003c/span>","c":"#2FA36B"},{"h":"越南的研究例子\u003cspan class=\"vn\" lang=\"vi\">Ví dụ nghiên cứu Việt Nam\u003c/span>","p":"曾研究鐵強化魚露；不能推論每一瓶魚露都加鐵。\u003cspan class=\"vn\" lang=\"vi\">Đã nghiên cứu nước mắm tăng cường sắt; không suy ra mọi chai đều thêm sắt.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"強化是刻意增加食品中微量營養素，原本有無都可能；需評估需要、添加量、形式與實際攝取。不是吃強化食品就能取代所有飲食安排或醫療處置。\u003cspan class=\"vn\" lang=\"vi\">Tăng cường chủ động tăng vi chất trong thực phẩm dù ban đầu có hay không; cần xem nhu cầu, lượng, dạng và lượng ăn. Không thay mọi chế độ ăn hay xử trí y tế bằng thực phẩm tăng cường.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.who.int/health-topics/food-fortification\" target=\"_blank\" rel=\"noopener\">定義與範圍 / Định nghĩa: WHO Food fortification ↗\u003c/a>\u003c/p>\u003cp class=\"source-note\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/16251617/\" target=\"_blank\" rel=\"noopener\">越南鐵強化魚露研究 / Nghiên cứu nước mắm tăng cường sắt: 2005 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"假設湯品標示摘錄：先統一基準\u003cspan class=\"vn\" lang=\"vi\">Trích nhãn canh giả định: cùng cơ sở trước\u003c/span>","cols":3,"items":[{"h":"A：每份 200 mL\u003cspan class=\"vn\" lang=\"vi\">A: mỗi phần 200 mL\u003c/span>","p":"鈉 240 mg；一瓶 400 mL＝2 份。\u003cspan class=\"vn\" lang=\"vi\">240 mg natri; một chai 400 mL = 2 phần.\u003c/span>","c":"#2D2A6E"},{"h":"B：每 100 mL\u003cspan class=\"vn\" lang=\"vi\">B: mỗi 100 mL\u003c/span>","p":"鈉 100 mg；先不要只比 240 和 100。\u003cspan class=\"vn\" lang=\"vi\">100 mg natri; đừng chỉ so 240 và 100.\u003c/span>","c":"#2FA36B"},{"h":"換成每 100 mL\u003cspan class=\"vn\" lang=\"vi\">Đổi về mỗi 100 mL\u003c/span>","p":"A：120 mg；B：100 mg。A 整瓶：480 mg。\u003cspan class=\"vn\" lang=\"vi\">A: 120 mg; B: 100 mg. Cả chai A: 480 mg.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"本頁僅為同一組假設標示摘錄，不是完整商品標籤。台灣一般需標示營養的包裝食品，常列熱量、蛋白質、脂肪、飽和脂肪、反式脂肪、碳水化合物、糖及鈉，另有特殊規定與豁免。\u003cspan class=\"vn\" lang=\"vi\">Đây chỉ là trích nhãn giả định, không phải nhãn đầy đủ. Thực phẩm đóng gói thông thường phải ghi dinh dưỡng ở Đài Loan thường có năng lượng, protein, chất béo, chất béo no, trans, carbohydrate, đường và natri; có quy định đặc biệt và miễn trừ.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://foodlabel.fda.gov.tw/FdaFrontEndApp/Law/Edit?SystemId=f27b8c5e-35c2-4a86-9b8b-d7cbbef409ab\" target=\"_blank\" rel=\"noopener\">台灣標示範圍 / Phạm vi nhãn Đài Loan: TFDA ↗\u003c/a>\u003c/p>"},{"type":"note","title":"","text":"「較低」不等於已符合法規的「低鈉」；高／低宣稱要看地區、營養素與食品條件。每日參考值百分比不是個人的實際吸收率，也沒有適用所有宣稱的單一百分比門檻。\u003cspan class=\"vn\" lang=\"vi\">Thấp hơn không có nghĩa đạt công bố ít natri; công bố cao/thấp tùy nơi, chất và thực phẩm. Phần trăm giá trị tham khảo hằng ngày không phải tỷ lệ hấp thu cá nhân hay một ngưỡng cho mọi công bố.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/TC/newsContent.aspx?cid=4&id=t622488\" target=\"_blank\" rel=\"noopener\">宣稱條件 / Điều kiện công bố: TFDA 2024 公告 ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 3｜一份、一瓶與每 100 mL\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 3: Một phần, một chai và mỗi 100 mL\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"label\">\u003cp class=\"activity-time\">2–3 分鐘 / 2–3 phút\u003c/p>\u003cp class=\"activity-prompt\">假設湯品標示：A 每份 200 mL、鈉 240 mg，一瓶 400 mL；B 每 100 mL、鈉 100 mg。每 100 mL 哪個較低？整瓶 A 有多少鈉？\u003cspan class=\"vn\" lang=\"vi\">Nhãn canh giả định: A mỗi phần 200 mL có 240 mg natri, một chai 400 mL; B mỗi 100 mL có 100 mg natri. Loại nào thấp hơn trên 100 mL? Cả chai A có bao nhiêu natri?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>換成每 100 mL，A 是＿＿mg、B 是＿＿mg；整瓶 A 是＿＿mg。\u003cspan class=\"vn\" lang=\"vi\">Đổi về mỗi 100 mL, A là ___ mg, B là ___ mg; cả chai A là ___ mg.\u003c/span>\u003c/div>\u003clabel for=\"a2-w6-label\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w6-label\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>A 是 120 mg/100 mL，B 是 100 mg/100 mL，所以 B 較低。整瓶 A＝2 份，鈉共 480 mg。\u003cspan class=\"vn\" lang=\"vi\">A là 120 mg/100 mL, B là 100 mg/100 mL nên B thấp hơn. Cả chai A = 2 phần, tổng 480 mg natri.\u003c/span>\u003c/p>\u003cp>數字是同一組假設標示摘錄，不是完整商品標籤，也不代表已符合「低鈉」宣稱條件。\u003cspan class=\"vn\" lang=\"vi\">Đây là cùng bộ số liệu nhãn giả định, không phải nhãn sản phẩm đầy đủ và không chứng minh đủ điều kiện công bố \"ít natri\".\u003c/span>\u003c/p>\u003c/details>\u003c/div>"}]},{"id":"sum","nav":"重點 Điểm chính","kicker":"今天的重點 · Điểm chính hôm nay","h2":"今天的重點","lead":"Điểm chính hôm nay","blocks":[{"type":"cards","title":"回顧\u003cspan class=\"vn\" lang=\"vi\">Ôn tập\u003c/span>","cols":2,"items":[{"h":"溶解性、安定性與利用率，是不同問題\u003cspan class=\"vn\" lang=\"vi\">Độ tan, độ bền và sinh khả dụng là các câu hỏi khác nhau\u003c/span>"},{"h":"算保留量，要看同批原料的營養總量\u003cspan class=\"vn\" lang=\"vi\">Tính giữ lại cần tổng lượng dinh dưỡng của cùng mẻ nguyên liệu\u003c/span>"},{"h":"菜＋湯能取回溶出部分，不讓已分解的恢復\u003cspan class=\"vn\" lang=\"vi\">Rau + canh lấy phần hòa ra, không phục hồi phần phân hủy\u003c/span>"},{"h":"看標示先統一基準，再乘實際吃的份數\u003cspan class=\"vn\" lang=\"vi\">Đọc nhãn: cùng cơ sở trước, rồi nhân số phần thực ăn\u003c/span>"}]},{"type":"note","title":"","text":"回家：找一種食品的營養標示，寫「每份多少、共有幾份、實際吃多少」。若比較產品，先換成相同基準。\u003cspan class=\"vn\" lang=\"vi\">Về nhà: tìm nhãn một thực phẩm, ghi mỗi phần bao nhiêu, có mấy phần và thực ăn bao nhiêu. So sản phẩm cần đổi về cùng cơ sở.\u003c/span>"}]},{"id":"quiz","nav":"練習 Luyện tập","kicker":"練習 · Luyện tập","h2":"課後練習 10 題","lead":"先看原因，再練習說一句中文；可重做。Đọc giải thích rồi tập nói một câu tiếng Trung; có thể làm lại.","blocks":[{"type":"quiz","items":[{"q":"「sắt (Fe)」是哪個中文？\u003cspan class=\"vn\" lang=\"vi\">\"sắt (Fe)\" là từ tiếng Trung nào?\u003c/span>","o":["鈣 gài","鐵 tiě","碘 diǎn","鈉 nà"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 鐵是礦物質；維生素 C 是維生素。礦物質可轉移到烹調水中，不等於元素被一般加熱分解掉。\u003cspan class=\"vn\" lang=\"vi\">Sắt là chất khoáng, vitamin C là vitamin. Khoáng có thể chuyển vào nước nấu, không phải nguyên tố bị nhiệt nấu thông thường phân hủy.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：鐵是礦物質。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Sắt là chất khoáng.\u003c/span>\u003c/div>"},{"q":"營養素被吸收並可供身體利用的程度，較接近哪個詞？\u003cspan class=\"vn\" lang=\"vi\">Mức chất được hấp thu và cơ thể sử dụng gần với từ nào?\u003c/span>","o":["生物利用率 Sinh khả dụng","營養標示 Nhãn dinh dưỡng","食品強化 Tăng cường vi chất","脂溶性 Tan trong chất béo"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 食品含量、吃進去的量與身體可利用量不同。營養素形式、整餐與個人狀態都可能影響，不能把標示數字直接當成吸收量。\u003cspan class=\"vn\" lang=\"vi\">Hàm lượng, lượng ăn và lượng dùng được khác nhau. Dạng chất, bữa ăn và cá nhân đều ảnh hưởng; số trên nhãn không trực tiếp là lượng hấp thu.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：吃進去多少，不等於吸收多少。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Ăn vào bao nhiêu không bằng hấp thu bấy nhiêu.\u003c/span>\u003c/div>"},{"q":"「yèsuān」是哪個詞？\u003cspan class=\"vn\" lang=\"vi\">\"yèsuān\" là từ nào?\u003c/span>","o":["葉子 Lá cây","醋酸 Axit axetic","葉酸 Folate / axit folic","乳酸 Axit lactic"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 葉酸屬 B 群水溶性維生素，與細胞分裂等功能有關；不同形式與加工條件的安定性並不完全相同。\u003cspan class=\"vn\" lang=\"vi\">Folate thuộc vitamin B tan trong nước, liên quan phân chia tế bào; độ bền khác theo dạng và điều kiện chế biến.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：葉酸是水溶性維生素。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Folate là vitamin tan trong nước.\u003c/span>\u003c/div>"},{"q":"哪一組都是脂溶性維生素？\u003cspan class=\"vn\" lang=\"vi\">Nhóm nào đều tan trong chất béo?\u003c/span>","o":["A、D、E、K","B1、B2、C","B12、C、葉酸","C、B6、B2"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> A、D、E、K 是脂溶性；B 群與 C 是水溶性。分類不能直接保證哪一種最耐熱或過量一定安全。\u003cspan class=\"vn\" lang=\"vi\">A, D, E, K tan trong chất béo; B và C tan trong nước. Phân loại không tự xác định loại bền nhiệt nhất hay dư luôn an toàn.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：A、D、E、K 是脂溶性。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: A, D, E, K tan trong chất béo.\u003c/span>\u003c/div>"},{"q":"維生素 C 常可促進哪種鐵的吸收？\u003cspan class=\"vn\" lang=\"vi\">Vitamin C thường có thể tăng hấp thu dạng sắt nào?\u003c/span>","o":["所有鐵都固定提高同樣倍數 Mọi sắt đều tăng cùng số lần","非血基質鐵 Sắt không heme","只提高鈉的吸收 Chỉ tăng hấp thu natri","把鐵變成維生素 Đổi sắt thành vitamin"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> C 可促進非血基質鐵吸收，但沒有適用所有餐食與人的固定倍數。肉也含非血基質鐵，不只植物食品才有。\u003cspan class=\"vn\" lang=\"vi\">C có thể tăng hấp thu sắt không heme, không có hệ số chung cho mọi bữa và người. Thịt cũng có sắt không heme, không chỉ thực vật.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：維生素 C 可幫助非血基質鐵吸收。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Vitamin C có thể giúp hấp thu sắt không heme.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://ods.od.nih.gov/factsheets/Iron-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">非血基質鐵 / Sắt không heme: NIH ODS ↗\u003c/a>\u003c/p>"},{"q":"假設：原菜 C 共 100 mg；煮後菜裡 60 mg、湯裡 20 mg。菜和湯全吃完，共多少？\u003cspan class=\"vn\" lang=\"vi\">Giả định: ban đầu 100 mg C; sau nấu rau 60 mg, canh 20 mg. Ăn hết cả hai có bao nhiêu?\u003c/span>","o":["80 mg","100 mg","60 mg","20 mg"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 60＋20＝80 mg，在此假設中保留 80%。湯中的量是轉移的部分，不會讓已分解的恢復；這也不能代表其他營養素的保留率。\u003cspan class=\"vn\" lang=\"vi\">60 + 20 = 80 mg, giữ lại 80% trong giả định. Phần trong canh là phần chuyển sang, không phục hồi phần phân hủy; cũng không đại diện tỷ lệ giữ các chất khác.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：菜加湯共 80 mg，不是 100 mg。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Rau và canh tổng 80 mg, không phải 100 mg.\u003c/span>\u003c/div>"},{"q":"假設 A 每 200 mL 鈉 240 mg，B 每 100 mL 鈉 100 mg；比較每 100 mL，哪個較低？\u003cspan class=\"vn\" lang=\"vi\">Giả định A 240 mg natri/200 mL, B 100 mg/100 mL; so trên 100 mL, loại nào thấp hơn?\u003c/span>","o":["A","兩者一定一樣 Chắc bằng nhau","不能做任何換算 Không thể đổi đơn vị","B"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> A 換算為 120 mg/100 mL，B 為 100 mg/100 mL，所以 B 較低。較低不等於已符合法規低鈉宣稱，這是教學假設資料。\u003cspan class=\"vn\" lang=\"vi\">A = 120 mg/100 mL, B = 100 mg/100 mL nên B thấp hơn. Thấp hơn không có nghĩa đạt công bố ít natri; số liệu giả định học tập.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：先換成同一個基準，再比較。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Đổi về cùng cơ sở rồi so.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/TC/newsContent.aspx?cid=4&id=t622488\" target=\"_blank\" rel=\"noopener\">台灣宣稱條件 / Điều kiện công bố Đài Loan: TFDA ↗\u003c/a>\u003c/p>"},{"q":"標示「無添加糖」，就一定沒有糖嗎？\u003cspan class=\"vn\" lang=\"vi\">Ghi không thêm đường, có chắc không có đường?\u003c/span>","o":["一定沒有 Chắc không có","不一定，原料本身仍可能含糖 Không chắc, nguyên liệu có thể vốn có đường","一定沒有熱量 Chắc không có năng lượng","可以不看營養標示 Không cần đọc nhãn"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 添加與含量是不同問題；例如原料本身可帶入糖。仍需看標示數字，宣稱也須符合適用規範。\u003cspan class=\"vn\" lang=\"vi\">Thêm và hàm lượng là hai việc khác; nguyên liệu có thể mang đường vào. Cần xem số trên nhãn và điều kiện công bố áp dụng.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：無添加糖，不等於沒有糖。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Không thêm đường không bằng không có đường.\u003c/span>\u003c/div>"},{"q":"關於食品強化，哪句較正確？\u003cspan class=\"vn\" lang=\"vi\">Câu nào đúng hơn về tăng cường vi chất?\u003c/span>","o":["只要強化，就能取代所有醫療 Tăng cường thay được mọi điều trị","所有魚露都一定加鐵 Mọi nước mắm chắc đều thêm sắt","只可加入原本完全沒有的營養素 Chỉ thêm chất hoàn toàn chưa có","刻意增加微量營養素，需看產品與實際含量 Chủ động tăng vi chất, xem sản phẩm và lượng thực"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 強化可增加原有或原本沒有的微量營養素。B12 強化食品是例子；魚露加鐵研究不等於每瓶魚露都已強化。\u003cspan class=\"vn\" lang=\"vi\">Tăng cường có thể tăng vi chất vốn có hoặc chưa có. Thực phẩm tăng cường B12 là ví dụ; nghiên cứu nước mắm sắt không có nghĩa mọi chai đã tăng cường.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：強化食品要看實際標示與含量。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Thực phẩm tăng cường cần xem nhãn và hàm lượng thực.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.who.int/health-topics/food-fortification\" target=\"_blank\" rel=\"noopener\">食品強化定義 / Định nghĩa tăng cường: WHO ↗\u003c/a>\u003c/p>"},{"q":"假設湯 A 每份 200 mL 含鈉 240 mg，一瓶 400 mL。整瓶喝完是多少？\u003cspan class=\"vn\" lang=\"vi\">Canh A giả định 240 mg natri mỗi phần 200 mL, chai 400 mL. Uống hết chai là bao nhiêu?\u003c/span>","o":["120 mg","240 mg","480 mg","100 mg"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 400÷200＝2 份，2×240＝480 mg。每份的數字不能直接當整瓶；此為本課假設湯品資料，不是實際商品。\u003cspan class=\"vn\" lang=\"vi\">400 ÷ 200 = 2 phần, 2 × 240 = 480 mg. Số mỗi phần không trực tiếp là cả chai; đây là số giả định trong bài, không phải sản phẩm thật.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：一瓶兩份，鈉量要乘二。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Một chai hai phần, natri nhân hai.\u003c/span>\u003c/div>"}]}]}],"a2":true,"track":{"url":"https://qmldcjkllisvfgegkfsz.supabase.co","key":"sb_publishable_xprm7A1B-hQhAMBIMaWOWw_w617svI1"}};</script>
<script>
/*
 * runtime.client.js — 跑在瀏覽器裡的渲染器（17 週共用，逐字內嵌進每份 HTML）
 * 讀 window.__LESSON__ 的資料，把 modules / blocks 畫出來。
 * 互動行為（翻卡、展開、配對、測驗）沿用週1 手寫版的做法，不要另創一套。
 */
(function () {
  var D = window.__LESSON__;
  var SERIES = D.series;
  var $ = function (s) { return document.querySelector(s); };
  // 國合班 A2 版（D.a2）：介面文字加越南文；一般班 U() 只回中文，畫面與原本完全相同
  var A2 = !!D.a2;
  function U(zh, vn) { return A2 ? zh + " " + vn : zh; }

  /* ---------- 學習歷程記錄（Supabase） ----------
     只在 lesson.js 注入 D.track = {url, key} 的週次啟用（lib/tracking.json 的 weeks）；
     其他週 TRACK.on 為 false，send() 是空函式，教材行為完全不變。
     只送「學號代碼」與互動事件，不送姓名。送失敗就丟掉，不重試、不阻擋教材。 */
  var CTX = { mod: null, bi: 0 };   // 目前正在渲染的模組 id 與區塊序號（render 是同步的）
  var TRACK = (function () {
    var cfg = D.track;
    var noop = function () {};
    if (!cfg || !cfg.url || !cfg.key) return { on: false, send: noop, flush: noop, code: function () { return ""; }, setCode: noop };
    var KEY = "ifs_code", DKEY = "ifs_device";
    var rnd = function () { return Math.random().toString(36).slice(2, 10); };
    var sid = rnd() + Date.now().toString(36);
    // device_id：同一支手機／瀏覽器跨次開頁不變。學生後來才填學號代碼時，先前的 anon 事件可靠它回接。
    var did = "";
    try { did = localStorage.getItem(DKEY) || ""; if (!did) { did = "d" + rnd() + rnd(); localStorage.setItem(DKEY, did); } } catch (e) { did = "d" + rnd(); }
    var q = [], timer = null;
    function code() { try { return (localStorage.getItem(KEY) || "").trim(); } catch (e) { return ""; } }
    function setCode(v) { try { localStorage.setItem(KEY, (v || "").trim().slice(0, 20)); } catch (e) {} }
    function cut(s, n) { return s == null ? null : String(s).slice(0, n); }
    // 欄位長度與 payload 大小在前端先截到資料表 CHECK 的上限：PostgREST 批次 INSERT 是原子的，
    // 一筆違反 CHECK 整批都會被拒，而我們失敗即丟，會靜默掉整個 4 秒窗口。
    function send(event, mod, block, payload) {
      var p = payload || {};
      var ps = JSON.stringify(p);
      if (ps.length > 1800) p = { trunc: true, keys: Object.keys(p).slice(0, 10) };
      q.push({
        student_code: cut(code(), 20) || "anon", device_id: cut(did, 40), week: D.week || 0,
        module_id: cut(mod, 30), block_type: cut(block, 10), event: cut(event, 30),
        payload: p, session_id: cut(sid, 40), build: cut(D.build, 16), client_ts: new Date().toISOString(),
        cls: A2 ? "a2" : undefined,   // 國合班與一般班同週分開；一般班不送這欄（JSON 會略過 undefined）
      });
      if (q.length >= 40) flush();
      else if (!timer) timer = setTimeout(flush, 4000);
    }
    function flush() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!q.length) return;
      var body = JSON.stringify(q.splice(0, 50));
      try {
        fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/ifs_lesson_events", {
          method: "POST", keepalive: true, body: body,
          headers: { "Content-Type": "application/json", "apikey": cfg.key, "Prefer": "return=minimal" },
        }).catch(noop);
      } catch (e) { /* 舊瀏覽器沒有 fetch：不記錄 */ }
      if (q.length) timer = setTimeout(flush, 1000);
    }
    window.addEventListener("pagehide", flush);
    return { on: true, send: send, flush: flush, code: code, setCode: setCode };
  })();

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function colorAt(given, i) { return given || SERIES[i % SERIES.length]; }
  function gridCls(n) { return "grid g" + (n === 2 || n === 3 || n === 4 ? n : 3); }
  function listHtml(v) {
    // body 可以是字串或字串陣列；陣列渲染成 <ul>
    if (v == null) return "";
    if (typeof v === "string") return '<p>' + v + '</p>';
    return '<ul>' + v.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
  }

  /* ---------- 區塊標題 ---------- */
  function heading(frag, b) {
    if (b.title) frag.appendChild(el("div", "sec-title", '<span class="bar"></span>' + b.title));
    if (b.hint) frag.appendChild(el("div", "hint", b.hint));
  }

  /* ---------- 各區塊 ---------- */
  var BLOCKS = {};

  BLOCKS.flips = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (d, i) {
      var c = colorAt(d.c, i);
      var card = el("div", "flip");
      if (b.h) card.style.height = b.h + "px";
      card.innerHTML =
        '<div class="flip-in">' +
        '<div class="face front"><div class="cbar" style="background:' + c + '"></div>' +
        '<div class="t">' + d.t + '</div><div class="en">' + (d.en || "") + '</div>' +
        '<div class="tap">▸ ' + U("點我看解釋", "Chạm để xem") + '</div></div>' +
        '<div class="face back"><div class="cbar" style="background:' + c + '"></div>' +
        '<p>' + d.b + '</p></div></div>';
      var mod = CTX.mod, bi = CTX.bi;
      card.onclick = function () {
        if (card.classList.toggle("on")) TRACK.send("flip_open", mod, "flips", { b: bi, i: i, t: d.t });
      };
      g.appendChild(card);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.exp = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div");
    b.items.forEach(function (t, i) {
      var box = el("div", "exp");
      var res = t.res ? '<div style="margin-top:10px;font-size:13px;color:var(--secondary);font-weight:700">🔗 ' + t.res + '</div>' : "";
      box.innerHTML =
        '<button><span class="num">' + (i + 1) + '</span><span>' + t.h + '</span>' +
        '<span class="tag">' + (t.tag || "") + '</span><span class="chev">›</span></button>' +
        '<div class="body">' + listHtml(t.body) + res + '</div>';
      var body = box.querySelector(".body");
      var mod = CTX.mod, bi = CTX.bi;
      box.querySelector("button").onclick = function () {
        var on = box.classList.toggle("on");
        if (!on) { body.style.maxHeight = "0px"; return; }
        TRACK.send("exp_open", mod, "exp", { b: bi, i: i, h: t.h });
        // 用實際內容高度展開，避免長段落被固定 max-height 截掉。
        // 必須先解除 max-height 再量：在 max-height:0 的狀態下量 scrollHeight 會得到 0，
        // 面板就只會開一條縫（實測過）。量完歸零並強制重排，transition 才有起點。
        body.style.maxHeight = "none";
        var h = body.scrollHeight;
        body.style.maxHeight = "0px";
        void body.offsetHeight;
        body.style.maxHeight = h + "px";
      };
      host.appendChild(box);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.cards = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var box = el("div", "card");
      box.style.borderTop = "4px solid " + accent;
      box.innerHTML = '<div class="h">' + c.h + '</div>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        (c.li ? '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>' : "") +
        (c.p ? '<p style="margin-top:8px;font-size:15.5px;color:var(--mid)">' + c.p + '</p>' : "");
      g.appendChild(box);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.timeline = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "tl");
    b.steps.forEach(function (s, i) {
      var st = el("div", "step");
      st.innerHTML = '<div class="dot" style="background:' + colorAt(s.c, i) + '">' + (i + 1) + '</div>' +
        '<h4>' + s.h + '</h4><p>' + s.p + '</p>';
      host.appendChild(st);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.compare = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "cmp");
    [b.left, b.right].forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var col = el("div", "col");
      col.innerHTML = '<div class="cbar" style="background:' + accent + '"></div>' +
        '<h4 style="color:' + accent + '">' + c.h + '</h4>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
      wrap.appendChild(col);
    });
    f.appendChild(wrap);
    if (b.note) f.appendChild(el("div", "cmp-note", b.note));
    return f;
  };

  BLOCKS.table = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "tblwrap");
    var html = '<table class="tbl"><thead><tr>' +
      b.head.map(function (h) { return '<th>' + h + '</th>'; }).join("") + '</tr></thead><tbody>' +
      b.rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join("") + '</tr>';
      }).join("") + '</tbody></table>';
    wrap.innerHTML = html;
    f.appendChild(wrap); return f;
  };

  BLOCKS.note = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    f.appendChild(el("div", "note" + (b.kind ? " " + b.kind : ""), b.text));
    return f;
  };

  BLOCKS.match = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "match-wrap");
    var pool = el("div", "pool"), targets = el("div", "targets");
    var pairs = b.pairs;
    var order = pairs.slice().sort(function () { return Math.random() - 0.5; });
    var selected = null, solved = 0, errors = 0, t0 = null;
    var mod = CTX.mod, bi = CTX.bi;
    var msg = el("div");
    msg.style.cssText = "margin-top:14px;font-weight:700;color:var(--green)";

    function tryMatch(slot, key) {
      if (slot.classList.contains("ok")) return;
      if (t0 === null) t0 = Date.now();
      if (slot.dataset.k === key) {
        slot.classList.add("ok"); slot.classList.remove("bad");
        slot.querySelector(".drop").textContent = key;
        var chip = pool.querySelector('.chip[data-k="' + key + '"]');
        chip.classList.add("used"); chip.classList.remove("sel");
        selected = null; solved++;
        TRACK.send("match_ok", mod, "match", { b: bi, label: key });
        if (solved === pairs.length) {
          msg.textContent = b.done || U("✓ 全部答對！", "Đúng hết!");
          TRACK.send("match_done", mod, "match", { b: bi, n: pairs.length, errors: errors, ms: Date.now() - t0 });
        }
      } else {
        errors++;
        TRACK.send("match_bad", mod, "match", { b: bi, label: key, slot: slot.dataset.k });
        slot.classList.add("bad");
        setTimeout(function () { slot.classList.remove("bad"); }, 350);
      }
    }
    order.forEach(function (q) {
      var c = el("div", "chip"); c.textContent = q.label; c.draggable = true; c.dataset.k = q.label;
      c.addEventListener("dragstart", function (e) { e.dataTransfer.setData("k", q.label); });
      c.onclick = function () {
        if (c.classList.contains("used")) return;
        if (selected === c) { c.classList.remove("sel"); selected = null; return; }
        pool.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("sel"); });
        c.classList.add("sel"); selected = c;
      };
      pool.appendChild(c);
    });
    pairs.forEach(function (q) {
      var s = el("div", "slot"); s.dataset.k = q.label;
      s.innerHTML = '<div class="drop">' + U("拖到這裡", "Kéo vào đây") + '</div><div class="desc">' + q.desc + '</div>';
      s.addEventListener("dragover", function (e) { e.preventDefault(); });
      s.addEventListener("drop", function (e) { e.preventDefault(); tryMatch(s, e.dataTransfer.getData("k")); });
      s.onclick = function () { if (selected) tryMatch(s, selected.dataset.k); };
      targets.appendChild(s);
    });
    host.appendChild(pool); host.appendChild(targets); host.appendChild(msg);
    f.appendChild(host); return f;
  };

  /* 結果代碼：把作答結果編成一串可貼給老師的代碼（FSQ1.<base64>.<檢查碼>）。
     解碼與彙整用專案根目錄的「食品科學概論_測驗成績解碼器.html」。 */
  function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
  function checksum(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1679616; // 36^4
    return h.toString(36);
  }

  BLOCKS.quiz = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var items = b.items, n = items.length;
    var head = el("div", "quiz-head");
    head.innerHTML =
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
      '<input class="qid" placeholder="' + U("學號（交成績必填）", "Mã số SV") + '" style="flex:1;min-width:130px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px">' +
      '<input class="qname" placeholder="' + U("姓名", "Họ tên") + '" style="flex:1;min-width:100px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px"></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
      '<strong class="qprog">' + U("進度", "Tiến độ") + ' 0 / ' + n + '</strong>' +
      '<span class="qscore" style="color:var(--secondary);font-weight:800">' + U("得分", "Điểm") + ' 0</span></div>' +
      '<div class="pbar"><div class="pfill"></div></div>';
    var box = el("div");
    var sb = el("div", "scorebox");
    sb.innerHTML = '<div>' + U("你的成績", "Điểm của bạn") + '</div><div class="big"><span class="fscore">0</span> / ' + n + '</div>' +
      '<div class="smsg" style="margin:8px 0 16px"></div>' +
      '<div class="rcwrap" style="margin:0 auto 16px;max-width:560px;text-align:left">' +
      '<div style="font-weight:700;margin-bottom:6px">' + U("結果代碼（請複製後，貼到老師指定的表單或訊息）", "— Mã kết quả: sao chép và gửi cho thầy/cô") + '</div>' +
      '<textarea class="rcode" readonly rows="3" style="width:100%;box-sizing:border-box;font-family:monospace;font-size:12px;padding:8px;border:1.5px solid var(--line,#ccc);border-radius:8px;resize:none"></textarea>' +
      '<div class="rmsg" style="font-size:13px;color:#B34700;margin-top:4px"></div>' +
      '<button class="btn copyrc" style="margin-top:8px">📋 ' + U("複製結果代碼", "Sao chép mã") + '</button></div>' +
      '<button class="btn ghost">' + U("重新測驗", "Làm lại") + '</button>';

    var answered = 0, score = 0, picks = [], qt0 = null, attempt = 0;
    var mod = CTX.mod, bi = CTX.bi;
    // 測驗的學號欄與頁首的學號代碼同步（兩邊填任一邊都行）
    var qidInput = head.querySelector(".qid");
    if (TRACK.on) {
      if (TRACK.code()) qidInput.value = TRACK.code();
      qidInput.addEventListener("change", function () {
        TRACK.setCode(qidInput.value);
        var top = $("#ifs-code"); if (top) top.value = TRACK.code();
      });
    }
    function updateProg() {
      head.querySelector(".qprog").textContent = U("進度", "Tiến độ") + " " + answered + " / " + n;
      head.querySelector(".qscore").textContent = U("得分", "Điểm") + " " + score;
      head.querySelector(".pfill").style.width = (answered / n * 100) + "%";
    }
    function finish() {
      sb.querySelector(".fscore").textContent = score;
      var pct = score / n, m;
      if (score === n) m = U("這 10 題全對！再用青菜湯說明含量、保留量與份量。", "Đúng cả 10 câu! Hãy dùng canh rau giải thích hàm lượng, lượng giữ lại và khẩu phần.");
      else if (pct >= 0.8) m = U("很棒！觀念相當扎實。", "Rất tốt!");
      else if (pct >= 0.6) m = U("不錯，再複習幾個弱點就更好。", "Khá tốt, ôn lại vài chỗ nữa nhé.");
      else m = U("建議回到前面單元再看一次翻卡與展開內容。", "Hãy xem lại các phần phía trước.");
      sb.querySelector(".smsg").textContent = m;

      var sid = head.querySelector(".qid").value.trim();
      var sname = head.querySelector(".qname").value.trim();
      var korr = items.map(function (item, i) { return picks[i] === item.a ? 1 : 0; }).join("");
      var payload = JSON.stringify({
        w: D.week || 0, c: A2 ? "a2" : undefined, id: sid, nm: sname, s: score, n: n,
        a: picks, k: korr, t: new Date().toISOString().slice(0, 16),
      });
      var body = b64utf8(payload);
      var code = "FSQ1." + body + "." + checksum(body);
      sb.querySelector(".rcode").value = code;
      sb.querySelector(".rmsg").textContent = sid ? "" : U("⚠ 尚未填學號 —— 請回到測驗上方填入學號後重新測驗，否則老師無法登記成績。", "Chưa nhập mã số SV: hãy nhập ở trên rồi làm lại.");
      TRACK.send("quiz_done", mod, "quiz", { b: bi, attempt: attempt, score: score, n: n, picks: picks, ms: qt0 ? Date.now() - qt0 : null });
      TRACK.flush();

      sb.classList.add("show");
      sb.scrollIntoView({ behavior: "smooth" });
    }
    function pick(qel, item, oi) {
      if (qel.dataset.done === "1") return;
      qel.dataset.done = "1"; answered++;
      if (qt0 === null) qt0 = Date.now();
      picks[parseInt(qel.dataset.qi, 10)] = oi;
      TRACK.send("quiz_answer", mod, "quiz", { b: bi, attempt: attempt, qi: parseInt(qel.dataset.qi, 10), pick: oi, ok: oi === item.a });
      qel.querySelectorAll(".opt").forEach(function (btn, i) {
        btn.classList.add("dim");
        if (i === item.a) btn.classList.add("correct");
        if (i === oi && oi !== item.a) btn.classList.add("wrong");
      });
      var fb = qel.querySelector(".fb");
      if (oi === item.a) { score++; fb.classList.add("good"); fb.innerHTML = U("✓ 正確！", "Đúng!") + item.e; }
      else { fb.classList.add("no"); fb.innerHTML = U("✗ 正解：", "Sai. Đáp án:") + item.o[item.a] + "。" + item.e; }
      fb.classList.add("show"); updateProg();
      if (answered === n) finish();
    }
    function build() {
      box.innerHTML = ""; answered = 0; score = 0; picks = []; qt0 = null; attempt++; updateProg();
      sb.classList.remove("show");
      items.forEach(function (item, qi) {
        var qel = el("div", "q"); qel.dataset.done = "0"; qel.dataset.qi = qi;
        qel.innerHTML = '<div class="qn">第 ' + (qi + 1) + ' 題' + (A2 ? ' · Câu ' + (qi + 1) : '') + '</div><div class="qt">' + item.q + '</div>';
        item.o.forEach(function (opt, oi) {
          var btn = el("button", "opt"); btn.textContent = opt;
          btn.onclick = function () { pick(qel, item, oi); };
          qel.appendChild(btn);
        });
        qel.appendChild(el("div", "fb"));
        box.appendChild(qel);
      });
    }
    sb.querySelector(".copyrc").onclick = function () {
      var ta = sb.querySelector(".rcode");
      ta.select(); ta.setSelectionRange(0, 99999);
      var btn = this;
      function ok() { btn.textContent = U("✓ 已複製，請貼給老師", "Đã sao chép"); setTimeout(function () { btn.textContent = "📋 " + U("複製結果代碼", "Sao chép mã"); }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(ta.value).then(ok, function () { document.execCommand("copy"); ok(); });
      else { document.execCommand("copy"); ok(); }
    };
    sb.querySelector(".ghost").onclick = function () {
      build(); window.scrollTo({ top: 0, behavior: "smooth" });
    };
    build();
    f.appendChild(head); f.appendChild(box); f.appendChild(sb);
    return f;
  };

  /* ---------- 組裝 ---------- */
  var nav = $("#nav"), main = $("#main");
  var curMod = D.modules.length ? D.modules[0].id : null, modT0 = Date.now();
  function switchMod(id, btn) {
    document.querySelectorAll(".module").forEach(function (m) { m.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
    nav.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
    btn.classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (id !== curMod) {
      TRACK.send("module_view", id, null, { from: curMod, ms: Date.now() - modT0 });
      curMod = id; modT0 = Date.now();
    }
  }
  D.modules.forEach(function (m, i) {
    var btn = el("button", i === 0 ? "active" : "", m.nav);
    btn.onclick = function () { switchMod(m.id, btn); };
    nav.appendChild(btn);

    var sec = el("section", "module" + (i === 0 ? " active" : ""));
    sec.id = m.id;
    sec.appendChild(el("div", "lead",
      '<div class="kicker">' + m.kicker + '</div><h2>' + m.h2 + '</h2><p>' + m.lead + '</p>'));
    m.blocks.forEach(function (b, bi) {
      var render = BLOCKS[b.type];
      if (!render) { console.error("未知區塊型別:", b.type); return; }
      CTX.mod = m.id; CTX.bi = bi;
      sec.appendChild(render(b));
    });
    main.appendChild(sec);
  });

  /* ---------- 學號代碼列（只在啟用記錄的週出現） ---------- */
  if (TRACK.on) {
    var bar = el("div", "codebar");
    bar.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;font-size:14px";
    bar.innerHTML = '<label for="ifs-code" style="font-weight:700">' + U("學號代碼", "Mã số SV") + '</label>' +
      '<input id="ifs-code" maxlength="20" placeholder="' + U("例：S001", "VD: S001") + '" style="width:120px;padding:6px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:14px">' +
      '<span style="opacity:.75">' + U("只記錄你的學習歷程（翻卡、配對、測驗），不需要姓名。", "Chỉ ghi lại quá trình học (lật thẻ, ghép cặp, kiểm tra), không cần tên.") + '</span>';
    nav.parentNode.insertBefore(bar, nav);
    var inp = bar.querySelector("#ifs-code");
    inp.value = TRACK.code();
    inp.addEventListener("change", function () {
      TRACK.setCode(inp.value);
      document.querySelectorAll(".qid").forEach(function (x) { x.value = TRACK.code(); });
      TRACK.send("code_set", null, null, {});
    });
    TRACK.send("session_start", curMod, null, {
      device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || "") ? "mobile" : "desktop",
      w: window.innerWidth, build: D.build || null,
    });
    // 停留時間以「頁面可見」為準：切到背景就結算一段 module_leave，回來重新計時。
    // 手機瀏覽器殺分頁常不觸發 pagehide，所以以 visibilitychange→hidden 為主。
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        TRACK.send("module_leave", curMod, null, { ms: Date.now() - modT0 }); TRACK.flush();
      } else {
        modT0 = Date.now();
      }
    });
  }
})();
</script>
</body>
