<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品科學概論 第11週 · 互動教學</title>
<style>
  :root{
    --primary:#2D2A6E; --secondary:#5B4FB8; --accent:#00B8B8; --warm:#F5A623; --green:#2FA36B; --red:#D65B5B; --dark:#1A1A3E; --bg:#F4F5FA; --text:#1F1F2E; --mid:#5A5A75; --muted:#9096ac; --border:#E2E2EC; --card:#fff;
  }
/* 版型樣式 — 逐條取自「第1週_互動教學.html」，末段為新增區塊（cmp / tbl / note）。
   這裡只用 var(--x)；色票由 tokens.js 產生 :root 注入。 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:17px}
header{background:linear-gradient(120deg,var(--dark),var(--primary));color:#fff;
  padding:26px 22px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(0,0,0,.15)}
header h1{font-size:31px;font-weight:800;letter-spacing:.5px}
header .sub{color:#b9c7ff;font-size:16px;margin-top:5px}
nav{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.10);color:#dfe4ff;border:none;padding:12px 18px;
  border-radius:10px 10px 0 0;font-size:16.5px;cursor:pointer;font-weight:600;transition:.15s}
nav button:hover{background:rgba(255,255,255,.2)}
nav button.active{background:var(--bg);color:var(--primary)}
main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
.module{display:none;animation:fade .35s}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead{background:var(--dark);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:22px}
.lead .kicker{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px}
.lead h2{font-size:26px;margin:6px 0 8px}
.lead p{color:#cdd3ee;font-size:16.5px}
.sec-title{font-size:23px;font-weight:800;color:var(--primary);margin:30px 0 6px;
  display:flex;align-items:center;gap:10px}
.sec-title .bar{width:6px;height:25px;background:var(--accent);border-radius:3px;display:inline-block}
.hint{color:var(--mid);font-size:15px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* flip cards */
.flip{perspective:1100px;height:200px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px rgba(30,30,60,.08);border:1px solid var(--border)}
.front{background:var(--card)}
.front .t{font-size:21px;font-weight:800;color:var(--primary)}
.front .en{color:var(--muted);font-size:14px;margin-top:3px;font-style:italic}
.front .tap{margin-top:auto;color:var(--accent);font-size:14px;font-weight:700}
.back{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;transform:rotateY(180deg);overflow:auto}
.back p{font-size:16px}
.cbar{height:6px;border-radius:14px 14px 0 0;position:absolute;top:0;left:0;right:0}

/* expandable */
.exp{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.exp>button{width:100%;text-align:left;background:none;border:none;padding:16px 18px;cursor:pointer;
  display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;color:var(--text)}
.exp .num{background:var(--primary);color:#fff;min-width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.exp .chev{margin-left:auto;color:var(--muted);transition:.25s;font-size:20px}
.exp.on .chev{transform:rotate(90deg);color:var(--accent)}
.exp .body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 18px}
.exp.on .body{padding:0 18px 16px 62px}
.exp .body ul{margin-left:16px;color:var(--mid);font-size:16px}
.exp .body p{color:var(--mid);font-size:15.5px}
.exp .tag{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:8px}

/* info card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.card .h{font-weight:800;color:var(--primary);font-size:18px;margin-bottom:6px}
.card .en{color:var(--muted);font-size:13px;font-style:italic}
.card ul{margin:8px 0 0 18px;font-size:15.5px;color:var(--mid)}

/* timeline */
.tl{display:flex;gap:0;flex-wrap:wrap;counter-reset:s}
.tl .step{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 14px 14px;margin:8px;position:relative}
.tl .dot{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;margin-bottom:8px}
.tl .step h4{color:var(--primary);font-size:17.5px;margin-bottom:4px}
.tl .step p{font-size:15px;color:var(--mid)}

/* matching */
.match-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.pool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--secondary);color:#fff;padding:10px 17px;border-radius:22px;font-weight:700;
  cursor:grab;user-select:none;font-size:16.5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chip.used{opacity:.35;pointer-events:none}
.chip.sel{outline:3px solid var(--warm);outline-offset:2px}
.targets{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;border:2px dashed var(--border);border-radius:12px;padding:10px 14px;background:#fafbff}
.slot .desc{flex:1;font-size:16px;color:var(--text)}
.slot .drop{min-width:130px;min-height:44px;border-radius:8px;background:#eef0f8;display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:15px;padding:8px 12px}
.slot.ok{border-color:var(--green);background:#effaf3}
.slot.ok .drop{background:var(--green);color:#fff;font-weight:700}
.slot.bad{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* quiz */
.quiz-head{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.pbar{height:12px;background:#e7e9f4;border-radius:8px;overflow:hidden;margin-top:10px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--secondary));transition:width .4s}
.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.q .qn{color:var(--accent);font-weight:800;font-size:14px}
.q .qt{font-size:19.5px;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fafbff;border:2px solid var(--border);
  border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;font-size:16.5px;transition:.15s}
.opt:hover{border-color:var(--secondary)}
.opt.correct{border-color:var(--green);background:#effaf3;font-weight:700}
.opt.wrong{border-color:var(--red);background:#fdeeee}
.opt.dim{opacity:.6}
.fb{margin-top:8px;font-size:15.5px;padding:11px 14px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.good{background:#effaf3;color:#1c7a4d} .fb.no{background:#fdeeee;color:#a83b3b}
.scorebox{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:16px;
  padding:26px;text-align:center;margin-top:10px;display:none}
.scorebox.show{display:block}
.scorebox .big{font-size:46px;font-weight:800}
.btn{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:10px;
  font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.18)}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;background:#eef0fb;color:var(--secondary);padding:3px 10px;border-radius:20px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px}

/* ===== 新增區塊 ===== */
/* compare：兩欄對照（梅納 vs 焦糖化、冷藏 vs 冷凍…） */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media(max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 18px 18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06);position:relative;overflow:hidden}
.cmp .col .cbar{position:static;height:6px;margin:0 -18px 14px;border-radius:0}
.cmp .col h4{font-size:20px;font-weight:800;margin-bottom:2px}
.cmp .col .en{color:var(--muted);font-size:13px;font-style:italic;margin-bottom:8px}
.cmp .col ul{margin-left:18px;font-size:15.5px;color:var(--mid)}
.cmp .col li{margin-bottom:5px}
.cmp-note{margin-top:12px;background:#eef0fb;border-left:5px solid var(--secondary);
  border-radius:0 10px 10px 0;padding:12px 16px;font-size:16px;color:var(--primary);font-weight:600}

/* table：資料表（維生素、添加物分類…） */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px}
.tbl th{background:var(--primary);color:#fff;text-align:left;padding:12px 14px;font-weight:700;font-size:15px}
.tbl td{padding:11px 14px;border-top:1px solid var(--border);color:var(--mid);vertical-align:top}
.tbl tr:nth-child(even) td{background:#fafbff}
.tbl td:first-child{color:var(--text);font-weight:700}

/* note：重點提示條 */
.note{background:#fff8e9;border-left:5px solid var(--warm);border-radius:0 12px 12px 0;
  padding:14px 18px;margin:14px 0;font-size:16px;color:var(--text)}
.note b{color:var(--primary)}
.note.key{background:#effaf3;border-left-color:var(--green)}
.note.warn{background:#fdeeee;border-left-color:var(--red)}
/* 國合班 A2 互動練習：拼音與越南文（build_a2.js 產生的內容才會用到） */
.py{display:block;font-size:.78em;font-weight:500;color:var(--mid);margin-top:2px}
.vn{display:block;font-size:.88em;font-weight:500;color:var(--secondary);margin-top:2px}
/* Shared classroom tasks: oral response, sentence support, then sample explanation. */
.class-activity{display:grid;gap:12px;min-width:0}
.class-activity .vn{display:block;color:#0E7C7B;font-size:15px;line-height:1.5;margin-top:4px}
.activity-time{color:#0E7C7B;font-weight:700;font-size:15px}
.activity-prompt{font-size:clamp(18px,2.3vw,23px);line-height:1.5}
.sentence-stem{padding:12px 16px;background:#EFFAF3;border-left:5px solid #2FA36B;color:#1A1A3E;line-height:1.6}
.class-activity label{font-size:14px;color:#52526B}
.activity-response{display:block;width:100%;max-width:100%;min-height:72px;border:1.5px solid #A0A0B5;border-radius:8px;padding:10px 12px;resize:vertical;font:inherit;font-size:17px;background:#fff;color:#1F1F2E}
.activity-answer{border:1px solid #E2E2EC;background:#fff;border-radius:8px;padding:10px 14px;font-size:16px;line-height:1.5}
.activity-answer summary{cursor:pointer;font-weight:700;color:#2D2A6E}
.activity-answer p{margin-top:10px}
.activity-response:focus-visible,.activity-answer summary:focus-visible{outline:3px solid #0E7C7B;outline-offset:3px}
.source-note{font-size:13px;color:#52526B;line-height:1.5;overflow-wrap:anywhere;margin-top:10px}
.source-note .vn{display:block;color:#0E7C7B;font-size:13px}
.lesson-links{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.lesson-links a{color:inherit;text-underline-offset:3px}
.feedback-reason,.feedback-transfer{margin-top:6px}
.feedback-transfer{font-weight:600}
@media(max-width:640px){header{position:relative!important}.class-activity{gap:10px}}
@media print{.activity-response{min-height:64px}}


.back .vn{color:#D7FAF3}.tbl-wrap{overflow-x:auto}
</style>
</head>

<script>window.__LESSON__={"week":11,"series":["#2D2A6E","#2FA36B","#F5A623","#5B4FB8","#00B8B8","#D65B5B"],"modules":[{"id":"m-level","nav":"三個熱處理層級","kicker":"MODULE 1 · 層級","h2":"熱處理目的與完整保存系統","lead":"以罐裝玉米為主線，比較殺菁、巴氏殺菌與商業滅菌；不同食品的時間溫度不可直接互換。","blocks":[{"type":"cards","title":"一罐玉米：四個問題\u003cspan class=\"vn\" lang=\"vi\">Một hộp ngô: bốn câu hỏi\u003c/span>","cols":4,"items":[{"h":"① 控制什麼？\u003cspan class=\"vn\" lang=\"vi\">Kiểm soát gì?\u003c/span>","p":"先看食品酸鹼、水活性與目標微生物。\u003cspan class=\"vn\" lang=\"vi\">Xem pH, aw và vi sinh vật mục tiêu.\u003c/span>","c":"#2D2A6E"},{"h":"② 中心有多熱？\u003cspan class=\"vn\" lang=\"vi\">Bên trong nóng thế nào?\u003c/span>","p":"量測最難充分加熱的位置：冷點。\u003cspan class=\"vn\" lang=\"vi\">Đo vị trí khó gia nhiệt đủ: điểm lạnh.\u003c/span>","c":"#2D2A6E"},{"h":"③ 效果累積多少？\u003cspan class=\"vn\" lang=\"vi\">Hiệu quả tích lũy bao nhiêu?\u003c/span>","p":"用適合的 D、z 和溫度歷程估算。\u003cspan class=\"vn\" lang=\"vi\">Ước tính bằng D, z phù hợp và lịch sử nhiệt.\u003c/span>","c":"#2D2A6E"},{"h":"④ 之後還安全嗎？\u003cspan class=\"vn\" lang=\"vi\">Sau đó còn được bảo vệ?\u003c/span>","p":"確認密封、保存條件和開封說明。\u003cspan class=\"vn\" lang=\"vi\">Kiểm tra độ kín, bảo quản và hướng dẫn sau mở.\u003c/span>","c":"#2D2A6E"}]},{"type":"cards","title":"先看目的，再看條件\u003cspan class=\"vn\" lang=\"vi\">Xem mục đích rồi điều kiện\u003c/span>","cols":3,"items":[{"h":"殺菁\u003cspan class=\"vn\" lang=\"vi\">Chần\u003c/span>","p":"以鈍化酵素、維持品質為主；可減少部分微生物。\u003cspan class=\"vn\" lang=\"vi\">Chủ yếu bất hoạt enzyme, giữ chất lượng; giảm một phần vi sinh vật.\u003c/span>","c":"#2D2A6E"},{"h":"巴氏殺菌\u003cspan class=\"vn\" lang=\"vi\">Thanh trùng\u003c/span>","p":"依食品及目標降低病原等；常須搭配冷藏。\u003cspan class=\"vn\" lang=\"vi\">Giảm mầm bệnh theo thực phẩm và mục tiêu; thường cần giữ lạnh.\u003c/span>","c":"#2D2A6E"},{"h":"商業滅菌\u003cspan class=\"vn\" lang=\"vi\">Tiệt trùng thương mại\u003c/span>","p":"依產品、包裝與保存條件設計；不是絕對無菌。\u003cspan class=\"vn\" lang=\"vi\">Thiết kế theo sản phẩm, bao bì, bảo quản; không là vô trùng tuyệt đối.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"溫度和秒數要對應食品、目標與設備；不能由溫度高低排出所有製程的效果。UHT 搭配適當無菌包裝，可用於常溫保存產品。\u003cspan class=\"vn\" lang=\"vi\">Nhiệt và thời gian phải ứng với thực phẩm, mục tiêu, thiết bị; không xếp mọi hiệu quả chỉ theo nhiệt. UHT cùng bao gói vô trùng phù hợp có thể dùng cho sản phẩm để thường.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-guides/aseptic-processing-and-packaging-food-industry\" target=\"_blank\" rel=\"noopener\">製程與包裝 / Quy trình và bao bì: FDA ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 1｜先選目的\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 1: Chọn mục đích\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"purpose\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">冷凍玉米先殺菁、冷藏乳做巴氏殺菌、常溫玉米罐頭做商業滅菌。它們主要想控制什麼？\u003cspan class=\"vn\" lang=\"vi\">Ngô đông được chần, sữa lạnh được thanh trùng, ngô hộp để thường được tiệt trùng thương mại. Mục đích chính là gì?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>＿＿主要為了＿＿；還要搭配＿＿。\u003cspan class=\"vn\" lang=\"vi\">___ chủ yếu để ___; còn cần ___.\u003c/span>\u003c/div>\u003clabel for=\"general-w11-purpose\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w11-purpose\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>殺菁主要鈍化酵素；巴氏殺菌降低相關病原等；商業滅菌配合密封與保存條件。\u003cspan class=\"vn\" lang=\"vi\">Chần chủ yếu bất hoạt enzyme; thanh trùng giảm mầm bệnh liên quan; tiệt trùng thương mại đi cùng kín và bảo quản.\u003c/span>\u003c/p>\u003cp>不能只按最高溫度排序效果，也不能把殺菁當作常溫罐頭的完整殺菌步驟。\u003cspan class=\"vn\" lang=\"vi\">Không xếp hiệu quả chỉ từ nhiệt cao nhất hay xem chần là đủ cho ngô hộp để thường.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"殺菁與冷凍：各有任務\u003cspan class=\"vn\" lang=\"vi\">Chần và đông lạnh: nhiệm vụ khác nhau\u003c/span>","cols":3,"items":[{"h":"多數冷凍蔬菜\u003cspan class=\"vn\" lang=\"vi\">Nhiều rau đông lạnh\u003c/span>","p":"殺菁可降低酵素活性；是否需要、時間多長依品項。\u003cspan class=\"vn\" lang=\"vi\">Chần giúp giảm enzyme; nhu cầu và thời gian tùy loại.\u003c/span>","c":"#2D2A6E"},{"h":"處理過短或過長\u003cspan class=\"vn\" lang=\"vi\">Quá ngắn hay quá lâu\u003c/span>","p":"不足可能留有活性；過度可能損失質地與部分營養。\u003cspan class=\"vn\" lang=\"vi\">Thiếu có thể còn hoạt tính; quá mức có thể mất kết cấu, vài chất.\u003c/span>","c":"#2D2A6E"},{"h":"冷凍接在後面\u003cspan class=\"vn\" lang=\"vi\">Đông lạnh sau đó\u003c/span>","p":"抑制生長與減慢反應；不能補上不充分的殺菌。\u003cspan class=\"vn\" lang=\"vi\">Hạn chế sinh trưởng, chậm phản ứng; không bù bước diệt khuẩn thiếu.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"殺菁不是所有食品都要做的同一套步驟；時間要看蔬菜、大小與方法。\u003cspan class=\"vn\" lang=\"vi\">Chần không là một bước giống nhau cho mọi thực phẩm; thời gian tùy rau, kích cỡ và cách.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://nchfp.uga.edu/how/freeze/freeze-general-information/blanching-vegetables/\" target=\"_blank\" rel=\"noopener\">殺菁範圍 / Phạm vi chần: UGA NCHFP ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"商業滅菌：看完整系統\u003cspan class=\"vn\" lang=\"vi\">Tiệt trùng thương mại: xem cả hệ thống\u003c/span>","cols":3,"items":[{"h":"產品與目標\u003cspan class=\"vn\" lang=\"vi\">Sản phẩm và mục tiêu\u003c/span>","p":"處理要控制相關公共衛生危害，並符合預定保存條件。\u003cspan class=\"vn\" lang=\"vi\">Xử lý kiểm soát nguy hại liên quan, đáp ứng điều kiện bảo quản dự kiến.\u003c/span>","c":"#2D2A6E"},{"h":"熱穿透與冷點\u003cspan class=\"vn\" lang=\"vi\">Truyền nhiệt và điểm lạnh\u003c/span>","p":"罐型、裝量、黏度、顆粒與攪動，會影響加熱。\u003cspan class=\"vn\" lang=\"vi\">Dạng hộp, lượng, độ nhớt, hạt và khuấy ảnh hưởng gia nhiệt.\u003c/span>","c":"#2D2A6E"},{"h":"密封與保存\u003cspan class=\"vn\" lang=\"vi\">Kín và bảo quản\u003c/span>","p":"防止再污染；開封後要依標示處理。\u003cspan class=\"vn\" lang=\"vi\">Tránh tái nhiễm; sau mở làm theo nhãn.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"商業無菌不等於完全沒有活菌；要在規定的非冷藏儲運條件下符合要求，不可只用一個加熱溫度判定。\u003cspan class=\"vn\" lang=\"vi\">Vô trùng thương mại không có nghĩa không còn bất kỳ tế bào sống; phải đáp ứng điều kiện lưu trữ, vận chuyển không lạnh quy định, không chỉ xem một nhiệt độ.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-guides/aseptic-processing-and-packaging-food-industry\" target=\"_blank\" rel=\"noopener\">商業無菌與系統 / Vô trùng thương mại: FDA ↗\u003c/a>\u003c/p>"}]},{"id":"m-dzf","nav":"D／Z／F 值","kicker":"MODULE 2 · 殺菌動力學","h2":"D、z、F 與 F₀：模型與驗證","lead":"先說目標菌、食品基質、溫度和單位，再算對數減量與等效致死時間。假設計算不代替實際製程建立。","blocks":[{"type":"cards","title":"固定條件的對數模型\u003cspan class=\"vn\" lang=\"vi\">Mô hình log ở điều kiện cố định\u003c/span>","cols":3,"items":[{"h":"起點 10⁵\u003cspan class=\"vn\" lang=\"vi\">Ban đầu 10⁵\u003c/span>","p":"經過 1D → 10⁴，剩原來 10%。\u003cspan class=\"vn\" lang=\"vi\">Qua 1D → 10⁴, còn 10% ban đầu.\u003c/span>","c":"#2D2A6E"},{"h":"再經過 1D\u003cspan class=\"vn\" lang=\"vi\">Thêm 1D\u003c/span>","p":"10⁴ → 10³；每次減少當時菌數的 90%。\u003cspan class=\"vn\" lang=\"vi\">10⁴ → 10³; mỗi lần giảm 90% lượng lúc đó.\u003c/span>","c":"#2D2A6E"},{"h":"模型的限制\u003cspan class=\"vn\" lang=\"vi\">Giới hạn mô hình\u003c/span>","p":"log N＝0 是 N＝1，不是 N＝0；模型不能保證絕對無菌。\u003cspan class=\"vn\" lang=\"vi\">log N=0 là N=1, không phải N=0; mô hình không bảo đảm vô trùng tuyệt đối.\u003c/span>","c":"#2D2A6E"}]},{"type":"cards","title":"D、z、F：先說基準\u003cspan class=\"vn\" lang=\"vi\">D, z, F: nói rõ cơ sở\u003c/span>","cols":3,"items":[{"h":"D：時間\u003cspan class=\"vn\" lang=\"vi\">D: thời gian\u003c/span>","p":"固定溫度、指定菌與食品下，活菌減少 90%（1 log）的時間。\u003cspan class=\"vn\" lang=\"vi\">Ở nhiệt cố định, vi sinh vật và thực phẩm xác định: thời gian giảm 90% (1 log).\u003c/span>","c":"#2D2A6E"},{"h":"z：溫差\u003cspan class=\"vn\" lang=\"vi\">z: chênh lệch nhiệt\u003c/span>","p":"使 D 值變成 1/10 所需的升溫幅度；單位 °C。\u003cspan class=\"vn\" lang=\"vi\">Mức tăng nhiệt làm D còn 1/10; đơn vị °C.\u003c/span>","c":"#2D2A6E"},{"h":"F：等效時間\u003cspan class=\"vn\" lang=\"vi\">F: thời gian tương đương\u003c/span>","p":"把溫度歷程換成指定參考溫度與 z 下的等效時間。\u003cspan class=\"vn\" lang=\"vi\">Đổi lịch sử nhiệt thành thời gian tương đương ở nhiệt tham chiếu và z đã chọn.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"F₀ 特指以 121.1°C、z＝10°C 計算的等效分鐘；一般 F 需另說參考溫度與 z。D、z 隨目標及基質改變。\u003cspan class=\"vn\" lang=\"vi\">F₀ là phút tương đương tại 121,1°C với z=10°C; F nói chung cần ghi nhiệt tham chiếu và z. D, z tùy mục tiêu và nền thực phẩm.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-guides/sterilizing-symbols-d-z-f\" target=\"_blank\" rel=\"noopener\">定義與模型 / Định nghĩa và mô hình: FDA 技術指南 ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 2｜數一數幾個 D\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 2: Đếm số D\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"dcalc\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">假設固定 110°C，D₁₁₀＝0.5 分鐘，起始 10⁵ 個。只算恆溫 1.5 分鐘，無升降溫；模型預期剩多少？\u003cspan class=\"vn\" lang=\"vi\">Giả định ở 110°C, D₁₁₀=0,5 phút, ban đầu 10⁵. Chỉ tính giữ nhiệt 1,5 phút, bỏ qua tăng giảm nhiệt; dự kiến còn bao nhiêu?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>1.5 ÷ 0.5＝＿＿D，所以預期剩＿＿個。\u003cspan class=\"vn\" lang=\"vi\">1,5 ÷ 0,5=___D, nên dự kiến còn ___ .\u003c/span>\u003c/div>\u003clabel for=\"general-w11-dcalc\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w11-dcalc\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>3D，減少 3 log：10⁵ → 10²＝100 個。\u003cspan class=\"vn\" lang=\"vi\">3D, giảm 3 log: 10⁵ → 10²=100.\u003c/span>\u003c/p>\u003cp>每個 D 減少當時數量的 90%，不是每次減 90 個；假設值不是玉米罐頭的實際製程。\u003cspan class=\"vn\" lang=\"vi\">Mỗi D giảm 90% lượng lúc đó, không phải 90 tế bào; số giả định không là quy trình ngô hộp thực.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"12D：減少比例，不是通用處方\u003cspan class=\"vn\" lang=\"vi\">12D: tỷ lệ giảm, không là công thức chung\u003c/span>","cols":3,"items":[{"h":"模型的意思\u003cspan class=\"vn\" lang=\"vi\">Ý nghĩa mô hình\u003c/span>","p":"12 個 D → 存活比例為 10⁻¹²。初始菌量仍重要。\u003cspan class=\"vn\" lang=\"vi\">12D → tỷ lệ sống 10⁻¹². Lượng ban đầu vẫn quan trọng.\u003c/span>","c":"#2D2A6E"},{"h":"假設計算\u003cspan class=\"vn\" lang=\"vi\">Tính giả định\u003c/span>","p":"若 D₁₂₁.₁＝0.25 分鐘，12D 對應 3 等效分鐘。\u003cspan class=\"vn\" lang=\"vi\">Nếu D₁₂₁.₁=0,25 phút, 12D tương ứng 3 phút tương đương.\u003c/span>","c":"#2D2A6E"},{"h":"回到罐裝玉米\u003cspan class=\"vn\" lang=\"vi\">Trở lại ngô hộp\u003c/span>","p":"實際目標、冷點與製程，須依產品驗證。\u003cspan class=\"vn\" lang=\"vi\">Mục tiêu, điểm lạnh và quy trình thực cần kiểm chứng theo sản phẩm.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"數字為教學假設；「3 等效分鐘」不是整罐在殺菌釜內只待 3 分鐘，也不是所有罐頭的最低要求。\u003cspan class=\"vn\" lang=\"vi\">Số là giả định học tập; 3 phút tương đương không là chỉ ở nồi 3 phút, cũng không là mức tối thiểu cho mọi đồ hộp.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-guides/sterilizing-symbols-d-z-f\" target=\"_blank\" rel=\"noopener\">D 與致死量模型 / D và mô hình hiệu lực: FDA ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"pH 4.6：有範圍的分類線\u003cspan class=\"vn\" lang=\"vi\">pH 4,6: ranh giới có phạm vi\u003c/span>","cols":3,"items":[{"h":"FDA 特定低酸性罐頭定義\u003cspan class=\"vn\" lang=\"vi\">Định nghĩa FDA có phạm vi\u003c/span>","p":"涉及成品平衡 pH > 4.6、aw > 0.85，並有品項例外。\u003cspan class=\"vn\" lang=\"vi\">Có pH cân bằng thành phẩm >4,6, aw >0,85 và ngoại lệ sản phẩm.\u003c/span>","c":"#2D2A6E"},{"h":"酸化不是只加一點醋\u003cspan class=\"vn\" lang=\"vi\">Axit hóa không chỉ thêm giấm\u003c/span>","p":"要確認成品平衡 pH、配方、熱處理與包裝。\u003cspan class=\"vn\" lang=\"vi\">Xác nhận pH cân bằng, công thức, xử lý nhiệt và bao bì.\u003c/span>","c":"#2D2A6E"},{"h":"不能只靠 pH 選秒數\u003cspan class=\"vn\" lang=\"vi\">Không chọn thời gian chỉ từ pH\u003c/span>","p":"酸性食品也可能有耐酸菌、黴菌與酵母等問題。\u003cspan class=\"vn\" lang=\"vi\">Thực phẩm axit vẫn có thể gặp vi sinh vật chịu axit, nấm men, nấm mốc.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"此處引用美國 FDA 分類作教學比較，不當作台灣所有食品的通用法規；實際製程由具能力者依適用要求建立。\u003cspan class=\"vn\" lang=\"vi\">Dùng phân loại FDA Hoa Kỳ để so sánh, không là luật chung mọi thực phẩm Đài Loan; quy trình thực do người có năng lực thiết lập theo yêu cầu áp dụng.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/food/guidance-documents-regulatory-information-topic-food-and-dietary-supplements/acidified-low-acid-canned-foods-guidance-documents-regulatory-information\" target=\"_blank\" rel=\"noopener\">分類與範圍 / Phân loại và phạm vi: FDA ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 3｜換成 F₀ 等效時間\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 3: Đổi sang thời gian F₀\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"fzero\">\u003cp class=\"activity-time\">3 分鐘 / 3 phút\u003c/p>\u003cp class=\"activity-prompt\">假設冷點只有兩段恆溫：121.1°C 1 分鐘、111.1°C 10 分鐘；z＝10°C，忽略其他時段。F₀ 是多少？\u003cspan class=\"vn\" lang=\"vi\">Giả định điểm lạnh chỉ có hai đoạn: 121,1°C 1 phút, 111,1°C 10 phút; z=10°C, bỏ qua đoạn khác. F₀ bao nhiêu?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>F₀＝1 × 1 ＋ 10 × 0.1＝＿＿等效分鐘。\u003cspan class=\"vn\" lang=\"vi\">F₀=1 × 1 + 10 × 0,1=___ phút tương đương.\u003c/span>\u003c/div>\u003clabel for=\"general-w11-fzero\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w11-fzero\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>2 等效分鐘；低 10°C 時，每分鐘致死率是參考條件的 0.1 倍。\u003cspan class=\"vn\" lang=\"vi\">2 phút tương đương; thấp hơn 10°C, hiệu lực mỗi phút bằng 0,1 lần mức tham chiếu.\u003c/span>\u003c/p>\u003cp>這不是殺菌釜只運轉 2 分鐘；也不能單靠 F₀＝2 判定玉米罐頭合格，還需目標值與製程驗證。\u003cspan class=\"vn\" lang=\"vi\">Không có nghĩa nồi chỉ chạy 2 phút; riêng F₀=2 chưa xác định ngô hộp đạt, còn cần mục tiêu và kiểm chứng.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"exp","title":"延伸：由冷點曲線計算致死量","items":[{"h":"D 與恆溫對數模型","body":["恆溫、模型適用時，log₁₀(N/N₀)＝−t/D。D 的時間單位須與 t 相同。觀察到拖尾或肩部時，不能硬套直線。","z 是讓 D 降為 1/10 的升溫幅度；菌株、食品組成和量測條件會影響它。不是所有孢子都固定 z＝10°C。"]},{"h":"F 的積分與 F₀ 基準","body":["F(Tref,z)＝∫10^((T(t)−Tref)/z) dt。使用食品冷點的溫度歷程，包含有貢獻的升溫與冷卻時段；F 的時間單位與 dt 一致。","F₀ 慣用 Tref＝121.1°C、z＝10°C。參考溫度是換算基準，不代表產品必須一直在此溫度處理。"]},{"h":"12D 與失敗機率","body":["12D 描述模型下的減量比例，不直接等於每一兆罐才會有一罐失敗。實際初始菌量、分布、製程變異與包裝都影響結果。","實際預定製程須由具能力者依產品、容器、冷點與適用要求建立；pH 和 aw 分類只是判斷的一部分。"]}]}]},{"id":"m-uht","nav":"UHT 與品質","kicker":"MODULE 3 · 高溫短時","h2":"相同殺菌目標下的品質與包裝","lead":"高溫短時可能有品質優勢，但須看不同反應的溫度敏感度、流動與傳熱；不能把所有品質指標都當作同一反應。","blocks":[{"type":"cards","title":"高溫短時：可能的品質優勢\u003cspan class=\"vn\" lang=\"vi\">Nhiệt cao, thời gian ngắn: lợi thế có điều kiện\u003c/span>","cols":3,"items":[{"h":"微生物與品質反應\u003cspan class=\"vn\" lang=\"vi\">Vi sinh vật và phản ứng chất lượng\u003c/span>","p":"對升溫的敏感度可能不同；不能共用固定 z。\u003cspan class=\"vn\" lang=\"vi\">Độ nhạy với tăng nhiệt có thể khác; không dùng một z cố định.\u003c/span>","c":"#2D2A6E"},{"h":"比較要有同一目標\u003cspan class=\"vn\" lang=\"vi\">So sánh cùng mục tiêu\u003c/span>","p":"相同殺菌效果下，較高溫、較短時可能少傷部分品質。\u003cspan class=\"vn\" lang=\"vi\">Cùng hiệu quả diệt khuẩn, nhiệt cao hơn và ngắn hơn có thể giảm hại vài chỉ tiêu.\u003c/span>","c":"#2D2A6E"},{"h":"還要快速傳熱\u003cspan class=\"vn\" lang=\"vi\">Còn cần truyền nhiệt nhanh\u003c/span>","p":"黏稠或大顆粒食品，中心升溫慢，不能直接照搬。\u003cspan class=\"vn\" lang=\"vi\">Thực phẩm nhớt hay hạt lớn nóng chậm ở giữa, không áp dụng máy móc.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"這是條件成立時的製程設計原理，不代表越熱越好，也不代表所有營養與風味反應都較少。\u003cspan class=\"vn\" lang=\"vi\">Đây là nguyên lý khi đủ điều kiện, không có nghĩa càng nóng càng tốt hay mọi chất dinh dưỡng, mùi đều ít đổi hơn.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-guides/sterilizing-symbols-d-z-f\" target=\"_blank\" rel=\"noopener\">熱敏感度與製程 / Độ nhạy nhiệt và quy trình: FDA ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"乳品例子：數字要連著包裝讀\u003cspan class=\"vn\" lang=\"vi\">Ví dụ sữa: đọc số cùng bao bì\u003c/span>","cols":3,"items":[{"h":"HTST 例子\u003cspan class=\"vn\" lang=\"vi\">Ví dụ HTST\u003c/span>","p":"72°C、15 秒是乳品常見條件例；不是所有食品通用。\u003cspan class=\"vn\" lang=\"vi\">72°C, 15 giây là ví dụ thường gặp ở sữa; không dùng chung mọi thực phẩm.\u003c/span>","c":"#2D2A6E"},{"h":"保久乳 UHT 例子\u003cspan class=\"vn\" lang=\"vi\">Ví dụ sữa UHT để thường\u003c/span>","p":"TFDA 舉 135–150°C、1–4 秒，並搭配無菌充填。\u003cspan class=\"vn\" lang=\"vi\">TFDA nêu 135–150°C, 1–4 giây, cùng chiết rót vô trùng.\u003c/span>","c":"#2D2A6E"},{"h":"保存看產品標示\u003cspan class=\"vn\" lang=\"vi\">Bảo quản theo nhãn\u003c/span>","p":"未開封、開封後條件不同；不能只由 UHT 推定保存月數。\u003cspan class=\"vn\" lang=\"vi\">Trước sau mở khác điều kiện; không suy số tháng chỉ từ chữ UHT.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"以上是 TFDA 乳品衛教中的製程例子；產品分類、實際製程與保存期限要分開確認。\u003cspan class=\"vn\" lang=\"vi\">Đây là ví dụ quy trình trong hướng dẫn sữa TFDA; cần xác nhận riêng loại sản phẩm, quy trình thực và hạn bảo quản.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/TC/newsContent.aspx?cid=5049&id=28234\" target=\"_blank\" rel=\"noopener\">乳品製程例子 / Ví dụ quy trình sữa: TFDA 2022 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"無菌包裝：三個環節\u003cspan class=\"vn\" lang=\"vi\">Bao gói vô trùng: ba phần\u003c/span>","cols":3,"items":[{"h":"食品處理\u003cspan class=\"vn\" lang=\"vi\">Xử lý thực phẩm\u003c/span>","p":"流動食品依驗證條件達商業無菌。\u003cspan class=\"vn\" lang=\"vi\">Thực phẩm dòng chảy đạt vô trùng thương mại theo điều kiện kiểm chứng.\u003c/span>","c":"#2D2A6E"},{"h":"包材與設備\u003cspan class=\"vn\" lang=\"vi\">Bao bì và thiết bị\u003c/span>","p":"接觸食品的包材及系統，也要有合適處理。\u003cspan class=\"vn\" lang=\"vi\">Bao bì tiếp xúc và hệ thống cũng cần xử lý phù hợp.\u003c/span>","c":"#2D2A6E"},{"h":"充填與密封\u003cspan class=\"vn\" lang=\"vi\">Chiết rót và đóng kín\u003c/span>","p":"在受控環境充填，維持密封，防再污染。\u003cspan class=\"vn\" lang=\"vi\">Chiết rót trong môi trường kiểm soát, giữ kín, tránh tái nhiễm.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"無菌加工的食品、包材、設備與充填需各自有合適控制及紀錄。\u003cspan class=\"vn\" lang=\"vi\">Thực phẩm, bao bì, thiết bị, chiết rót cần kiểm soát và hồ sơ phù hợp.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-guides/aseptic-processing-and-packaging-food-industry\" target=\"_blank\" rel=\"noopener\">無菌系統 / Hệ thống vô trùng: FDA ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"加熱的影響：看指標\u003cspan class=\"vn\" lang=\"vi\">Ảnh hưởng nhiệt: xem chỉ tiêu\u003c/span>","cols":3,"items":[{"h":"安全與保存\u003cspan class=\"vn\" lang=\"vi\">An toàn và bảo quản\u003c/span>","p":"可降低目標微生物、鈍化部分酵素；效果依條件。\u003cspan class=\"vn\" lang=\"vi\">Có thể giảm vi sinh vật mục tiêu, bất hoạt vài enzyme; tùy điều kiện.\u003c/span>","c":"#2D2A6E"},{"h":"營養與可利用性\u003cspan class=\"vn\" lang=\"vi\">Dinh dưỡng và khả dụng\u003c/span>","p":"可能損失熱敏感成分，也可能增加部分成分的釋出。\u003cspan class=\"vn\" lang=\"vi\">Có thể mất chất nhạy nhiệt, cũng có thể giúp giải phóng vài chất.\u003c/span>","c":"#2D2A6E"},{"h":"口感與風味\u003cspan class=\"vn\" lang=\"vi\">Kết cấu và hương vị\u003c/span>","p":"可能形成想要的熟香，也可能過軟或產生蒸煮味。\u003cspan class=\"vn\" lang=\"vi\">Có thể tạo mùi chín mong muốn, cũng có thể quá mềm hay có mùi nấu.\u003c/span>","c":"#2D2A6E"}]},{"type":"exp","title":"延伸：用假設 z 值理解比較","items":[{"h":"比較條件與限制","body":["假設目標微生物 z＝10°C，某品質反應 z＝30°C；同一恆溫模型下，升高 10°C，達相同微生物減量的時間降為 1/10。","該品質反應速率約增加 10^(10/30)＝2.15 倍，乘以時間後反應量約為原來 0.215 倍。這是假設示範，不是所有食品的實測係數。"]},{"h":"熱傳與無菌加工","body":["黏稠度、大顆粒、停留時間分布及設備會影響升溫與最低處理程度；不能僅把設定溫度代入算式。","無菌加工須同時管理產品、接觸系統、包材及充填密封；商業無菌不是絕對無菌。"]}]},{"type":"cards","title":"回顧\u003cspan class=\"vn\" lang=\"vi\">Ôn tập\u003c/span>","cols":2,"items":[{"h":"目的、食品與包裝，決定製程設計\u003cspan class=\"vn\" lang=\"vi\">Mục đích, thực phẩm, bao bì quyết định thiết kế\u003c/span>"},{"h":"D 是減少 1 log 的時間；z 是溫差\u003cspan class=\"vn\" lang=\"vi\">D là thời gian giảm 1 log; z là chênh lệch nhiệt\u003c/span>"},{"h":"F 要說基準；F₀ 用 121.1°C、z＝10°C\u003cspan class=\"vn\" lang=\"vi\">F cần cơ sở; F₀ dùng 121,1°C, z=10°C\u003c/span>"},{"h":"冷點歷程、密封與保存，都需驗證\u003cspan class=\"vn\" lang=\"vi\">Cần kiểm chứng lịch sử điểm lạnh, kín và bảo quản\u003c/span>"}]}]},{"id":"m-quiz","nav":"綜合測驗","kicker":"MODULE 4 · 綜合測驗","h2":"小測驗：檢核學習成效","lead":"與 A2 版共用 10 題核心檢核；包含 D 與 F₀ 假設計算。先說條件，再解釋答案。","blocks":[{"type":"quiz","items":[{"q":"多數冷凍蔬菜先殺菁，主要目的是？\u003cspan class=\"vn\" lang=\"vi\">Nhiều rau được chần trước đông chủ yếu để?\u003c/span>","o":["達到完全無菌 / Vô trùng tuyệt đối","鈍化酵素，維持品質 / Bất hoạt enzyme, giữ chất lượng","保證常溫放半年 / Bảo đảm để thường nửa năm","增加所有維生素 / Tăng mọi vitamin"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 殺菁主要鈍化酵素，也可減少部分微生物；仍須合適冷凍與後續處理。\u003cspan class=\"vn\" lang=\"vi\">Chần chủ yếu bất hoạt enzyme, giảm một phần vi sinh vật; vẫn cần đông và xử lý sau phù hợp.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：殺菁主要為了＿＿，不是完全無菌。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Chần chủ yếu để ___, không là vô trùng tuyệt đối.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://nchfp.uga.edu/how/freeze/freeze-general-information/blanching-vegetables/\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"D 值比較時，必須先指定哪些條件？\u003cspan class=\"vn\" lang=\"vi\">So D cần chỉ rõ điều kiện nào?\u003c/span>","o":["只看加熱時間 / Chỉ thời gian gia nhiệt","只看容器大小 / Chỉ kích thước hộp","只看食品酸鹼值 / Chỉ pH thực phẩm","溫度、目標菌與食品基質 / Nhiệt, vi sinh vật mục tiêu, nền thực phẩm"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> D 是指定條件下減少 1 log 的時間；不同菌、食品或溫度不能直接共用。\u003cspan class=\"vn\" lang=\"vi\">D là thời gian giảm 1 log ở điều kiện xác định; không dùng chung các loài, thực phẩm, nhiệt.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：比較 D 值前，我先確認＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Trước so D, tôi xác nhận ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-guides/sterilizing-symbols-d-z-f\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"假設 D₁₁₀＝0.5 分鐘，固定 110°C 加熱 1.5 分鐘，共幾 D？\u003cspan class=\"vn\" lang=\"vi\">Giả định D₁₁₀=0,5 phút, giữ 110°C trong 1,5 phút là mấy D?\u003c/span>","o":["3D / 3D","0.75D / 0,75D","1D / 1D","5D / 5D"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 恆溫模型用 t/D＝1.5/0.5＝3；忽略升降溫，是本題假設。\u003cspan class=\"vn\" lang=\"vi\">Mô hình giữ nhiệt t/D=1,5/0,5=3; bỏ qua tăng giảm nhiệt là giả định.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：加熱時間除以 D，得到＿＿D。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Thời gian chia D được ___D.\u003c/span>\u003c/div>"},{"q":"上題若起始有 10⁵ 個，3D 後模型預期剩多少？\u003cspan class=\"vn\" lang=\"vi\">Nếu ban đầu 10⁵, mô hình sau 3D còn bao nhiêu?\u003c/span>","o":["0 個 / 0","99,730 個 / 99.730","100 個 / 100","10,000 個 / 10.000"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 每個 D 減少 1 log，10⁵×10⁻³＝10²＝100；不是每次減掉 90 個。\u003cspan class=\"vn\" lang=\"vi\">Mỗi D giảm 1 log: 10⁵×10⁻³=100; không phải mỗi lần trừ 90.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：經過 3D，指數從 5 減到＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Qua 3D, số mũ từ 5 giảm còn ___.\u003c/span>\u003c/div>"},{"q":"F₀ 的參考條件是？\u003cspan class=\"vn\" lang=\"vi\">Điều kiện tham chiếu của F₀ là?\u003c/span>","o":["121.1°C，z＝10°C / 121,1°C, z=10°C","任何溫度，z 都是 10°C / Nhiệt nào cũng được, z luôn 10°C","72°C，15 秒 / 72°C, 15 giây","殺菌釜總共 3 分鐘 / Tổng thời gian nồi 3 phút"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 一般 F 需指定參考溫度與 z；F₀ 是特定基準的等效分鐘。\u003cspan class=\"vn\" lang=\"vi\">F chung cần nhiệt tham chiếu, z; F₀ là phút tương đương theo cơ sở xác định.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：F₀ 是＿＿下的等效分鐘。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: F₀ là phút tương đương tại ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-guides/sterilizing-symbols-d-z-f\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"假設冷點 121.1°C 1 分鐘，加上 111.1°C 10 分鐘，z＝10°C，F₀＝？\u003cspan class=\"vn\" lang=\"vi\">Giả định điểm lạnh 121,1°C 1 phút và 111,1°C 10 phút, z=10°C; F₀=?\u003c/span>","o":["11 分鐘 / 11 phút","1.1 分鐘 / 1,1 phút","2 等效分鐘 / 2 phút tương đương","10 等效分鐘 / 10 phút tương đương"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 只算題目兩段：1×1＋10×0.1＝2；不等於整個殺菌釜時間，也不能單靠此值判定合格。\u003cspan class=\"vn\" lang=\"vi\">Chỉ tính hai đoạn: 1×1+10×0,1=2; khác thời gian nồi, riêng số này chưa xác định đạt.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：溫度低 10°C，致死率為＿＿倍。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Thấp hơn 10°C, hiệu lực bằng ___ lần.\u003c/span>\u003c/div>"},{"q":"「12D 對應 3 等效分鐘」應如何理解？\u003cspan class=\"vn\" lang=\"vi\">Hiểu 12D tương ứng 3 phút tương đương thế nào?\u003c/span>","o":["所有罐頭都煮 3 分鐘 / Mọi đồ hộp nấu 3 phút","每罐一定完全無菌 / Mỗi hộp chắc chắn vô trùng","產品 pH 不必量 / Không cần đo pH","需先指定 D、目標與產品，並驗證製程 / Cần D, mục tiêu, sản phẩm và kiểm chứng"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 只有假設 D₁₂₁.₁＝0.25 分鐘等條件時，12×D＝3；不是全部罐頭通用最低處方。\u003cspan class=\"vn\" lang=\"vi\">Chỉ khi giả định D₁₂₁.₁=0,25 phút cùng điều kiện, 12D=3; không là mức tối thiểu chung.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：這個 3 分鐘的前提是＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tiền đề của 3 phút này là ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-guides/sterilizing-symbols-d-z-f\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"玉米罐頭的加熱驗證，為何看冷點？\u003cspan class=\"vn\" lang=\"vi\">Vì sao kiểm chứng nhiệt ngô hộp xem điểm lạnh?\u003c/span>","o":["那裡一定在幾何中心 / Chắc ở tâm hình học","確認最難充分加熱的位置也達目標 / Xác nhận vị trí khó nóng đủ cũng đạt","冷點只看釜內空氣 / Chỉ xem khí trong nồi","可不用看密封 / Không cần xem kín"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 冷點位置受產品、容器與熱傳影響；不能一律假定在中心。密封與保存也須管理。\u003cspan class=\"vn\" lang=\"vi\">Điểm lạnh tùy sản phẩm, hộp, truyền nhiệt; không luôn ở giữa. Còn quản lý kín, bảo quản.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：我需要冷點的＿＿紀錄。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tôi cần hồ sơ ___ của điểm lạnh.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-guides/aseptic-processing-and-packaging-food-industry\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"為什麼 UHT 保久乳不能只看加熱數字？\u003cspan class=\"vn\" lang=\"vi\">Vì sao sữa UHT để thường không chỉ xem số nhiệt?\u003c/span>","o":["還需要合適包裝、充填與保存條件 / Còn bao bì, chiết rót, bảo quản phù hợp","UHT 自動保證半年 / UHT tự bảo đảm nửa năm","開封後一定可常溫放 / Sau mở chắc để thường","標示不重要 / Nhãn không quan trọng"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> TFDA 的 UHT 例子搭配無菌充填；開封後條件改變，保存期限依產品標示。\u003cspan class=\"vn\" lang=\"vi\">Ví dụ UHT TFDA cùng chiết rót vô trùng; sau mở đổi điều kiện, hạn theo nhãn.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：加熱之外，我還要看＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Ngoài nhiệt, tôi còn xem ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/TC/newsContent.aspx?cid=5049&id=28234\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"相同殺菌目標下，高溫短時一定保留所有品質嗎？\u003cspan class=\"vn\" lang=\"vi\">Cùng mục tiêu diệt khuẩn, nhiệt cao ngắn luôn giữ mọi chất lượng?\u003c/span>","o":["是，只看最高溫度 / Có, chỉ xem nhiệt cao nhất","是，所有反應 z 相同 / Có, mọi phản ứng cùng z","不一定，還看反應敏感度與傳熱 / Không chắc, xem độ nhạy và truyền nhiệt","否，所有高溫都沒用 / Không, mọi nhiệt cao vô ích"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 品質優勢需看反應、升降溫和食品熱傳；某些品質改善不等於所有指標都較好。\u003cspan class=\"vn\" lang=\"vi\">Lợi thế tùy phản ứng, tăng giảm nhiệt và truyền nhiệt; vài chỉ tiêu tốt hơn không là tất cả.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：我比較相同＿＿，再看＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tôi so cùng ___ rồi xem ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-guides/sterilizing-symbols-d-z-f\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"}]}]}]};</script>
<script>
/*
 * runtime.client.js — 跑在瀏覽器裡的渲染器（17 週共用，逐字內嵌進每份 HTML）
 * 讀 window.__LESSON__ 的資料，把 modules / blocks 畫出來。
 * 互動行為（翻卡、展開、配對、測驗）沿用週1 手寫版的做法，不要另創一套。
 */
(function () {
  var D = window.__LESSON__;
  var SERIES = D.series;
  var $ = function (s) { return document.querySelector(s); };
  // 國合班 A2 版（D.a2）：介面文字加越南文；一般班 U() 只回中文，畫面與原本完全相同
  var A2 = !!D.a2;
  function U(zh, vn) { return A2 ? zh + " " + vn : zh; }

  /* ---------- 學習歷程記錄（Supabase） ----------
     只在 lesson.js 注入 D.track = {url, key} 的週次啟用（lib/tracking.json 的 weeks）；
     其他週 TRACK.on 為 false，send() 是空函式，教材行為完全不變。
     只送「學號代碼」與互動事件，不送姓名。送失敗就丟掉，不重試、不阻擋教材。 */
  var CTX = { mod: null, bi: 0 };   // 目前正在渲染的模組 id 與區塊序號（render 是同步的）
  var TRACK = (function () {
    var cfg = D.track;
    var noop = function () {};
    if (!cfg || !cfg.url || !cfg.key) return { on: false, send: noop, flush: noop, code: function () { return ""; }, setCode: noop };
    var KEY = "ifs_code", DKEY = "ifs_device";
    var rnd = function () { return Math.random().toString(36).slice(2, 10); };
    var sid = rnd() + Date.now().toString(36);
    // device_id：同一支手機／瀏覽器跨次開頁不變。學生後來才填學號代碼時，先前的 anon 事件可靠它回接。
    var did = "";
    try { did = localStorage.getItem(DKEY) || ""; if (!did) { did = "d" + rnd() + rnd(); localStorage.setItem(DKEY, did); } } catch (e) { did = "d" + rnd(); }
    var q = [], timer = null;
    function code() { try { return (localStorage.getItem(KEY) || "").trim(); } catch (e) { return ""; } }
    function setCode(v) { try { localStorage.setItem(KEY, (v || "").trim().slice(0, 20)); } catch (e) {} }
    function cut(s, n) { return s == null ? null : String(s).slice(0, n); }
    // 欄位長度與 payload 大小在前端先截到資料表 CHECK 的上限：PostgREST 批次 INSERT 是原子的，
    // 一筆違反 CHECK 整批都會被拒，而我們失敗即丟，會靜默掉整個 4 秒窗口。
    function send(event, mod, block, payload) {
      var p = payload || {};
      var ps = JSON.stringify(p);
      if (ps.length > 1800) p = { trunc: true, keys: Object.keys(p).slice(0, 10) };
      q.push({
        student_code: cut(code(), 20) || "anon", device_id: cut(did, 40), week: D.week || 0,
        module_id: cut(mod, 30), block_type: cut(block, 10), event: cut(event, 30),
        payload: p, session_id: cut(sid, 40), build: cut(D.build, 16), client_ts: new Date().toISOString(),
      });
      if (q.length >= 40) flush();
      else if (!timer) timer = setTimeout(flush, 4000);
    }
    function flush() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!q.length) return;
      var body = JSON.stringify(q.splice(0, 50));
      try {
        fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/ifs_lesson_events", {
          method: "POST", keepalive: true, body: body,
          headers: { "Content-Type": "application/json", "apikey": cfg.key, "Prefer": "return=minimal" },
        }).catch(noop);
      } catch (e) { /* 舊瀏覽器沒有 fetch：不記錄 */ }
      if (q.length) timer = setTimeout(flush, 1000);
    }
    window.addEventListener("pagehide", flush);
    return { on: true, send: send, flush: flush, code: code, setCode: setCode };
  })();

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function colorAt(given, i) { return given || SERIES[i % SERIES.length]; }
  function gridCls(n) { return "grid g" + (n === 2 || n === 3 || n === 4 ? n : 3); }
  function listHtml(v) {
    // body 可以是字串或字串陣列；陣列渲染成 <ul>
    if (v == null) return "";
    if (typeof v === "string") return '<p>' + v + '</p>';
    return '<ul>' + v.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
  }

  /* ---------- 區塊標題 ---------- */
  function heading(frag, b) {
    if (b.title) frag.appendChild(el("div", "sec-title", '<span class="bar"></span>' + b.title));
    if (b.hint) frag.appendChild(el("div", "hint", b.hint));
  }

  /* ---------- 各區塊 ---------- */
  var BLOCKS = {};

  BLOCKS.flips = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (d, i) {
      var c = colorAt(d.c, i);
      var card = el("div", "flip");
      if (b.h) card.style.height = b.h + "px";
      card.innerHTML =
        '<div class="flip-in">' +
        '<div class="face front"><div class="cbar" style="background:' + c + '"></div>' +
        '<div class="t">' + d.t + '</div><div class="en">' + (d.en || "") + '</div>' +
        '<div class="tap">▸ ' + U("點我看解釋", "Chạm để xem") + '</div></div>' +
        '<div class="face back"><div class="cbar" style="background:' + c + '"></div>' +
        '<p>' + d.b + '</p></div></div>';
      var mod = CTX.mod, bi = CTX.bi;
      card.onclick = function () {
        if (card.classList.toggle("on")) TRACK.send("flip_open", mod, "flips", { b: bi, i: i, t: d.t });
      };
      g.appendChild(card);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.exp = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div");
    b.items.forEach(function (t, i) {
      var box = el("div", "exp");
      var res = t.res ? '<div style="margin-top:10px;font-size:13px;color:var(--secondary);font-weight:700">🔗 ' + t.res + '</div>' : "";
      box.innerHTML =
        '<button><span class="num">' + (i + 1) + '</span><span>' + t.h + '</span>' +
        '<span class="tag">' + (t.tag || "") + '</span><span class="chev">›</span></button>' +
        '<div class="body">' + listHtml(t.body) + res + '</div>';
      var body = box.querySelector(".body");
      var mod = CTX.mod, bi = CTX.bi;
      box.querySelector("button").onclick = function () {
        var on = box.classList.toggle("on");
        if (!on) { body.style.maxHeight = "0px"; return; }
        TRACK.send("exp_open", mod, "exp", { b: bi, i: i, h: t.h });
        // 用實際內容高度展開，避免長段落被固定 max-height 截掉。
        // 必須先解除 max-height 再量：在 max-height:0 的狀態下量 scrollHeight 會得到 0，
        // 面板就只會開一條縫（實測過）。量完歸零並強制重排，transition 才有起點。
        body.style.maxHeight = "none";
        var h = body.scrollHeight;
        body.style.maxHeight = "0px";
        void body.offsetHeight;
        body.style.maxHeight = h + "px";
      };
      host.appendChild(box);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.cards = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var box = el("div", "card");
      box.style.borderTop = "4px solid " + accent;
      box.innerHTML = '<div class="h">' + c.h + '</div>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        (c.li ? '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>' : "") +
        (c.p ? '<p style="margin-top:8px;font-size:15.5px;color:var(--mid)">' + c.p + '</p>' : "");
      g.appendChild(box);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.timeline = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "tl");
    b.steps.forEach(function (s, i) {
      var st = el("div", "step");
      st.innerHTML = '<div class="dot" style="background:' + colorAt(s.c, i) + '">' + (i + 1) + '</div>' +
        '<h4>' + s.h + '</h4><p>' + s.p + '</p>';
      host.appendChild(st);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.compare = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "cmp");
    [b.left, b.right].forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var col = el("div", "col");
      col.innerHTML = '<div class="cbar" style="background:' + accent + '"></div>' +
        '<h4 style="color:' + accent + '">' + c.h + '</h4>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
      wrap.appendChild(col);
    });
    f.appendChild(wrap);
    if (b.note) f.appendChild(el("div", "cmp-note", b.note));
    return f;
  };

  BLOCKS.table = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "tblwrap");
    var html = '<table class="tbl"><thead><tr>' +
      b.head.map(function (h) { return '<th>' + h + '</th>'; }).join("") + '</tr></thead><tbody>' +
      b.rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join("") + '</tr>';
      }).join("") + '</tbody></table>';
    wrap.innerHTML = html;
    f.appendChild(wrap); return f;
  };

  BLOCKS.note = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    f.appendChild(el("div", "note" + (b.kind ? " " + b.kind : ""), b.text));
    return f;
  };

  BLOCKS.match = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "match-wrap");
    var pool = el("div", "pool"), targets = el("div", "targets");
    var pairs = b.pairs;
    var order = pairs.slice().sort(function () { return Math.random() - 0.5; });
    var selected = null, solved = 0, errors = 0, t0 = null;
    var mod = CTX.mod, bi = CTX.bi;
    var msg = el("div");
    msg.style.cssText = "margin-top:14px;font-weight:700;color:var(--green)";

    function tryMatch(slot, key) {
      if (slot.classList.contains("ok")) return;
      if (t0 === null) t0 = Date.now();
      if (slot.dataset.k === key) {
        slot.classList.add("ok"); slot.classList.remove("bad");
        slot.querySelector(".drop").textContent = key;
        var chip = pool.querySelector('.chip[data-k="' + key + '"]');
        chip.classList.add("used"); chip.classList.remove("sel");
        selected = null; solved++;
        TRACK.send("match_ok", mod, "match", { b: bi, label: key });
        if (solved === pairs.length) {
          msg.textContent = b.done || U("✓ 全部答對！", "Đúng hết!");
          TRACK.send("match_done", mod, "match", { b: bi, n: pairs.length, errors: errors, ms: Date.now() - t0 });
        }
      } else {
        errors++;
        TRACK.send("match_bad", mod, "match", { b: bi, label: key, slot: slot.dataset.k });
        slot.classList.add("bad");
        setTimeout(function () { slot.classList.remove("bad"); }, 350);
      }
    }
    order.forEach(function (q) {
      var c = el("div", "chip"); c.textContent = q.label; c.draggable = true; c.dataset.k = q.label;
      c.addEventListener("dragstart", function (e) { e.dataTransfer.setData("k", q.label); });
      c.onclick = function () {
        if (c.classList.contains("used")) return;
        if (selected === c) { c.classList.remove("sel"); selected = null; return; }
        pool.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("sel"); });
        c.classList.add("sel"); selected = c;
      };
      pool.appendChild(c);
    });
    pairs.forEach(function (q) {
      var s = el("div", "slot"); s.dataset.k = q.label;
      s.innerHTML = '<div class="drop">' + U("拖到這裡", "Kéo vào đây") + '</div><div class="desc">' + q.desc + '</div>';
      s.addEventListener("dragover", function (e) { e.preventDefault(); });
      s.addEventListener("drop", function (e) { e.preventDefault(); tryMatch(s, e.dataTransfer.getData("k")); });
      s.onclick = function () { if (selected) tryMatch(s, selected.dataset.k); };
      targets.appendChild(s);
    });
    host.appendChild(pool); host.appendChild(targets); host.appendChild(msg);
    f.appendChild(host); return f;
  };

  /* 結果代碼：把作答結果編成一串可貼給老師的代碼（FSQ1.<base64>.<檢查碼>）。
     解碼與彙整用專案根目錄的「食品科學概論_測驗成績解碼器.html」。 */
  function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
  function checksum(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1679616; // 36^4
    return h.toString(36);
  }

  BLOCKS.quiz = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var items = b.items, n = items.length;
    var head = el("div", "quiz-head");
    head.innerHTML =
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
      '<input class="qid" placeholder="' + U("學號（交成績必填）", "Mã số SV") + '" style="flex:1;min-width:130px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px">' +
      '<input class="qname" placeholder="' + U("姓名", "Họ tên") + '" style="flex:1;min-width:100px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px"></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
      '<strong class="qprog">' + U("進度", "Tiến độ") + ' 0 / ' + n + '</strong>' +
      '<span class="qscore" style="color:var(--secondary);font-weight:800">' + U("得分", "Điểm") + ' 0</span></div>' +
      '<div class="pbar"><div class="pfill"></div></div>';
    var box = el("div");
    var sb = el("div", "scorebox");
    sb.innerHTML = '<div>' + U("你的成績", "Điểm của bạn") + '</div><div class="big"><span class="fscore">0</span> / ' + n + '</div>' +
      '<div class="smsg" style="margin:8px 0 16px"></div>' +
      '<div class="rcwrap" style="margin:0 auto 16px;max-width:560px;text-align:left">' +
      '<div style="font-weight:700;margin-bottom:6px">' + U("結果代碼（請複製後，貼到老師指定的表單或訊息）", "— Mã kết quả: sao chép và gửi cho thầy/cô") + '</div>' +
      '<textarea class="rcode" readonly rows="3" style="width:100%;box-sizing:border-box;font-family:monospace;font-size:12px;padding:8px;border:1.5px solid var(--line,#ccc);border-radius:8px;resize:none"></textarea>' +
      '<div class="rmsg" style="font-size:13px;color:#B34700;margin-top:4px"></div>' +
      '<button class="btn copyrc" style="margin-top:8px">📋 ' + U("複製結果代碼", "Sao chép mã") + '</button></div>' +
      '<button class="btn ghost">' + U("重新測驗", "Làm lại") + '</button>';

    var answered = 0, score = 0, picks = [], qt0 = null, attempt = 0;
    var mod = CTX.mod, bi = CTX.bi;
    // 測驗的學號欄與頁首的學號代碼同步（兩邊填任一邊都行）
    var qidInput = head.querySelector(".qid");
    if (TRACK.on) {
      if (TRACK.code()) qidInput.value = TRACK.code();
      qidInput.addEventListener("change", function () {
        TRACK.setCode(qidInput.value);
        var top = $("#ifs-code"); if (top) top.value = TRACK.code();
      });
    }
    function updateProg() {
      head.querySelector(".qprog").textContent = U("進度", "Tiến độ") + " " + answered + " / " + n;
      head.querySelector(".qscore").textContent = U("得分", "Điểm") + " " + score;
      head.querySelector(".pfill").style.width = (answered / n * 100) + "%";
    }
    function finish() {
      sb.querySelector(".fscore").textContent = score;
      var pct = score / n, m;
      if (score === n) m = U("本次全對！請再用自己的話說明罐裝玉米的目標、冷點與密封。", "Đúng hết lần này! Hãy giải thích tình huống bằng lời của mình.");
      else if (pct >= 0.8) m = U("很棒！觀念相當扎實。", "Rất tốt!");
      else if (pct >= 0.6) m = U("不錯，再複習幾個弱點就更好。", "Khá tốt, ôn lại vài chỗ nữa nhé.");
      else m = U("建議回到前面單元再看一次翻卡與展開內容。", "Hãy xem lại các phần phía trước.");
      sb.querySelector(".smsg").textContent = m;

      var sid = head.querySelector(".qid").value.trim();
      var sname = head.querySelector(".qname").value.trim();
      var korr = items.map(function (item, i) { return picks[i] === item.a ? 1 : 0; }).join("");
      var payload = JSON.stringify({
        w: D.week || 0, c: A2 ? "a2" : undefined, id: sid, nm: sname, s: score, n: n,
        a: picks, k: korr, t: new Date().toISOString().slice(0, 16),
      });
      var body = b64utf8(payload);
      var code = "FSQ1." + body + "." + checksum(body);
      sb.querySelector(".rcode").value = code;
      sb.querySelector(".rmsg").textContent = sid ? "" : U("⚠ 尚未填學號 —— 請回到測驗上方填入學號後重新測驗，否則老師無法登記成績。", "Chưa nhập mã số SV: hãy nhập ở trên rồi làm lại.");
      TRACK.send("quiz_done", mod, "quiz", { b: bi, attempt: attempt, score: score, n: n, picks: picks, ms: qt0 ? Date.now() - qt0 : null });
      TRACK.flush();

      sb.classList.add("show");
      sb.scrollIntoView({ behavior: "smooth" });
    }
    function pick(qel, item, oi) {
      if (qel.dataset.done === "1") return;
      qel.dataset.done = "1"; answered++;
      if (qt0 === null) qt0 = Date.now();
      picks[parseInt(qel.dataset.qi, 10)] = oi;
      TRACK.send("quiz_answer", mod, "quiz", { b: bi, attempt: attempt, qi: parseInt(qel.dataset.qi, 10), pick: oi, ok: oi === item.a });
      qel.querySelectorAll(".opt").forEach(function (btn, i) {
        btn.classList.add("dim");
        if (i === item.a) btn.classList.add("correct");
        if (i === oi && oi !== item.a) btn.classList.add("wrong");
      });
      var fb = qel.querySelector(".fb");
      if (oi === item.a) { score++; fb.classList.add("good"); fb.innerHTML = U("✓ 正確！", "Đúng!") + item.e; }
      else { fb.classList.add("no"); fb.innerHTML = U("✗ 正解：", "Sai. Đáp án:") + item.o[item.a] + "。" + item.e; }
      fb.classList.add("show"); updateProg();
      if (answered === n) finish();
    }
    function build() {
      box.innerHTML = ""; answered = 0; score = 0; picks = []; qt0 = null; attempt++; updateProg();
      sb.classList.remove("show");
      items.forEach(function (item, qi) {
        var qel = el("div", "q"); qel.dataset.done = "0"; qel.dataset.qi = qi;
        qel.innerHTML = '<div class="qn">第 ' + (qi + 1) + ' 題' + (A2 ? ' · Câu ' + (qi + 1) : '') + '</div><div class="qt">' + item.q + '</div>';
        item.o.forEach(function (opt, oi) {
          var btn = el("button", "opt"); btn.textContent = opt;
          btn.onclick = function () { pick(qel, item, oi); };
          qel.appendChild(btn);
        });
        qel.appendChild(el("div", "fb"));
        box.appendChild(qel);
      });
    }
    sb.querySelector(".copyrc").onclick = function () {
      var ta = sb.querySelector(".rcode");
      ta.select(); ta.setSelectionRange(0, 99999);
      var btn = this;
      function ok() { btn.textContent = U("✓ 已複製，請貼給老師", "Đã sao chép"); setTimeout(function () { btn.textContent = "📋 " + U("複製結果代碼", "Sao chép mã"); }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(ta.value).then(ok, function () { document.execCommand("copy"); ok(); });
      else { document.execCommand("copy"); ok(); }
    };
    sb.querySelector(".ghost").onclick = function () {
      build(); window.scrollTo({ top: 0, behavior: "smooth" });
    };
    build();
    f.appendChild(head); f.appendChild(box); f.appendChild(sb);
    return f;
  };

  /* ---------- 組裝 ---------- */
  var nav = $("#nav"), main = $("#main");
  var curMod = D.modules.length ? D.modules[0].id : null, modT0 = Date.now();
  function switchMod(id, btn) {
    document.querySelectorAll(".module").forEach(function (m) { m.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
    nav.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
    btn.classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (id !== curMod) {
      TRACK.send("module_view", id, null, { from: curMod, ms: Date.now() - modT0 });
      curMod = id; modT0 = Date.now();
    }
  }
  D.modules.forEach(function (m, i) {
    var btn = el("button", i === 0 ? "active" : "", m.nav);
    btn.onclick = function () { switchMod(m.id, btn); };
    nav.appendChild(btn);

    var sec = el("section", "module" + (i === 0 ? " active" : ""));
    sec.id = m.id;
    sec.appendChild(el("div", "lead",
      '<div class="kicker">' + m.kicker + '</div><h2>' + m.h2 + '</h2><p>' + m.lead + '</p>'));
    m.blocks.forEach(function (b, bi) {
      var render = BLOCKS[b.type];
      if (!render) { console.error("未知區塊型別:", b.type); return; }
      CTX.mod = m.id; CTX.bi = bi;
      sec.appendChild(render(b));
    });
    main.appendChild(sec);
  });

  /* ---------- 學號代碼列（只在啟用記錄的週出現） ---------- */
  if (TRACK.on) {
    var bar = el("div", "codebar");
    bar.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;font-size:14px";
    bar.innerHTML = '<label for="ifs-code" style="font-weight:700">學號代碼</label>' +
      '<input id="ifs-code" maxlength="20" placeholder="例：S001" style="width:120px;padding:6px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:14px">' +
      '<span style="opacity:.75">只記錄你的學習歷程（翻卡、配對、測驗），不需要姓名。</span>';
    nav.parentNode.insertBefore(bar, nav);
    var inp = bar.querySelector("#ifs-code");
    inp.value = TRACK.code();
    inp.addEventListener("change", function () {
      TRACK.setCode(inp.value);
      document.querySelectorAll(".qid").forEach(function (x) { x.value = TRACK.code(); });
      TRACK.send("code_set", null, null, {});
    });
    TRACK.send("session_start", curMod, null, {
      device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || "") ? "mobile" : "desktop",
      w: window.innerWidth, build: D.build || null,
    });
    // 停留時間以「頁面可見」為準：切到背景就結算一段 module_leave，回來重新計時。
    // 手機瀏覽器殺分頁常不觸發 pagehide，所以以 visibilitychange→hidden 為主。
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        TRACK.send("module_leave", curMod, null, { ms: Date.now() - modT0 }); TRACK.flush();
      } else {
        modT0 = Date.now();
      }
    });
  }
})();
</script>
