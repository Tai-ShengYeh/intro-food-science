<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品科學概論 第10週 · 互動教學</title>
<style>
  :root{
    --primary:#2D2A6E; --secondary:#5B4FB8; --accent:#00B8B8; --warm:#F5A623; --green:#2FA36B; --red:#D65B5B; --dark:#1A1A3E; --bg:#F4F5FA; --text:#1F1F2E; --mid:#5A5A75; --muted:#9096ac; --border:#E2E2EC; --card:#fff;
  }
/* 版型樣式 — 逐條取自「第1週_互動教學.html」，末段為新增區塊（cmp / tbl / note）。
   這裡只用 var(--x)；色票由 tokens.js 產生 :root 注入。 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:17px}
header{background:linear-gradient(120deg,var(--dark),var(--primary));color:#fff;
  padding:26px 22px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(0,0,0,.15)}
header h1{font-size:31px;font-weight:800;letter-spacing:.5px}
header .sub{color:#b9c7ff;font-size:16px;margin-top:5px}
nav{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.10);color:#dfe4ff;border:none;padding:12px 18px;
  border-radius:10px 10px 0 0;font-size:16.5px;cursor:pointer;font-weight:600;transition:.15s}
nav button:hover{background:rgba(255,255,255,.2)}
nav button.active{background:var(--bg);color:var(--primary)}
main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
.module{display:none;animation:fade .35s}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead{background:var(--dark);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:22px}
.lead .kicker{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px}
.lead h2{font-size:26px;margin:6px 0 8px}
.lead p{color:#cdd3ee;font-size:16.5px}
.sec-title{font-size:23px;font-weight:800;color:var(--primary);margin:30px 0 6px;
  display:flex;align-items:center;gap:10px}
.sec-title .bar{width:6px;height:25px;background:var(--accent);border-radius:3px;display:inline-block}
.hint{color:var(--mid);font-size:15px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* flip cards */
.flip{perspective:1100px;height:200px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px rgba(30,30,60,.08);border:1px solid var(--border)}
.front{background:var(--card)}
.front .t{font-size:21px;font-weight:800;color:var(--primary)}
.front .en{color:var(--muted);font-size:14px;margin-top:3px;font-style:italic}
.front .tap{margin-top:auto;color:var(--accent);font-size:14px;font-weight:700}
.back{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;transform:rotateY(180deg);overflow:auto}
.back p{font-size:16px}
.cbar{height:6px;border-radius:14px 14px 0 0;position:absolute;top:0;left:0;right:0}

/* expandable */
.exp{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.exp>button{width:100%;text-align:left;background:none;border:none;padding:16px 18px;cursor:pointer;
  display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;color:var(--text)}
.exp .num{background:var(--primary);color:#fff;min-width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.exp .chev{margin-left:auto;color:var(--muted);transition:.25s;font-size:20px}
.exp.on .chev{transform:rotate(90deg);color:var(--accent)}
.exp .body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 18px}
.exp.on .body{padding:0 18px 16px 62px}
.exp .body ul{margin-left:16px;color:var(--mid);font-size:16px}
.exp .body p{color:var(--mid);font-size:15.5px}
.exp .tag{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:8px}

/* info card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.card .h{font-weight:800;color:var(--primary);font-size:18px;margin-bottom:6px}
.card .en{color:var(--muted);font-size:13px;font-style:italic}
.card ul{margin:8px 0 0 18px;font-size:15.5px;color:var(--mid)}

/* timeline */
.tl{display:flex;gap:0;flex-wrap:wrap;counter-reset:s}
.tl .step{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 14px 14px;margin:8px;position:relative}
.tl .dot{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;margin-bottom:8px}
.tl .step h4{color:var(--primary);font-size:17.5px;margin-bottom:4px}
.tl .step p{font-size:15px;color:var(--mid)}

/* matching */
.match-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.pool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--secondary);color:#fff;padding:10px 17px;border-radius:22px;font-weight:700;
  cursor:grab;user-select:none;font-size:16.5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chip.used{opacity:.35;pointer-events:none}
.chip.sel{outline:3px solid var(--warm);outline-offset:2px}
.targets{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;border:2px dashed var(--border);border-radius:12px;padding:10px 14px;background:#fafbff}
.slot .desc{flex:1;font-size:16px;color:var(--text)}
.slot .drop{min-width:130px;min-height:44px;border-radius:8px;background:#eef0f8;display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:15px;padding:8px 12px}
.slot.ok{border-color:var(--green);background:#effaf3}
.slot.ok .drop{background:var(--green);color:#fff;font-weight:700}
.slot.bad{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* quiz */
.quiz-head{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.pbar{height:12px;background:#e7e9f4;border-radius:8px;overflow:hidden;margin-top:10px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--secondary));transition:width .4s}
.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.q .qn{color:var(--accent);font-weight:800;font-size:14px}
.q .qt{font-size:19.5px;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fafbff;border:2px solid var(--border);
  border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;font-size:16.5px;transition:.15s}
.opt:hover{border-color:var(--secondary)}
.opt.correct{border-color:var(--green);background:#effaf3;font-weight:700}
.opt.wrong{border-color:var(--red);background:#fdeeee}
.opt.dim{opacity:.6}
.fb{margin-top:8px;font-size:15.5px;padding:11px 14px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.good{background:#effaf3;color:#1c7a4d} .fb.no{background:#fdeeee;color:#a83b3b}
.scorebox{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:16px;
  padding:26px;text-align:center;margin-top:10px;display:none}
.scorebox.show{display:block}
.scorebox .big{font-size:46px;font-weight:800}
.btn{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:10px;
  font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.18)}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;background:#eef0fb;color:var(--secondary);padding:3px 10px;border-radius:20px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px}

/* ===== 新增區塊 ===== */
/* compare：兩欄對照（梅納 vs 焦糖化、冷藏 vs 冷凍…） */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media(max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 18px 18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06);position:relative;overflow:hidden}
.cmp .col .cbar{position:static;height:6px;margin:0 -18px 14px;border-radius:0}
.cmp .col h4{font-size:20px;font-weight:800;margin-bottom:2px}
.cmp .col .en{color:var(--muted);font-size:13px;font-style:italic;margin-bottom:8px}
.cmp .col ul{margin-left:18px;font-size:15.5px;color:var(--mid)}
.cmp .col li{margin-bottom:5px}
.cmp-note{margin-top:12px;background:#eef0fb;border-left:5px solid var(--secondary);
  border-radius:0 10px 10px 0;padding:12px 16px;font-size:16px;color:var(--primary);font-weight:600}

/* table：資料表（維生素、添加物分類…） */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px}
.tbl th{background:var(--primary);color:#fff;text-align:left;padding:12px 14px;font-weight:700;font-size:15px}
.tbl td{padding:11px 14px;border-top:1px solid var(--border);color:var(--mid);vertical-align:top}
.tbl tr:nth-child(even) td{background:#fafbff}
.tbl td:first-child{color:var(--text);font-weight:700}

/* note：重點提示條 */
.note{background:#fff8e9;border-left:5px solid var(--warm);border-radius:0 12px 12px 0;
  padding:14px 18px;margin:14px 0;font-size:16px;color:var(--text)}
.note b{color:var(--primary)}
.note.key{background:#effaf3;border-left-color:var(--green)}
.note.warn{background:#fdeeee;border-left-color:var(--red)}
/* 國合班 A2 互動練習：拼音與越南文（build_a2.js 產生的內容才會用到） */
.py{display:block;font-size:.78em;font-weight:500;color:var(--mid);margin-top:2px}
.vn{display:block;font-size:.88em;font-weight:500;color:var(--secondary);margin-top:2px}
/* Shared classroom tasks: oral response, sentence support, then sample explanation. */
.class-activity{display:grid;gap:12px;min-width:0}
.class-activity .vn{display:block;color:#0E7C7B;font-size:15px;line-height:1.5;margin-top:4px}
.activity-time{color:#0E7C7B;font-weight:700;font-size:15px}
.activity-prompt{font-size:clamp(18px,2.3vw,23px);line-height:1.5}
.sentence-stem{padding:12px 16px;background:#EFFAF3;border-left:5px solid #2FA36B;color:#1A1A3E;line-height:1.6}
.class-activity label{font-size:14px;color:#52526B}
.activity-response{display:block;width:100%;max-width:100%;min-height:72px;border:1.5px solid #A0A0B5;border-radius:8px;padding:10px 12px;resize:vertical;font:inherit;font-size:17px;background:#fff;color:#1F1F2E}
.activity-answer{border:1px solid #E2E2EC;background:#fff;border-radius:8px;padding:10px 14px;font-size:16px;line-height:1.5}
.activity-answer summary{cursor:pointer;font-weight:700;color:#2D2A6E}
.activity-answer p{margin-top:10px}
.activity-response:focus-visible,.activity-answer summary:focus-visible{outline:3px solid #0E7C7B;outline-offset:3px}
.source-note{font-size:13px;color:#52526B;line-height:1.5;overflow-wrap:anywhere;margin-top:10px}
.source-note .vn{display:block;color:#0E7C7B;font-size:13px}
.lesson-links{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.lesson-links a{color:inherit;text-underline-offset:3px}
.feedback-reason,.feedback-transfer{margin-top:6px}
.feedback-transfer{font-weight:600}
@media(max-width:640px){header{position:relative!important}.class-activity{gap:10px}}
@media print{.activity-response{min-height:64px}}


.back .vn{color:#D7FAF3}.tbl-wrap{overflow-x:auto}
</style>
</head>

<script>window.__LESSON__={"week":10,"series":["#2D2A6E","#2FA36B","#F5A623","#5B4FB8","#00B8B8","#D65B5B"],"modules":[{"id":"m-type","nav":"劣變類型","kicker":"MODULE 1 · 劣變","h2":"劣變機制與限制保存期限的因素","lead":"以一瓶果醬串起配方、製程、包裝、開封與期限。分類是理解工具；主要失效原因須依產品和資料確認。","blocks":[{"type":"cards","title":"一瓶果醬：開封前後，條件不同\u003cspan class=\"vn\" lang=\"vi\">Một lọ mứt: trước sau mở, điều kiện khác\u003c/span>","cols":3,"items":[{"h":"① 配方與製程\u003cspan class=\"vn\" lang=\"vi\">Công thức và quy trình\u003c/span>","p":"糖、酸、熱處理與密封可能各有功能，要量測和驗證。\u003cspan class=\"vn\" lang=\"vi\">Đường, axit, nhiệt và kín có chức năng riêng, cần đo và kiểm chứng.\u003c/span>","c":"#2D2A6E"},{"h":"② 開封與取用\u003cspan class=\"vn\" lang=\"vi\">Mở và lấy dùng\u003c/span>","p":"開封後可能再污染；看冷藏與取用說明，不沿用未開封條件。\u003cspan class=\"vn\" lang=\"vi\">Mở có thể nhiễm lại; xem giữ lạnh, lấy dùng, không giữ giả định chưa mở.\u003c/span>","c":"#F5A623"},{"h":"③ 期限怎麼來？\u003cspan class=\"vn\" lang=\"vi\">Hạn đến từ đâu?\u003c/span>","p":"先定品質與安全指標，再用資料支持；算式不等於實測期限。\u003cspan class=\"vn\" lang=\"vi\">Định chỉ tiêu chất lượng, an toàn rồi dùng dữ liệu; phép tính khác hạn đã đo.\u003c/span>","c":"#2FA36B"}]},{"type":"cards","title":"四種劣變：可同時出現\u003cspan class=\"vn\" lang=\"vi\">Bốn kiểu biến đổi: có thể cùng xuất hiện\u003c/span>","cols":4,"items":[{"h":"微生物性\u003cspan class=\"vn\" lang=\"vi\">Do vi sinh vật\u003c/span>","p":"生長可能造成產氣、黴或異味；病原風險不一定有感官警訊。\u003cspan class=\"vn\" lang=\"vi\">Phát triển có thể tạo khí, mốc, mùi; nguy cơ bệnh không luôn có dấu hiệu.\u003c/span>","c":"#D65B5B"},{"h":"化學性\u003cspan class=\"vn\" lang=\"vi\">Do hóa học\u003c/span>","p":"氧化、非酵素褐變、維生素分解等。\u003cspan class=\"vn\" lang=\"vi\">Oxy hóa, hóa nâu không enzyme, phân hủy vitamin.\u003c/span>","c":"#F5A623"},{"h":"酵素性\u003cspan class=\"vn\" lang=\"vi\">Do enzyme\u003c/span>","p":"例如 PPO 褐變、果膠分解；依產品與條件而異。\u003cspan class=\"vn\" lang=\"vi\">Ví dụ hóa nâu PPO, phân giải pectin; tùy sản phẩm, điều kiện.\u003c/span>","c":"#2FA36B"},{"h":"物理性\u003cspan class=\"vn\" lang=\"vi\">Do vật lý\u003c/span>","p":"吸濕、失水、破碎、析晶或分層；也可能影響後續風險。\u003cspan class=\"vn\" lang=\"vi\">Hút ẩm, mất nước, vỡ, kết tinh, phân lớp; có thể ảnh hưởng rủi ro tiếp.\u003c/span>","c":"#5B4FB8"}]},{"type":"note","title":"","text":"這是理解機制的教學分類，不是互斥清單。安全不只與微生物有關，化學危害、異物或包裝失效也可能重要。\u003cspan class=\"vn\" lang=\"vi\">Đây là phân loại để hiểu cơ chế, không loại trừ nhau. An toàn không chỉ do vi sinh vật; nguy cơ hóa học, dị vật hay hỏng bao bì cũng quan trọng.\u003c/span>"},{"type":"cards","title":"aw 提供線索，還要看什麼？\u003cspan class=\"vn\" lang=\"vi\">aw là gợi ý, còn xem gì?\u003c/span>","cols":3,"items":[{"h":"生長與存活\u003cspan class=\"vn\" lang=\"vi\">Sinh trưởng và sống sót\u003c/span>","p":"低 aw 可限制生長，不能直接推論病原已死亡。\u003cspan class=\"vn\" lang=\"vi\">aw thấp có thể hạn chế tăng sinh, không suy mầm bệnh đã chết.\u003c/span>","c":"#2D2A6E"},{"h":"整個食品系統\u003cspan class=\"vn\" lang=\"vi\">Toàn hệ thực phẩm\u003c/span>","p":"還看 pH、溫度、氧、污染、配方及包裝。\u003cspan class=\"vn\" lang=\"vi\">Còn pH, nhiệt, oxy, nhiễm, công thức và bao bì.\u003c/span>","c":"#00B8B8"},{"h":"主要失效原因\u003cspan class=\"vn\" lang=\"vi\">Nguyên nhân mất chấp nhận\u003c/span>","p":"脆度、氧化、營養與微生物指標可能先後改變；要有試驗。\u003cspan class=\"vn\" lang=\"vi\">Giòn, oxy hóa, dinh dưỡng, vi sinh có thể đổi trước sau; cần thử nghiệm.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"不為所有果醬或洋芋片指定一個固定 aw，也不能只由 aw 選定保存期限。產品名稱、甜味或乾脆感都不能取代量測與驗證。\u003cspan class=\"vn\" lang=\"vi\">Không gán aw cố định cho mọi mứt hay khoai chiên, không dùng riêng aw định hạn. Tên sản phẩm, ngọt hay giòn không thay đo và kiểm chứng.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-technical-guides/water-activity-aw-foods\" target=\"_blank\" rel=\"noopener\">aw 定義與量測 / Định nghĩa và đo: FDA ↗\u003c/a>\u003c/p>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/media/184815/download\" target=\"_blank\" rel=\"noopener\">低水分食品污染風險 / Rủi ro nhiễm thực phẩm ít nước: FDA 2025 指引草案 ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 1｜果醬有哪些控制？\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 1: Mứt có biện pháp nào?\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"hurdles\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">同學說：「這瓶很甜、很酸，蓋子也凹下，所以能常溫放一年。」指出三個線索，並說還缺什麼資料。\u003cspan class=\"vn\" lang=\"vi\">Bạn nói lọ ngọt, chua, nắp lõm nên để phòng một năm. Nêu ba gợi ý và dữ liệu còn thiếu.\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>＿＿是線索；要證明能保存，還需＿＿。\u003cspan class=\"vn\" lang=\"vi\">___ là gợi ý; để chứng minh bảo quản được cần ___.\u003c/span>\u003c/div>\u003clabel for=\"general-w10-hurdles\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w10-hurdles\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>糖、酸與密封是可能控制線索；仍需 aw、pH、時間溫度、封口與期限試驗等資料。\u003cspan class=\"vn\" lang=\"vi\">Đường, axit, kín là gợi ý kiểm soát; vẫn cần aw, pH, thời gian nhiệt, độ kín và thử hạn.\u003c/span>\u003c/p>\u003cp>甜酸不是儀器量測，凹蓋也不能單獨證明製程安全；改配方或瓶型要評估。\u003cspan class=\"vn\" lang=\"vi\">Ngọt chua không là đo thiết bị, nắp lõm không tự chứng minh an toàn quy trình; đổi công thức, lọ cần đánh giá.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"同類食品，主要問題也可能不同\u003cspan class=\"vn\" lang=\"vi\">Cùng loại thực phẩm, vấn đề chính có thể khác\u003c/span>","cols":3,"items":[{"h":"冷藏乳品\u003cspan class=\"vn\" lang=\"vi\">Sữa giữ lạnh\u003c/span>","p":"需區分殺菌製程、包裝、開封與冷鏈。\u003cspan class=\"vn\" lang=\"vi\">Phân biệt xử lý nhiệt, bao bì, mở và chuỗi lạnh.\u003c/span>","c":"#2D2A6E"},{"h":"麵包\u003cspan class=\"vn\" lang=\"vi\">Bánh mì\u003c/span>","p":"老化、黴菌與餡料安全可能並存；依產品與保存標示。\u003cspan class=\"vn\" lang=\"vi\">Thoái hóa, mốc, an toàn nhân có thể cùng quan trọng; theo sản phẩm và nhãn.\u003c/span>","c":"#F5A623"},{"h":"果醬或乾燥食品\u003cspan class=\"vn\" lang=\"vi\">Mứt hay thực phẩm khô\u003c/span>","p":"也可能氧化、吸濕或長耐受菌；主因要靠資料確認。\u003cspan class=\"vn\" lang=\"vi\">Có thể oxy hóa, hút ẩm hay loài chịu đựng phát triển; cần dữ liệu xác nhận.\u003c/span>","c":"#2FA36B"}]}]},{"id":"m-principle","nav":"保存原理","kicker":"MODULE 2 · 原理","h2":"保存控制：抑制、降低數量與防再污染","lead":"保存同時處理生長、污染及各種劣變反應。某項技術可能同時造成抑制與部分殺滅，效果需對目標危害、產品和條件評估。","blocks":[{"type":"cards","title":"保存不只抑制與殺滅\u003cspan class=\"vn\" lang=\"vi\">Bảo quản không chỉ ức chế và tiêu diệt\u003c/span>","cols":3,"items":[{"h":"抑制生長\u003cspan class=\"vn\" lang=\"vi\">Ức chế tăng sinh\u003c/span>","p":"調整溫度、aw 或 pH 等；效果取決於對象與程度。\u003cspan class=\"vn\" lang=\"vi\">Chỉnh nhiệt, aw, pH; hiệu quả tùy đối tượng và mức.\u003c/span>","c":"#00B8B8"},{"h":"降低數量\u003cspan class=\"vn\" lang=\"vi\">Giảm số lượng\u003c/span>","p":"適當殺菌或去除可降低目標；不等於消除全部危害。\u003cspan class=\"vn\" lang=\"vi\">Xử lý diệt hay loại bỏ phù hợp giảm đối tượng, không bằng hết mọi nguy cơ.\u003c/span>","c":"#D65B5B"},{"h":"防污染、控反應\u003cspan class=\"vn\" lang=\"vi\">Tránh nhiễm, kiểm soát phản ứng\u003c/span>","p":"衛生與包裝防再污染；也可控氧化、酵素與水分移動。\u003cspan class=\"vn\" lang=\"vi\">Vệ sinh, bao bì tránh nhiễm lại; kiểm soát oxy hóa, enzyme và truyền ẩm.\u003c/span>","c":"#2FA36B"}]},{"type":"note","title":"","text":"殺菌後仍需適當包裝、衛生與儲存；商業滅菌針對預定常溫儲運條件建立，須依產品及容器驗證，不等於每一個微生物都絕對為零。\u003cspan class=\"vn\" lang=\"vi\">Sau xử lý vẫn cần bao bì, vệ sinh, bảo quản; vô trùng thương mại được thiết lập cho điều kiện lưu thông dự kiến, cần kiểm chứng theo sản phẩm và bao bì, không bằng tuyệt đối không còn mọi vi sinh vật.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-guides/guide-inspections-low-acid-canned-food-10\" target=\"_blank\" rel=\"noopener\">製程與適用條件 / Quy trình và phạm vi: FDA ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"冷凍與解凍：看溫度歷程\u003cspan class=\"vn\" lang=\"vi\">Đông lạnh, rã đông: xem lịch sử nhiệt\u003c/span>","cols":3,"items":[{"h":"冷凍時\u003cspan class=\"vn\" lang=\"vi\">Khi đông\u003c/span>","p":"可抑制生長，部分微生物會受損或死亡，但不能當作可靠殺菌步驟。\u003cspan class=\"vn\" lang=\"vi\">Có thể ức chế tăng sinh, vài vi sinh vật tổn thương hay chết, không là bước diệt khuẩn đáng tin.\u003c/span>","c":"#2D2A6E"},{"h":"解凍時\u003cspan class=\"vn\" lang=\"vi\">Khi rã\u003c/span>","p":"存活菌在適當條件下仍可能生長；不要長時間放室溫。\u003cspan class=\"vn\" lang=\"vi\">Vi sinh vật sống có thể tăng khi đủ điều kiện; tránh để phòng lâu.\u003c/span>","c":"#D65B5B"},{"h":"實際操作\u003cspan class=\"vn\" lang=\"vi\">Cách làm\u003c/span>","p":"可依產品採冷藏解凍，防滴液污染，並依指示及時烹調。\u003cspan class=\"vn\" lang=\"vi\">Theo sản phẩm có thể rã trong ngăn mát, tránh dịch nhiễm chéo, nấu đúng hướng dẫn.\u003c/span>","c":"#00B8B8"}]},{"type":"note","title":"","text":"低溫不會讓品質永遠不變；包裝、時間及解凍方式也會影響結果。解凍後不能直接沿用原冷凍期限。\u003cspan class=\"vn\" lang=\"vi\">Lạnh không giữ chất lượng mãi; bao bì, thời gian, cách rã cũng ảnh hưởng. Sau rã không trực tiếp dùng lại hạn đông ban đầu.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/freezing-and-food-safety\" target=\"_blank\" rel=\"noopener\">冷凍與食安 / Đông lạnh và an toàn: USDA FSIS ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"果醬的多重控制，要一起驗證\u003cspan class=\"vn\" lang=\"vi\">Nhiều biện pháp của mứt cần kiểm chứng cùng nhau\u003c/span>","cols":3,"items":[{"h":"糖與 aw\u003cspan class=\"vn\" lang=\"vi\">Đường và aw\u003c/span>","p":"糖可降低 aw，但甜不等於量到 aw；減糖會改變條件。\u003cspan class=\"vn\" lang=\"vi\">Đường có thể hạ aw, ngọt không bằng đã đo; giảm đường đổi điều kiện.\u003c/span>","c":"#2D2A6E"},{"h":"酸與 pH\u003cspan class=\"vn\" lang=\"vi\">Axit và pH\u003c/span>","p":"酸可改變 pH；酸味不是精確 pH，也不是所有菌的界線。\u003cspan class=\"vn\" lang=\"vi\">Axit đổi pH; vị chua không là pH chính xác hay giới hạn mọi loài.\u003c/span>","c":"#2FA36B"},{"h":"熱處理與密封\u003cspan class=\"vn\" lang=\"vi\">Gia nhiệt và kín\u003c/span>","p":"時間、溫度、容器及封口都要確認；瓶蓋凹下不代表完成安全驗證。\u003cspan class=\"vn\" lang=\"vi\">Xác nhận thời gian, nhiệt, lọ, nắp; nắp lõm không chứng minh đã kiểm chứng an toàn.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"柵欄是多個因子的組合效果，不保證每道稍做一點就有效；改配方、瓶型或製程要重新評估。本課不是自製罐藏處方。\u003cspan class=\"vn\" lang=\"vi\">Rào cản là tác dụng kết hợp, không bảo đảm mỗi yếu tố làm chút là đủ; đổi công thức, lọ, quy trình cần đánh giá lại. Bài này không là công thức đóng hộp tại nhà.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://nchfp.uga.edu/papers/UGA_Publications/2019_ProcessingJJ.pdf\" target=\"_blank\" rel=\"noopener\">果醬配方與處理範圍 / Phạm vi công thức và xử lý: UGA NCHFP ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"真空：減氧與安全分開看\u003cspan class=\"vn\" lang=\"vi\">Chân không: xét riêng giảm oxy và an toàn\u003c/span>","cols":3,"items":[{"h":"可能的功能\u003cspan class=\"vn\" lang=\"vi\">Chức năng có thể\u003c/span>","p":"減少部分氧接觸，可能延緩某些氧化或需氧菌生長。\u003cspan class=\"vn\" lang=\"vi\">Giảm một phần tiếp xúc oxy, có thể chậm vài oxy hóa hay loài hiếu khí.\u003c/span>","c":"#2D2A6E"},{"h":"做不到的保證\u003cspan class=\"vn\" lang=\"vi\">Điều chưa được bảo đảm\u003c/span>","p":"不保證無氧、無菌或不氧化；厭氧菌風險仍看食品條件。\u003cspan class=\"vn\" lang=\"vi\">Không bảo đảm hết oxy, vô trùng hay không oxy hóa; nguy cơ kỵ khí tùy điều kiện.\u003c/span>","c":"#D65B5B"},{"h":"還需要什麼？\u003cspan class=\"vn\" lang=\"vi\">Cần thêm gì?\u003c/span>","p":"看酸鹼、水活性、冷鏈、製程與密封完整性，依產品驗證。\u003cspan class=\"vn\" lang=\"vi\">Xem pH, aw, chuỗi lạnh, quy trình, độ kín và kiểm chứng theo sản phẩm.\u003c/span>","c":"#00B8B8"}]},{"type":"exp","title":"延伸：不要把技術名稱當成保證","items":[{"h":"抑制與殺滅可以並存","body":["低溫、乾燥、酸或其他處理可能對部分菌有殺滅效果，卻不等於可靠地消除全部目標危害。","熱處理也可能改變酵素、色澤、風味與營養；不能簡化成抑制一定品質較好或殺滅一定損失較大。"]},{"h":"商業滅菌與包裝完整性","body":["重點是規定儲存條件下達到商業無菌要求，不是絕對殺死所有微生物。產品配方、容器、時間、溫度與熱傳等需共同驗證。","不能只記一個 121°C 就推定全部食品都完成殺菌，亦不以蓋子凹下或真空單獨判定。"]},{"h":"多重控制的組合效果","body":["糖、酸、溫度與包裝的效力可能相互影響；組合需要驗證，不是幾道溫和步驟自動相加就一定夠。","例如不同發酵香腸或果醬的配方與製程不同，不能因名稱相同就推定都可常溫販售。"]}]},{"type":"match","title":"保存方法與功能配對","pairs":[{"label":"冷凍","desc":"以低溫等抑制生長，不能當作可靠殺菌步驟"},{"label":"適當殺菌製程","desc":"依目標與條件降低微生物數量，仍須防再污染"},{"label":"加糖","desc":"可降低水活性，效果需依配方量測"},{"label":"酸化","desc":"可降低 pH，效果依微生物與條件而異"},{"label":"殺菁","desc":"以鈍化酵素維持品質為主，也可減少部分微生物"}],"done":"✓ 配對完成！請再用一個食品例子說明。"}]},{"id":"m-shelf","nav":"保存期限","kicker":"MODULE 3 · 保存期限","h2":"有效日期：條件、指標與驗證","lead":"期限不是只看感官或算式；先定儲存條件與品質、安全指標，再依合適試驗和風險資料支持。開封、失溫及包裝損壞可能改變適用前提。","blocks":[{"type":"cards","title":"日期與保存條件，要一起讀\u003cspan class=\"vn\" lang=\"vi\">Đọc ngày cùng điều kiện bảo quản\u003c/span>","cols":3,"items":[{"h":"台灣：有效日期\u003cspan class=\"vn\" lang=\"vi\">Đài Loan: hạn sử dụng\u003c/span>","p":"食品標示須依適用規定；不得販售逾有效日期食品。\u003cspan class=\"vn\" lang=\"vi\">Nhãn theo quy định; không bán thực phẩm quá hạn.\u003c/span>","c":"#2D2A6E"},{"h":"跨國術語\u003cspan class=\"vn\" lang=\"vi\">Thuật ngữ các nước\u003c/span>","p":"Best before／賞味常側重品質；use by／消費期限常側重安全，須看所在地規定。\u003cspan class=\"vn\" lang=\"vi\">Best before thường về chất lượng; use by thường về an toàn, theo quy định nơi bán.\u003c/span>","c":"#F5A623"},{"h":"開封之後\u003cspan class=\"vn\" lang=\"vi\">Sau mở\u003c/span>","p":"原日期通常以未開封及指定條件為前提；依開封後說明，不能保證可放到原日期。\u003cspan class=\"vn\" lang=\"vi\">Ngày thường dựa trên chưa mở, điều kiện quy định; theo hướng dẫn sau mở, không bảo đảm đến ngày cũ.\u003c/span>","c":"#2FA36B"}]},{"type":"note","title":"","text":"本頁區分台灣有效日期與國外期限術語，並不表示台灣可以用賞味期限取代有效日期；也不由日期單獨判定一瓶食品的安全。\u003cspan class=\"vn\" lang=\"vi\">Phân biệt hạn Đài Loan và thuật ngữ nơi khác, không có nghĩa thay hạn bắt buộc ở Đài Loan bằng best before; ngày riêng không xác định an toàn một lọ.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=L0040001\" target=\"_blank\" rel=\"noopener\">台灣法規：第 15、22 條等 / Luật Đài Loan ↗\u003c/a>\u003c/p>\u003cp class=\"source-note\">\u003ca href=\"https://foodlabel.fda.gov.tw/FdaFrontEndApp/Law/Edit?SystemId=39148789-b32f-4e57-8406-6e7d9145f013\" target=\"_blank\" rel=\"noopener\">有效日期評估 / Đánh giá hạn: 台灣 TFDA ↗\u003c/a>\u003c/p>\u003cp class=\"source-note\">\u003ca href=\"https://www.caa.go.jp/policies/policy/food_labeling/food_sanitation/expiration_date\" target=\"_blank\" rel=\"noopener\">日本期限表示 / Nhãn hạn Nhật Bản: CAA ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 2｜開封後還能照原日期嗎？\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 2: Sau mở còn theo ngày cũ?\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"opened\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">假設標示摘錄：「未開封陰涼保存；開封後冷藏並 3 日內食用。」這瓶已開第 2 日，但昨晚放在桌上。未到 3 日就能直接說安全嗎？\u003cspan class=\"vn\" lang=\"vi\">Trích nhãn giả định: chưa mở để mát; sau mở giữ lạnh, dùng trong 3 ngày. Nay ngày 2, nhưng đêm qua để bàn. Chưa 3 ngày có thể nói an toàn ngay không?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>日期成立還要符合＿＿；現在缺少＿＿，不能只看＿＿。\u003cspan class=\"vn\" lang=\"vi\">Ngày còn cần đúng ___; nay thiếu ___, không chỉ xem ___.\u003c/span>\u003c/div>\u003clabel for=\"general-w10-opened\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w10-opened\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>還要符合冷藏條件；昨晚沒有遵守，不能只看第 2 日就宣告安全，需要依產品和失溫情況評估，不以試吃確認。\u003cspan class=\"vn\" lang=\"vi\">Còn cần đúng giữ lạnh; đêm qua không theo nên ngày 2 chưa chứng minh an toàn, cần xét sản phẩm và mất kiểm soát nhiệt, không nếm kiểm tra.\u003c/span>\u003c/p>\u003cp>3 日是本題假設，不是所有果醬的建議期限。未開封、開封後與失溫是不同條件。\u003cspan class=\"vn\" lang=\"vi\">3 ngày là giả định, không là hạn khuyên mọi mứt; chưa mở, sau mở, sai nhiệt là điều kiện khác nhau.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"期限驗證：問題不同，證據要搭配\u003cspan class=\"vn\" lang=\"vi\">Kiểm chứng hạn: câu hỏi khác cần bằng chứng phối hợp\u003c/span>","cols":3,"items":[{"h":"實際儲存試驗\u003cspan class=\"vn\" lang=\"vi\">Thử bảo quản thực\u003c/span>","p":"按指定條件定期檢查感官、理化與微生物；批次與取樣都要規劃。\u003cspan class=\"vn\" lang=\"vi\">Theo điều kiện kiểm tra giác quan, lý hóa, vi sinh; cần kế hoạch lô và lấy mẫu.\u003c/span>","c":"#2D2A6E"},{"h":"加速試驗\u003cspan class=\"vn\" lang=\"vi\">Thử gia tốc\u003c/span>","p":"用較嚴苛條件及適當模型估計；須確認機制與適用溫區。\u003cspan class=\"vn\" lang=\"vi\">Dùng điều kiện khắc nghiệt và mô hình phù hợp; xác nhận cơ chế, dải nhiệt.\u003c/span>","c":"#F5A623"},{"h":"挑戰試驗\u003cspan class=\"vn\" lang=\"vi\">Thử thách thức\u003c/span>","p":"由具能力實驗室針對目標危害評估生長或失活；不能涵蓋全部危害。\u003cspan class=\"vn\" lang=\"vi\">Phòng thí nghiệm đủ năng lực đánh giá tăng hay bất hoạt đối tượng; không bao hết mọi nguy cơ.\u003c/span>","c":"#D65B5B"}]},{"type":"note","title":"","text":"依產品與風險選用證據；不是「品質只做前兩種、安全只做挑戰」。實際儲存、模型、製程與必要的挑戰資料需共同判斷。\u003cspan class=\"vn\" lang=\"vi\">Chọn bằng chứng theo sản phẩm và rủi ro, không chia cứng chất lượng chỉ hai cách đầu, an toàn chỉ thách thức. Phối hợp bảo quản thực, mô hình, quy trình và dữ liệu thách thức cần thiết.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsai.ie/business-advice/running-a-food-business/food-safety-and-hygiene/shelf-life/shelf-life-determination\" target=\"_blank\" rel=\"noopener\">期限驗證方法 / Phương pháp kiểm chứng hạn: FSAI ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"Q₁₀ 假設練習：只算品質模型\u003cspan class=\"vn\" lang=\"vi\">Bài giả định Q₁₀: chỉ tính mô hình chất lượng\u003c/span>","cols":3,"items":[{"h":"已知假設\u003cspan class=\"vn\" lang=\"vi\">Giả định đã cho\u003c/span>","p":"同一品質反應，Q₁₀＝2；25°C 到達指定品質終點需 30 天。\u003cspan class=\"vn\" lang=\"vi\">Cùng phản ứng chất lượng, Q₁₀ = 2; ở 25°C tới mốc chất lượng cần 30 ngày.\u003c/span>","c":"#2D2A6E"},{"h":"35°C\u003cspan class=\"vn\" lang=\"vi\">Ở 35°C\u003c/span>","p":"假設速率加倍，達相同終點時間為 30 ÷ 2＝15 天。\u003cspan class=\"vn\" lang=\"vi\">Giả định tốc độ gấp đôi, cùng mốc cần 30 ÷ 2 = 15 ngày.\u003c/span>","c":"#D65B5B"},{"h":"15°C\u003cspan class=\"vn\" lang=\"vi\">Ở 15°C\u003c/span>","p":"若同一模型在此溫區仍成立，時間為 30 × 2＝60 天。\u003cspan class=\"vn\" lang=\"vi\">Nếu cùng mô hình còn đúng ở dải này, cần 30 × 2 = 60 ngày.\u003c/span>","c":"#00B8B8"}]},{"type":"note","title":"","text":"數字全是教學假設，不是果醬實測期限。Q₁₀ 是升 10°C 的速率比，不是固定天數；機制或品質終點改變時，不能直接外推，更不能用它單獨證明微生物安全。\u003cspan class=\"vn\" lang=\"vi\">Mọi số là giả định, không phải hạn mứt đã đo. Q₁₀ là tỷ số tốc độ khi tăng 10°C, không là số ngày cố định; đổi cơ chế hay mốc chất lượng thì không ngoại suy trực tiếp, càng không tự chứng minh an toàn vi sinh.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://foodlabel.fda.gov.tw/FdaFrontEndApp/Law/Edit?SystemId=39148789-b32f-4e57-8406-6e7d9145f013\" target=\"_blank\" rel=\"noopener\">加速評估的適用範圍 / Phạm vi đánh giá gia tốc: TFDA ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 3｜算出模型，再說限制\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 3: Tính mô hình rồi nói giới hạn\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"q10\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">假設同一品質反應 Q₁₀＝2，25°C 達指定品質終點需 30 天。35°C 要幾天？算完就能直接印有效日期嗎？\u003cspan class=\"vn\" lang=\"vi\">Giả định cùng phản ứng chất lượng Q₁₀ = 2, ở 25°C tới mốc cần 30 ngày. 35°C cần mấy ngày? Tính xong in hạn ngay được không?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>模型估計＿＿天；還不能當有效日期，因為＿＿。\u003cspan class=\"vn\" lang=\"vi\">Mô hình ước ___ ngày; chưa thành hạn vì ___.\u003c/span>\u003c/div>\u003clabel for=\"general-w10-q10\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w10-q10\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>35°C 的速率是兩倍，同終點時間估為 15 天；尚需模型適用性、實際儲存及微生物安全等驗證。\u003cspan class=\"vn\" lang=\"vi\">35°C tốc độ gấp đôi, cùng mốc ước 15 ngày; cần kiểm chứng mô hình, bảo quản thực, an toàn vi sinh.\u003c/span>\u003c/p>\u003cp>這是固定假設下的品質計算，不代表在 15 天內必然安全，也不保證所有溫度都可外推。\u003cspan class=\"vn\" lang=\"vi\">Đây là phép tính chất lượng theo giả định, không bảo đảm an toàn 15 ngày hay ngoại suy mọi nhiệt.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"note","title":"","text":"果醬出現黴或其他腐敗跡象時，整瓶內容物應丟棄，不只挖掉表面再吃。取用與保存仍依產品標示；不把某一種自製果醬的天數套用全部產品。\u003cspan class=\"vn\" lang=\"vi\">Mứt có mốc hay dấu hỏng khác thì bỏ toàn bộ, không chỉ múc lớp trên rồi ăn. Lấy dùng, bảo quản theo nhãn, không áp số ngày một loại mứt nhà làm cho mọi sản phẩm.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://nchfp.uga.edu/how/make-jam-jelly/storing-home-canned-jams-and-jellies/\" target=\"_blank\" rel=\"noopener\">果醬發黴與保存 / Mốc và bảo quản mứt: UGA NCHFP ↗\u003c/a>\u003c/p>"},{"type":"exp","title":"延伸：Q₁₀ 與試驗如何解讀？","items":[{"h":"速率比與時間不是同一量","body":["Q₁₀＝k(T＋10)/k(T)。只有在模型成立且品質終點相同等條件下，達終點時間才可按速率比反向估算。","本課 Q₁₀＝2、25°C 30 天都是假設；不把常見 2–3 寫成所有食品的固定實測值。"]},{"h":"不同失效模式可能改變排序","body":["升溫可能改變反應機制、相態、包裝性能或微生物條件；低溫也可能帶來不同品質問題。","加速模型估算後須適當驗證，不能把品質曲線直接外推成安全有效日期。"]},{"h":"挑戰試驗的能力與範圍","body":["依目標可能測生長潛勢或殺滅效果，需由具能力實驗室依合適規範設計，不是本課學生的接種活動。","試驗菌株、批次、條件與最差情境影響結論；單一合格結果不能涵蓋所有危害與所有後續失溫情形。"]}]},{"type":"cards","title":"回顧\u003cspan class=\"vn\" lang=\"vi\">Ôn tập\u003c/span>","cols":2,"items":[{"h":"先看機制，再選控制方法與驗證指標\u003cspan class=\"vn\" lang=\"vi\">Xem cơ chế rồi chọn biện pháp và chỉ tiêu\u003c/span>"},{"h":"抑制、降低數量、防再污染都重要\u003cspan class=\"vn\" lang=\"vi\">Ức chế, giảm số lượng và tránh nhiễm lại đều quan trọng\u003c/span>"},{"h":"日期要連同未開封、保存條件一起讀\u003cspan class=\"vn\" lang=\"vi\">Đọc ngày cùng chưa mở và điều kiện bảo quản\u003c/span>"},{"h":"Q₁₀ 是有條件的模型，不是安全保證\u003cspan class=\"vn\" lang=\"vi\">Q₁₀ là mô hình có điều kiện, không bảo đảm an toàn\u003c/span>"}]}]},{"id":"m-quiz","nav":"綜合測驗","kicker":"MODULE 4 · 綜合測驗","h2":"小測驗：檢核學習成效","lead":"與 A2 版共用 10 題核心檢核；將觀察、模型結果與安全證據分開，再練習中文表達。","blocks":[{"type":"quiz","items":[{"q":"「ức chế」的中文是？\u003cspan class=\"vn\" lang=\"vi\">ức chế tiếng Trung là gì?\u003c/span>","o":["抑制 yìzhì","殺菌 shājùn","氧化 yǎnghuà","腐敗 fǔbài"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 抑制是限制生長或反應，不必代表微生物全部死亡；條件改變後的風險還要重新看。\u003cspan class=\"vn\" lang=\"vi\">Ức chế là hạn chế tăng hay phản ứng, không nhất thiết mọi vi sinh vật chết; đổi điều kiện cần xét lại.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：抑制不等於全部殺死。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Ức chế không bằng giết hết.\u003c/span>\u003c/div>"},{"q":"油脂與氧相關的變質，較接近哪個詞？\u003cspan class=\"vn\" lang=\"vi\">Biến đổi dầu liên quan oxy gần với từ nào?\u003c/span>","o":["殺菁 shājīng","糊化 húhuà","氧化 yǎnghuà","殺菌 shājùn"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 氧化與水解不同；減氧、避光等可延緩部分反應，但不能宣稱完全永遠不氧化。\u003cspan class=\"vn\" lang=\"vi\">Oxy hóa khác thủy phân; giảm oxy, ánh sáng có thể làm chậm vài phản ứng, không bảo đảm mãi không oxy hóa.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：防氧化要看氧、光、熱與產品條件。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Chống oxy hóa xem oxy, sáng, nhiệt, sản phẩm.\u003c/span>\u003c/div>"},{"q":"「bǎocún qíxiàn」是哪個詞？\u003cspan class=\"vn\" lang=\"vi\">bǎocún qíxiàn là từ nào?\u003c/span>","o":["賞味期限 dùng tốt nhất trước","保存期限 hạn sử dụng","水活性 hoạt độ nước","柵欄技術 công nghệ rào cản"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 保存期限需要指明產品、包裝和保存條件；開封或失溫後，不能直接沿用原來的假設。\u003cspan class=\"vn\" lang=\"vi\">Hạn cần sản phẩm, bao bì, điều kiện; mở hay sai nhiệt thì không trực tiếp dùng giả định cũ.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：期限要連同保存條件一起讀。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Đọc hạn cùng điều kiện.\u003c/span>\u003c/div>"},{"q":"已確認餅乾因吸濕變軟，較屬哪類劣變？\u003cspan class=\"vn\" lang=\"vi\">Đã xác nhận bánh mềm vì hút ẩm, thuộc loại nào?\u003c/span>","o":["微生物性 Do vi sinh vật","化學氧化 Oxy hóa","酵素性 Do enzyme","物理性 Do vật lý"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 本題已給吸濕原因，所以屬物理性；若只有「變軟」觀察，還不能排除其他機制。同一食品也可有多種劣變。\u003cspan class=\"vn\" lang=\"vi\">Câu cho nguyên nhân hút ẩm nên vật lý; chỉ thấy mềm chưa loại cơ chế khác, cùng sản phẩm có nhiều kiểu đổi.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：先確認原因，再分類。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Xác nhận nguyên nhân rồi phân loại.\u003c/span>\u003c/div>"},{"q":"只知道果醬很甜、酸且凹蓋，哪句較恰當？\u003cspan class=\"vn\" lang=\"vi\">Chỉ biết mứt ngọt, chua, nắp lõm, câu nào phù hợp?\u003c/span>","o":["還需 aw、pH、製程及期限驗證 Cần aw, pH, quy trình, kiểm chứng hạn","已證明無菌 Đã chứng minh vô trùng","所有配方都能常溫一年 Mọi công thức để phòng một năm","甜味就是精確 aw Ngọt là aw chính xác"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 這些是線索，不是完整測量與驗證；糖、酸和密封的效果與程度、製程和產品有關。\u003cspan class=\"vn\" lang=\"vi\">Đây là gợi ý, không là đo và kiểm chứng đầy đủ; hiệu quả đường, axit, kín tùy mức, quy trình và sản phẩm.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：有柵欄線索，仍要量測驗證。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Có gợi ý rào cản vẫn cần đo, kiểm chứng.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://nchfp.uga.edu/papers/UGA_Publications/2019_ProcessingJJ.pdf\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"冷凍雞肉解凍，哪個做法較能控制風險？\u003cspan class=\"vn\" lang=\"vi\">Rã đông gà, cách nào giúp kiểm soát rủi ro?\u003c/span>","o":["放桌上一整天 Để bàn cả ngày","依指示冷藏解凍，避免滴液污染 Theo nhãn rã lạnh, tránh dịch nhiễm","泡溫水一整晚 Ngâm ấm cả đêm","解凍後不再看保存時間 Sau rã không xem thời gian nữa"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 冷凍不能當可靠殺菌，存活菌在解凍後適當條件下仍可生長。冷藏解凍時也要防止肉汁污染即食食品。\u003cspan class=\"vn\" lang=\"vi\">Đông không là diệt khuẩn đáng tin; vi sinh vật sống có thể tăng sau rã. Rã lạnh vẫn tránh dịch nhiễm thức ăn ăn liền.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：解凍也要控溫、防交叉污染。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Rã cũng kiểm soát nhiệt, tránh nhiễm chéo.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/freezing-and-food-safety\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"真空包裝的效果，哪句較正確？\u003cspan class=\"vn\" lang=\"vi\">Về chân không, câu nào phù hợp?\u003c/span>","o":["保證所有菌都死 Bảo đảm mọi khuẩn chết","保證油脂永遠不氧化 Dầu không bao giờ oxy hóa","真空必定讓肉毒桿菌生長 Chân không chắc làm botulinum tăng","可減氧，但安全仍看其他條件與驗證 Giảm oxy, an toàn còn tùy điều kiện và kiểm chứng"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 減少氧不等於無菌，也不代表厭氧菌一定生長；還需要適合的食品條件。低酸等產品須有合適的其他控制。\u003cspan class=\"vn\" lang=\"vi\">Giảm oxy không bằng vô trùng hay chắc loài kỵ khí tăng; còn cần điều kiện phù hợp và kiểm soát khác.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：真空只是控制的一部分。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Chân không chỉ là một phần kiểm soát.\u003c/span>\u003c/div>"},{"q":"本課假設 Q₁₀＝2，25°C 品質終點 30 天，35°C 同終點估幾天？\u003cspan class=\"vn\" lang=\"vi\">Giả định Q₁₀ = 2, mốc chất lượng 30 ngày ở 25°C, 35°C ước bao nhiêu?\u003c/span>","o":["60 天","30 天","15 天","10 天"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 速率加倍，同一模型及品質終點下，時間為 30÷2＝15 天。數字是教學假設，不是實測有效日期，也不能單獨證明微生物安全。\u003cspan class=\"vn\" lang=\"vi\">Tốc độ gấp đôi, cùng mô hình và mốc thì 30 ÷ 2 = 15 ngày. Số giả định, không là hạn đo hay chứng minh an toàn vi sinh.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：品質模型估計 15 天，仍要驗證。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Mô hình chất lượng ước 15 ngày, vẫn cần kiểm chứng.\u003c/span>\u003c/div>"},{"q":"假設標示「開封後冷藏並 3 日內用完」，哪個說法較正確？\u003cspan class=\"vn\" lang=\"vi\">Nhãn giả định: sau mở giữ lạnh, dùng trong 3 ngày; câu nào phù hợp?\u003c/span>","o":["要同時符合冷藏與時間，失溫不能只靠日期 Cần cả lạnh và thời gian, sai nhiệt không chỉ xem ngày","只要第 2 日就一定安全 Ngày 2 chắc an toàn","蓋回去就算未開封 Đậy lại là chưa mở","所有果醬都適用 3 日 Mọi mứt đều 3 ngày"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 3 日只屬本題假設。開封、污染和溫度歷程影響期限是否適用；原未開封日期不能保證開封後同樣安全。\u003cspan class=\"vn\" lang=\"vi\">3 ngày chỉ là giả định bài; mở, nhiễm, lịch sử nhiệt ảnh hưởng điều kiện hạn, ngày chưa mở không bảo đảm sau mở.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：開封後要看新的保存條件。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Sau mở xem điều kiện mới.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://foodlabel.fda.gov.tw/FdaFrontEndApp/Law/Edit?SystemId=39148789-b32f-4e57-8406-6e7d9145f013\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"果醬表面已長黴，應怎麼處理？\u003cspan class=\"vn\" lang=\"vi\">Mứt đã mốc mặt, xử lý thế nào?\u003c/span>","o":["只挖掉黴，吃下面 Múc mốc, ăn dưới","丟棄整瓶內容物 Bỏ toàn bộ nội dung lọ","加熱一下就保證安全 Đun chút là chắc an toàn","聞起來正常就繼續吃 Mùi thường thì ăn tiếp"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> NCHFP 建議果醬、果凍有黴或其他腐敗跡象時，丟棄整瓶內容物；不能靠挖掉表面或再加熱保證安全。\u003cspan class=\"vn\" lang=\"vi\">NCHFP khuyên bỏ toàn bộ khi mứt, thạch có mốc hay dấu hỏng; múc mặt hoặc hâm không bảo đảm an toàn.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：果醬長黴，不只挖掉表面。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Mứt mốc không chỉ múc lớp mặt.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://nchfp.uga.edu/how/make-jam-jelly/storing-home-canned-jams-and-jellies/\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"}]}]}]};</script>
<script>
/*
 * runtime.client.js — 跑在瀏覽器裡的渲染器（17 週共用，逐字內嵌進每份 HTML）
 * 讀 window.__LESSON__ 的資料，把 modules / blocks 畫出來。
 * 互動行為（翻卡、展開、配對、測驗）沿用週1 手寫版的做法，不要另創一套。
 */
(function () {
  var D = window.__LESSON__;
  var SERIES = D.series;
  var $ = function (s) { return document.querySelector(s); };
  // 國合班 A2 版（D.a2）：介面文字加越南文；一般班 U() 只回中文，畫面與原本完全相同
  var A2 = !!D.a2;
  function U(zh, vn) { return A2 ? zh + " " + vn : zh; }

  /* ---------- 學習歷程記錄（Supabase） ----------
     只在 lesson.js 注入 D.track = {url, key} 的週次啟用（lib/tracking.json 的 weeks）；
     其他週 TRACK.on 為 false，send() 是空函式，教材行為完全不變。
     只送「學號代碼」與互動事件，不送姓名。送失敗就丟掉，不重試、不阻擋教材。 */
  var CTX = { mod: null, bi: 0 };   // 目前正在渲染的模組 id 與區塊序號（render 是同步的）
  var TRACK = (function () {
    var cfg = D.track;
    var noop = function () {};
    if (!cfg || !cfg.url || !cfg.key) return { on: false, send: noop, flush: noop, code: function () { return ""; }, setCode: noop };
    var KEY = "ifs_code", DKEY = "ifs_device";
    var rnd = function () { return Math.random().toString(36).slice(2, 10); };
    var sid = rnd() + Date.now().toString(36);
    // device_id：同一支手機／瀏覽器跨次開頁不變。學生後來才填學號代碼時，先前的 anon 事件可靠它回接。
    var did = "";
    try { did = localStorage.getItem(DKEY) || ""; if (!did) { did = "d" + rnd() + rnd(); localStorage.setItem(DKEY, did); } } catch (e) { did = "d" + rnd(); }
    var q = [], timer = null;
    function code() { try { return (localStorage.getItem(KEY) || "").trim(); } catch (e) { return ""; } }
    function setCode(v) { try { localStorage.setItem(KEY, (v || "").trim().slice(0, 20)); } catch (e) {} }
    function cut(s, n) { return s == null ? null : String(s).slice(0, n); }
    // 欄位長度與 payload 大小在前端先截到資料表 CHECK 的上限：PostgREST 批次 INSERT 是原子的，
    // 一筆違反 CHECK 整批都會被拒，而我們失敗即丟，會靜默掉整個 4 秒窗口。
    function send(event, mod, block, payload) {
      var p = payload || {};
      var ps = JSON.stringify(p);
      if (ps.length > 1800) p = { trunc: true, keys: Object.keys(p).slice(0, 10) };
      q.push({
        student_code: cut(code(), 20) || "anon", device_id: cut(did, 40), week: D.week || 0,
        module_id: cut(mod, 30), block_type: cut(block, 10), event: cut(event, 30),
        payload: p, session_id: cut(sid, 40), build: cut(D.build, 16), client_ts: new Date().toISOString(),
      });
      if (q.length >= 40) flush();
      else if (!timer) timer = setTimeout(flush, 4000);
    }
    function flush() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!q.length) return;
      var body = JSON.stringify(q.splice(0, 50));
      try {
        fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/ifs_lesson_events", {
          method: "POST", keepalive: true, body: body,
          headers: { "Content-Type": "application/json", "apikey": cfg.key, "Prefer": "return=minimal" },
        }).catch(noop);
      } catch (e) { /* 舊瀏覽器沒有 fetch：不記錄 */ }
      if (q.length) timer = setTimeout(flush, 1000);
    }
    window.addEventListener("pagehide", flush);
    return { on: true, send: send, flush: flush, code: code, setCode: setCode };
  })();

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function colorAt(given, i) { return given || SERIES[i % SERIES.length]; }
  function gridCls(n) { return "grid g" + (n === 2 || n === 3 || n === 4 ? n : 3); }
  function listHtml(v) {
    // body 可以是字串或字串陣列；陣列渲染成 <ul>
    if (v == null) return "";
    if (typeof v === "string") return '<p>' + v + '</p>';
    return '<ul>' + v.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
  }

  /* ---------- 區塊標題 ---------- */
  function heading(frag, b) {
    if (b.title) frag.appendChild(el("div", "sec-title", '<span class="bar"></span>' + b.title));
    if (b.hint) frag.appendChild(el("div", "hint", b.hint));
  }

  /* ---------- 各區塊 ---------- */
  var BLOCKS = {};

  BLOCKS.flips = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (d, i) {
      var c = colorAt(d.c, i);
      var card = el("div", "flip");
      if (b.h) card.style.height = b.h + "px";
      card.innerHTML =
        '<div class="flip-in">' +
        '<div class="face front"><div class="cbar" style="background:' + c + '"></div>' +
        '<div class="t">' + d.t + '</div><div class="en">' + (d.en || "") + '</div>' +
        '<div class="tap">▸ ' + U("點我看解釋", "Chạm để xem") + '</div></div>' +
        '<div class="face back"><div class="cbar" style="background:' + c + '"></div>' +
        '<p>' + d.b + '</p></div></div>';
      var mod = CTX.mod, bi = CTX.bi;
      card.onclick = function () {
        if (card.classList.toggle("on")) TRACK.send("flip_open", mod, "flips", { b: bi, i: i, t: d.t });
      };
      g.appendChild(card);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.exp = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div");
    b.items.forEach(function (t, i) {
      var box = el("div", "exp");
      var res = t.res ? '<div style="margin-top:10px;font-size:13px;color:var(--secondary);font-weight:700">🔗 ' + t.res + '</div>' : "";
      box.innerHTML =
        '<button><span class="num">' + (i + 1) + '</span><span>' + t.h + '</span>' +
        '<span class="tag">' + (t.tag || "") + '</span><span class="chev">›</span></button>' +
        '<div class="body">' + listHtml(t.body) + res + '</div>';
      var body = box.querySelector(".body");
      var mod = CTX.mod, bi = CTX.bi;
      box.querySelector("button").onclick = function () {
        var on = box.classList.toggle("on");
        if (!on) { body.style.maxHeight = "0px"; return; }
        TRACK.send("exp_open", mod, "exp", { b: bi, i: i, h: t.h });
        // 用實際內容高度展開，避免長段落被固定 max-height 截掉。
        // 必須先解除 max-height 再量：在 max-height:0 的狀態下量 scrollHeight 會得到 0，
        // 面板就只會開一條縫（實測過）。量完歸零並強制重排，transition 才有起點。
        body.style.maxHeight = "none";
        var h = body.scrollHeight;
        body.style.maxHeight = "0px";
        void body.offsetHeight;
        body.style.maxHeight = h + "px";
      };
      host.appendChild(box);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.cards = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var box = el("div", "card");
      box.style.borderTop = "4px solid " + accent;
      box.innerHTML = '<div class="h">' + c.h + '</div>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        (c.li ? '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>' : "") +
        (c.p ? '<p style="margin-top:8px;font-size:15.5px;color:var(--mid)">' + c.p + '</p>' : "");
      g.appendChild(box);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.timeline = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "tl");
    b.steps.forEach(function (s, i) {
      var st = el("div", "step");
      st.innerHTML = '<div class="dot" style="background:' + colorAt(s.c, i) + '">' + (i + 1) + '</div>' +
        '<h4>' + s.h + '</h4><p>' + s.p + '</p>';
      host.appendChild(st);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.compare = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "cmp");
    [b.left, b.right].forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var col = el("div", "col");
      col.innerHTML = '<div class="cbar" style="background:' + accent + '"></div>' +
        '<h4 style="color:' + accent + '">' + c.h + '</h4>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
      wrap.appendChild(col);
    });
    f.appendChild(wrap);
    if (b.note) f.appendChild(el("div", "cmp-note", b.note));
    return f;
  };

  BLOCKS.table = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "tblwrap");
    var html = '<table class="tbl"><thead><tr>' +
      b.head.map(function (h) { return '<th>' + h + '</th>'; }).join("") + '</tr></thead><tbody>' +
      b.rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join("") + '</tr>';
      }).join("") + '</tbody></table>';
    wrap.innerHTML = html;
    f.appendChild(wrap); return f;
  };

  BLOCKS.note = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    f.appendChild(el("div", "note" + (b.kind ? " " + b.kind : ""), b.text));
    return f;
  };

  BLOCKS.match = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "match-wrap");
    var pool = el("div", "pool"), targets = el("div", "targets");
    var pairs = b.pairs;
    var order = pairs.slice().sort(function () { return Math.random() - 0.5; });
    var selected = null, solved = 0, errors = 0, t0 = null;
    var mod = CTX.mod, bi = CTX.bi;
    var msg = el("div");
    msg.style.cssText = "margin-top:14px;font-weight:700;color:var(--green)";

    function tryMatch(slot, key) {
      if (slot.classList.contains("ok")) return;
      if (t0 === null) t0 = Date.now();
      if (slot.dataset.k === key) {
        slot.classList.add("ok"); slot.classList.remove("bad");
        slot.querySelector(".drop").textContent = key;
        var chip = pool.querySelector('.chip[data-k="' + key + '"]');
        chip.classList.add("used"); chip.classList.remove("sel");
        selected = null; solved++;
        TRACK.send("match_ok", mod, "match", { b: bi, label: key });
        if (solved === pairs.length) {
          msg.textContent = b.done || U("✓ 全部答對！", "Đúng hết!");
          TRACK.send("match_done", mod, "match", { b: bi, n: pairs.length, errors: errors, ms: Date.now() - t0 });
        }
      } else {
        errors++;
        TRACK.send("match_bad", mod, "match", { b: bi, label: key, slot: slot.dataset.k });
        slot.classList.add("bad");
        setTimeout(function () { slot.classList.remove("bad"); }, 350);
      }
    }
    order.forEach(function (q) {
      var c = el("div", "chip"); c.textContent = q.label; c.draggable = true; c.dataset.k = q.label;
      c.addEventListener("dragstart", function (e) { e.dataTransfer.setData("k", q.label); });
      c.onclick = function () {
        if (c.classList.contains("used")) return;
        if (selected === c) { c.classList.remove("sel"); selected = null; return; }
        pool.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("sel"); });
        c.classList.add("sel"); selected = c;
      };
      pool.appendChild(c);
    });
    pairs.forEach(function (q) {
      var s = el("div", "slot"); s.dataset.k = q.label;
      s.innerHTML = '<div class="drop">' + U("拖到這裡", "Kéo vào đây") + '</div><div class="desc">' + q.desc + '</div>';
      s.addEventListener("dragover", function (e) { e.preventDefault(); });
      s.addEventListener("drop", function (e) { e.preventDefault(); tryMatch(s, e.dataTransfer.getData("k")); });
      s.onclick = function () { if (selected) tryMatch(s, selected.dataset.k); };
      targets.appendChild(s);
    });
    host.appendChild(pool); host.appendChild(targets); host.appendChild(msg);
    f.appendChild(host); return f;
  };

  /* 結果代碼：把作答結果編成一串可貼給老師的代碼（FSQ1.<base64>.<檢查碼>）。
     解碼與彙整用專案根目錄的「食品科學概論_測驗成績解碼器.html」。 */
  function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
  function checksum(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1679616; // 36^4
    return h.toString(36);
  }

  BLOCKS.quiz = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var items = b.items, n = items.length;
    var head = el("div", "quiz-head");
    head.innerHTML =
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
      '<input class="qid" placeholder="' + U("學號（交成績必填）", "Mã số SV") + '" style="flex:1;min-width:130px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px">' +
      '<input class="qname" placeholder="' + U("姓名", "Họ tên") + '" style="flex:1;min-width:100px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px"></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
      '<strong class="qprog">' + U("進度", "Tiến độ") + ' 0 / ' + n + '</strong>' +
      '<span class="qscore" style="color:var(--secondary);font-weight:800">' + U("得分", "Điểm") + ' 0</span></div>' +
      '<div class="pbar"><div class="pfill"></div></div>';
    var box = el("div");
    var sb = el("div", "scorebox");
    sb.innerHTML = '<div>' + U("你的成績", "Điểm của bạn") + '</div><div class="big"><span class="fscore">0</span> / ' + n + '</div>' +
      '<div class="smsg" style="margin:8px 0 16px"></div>' +
      '<div class="rcwrap" style="margin:0 auto 16px;max-width:560px;text-align:left">' +
      '<div style="font-weight:700;margin-bottom:6px">' + U("結果代碼（請複製後，貼到老師指定的表單或訊息）", "— Mã kết quả: sao chép và gửi cho thầy/cô") + '</div>' +
      '<textarea class="rcode" readonly rows="3" style="width:100%;box-sizing:border-box;font-family:monospace;font-size:12px;padding:8px;border:1.5px solid var(--line,#ccc);border-radius:8px;resize:none"></textarea>' +
      '<div class="rmsg" style="font-size:13px;color:#B34700;margin-top:4px"></div>' +
      '<button class="btn copyrc" style="margin-top:8px">📋 ' + U("複製結果代碼", "Sao chép mã") + '</button></div>' +
      '<button class="btn ghost">' + U("重新測驗", "Làm lại") + '</button>';

    var answered = 0, score = 0, picks = [], qt0 = null, attempt = 0;
    var mod = CTX.mod, bi = CTX.bi;
    // 測驗的學號欄與頁首的學號代碼同步（兩邊填任一邊都行）
    var qidInput = head.querySelector(".qid");
    if (TRACK.on) {
      if (TRACK.code()) qidInput.value = TRACK.code();
      qidInput.addEventListener("change", function () {
        TRACK.setCode(qidInput.value);
        var top = $("#ifs-code"); if (top) top.value = TRACK.code();
      });
    }
    function updateProg() {
      head.querySelector(".qprog").textContent = U("進度", "Tiến độ") + " " + answered + " / " + n;
      head.querySelector(".qscore").textContent = U("得分", "Điểm") + " " + score;
      head.querySelector(".pfill").style.width = (answered / n * 100) + "%";
    }
    function finish() {
      sb.querySelector(".fscore").textContent = score;
      var pct = score / n, m;
      if (score === n) m = U("本次全對！請再用自己的話說明果醬的保存條件與期限驗證。", "Đúng hết lần này! Hãy giải thích tình huống bằng lời của mình.");
      else if (pct >= 0.8) m = U("很棒！觀念相當扎實。", "Rất tốt!");
      else if (pct >= 0.6) m = U("不錯，再複習幾個弱點就更好。", "Khá tốt, ôn lại vài chỗ nữa nhé.");
      else m = U("建議回到前面單元再看一次翻卡與展開內容。", "Hãy xem lại các phần phía trước.");
      sb.querySelector(".smsg").textContent = m;

      var sid = head.querySelector(".qid").value.trim();
      var sname = head.querySelector(".qname").value.trim();
      var korr = items.map(function (item, i) { return picks[i] === item.a ? 1 : 0; }).join("");
      var payload = JSON.stringify({
        w: D.week || 0, c: A2 ? "a2" : undefined, id: sid, nm: sname, s: score, n: n,
        a: picks, k: korr, t: new Date().toISOString().slice(0, 16),
      });
      var body = b64utf8(payload);
      var code = "FSQ1." + body + "." + checksum(body);
      sb.querySelector(".rcode").value = code;
      sb.querySelector(".rmsg").textContent = sid ? "" : U("⚠ 尚未填學號 —— 請回到測驗上方填入學號後重新測驗，否則老師無法登記成績。", "Chưa nhập mã số SV: hãy nhập ở trên rồi làm lại.");
      TRACK.send("quiz_done", mod, "quiz", { b: bi, attempt: attempt, score: score, n: n, picks: picks, ms: qt0 ? Date.now() - qt0 : null });
      TRACK.flush();

      sb.classList.add("show");
      sb.scrollIntoView({ behavior: "smooth" });
    }
    function pick(qel, item, oi) {
      if (qel.dataset.done === "1") return;
      qel.dataset.done = "1"; answered++;
      if (qt0 === null) qt0 = Date.now();
      picks[parseInt(qel.dataset.qi, 10)] = oi;
      TRACK.send("quiz_answer", mod, "quiz", { b: bi, attempt: attempt, qi: parseInt(qel.dataset.qi, 10), pick: oi, ok: oi === item.a });
      qel.querySelectorAll(".opt").forEach(function (btn, i) {
        btn.classList.add("dim");
        if (i === item.a) btn.classList.add("correct");
        if (i === oi && oi !== item.a) btn.classList.add("wrong");
      });
      var fb = qel.querySelector(".fb");
      if (oi === item.a) { score++; fb.classList.add("good"); fb.innerHTML = U("✓ 正確！", "Đúng!") + item.e; }
      else { fb.classList.add("no"); fb.innerHTML = U("✗ 正解：", "Sai. Đáp án:") + item.o[item.a] + "。" + item.e; }
      fb.classList.add("show"); updateProg();
      if (answered === n) finish();
    }
    function build() {
      box.innerHTML = ""; answered = 0; score = 0; picks = []; qt0 = null; attempt++; updateProg();
      sb.classList.remove("show");
      items.forEach(function (item, qi) {
        var qel = el("div", "q"); qel.dataset.done = "0"; qel.dataset.qi = qi;
        qel.innerHTML = '<div class="qn">第 ' + (qi + 1) + ' 題' + (A2 ? ' · Câu ' + (qi + 1) : '') + '</div><div class="qt">' + item.q + '</div>';
        item.o.forEach(function (opt, oi) {
          var btn = el("button", "opt"); btn.textContent = opt;
          btn.onclick = function () { pick(qel, item, oi); };
          qel.appendChild(btn);
        });
        qel.appendChild(el("div", "fb"));
        box.appendChild(qel);
      });
    }
    sb.querySelector(".copyrc").onclick = function () {
      var ta = sb.querySelector(".rcode");
      ta.select(); ta.setSelectionRange(0, 99999);
      var btn = this;
      function ok() { btn.textContent = U("✓ 已複製，請貼給老師", "Đã sao chép"); setTimeout(function () { btn.textContent = "📋 " + U("複製結果代碼", "Sao chép mã"); }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(ta.value).then(ok, function () { document.execCommand("copy"); ok(); });
      else { document.execCommand("copy"); ok(); }
    };
    sb.querySelector(".ghost").onclick = function () {
      build(); window.scrollTo({ top: 0, behavior: "smooth" });
    };
    build();
    f.appendChild(head); f.appendChild(box); f.appendChild(sb);
    return f;
  };

  /* ---------- 組裝 ---------- */
  var nav = $("#nav"), main = $("#main");
  var curMod = D.modules.length ? D.modules[0].id : null, modT0 = Date.now();
  function switchMod(id, btn) {
    document.querySelectorAll(".module").forEach(function (m) { m.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
    nav.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
    btn.classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (id !== curMod) {
      TRACK.send("module_view", id, null, { from: curMod, ms: Date.now() - modT0 });
      curMod = id; modT0 = Date.now();
    }
  }
  D.modules.forEach(function (m, i) {
    var btn = el("button", i === 0 ? "active" : "", m.nav);
    btn.onclick = function () { switchMod(m.id, btn); };
    nav.appendChild(btn);

    var sec = el("section", "module" + (i === 0 ? " active" : ""));
    sec.id = m.id;
    sec.appendChild(el("div", "lead",
      '<div class="kicker">' + m.kicker + '</div><h2>' + m.h2 + '</h2><p>' + m.lead + '</p>'));
    m.blocks.forEach(function (b, bi) {
      var render = BLOCKS[b.type];
      if (!render) { console.error("未知區塊型別:", b.type); return; }
      CTX.mod = m.id; CTX.bi = bi;
      sec.appendChild(render(b));
    });
    main.appendChild(sec);
  });

  /* ---------- 學號代碼列（只在啟用記錄的週出現） ---------- */
  if (TRACK.on) {
    var bar = el("div", "codebar");
    bar.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;font-size:14px";
    bar.innerHTML = '<label for="ifs-code" style="font-weight:700">學號代碼</label>' +
      '<input id="ifs-code" maxlength="20" placeholder="例：S001" style="width:120px;padding:6px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:14px">' +
      '<span style="opacity:.75">只記錄你的學習歷程（翻卡、配對、測驗），不需要姓名。</span>';
    nav.parentNode.insertBefore(bar, nav);
    var inp = bar.querySelector("#ifs-code");
    inp.value = TRACK.code();
    inp.addEventListener("change", function () {
      TRACK.setCode(inp.value);
      document.querySelectorAll(".qid").forEach(function (x) { x.value = TRACK.code(); });
      TRACK.send("code_set", null, null, {});
    });
    TRACK.send("session_start", curMod, null, {
      device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || "") ? "mobile" : "desktop",
      w: window.innerWidth, build: D.build || null,
    });
    // 停留時間以「頁面可見」為準：切到背景就結算一段 module_leave，回來重新計時。
    // 手機瀏覽器殺分頁常不觸發 pagehide，所以以 visibilitychange→hidden 為主。
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        TRACK.send("module_leave", curMod, null, { ms: Date.now() - modT0 }); TRACK.flush();
      } else {
        modT0 = Date.now();
      }
    });
  }
})();
</script>
