<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品科學概論 第13週 · 互動教學</title>
<style>
  :root{
    --primary:#2D2A6E; --secondary:#5B4FB8; --accent:#00B8B8; --warm:#F5A623; --green:#2FA36B; --red:#D65B5B; --dark:#1A1A3E; --bg:#F4F5FA; --text:#1F1F2E; --mid:#5A5A75; --muted:#9096ac; --border:#E2E2EC; --card:#fff;
  }
/* 版型樣式 — 逐條取自「第1週_互動教學.html」，末段為新增區塊（cmp / tbl / note）。
   這裡只用 var(--x)；色票由 tokens.js 產生 :root 注入。 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:17px}
header{background:linear-gradient(120deg,var(--dark),var(--primary));color:#fff;
  padding:26px 22px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(0,0,0,.15)}
header h1{font-size:31px;font-weight:800;letter-spacing:.5px}
header .sub{color:#b9c7ff;font-size:16px;margin-top:5px}
nav{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.10);color:#dfe4ff;border:none;padding:12px 18px;
  border-radius:10px 10px 0 0;font-size:16.5px;cursor:pointer;font-weight:600;transition:.15s}
nav button:hover{background:rgba(255,255,255,.2)}
nav button.active{background:var(--bg);color:var(--primary)}
main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
.module{display:none;animation:fade .35s}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead{background:var(--dark);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:22px}
.lead .kicker{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px}
.lead h2{font-size:26px;margin:6px 0 8px}
.lead p{color:#cdd3ee;font-size:16.5px}
.sec-title{font-size:23px;font-weight:800;color:var(--primary);margin:30px 0 6px;
  display:flex;align-items:center;gap:10px}
.sec-title .bar{width:6px;height:25px;background:var(--accent);border-radius:3px;display:inline-block}
.hint{color:var(--mid);font-size:15px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* flip cards */
.flip{perspective:1100px;height:200px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px rgba(30,30,60,.08);border:1px solid var(--border)}
.front{background:var(--card)}
.front .t{font-size:21px;font-weight:800;color:var(--primary)}
.front .en{color:var(--muted);font-size:14px;margin-top:3px;font-style:italic}
.front .tap{margin-top:auto;color:var(--accent);font-size:14px;font-weight:700}
.back{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;transform:rotateY(180deg);overflow:auto}
.back p{font-size:16px}
.cbar{height:6px;border-radius:14px 14px 0 0;position:absolute;top:0;left:0;right:0}

/* expandable */
.exp{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.exp>button{width:100%;text-align:left;background:none;border:none;padding:16px 18px;cursor:pointer;
  display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;color:var(--text)}
.exp .num{background:var(--primary);color:#fff;min-width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.exp .chev{margin-left:auto;color:var(--muted);transition:.25s;font-size:20px}
.exp.on .chev{transform:rotate(90deg);color:var(--accent)}
.exp .body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 18px}
.exp.on .body{padding:0 18px 16px 62px}
.exp .body ul{margin-left:16px;color:var(--mid);font-size:16px}
.exp .body p{color:var(--mid);font-size:15.5px}
.exp .tag{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:8px}

/* info card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.card .h{font-weight:800;color:var(--primary);font-size:18px;margin-bottom:6px}
.card .en{color:var(--muted);font-size:13px;font-style:italic}
.card ul{margin:8px 0 0 18px;font-size:15.5px;color:var(--mid)}

/* timeline */
.tl{display:flex;gap:0;flex-wrap:wrap;counter-reset:s}
.tl .step{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 14px 14px;margin:8px;position:relative}
.tl .dot{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;margin-bottom:8px}
.tl .step h4{color:var(--primary);font-size:17.5px;margin-bottom:4px}
.tl .step p{font-size:15px;color:var(--mid)}

/* matching */
.match-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.pool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--secondary);color:#fff;padding:10px 17px;border-radius:22px;font-weight:700;
  cursor:grab;user-select:none;font-size:16.5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chip.used{opacity:.35;pointer-events:none}
.chip.sel{outline:3px solid var(--warm);outline-offset:2px}
.targets{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;border:2px dashed var(--border);border-radius:12px;padding:10px 14px;background:#fafbff}
.slot .desc{flex:1;font-size:16px;color:var(--text)}
.slot .drop{min-width:130px;min-height:44px;border-radius:8px;background:#eef0f8;display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:15px;padding:8px 12px}
.slot.ok{border-color:var(--green);background:#effaf3}
.slot.ok .drop{background:var(--green);color:#fff;font-weight:700}
.slot.bad{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* quiz */
.quiz-head{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.pbar{height:12px;background:#e7e9f4;border-radius:8px;overflow:hidden;margin-top:10px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--secondary));transition:width .4s}
.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.q .qn{color:var(--accent);font-weight:800;font-size:14px}
.q .qt{font-size:19.5px;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fafbff;border:2px solid var(--border);
  border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;font-size:16.5px;transition:.15s}
.opt:hover{border-color:var(--secondary)}
.opt.correct{border-color:var(--green);background:#effaf3;font-weight:700}
.opt.wrong{border-color:var(--red);background:#fdeeee}
.opt.dim{opacity:.6}
.fb{margin-top:8px;font-size:15.5px;padding:11px 14px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.good{background:#effaf3;color:#1c7a4d} .fb.no{background:#fdeeee;color:#a83b3b}
.scorebox{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:16px;
  padding:26px;text-align:center;margin-top:10px;display:none}
.scorebox.show{display:block}
.scorebox .big{font-size:46px;font-weight:800}
.btn{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:10px;
  font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.18)}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;background:#eef0fb;color:var(--secondary);padding:3px 10px;border-radius:20px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px}

/* ===== 新增區塊 ===== */
/* compare：兩欄對照（梅納 vs 焦糖化、冷藏 vs 冷凍…） */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media(max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 18px 18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06);position:relative;overflow:hidden}
.cmp .col .cbar{position:static;height:6px;margin:0 -18px 14px;border-radius:0}
.cmp .col h4{font-size:20px;font-weight:800;margin-bottom:2px}
.cmp .col .en{color:var(--muted);font-size:13px;font-style:italic;margin-bottom:8px}
.cmp .col ul{margin-left:18px;font-size:15.5px;color:var(--mid)}
.cmp .col li{margin-bottom:5px}
.cmp-note{margin-top:12px;background:#eef0fb;border-left:5px solid var(--secondary);
  border-radius:0 10px 10px 0;padding:12px 16px;font-size:16px;color:var(--primary);font-weight:600}

/* table：資料表（維生素、添加物分類…） */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px}
.tbl th{background:var(--primary);color:#fff;text-align:left;padding:12px 14px;font-weight:700;font-size:15px}
.tbl td{padding:11px 14px;border-top:1px solid var(--border);color:var(--mid);vertical-align:top}
.tbl tr:nth-child(even) td{background:#fafbff}
.tbl td:first-child{color:var(--text);font-weight:700}

/* note：重點提示條 */
.note{background:#fff8e9;border-left:5px solid var(--warm);border-radius:0 12px 12px 0;
  padding:14px 18px;margin:14px 0;font-size:16px;color:var(--text)}
.note b{color:var(--primary)}
.note.key{background:#effaf3;border-left-color:var(--green)}
.note.warn{background:#fdeeee;border-left-color:var(--red)}
/* 國合班 A2 互動練習：拼音與越南文（build_a2.js 產生的內容才會用到） */
.py{display:block;font-size:.78em;font-weight:500;color:var(--mid);margin-top:2px}
.vn{display:block;font-size:.88em;font-weight:500;color:var(--secondary);margin-top:2px}
/* Shared classroom tasks: oral response, sentence support, then sample explanation. */
.class-activity{display:grid;gap:12px;min-width:0}
.class-activity .vn{display:block;color:#0E7C7B;font-size:15px;line-height:1.5;margin-top:4px}
.activity-time{color:#0E7C7B;font-weight:700;font-size:15px}
.activity-prompt{font-size:clamp(18px,2.3vw,23px);line-height:1.5}
.sentence-stem{padding:12px 16px;background:#EFFAF3;border-left:5px solid #2FA36B;color:#1A1A3E;line-height:1.6}
.class-activity label{font-size:14px;color:#52526B}
.activity-response{display:block;width:100%;max-width:100%;min-height:72px;border:1.5px solid #A0A0B5;border-radius:8px;padding:10px 12px;resize:vertical;font:inherit;font-size:17px;background:#fff;color:#1F1F2E}
.activity-answer{border:1px solid #E2E2EC;background:#fff;border-radius:8px;padding:10px 14px;font-size:16px;line-height:1.5}
.activity-answer summary{cursor:pointer;font-weight:700;color:#2D2A6E}
.activity-answer p{margin-top:10px}
.activity-response:focus-visible,.activity-answer summary:focus-visible{outline:3px solid #0E7C7B;outline-offset:3px}
.source-note{font-size:13px;color:#52526B;line-height:1.5;overflow-wrap:anywhere;margin-top:10px}
.source-note .vn{display:block;color:#0E7C7B;font-size:13px}
.lesson-links{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.lesson-links a{color:inherit;text-underline-offset:3px}
.feedback-reason,.feedback-transfer{margin-top:6px}
.feedback-transfer{font-weight:600}
@media(max-width:640px){header{position:relative!important}.class-activity{gap:10px}}
@media print{.activity-response{min-height:64px}}


.back .vn{color:#D7FAF3}.tbl-wrap{overflow-x:auto}
</style>
</head>

<script>window.__LESSON__={"week":13,"series":["#2D2A6E","#2FA36B","#F5A623","#5B4FB8","#00B8B8","#D65B5B"],"modules":[{"id":"m-dry","nav":"乾燥","kicker":"MODULE 1 · 乾燥","h2":"乾燥：熱質傳遞、aw 與品質","lead":"以即溶咖啡的濃縮、乾燥及包裝為主線；果片乾燥作為比較。含水量、aw、生長與存活應分開判讀。","blocks":[{"type":"cards","title":"一包即溶咖啡：水去哪裡？\u003cspan class=\"vn\" lang=\"vi\">Một gói cà phê hòa tan: nước đi đâu?\u003c/span>","cols":3,"items":[{"h":"① 萃取液\u003cspan class=\"vn\" lang=\"vi\">Dịch chiết\u003c/span>","p":"咖啡成分溶在水中；先說清固形物比例。\u003cspan class=\"vn\" lang=\"vi\">Chất cà phê hòa trong nước; cần rõ tỷ lệ chất khô.\u003c/span>","c":"#2D2A6E"},{"h":"② 先濃縮\u003cspan class=\"vn\" lang=\"vi\">Cô đặc trước\u003c/span>","p":"移除部分水，減少後續乾燥負荷。\u003cspan class=\"vn\" lang=\"vi\">Bỏ một phần nước, giảm tải sấy sau.\u003c/span>","c":"#2D2A6E"},{"h":"③ 再乾燥與包裝\u003cspan class=\"vn\" lang=\"vi\">Sấy rồi đóng gói\u003c/span>","p":"比較方法、aw 與防潮；乾燥不等於無菌。\u003cspan class=\"vn\" lang=\"vi\">So cách sấy, aw và chống ẩm; khô không bằng vô trùng.\u003c/span>","c":"#2D2A6E"}]},{"type":"cards","title":"乾燥：移水、抑制與減重\u003cspan class=\"vn\" lang=\"vi\">Sấy: bỏ nước, hạn chế, giảm khối lượng\u003c/span>","cols":3,"items":[{"h":"降低水活性 aw\u003cspan class=\"vn\" lang=\"vi\">Giảm hoạt độ nước aw\u003c/span>","p":"可抑制微生物生長；效果要看食品與實測值。\u003cspan class=\"vn\" lang=\"vi\">Có thể hạn chế sinh trưởng; tùy thực phẩm và giá trị đo.\u003c/span>","c":"#2D2A6E"},{"h":"減少重量\u003cspan class=\"vn\" lang=\"vi\">Giảm khối lượng\u003c/span>","p":"常可降低運輸負擔；體積變化也受結構與包裝影響。\u003cspan class=\"vn\" lang=\"vi\">Thường giảm tải vận chuyển; thể tích còn tùy cấu trúc, bao bì.\u003c/span>","c":"#2D2A6E"},{"h":"仍要防污染與吸濕\u003cspan class=\"vn\" lang=\"vi\">Vẫn tránh nhiễm, hút ẩm\u003c/span>","p":"病原可能存活；開封、加水後條件又不同。\u003cspan class=\"vn\" lang=\"vi\">Mầm bệnh có thể sống sót; sau mở hay thêm nước đổi điều kiện.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"含水量和 aw 不同；低 aw 是生長限制，不是病原已死亡的證明。保存還要看氧化、包裝與時間。\u003cspan class=\"vn\" lang=\"vi\">Hàm lượng nước khác aw; aw thấp hạn chế phát triển, không chứng minh mầm bệnh đã chết. Còn xét oxy hóa, bao bì, thời gian.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.4315/0362-028X.JFP-12-211\" target=\"_blank\" rel=\"noopener\">低 aw 食品中的存活 / Sống sót trong thực phẩm aw thấp: JFP 2012 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"乾燥曲線：條件固定下的示意\u003cspan class=\"vn\" lang=\"vi\">Đường sấy: sơ đồ khi điều kiện cố định\u003c/span>","cols":3,"items":[{"h":"可能有恆率期\u003cspan class=\"vn\" lang=\"vi\">Có thể có giai đoạn đẳng tốc\u003c/span>","p":"表面水分供應足夠時，外部傳熱、傳質影響大。\u003cspan class=\"vn\" lang=\"vi\">Khi bề mặt đủ nước, truyền nhiệt và khối bên ngoài ảnh hưởng lớn.\u003c/span>","c":"#2D2A6E"},{"h":"常見減率期\u003cspan class=\"vn\" lang=\"vi\">Thường có giai đoạn giảm tốc\u003c/span>","p":"水從內部移出變重要，速率常逐漸降低。\u003cspan class=\"vn\" lang=\"vi\">Nước di chuyển từ trong trở nên quan trọng, tốc độ thường giảm.\u003c/span>","c":"#2D2A6E"},{"h":"接近平衡含水量 Xe\u003cspan class=\"vn\" lang=\"vi\">Gần độ ẩm cân bằng Xe\u003c/span>","p":"取決於食品及空氣條件；不是把水全部拿掉。\u003cspan class=\"vn\" lang=\"vi\">Tùy thực phẩm và không khí; không là bỏ hết nước.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"許多食品主要在減率期乾燥；不一定都有清楚的恆率期，也不一定可切成三段。圖中含水量基準須另說明。\u003cspan class=\"vn\" lang=\"vi\">Nhiều thực phẩm chủ yếu sấy giảm tốc; không luôn có đẳng tốc rõ hay đúng ba giai đoạn. Cần nói cơ sở hàm lượng nước của đồ thị.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/v5030e/v5030e0b.htm\" target=\"_blank\" rel=\"noopener\">乾燥曲線與條件 / Đường sấy và điều kiện: FAO ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"乾得快慢：內外條件一起看\u003cspan class=\"vn\" lang=\"vi\">Tốc độ sấy: xem cả trong ngoài\u003c/span>","cols":3,"items":[{"h":"外部空氣\u003cspan class=\"vn\" lang=\"vi\">Không khí bên ngoài\u003c/span>","p":"溫度、濕度與風速影響移熱、移水。\u003cspan class=\"vn\" lang=\"vi\">Nhiệt, ẩm và tốc độ gió ảnh hưởng truyền nhiệt, nước.\u003c/span>","c":"#2D2A6E"},{"h":"食品本身\u003cspan class=\"vn\" lang=\"vi\">Bản thân thực phẩm\u003c/span>","p":"厚度、結構、糖分與表面結殼都可能影響。\u003cspan class=\"vn\" lang=\"vi\">Độ dày, cấu trúc, đường, lớp vỏ đều có thể ảnh hưởng.\u003c/span>","c":"#2D2A6E"},{"h":"加速也有代價\u003cspan class=\"vn\" lang=\"vi\">Tăng tốc cũng có đánh đổi\u003c/span>","p":"切薄常縮短路徑；仍要看褐變、氧化與口感。\u003cspan class=\"vn\" lang=\"vi\">Cắt mỏng thường rút đường đi; vẫn xem hóa nâu, oxy hóa, kết cấu.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"減率期常受內部移水限制，不代表加風或升溫永遠沒有作用；效果與品質須一同評估。\u003cspan class=\"vn\" lang=\"vi\">Giảm tốc thường bị hạn chế bởi nước bên trong, không nghĩa thêm gió hay nhiệt luôn vô ích; xét hiệu quả cùng chất lượng.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/v5030e/v5030e0b.htm\" target=\"_blank\" rel=\"noopener\">影響乾燥的因子 / Yếu tố sấy: FAO ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 1｜後段乾得慢，怎麼辦？\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 1: Cuối quá trình khô chậm, làm gì?\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"drying\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">老師提供同批果片紀錄：後段水分下降變慢。有人說「風加倍就一定快一倍」。這個判斷缺什麼？\u003cspan class=\"vn\" lang=\"vi\">Hồ sơ cùng lô lát quả: cuối quá trình nước giảm chậm. Có bạn nói gió gấp đôi chắc nhanh gấp đôi. Còn thiếu gì?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>可能受＿＿限制；我還要看＿＿，不能直接說＿＿。\u003cspan class=\"vn\" lang=\"vi\">Có thể bị hạn chế bởi ___; còn xem ___, chưa thể nói ___.\u003c/span>\u003c/div>\u003clabel for=\"general-w13-drying\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w13-drying\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>可能受內部移水限制；查厚度、溫濕度、風速與表面狀態，不能直接算快一倍。\u003cspan class=\"vn\" lang=\"vi\">Có thể bị hạn chế bởi nước di chuyển bên trong; xem dày, nhiệt ẩm, gió, bề mặt, không suy nhanh gấp đôi.\u003c/span>\u003c/p>\u003cp>改變條件也可能改變褐變與質地；先預測，再用對照資料確認。\u003cspan class=\"vn\" lang=\"vi\">Đổi điều kiện cũng có thể đổi nâu, kết cấu; dự đoán rồi xác nhận bằng đối chứng.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"三種乾燥法：用途與代價\u003cspan class=\"vn\" lang=\"vi\">Ba cách sấy: công dụng và đánh đổi\u003c/span>","cols":3,"items":[{"h":"熱風乾燥\u003cspan class=\"vn\" lang=\"vi\">Sấy không khí nóng\u003c/span>","p":"熱空氣帶走水；可用於果乾、麵條等，條件影響收縮與褐變。\u003cspan class=\"vn\" lang=\"vi\">Khí nóng lấy nước; dùng cho quả khô, mì; điều kiện ảnh hưởng co, nâu.\u003c/span>","c":"#2D2A6E"},{"h":"噴霧乾燥\u003cspan class=\"vn\" lang=\"vi\">Sấy phun\u003c/span>","p":"液體霧化成小液滴，再與乾燥氣體接觸形成粉末。\u003cspan class=\"vn\" lang=\"vi\">Phun lỏng thành giọt nhỏ, tiếp xúc khí sấy tạo bột.\u003c/span>","c":"#2D2A6E"},{"h":"冷凍乾燥\u003cspan class=\"vn\" lang=\"vi\">Sấy thăng hoa\u003c/span>","p":"先凍結，在減壓下使冰昇華，再移除部分殘餘水。\u003cspan class=\"vn\" lang=\"vi\">Đông trước, giảm áp để đá thăng hoa, rồi loại một phần nước còn lại.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"選法要看原料形態、產量、設備及品質目標；不給所有食品同一個成本或品質排名。\u003cspan class=\"vn\" lang=\"vi\">Chọn cách tùy dạng nguyên liệu, sản lượng, thiết bị và mục tiêu; không xếp chi phí, chất lượng chung mọi thực phẩm.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/v5030e/v5030e09.htm\" target=\"_blank\" rel=\"noopener\">乾燥方法 / Phương pháp sấy: FAO ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"凍乾：優勢也有條件\u003cspan class=\"vn\" lang=\"vi\">Sấy thăng hoa: lợi thế có điều kiện\u003c/span>","cols":3,"items":[{"h":"多孔結構\u003cspan class=\"vn\" lang=\"vi\">Cấu trúc xốp\u003c/span>","p":"冰移除後常留下孔洞，有利復水；不保證回到原狀。\u003cspan class=\"vn\" lang=\"vi\">Sau bỏ đá thường còn lỗ, giúp hoàn nguyên; không bảo đảm như ban đầu.\u003c/span>","c":"#2D2A6E"},{"h":"控制熱敏感損失\u003cspan class=\"vn\" lang=\"vi\">Kiểm soát mất chất nhạy nhiệt\u003c/span>","p":"適當製程可能少傷部分成分；仍可能散失香氣或氧化。\u003cspan class=\"vn\" lang=\"vi\">Quy trình phù hợp có thể giảm mất vài chất; vẫn có thể mất mùi, oxy hóa.\u003c/span>","c":"#2D2A6E"},{"h":"保存與成本\u003cspan class=\"vn\" lang=\"vi\">Bảo quản và chi phí\u003c/span>","p":"防潮、阻氧很重要；設備、能耗與產量共同影響成本。\u003cspan class=\"vn\" lang=\"vi\">Chống ẩm, oxy quan trọng; thiết bị, năng lượng, sản lượng ảnh hưởng chi phí.\u003c/span>","c":"#2D2A6E"}]},{"type":"exp","title":"延伸：含水量基準與乾燥曲線","items":[{"h":"濕基與乾基不同","body":["濕基含水率＝水質量／食品總質量；乾基含水率＝水質量／乾固形物質量。比較曲線要先指定基準。","固定乾燥條件、忽略固形物損失時，乾基含水量隨時間的斜率可反映單位乾固形物的移水速率。不同基準的圖形不能直接互換。"]},{"h":"恆率期不一定明顯","body":["食品表面供水、外部熱質傳與內部移水共同影響結果；很多食品以減率期為主。","Xe 是該食品在指定環境下的平衡含水量，不是所有食品的同一目標值。臨界含水量與乾燥終點也不能由圖形直接當作安全界值。"]},{"h":"凍乾仍需供能與保存控制","body":["一次乾燥主要移除冰，後續乾燥降低殘餘水；需控制產品溫度、壓力與結構，避免塌陷。","凍乾不保證香氣、營養或活菌全部保留。成本取決於產量、週期、能耗與設備，不給所有產品同一排序。"]}]}]},{"id":"m-conc","nav":"濃縮","kicker":"MODULE 2 · 濃縮","h2":"濃縮與膜分離：守恆及選擇性","lead":"濃縮可能協助保存，也常是乾燥前的減量步驟；效果依 aw、pH、製程與包裝，不能一概視為已完成殺菌。","blocks":[{"type":"cards","title":"濃縮：把部分水移走\u003cspan class=\"vn\" lang=\"vi\">Cô đặc: bỏ một phần nước\u003c/span>","cols":3,"items":[{"h":"蒸發濃縮\u003cspan class=\"vn\" lang=\"vi\">Cô đặc bốc hơi\u003c/span>","p":"供熱使水蒸發；減壓可降低沸點，但仍需供熱。\u003cspan class=\"vn\" lang=\"vi\">Cấp nhiệt cho nước bay hơi; giảm áp hạ điểm sôi nhưng vẫn cần nhiệt.\u003c/span>","c":"#2D2A6E"},{"h":"冷凍濃縮\u003cspan class=\"vn\" lang=\"vi\">Cô đặc đông lạnh\u003c/span>","p":"形成冰晶並分離，液相變濃；要控制夾帶的固形物損失。\u003cspan class=\"vn\" lang=\"vi\">Tạo, tách đá để pha lỏng đậm hơn; kiểm soát mất chất khô bị cuốn theo.\u003c/span>","c":"#2D2A6E"},{"h":"膜濃縮\u003cspan class=\"vn\" lang=\"vi\">Cô đặc bằng màng\u003c/span>","p":"選擇合適膜與壓力等條件，讓水或部分小分子透過。\u003cspan class=\"vn\" lang=\"vi\">Chọn màng, áp suất phù hợp cho nước hay vài phân tử nhỏ đi qua.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"真空下的沸點依壓力、組成而變；不能把 40–60°C 當通用值。濃縮可幫助保存，但不自動達到常溫安全。\u003cspan class=\"vn\" lang=\"vi\">Điểm sôi chân không tùy áp, thành phần; không dùng 40–60°C chung. Cô đặc có thể hỗ trợ bảo quản nhưng không tự bảo đảm an toàn ở nhiệt phòng.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/V5030E/V5030E0c.htm\" target=\"_blank\" rel=\"noopener\">濃縮機制與範圍 / Cơ chế cô đặc: FAO ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 2｜咖啡濃縮的重量\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 2: Khối lượng cà phê cô đặc\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"balance\">\u003cp class=\"activity-time\">3 分鐘 / 3 phút\u003c/p>\u003cp class=\"activity-prompt\">假設 100 kg 咖啡萃取液有 10% 固形物（質量百分比）。只移除水，無固形物損失，濃縮到 50%。最後有幾 kg？\u003cspan class=\"vn\" lang=\"vi\">Giả định 100 kg dịch cà phê chứa 10% chất khô theo khối lượng. Chỉ bỏ nước, không mất chất khô, cô đến 50%. Cuối còn mấy kg?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>固形物＝100 × 0.10＝＿＿kg；總量＝＿＿÷0.50＝＿＿kg。\u003cspan class=\"vn\" lang=\"vi\">Chất khô=100 × 0,10=___kg; tổng=___÷0,50=___kg.\u003c/span>\u003c/div>\u003clabel for=\"general-w13-balance\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w13-balance\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>固形物 10 kg；最後總量 20 kg，移除水 80 kg。\u003cspan class=\"vn\" lang=\"vi\">Chất khô 10 kg; cuối tổng 20 kg, bỏ 80 kg nước.\u003c/span>\u003c/p>\u003cp>是教學假設，不是咖啡工廠固定規格；若有固形物夾帶或流失，就要另算。\u003cspan class=\"vn\" lang=\"vi\">Đây là giả định, không là chuẩn cố định nhà máy; nếu mất chất khô cần tính thêm.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"RO 與 UF：留下什麼？\u003cspan class=\"vn\" lang=\"vi\">RO và UF: giữ lại gì?\u003c/span>","cols":3,"items":[{"h":"逆滲透 RO\u003cspan class=\"vn\" lang=\"vi\">Thẩm thấu ngược RO\u003c/span>","p":"主要讓水透過、截留多數溶質；不是理想的「只有水」。\u003cspan class=\"vn\" lang=\"vi\">Chủ yếu cho nước qua, giữ nhiều chất tan; không là chỉ nước tuyệt đối.\u003c/span>","c":"#2D2A6E"},{"h":"超過濾 UF\u003cspan class=\"vn\" lang=\"vi\">Siêu lọc UF\u003c/span>","p":"常用於保留蛋白質；水、乳糖及部分礦物質可透過。\u003cspan class=\"vn\" lang=\"vi\">Thường giữ protein; nước, lactose và vài khoáng có thể qua.\u003c/span>","c":"#2D2A6E"},{"h":"分離後還要加工\u003cspan class=\"vn\" lang=\"vi\">Còn xử lý sau tách\u003c/span>","p":"乳清蛋白產品常再濃縮、乾燥；UF 本身不直接產生乾粉。\u003cspan class=\"vn\" lang=\"vi\">Sản phẩm whey thường còn cô đặc, sấy; UF không trực tiếp tạo bột khô.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"截留率依膜、分子狀態與操作條件而變；濃縮與殺菌是不同目標。\u003cspan class=\"vn\" lang=\"vi\">Mức giữ tùy màng, trạng thái phân tử, điều kiện; cô đặc và diệt khuẩn là mục tiêu khác.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://dairyprocessinghandbook.tetrapak.com/chapter/membrane-technology\" target=\"_blank\" rel=\"noopener\">膜與分離 / Màng và phân tách: Tetra Pak 技術手冊 ↗\u003c/a>\u003c/p>"},{"type":"exp","title":"延伸：從守恆到實際設備","items":[{"h":"固形物質量守恆","body":["只有水被移走、無固形物損失時，m₁x₁＝m₂x₂，x 為同基準的固形物質量分率。","本課假設 100 kg、10% → 50%：m₂＝20 kg，移水 80 kg。固形物夾帶、分流、取樣損失或反應都可能需額外衡算。"]},{"h":"膜不是理想篩網","body":["RO 主要移水，UF 常截留蛋白質；實際截留受膜、分子構形、操作與污染影響。","乳清 UF 的透過液可含乳糖、可溶性礦物質等；與蛋白結合的礦物質不必然全部透過。截留液通常還需後續加工才能成粉。"]},{"h":"真空與低溫並非無熱作用","body":["降低壓力可降低沸點，蒸發仍需能量。溫度、時間、香氣回收及衛生都會影響成品。","冷凍濃縮要分離冰晶，冰中夾帶溶質造成損失；不能單由方法名稱保證風味最佳。"]}]}]},{"id":"m-other","nav":"其他保存法","kicker":"MODULE 3 · 其他技術","h2":"其他保存技術：用途與驗證範圍","lead":"鹽糖、煙燻、照射與非熱加工可各有作用；技術名稱、最高壓力或「新鮮」宣稱不能代替產品與危害的驗證。","blocks":[{"type":"cards","title":"鹽、糖與煙：配合其他控制\u003cspan class=\"vn\" lang=\"vi\">Muối, đường, khói: phối hợp kiểm soát\u003c/span>","cols":3,"items":[{"h":"鹽與糖\u003cspan class=\"vn\" lang=\"vi\">Muối và đường\u003c/span>","p":"足夠濃度可降低 aw；果醬、蜜餞的數值須量測，不能由名稱推定。\u003cspan class=\"vn\" lang=\"vi\">Nồng độ đủ có thể giảm aw; cần đo mứt, quả ngâm, không suy từ tên.\u003c/span>","c":"#2D2A6E"},{"h":"醃製肉品\u003cspan class=\"vn\" lang=\"vi\">Thịt ướp curing\u003c/span>","p":"部分產品用亞硝酸鹽等控制危害；配方與使用須符合規範。\u003cspan class=\"vn\" lang=\"vi\">Vài sản phẩm dùng nitrit để kiểm soát nguy hại; công thức, dùng theo quy định.\u003c/span>","c":"#2D2A6E"},{"h":"煙燻\u003cspan class=\"vn\" lang=\"vi\">Xông khói\u003c/span>","p":"可改變風味與部分抑菌條件；須控制製程污染物如 PAH。\u003cspan class=\"vn\" lang=\"vi\">Đổi hương, vài điều kiện ức chế; cần kiểm soát chất ô nhiễm như PAH.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"方法名稱不等於安全保證；本頁是機制比較，不提供自行加鹽、糖或亞硝酸鹽的製作處方。\u003cspan class=\"vn\" lang=\"vi\">Tên phương pháp không bảo đảm an toàn; đây là so cơ chế, không là công thức tự thêm muối, đường, nitrit.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.22175/mmb.12473\" target=\"_blank\" rel=\"noopener\">醃製肉品 / Thịt ướp: AMSA 2023 ↗\u003c/a>\u003c/p>\u003cp class=\"source-note\">\u003ca href=\"https://www.maff.go.jp/j/syouan/kijun/codex/standard_list/pdf/cac_rcp68.pdf\" target=\"_blank\" rel=\"noopener\">煙燻 PAH 控制 / Kiểm soát PAH: Codex（MAFF 譯本） ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"食品照射：方法、用途與規範\u003cspan class=\"vn\" lang=\"vi\">Chiếu xạ: cách, mục đích, quy định\u003c/span>","cols":3,"items":[{"h":"游離輻射處理\u003cspan class=\"vn\" lang=\"vi\">Xử lý bức xạ ion hóa\u003c/span>","p":"依法使用 γ 射線、電子束或 X 射線等；不同於放射性污染。\u003cspan class=\"vn\" lang=\"vi\">Dùng tia gamma, điện tử, X theo quy định; khác nhiễm chất phóng xạ.\u003c/span>","c":"#2D2A6E"},{"h":"依目標設計\u003cspan class=\"vn\" lang=\"vi\">Thiết kế theo mục tiêu\u003c/span>","p":"可抑芽、殺蟲或降低部分病原；效果看食品、劑量與目標。\u003cspan class=\"vn\" lang=\"vi\">Có thể hạn chế nảy mầm, diệt côn trùng, giảm vài mầm bệnh; tùy thực phẩm, liều, mục tiêu.\u003c/span>","c":"#2D2A6E"},{"h":"仍要衛生與保存\u003cspan class=\"vn\" lang=\"vi\">Vẫn cần vệ sinh, bảo quản\u003c/span>","p":"符合規範的處理不使食品變成放射性；不取代後續衛生。\u003cspan class=\"vn\" lang=\"vi\">Xử lý đúng quy định không làm thực phẩm phóng xạ; không thay vệ sinh sau đó.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"台灣依准用品項、照射條件及標示規定管理；Radura 是常見國際標誌，不能把其他國家的細節直接當台灣規定。\u003cspan class=\"vn\" lang=\"vi\">Đài Loan quản lý loại cho phép, điều kiện và nhãn; Radura là biểu tượng quốc tế thường gặp, không dùng chi tiết nước khác thay luật Đài Loan.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/tc/newsContent.aspx?cid=4&id=t622402\" target=\"_blank\" rel=\"noopener\">台灣照射處理規範 / Quy định Đài Loan: TFDA 2024 ↗\u003c/a>\u003c/p>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/food/buy-store-serve-safe-food/food-irradiation-what-you-need-know\" target=\"_blank\" rel=\"noopener\">用途與安全 / Công dụng, an toàn: FDA ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"非熱加工：溫度也要記錄\u003cspan class=\"vn\" lang=\"vi\">Phi nhiệt: vẫn cần ghi nhiệt độ\u003c/span>","cols":3,"items":[{"h":"高壓 HPP\u003cspan class=\"vn\" lang=\"vi\">Áp suất cao HPP\u003c/span>","p":"壓力、時間、溫度與食品共同影響效果；常用於濕潤食品。\u003cspan class=\"vn\" lang=\"vi\">Áp, thời gian, nhiệt, thực phẩm cùng ảnh hưởng; thường dùng đồ ẩm.\u003c/span>","c":"#2D2A6E"},{"h":"脈衝電場 PEF\u003cspan class=\"vn\" lang=\"vi\">Điện trường xung PEF\u003c/span>","p":"電場可影響細胞膜；液體特性、流動與能量輸入很重要。\u003cspan class=\"vn\" lang=\"vi\">Điện trường ảnh hưởng màng tế bào; tính chất lỏng, dòng, năng lượng quan trọng.\u003c/span>","c":"#2D2A6E"},{"h":"UV-C 與冷電漿\u003cspan class=\"vn\" lang=\"vi\">UV-C và plasma lạnh\u003c/span>","p":"光穿透、遮蔽、表面與設備條件限制處理效果。\u003cspan class=\"vn\" lang=\"vi\">Xuyên sáng, che khuất, bề mặt, thiết bị giới hạn hiệu quả.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"本頁比較作用機制；效果仍受食品、設備、處理條件與目標影響，不是全面取代熱加工的保證。\u003cspan class=\"vn\" lang=\"vi\">So cơ chế; hiệu quả tùy thực phẩm, thiết bị, điều kiện, mục tiêu, không bảo đảm thay mọi xử lý nhiệt.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/media/103619/download\" target=\"_blank\" rel=\"noopener\">PEF 機制與條件 / Cơ chế, điều kiện PEF: FDA 技術資料 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"高壓的限制：不要只看數字\u003cspan class=\"vn\" lang=\"vi\">Giới hạn HPP: không chỉ xem một số\u003c/span>","cols":3,"items":[{"h":"常見工業壓力範圍\u003cspan class=\"vn\" lang=\"vi\">Khoảng áp công nghiệp thường gặp\u003c/span>","p":"EFSA 評估常見約 400–600 MPa；不是所有食品的通用處方。\u003cspan class=\"vn\" lang=\"vi\">EFSA đánh giá thường khoảng 400–600 MPa; không là công thức chung.\u003c/span>","c":"#2D2A6E"},{"h":"孢子與組合處理\u003cspan class=\"vn\" lang=\"vi\">Bào tử và xử lý phối hợp\u003c/span>","p":"一般非熱 HPP 難可靠控制細菌孢子；不能直接當商業滅菌。\u003cspan class=\"vn\" lang=\"vi\">HPP phi nhiệt thường khó kiểm soát tin cậy bào tử; không coi ngay là tiệt trùng thương mại.\u003c/span>","c":"#2D2A6E"},{"h":"冷壓不等於 HPP\u003cspan class=\"vn\" lang=\"vi\">Ép lạnh không bằng HPP\u003c/span>","p":"冷壓是取汁方式；是否做 HPP、如何保存，要另查標示與驗證。\u003cspan class=\"vn\" lang=\"vi\">Ép lạnh là cách lấy dịch; có HPP, bảo quản ra sao cần xem nhãn, kiểm chứng.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"加壓時可能升溫；結合高溫的壓力處理須另行評估。保存方式依產品與驗證，不由「非熱」兩字決定。\u003cspan class=\"vn\" lang=\"vi\">Nén có thể tăng nhiệt; áp kết hợp nhiệt cao cần đánh giá riêng. Bảo quản tùy sản phẩm, kiểm chứng, không suy từ chữ phi nhiệt.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.efsa.europa.eu/en/efsajournal/pub/7128\" target=\"_blank\" rel=\"noopener\">HPP 條件與孢子 / HPP và bào tử: EFSA 2022 ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 3｜冷壓果汁可以常溫嗎？\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 3: Nước ép lạnh để thường được không?\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"label\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">一瓶果汁只寫「冷壓、風味新鮮」。能推定它做過 HPP，或可常溫保存嗎？請列兩項待查資料。\u003cspan class=\"vn\" lang=\"vi\">Một chai chỉ ghi ép lạnh, vị tươi. Có suy đã HPP hay để thường được không? Nêu hai dữ liệu cần xem.\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>「冷壓」只告訴我＿＿；還要確認＿＿和＿＿。\u003cspan class=\"vn\" lang=\"vi\">Ép lạnh chỉ cho biết ___; còn xác nhận ___ và ___.\u003c/span>\u003c/div>\u003clabel for=\"general-w13-label\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w13-label\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>不能；先查是否有經驗證的處理、產品配方與保存標示，也要看開封條件。\u003cspan class=\"vn\" lang=\"vi\">Không; xem xử lý đã kiểm chứng, công thức và nhãn bảo quản, cả điều kiện sau mở.\u003c/span>\u003c/p>\u003cp>壓榨取汁與高壓處理不同；即使做了 HPP，也不能直接推定已控制孢子或能常溫放。\u003cspan class=\"vn\" lang=\"vi\">Ép lấy dịch khác xử lý áp suất cao; dù có HPP chưa suy kiểm soát bào tử hay để thường.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"exp","title":"延伸：HPP 與照射的前提","items":[{"h":"HPP 是條件組合","body":["同一壓力下，處理時間、初始與處理中溫度、食品組成、目標菌都會改變效果；加壓可能升溫。","一般非熱 HPP 難可靠控制孢子，不能直接當商業滅菌。與高溫結合的壓力輔助處理是另一組需驗證的條件。"]},{"h":"保存標示與原料製程","body":["冷壓是機械取汁方式，不表示做過 HPP。是否需冷藏與期限應依產品及驗證。","低酸果汁的孢子危害尤其不能只由 HPP 名稱推定已控制。\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/pressure-safe-llc-520442-06072017\" target=\"_blank\" rel=\"noopener\">HPP 果汁驗證案例 / Ví dụ kiểm chứng: FDA 2017 ↗\u003c/a>\u003c/p>"]},{"h":"食品照射不是污染","body":["依法使用核准射源、食品品項與條件，不使食品成為放射性；與核事故放射性物質污染不同。","照射效力依劑量與目標，不能概括為清除全部毒素或微生物。包裝是否適用、後續衛生及標示均需確認。"]}]},{"type":"cards","title":"回顧\u003cspan class=\"vn\" lang=\"vi\">Ôn tập\u003c/span>","cols":2,"items":[{"h":"乾燥可抑制生長，不能證明無菌\u003cspan class=\"vn\" lang=\"vi\">Sấy hạn chế sinh trưởng, không chứng minh vô trùng\u003c/span>"},{"h":"乾燥曲線與品質，都要說條件\u003cspan class=\"vn\" lang=\"vi\">Đường sấy, chất lượng đều cần điều kiện\u003c/span>"},{"h":"濃縮算固形物；膜分離看截留\u003cspan class=\"vn\" lang=\"vi\">Cô đặc tính chất khô; màng xem mức giữ\u003c/span>"},{"h":"技術名稱不代替製程與保存驗證\u003cspan class=\"vn\" lang=\"vi\">Tên kỹ thuật không thay kiểm chứng xử lý, bảo quản\u003c/span>"}]}]},{"id":"m-quiz","nav":"綜合測驗","kicker":"MODULE 4 · 綜合測驗","h2":"小測驗：檢核學習成效","lead":"與 A2 版共用 10 題；包含固形物守恆與保存宣稱判讀，作答後讀雙語原因及中文句型。","blocks":[{"type":"quiz","items":[{"q":"乾燥食品 aw 低，能直接證明沒有病原嗎？\u003cspan class=\"vn\" lang=\"vi\">Thực phẩm khô aw thấp có chứng minh không mầm bệnh?\u003c/span>","o":["能，低 aw 等於殺菌 / Có, aw thấp bằng diệt khuẩn","能，只要外表乾 / Có, chỉ cần ngoài khô","不能，抑制生長與存活不同 / Không, hạn chế mọc khác sống sót","能，包裝前不需衛生 / Có, trước đóng gói không cần vệ sinh"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 低 aw 可限制生長，但病原仍可能存活；需防污染、吸濕，也要有合適的危害控制。\u003cspan class=\"vn\" lang=\"vi\">aw thấp hạn chế mọc nhưng mầm bệnh có thể sống; cần tránh nhiễm, ẩm và kiểm soát nguy hại.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：低 aw 主要限制＿＿，不代表＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: aw thấp chủ yếu hạn chế ___, không nghĩa ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.4315/0362-028X.JFP-12-211\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"食品乾燥後段變慢，就把風速加倍，能保證速度加倍嗎？\u003cspan class=\"vn\" lang=\"vi\">Cuối sấy chậm, gió gấp đôi có bảo đảm tốc độ gấp đôi?\u003c/span>","o":["不能，還看內部移水與其他條件 / Không, còn nước di chuyển bên trong và điều kiện","能，風速與乾燥速率永遠成正比 / Có, gió luôn tỷ lệ thuận với sấy","能，所有食品都一樣 / Có, mọi thực phẩm giống nhau","不能，後段完全沒有蒸發 / Không, cuối hoàn toàn không bay hơi"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 減率期常受內部移水限制，外部條件仍可能影響；不能簡單推成兩倍。\u003cspan class=\"vn\" lang=\"vi\">Giảm tốc thường bị hạn chế bởi nước bên trong, bên ngoài vẫn có thể ảnh hưởng; không suy gấp đôi.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：我先查＿＿，再比較乾燥速度。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tôi xem ___ rồi so tốc độ.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/v5030e/v5030e0b.htm\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"噴霧乾燥的主要操作是？\u003cspan class=\"vn\" lang=\"vi\">Thao tác chính của sấy phun?\u003c/span>","o":["冰晶直接變氣體 / Đá thành hơi trực tiếp","用膜留住蛋白質 / Màng giữ protein","把大塊果片泡熱水 / Ngâm miếng quả lớn nước nóng","液體霧化成小滴，再以氣體乾燥 / Phun lỏng thành giọt nhỏ rồi sấy bằng khí"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 霧化增加與乾燥氣體接觸的面積；處理條件仍需依配方及設備設計。\u003cspan class=\"vn\" lang=\"vi\">Phun tăng diện tích tiếp xúc khí sấy; điều kiện tùy công thức, thiết bị.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：噴霧乾燥先把液體變成＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Sấy phun trước biến lỏng thành ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/v5030e/v5030e09.htm\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"凍乾後為何常比較容易復水？\u003cspan class=\"vn\" lang=\"vi\">Vì sao sau sấy thăng hoa thường dễ hoàn nguyên?\u003c/span>","o":["因為所有蛋白質都被水解 / Vì mọi protein bị thủy phân","移除冰後常形成多孔結構 / Bỏ đá thường tạo cấu trúc xốp","因為已經完全無菌 / Vì đã vô trùng tuyệt đối","因為不需要包裝防潮 / Vì không cần bao bì chống ẩm"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 多孔結構可利於水進入；實際復水與質地仍看原料、製程，不保證回到原狀。\u003cspan class=\"vn\" lang=\"vi\">Lỗ có thể giúp nước vào; hoàn nguyên, kết cấu tùy nguyên liệu, quy trình, không bảo đảm như cũ.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：凍乾可能留下＿＿，但不保證＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Sấy thăng hoa có thể để ___, nhưng không bảo đảm ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/v5030e/v5030e09.htm\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"真空蒸發濃縮的正確說法是？\u003cspan class=\"vn\" lang=\"vi\">Câu đúng về cô đặc bốc hơi chân không?\u003c/span>","o":["減壓可降低沸點，但仍需供熱 / Giảm áp hạ điểm sôi, vẫn cần nhiệt","抽真空後不再需要能量 / Hút chân không không cần năng lượng nữa","任何食品都固定 50°C 沸騰 / Mọi thực phẩm luôn sôi 50°C","蒸發後一定達商業無菌 / Sau bốc hơi chắc vô trùng thương mại"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 沸點依壓力與食品組成；低溫濃縮不等於可靠殺菌或能常溫保存。\u003cspan class=\"vn\" lang=\"vi\">Điểm sôi tùy áp, thành phần; cô nhiệt thấp không bằng diệt khuẩn tin cậy hay để thường.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：真空降低＿＿，不是完全不需要＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Chân không giảm ___, không phải hết cần ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/V5030E/V5030E0c.htm\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"假設 100 kg 萃取液有 10% 固形物，無損失濃縮到 50%，最後總量是？\u003cspan class=\"vn\" lang=\"vi\">100 kg dịch có 10% chất khô, cô không mất chất khô đến 50%, tổng cuối?\u003c/span>","o":["50 kg / 50 kg","10 kg / 10 kg","20 kg / 20 kg","90 kg / 90 kg"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 固形物＝100×0.10＝10 kg，總量＝10/0.50＝20 kg；水移除 80 kg。均為質量百分比假設。\u003cspan class=\"vn\" lang=\"vi\">Chất khô=10 kg, tổng=10/0,50=20 kg; bỏ 80 kg nước. Giả định phần trăm khối lượng.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：固形物先算＿＿kg，再除以＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tính chất khô ___kg rồi chia ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/V5030E/V5030E0c.htm\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"乳清用 UF 保留蛋白質後，能直接說已得到乾蛋白粉嗎？\u003cspan class=\"vn\" lang=\"vi\">UF giữ protein whey xong có nói đã có bột khô?\u003c/span>","o":["能，UF 會把水全變成冰 / Có, UF làm mọi nước thành đá","能，截留液就是乾粉 / Có, dịch giữ chính là bột","能，蛋白質一定百分之百留下 / Có, protein chắc giữ 100%","不能，通常還有後續濃縮與乾燥 / Không, thường còn cô đặc, sấy"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> UF 是分離、濃縮步驟；截留液仍含水，截留率也依膜和條件。\u003cspan class=\"vn\" lang=\"vi\">UF là tách, cô; dịch giữ vẫn có nước, mức giữ tùy màng, điều kiện.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：UF 幫助＿＿，乾粉還需要＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: UF giúp ___, bột khô còn cần ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://dairyprocessinghandbook.tetrapak.com/chapter/membrane-technology\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"符合規範的食品照射，與放射性污染有何關係？\u003cspan class=\"vn\" lang=\"vi\">Chiếu xạ đúng quy định liên quan nhiễm phóng xạ thế nào?\u003c/span>","o":["兩者都是添加放射性物質 / Cả hai thêm chất phóng xạ","照射不使食品變成放射性，與污染不同 / Chiếu xạ không làm thực phẩm phóng xạ, khác nhiễm","照射後可不管保存衛生 / Sau chiếu không cần vệ sinh","各國品項與標示規則一定相同 / Mọi nước cùng loại, luật nhãn"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 處理須依允許來源、條件、品項與標示；也不能取代保存與後續衛生。\u003cspan class=\"vn\" lang=\"vi\">Cần nguồn, điều kiện, loại, nhãn cho phép; không thay bảo quản, vệ sinh sau.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：依法照射與＿＿不同，仍要＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Chiếu đúng luật khác ___, vẫn cần ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/food/buy-store-serve-safe-food/food-irradiation-what-you-need-know\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"一瓶只寫「冷壓果汁」，能推定做過 HPP 嗎？\u003cspan class=\"vn\" lang=\"vi\">Chai chỉ ghi ép lạnh có suy đã HPP?\u003c/span>","o":["不能，取汁方式與高壓處理不同 / Không, cách ép khác xử lý áp cao","能，冷壓就是 600 MPa / Có, ép lạnh chính là 600 MPa","能，只要味道新鮮 / Có, chỉ cần vị tươi","能，冷壓品都可常溫 / Có, mọi ép lạnh để thường"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 冷壓是榨取方式；HPP 是否執行、處理效果與保存條件須另查。\u003cspan class=\"vn\" lang=\"vi\">Ép lạnh là lấy dịch; có HPP, hiệu quả, bảo quản cần xác nhận riêng.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：標示只告訴我＿＿，還要查＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Nhãn chỉ cho biết ___, còn xem ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.efsa.europa.eu/en/efsajournal/pub/7128\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"一般非熱 HPP 的孢子控制，應如何理解？\u003cspan class=\"vn\" lang=\"vi\">Hiểu kiểm soát bào tử bằng HPP phi nhiệt thông thường?\u003c/span>","o":["所有孢子都立即死亡 / Mọi bào tử chết ngay","任何情況壓力都無法影響孢子 / Áp không bao giờ ảnh hưởng bào tử","難可靠控制，需依目標驗證與其他控制 / Khó tin cậy, cần kiểm chứng theo mục tiêu, phối hợp","壓力夠高就不需看時間或溫度 / Áp cao đủ khỏi xem thời gian, nhiệt"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 孢子耐受性使一般非熱 HPP 不能直接當商業滅菌；壓力結合高溫須另評估。\u003cspan class=\"vn\" lang=\"vi\">Bào tử chịu đựng nên HPP phi nhiệt không tự bằng tiệt trùng thương mại; áp kết hợp nhiệt cao cần đánh giá riêng.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：我需要＿＿與＿＿的驗證，才判斷保存條件。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tôi cần kiểm chứng ___ và ___ để xét bảo quản.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.efsa.europa.eu/en/efsajournal/pub/7128\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"}]}]}]};</script>
<script>
/*
 * runtime.client.js — 跑在瀏覽器裡的渲染器（17 週共用，逐字內嵌進每份 HTML）
 * 讀 window.__LESSON__ 的資料，把 modules / blocks 畫出來。
 * 互動行為（翻卡、展開、配對、測驗）沿用週1 手寫版的做法，不要另創一套。
 */
(function () {
  var D = window.__LESSON__;
  var SERIES = D.series;
  var $ = function (s) { return document.querySelector(s); };
  // 國合班 A2 版（D.a2）：介面文字加越南文；一般班 U() 只回中文，畫面與原本完全相同
  var A2 = !!D.a2;
  function U(zh, vn) { return A2 ? zh + " " + vn : zh; }

  /* ---------- 學習歷程記錄（Supabase） ----------
     只在 lesson.js 注入 D.track = {url, key} 的週次啟用（lib/tracking.json 的 weeks）；
     其他週 TRACK.on 為 false，send() 是空函式，教材行為完全不變。
     只送「學號代碼」與互動事件，不送姓名。送失敗就丟掉，不重試、不阻擋教材。 */
  var CTX = { mod: null, bi: 0 };   // 目前正在渲染的模組 id 與區塊序號（render 是同步的）
  var TRACK = (function () {
    var cfg = D.track;
    var noop = function () {};
    if (!cfg || !cfg.url || !cfg.key) return { on: false, send: noop, flush: noop, code: function () { return ""; }, setCode: noop };
    var KEY = "ifs_code", DKEY = "ifs_device";
    var rnd = function () { return Math.random().toString(36).slice(2, 10); };
    var sid = rnd() + Date.now().toString(36);
    // device_id：同一支手機／瀏覽器跨次開頁不變。學生後來才填學號代碼時，先前的 anon 事件可靠它回接。
    var did = "";
    try { did = localStorage.getItem(DKEY) || ""; if (!did) { did = "d" + rnd() + rnd(); localStorage.setItem(DKEY, did); } } catch (e) { did = "d" + rnd(); }
    var q = [], timer = null;
    function code() { try { return (localStorage.getItem(KEY) || "").trim(); } catch (e) { return ""; } }
    function setCode(v) { try { localStorage.setItem(KEY, (v || "").trim().slice(0, 20)); } catch (e) {} }
    function cut(s, n) { return s == null ? null : String(s).slice(0, n); }
    // 欄位長度與 payload 大小在前端先截到資料表 CHECK 的上限：PostgREST 批次 INSERT 是原子的，
    // 一筆違反 CHECK 整批都會被拒，而我們失敗即丟，會靜默掉整個 4 秒窗口。
    function send(event, mod, block, payload) {
      var p = payload || {};
      var ps = JSON.stringify(p);
      if (ps.length > 1800) p = { trunc: true, keys: Object.keys(p).slice(0, 10) };
      q.push({
        student_code: cut(code(), 20) || "anon", device_id: cut(did, 40), week: D.week || 0,
        module_id: cut(mod, 30), block_type: cut(block, 10), event: cut(event, 30),
        payload: p, session_id: cut(sid, 40), build: cut(D.build, 16), client_ts: new Date().toISOString(),
      });
      if (q.length >= 40) flush();
      else if (!timer) timer = setTimeout(flush, 4000);
    }
    function flush() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!q.length) return;
      var body = JSON.stringify(q.splice(0, 50));
      try {
        fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/ifs_lesson_events", {
          method: "POST", keepalive: true, body: body,
          headers: { "Content-Type": "application/json", "apikey": cfg.key, "Prefer": "return=minimal" },
        }).catch(noop);
      } catch (e) { /* 舊瀏覽器沒有 fetch：不記錄 */ }
      if (q.length) timer = setTimeout(flush, 1000);
    }
    window.addEventListener("pagehide", flush);
    return { on: true, send: send, flush: flush, code: code, setCode: setCode };
  })();

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function colorAt(given, i) { return given || SERIES[i % SERIES.length]; }
  function gridCls(n) { return "grid g" + (n === 2 || n === 3 || n === 4 ? n : 3); }
  function listHtml(v) {
    // body 可以是字串或字串陣列；陣列渲染成 <ul>
    if (v == null) return "";
    if (typeof v === "string") return '<p>' + v + '</p>';
    return '<ul>' + v.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
  }

  /* ---------- 區塊標題 ---------- */
  function heading(frag, b) {
    if (b.title) frag.appendChild(el("div", "sec-title", '<span class="bar"></span>' + b.title));
    if (b.hint) frag.appendChild(el("div", "hint", b.hint));
  }

  /* ---------- 各區塊 ---------- */
  var BLOCKS = {};

  BLOCKS.flips = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (d, i) {
      var c = colorAt(d.c, i);
      var card = el("div", "flip");
      if (b.h) card.style.height = b.h + "px";
      card.innerHTML =
        '<div class="flip-in">' +
        '<div class="face front"><div class="cbar" style="background:' + c + '"></div>' +
        '<div class="t">' + d.t + '</div><div class="en">' + (d.en || "") + '</div>' +
        '<div class="tap">▸ ' + U("點我看解釋", "Chạm để xem") + '</div></div>' +
        '<div class="face back"><div class="cbar" style="background:' + c + '"></div>' +
        '<p>' + d.b + '</p></div></div>';
      var mod = CTX.mod, bi = CTX.bi;
      card.onclick = function () {
        if (card.classList.toggle("on")) TRACK.send("flip_open", mod, "flips", { b: bi, i: i, t: d.t });
      };
      g.appendChild(card);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.exp = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div");
    b.items.forEach(function (t, i) {
      var box = el("div", "exp");
      var res = t.res ? '<div style="margin-top:10px;font-size:13px;color:var(--secondary);font-weight:700">🔗 ' + t.res + '</div>' : "";
      box.innerHTML =
        '<button><span class="num">' + (i + 1) + '</span><span>' + t.h + '</span>' +
        '<span class="tag">' + (t.tag || "") + '</span><span class="chev">›</span></button>' +
        '<div class="body">' + listHtml(t.body) + res + '</div>';
      var body = box.querySelector(".body");
      var mod = CTX.mod, bi = CTX.bi;
      box.querySelector("button").onclick = function () {
        var on = box.classList.toggle("on");
        if (!on) { body.style.maxHeight = "0px"; return; }
        TRACK.send("exp_open", mod, "exp", { b: bi, i: i, h: t.h });
        // 用實際內容高度展開，避免長段落被固定 max-height 截掉。
        // 必須先解除 max-height 再量：在 max-height:0 的狀態下量 scrollHeight 會得到 0，
        // 面板就只會開一條縫（實測過）。量完歸零並強制重排，transition 才有起點。
        body.style.maxHeight = "none";
        var h = body.scrollHeight;
        body.style.maxHeight = "0px";
        void body.offsetHeight;
        body.style.maxHeight = h + "px";
      };
      host.appendChild(box);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.cards = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var box = el("div", "card");
      box.style.borderTop = "4px solid " + accent;
      box.innerHTML = '<div class="h">' + c.h + '</div>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        (c.li ? '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>' : "") +
        (c.p ? '<p style="margin-top:8px;font-size:15.5px;color:var(--mid)">' + c.p + '</p>' : "");
      g.appendChild(box);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.timeline = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "tl");
    b.steps.forEach(function (s, i) {
      var st = el("div", "step");
      st.innerHTML = '<div class="dot" style="background:' + colorAt(s.c, i) + '">' + (i + 1) + '</div>' +
        '<h4>' + s.h + '</h4><p>' + s.p + '</p>';
      host.appendChild(st);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.compare = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "cmp");
    [b.left, b.right].forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var col = el("div", "col");
      col.innerHTML = '<div class="cbar" style="background:' + accent + '"></div>' +
        '<h4 style="color:' + accent + '">' + c.h + '</h4>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
      wrap.appendChild(col);
    });
    f.appendChild(wrap);
    if (b.note) f.appendChild(el("div", "cmp-note", b.note));
    return f;
  };

  BLOCKS.table = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "tblwrap");
    var html = '<table class="tbl"><thead><tr>' +
      b.head.map(function (h) { return '<th>' + h + '</th>'; }).join("") + '</tr></thead><tbody>' +
      b.rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join("") + '</tr>';
      }).join("") + '</tbody></table>';
    wrap.innerHTML = html;
    f.appendChild(wrap); return f;
  };

  BLOCKS.note = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    f.appendChild(el("div", "note" + (b.kind ? " " + b.kind : ""), b.text));
    return f;
  };

  BLOCKS.match = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "match-wrap");
    var pool = el("div", "pool"), targets = el("div", "targets");
    var pairs = b.pairs;
    var order = pairs.slice().sort(function () { return Math.random() - 0.5; });
    var selected = null, solved = 0, errors = 0, t0 = null;
    var mod = CTX.mod, bi = CTX.bi;
    var msg = el("div");
    msg.style.cssText = "margin-top:14px;font-weight:700;color:var(--green)";

    function tryMatch(slot, key) {
      if (slot.classList.contains("ok")) return;
      if (t0 === null) t0 = Date.now();
      if (slot.dataset.k === key) {
        slot.classList.add("ok"); slot.classList.remove("bad");
        slot.querySelector(".drop").textContent = key;
        var chip = pool.querySelector('.chip[data-k="' + key + '"]');
        chip.classList.add("used"); chip.classList.remove("sel");
        selected = null; solved++;
        TRACK.send("match_ok", mod, "match", { b: bi, label: key });
        if (solved === pairs.length) {
          msg.textContent = b.done || U("✓ 全部答對！", "Đúng hết!");
          TRACK.send("match_done", mod, "match", { b: bi, n: pairs.length, errors: errors, ms: Date.now() - t0 });
        }
      } else {
        errors++;
        TRACK.send("match_bad", mod, "match", { b: bi, label: key, slot: slot.dataset.k });
        slot.classList.add("bad");
        setTimeout(function () { slot.classList.remove("bad"); }, 350);
      }
    }
    order.forEach(function (q) {
      var c = el("div", "chip"); c.textContent = q.label; c.draggable = true; c.dataset.k = q.label;
      c.addEventListener("dragstart", function (e) { e.dataTransfer.setData("k", q.label); });
      c.onclick = function () {
        if (c.classList.contains("used")) return;
        if (selected === c) { c.classList.remove("sel"); selected = null; return; }
        pool.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("sel"); });
        c.classList.add("sel"); selected = c;
      };
      pool.appendChild(c);
    });
    pairs.forEach(function (q) {
      var s = el("div", "slot"); s.dataset.k = q.label;
      s.innerHTML = '<div class="drop">' + U("拖到這裡", "Kéo vào đây") + '</div><div class="desc">' + q.desc + '</div>';
      s.addEventListener("dragover", function (e) { e.preventDefault(); });
      s.addEventListener("drop", function (e) { e.preventDefault(); tryMatch(s, e.dataTransfer.getData("k")); });
      s.onclick = function () { if (selected) tryMatch(s, selected.dataset.k); };
      targets.appendChild(s);
    });
    host.appendChild(pool); host.appendChild(targets); host.appendChild(msg);
    f.appendChild(host); return f;
  };

  /* 結果代碼：把作答結果編成一串可貼給老師的代碼（FSQ1.<base64>.<檢查碼>）。
     解碼與彙整用專案根目錄的「食品科學概論_測驗成績解碼器.html」。 */
  function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
  function checksum(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1679616; // 36^4
    return h.toString(36);
  }

  BLOCKS.quiz = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var items = b.items, n = items.length;
    var head = el("div", "quiz-head");
    head.innerHTML =
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
      '<input class="qid" placeholder="' + U("學號（交成績必填）", "Mã số SV") + '" style="flex:1;min-width:130px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px">' +
      '<input class="qname" placeholder="' + U("姓名", "Họ tên") + '" style="flex:1;min-width:100px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px"></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
      '<strong class="qprog">' + U("進度", "Tiến độ") + ' 0 / ' + n + '</strong>' +
      '<span class="qscore" style="color:var(--secondary);font-weight:800">' + U("得分", "Điểm") + ' 0</span></div>' +
      '<div class="pbar"><div class="pfill"></div></div>';
    var box = el("div");
    var sb = el("div", "scorebox");
    sb.innerHTML = '<div>' + U("你的成績", "Điểm của bạn") + '</div><div class="big"><span class="fscore">0</span> / ' + n + '</div>' +
      '<div class="smsg" style="margin:8px 0 16px"></div>' +
      '<div class="rcwrap" style="margin:0 auto 16px;max-width:560px;text-align:left">' +
      '<div style="font-weight:700;margin-bottom:6px">' + U("結果代碼（請複製後，貼到老師指定的表單或訊息）", "— Mã kết quả: sao chép và gửi cho thầy/cô") + '</div>' +
      '<textarea class="rcode" readonly rows="3" style="width:100%;box-sizing:border-box;font-family:monospace;font-size:12px;padding:8px;border:1.5px solid var(--line,#ccc);border-radius:8px;resize:none"></textarea>' +
      '<div class="rmsg" style="font-size:13px;color:#B34700;margin-top:4px"></div>' +
      '<button class="btn copyrc" style="margin-top:8px">📋 ' + U("複製結果代碼", "Sao chép mã") + '</button></div>' +
      '<button class="btn ghost">' + U("重新測驗", "Làm lại") + '</button>';

    var answered = 0, score = 0, picks = [], qt0 = null, attempt = 0;
    var mod = CTX.mod, bi = CTX.bi;
    // 測驗的學號欄與頁首的學號代碼同步（兩邊填任一邊都行）
    var qidInput = head.querySelector(".qid");
    if (TRACK.on) {
      if (TRACK.code()) qidInput.value = TRACK.code();
      qidInput.addEventListener("change", function () {
        TRACK.setCode(qidInput.value);
        var top = $("#ifs-code"); if (top) top.value = TRACK.code();
      });
    }
    function updateProg() {
      head.querySelector(".qprog").textContent = U("進度", "Tiến độ") + " " + answered + " / " + n;
      head.querySelector(".qscore").textContent = U("得分", "Điểm") + " " + score;
      head.querySelector(".pfill").style.width = (answered / n * 100) + "%";
    }
    function finish() {
      sb.querySelector(".fscore").textContent = score;
      var pct = score / n, m;
      if (score === n) m = U("本次全對！請再用自己的話說明咖啡的濃縮、乾燥與保存條件。", "Đúng hết lần này! Hãy giải thích tình huống bằng lời của mình.");
      else if (pct >= 0.8) m = U("很棒！觀念相當扎實。", "Rất tốt!");
      else if (pct >= 0.6) m = U("不錯，再複習幾個弱點就更好。", "Khá tốt, ôn lại vài chỗ nữa nhé.");
      else m = U("建議回到前面單元再看一次翻卡與展開內容。", "Hãy xem lại các phần phía trước.");
      sb.querySelector(".smsg").textContent = m;

      var sid = head.querySelector(".qid").value.trim();
      var sname = head.querySelector(".qname").value.trim();
      var korr = items.map(function (item, i) { return picks[i] === item.a ? 1 : 0; }).join("");
      var payload = JSON.stringify({
        w: D.week || 0, c: A2 ? "a2" : undefined, id: sid, nm: sname, s: score, n: n,
        a: picks, k: korr, t: new Date().toISOString().slice(0, 16),
      });
      var body = b64utf8(payload);
      var code = "FSQ1." + body + "." + checksum(body);
      sb.querySelector(".rcode").value = code;
      sb.querySelector(".rmsg").textContent = sid ? "" : U("⚠ 尚未填學號 —— 請回到測驗上方填入學號後重新測驗，否則老師無法登記成績。", "Chưa nhập mã số SV: hãy nhập ở trên rồi làm lại.");
      TRACK.send("quiz_done", mod, "quiz", { b: bi, attempt: attempt, score: score, n: n, picks: picks, ms: qt0 ? Date.now() - qt0 : null });
      TRACK.flush();

      sb.classList.add("show");
      sb.scrollIntoView({ behavior: "smooth" });
    }
    function pick(qel, item, oi) {
      if (qel.dataset.done === "1") return;
      qel.dataset.done = "1"; answered++;
      if (qt0 === null) qt0 = Date.now();
      picks[parseInt(qel.dataset.qi, 10)] = oi;
      TRACK.send("quiz_answer", mod, "quiz", { b: bi, attempt: attempt, qi: parseInt(qel.dataset.qi, 10), pick: oi, ok: oi === item.a });
      qel.querySelectorAll(".opt").forEach(function (btn, i) {
        btn.classList.add("dim");
        if (i === item.a) btn.classList.add("correct");
        if (i === oi && oi !== item.a) btn.classList.add("wrong");
      });
      var fb = qel.querySelector(".fb");
      if (oi === item.a) { score++; fb.classList.add("good"); fb.innerHTML = U("✓ 正確！", "Đúng!") + item.e; }
      else { fb.classList.add("no"); fb.innerHTML = U("✗ 正解：", "Sai. Đáp án:") + item.o[item.a] + "。" + item.e; }
      fb.classList.add("show"); updateProg();
      if (answered === n) finish();
    }
    function build() {
      box.innerHTML = ""; answered = 0; score = 0; picks = []; qt0 = null; attempt++; updateProg();
      sb.classList.remove("show");
      items.forEach(function (item, qi) {
        var qel = el("div", "q"); qel.dataset.done = "0"; qel.dataset.qi = qi;
        qel.innerHTML = '<div class="qn">第 ' + (qi + 1) + ' 題' + (A2 ? ' · Câu ' + (qi + 1) : '') + '</div><div class="qt">' + item.q + '</div>';
        item.o.forEach(function (opt, oi) {
          var btn = el("button", "opt"); btn.textContent = opt;
          btn.onclick = function () { pick(qel, item, oi); };
          qel.appendChild(btn);
        });
        qel.appendChild(el("div", "fb"));
        box.appendChild(qel);
      });
    }
    sb.querySelector(".copyrc").onclick = function () {
      var ta = sb.querySelector(".rcode");
      ta.select(); ta.setSelectionRange(0, 99999);
      var btn = this;
      function ok() { btn.textContent = U("✓ 已複製，請貼給老師", "Đã sao chép"); setTimeout(function () { btn.textContent = "📋 " + U("複製結果代碼", "Sao chép mã"); }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(ta.value).then(ok, function () { document.execCommand("copy"); ok(); });
      else { document.execCommand("copy"); ok(); }
    };
    sb.querySelector(".ghost").onclick = function () {
      build(); window.scrollTo({ top: 0, behavior: "smooth" });
    };
    build();
    f.appendChild(head); f.appendChild(box); f.appendChild(sb);
    return f;
  };

  /* ---------- 組裝 ---------- */
  var nav = $("#nav"), main = $("#main");
  var curMod = D.modules.length ? D.modules[0].id : null, modT0 = Date.now();
  function switchMod(id, btn) {
    document.querySelectorAll(".module").forEach(function (m) { m.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
    nav.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
    btn.classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (id !== curMod) {
      TRACK.send("module_view", id, null, { from: curMod, ms: Date.now() - modT0 });
      curMod = id; modT0 = Date.now();
    }
  }
  D.modules.forEach(function (m, i) {
    var btn = el("button", i === 0 ? "active" : "", m.nav);
    btn.onclick = function () { switchMod(m.id, btn); };
    nav.appendChild(btn);

    var sec = el("section", "module" + (i === 0 ? " active" : ""));
    sec.id = m.id;
    sec.appendChild(el("div", "lead",
      '<div class="kicker">' + m.kicker + '</div><h2>' + m.h2 + '</h2><p>' + m.lead + '</p>'));
    m.blocks.forEach(function (b, bi) {
      var render = BLOCKS[b.type];
      if (!render) { console.error("未知區塊型別:", b.type); return; }
      CTX.mod = m.id; CTX.bi = bi;
      sec.appendChild(render(b));
    });
    main.appendChild(sec);
  });

  /* ---------- 學號代碼列（只在啟用記錄的週出現） ---------- */
  if (TRACK.on) {
    var bar = el("div", "codebar");
    bar.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;font-size:14px";
    bar.innerHTML = '<label for="ifs-code" style="font-weight:700">學號代碼</label>' +
      '<input id="ifs-code" maxlength="20" placeholder="例：S001" style="width:120px;padding:6px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:14px">' +
      '<span style="opacity:.75">只記錄你的學習歷程（翻卡、配對、測驗），不需要姓名。</span>';
    nav.parentNode.insertBefore(bar, nav);
    var inp = bar.querySelector("#ifs-code");
    inp.value = TRACK.code();
    inp.addEventListener("change", function () {
      TRACK.setCode(inp.value);
      document.querySelectorAll(".qid").forEach(function (x) { x.value = TRACK.code(); });
      TRACK.send("code_set", null, null, {});
    });
    TRACK.send("session_start", curMod, null, {
      device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || "") ? "mobile" : "desktop",
      w: window.innerWidth, build: D.build || null,
    });
    // 停留時間以「頁面可見」為準：切到背景就結算一段 module_leave，回來重新計時。
    // 手機瀏覽器殺分頁常不觸發 pagehide，所以以 visibilitychange→hidden 為主。
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        TRACK.send("module_leave", curMod, null, { ms: Date.now() - modT0 }); TRACK.flush();
      } else {
        modT0 = Date.now();
      }
    });
  }
})();
</script>
</body>
</html>
