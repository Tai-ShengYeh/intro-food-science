<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品科學概論 第4週 · 國合班互動練習</title>
<style>
  :root{
    --primary:#2D2A6E; --secondary:#5B4FB8; --accent:#00B8B8; --warm:#F5A623; --green:#2FA36B; --red:#D65B5B; --dark:#1A1A3E; --bg:#F4F5FA; --text:#1F1F2E; --mid:#5A5A75; --muted:#9096ac; --border:#E2E2EC; --card:#fff;
  }
/* 版型樣式 — 逐條取自「第1週_互動教學.html」，末段為新增區塊（cmp / tbl / note）。
   這裡只用 var(--x)；色票由 tokens.js 產生 :root 注入。 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:17px}
header{background:linear-gradient(120deg,var(--dark),var(--primary));color:#fff;
  padding:26px 22px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(0,0,0,.15)}
header h1{font-size:31px;font-weight:800;letter-spacing:.5px}
header .sub{color:#b9c7ff;font-size:16px;margin-top:5px}
nav{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.10);color:#dfe4ff;border:none;padding:12px 18px;
  border-radius:10px 10px 0 0;font-size:16.5px;cursor:pointer;font-weight:600;transition:.15s}
nav button:hover{background:rgba(255,255,255,.2)}
nav button.active{background:var(--bg);color:var(--primary)}
main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
.module{display:none;animation:fade .35s}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead{background:var(--dark);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:22px}
.lead .kicker{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px}
.lead h2{font-size:26px;margin:6px 0 8px}
.lead p{color:#cdd3ee;font-size:16.5px}
.sec-title{font-size:23px;font-weight:800;color:var(--primary);margin:30px 0 6px;
  display:flex;align-items:center;gap:10px}
.sec-title .bar{width:6px;height:25px;background:var(--accent);border-radius:3px;display:inline-block}
.hint{color:var(--mid);font-size:15px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* flip cards */
.flip{perspective:1100px;height:200px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px rgba(30,30,60,.08);border:1px solid var(--border)}
.front{background:var(--card)}
.front .t{font-size:21px;font-weight:800;color:var(--primary)}
.front .en{color:var(--muted);font-size:14px;margin-top:3px;font-style:italic}
.front .tap{margin-top:auto;color:var(--accent);font-size:14px;font-weight:700}
.back{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;transform:rotateY(180deg);overflow:auto}
.back p{font-size:16px}
.cbar{height:6px;border-radius:14px 14px 0 0;position:absolute;top:0;left:0;right:0}

/* expandable */
.exp{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.exp>button{width:100%;text-align:left;background:none;border:none;padding:16px 18px;cursor:pointer;
  display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;color:var(--text)}
.exp .num{background:var(--primary);color:#fff;min-width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.exp .chev{margin-left:auto;color:var(--muted);transition:.25s;font-size:20px}
.exp.on .chev{transform:rotate(90deg);color:var(--accent)}
.exp .body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 18px}
.exp.on .body{padding:0 18px 16px 62px}
.exp .body ul{margin-left:16px;color:var(--mid);font-size:16px}
.exp .body p{color:var(--mid);font-size:15.5px}
.exp .tag{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:8px}

/* info card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.card .h{font-weight:800;color:var(--primary);font-size:18px;margin-bottom:6px}
.card .en{color:var(--muted);font-size:13px;font-style:italic}
.card ul{margin:8px 0 0 18px;font-size:15.5px;color:var(--mid)}

/* timeline */
.tl{display:flex;gap:0;flex-wrap:wrap;counter-reset:s}
.tl .step{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 14px 14px;margin:8px;position:relative}
.tl .dot{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;margin-bottom:8px}
.tl .step h4{color:var(--primary);font-size:17.5px;margin-bottom:4px}
.tl .step p{font-size:15px;color:var(--mid)}

/* matching */
.match-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.pool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--secondary);color:#fff;padding:10px 17px;border-radius:22px;font-weight:700;
  cursor:grab;user-select:none;font-size:16.5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chip.used{opacity:.35;pointer-events:none}
.chip.sel{outline:3px solid var(--warm);outline-offset:2px}
.targets{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;border:2px dashed var(--border);border-radius:12px;padding:10px 14px;background:#fafbff}
.slot .desc{flex:1;font-size:16px;color:var(--text)}
.slot .drop{min-width:130px;min-height:44px;border-radius:8px;background:#eef0f8;display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:15px;padding:8px 12px}
.slot.ok{border-color:var(--green);background:#effaf3}
.slot.ok .drop{background:var(--green);color:#fff;font-weight:700}
.slot.bad{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* quiz */
.quiz-head{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.pbar{height:12px;background:#e7e9f4;border-radius:8px;overflow:hidden;margin-top:10px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--secondary));transition:width .4s}
.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.q .qn{color:var(--accent);font-weight:800;font-size:14px}
.q .qt{font-size:19.5px;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fafbff;border:2px solid var(--border);
  border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;font-size:16.5px;transition:.15s}
.opt:hover{border-color:var(--secondary)}
.opt.correct{border-color:var(--green);background:#effaf3;font-weight:700}
.opt.wrong{border-color:var(--red);background:#fdeeee}
.opt.dim{opacity:.6}
.fb{margin-top:8px;font-size:15.5px;padding:11px 14px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.good{background:#effaf3;color:#1c7a4d} .fb.no{background:#fdeeee;color:#a83b3b}
.scorebox{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:16px;
  padding:26px;text-align:center;margin-top:10px;display:none}
.scorebox.show{display:block}
.scorebox .big{font-size:46px;font-weight:800}
.btn{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:10px;
  font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.18)}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;background:#eef0fb;color:var(--secondary);padding:3px 10px;border-radius:20px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px}

/* ===== 新增區塊 ===== */
/* compare：兩欄對照（梅納 vs 焦糖化、冷藏 vs 冷凍…） */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media(max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 18px 18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06);position:relative;overflow:hidden}
.cmp .col .cbar{position:static;height:6px;margin:0 -18px 14px;border-radius:0}
.cmp .col h4{font-size:20px;font-weight:800;margin-bottom:2px}
.cmp .col .en{color:var(--muted);font-size:13px;font-style:italic;margin-bottom:8px}
.cmp .col ul{margin-left:18px;font-size:15.5px;color:var(--mid)}
.cmp .col li{margin-bottom:5px}
.cmp-note{margin-top:12px;background:#eef0fb;border-left:5px solid var(--secondary);
  border-radius:0 10px 10px 0;padding:12px 16px;font-size:16px;color:var(--primary);font-weight:600}

/* table：資料表（維生素、添加物分類…） */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px}
.tbl th{background:var(--primary);color:#fff;text-align:left;padding:12px 14px;font-weight:700;font-size:15px}
.tbl td{padding:11px 14px;border-top:1px solid var(--border);color:var(--mid);vertical-align:top}
.tbl tr:nth-child(even) td{background:#fafbff}
.tbl td:first-child{color:var(--text);font-weight:700}

/* note：重點提示條 */
.note{background:#fff8e9;border-left:5px solid var(--warm);border-radius:0 12px 12px 0;
  padding:14px 18px;margin:14px 0;font-size:16px;color:var(--text)}
.note b{color:var(--primary)}
.note.key{background:#effaf3;border-left-color:var(--green)}
.note.warn{background:#fdeeee;border-left-color:var(--red)}
/* 國合班 A2 互動練習：拼音與越南文（build_a2.js 產生的內容才會用到） */
.py{display:block;font-size:.78em;font-weight:500;color:var(--mid);margin-top:2px}
.vn{display:block;font-size:.88em;font-weight:500;color:var(--secondary);margin-top:2px}
/* Shared classroom tasks: oral response, sentence support, then sample explanation. */
.class-activity{display:grid;gap:12px;min-width:0}
.class-activity .vn{display:block;color:#0E7C7B;font-size:15px;line-height:1.5;margin-top:4px}
.activity-time{color:#0E7C7B;font-weight:700;font-size:15px}
.activity-prompt{font-size:clamp(18px,2.3vw,23px);line-height:1.5}
.sentence-stem{padding:12px 16px;background:#EFFAF3;border-left:5px solid #2FA36B;color:#1A1A3E;line-height:1.6}
.class-activity label{font-size:14px;color:#52526B}
.activity-response{display:block;width:100%;max-width:100%;min-height:72px;border:1.5px solid #A0A0B5;border-radius:8px;padding:10px 12px;resize:vertical;font:inherit;font-size:17px;background:#fff;color:#1F1F2E}
.activity-answer{border:1px solid #E2E2EC;background:#fff;border-radius:8px;padding:10px 14px;font-size:16px;line-height:1.5}
.activity-answer summary{cursor:pointer;font-weight:700;color:#2D2A6E}
.activity-answer p{margin-top:10px}
.activity-response:focus-visible,.activity-answer summary:focus-visible{outline:3px solid #0E7C7B;outline-offset:3px}
.source-note{font-size:13px;color:#52526B;line-height:1.5;overflow-wrap:anywhere;margin-top:10px}
.source-note .vn{display:block;color:#0E7C7B;font-size:13px}
.lesson-links{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.lesson-links a{color:inherit;text-underline-offset:3px}
.feedback-reason,.feedback-transfer{margin-top:6px}
.feedback-transfer{font-weight:600}
@media(max-width:640px){header{position:relative!important}.class-activity{gap:10px}}
@media print{.activity-response{min-height:64px}}


.back .vn{color:#D7FAF3}.tbl-wrap{overflow-x:auto}
</style>
</head>

<script>window.__LESSON__={"week":4,"series":["#2D2A6E","#2FA36B","#F5A623","#5B4FB8","#00B8B8","#D65B5B"],"modules":[{"id":"m0","nav":"今天 Hôm nay","kicker":"今天學什麼 · Hôm nay học gì","h2":"蛋白質","lead":"dànbáizhí　·　Protein","blocks":[{"type":"cards","title":"今天學三件事　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Hôm nay học 3 điều\u003c/span>","cols":3,"items":[{"h":"蛋白質的結構","p":"\u003cspan class=\"vn\">Cấu trúc của protein\u003c/span>"},{"h":"變性和凝固","p":"\u003cspan class=\"vn\">Biến tính và đông tụ\u003c/span>"},{"h":"蛋白質在食物裡做什麼？","p":"\u003cspan class=\"vn\">Protein làm gì trong thực phẩm?\u003c/span>"}]},{"type":"note","title":"看影片：豆漿變豆腐　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Xem video: sữa đậu nành thành đậu phụ\u003c/span>","text":"\u003ca href=\"https://www.youtube.com/watch?v=R5uOdClCsjY&t=528s\" target=\"_blank\" rel=\"noopener\" style=\"font-weight:700\">▶ 豆漿怎麼變成豆腐？\u003c/a>\u003cspan class=\"vn\">Sữa đậu nành biến thành đậu phụ thế nào?\u003c/span>\u003cul style=\"margin:10px 0 0;padding-left:22px\">\u003cli>倒進豆漿的液體叫什麼？\u003cspan class=\"vn\">Chất lỏng đổ vào sữa đậu nành tên là gì?\u003c/span>\u003c/li>\u003cli>倒進去以後，攪拌幾秒？\u003cspan class=\"vn\">Đổ vào rồi, khuấy trong mấy giây?\u003c/span>\u003c/li>\u003cli>幾分鐘後，豆漿變成什麼樣子？\u003cspan class=\"vn\">Vài phút sau, sữa đậu nành trông thế nào?\u003c/span>\u003c/li>\u003c/ul>"},{"type":"cards","title":"同一杯豆漿，怎麼變成豆腐？\u003cspan class=\"vn\" lang=\"vi\">Cùng một cốc sữa đậu nành, thành đậu phụ thế nào?\u003c/span>","cols":3,"items":[{"h":"① 豆漿：蛋白質分散\u003cspan class=\"vn\" lang=\"vi\">Sữa: protein phân tán\u003c/span>","p":"豆漿裡有大豆蛋白、水和其他成分。\u003cspan class=\"vn\" lang=\"vi\">Có protein đậu nành, nước và thành phần khác.\u003c/span>","c":"#2D2A6E"},{"h":"② 加熱：構形改變\u003cspan class=\"vn\" lang=\"vi\">Đun: đổi cấu hình\u003c/span>","p":"適當加熱讓部分蛋白質展開，為後續聚集做準備。\u003cspan class=\"vn\" lang=\"vi\">Gia nhiệt phù hợp làm một phần protein mở ra, chuẩn bị cho tập hợp.\u003c/span>","c":"#2FA36B"},{"h":"③ 凝固：形成網絡\u003cspan class=\"vn\" lang=\"vi\">Đông tụ: tạo mạng lưới\u003c/span>","p":"凝固劑與適合條件促進聚集，形成可留住水的網絡。\u003cspan class=\"vn\" lang=\"vi\">Chất đông tụ và điều kiện phù hợp thúc đẩy tập hợp, tạo mạng giữ nước.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"鹽滷、石膏與酸型凝固劑的作用不同；豆漿濃度、加熱、用量與攪拌都影響口感。不是只要加鹽就一定成豆腐。\u003cspan class=\"vn\" lang=\"vi\">Nigari, thạch cao thực phẩm và chất đông tụ dạng axit có cơ chế khác nhau. Nồng độ sữa, nhiệt, lượng thêm và khuấy đều ảnh hưởng kết cấu; không phải cứ thêm muối là thành đậu phụ.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.1021/acs.jchemed.3c00096\" target=\"_blank\" rel=\"noopener\">豆腐教學實驗 / Thí nghiệm đậu phụ: Journal of Chemical Education, 2023 ↗\u003c/a>\u003c/p>"}]},{"id":"m1","nav":"生詞 Từ mới","kicker":"生詞 · Từ mới","h2":"本週生詞","lead":"10 個生詞　·　10 từ mới","blocks":[{"type":"flips","cols":3,"items":[{"t":"胺基酸","en":"ānjīsuān","b":"axit amin"},{"t":"酪蛋白","en":"làodànbái","b":"casein"},{"t":"胜肽鍵","en":"shèngtàijiàn","b":"liên kết peptit"},{"t":"變性","en":"biànxìng","b":"biến tính (protein)"},{"t":"凝固","en":"nínggù","b":"đông tụ"}],"title":"翻卡：生詞　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Lật thẻ: từ mới\u003c/span>"},{"type":"flips","cols":3,"items":[{"t":"等電點","en":"děngdiàndiǎn","b":"điểm đẳng điện (pI)"},{"t":"起泡性","en":"qǐpàoxìng","b":"khả năng tạo bọt"},{"t":"乳化性","en":"rǔhuàxìng","b":"khả năng nhũ hóa"},{"t":"膠凝性","en":"jiāoníngxìng","b":"khả năng tạo gel"},{"t":"麵筋","en":"miànjīn","b":"gluten"}]},{"type":"match","title":"配對：中文 ↔ 越南文　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Ghép: tiếng Trung ↔ tiếng Việt\u003c/span>","pairs":[{"label":"胺基酸","desc":"axit amin"},{"label":"酪蛋白","desc":"casein"},{"label":"胜肽鍵","desc":"liên kết peptit"},{"label":"變性","desc":"biến tính (protein)"},{"label":"凝固","desc":"đông tụ"},{"label":"等電點","desc":"điểm đẳng điện (pI)"},{"label":"起泡性","desc":"khả năng tạo bọt"},{"label":"乳化性","desc":"khả năng nhũ hóa"},{"label":"膠凝性","desc":"khả năng tạo gel"},{"label":"麵筋","desc":"gluten"}],"done":"✓ 全部答對！Đúng hết!"}]},{"id":"s1","nav":"一 蛋白質的結構","kicker":"第一段 · Phần 1","h2":"蛋白質的結構","lead":"Cấu trúc của protein","blocks":[{"type":"cards","title":"從胺基酸到蛋白質\u003cspan class=\"vn\" lang=\"vi\">Từ axit amin đến protein\u003c/span>","cols":3,"items":[{"h":"胺基酸\u003cspan class=\"vn\" lang=\"vi\">Axit amin\u003c/span>","p":"本課先學常見的 20 種；側鏈 R 影響性質。\u003cspan class=\"vn\" lang=\"vi\">Bài này học 20 loại thông dụng; nhóm R ảnh hưởng tính chất.\u003c/span>","c":"#2D2A6E"},{"h":"必需胺基酸\u003cspan class=\"vn\" lang=\"vi\">Axit amin thiết yếu\u003c/span>","p":"成人有 9 種，身體不能合成足夠量，要由飲食取得。\u003cspan class=\"vn\" lang=\"vi\">Người lớn có 9 loại; cơ thể không tổng hợp đủ, cần lấy từ thức ăn.\u003c/span>","c":"#2FA36B"},{"h":"胜肽鍵\u003cspan class=\"vn\" lang=\"vi\">Liên kết peptit\u003c/span>","p":"連接胺基酸的主鏈；一般變性不以切斷它為特徵。\u003cspan class=\"vn\" lang=\"vi\">Nối axit amin trong mạch chính; biến tính thông thường không đặc trưng bởi cắt liên kết này.\u003c/span>","c":"#F5A623"}]},{"type":"cards","title":"四級結構：順序、局部、整體、組合\u003cspan class=\"vn\" lang=\"vi\">Bốn bậc: trình tự, cục bộ, toàn thể, tổ hợp\u003c/span>","cols":4,"items":[{"h":"一級：順序\u003cspan class=\"vn\" lang=\"vi\">Bậc 1: trình tự\u003c/span>","p":"胺基酸排列順序；主鏈由胜肽鍵連接。\u003cspan class=\"vn\" lang=\"vi\">Trình tự axit amin; mạch chính nối bằng liên kết peptit.\u003c/span>","c":"#2D2A6E"},{"h":"二級：局部摺疊\u003cspan class=\"vn\" lang=\"vi\">Bậc 2: gấp cuộn cục bộ\u003c/span>","p":"如 α 螺旋、β 摺板，主鏈氫鍵很重要。\u003cspan class=\"vn\" lang=\"vi\">Như xoắn α, phiến gấp β; liên kết hydro của mạch chính quan trọng.\u003c/span>","c":"#2FA36B"},{"h":"三級：整條鏈形狀\u003cspan class=\"vn\" lang=\"vi\">Bậc 3: hình dạng một chuỗi\u003c/span>","p":"多種作用維持形狀；有些還有共價的雙硫鍵。\u003cspan class=\"vn\" lang=\"vi\">Nhiều tương tác giữ hình dạng; một số có cầu disulfide cộng hóa trị.\u003c/span>","c":"#F5A623"},{"h":"四級：多條鏈組合\u003cspan class=\"vn\" lang=\"vi\">Bậc 4: nhiều chuỗi kết hợp\u003c/span>","p":"不是每種蛋白質都有四級結構。\u003cspan class=\"vn\" lang=\"vi\">Không phải protein nào cũng có cấu trúc bậc 4.\u003c/span>","c":"#5B4FB8"}]},{"type":"note","title":"","text":"維持高階結構的作用不全是「弱鍵」，雙硫鍵就是共價鍵。一般變性主要改變高階構形，不等於主鏈水解。\u003cspan class=\"vn\" lang=\"vi\">Không phải mọi tương tác giữ cấu trúc bậc cao đều là liên kết yếu; cầu disulfide là cộng hóa trị. Biến tính thông thường chủ yếu đổi cấu hình bậc cao, không đồng nghĩa thủy phân mạch chính.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://openstax.org/books/biology-2e/pages/3-4-proteins\" target=\"_blank\" rel=\"noopener\">結構與變性 / Cấu trúc: OpenStax Biology 2e §3.4 ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 1｜珠子、連線與摺疊\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 1: Hạt, liên kết và nếp gấp\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"chain\">\u003cp class=\"activity-time\">1 分鐘 / 1 phút\u003c/p>\u003cp class=\"activity-prompt\">用串珠比喻蛋白質：珠子是什麼？珠子間的連線是什麼？變性主要改變連線，還是摺疊？\u003cspan class=\"vn\" lang=\"vi\">Ví protein như chuỗi hạt: hạt là gì, liên kết giữa hạt là gì? Biến tính chủ yếu đổi liên kết hay nếp gấp?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>珠子像＿＿，連線像＿＿；變性主要改變＿＿。\u003cspan class=\"vn\" lang=\"vi\">Hạt giống ___, liên kết giống ___; biến tính chủ yếu đổi ___.\u003c/span>\u003c/div>\u003clabel for=\"a2-w4-chain\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w4-chain\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>珠子像胺基酸，連線像胜肽鍵；變性主要改變摺疊形狀。\u003cspan class=\"vn\" lang=\"vi\">Hạt giống axit amin, liên kết giống liên kết peptit; biến tính chủ yếu đổi hình dạng gấp cuộn.\u003c/span>\u003c/p>\u003cp>這是簡化模型。變性不等於把主鏈切成小段；切斷胜肽鍵是水解等另一類變化。\u003cspan class=\"vn\" lang=\"vi\">Đây là mô hình đơn giản. Biến tính không có nghĩa cắt mạch chính thành đoạn nhỏ; cắt liên kết peptit là biến đổi khác, như thủy phân.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"蛋白質互補：相對不足，不是完全沒有\u003cspan class=\"vn\" lang=\"vi\">Bổ sung protein: tương đối ít, không phải không có\u003c/span>","cols":3,"items":[{"h":"穀類蛋白質\u003cspan class=\"vn\" lang=\"vi\">Protein ngũ cốc\u003c/span>","p":"離胺酸常相對較少，不是完全沒有。\u003cspan class=\"vn\" lang=\"vi\">Lysine thường tương đối ít, không phải hoàn toàn không có.\u003c/span>","c":"#2D2A6E"},{"h":"豆類蛋白質\u003cspan class=\"vn\" lang=\"vi\">Protein đậu\u003c/span>","p":"含硫胺基酸常相對受限，程度依品種與加工而異。\u003cspan class=\"vn\" lang=\"vi\">Axit amin chứa lưu huỳnh thường hạn chế tương đối; tùy giống và chế biến.\u003c/span>","c":"#2FA36B"},{"h":"搭配與總量\u003cspan class=\"vn\" lang=\"vi\">Kết hợp và tổng lượng\u003c/span>","p":"米飯配豆類可互補；還要看攝取量、消化率與需求。\u003cspan class=\"vn\" lang=\"vi\">Cơm kết hợp đậu có thể bổ sung; còn xem lượng ăn, độ tiêu hóa và nhu cầu.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"「限制胺基酸」是相對於指定需求模式，比例最不足的必需胺基酸。品質不能只看「動物／植物」，也不把某一個分數套到所有產品。\u003cspan class=\"vn\" lang=\"vi\">Axit amin giới hạn là axit amin thiết yếu có tỷ lệ thiếu nhất so với mẫu nhu cầu quy định. Không đánh giá chất lượng chỉ từ động vật/thực vật hay áp một điểm cho mọi sản phẩm.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/i3124e/i3124e.pdf\" target=\"_blank\" rel=\"noopener\">品質與參考模式 / Chất lượng: FAO, 2013 ↗\u003c/a>\u003c/p>"}]},{"id":"s2","nav":"二 變性和凝固","kicker":"第二段 · Phần 2","h2":"變性和凝固","lead":"Biến tính và đông tụ","blocks":[{"type":"cards","title":"變性、聚集、成膠：分開看\u003cspan class=\"vn\" lang=\"vi\">Phân biệt biến tính, tập hợp và tạo gel\u003c/span>","cols":3,"items":[{"h":"變性\u003cspan class=\"vn\" lang=\"vi\">Biến tính\u003c/span>","p":"原有摺疊或組合改變；主鏈通常保留。\u003cspan class=\"vn\" lang=\"vi\">Nếp gấp hay tổ hợp ban đầu thay đổi; mạch chính thường được giữ.\u003c/span>","c":"#2D2A6E"},{"h":"聚集／凝固\u003cspan class=\"vn\" lang=\"vi\">Tập hợp / đông tụ\u003c/span>","p":"分子彼此靠近、聚集；可能看到結塊。\u003cspan class=\"vn\" lang=\"vi\">Phân tử đến gần và tập hợp; có thể thấy vón cục.\u003c/span>","c":"#2FA36B"},{"h":"成膠\u003cspan class=\"vn\" lang=\"vi\">Tạo gel\u003c/span>","p":"形成連續網絡，留住部分水；不只是單一分子改變形狀。\u003cspan class=\"vn\" lang=\"vi\">Tạo mạng liên tục giữ một phần nước; không chỉ đổi hình dạng một phân tử.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"變性後不一定立刻凝固，也不代表營養全部消失。加熱可改善某些蛋白質的消化性，但過強加工也可能降低胺基酸利用率。\u003cspan class=\"vn\" lang=\"vi\">Biến tính không luôn gây đông tụ ngay và không có nghĩa mất hết dinh dưỡng. Nhiệt có thể cải thiện tiêu hóa một số protein, nhưng chế biến quá mạnh cũng có thể giảm khả năng sử dụng axit amin.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/i3124e/i3124e.pdf\" target=\"_blank\" rel=\"noopener\">加工與胺基酸利用 / Chế biến và sử dụng axit amin: FAO 2013, §4.5 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"讓蛋白質改變的途徑\u003cspan class=\"vn\" lang=\"vi\">Các cách làm protein thay đổi\u003c/span>","cols":3,"items":[{"h":"熱或界面攪打\u003cspan class=\"vn\" lang=\"vi\">Nhiệt hoặc đánh ở bề mặt phân cách\u003c/span>","p":"可使某些蛋白質展開；是否成膠仍看條件。\u003cspan class=\"vn\" lang=\"vi\">Có thể làm một số protein mở ra; tạo gel hay không còn tùy điều kiện.\u003c/span>","c":"#2D2A6E"},{"h":"酸：改變帶電狀態\u003cspan class=\"vn\" lang=\"vi\">Axit: đổi điện tích\u003c/span>","p":"牛奶酸化可使酪蛋白微膠粒聚集；不全等於展開。\u003cspan class=\"vn\" lang=\"vi\">Axit hóa sữa có thể làm micelle casein tập hợp; không hoàn toàn là mở cấu trúc.\u003c/span>","c":"#2FA36B"},{"h":"鈣、鎂鹽：促進聚集\u003cspan class=\"vn\" lang=\"vi\">Muối canxi, magiê: thúc đẩy tập hợp\u003c/span>","p":"已加熱豆漿可用食用鹽滷或石膏凝固，效果依配方。\u003cspan class=\"vn\" lang=\"vi\">Sữa đậu nành đã đun có thể đông với nigari hay thạch cao thực phẩm; tùy công thức.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"凝乳酶會切開特定的 κ-酪蛋白胜肽鍵，使微膠粒失去部分保護後聚集。這有特定的水解步驟，不能當成一般變性的定義。\u003cspan class=\"vn\" lang=\"vi\">Rennet cắt liên kết peptit cụ thể của κ-casein, làm micelle mất một phần bảo vệ rồi tập hợp. Có bước thủy phân đặc hiệu, không phải định nghĩa biến tính thông thường.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://dairyprocessinghandbook.tetrapak.com/chapter/chemistry-milk\" target=\"_blank\" rel=\"noopener\">酵素凝乳 / Đông tụ bằng enzyme: Tetra Pak, Chemistry of Milk ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"等電點 pI：看淨電荷\u003cspan class=\"vn\" lang=\"vi\">Điểm đẳng điện pI: xem điện tích tổng\u003c/span>","cols":3,"items":[{"h":"淨電荷為零\u003cspan class=\"vn\" lang=\"vi\">Điện tích tổng bằng 0\u003c/span>","p":"正、負電荷相抵；不是每個帶電基團都消失。\u003cspan class=\"vn\" lang=\"vi\">Điện tích dương và âm cân bằng; không phải mọi nhóm mang điện biến mất.\u003c/span>","c":"#2D2A6E"},{"h":"酪蛋白的近似例值\u003cspan class=\"vn\" lang=\"vi\">Ví dụ gần đúng của casein\u003c/span>","p":"牛乳中常以 pH 約 4.6 作為酸沉澱參考。\u003cspan class=\"vn\" lang=\"vi\">Trong sữa bò, pH khoảng 4,6 thường là mốc tham khảo kết tủa axit.\u003c/span>","c":"#2FA36B"},{"h":"酸化與凝膠\u003cspan class=\"vn\" lang=\"vi\">Axit hóa và tạo gel\u003c/span>","p":"乳酸菌產酸可促進優格凝膠；質地也受加熱與配方影響。\u003cspan class=\"vn\" lang=\"vi\">Vi khuẩn lactic tạo axit giúp hình thành gel sữa chua; kết cấu còn tùy nhiệt và công thức.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"許多蛋白質在 pI 附近較易聚集、溶解度較低，但不是所有食品都共用 pH 4.6 或同一最低值。\u003cspan class=\"vn\" lang=\"vi\">Nhiều protein dễ tập hợp và có độ hòa tan thấp hơn gần pI, nhưng không phải mọi thực phẩm cùng dùng pH 4,6 hay một giá trị thấp nhất.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://dairyprocessinghandbook.tetrapak.com/chapter/chemistry-milk\" target=\"_blank\" rel=\"noopener\">牛乳酸凝固範圍 / Đông tụ axit sữa bò: Tetra Pak ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 2｜加熱後，一定成豆腐嗎？\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 2: Đun rồi chắc chắn thành đậu phụ?\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"tofu\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">教學情境：同批已加熱豆漿，A 未加凝固劑仍可流動；B 加適量食用鹽滷後成膠。變性一定等於凝固嗎？比較時要控制什麼？\u003cspan class=\"vn\" lang=\"vi\">Tình huống học tập: sữa đậu nành cùng mẻ đã đun; A không thêm chất đông tụ vẫn chảy, B thêm lượng nigari thực phẩm phù hợp thì tạo gel. Biến tính có luôn là đông tụ? Cần giữ điều kiện nào giống nhau?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>A、B 都＿＿，但＿＿不同；比較時要讓＿＿一樣。\u003cspan class=\"vn\" lang=\"vi\">A và B đều ___ nhưng khác ___; khi so sánh cần giữ ___ giống nhau.\u003c/span>\u003c/div>\u003clabel for=\"a2-w4-tofu\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w4-tofu\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>A、B 都已加熱，但凝固情形不同；比較時要讓豆漿濃度、溫度和等待時間一樣。\u003cspan class=\"vn\" lang=\"vi\">A và B đều đã đun nhưng đông tụ khác nhau; cần giữ nồng độ sữa, nhiệt độ và thời gian chờ giống nhau.\u003c/span>\u003c/p>\u003cp>這是指定條件的情境，不是豆腐製作配方。加熱可改變形狀，成膠還要看蛋白質聚集、凝固劑與其他條件。\u003cspan class=\"vn\" lang=\"vi\">Đây là tình huống có điều kiện, không phải công thức làm đậu phụ. Nhiệt có thể đổi hình dạng; tạo gel còn tùy sự tập hợp protein, chất đông tụ và điều kiện khác.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"煮蛋：溫度、時間與配方\u003cspan class=\"vn\" lang=\"vi\">Nấu trứng: nhiệt độ, thời gian và công thức\u003c/span>","cols":3,"items":[{"h":"不是單一開關\u003cspan class=\"vn\" lang=\"vi\">Không phải một công tắc\u003c/span>","p":"蛋清、蛋黃各含多種蛋白質，改變發生在一段範圍。\u003cspan class=\"vn\" lang=\"vi\">Lòng trắng và lòng đỏ chứa nhiều protein; biến đổi diễn ra trong một khoảng.\u003c/span>","c":"#2D2A6E"},{"h":"配方會改變凝固\u003cspan class=\"vn\" lang=\"vi\">Công thức đổi sự đông tụ\u003c/span>","p":"糖、鹽、水量與 pH 的效果不同；不能說糖和鹽都一定升高凝固溫度。\u003cspan class=\"vn\" lang=\"vi\">Đường, muối, nước và pH tác động khác nhau; không nói đường và muối luôn cùng tăng nhiệt độ đông tụ.\u003c/span>","c":"#2FA36B"},{"h":"過度加熱可能變韌\u003cspan class=\"vn\" lang=\"vi\">Đun quá mức có thể dai\u003c/span>","p":"網絡收縮、排水，口感可能變硬；外觀凝固不能單獨證明安全。\u003cspan class=\"vn\" lang=\"vi\">Mạng co lại, tách nước, có thể cứng hơn; hình dạng đông không tự chứng minh an toàn.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"安全範圍例：USDA 建議含蛋的烘烤料理等，中心至少達 160°F（約 71.1°C），以食品溫度計確認。這是該類料理的安全建議，不是所有蛋白質的凝固溫度。\u003cspan class=\"vn\" lang=\"vi\">Ví dụ an toàn: USDA khuyến nghị món nướng có trứng đạt ít nhất 160°F (khoảng 71,1°C) ở tâm, kiểm tra bằng nhiệt kế thực phẩm. Đây là hướng dẫn cho loại món đó, không phải nhiệt độ đông tụ của mọi protein.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/eggs/shell-eggs-farm-table\" target=\"_blank\" rel=\"noopener\">含蛋料理中心溫度 / Nhiệt độ tâm món có trứng: USDA FSIS ↗\u003c/a>\u003c/p>"}]},{"id":"s3","nav":"三 蛋白質在食物裡做…","kicker":"第三段 · Phần 3","h2":"蛋白質在食物裡做什麼？","lead":"Protein làm gì trong thực phẩm?","blocks":[{"type":"cards","title":"食品中的四個功能\u003cspan class=\"vn\" lang=\"vi\">Bốn tính chất trong thực phẩm\u003c/span>","cols":4,"items":[{"h":"溶解／分散\u003cspan class=\"vn\" lang=\"vi\">Hòa tan / phân tán\u003c/span>","p":"能否均勻分布？受 pH、鹽、溫度和加工影響。\u003cspan class=\"vn\" lang=\"vi\">Có phân bố đều được không? Tùy pH, muối, nhiệt độ và chế biến.\u003c/span>","c":"#2D2A6E"},{"h":"起泡\u003cspan class=\"vn\" lang=\"vi\">Tạo bọt\u003c/span>","p":"在氣液界面成膜，幫忙穩定空氣泡；如蛋白霜。\u003cspan class=\"vn\" lang=\"vi\">Tạo màng ở mặt phân cách khí–lỏng, giúp ổn định bọt khí; như bọt lòng trắng.\u003c/span>","c":"#2FA36B"},{"h":"乳化\u003cspan class=\"vn\" lang=\"vi\">Nhũ hóa\u003c/span>","p":"吸附油水界面，幫忙穩定油滴；不代表油水真正互溶。\u003cspan class=\"vn\" lang=\"vi\">Hấp phụ ở mặt dầu–nước, giúp ổn định giọt dầu; không có nghĩa dầu hòa tan trong nước.\u003c/span>","c":"#F5A623"},{"h":"膠凝\u003cspan class=\"vn\" lang=\"vi\">Tạo gel\u003c/span>","p":"蛋白質形成網絡，留住水；如豆腐、蒸蛋。\u003cspan class=\"vn\" lang=\"vi\">Protein tạo mạng giữ nước; như đậu phụ, trứng hấp.\u003c/span>","c":"#5B4FB8"}]},{"type":"note","title":"短活動 3｜豆腐、泡沫、油滴\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 3: Đậu phụ, bọt và giọt dầu\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"function\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">豆腐、蛋白霜、美乃滋，分別主要利用哪一個功能？選一個，說明網絡或界面裡有什麼。\u003cspan class=\"vn\" lang=\"vi\">Đậu phụ, bọt lòng trắng và mayonnaise chủ yếu dùng tính chất nào? Chọn một và nói trong mạng lưới hay ở bề mặt phân cách có gì.\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>＿＿主要利用＿＿；蛋白質幫忙＿＿。\u003cspan class=\"vn\" lang=\"vi\">___ chủ yếu dùng tính chất ___; protein giúp ___.\u003c/span>\u003c/div>\u003clabel for=\"a2-w4-function\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w4-function\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>豆腐主要利用膠凝性，網絡留住水；蛋白霜利用起泡性包住空氣；美乃滋利用乳化作用穩定油滴。\u003cspan class=\"vn\" lang=\"vi\">Đậu phụ dùng tạo gel, mạng lưới giữ nước; bọt lòng trắng dùng tạo bọt giữ không khí; mayonnaise dùng nhũ hóa để ổn định giọt dầu.\u003c/span>\u003c/p>\u003cp>一種食品可同時有多個作用。蛋黃的磷脂與脂蛋白都可幫助乳化，不把全部功能都歸給單一蛋白質。\u003cspan class=\"vn\" lang=\"vi\">Một thực phẩm có thể có nhiều cơ chế. Phospholipid và lipoprotein trong lòng đỏ đều có thể hỗ trợ nhũ hóa, không quy mọi tác dụng cho một protein.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"打發蛋白：比較條件，觀察終點\u003cspan class=\"vn\" lang=\"vi\">Đánh bông lòng trắng: so sánh điều kiện, xem điểm dừng\u003c/span>","cols":3,"items":[{"h":"減少油脂污染\u003cspan class=\"vn\" lang=\"vi\">Giảm lẫn chất béo\u003c/span>","p":"乾淨容器、分開蛋黃；油脂常降低打發量與速度，不是只靠「一滴」判定。\u003cspan class=\"vn\" lang=\"vi\">Dụng cụ sạch, tách lòng đỏ; chất béo thường giảm thể tích và tốc độ, không chỉ dựa vào \"một giọt\".\u003c/span>","c":"#2D2A6E"},{"h":"糖與酸要看配方\u003cspan class=\"vn\" lang=\"vi\">Đường và axit tùy công thức\u003c/span>","p":"糖常延緩起泡但助穩定；適量酸可助穩定，不是越酸越好。\u003cspan class=\"vn\" lang=\"vi\">Đường thường làm tạo bọt chậm hơn nhưng giúp ổn định; lượng axit phù hợp có thể giúp, không phải càng chua càng tốt.\u003c/span>","c":"#2FA36B"},{"h":"依用途停手\u003cspan class=\"vn\" lang=\"vi\">Dừng theo mục đích\u003c/span>","p":"觀察泡沫細緻度、尖峰與出水；不是一律打越久越好。\u003cspan class=\"vn\" lang=\"vi\">Xem độ mịn, chóp và tách nước; không phải luôn đánh càng lâu càng tốt.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"起泡量和泡沫穩定性是不同指標。比較時固定蛋白量、容器、速度與時間；鮮奶油打發另涉及脂肪部分聚結，不能套用完全相同機制。\u003cspan class=\"vn\" lang=\"vi\">Thể tích bọt và độ bền bọt là hai chỉ tiêu khác nhau. Giữ lượng lòng trắng, dụng cụ, tốc độ và thời gian giống nhau; kem đánh bông còn liên quan kết tụ một phần chất béo, không cùng hoàn toàn cơ chế.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/19323729/\" target=\"_blank\" rel=\"noopener\">油脂與攪打研究 / Chất béo và đánh bông: Wang & Wang, 2009 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"乳、蛋、肉、豆：選例子理解功能\u003cspan class=\"vn\" lang=\"vi\">Sữa, trứng, thịt, đậu: hiểu tính chất qua ví dụ\u003c/span>","cols":4,"items":[{"h":"牛乳蛋白質\u003cspan class=\"vn\" lang=\"vi\">Protein sữa bò\u003c/span>","p":"約八成酪蛋白、兩成乳清蛋白；比例指蛋白質部分。\u003cspan class=\"vn\" lang=\"vi\">Khoảng 80% casein, 20% whey; tỷ lệ trong phần protein.\u003c/span>","c":"#2D2A6E"},{"h":"蛋\u003cspan class=\"vn\" lang=\"vi\">Trứng\u003c/span>","p":"蛋清可起泡、成膠；蛋黃的磷脂與脂蛋白幫助乳化。\u003cspan class=\"vn\" lang=\"vi\">Lòng trắng tạo bọt và gel; phospholipid và lipoprotein lòng đỏ hỗ trợ nhũ hóa.\u003c/span>","c":"#2FA36B"},{"h":"肉\u003cspan class=\"vn\" lang=\"vi\">Thịt\u003c/span>","p":"肌原纖維蛋白參與黏結；膠原蛋白久煮可轉為明膠。\u003cspan class=\"vn\" lang=\"vi\">Protein sợi cơ hỗ trợ kết dính; collagen đun lâu có thể chuyển thành gelatin.\u003c/span>","c":"#F5A623"},{"h":"大豆\u003cspan class=\"vn\" lang=\"vi\">Đậu nành\u003c/span>","p":"加熱與凝固可製成豆腐；原料和製程共同決定質地。\u003cspan class=\"vn\" lang=\"vi\">Gia nhiệt và đông tụ tạo đậu phụ; nguyên liệu và quy trình cùng quyết định kết cấu.\u003c/span>","c":"#5B4FB8"}]},{"type":"note","title":"","text":"80／20 是牛乳蛋白質的近似比例，不是整杯牛奶的重量百分比。乳清蛋白受熱變性後不一定出現可見沉澱；酪蛋白的酸凝固也不等於典型球狀蛋白展開。\u003cspan class=\"vn\" lang=\"vi\">80/20 là tỷ lệ gần đúng trong protein sữa bò, không phải phần trăm khối lượng cả cốc sữa. Whey biến tính do nhiệt không luôn kết tủa thấy được; đông tụ axit casein không giống hoàn toàn mở protein hình cầu.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://dairyprocessinghandbook.tetrapak.com/chapter/chemistry-milk\" target=\"_blank\" rel=\"noopener\">牛乳蛋白質組成與行為 / Protein sữa bò: Tetra Pak ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"麵筋：把第 3、4 週連起來\u003cspan class=\"vn\" lang=\"vi\">Gluten: nối tuần 3 và tuần 4\u003c/span>","cols":3,"items":[{"h":"麥穀蛋白 Glutenin\u003cspan class=\"vn\" lang=\"vi\">Góp phần tạo tính đàn hồi\u003c/span>","p":"對麵團彈性有重要貢獻。\u003cspan class=\"vn\" lang=\"vi\">Đóng góp quan trọng cho tính đàn hồi của bột nhào.\u003c/span>","c":"#2D2A6E"},{"h":"醇溶蛋白 Gliadin\u003cspan class=\"vn\" lang=\"vi\">Góp phần tạo tính kéo giãn\u003c/span>","p":"對延展性有重要貢獻；兩者共同形成網絡。\u003cspan class=\"vn\" lang=\"vi\">Đóng góp cho khả năng kéo giãn; cùng tạo mạng lưới.\u003c/span>","c":"#2FA36B"},{"h":"麵包組織\u003cspan class=\"vn\" lang=\"vi\">Cấu trúc bánh mì\u003c/span>","p":"麵筋留氣；烘焙時澱粉糊化等變化也幫忙固定組織。\u003cspan class=\"vn\" lang=\"vi\">Gluten giữ khí; hồ hóa tinh bột khi nướng và biến đổi khác cũng giúp cố định cấu trúc.\u003c/span>","c":"#F5A623"}]}]},{"id":"sum","nav":"重點 Điểm chính","kicker":"今天的重點 · Điểm chính hôm nay","h2":"今天的重點","lead":"Điểm chính hôm nay","blocks":[{"type":"cards","title":"回顧\u003cspan class=\"vn\" lang=\"vi\">Ôn tập\u003c/span>","cols":2,"items":[{"h":"蛋白質的形狀與主鏈，要分開看\u003cspan class=\"vn\" lang=\"vi\">Phân biệt hình dạng và mạch chính của protein\u003c/span>"},{"h":"變性不一定立刻凝固；成膠還看聚集與條件\u003cspan class=\"vn\" lang=\"vi\">Biến tính không luôn đông ngay; tạo gel còn tùy tập hợp và điều kiện\u003c/span>"},{"h":"等電點看淨電荷；pH 4.6 是牛乳酪蛋白例值\u003cspan class=\"vn\" lang=\"vi\">pI xét điện tích tổng; pH 4,6 là ví dụ casein sữa bò\u003c/span>"},{"h":"看功能也看營養，觀察後再解釋原因\u003cspan class=\"vn\" lang=\"vi\">Xem cả tính chất và dinh dưỡng; quan sát rồi giải thích\u003c/span>"}]},{"type":"note","title":"","text":"回家：用一種熟悉食品說明蛋白質功能。句型：「我觀察到＿＿，可能和＿＿有關，還要知道＿＿。」\u003cspan class=\"vn\" lang=\"vi\">Về nhà: dùng một thực phẩm quen để nói tính chất protein. Mẫu câu: \"Tôi thấy ___, có thể liên quan ___, còn cần biết ___.\"\u003c/span>"}]},{"id":"quiz","nav":"練習 Luyện tập","kicker":"練習 · Luyện tập","h2":"課後練習 10 題","lead":"先看原因，再練習說一句中文；可重做。Đọc giải thích rồi tập nói một câu tiếng Trung; có thể làm lại.","blocks":[{"type":"quiz","items":[{"q":"「liên kết peptit」是哪個中文？\u003cspan class=\"vn\" lang=\"vi\">\"liên kết peptit\" là từ tiếng Trung nào?\u003c/span>","o":["胜肽鍵 shèngtàijiàn","等電點 děngdiàndiǎn","胺基酸 ānjīsuān","酪蛋白 làodànbái"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 胜肽鍵把胺基酸接成主鏈；一般變性改變構形，不以切斷這條主鏈為特徵。\u003cspan class=\"vn\" lang=\"vi\">Liên kết peptit nối axit amin thành mạch chính; biến tính thông thường đổi cấu hình, không đặc trưng bởi cắt mạch này.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：胺基酸由胜肽鍵連接。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Axit amin nối bằng liên kết peptit.\u003c/span>\u003c/div>"},{"q":"豆漿裡的蛋白質聚集、形成豆腐，可用哪個詞描述？\u003cspan class=\"vn\" lang=\"vi\">Protein trong sữa đậu nành tập hợp tạo đậu phụ, dùng từ nào?\u003c/span>","o":["乳化性 Nhũ hóa","起泡性 Tạo bọt","麵筋 Gluten","凝固 Đông tụ"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 形成豆腐涉及聚集與成膠。加熱常先改變蛋白質構形，但變性不代表一定立刻凝固。\u003cspan class=\"vn\" lang=\"vi\">Tạo đậu phụ liên quan tập hợp và tạo gel. Nhiệt thường đổi cấu hình trước, nhưng biến tính không có nghĩa luôn đông ngay.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：豆漿中的蛋白質聚集成網絡。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Protein trong sữa đậu nành tập hợp thành mạng.\u003c/span>\u003c/div>"},{"q":"「miànjīn」是哪個詞？\u003cspan class=\"vn\" lang=\"vi\">\"miànjīn\" là từ nào?\u003c/span>","o":["麵包 Bánh mì","麵筋 Gluten","麵粉 Bột mì","明膠 Gelatin"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 麵筋是小麥蛋白質吸水並混合後形成的網絡，可幫忙留住氣體；麵包組織也受到澱粉與烘焙條件影響。\u003cspan class=\"vn\" lang=\"vi\">Gluten là mạng từ protein lúa mì sau hút nước và trộn, giúp giữ khí; cấu trúc bánh còn tùy tinh bột và điều kiện nướng.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：麵筋幫忙留住氣體。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Gluten giúp giữ khí.\u003c/span>\u003c/div>"},{"q":"關於變性與凝固，哪句較正確？\u003cspan class=\"vn\" lang=\"vi\">Câu nào đúng hơn về biến tính và đông tụ?\u003c/span>","o":["所有變性都切斷主鏈 Mọi biến tính đều cắt mạch chính","只要加鹽都會變性 Cứ thêm muối là biến tính","變性後是否凝固，還要看條件 Đông tụ sau biến tính còn tùy điều kiện","凝乳酶只改變形狀，不切鍵 Rennet chỉ đổi hình dạng, không cắt liên kết"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 變性、聚集和水解是不同概念。凝乳酶有特定水解步驟；加鹽的效果也依離子、用量和食品而異。\u003cspan class=\"vn\" lang=\"vi\">Biến tính, tập hợp và thủy phân khác nhau. Rennet có bước thủy phân đặc hiệu; tác động của muối tùy ion, lượng và thực phẩm.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：變性不一定立刻凝固。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Biến tính không luôn gây đông tụ ngay.\u003c/span>\u003c/div>"},{"q":"等電點 pI 指的是什麼？\u003cspan class=\"vn\" lang=\"vi\">Điểm đẳng điện pI là gì?\u003c/span>","o":["蛋白質淨電荷為零的 pH pH tại đó điện tích tổng protein bằng 0","所有蛋白質共同的 pH 4.6 pH 4,6 chung cho mọi protein","蛋白質完全沒有帶電基團 Protein không còn nhóm mang điện","蛋白質一定全部水解的 pH pH luôn thủy phân hết protein"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 等電點是淨電荷為零，不是所有正負電荷都消失。牛乳中酪蛋白常以約 pH 4.6 作酸沉澱參考，不能套到所有蛋白質。\u003cspan class=\"vn\" lang=\"vi\">pI là điện tích tổng bằng 0, không phải mọi điện tích mất đi. Khoảng pH 4,6 là mốc kết tủa axit casein sữa bò, không áp cho mọi protein.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：在等電點，正負電荷相抵。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Ở pI, điện tích dương và âm cân bằng.\u003c/span>\u003c/div>"},{"q":"含蛋料理看起來凝固了，可以直接判定什麼？\u003cspan class=\"vn\" lang=\"vi\">Món có trứng trông đã đông, có thể kết luận ngay điều gì?\u003c/span>","o":["中心一定已達安全溫度 Tâm chắc đã đạt nhiệt độ an toàn","蛋白質營養全消失了 Mất hết dinh dưỡng protein","所有蛋白質都在同一溫度變性 Mọi protein biến tính cùng nhiệt độ","只能描述凝固外觀，安全還要確認條件 Chỉ mô tả đã đông, an toàn cần kiểm tra điều kiện"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 凝固外觀不是完整的安全判定。USDA 對含蛋烘烤料理等建議中心至少 160°F（約 71.1°C），以食品溫度計確認；不是所有蛋白質都在此溫度凝固。\u003cspan class=\"vn\" lang=\"vi\">Hình dạng đông không xác định đầy đủ an toàn. USDA khuyến nghị món nướng có trứng đạt ít nhất 160°F (khoảng 71,1°C) ở tâm, kiểm tra bằng nhiệt kế; không phải mọi protein đông ở nhiệt độ này.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：看起來凝固，還要確認中心溫度。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Trông đã đông, còn cần kiểm tra nhiệt độ tâm.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/eggs/shell-eggs-farm-table\" target=\"_blank\" rel=\"noopener\">適用於含蛋料理 / Món có trứng: USDA FSIS ↗\u003c/a>\u003c/p>"},{"q":"比較打發蛋白時，哪個做法較合理？\u003cspan class=\"vn\" lang=\"vi\">Khi so sánh đánh bông lòng trắng, cách nào hợp lý hơn?\u003c/span>","o":["同時改變糖量、容器和速度 Đổi cùng lúc đường, dụng cụ, tốc độ","固定蛋白量與速度，每次只改一個條件 Giữ lượng và tốc độ, mỗi lần đổi một điều kiện","認定打越久一定越穩定 Cho rằng đánh càng lâu luôn càng bền","把更多油脂當作通用穩定劑 Xem thêm chất béo là chất ổn định chung"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 起泡量和穩定性要分別觀察。糖可能讓起泡變慢卻助穩定，油脂常干擾蛋白泡沫；固定條件才好比較。\u003cspan class=\"vn\" lang=\"vi\">Quan sát riêng thể tích và độ bền bọt. Đường có thể làm tạo bọt chậm nhưng giúp bền, chất béo thường cản bọt lòng trắng; giữ điều kiện để so sánh.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：每次只改一個條件。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Mỗi lần chỉ đổi một điều kiện.\u003c/span>\u003c/div>"},{"q":"豆腐網絡留住水，主要是哪個功能？\u003cspan class=\"vn\" lang=\"vi\">Mạng đậu phụ giữ nước chủ yếu nhờ tính chất nào?\u003c/span>","o":["膠凝性 Tạo gel","起泡性 Tạo bọt","乳化性 Nhũ hóa","只靠分子溶解 Chỉ nhờ phân tử hòa tan"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 成膠是形成連續網絡、留住部分水；泡沫裡主要是空氣泡，乳液則是液滴分散在另一液體。\u003cspan class=\"vn\" lang=\"vi\">Tạo gel hình thành mạng liên tục giữ một phần nước; bọt chủ yếu có bọt khí, nhũ tương có giọt lỏng phân tán trong chất lỏng khác.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：豆腐利用膠凝性留住水。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Đậu phụ dùng tính tạo gel để giữ nước.\u003c/span>\u003c/div>"},{"q":"「穀類常以離胺酸為限制胺基酸」是什麼意思？\u003cspan class=\"vn\" lang=\"vi\">\"Lysine thường là axit amin giới hạn của ngũ cốc\" nghĩa là gì?\u003c/span>","o":["穀類完全沒有離胺酸 Ngũ cốc hoàn toàn không có lysine","穀類完全沒有蛋白質 Ngũ cốc không có protein","相對指定需求比例較不足 Tỷ lệ tương đối thiếu so với nhu cầu quy định","所有必需胺基酸都一樣不足 Mọi axit amin thiết yếu thiếu như nhau"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 限制是相對於需求模式，不是完全缺少。搭配豆類可互補，但還要看總量、消化率與實際產品。\u003cspan class=\"vn\" lang=\"vi\">Giới hạn là so với mẫu nhu cầu, không phải hoàn toàn không có. Kết hợp đậu có thể bổ sung, còn tùy tổng lượng, tiêu hóa và sản phẩm.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：相對較少，不是完全沒有。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tương đối ít, không phải hoàn toàn không có.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/i3124e/i3124e.pdf\" target=\"_blank\" rel=\"noopener\">需求模式 / Mẫu nhu cầu: FAO 2013 ↗\u003c/a>\u003c/p>"},{"q":"想比較兩種凝固條件的豆腐口感，哪個方法較好？\u003cspan class=\"vn\" lang=\"vi\">Muốn so sánh kết cấu đậu phụ ở hai điều kiện đông tụ, cách nào tốt hơn?\u003c/span>","o":["加越多鹽滷就一定越好 Càng nhiều nigari luôn càng tốt","同時換豆漿濃度與等待時間 Đổi cả nồng độ sữa và thời gian chờ","只看一次結果就推論所有產品 Từ một kết quả suy ra mọi sản phẩm","同批豆漿控制其他條件，再比較成膠與離水 Cùng mẻ sữa, giữ điều kiện khác, so gel và tách nước"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 濃度、溫度、凝固劑與攪拌共同影響質地。先控制其他條件，再觀察成膠和離水，不能只用「越多越好」解釋。\u003cspan class=\"vn\" lang=\"vi\">Nồng độ, nhiệt độ, chất đông tụ và khuấy cùng ảnh hưởng kết cấu. Giữ điều kiện khác rồi so gel và tách nước, không giải thích bằng \"càng nhiều càng tốt\".\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：我會控制條件，再比較成膠與離水。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tôi sẽ giữ điều kiện rồi so gel và tách nước.\u003c/span>\u003c/div>"}]}]}],"a2":true};</script>
<script>
/*
 * runtime.client.js — 跑在瀏覽器裡的渲染器（17 週共用，逐字內嵌進每份 HTML）
 * 讀 window.__LESSON__ 的資料，把 modules / blocks 畫出來。
 * 互動行為（翻卡、展開、配對、測驗）沿用週1 手寫版的做法，不要另創一套。
 */
(function () {
  var D = window.__LESSON__;
  var SERIES = D.series;
  var $ = function (s) { return document.querySelector(s); };
  // 國合班 A2 版（D.a2）：介面文字加越南文；一般班 U() 只回中文，畫面與原本完全相同
  var A2 = !!D.a2;
  function U(zh, vn) { return A2 ? zh + " " + vn : zh; }

  /* ---------- 學習歷程記錄（Supabase） ----------
     只在 lesson.js 注入 D.track = {url, key} 的週次啟用（lib/tracking.json 的 weeks）；
     其他週 TRACK.on 為 false，send() 是空函式，教材行為完全不變。
     只送「學號代碼」與互動事件，不送姓名。送失敗就丟掉，不重試、不阻擋教材。 */
  var CTX = { mod: null, bi: 0 };   // 目前正在渲染的模組 id 與區塊序號（render 是同步的）
  var TRACK = (function () {
    var cfg = D.track;
    var noop = function () {};
    if (!cfg || !cfg.url || !cfg.key) return { on: false, send: noop, flush: noop, code: function () { return ""; }, setCode: noop };
    var KEY = "ifs_code", DKEY = "ifs_device";
    var rnd = function () { return Math.random().toString(36).slice(2, 10); };
    var sid = rnd() + Date.now().toString(36);
    // device_id：同一支手機／瀏覽器跨次開頁不變。學生後來才填學號代碼時，先前的 anon 事件可靠它回接。
    var did = "";
    try { did = localStorage.getItem(DKEY) || ""; if (!did) { did = "d" + rnd() + rnd(); localStorage.setItem(DKEY, did); } } catch (e) { did = "d" + rnd(); }
    var q = [], timer = null;
    function code() { try { return (localStorage.getItem(KEY) || "").trim(); } catch (e) { return ""; } }
    function setCode(v) { try { localStorage.setItem(KEY, (v || "").trim().slice(0, 20)); } catch (e) {} }
    function cut(s, n) { return s == null ? null : String(s).slice(0, n); }
    // 欄位長度與 payload 大小在前端先截到資料表 CHECK 的上限：PostgREST 批次 INSERT 是原子的，
    // 一筆違反 CHECK 整批都會被拒，而我們失敗即丟，會靜默掉整個 4 秒窗口。
    function send(event, mod, block, payload) {
      var p = payload || {};
      var ps = JSON.stringify(p);
      if (ps.length > 1800) p = { trunc: true, keys: Object.keys(p).slice(0, 10) };
      q.push({
        student_code: cut(code(), 20) || "anon", device_id: cut(did, 40), week: D.week || 0,
        module_id: cut(mod, 30), block_type: cut(block, 10), event: cut(event, 30),
        payload: p, session_id: cut(sid, 40), build: cut(D.build, 16), client_ts: new Date().toISOString(),
      });
      if (q.length >= 40) flush();
      else if (!timer) timer = setTimeout(flush, 4000);
    }
    function flush() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!q.length) return;
      var body = JSON.stringify(q.splice(0, 50));
      try {
        fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/ifs_lesson_events", {
          method: "POST", keepalive: true, body: body,
          headers: { "Content-Type": "application/json", "apikey": cfg.key, "Prefer": "return=minimal" },
        }).catch(noop);
      } catch (e) { /* 舊瀏覽器沒有 fetch：不記錄 */ }
      if (q.length) timer = setTimeout(flush, 1000);
    }
    window.addEventListener("pagehide", flush);
    return { on: true, send: send, flush: flush, code: code, setCode: setCode };
  })();

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function colorAt(given, i) { return given || SERIES[i % SERIES.length]; }
  function gridCls(n) { return "grid g" + (n === 2 || n === 3 || n === 4 ? n : 3); }
  function listHtml(v) {
    // body 可以是字串或字串陣列；陣列渲染成 <ul>
    if (v == null) return "";
    if (typeof v === "string") return '<p>' + v + '</p>';
    return '<ul>' + v.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
  }

  /* ---------- 區塊標題 ---------- */
  function heading(frag, b) {
    if (b.title) frag.appendChild(el("div", "sec-title", '<span class="bar"></span>' + b.title));
    if (b.hint) frag.appendChild(el("div", "hint", b.hint));
  }

  /* ---------- 各區塊 ---------- */
  var BLOCKS = {};

  BLOCKS.flips = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (d, i) {
      var c = colorAt(d.c, i);
      var card = el("div", "flip");
      if (b.h) card.style.height = b.h + "px";
      card.innerHTML =
        '<div class="flip-in">' +
        '<div class="face front"><div class="cbar" style="background:' + c + '"></div>' +
        '<div class="t">' + d.t + '</div><div class="en">' + (d.en || "") + '</div>' +
        '<div class="tap">▸ ' + U("點我看解釋", "Chạm để xem") + '</div></div>' +
        '<div class="face back"><div class="cbar" style="background:' + c + '"></div>' +
        '<p>' + d.b + '</p></div></div>';
      var mod = CTX.mod, bi = CTX.bi;
      card.onclick = function () {
        if (card.classList.toggle("on")) TRACK.send("flip_open", mod, "flips", { b: bi, i: i, t: d.t });
      };
      g.appendChild(card);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.exp = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div");
    b.items.forEach(function (t, i) {
      var box = el("div", "exp");
      var res = t.res ? '<div style="margin-top:10px;font-size:13px;color:var(--secondary);font-weight:700">🔗 ' + t.res + '</div>' : "";
      box.innerHTML =
        '<button><span class="num">' + (i + 1) + '</span><span>' + t.h + '</span>' +
        '<span class="tag">' + (t.tag || "") + '</span><span class="chev">›</span></button>' +
        '<div class="body">' + listHtml(t.body) + res + '</div>';
      var body = box.querySelector(".body");
      var mod = CTX.mod, bi = CTX.bi;
      box.querySelector("button").onclick = function () {
        var on = box.classList.toggle("on");
        if (!on) { body.style.maxHeight = "0px"; return; }
        TRACK.send("exp_open", mod, "exp", { b: bi, i: i, h: t.h });
        // 用實際內容高度展開，避免長段落被固定 max-height 截掉。
        // 必須先解除 max-height 再量：在 max-height:0 的狀態下量 scrollHeight 會得到 0，
        // 面板就只會開一條縫（實測過）。量完歸零並強制重排，transition 才有起點。
        body.style.maxHeight = "none";
        var h = body.scrollHeight;
        body.style.maxHeight = "0px";
        void body.offsetHeight;
        body.style.maxHeight = h + "px";
      };
      host.appendChild(box);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.cards = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var box = el("div", "card");
      box.style.borderTop = "4px solid " + accent;
      box.innerHTML = '<div class="h">' + c.h + '</div>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        (c.li ? '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>' : "") +
        (c.p ? '<p style="margin-top:8px;font-size:15.5px;color:var(--mid)">' + c.p + '</p>' : "");
      g.appendChild(box);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.timeline = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "tl");
    b.steps.forEach(function (s, i) {
      var st = el("div", "step");
      st.innerHTML = '<div class="dot" style="background:' + colorAt(s.c, i) + '">' + (i + 1) + '</div>' +
        '<h4>' + s.h + '</h4><p>' + s.p + '</p>';
      host.appendChild(st);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.compare = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "cmp");
    [b.left, b.right].forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var col = el("div", "col");
      col.innerHTML = '<div class="cbar" style="background:' + accent + '"></div>' +
        '<h4 style="color:' + accent + '">' + c.h + '</h4>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
      wrap.appendChild(col);
    });
    f.appendChild(wrap);
    if (b.note) f.appendChild(el("div", "cmp-note", b.note));
    return f;
  };

  BLOCKS.table = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "tblwrap");
    var html = '<table class="tbl"><thead><tr>' +
      b.head.map(function (h) { return '<th>' + h + '</th>'; }).join("") + '</tr></thead><tbody>' +
      b.rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join("") + '</tr>';
      }).join("") + '</tbody></table>';
    wrap.innerHTML = html;
    f.appendChild(wrap); return f;
  };

  BLOCKS.note = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    f.appendChild(el("div", "note" + (b.kind ? " " + b.kind : ""), b.text));
    return f;
  };

  BLOCKS.match = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "match-wrap");
    var pool = el("div", "pool"), targets = el("div", "targets");
    var pairs = b.pairs;
    var order = pairs.slice().sort(function () { return Math.random() - 0.5; });
    var selected = null, solved = 0, errors = 0, t0 = null;
    var mod = CTX.mod, bi = CTX.bi;
    var msg = el("div");
    msg.style.cssText = "margin-top:14px;font-weight:700;color:var(--green)";

    function tryMatch(slot, key) {
      if (slot.classList.contains("ok")) return;
      if (t0 === null) t0 = Date.now();
      if (slot.dataset.k === key) {
        slot.classList.add("ok"); slot.classList.remove("bad");
        slot.querySelector(".drop").textContent = key;
        var chip = pool.querySelector('.chip[data-k="' + key + '"]');
        chip.classList.add("used"); chip.classList.remove("sel");
        selected = null; solved++;
        TRACK.send("match_ok", mod, "match", { b: bi, label: key });
        if (solved === pairs.length) {
          msg.textContent = b.done || U("✓ 全部答對！", "Đúng hết!");
          TRACK.send("match_done", mod, "match", { b: bi, n: pairs.length, errors: errors, ms: Date.now() - t0 });
        }
      } else {
        errors++;
        TRACK.send("match_bad", mod, "match", { b: bi, label: key, slot: slot.dataset.k });
        slot.classList.add("bad");
        setTimeout(function () { slot.classList.remove("bad"); }, 350);
      }
    }
    order.forEach(function (q) {
      var c = el("div", "chip"); c.textContent = q.label; c.draggable = true; c.dataset.k = q.label;
      c.addEventListener("dragstart", function (e) { e.dataTransfer.setData("k", q.label); });
      c.onclick = function () {
        if (c.classList.contains("used")) return;
        if (selected === c) { c.classList.remove("sel"); selected = null; return; }
        pool.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("sel"); });
        c.classList.add("sel"); selected = c;
      };
      pool.appendChild(c);
    });
    pairs.forEach(function (q) {
      var s = el("div", "slot"); s.dataset.k = q.label;
      s.innerHTML = '<div class="drop">' + U("拖到這裡", "Kéo vào đây") + '</div><div class="desc">' + q.desc + '</div>';
      s.addEventListener("dragover", function (e) { e.preventDefault(); });
      s.addEventListener("drop", function (e) { e.preventDefault(); tryMatch(s, e.dataTransfer.getData("k")); });
      s.onclick = function () { if (selected) tryMatch(s, selected.dataset.k); };
      targets.appendChild(s);
    });
    host.appendChild(pool); host.appendChild(targets); host.appendChild(msg);
    f.appendChild(host); return f;
  };

  /* 結果代碼：把作答結果編成一串可貼給老師的代碼（FSQ1.<base64>.<檢查碼>）。
     解碼與彙整用專案根目錄的「食品科學概論_測驗成績解碼器.html」。 */
  function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
  function checksum(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1679616; // 36^4
    return h.toString(36);
  }

  BLOCKS.quiz = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var items = b.items, n = items.length;
    var head = el("div", "quiz-head");
    head.innerHTML =
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
      '<input class="qid" placeholder="' + U("學號（交成績必填）", "Mã số SV") + '" style="flex:1;min-width:130px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px">' +
      '<input class="qname" placeholder="' + U("姓名", "Họ tên") + '" style="flex:1;min-width:100px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px"></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
      '<strong class="qprog">' + U("進度", "Tiến độ") + ' 0 / ' + n + '</strong>' +
      '<span class="qscore" style="color:var(--secondary);font-weight:800">' + U("得分", "Điểm") + ' 0</span></div>' +
      '<div class="pbar"><div class="pfill"></div></div>';
    var box = el("div");
    var sb = el("div", "scorebox");
    sb.innerHTML = '<div>' + U("你的成績", "Điểm của bạn") + '</div><div class="big"><span class="fscore">0</span> / ' + n + '</div>' +
      '<div class="smsg" style="margin:8px 0 16px"></div>' +
      '<div class="rcwrap" style="margin:0 auto 16px;max-width:560px;text-align:left">' +
      '<div style="font-weight:700;margin-bottom:6px">' + U("結果代碼（請複製後，貼到老師指定的表單或訊息）", "— Mã kết quả: sao chép và gửi cho thầy/cô") + '</div>' +
      '<textarea class="rcode" readonly rows="3" style="width:100%;box-sizing:border-box;font-family:monospace;font-size:12px;padding:8px;border:1.5px solid var(--line,#ccc);border-radius:8px;resize:none"></textarea>' +
      '<div class="rmsg" style="font-size:13px;color:#B34700;margin-top:4px"></div>' +
      '<button class="btn copyrc" style="margin-top:8px">📋 ' + U("複製結果代碼", "Sao chép mã") + '</button></div>' +
      '<button class="btn ghost">' + U("重新測驗", "Làm lại") + '</button>';

    var answered = 0, score = 0, picks = [], qt0 = null, attempt = 0;
    var mod = CTX.mod, bi = CTX.bi;
    // 測驗的學號欄與頁首的學號代碼同步（兩邊填任一邊都行）
    var qidInput = head.querySelector(".qid");
    if (TRACK.on) {
      if (TRACK.code()) qidInput.value = TRACK.code();
      qidInput.addEventListener("change", function () {
        TRACK.setCode(qidInput.value);
        var top = $("#ifs-code"); if (top) top.value = TRACK.code();
      });
    }
    function updateProg() {
      head.querySelector(".qprog").textContent = U("進度", "Tiến độ") + " " + answered + " / " + n;
      head.querySelector(".qscore").textContent = U("得分", "Điểm") + " " + score;
      head.querySelector(".pfill").style.width = (answered / n * 100) + "%";
    }
    function finish() {
      sb.querySelector(".fscore").textContent = score;
      var pct = score / n, m;
      if (score === n) m = U("這 10 題全對！再說明豆漿變豆腐需要哪些條件。", "Đúng cả 10 câu! Hãy giải thích điều kiện để sữa đậu nành thành đậu phụ.");
      else if (pct >= 0.8) m = U("很棒！觀念相當扎實。", "Rất tốt!");
      else if (pct >= 0.6) m = U("不錯，再複習幾個弱點就更好。", "Khá tốt, ôn lại vài chỗ nữa nhé.");
      else m = U("建議回到前面單元再看一次翻卡與展開內容。", "Hãy xem lại các phần phía trước.");
      sb.querySelector(".smsg").textContent = m;

      var sid = head.querySelector(".qid").value.trim();
      var sname = head.querySelector(".qname").value.trim();
      var korr = items.map(function (item, i) { return picks[i] === item.a ? 1 : 0; }).join("");
      var payload = JSON.stringify({
        w: D.week || 0, c: A2 ? "a2" : undefined, id: sid, nm: sname, s: score, n: n,
        a: picks, k: korr, t: new Date().toISOString().slice(0, 16),
      });
      var body = b64utf8(payload);
      var code = "FSQ1." + body + "." + checksum(body);
      sb.querySelector(".rcode").value = code;
      sb.querySelector(".rmsg").textContent = sid ? "" : U("⚠ 尚未填學號 —— 請回到測驗上方填入學號後重新測驗，否則老師無法登記成績。", "Chưa nhập mã số SV: hãy nhập ở trên rồi làm lại.");
      TRACK.send("quiz_done", mod, "quiz", { b: bi, attempt: attempt, score: score, n: n, picks: picks, ms: qt0 ? Date.now() - qt0 : null });
      TRACK.flush();

      sb.classList.add("show");
      sb.scrollIntoView({ behavior: "smooth" });
    }
    function pick(qel, item, oi) {
      if (qel.dataset.done === "1") return;
      qel.dataset.done = "1"; answered++;
      if (qt0 === null) qt0 = Date.now();
      picks[parseInt(qel.dataset.qi, 10)] = oi;
      TRACK.send("quiz_answer", mod, "quiz", { b: bi, attempt: attempt, qi: parseInt(qel.dataset.qi, 10), pick: oi, ok: oi === item.a });
      qel.querySelectorAll(".opt").forEach(function (btn, i) {
        btn.classList.add("dim");
        if (i === item.a) btn.classList.add("correct");
        if (i === oi && oi !== item.a) btn.classList.add("wrong");
      });
      var fb = qel.querySelector(".fb");
      if (oi === item.a) { score++; fb.classList.add("good"); fb.innerHTML = U("✓ 正確！", "Đúng!") + item.e; }
      else { fb.classList.add("no"); fb.innerHTML = U("✗ 正解：", "Sai. Đáp án:") + item.o[item.a] + "。" + item.e; }
      fb.classList.add("show"); updateProg();
      if (answered === n) finish();
    }
    function build() {
      box.innerHTML = ""; answered = 0; score = 0; picks = []; qt0 = null; attempt++; updateProg();
      sb.classList.remove("show");
      items.forEach(function (item, qi) {
        var qel = el("div", "q"); qel.dataset.done = "0"; qel.dataset.qi = qi;
        qel.innerHTML = '<div class="qn">第 ' + (qi + 1) + ' 題' + (A2 ? ' · Câu ' + (qi + 1) : '') + '</div><div class="qt">' + item.q + '</div>';
        item.o.forEach(function (opt, oi) {
          var btn = el("button", "opt"); btn.textContent = opt;
          btn.onclick = function () { pick(qel, item, oi); };
          qel.appendChild(btn);
        });
        qel.appendChild(el("div", "fb"));
        box.appendChild(qel);
      });
    }
    sb.querySelector(".copyrc").onclick = function () {
      var ta = sb.querySelector(".rcode");
      ta.select(); ta.setSelectionRange(0, 99999);
      var btn = this;
      function ok() { btn.textContent = U("✓ 已複製，請貼給老師", "Đã sao chép"); setTimeout(function () { btn.textContent = "📋 " + U("複製結果代碼", "Sao chép mã"); }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(ta.value).then(ok, function () { document.execCommand("copy"); ok(); });
      else { document.execCommand("copy"); ok(); }
    };
    sb.querySelector(".ghost").onclick = function () {
      build(); window.scrollTo({ top: 0, behavior: "smooth" });
    };
    build();
    f.appendChild(head); f.appendChild(box); f.appendChild(sb);
    return f;
  };

  /* ---------- 組裝 ---------- */
  var nav = $("#nav"), main = $("#main");
  var curMod = D.modules.length ? D.modules[0].id : null, modT0 = Date.now();
  function switchMod(id, btn) {
    document.querySelectorAll(".module").forEach(function (m) { m.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
    nav.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
    btn.classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (id !== curMod) {
      TRACK.send("module_view", id, null, { from: curMod, ms: Date.now() - modT0 });
      curMod = id; modT0 = Date.now();
    }
  }
  D.modules.forEach(function (m, i) {
    var btn = el("button", i === 0 ? "active" : "", m.nav);
    btn.onclick = function () { switchMod(m.id, btn); };
    nav.appendChild(btn);

    var sec = el("section", "module" + (i === 0 ? " active" : ""));
    sec.id = m.id;
    sec.appendChild(el("div", "lead",
      '<div class="kicker">' + m.kicker + '</div><h2>' + m.h2 + '</h2><p>' + m.lead + '</p>'));
    m.blocks.forEach(function (b, bi) {
      var render = BLOCKS[b.type];
      if (!render) { console.error("未知區塊型別:", b.type); return; }
      CTX.mod = m.id; CTX.bi = bi;
      sec.appendChild(render(b));
    });
    main.appendChild(sec);
  });

  /* ---------- 學號代碼列（只在啟用記錄的週出現） ---------- */
  if (TRACK.on) {
    var bar = el("div", "codebar");
    bar.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;font-size:14px";
    bar.innerHTML = '<label for="ifs-code" style="font-weight:700">學號代碼</label>' +
      '<input id="ifs-code" maxlength="20" placeholder="例：S001" style="width:120px;padding:6px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:14px">' +
      '<span style="opacity:.75">只記錄你的學習歷程（翻卡、配對、測驗），不需要姓名。</span>';
    nav.parentNode.insertBefore(bar, nav);
    var inp = bar.querySelector("#ifs-code");
    inp.value = TRACK.code();
    inp.addEventListener("change", function () {
      TRACK.setCode(inp.value);
      document.querySelectorAll(".qid").forEach(function (x) { x.value = TRACK.code(); });
      TRACK.send("code_set", null, null, {});
    });
    TRACK.send("session_start", curMod, null, {
      device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || "") ? "mobile" : "desktop",
      w: window.innerWidth, build: D.build || null,
    });
    // 停留時間以「頁面可見」為準：切到背景就結算一段 module_leave，回來重新計時。
    // 手機瀏覽器殺分頁常不觸發 pagehide，所以以 visibilitychange→hidden 為主。
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        TRACK.send("module_leave", curMod, null, { ms: Date.now() - modT0 }); TRACK.flush();
      } else {
        modT0 = Date.now();
      }
    });
  }
})();
</script>
</body>
