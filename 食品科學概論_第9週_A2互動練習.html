<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品科學概論 第9週 · 國合班互動練習</title>
<style>
  :root{
    --primary:#2D2A6E; --secondary:#5B4FB8; --accent:#00B8B8; --warm:#F5A623; --green:#2FA36B; --red:#D65B5B; --dark:#1A1A3E; --bg:#F4F5FA; --text:#1F1F2E; --mid:#5A5A75; --muted:#9096ac; --border:#E2E2EC; --card:#fff;
  }
/* 版型樣式 — 逐條取自「第1週_互動教學.html」，末段為新增區塊（cmp / tbl / note）。
   這裡只用 var(--x)；色票由 tokens.js 產生 :root 注入。 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:17px}
header{background:linear-gradient(120deg,var(--dark),var(--primary));color:#fff;
  padding:26px 22px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(0,0,0,.15)}
header h1{font-size:31px;font-weight:800;letter-spacing:.5px}
header .sub{color:#b9c7ff;font-size:16px;margin-top:5px}
nav{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.10);color:#dfe4ff;border:none;padding:12px 18px;
  border-radius:10px 10px 0 0;font-size:16.5px;cursor:pointer;font-weight:600;transition:.15s}
nav button:hover{background:rgba(255,255,255,.2)}
nav button.active{background:var(--bg);color:var(--primary)}
main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
.module{display:none;animation:fade .35s}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead{background:var(--dark);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:22px}
.lead .kicker{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px}
.lead h2{font-size:26px;margin:6px 0 8px}
.lead p{color:#cdd3ee;font-size:16.5px}
.sec-title{font-size:23px;font-weight:800;color:var(--primary);margin:30px 0 6px;
  display:flex;align-items:center;gap:10px}
.sec-title .bar{width:6px;height:25px;background:var(--accent);border-radius:3px;display:inline-block}
.hint{color:var(--mid);font-size:15px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* flip cards */
.flip{perspective:1100px;height:200px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px rgba(30,30,60,.08);border:1px solid var(--border)}
.front{background:var(--card)}
.front .t{font-size:21px;font-weight:800;color:var(--primary)}
.front .en{color:var(--muted);font-size:14px;margin-top:3px;font-style:italic}
.front .tap{margin-top:auto;color:var(--accent);font-size:14px;font-weight:700}
.back{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;transform:rotateY(180deg);overflow:auto}
.back p{font-size:16px}
.cbar{height:6px;border-radius:14px 14px 0 0;position:absolute;top:0;left:0;right:0}

/* expandable */
.exp{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.exp>button{width:100%;text-align:left;background:none;border:none;padding:16px 18px;cursor:pointer;
  display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;color:var(--text)}
.exp .num{background:var(--primary);color:#fff;min-width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.exp .chev{margin-left:auto;color:var(--muted);transition:.25s;font-size:20px}
.exp.on .chev{transform:rotate(90deg);color:var(--accent)}
.exp .body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 18px}
.exp.on .body{padding:0 18px 16px 62px}
.exp .body ul{margin-left:16px;color:var(--mid);font-size:16px}
.exp .body p{color:var(--mid);font-size:15.5px}
.exp .tag{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:8px}

/* info card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.card .h{font-weight:800;color:var(--primary);font-size:18px;margin-bottom:6px}
.card .en{color:var(--muted);font-size:13px;font-style:italic}
.card ul{margin:8px 0 0 18px;font-size:15.5px;color:var(--mid)}

/* timeline */
.tl{display:flex;gap:0;flex-wrap:wrap;counter-reset:s}
.tl .step{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 14px 14px;margin:8px;position:relative}
.tl .dot{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;margin-bottom:8px}
.tl .step h4{color:var(--primary);font-size:17.5px;margin-bottom:4px}
.tl .step p{font-size:15px;color:var(--mid)}

/* matching */
.match-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.pool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--secondary);color:#fff;padding:10px 17px;border-radius:22px;font-weight:700;
  cursor:grab;user-select:none;font-size:16.5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chip.used{opacity:.35;pointer-events:none}
.chip.sel{outline:3px solid var(--warm);outline-offset:2px}
.targets{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;border:2px dashed var(--border);border-radius:12px;padding:10px 14px;background:#fafbff}
.slot .desc{flex:1;font-size:16px;color:var(--text)}
.slot .drop{min-width:130px;min-height:44px;border-radius:8px;background:#eef0f8;display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:15px;padding:8px 12px}
.slot.ok{border-color:var(--green);background:#effaf3}
.slot.ok .drop{background:var(--green);color:#fff;font-weight:700}
.slot.bad{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* quiz */
.quiz-head{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.pbar{height:12px;background:#e7e9f4;border-radius:8px;overflow:hidden;margin-top:10px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--secondary));transition:width .4s}
.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.q .qn{color:var(--accent);font-weight:800;font-size:14px}
.q .qt{font-size:19.5px;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fafbff;border:2px solid var(--border);
  border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;font-size:16.5px;transition:.15s}
.opt:hover{border-color:var(--secondary)}
.opt.correct{border-color:var(--green);background:#effaf3;font-weight:700}
.opt.wrong{border-color:var(--red);background:#fdeeee}
.opt.dim{opacity:.6}
.fb{margin-top:8px;font-size:15.5px;padding:11px 14px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.good{background:#effaf3;color:#1c7a4d} .fb.no{background:#fdeeee;color:#a83b3b}
.scorebox{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:16px;
  padding:26px;text-align:center;margin-top:10px;display:none}
.scorebox.show{display:block}
.scorebox .big{font-size:46px;font-weight:800}
.btn{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:10px;
  font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.18)}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;background:#eef0fb;color:var(--secondary);padding:3px 10px;border-radius:20px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px}

/* ===== 新增區塊 ===== */
/* compare：兩欄對照（梅納 vs 焦糖化、冷藏 vs 冷凍…） */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media(max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 18px 18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06);position:relative;overflow:hidden}
.cmp .col .cbar{position:static;height:6px;margin:0 -18px 14px;border-radius:0}
.cmp .col h4{font-size:20px;font-weight:800;margin-bottom:2px}
.cmp .col .en{color:var(--muted);font-size:13px;font-style:italic;margin-bottom:8px}
.cmp .col ul{margin-left:18px;font-size:15.5px;color:var(--mid)}
.cmp .col li{margin-bottom:5px}
.cmp-note{margin-top:12px;background:#eef0fb;border-left:5px solid var(--secondary);
  border-radius:0 10px 10px 0;padding:12px 16px;font-size:16px;color:var(--primary);font-weight:600}

/* table：資料表（維生素、添加物分類…） */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px}
.tbl th{background:var(--primary);color:#fff;text-align:left;padding:12px 14px;font-weight:700;font-size:15px}
.tbl td{padding:11px 14px;border-top:1px solid var(--border);color:var(--mid);vertical-align:top}
.tbl tr:nth-child(even) td{background:#fafbff}
.tbl td:first-child{color:var(--text);font-weight:700}

/* note：重點提示條 */
.note{background:#fff8e9;border-left:5px solid var(--warm);border-radius:0 12px 12px 0;
  padding:14px 18px;margin:14px 0;font-size:16px;color:var(--text)}
.note b{color:var(--primary)}
.note.key{background:#effaf3;border-left-color:var(--green)}
.note.warn{background:#fdeeee;border-left-color:var(--red)}
/* 國合班 A2 互動練習：拼音與越南文（build_a2.js 產生的內容才會用到） */
.py{display:block;font-size:.78em;font-weight:500;color:var(--mid);margin-top:2px}
.vn{display:block;font-size:.88em;font-weight:500;color:var(--secondary);margin-top:2px}
/* Shared classroom tasks: oral response, sentence support, then sample explanation. */
.class-activity{display:grid;gap:12px;min-width:0}
.class-activity .vn{display:block;color:#0E7C7B;font-size:15px;line-height:1.5;margin-top:4px}
.activity-time{color:#0E7C7B;font-weight:700;font-size:15px}
.activity-prompt{font-size:clamp(18px,2.3vw,23px);line-height:1.5}
.sentence-stem{padding:12px 16px;background:#EFFAF3;border-left:5px solid #2FA36B;color:#1A1A3E;line-height:1.6}
.class-activity label{font-size:14px;color:#52526B}
.activity-response{display:block;width:100%;max-width:100%;min-height:72px;border:1.5px solid #A0A0B5;border-radius:8px;padding:10px 12px;resize:vertical;font:inherit;font-size:17px;background:#fff;color:#1F1F2E}
.activity-answer{border:1px solid #E2E2EC;background:#fff;border-radius:8px;padding:10px 14px;font-size:16px;line-height:1.5}
.activity-answer summary{cursor:pointer;font-weight:700;color:#2D2A6E}
.activity-answer p{margin-top:10px}
.activity-response:focus-visible,.activity-answer summary:focus-visible{outline:3px solid #0E7C7B;outline-offset:3px}
.source-note{font-size:13px;color:#52526B;line-height:1.5;overflow-wrap:anywhere;margin-top:10px}
.source-note .vn{display:block;color:#0E7C7B;font-size:13px}
.lesson-links{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.lesson-links a{color:inherit;text-underline-offset:3px}
.feedback-reason,.feedback-transfer{margin-top:6px}
.feedback-transfer{font-weight:600}
@media(max-width:640px){header{position:relative!important}.class-activity{gap:10px}}
@media print{.activity-response{min-height:64px}}


.back .vn{color:#D7FAF3}.tbl-wrap{overflow-x:auto}
</style>
</head>

<script>window.__LESSON__={"week":9,"series":["#2D2A6E","#2FA36B","#F5A623","#5B4FB8","#00B8B8","#D65B5B"],"modules":[{"id":"m0","nav":"今天 Hôm nay","kicker":"今天學什麼 · Hôm nay học gì","h2":"食品微生物","lead":"shípǐn wéishēngwù　·　Vi sinh vật thực phẩm","blocks":[{"type":"cards","title":"今天學三件事　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Hôm nay học 3 điều\u003c/span>","cols":3,"items":[{"h":"食品裡有哪四類微生物？","p":"\u003cspan class=\"vn\">Trong thực phẩm có 4 loại vi sinh vật nào?\u003c/span>"},{"h":"微生物怎麼長大？要什麼？","p":"\u003cspan class=\"vn\">Vi sinh vật phát triển thế nào? Cần gì?\u003c/span>"},{"h":"壞菌、病菌和好菌","p":"\u003cspan class=\"vn\">Vi khuẩn gây hỏng, gây bệnh và có lợi\u003c/span>"}]},{"type":"note","title":"看影片：養樂多怎麼做？　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Xem video: Yakult được làm thế nào?\u003c/span>","text":"\u003ca href=\"https://www.youtube.com/watch?v=ZCKqbXU0uYs&t=454s\" target=\"_blank\" rel=\"noopener\" style=\"font-weight:700\">▶ 觀察乳酸菌的發酵工廠\u003c/a>\u003cspan class=\"vn\">Quan sát nhà máy lên men lactic\u003c/span>\u003cul style=\"margin:10px 0 0;padding-left:22px\">\u003cli>牛奶冷卻到幾度，才放菌？\u003cspan class=\"vn\">Sữa được làm nguội đến bao nhiêu độ thì cho men vào?\u003c/span>\u003c/li>\u003cli>發酵罐裡是幾度？\u003cspan class=\"vn\">Trong bồn lên men là bao nhiêu độ?\u003c/span>\u003c/li>\u003cli>罐子裡的菌，變多還是變少？\u003cspan class=\"vn\">Vi khuẩn trong bồn nhiều lên hay ít đi?\u003c/span>\u003c/li>\u003c/ul>觀察影片中的發酵溫度與製程；影片只是一項產品例子，不把它當成所有乳酸菌或病原菌的最適條件。\u003cspan class=\"vn\" lang=\"vi\">Quan sát nhiệt và quy trình trong video; đây là một sản phẩm, không đại diện điều kiện tối ưu mọi vi khuẩn lactic hay mầm bệnh.\u003c/span>"},{"type":"cards","title":"一盒熟飯：煮好以後還要看什麼？\u003cspan class=\"vn\" lang=\"vi\">Một hộp cơm chín: sau nấu cần xem gì?\u003c/span>","cols":3,"items":[{"h":"① 煮好不等於無菌\u003cspan class=\"vn\" lang=\"vi\">Nấu chín không bằng vô trùng\u003c/span>","p":"部分孢子可能存活，也可能在後續操作被污染。\u003cspan class=\"vn\" lang=\"vi\">Một số bào tử có thể còn sống, hoặc bị nhiễm sau nấu.\u003c/span>","c":"#2D2A6E"},{"h":"② 時間與溫度\u003cspan class=\"vn\" lang=\"vi\">Thời gian và nhiệt độ\u003c/span>","p":"記錄分裝、冷卻與冷藏；不要只看食物還香不香。\u003cspan class=\"vn\" lang=\"vi\">Ghi chia hộp, làm nguội và giữ lạnh; không chỉ xem còn thơm không.\u003c/span>","c":"#F5A623"},{"h":"③ 加熱能補救嗎？\u003cspan class=\"vn\" lang=\"vi\">Đun lại có cứu được không?\u003c/span>","p":"菌體、孢子、毒素不同；不把再加熱當成所有失溫食品的補救。\u003cspan class=\"vn\" lang=\"vi\">Tế bào, bào tử, độc tố khác nhau; đun lại không cứu mọi thực phẩm mất kiểm soát nhiệt.\u003c/span>","c":"#D65B5B"}]}]},{"id":"m1","nav":"生詞 Từ mới","kicker":"生詞 · Từ mới","h2":"本週生詞","lead":"10 個生詞　·　10 từ mới","blocks":[{"type":"flips","cols":3,"items":[{"t":"微生物","en":"wéishēngwù","b":"vi sinh vật"},{"t":"細菌","en":"xìjùn","b":"vi khuẩn"},{"t":"黴菌","en":"méijùn","b":"nấm mốc"},{"t":"酵母","en":"xiàomǔ","b":"nấm men"},{"t":"孢子","en":"bāozǐ","b":"bào tử"}],"title":"翻卡：生詞　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Lật thẻ: từ mới\u003c/span>"},{"type":"flips","cols":3,"items":[{"t":"生長曲線","en":"shēngzhǎng qūxiàn","b":"đường cong sinh trưởng"},{"t":"厭氧","en":"yànyǎng","b":"kỵ khí"},{"t":"腐敗菌","en":"fǔbàijùn","b":"vi khuẩn gây hư hỏng"},{"t":"病原菌","en":"bìngyuánjùn","b":"vi khuẩn gây bệnh"},{"t":"乳酸菌","en":"rǔsuānjùn","b":"vi khuẩn lactic"}]},{"type":"match","title":"配對：中文 ↔ 越南文　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Ghép: tiếng Trung ↔ tiếng Việt\u003c/span>","pairs":[{"label":"微生物","desc":"vi sinh vật"},{"label":"細菌","desc":"vi khuẩn"},{"label":"黴菌","desc":"nấm mốc"},{"label":"酵母","desc":"nấm men"},{"label":"孢子","desc":"bào tử"},{"label":"生長曲線","desc":"đường cong sinh trưởng"},{"label":"厭氧","desc":"kỵ khí"},{"label":"腐敗菌","desc":"vi khuẩn gây hư hỏng"},{"label":"病原菌","desc":"vi khuẩn gây bệnh"},{"label":"乳酸菌","desc":"vi khuẩn lactic"}],"done":"✓ 全部答對！Đúng hết!"}]},{"id":"s1","nav":"一 食品裡的四類微生…","kicker":"第一段 · Phần 1","h2":"食品裡的四類微生物","lead":"4 loại vi sinh vật trong thực phẩm","blocks":[{"type":"cards","title":"食品中常見的四類對象\u003cspan class=\"vn\" lang=\"vi\">Bốn nhóm thường gặp trong thực phẩm\u003c/span>","cols":4,"items":[{"h":"細菌\u003cspan class=\"vn\" lang=\"vi\">Vi khuẩn\u003c/span>","p":"多以二分裂增殖；倍增時間依菌株、食品與環境而異。\u003cspan class=\"vn\" lang=\"vi\">Thường phân đôi; thời gian tăng đôi tùy chủng, thực phẩm và môi trường.\u003c/span>","c":"#D65B5B"},{"h":"酵母\u003cspan class=\"vn\" lang=\"vi\">Nấm men\u003c/span>","p":"單細胞真菌；可參與發酵，也可能造成食品劣變。\u003cspan class=\"vn\" lang=\"vi\">Nấm đơn bào; có thể lên men hoặc làm hỏng thực phẩm.\u003c/span>","c":"#F5A623"},{"h":"黴菌\u003cspan class=\"vn\" lang=\"vi\">Nấm mốc\u003c/span>","p":"常有菌絲並產生傳播孢子；部分菌株可產生毒素。\u003cspan class=\"vn\" lang=\"vi\">Thường có sợi và bào tử phát tán; vài chủng có thể sinh độc tố.\u003c/span>","c":"#2FA36B"},{"h":"病毒\u003cspan class=\"vn\" lang=\"vi\">Virus\u003c/span>","p":"食品可作傳播媒介；食品中不會像細菌那樣增殖。\u003cspan class=\"vn\" lang=\"vi\">Thực phẩm có thể truyền virus; virus không tăng sinh trong đó như vi khuẩn.\u003c/span>","c":"#5B4FB8"}]},{"type":"note","title":"","text":"四類不是全部生物性危害的完整清單，例如寄生蟲也可能經食品傳播。能否在某個 aw、pH 或溫度生長，須分菌種與條件。\u003cspan class=\"vn\" lang=\"vi\">Bốn nhóm không phải mọi nguy cơ sinh học; ký sinh trùng cũng có thể truyền qua thực phẩm. Khả năng phát triển tùy loài và điều kiện aw, pH, nhiệt.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/files/food/published/Bad-Bug-Book-2nd-Edition-%28PDF%29.pdf\" target=\"_blank\" rel=\"noopener\">微生物與食品危害 / Vi sinh vật và nguy cơ: FDA Bad Bug Book ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"菌體、細菌孢子、毒素：分開看\u003cspan class=\"vn\" lang=\"vi\">Tế bào, bào tử vi khuẩn, độc tố: xét riêng\u003c/span>","cols":3,"items":[{"h":"一般菌體\u003cspan class=\"vn\" lang=\"vi\">Tế bào sinh dưỡng\u003c/span>","p":"適當加熱可降低許多菌體數量；仍要看時間與食品。\u003cspan class=\"vn\" lang=\"vi\">Gia nhiệt phù hợp giảm nhiều tế bào; còn tùy thời gian, thực phẩm.\u003c/span>","c":"#2D2A6E"},{"h":"細菌內生孢子\u003cspan class=\"vn\" lang=\"vi\">Nội bào tử vi khuẩn\u003c/span>","p":"是某些細菌的耐受構造，不是增加菌數的繁殖方式。\u003cspan class=\"vn\" lang=\"vi\">Là dạng chịu đựng của vài vi khuẩn, không phải cách tăng số lượng.\u003c/span>","c":"#F5A623"},{"h":"已形成的毒素\u003cspan class=\"vn\" lang=\"vi\">Độc tố đã tạo\u003c/span>","p":"不同毒素耐熱性不同，不能由菌體減少推定毒素也消失。\u003cspan class=\"vn\" lang=\"vi\">Độ bền nhiệt tùy độc tố; giảm tế bào không chứng minh độc tố biến mất.\u003c/span>","c":"#D65B5B"}]},{"type":"note","title":"","text":"仙人掌桿菌孢子可能熬過一般烹調；熟飯久置不當溫度可讓它萌發、增殖。其嘔吐型毒素耐熱，不能靠一般再加熱保證消除。\u003cspan class=\"vn\" lang=\"vi\">Bào tử B. cereus có thể qua nấu thông thường; cơm để lâu ở nhiệt không phù hợp có thể cho nảy mầm, tăng sinh. Độc tố gây nôn bền nhiệt, đun lại thường không bảo đảm loại bỏ.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/TC/siteContent.aspx?sid=1938\" target=\"_blank\" rel=\"noopener\">熟飯風險 / Nguy cơ cơm chín: 台灣 TFDA ↗\u003c/a>\u003c/p>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/files/food/published/Bad-Bug-Book-2nd-Edition-%28PDF%29.pdf\" target=\"_blank\" rel=\"noopener\">菌體、孢子與毒素 / Tế bào, bào tử, độc tố: FDA ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 1｜煮過了，還要問什麼？\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 1: Đã nấu, còn hỏi gì?\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"spores\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">同學說：「飯已煮熟，所以一定沒有細菌孢子，也不用管放多久。」找出兩個要修正的地方。\u003cspan class=\"vn\" lang=\"vi\">Bạn nói cơm chín nên chắc không có bào tử và không cần xem để bao lâu. Tìm hai điểm cần sửa.\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>煮熟不代表＿＿；煮後還要注意＿＿。\u003cspan class=\"vn\" lang=\"vi\">Nấu chín không có nghĩa ___; sau nấu cần chú ý ___.\u003c/span>\u003c/div>\u003clabel for=\"a2-w9-spores\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w9-spores\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>一般烹調不保證消除所有孢子；煮後仍要防污染、適當冷卻與及時冷藏，記錄時間溫度。\u003cspan class=\"vn\" lang=\"vi\">Nấu thường không bảo đảm hết bào tử; sau nấu cần tránh nhiễm, làm nguội, giữ lạnh sớm, ghi thời gian nhiệt.\u003c/span>\u003c/p>\u003cp>細菌內生孢子是耐受構造，不是黴菌傳播孢子的同一種功能；一個孢子萌發不是直接變成很多細菌。\u003cspan class=\"vn\" lang=\"vi\">Nội bào tử là dạng chịu đựng, khác vai trò bào tử nấm phát tán; một bào tử nảy mầm không trực tiếp thành nhiều tế bào.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"}]},{"id":"s2","nav":"二 微生物怎麼長大？","kicker":"第二段 · Phần 2","h2":"微生物怎麼長大？","lead":"Vi sinh vật phát triển thế nào?","blocks":[{"type":"cards","title":"四個時期：模型不是食安時鐘\u003cspan class=\"vn\" lang=\"vi\">Bốn pha: mô hình không phải đồng hồ an toàn\u003c/span>","cols":4,"items":[{"h":"遲滯期\u003cspan class=\"vn\" lang=\"vi\">Pha tiềm phát\u003c/span>","p":"適應環境，總活菌數可能變化不大；不代表沒有風險。\u003cspan class=\"vn\" lang=\"vi\">Thích nghi, tổng số sống có thể ít đổi; không bằng không có rủi ro.\u003c/span>","c":"#2D2A6E"},{"h":"對數期\u003cspan class=\"vn\" lang=\"vi\">Pha lũy thừa\u003c/span>","p":"在相對穩定條件下，以近似固定倍增時間增殖。\u003cspan class=\"vn\" lang=\"vi\">Trong điều kiện khá ổn định, tăng với thời gian nhân đôi gần cố định.\u003c/span>","c":"#D65B5B"},{"h":"穩定期\u003cspan class=\"vn\" lang=\"vi\">Pha cân bằng\u003c/span>","p":"新生與死亡大致平衡；不能把此時定為所有食品開始壞。\u003cspan class=\"vn\" lang=\"vi\">Sinh và chết gần cân bằng; không phải mọi thực phẩm bắt đầu hỏng lúc này.\u003c/span>","c":"#F5A623"},{"h":"衰退期\u003cspan class=\"vn\" lang=\"vi\">Pha suy giảm\u003c/span>","p":"可培養活菌數下降；毒素或其他危害未必隨之消失。\u003cspan class=\"vn\" lang=\"vi\">Số sống nuôi cấy được giảm; độc tố hay nguy cơ khác chưa chắc mất.\u003c/span>","c":"#5B4FB8"}]},{"type":"note","title":"","text":"圖是固定環境下的概念示意，縱軸為活菌數的對數。真實食品可能有多種菌、溫度變化與不同反應，不能由曲線位置判定可吃幾小時。\u003cspan class=\"vn\" lang=\"vi\">Hình là mô hình điều kiện cố định, trục dọc là log số vi khuẩn sống. Thực phẩm thật có nhiều loài, đổi nhiệt và phản ứng; vị trí đường cong không cho số giờ ăn an toàn.\u003c/span>"},{"type":"note","title":"短活動 2｜假設每 30 分鐘倍增\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 2: Giả định nhân đôi mỗi 30 phút\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"double\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">教學假設：從 100 個可增殖細菌開始，對數期每 30 分鐘倍增，條件不變且無死亡。90 分鐘後多少個？\u003cspan class=\"vn\" lang=\"vi\">Giả định: đầu 100 tế bào tăng được, pha log nhân đôi mỗi 30 phút, điều kiện cố định, không chết. Sau 90 phút bao nhiêu?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>90 分鐘有＿＿次倍增；100 × ＿＿＝＿＿。\u003cspan class=\"vn\" lang=\"vi\">90 phút có ___ lần nhân đôi; 100 × ___ = ___.\u003c/span>\u003c/div>\u003clabel for=\"a2-w9-double\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w9-double\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>90÷30＝3 次；100×2³＝800 個。\u003cspan class=\"vn\" lang=\"vi\">90 ÷ 30 = 3 lần; 100 × 2³ = 800 tế bào.\u003c/span>\u003c/p>\u003cp>這是假設模型，不是熟飯的實測增長，也不能用 800 個直接判定是否致病；還需菌種、毒素與食用量等資料。\u003cspan class=\"vn\" lang=\"vi\">Đây là mô hình giả định, không phải số đo cơm; 800 không trực tiếp xác định gây bệnh, cần loài, độc tố, lượng ăn.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"生長看多個因子，不是共同的一組門檻\u003cspan class=\"vn\" lang=\"vi\">Sinh trưởng tùy nhiều yếu tố, không cùng một bộ ngưỡng\u003c/span>","cols":4,"items":[{"h":"溫度與時間\u003cspan class=\"vn\" lang=\"vi\">Nhiệt và thời gian\u003c/span>","p":"最適溫度不是全部都 37°C；冷藏下仍可能有能生長的菌。\u003cspan class=\"vn\" lang=\"vi\">Không phải tất cả tối ưu 37°C; một số vẫn có thể phát triển khi lạnh.\u003c/span>","c":"#D65B5B"},{"h":"pH 與食品成分\u003cspan class=\"vn\" lang=\"vi\">pH và thành phần\u003c/span>","p":"酸可以抑制部分菌，但耐酸、生長與存活要分開。\u003cspan class=\"vn\" lang=\"vi\">Axit hạn chế vài loài; chịu axit, sinh trưởng và sống sót khác nhau.\u003c/span>","c":"#2FA36B"},{"h":"水活性 aw\u003cspan class=\"vn\" lang=\"vi\">Hoạt độ nước aw\u003c/span>","p":"同種食品也可能因配方而不同；低 aw 不代表無菌。\u003cspan class=\"vn\" lang=\"vi\">Cùng tên thực phẩm vẫn khác theo công thức; aw thấp không bằng vô trùng.\u003c/span>","c":"#00B8B8"},{"h":"氧與其他條件\u003cspan class=\"vn\" lang=\"vi\">Oxy và điều kiện khác\u003c/span>","p":"需氧、厭氧、兼性菌不同；還看養分、菌株與共存菌。\u003cspan class=\"vn\" lang=\"vi\">Loài hiếu, kỵ, tùy nghi khác nhau; còn dinh dưỡng, chủng và loài cùng có.\u003c/span>","c":"#5B4FB8"}]},{"type":"note","title":"","text":"pH 4.6 是特定罐頭分類的重要界值，不是「低於它，所有病原都消失」。真空減少氧，也不是消除全部微生物的方法。\u003cspan class=\"vn\" lang=\"vi\">pH 4,6 quan trọng trong phân loại một số đồ hộp, không có nghĩa mọi mầm bệnh mất dưới ngưỡng đó. Chân không giảm oxy, không loại mọi vi sinh vật.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/food/guidance-documents-regulatory-information-topic-food-and-dietary-supplements/acidified-low-acid-canned-foods-guidance-documents-regulatory-information\" target=\"_blank\" rel=\"noopener\">罐頭定義的適用範圍 / Phạm vi định nghĩa đồ hộp: US FDA ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"台灣 TFDA 衛教：保存溫度與時間\u003cspan class=\"vn\" lang=\"vi\">Hướng dẫn TFDA Đài Loan: nhiệt và thời gian\u003c/span>","cols":3,"items":[{"h":"冷藏\u003cspan class=\"vn\" lang=\"vi\">Giữ lạnh\u003c/span>","p":"低於 7°C；熟食、易腐食品與原料建議 5°C 以下。\u003cspan class=\"vn\" lang=\"vi\">Dưới 7°C; thực phẩm chín, dễ hỏng và nguyên liệu nên 5°C trở xuống.\u003c/span>","c":"#00B8B8"},{"h":"熱藏\u003cspan class=\"vn\" lang=\"vi\">Giữ nóng\u003c/span>","p":"高於 60°C；需確認食物實際溫度，不只看設備設定。\u003cspan class=\"vn\" lang=\"vi\">Trên 60°C; kiểm tra nhiệt thực phẩm, không chỉ cài đặt thiết bị.\u003c/span>","c":"#D65B5B"},{"h":"室溫放置\u003cspan class=\"vn\" lang=\"vi\">Để nhiệt độ phòng\u003c/span>","p":"調製後勿超過 2 小時；室溫超過 32°C 時勿超過 1 小時。\u003cspan class=\"vn\" lang=\"vi\">Sau chế biến không quá 2 giờ; khi phòng trên 32°C không quá 1 giờ.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"以上為 TFDA 的一般預防建議，不是每個病原的生長界線或保證安全時間；應儘速妥善冷卻保存，勿把上限當成等待目標。\u003cspan class=\"vn\" lang=\"vi\">Đây là khuyến nghị phòng ngừa chung của TFDA, không phải giới hạn sinh trưởng mọi mầm bệnh hay thời gian bảo đảm an toàn; làm nguội, bảo quản sớm, không đợi đến giới hạn.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/tc/siteContent.aspx?sid=2572\" target=\"_blank\" rel=\"noopener\">溫度、時間與適用範圍 / Nhiệt, thời gian và phạm vi: 台灣 TFDA ↗\u003c/a>\u003c/p>"}]},{"id":"s3","nav":"三 壞菌、病菌和好菌","kicker":"第三段 · Phần 3","h2":"壞菌、病菌和好菌","lead":"Vi khuẩn gây hỏng, gây bệnh và có lợi","blocks":[{"type":"cards","title":"腐敗與致病：不能靠感官分界\u003cspan class=\"vn\" lang=\"vi\">Hư hỏng và gây bệnh: không phân ranh chỉ bằng giác quan\u003c/span>","cols":3,"items":[{"h":"品質變化\u003cspan class=\"vn\" lang=\"vi\">Đổi chất lượng\u003c/span>","p":"微生物可使食品產氣、變黏或異味；原因仍需資料確認。\u003cspan class=\"vn\" lang=\"vi\">Vi sinh vật có thể gây khí, nhớt hay mùi lạ; nguyên nhân cần dữ liệu.\u003c/span>","c":"#2D2A6E"},{"h":"疾病風險\u003cspan class=\"vn\" lang=\"vi\">Nguy cơ bệnh\u003c/span>","p":"病原或毒素可能存在，外觀與氣味卻無明顯改變。\u003cspan class=\"vn\" lang=\"vi\">Mầm bệnh hay độc tố có thể có dù nhìn, ngửi chưa khác.\u003c/span>","c":"#D65B5B"},{"h":"不是互斥兩群\u003cspan class=\"vn\" lang=\"vi\">Không phải hai nhóm loại trừ\u003c/span>","p":"同一食品可同時有腐敗與病原；不能由沒有異味宣告安全。\u003cspan class=\"vn\" lang=\"vi\">Cùng thực phẩm có thể vừa hỏng vừa có mầm bệnh; không mùi lạ chưa chứng minh an toàn.\u003c/span>","c":"#F5A623"}]},{"type":"cards","title":"病原例子：看情境，不靠症狀猜菌\u003cspan class=\"vn\" lang=\"vi\">Ví dụ mầm bệnh: xem tình huống, không đoán từ triệu chứng\u003c/span>","cols":4,"items":[{"h":"沙門氏菌\u003cspan class=\"vn\" lang=\"vi\">Salmonella\u003c/span>","p":"生禽肉、蛋等可帶入；重點是充分加熱並避免交叉污染。\u003cspan class=\"vn\" lang=\"vi\">Gia cầm, trứng có thể mang vào; nấu phù hợp và tránh nhiễm chéo.\u003c/span>","c":"#2D2A6E"},{"h":"金黃色葡萄球菌\u003cspan class=\"vn\" lang=\"vi\">S. aureus\u003c/span>","p":"人員接觸可能污染；已形成的腸毒素可耐一般加熱。\u003cspan class=\"vn\" lang=\"vi\">Người xử lý có thể gây nhiễm; độc tố ruột tạo sẵn có thể chịu nhiệt nấu.\u003c/span>","c":"#D65B5B"},{"h":"腸炎弧菌\u003cspan class=\"vn\" lang=\"vi\">V. parahaemolyticus\u003c/span>","p":"海產是常見情境；用水沖洗不能取代食安控制。\u003cspan class=\"vn\" lang=\"vi\">Hải sản là tình huống thường gặp; rửa nước không thay kiểm soát an toàn.\u003c/span>","c":"#00B8B8"},{"h":"諾羅病毒\u003cspan class=\"vn\" lang=\"vi\">Norovirus\u003c/span>","p":"食物、手或環境可傳播；肥皂洗手，酒精乾洗手不能取代。\u003cspan class=\"vn\" lang=\"vi\">Có thể truyền qua thức ăn, tay, môi trường; rửa xà phòng, dung dịch tay không thay thế.\u003c/span>","c":"#5B4FB8"}]},{"type":"note","title":"","text":"不同病原的致病量、耐受性與途徑不同；不能只靠吃了什麼或症狀確診。食物聞起來正常，也不能證明沒有病原或毒素。\u003cspan class=\"vn\" lang=\"vi\">Liều, sức chịu và đường lây tùy mầm bệnh; thức ăn đã dùng hay triệu chứng không tự cho chẩn đoán. Mùi bình thường không chứng minh không mầm bệnh, độc tố.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/files/food/published/Bad-Bug-Book-2nd-Edition-%28PDF%29.pdf\" target=\"_blank\" rel=\"noopener\">病原特性 / Đặc tính mầm bệnh: FDA Bad Bug Book ↗\u003c/a>\u003c/p>\u003cp class=\"source-note\">\u003ca href=\"https://www.cdc.gov/norovirus/prevention/index.html\" target=\"_blank\" rel=\"noopener\">洗手與諾羅病毒 / Rửa tay và norovirus: CDC ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"減少污染，也控制生長機會\u003cspan class=\"vn\" lang=\"vi\">Giảm nhiễm và cơ hội phát triển\u003c/span>","cols":3,"items":[{"h":"手與用水\u003cspan class=\"vn\" lang=\"vi\">Tay và nước\u003c/span>","p":"洗手、用水衛生；有傷口先妥善處理，避免直接接觸即食食品。\u003cspan class=\"vn\" lang=\"vi\">Rửa tay, nước sạch; xử lý vết thương, tránh tay chạm trực tiếp thức ăn ăn liền.\u003c/span>","c":"#2D2A6E"},{"h":"生熟分開\u003cspan class=\"vn\" lang=\"vi\">Tách sống chín\u003c/span>","p":"處理生肉的器具清潔消毒後，才用於可直接食用食品。\u003cspan class=\"vn\" lang=\"vi\">Dụng cụ thịt sống cần làm sạch, khử trùng trước dùng cho thức ăn ăn liền.\u003c/span>","c":"#2FA36B"},{"h":"加熱與保存\u003cspan class=\"vn\" lang=\"vi\">Nấu và bảo quản\u003c/span>","p":"確認中心及時間；分裝、適當冷卻並及時冷藏，記錄條件。\u003cspan class=\"vn\" lang=\"vi\">Xác nhận tâm và thời gian; chia hộp, làm nguội phù hợp, giữ lạnh sớm, ghi điều kiện.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"TFDA 一般衛教提醒中心溫度超過 70°C；實際殺菌效果還看時間、食品與目標，不能當成消除所有孢子或毒素的條件。\u003cspan class=\"vn\" lang=\"vi\">TFDA nhắc chung nhiệt tâm trên 70°C; hiệu quả còn tùy thời gian, thực phẩm, đối tượng, không bảo đảm loại mọi bào tử hay độc tố.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/tc/includes/GetFile.ashx?id=t398244\" target=\"_blank\" rel=\"noopener\">預防食品中毒原則 / Nguyên tắc phòng ngộ độc: 台灣 TFDA ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 3｜比較熟飯的處理紀錄\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 3: So hồ sơ xử lý cơm\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"rice\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">A：煮後分淺盒、適當冷卻並及時冷藏。B：常溫放整晚，隔天再熱。哪個做法較能減少增殖機會？還要查什麼？\u003cspan class=\"vn\" lang=\"vi\">A chia hộp nông, làm nguội phù hợp, giữ lạnh sớm; B để phòng cả đêm rồi hâm. Cách nào giảm cơ hội tăng sinh hơn? Cần biết gì thêm?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>我選＿＿，因為＿＿；還要確認＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tôi chọn ___ vì ___; cần xác nhận ___.\u003c/span>\u003c/div>\u003clabel for=\"a2-w9-rice\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w9-rice\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>A 較能減少長時間溫放；仍需確認冷卻時間、食物實際溫度、冰箱狀態與衛生。B 不能靠再熱就保證安全。\u003cspan class=\"vn\" lang=\"vi\">A giảm để ấm kéo dài; vẫn cần thời gian nguội, nhiệt thức ăn, tủ lạnh và vệ sinh. B không bảo đảm an toàn chỉ bằng hâm.\u003c/span>\u003c/p>\u003cp>比較的是預防做法，不是已檢驗產品安全；已在室溫放整晚的熟飯不應靠試吃或加熱來賭安全。\u003cspan class=\"vn\" lang=\"vi\">So biện pháp phòng ngừa, không phải kết quả kiểm nghiệm; cơm để phòng cả đêm không nên nếm hay hâm để đánh cược an toàn.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"發酵：選對菌株與條件\u003cspan class=\"vn\" lang=\"vi\">Lên men: đúng chủng và điều kiện\u003c/span>","cols":3,"items":[{"h":"乳酸菌\u003cspan class=\"vn\" lang=\"vi\">Vi khuẩn lactic\u003c/span>","p":"可把糖轉成乳酸並改變 pH、風味；常用於特定發酵食品。\u003cspan class=\"vn\" lang=\"vi\">Có thể đổi đường thành axit lactic, đổi pH, hương; dùng trong một số thực phẩm lên men.\u003c/span>","c":"#2FA36B"},{"h":"酵母\u003cspan class=\"vn\" lang=\"vi\">Nấm men\u003c/span>","p":"酒精發酵可形成酒精與 CO₂；麵包利用產氣。\u003cspan class=\"vn\" lang=\"vi\">Lên men rượu có thể tạo rượu và CO₂; bánh mì dùng khí tạo nở.\u003c/span>","c":"#F5A623"},{"h":"食品用麴菌\u003cspan class=\"vn\" lang=\"vi\">Nấm koji dùng thực phẩm\u003c/span>","p":"經選用菌株可提供酵素；不是隨便長出的黴都能拿來發酵。\u003cspan class=\"vn\" lang=\"vi\">Chủng được chọn có thể cung cấp enzyme; không dùng mọi nấm mốc mọc ngẫu nhiên.\u003c/span>","c":"#5B4FB8"}]},{"type":"note","title":"","text":"發酵食品不一定含活菌，也不自動等於益生菌。益生菌需有適當活菌量與健康益處證據；發酵產品的安全仍需配方、製程與保存控制。\u003cspan class=\"vn\" lang=\"vi\">Thực phẩm lên men không luôn có vi sinh vật sống, không tự là probiotic. Probiotic cần lượng sống phù hợp và bằng chứng lợi ích; an toàn vẫn cần công thức, quy trình, bảo quản.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC7925329/\" target=\"_blank\" rel=\"noopener\">發酵食品共識 / Đồng thuận thực phẩm lên men: ISAPP 2021 ↗\u003c/a>\u003c/p>"}]},{"id":"sum","nav":"重點 Điểm chính","kicker":"今天的重點 · Điểm chính hôm nay","h2":"今天的重點","lead":"Điểm chính hôm nay","blocks":[{"type":"cards","title":"回顧\u003cspan class=\"vn\" lang=\"vi\">Ôn tập\u003c/span>","cols":2,"items":[{"h":"菌體、細菌孢子與毒素不同\u003cspan class=\"vn\" lang=\"vi\">Tế bào, bào tử vi khuẩn và độc tố khác nhau\u003c/span>"},{"h":"倍增時間與生長條件要說清楚\u003cspan class=\"vn\" lang=\"vi\">Nêu rõ thời gian nhân đôi và điều kiện\u003c/span>"},{"h":"沒有異味，不等於沒有風險\u003cspan class=\"vn\" lang=\"vi\">Không mùi lạ không bằng không có rủi ro\u003c/span>"},{"h":"煮後也要防污染、控溫與記錄\u003cspan class=\"vn\" lang=\"vi\">Sau nấu vẫn tránh nhiễm, kiểm soát nhiệt và ghi chép\u003c/span>"}]},{"type":"note","title":"","text":"回家：記錄熟飯煮好、分裝與冷藏的時間；用「我看到＿＿，還要確認＿＿」說明。\u003cspan class=\"vn\" lang=\"vi\">Về nhà: ghi thời gian cơm nấu, chia hộp, giữ lạnh; nói điều thấy và điều cần xác nhận.\u003c/span>"}]},{"id":"quiz","nav":"練習 Luyện tập","kicker":"練習 · Luyện tập","h2":"課後練習 10 題","lead":"10 題核心檢核：分清菌體、孢子、毒素及假設計算。10 câu cốt lõi: phân biệt tế bào, bào tử, độc tố và tính giả định.","blocks":[{"type":"quiz","items":[{"q":"「nấm men」的中文是？\u003cspan class=\"vn\" lang=\"vi\">nấm men tiếng Trung là gì?\u003c/span>","o":["黴菌 méijùn","細菌 xìjùn","酵母 xiàomǔ","病毒 bìngdú"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 酵母是單細胞真菌，可用於麵包或酒精發酵，也可能造成食品劣變；是否有益要看菌株與用途。\u003cspan class=\"vn\" lang=\"vi\">Nấm men là nấm đơn bào, có thể làm bánh hay rượu, cũng có thể gây hỏng; lợi ích tùy chủng và mục đích.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：酵母可以發酵，也可能造成劣變。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Nấm men có thể lên men hoặc làm hỏng.\u003c/span>\u003c/div>"},{"q":"關於乳酸發酵，哪句較恰當？\u003cspan class=\"vn\" lang=\"vi\">Về lên men lactic, câu nào phù hợp?\u003c/span>","o":["可改變 pH，但仍需控制製程與保存 Có thể đổi pH, vẫn cần quy trình và bảo quản","有酸味就保證無病原 Chua là chắc không mầm bệnh","所有乳酸菌都是益生菌 Mọi vi khuẩn lactic đều probiotic","發酵後都不用冷藏 Mọi món lên men không cần lạnh"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 發酵可以帶來酸、風味與質地變化，但不自動保證安全或健康功效；不是所有發酵菌都符合益生菌定義。\u003cspan class=\"vn\" lang=\"vi\">Lên men đổi axit, hương, kết cấu, không tự bảo đảm an toàn hay lợi ích; không phải mọi chủng là probiotic.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：發酵仍需要控制條件。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Lên men vẫn cần kiểm soát điều kiện.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC7925329/\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"「shēngzhǎng qūxiàn」是哪個詞？\u003cspan class=\"vn\" lang=\"vi\">shēngzhǎng qūxiàn là từ nào?\u003c/span>","o":["食品中毒 ngộ độc thực phẩm","危險溫度帶 vùng nhiệt độ nguy hiểm","微生物 vi sinh vật","生長曲線 đường cong sinh trưởng"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 生長曲線描述數量如何隨時間改變；四個時期是概念模型，不能直接讀出某個食品的安全期限。\u003cspan class=\"vn\" lang=\"vi\">Đường cong mô tả số lượng theo thời gian; bốn pha là mô hình, không trực tiếp cho hạn an toàn thực phẩm.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：生長曲線不是安全期限表。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Đường cong không phải bảng hạn an toàn.\u003c/span>\u003c/div>"},{"q":"依台灣 TFDA 一般衛教，室溫超過 32°C，調製食品不宜放超過多久？\u003cspan class=\"vn\" lang=\"vi\">Theo TFDA Đài Loan, khi phòng trên 32°C, thực phẩm chế biến không nên để quá?\u003c/span>","o":["2 小時 2 giờ","1 小時 1 giờ","6 小時 6 giờ","整晚 Cả đêm"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> TFDA 提醒一般室溫勿超過 2 小時，超過 32°C 時勿超過 1 小時；要儘速妥善保存，不把上限當等待目標或安全保證。\u003cspan class=\"vn\" lang=\"vi\">TFDA nhắc phòng thường không quá 2 giờ, trên 32°C không quá 1 giờ; bảo quản sớm, không đợi đến giới hạn hay xem là bảo đảm an toàn.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：越熱，越要儘速妥善保存。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Càng nóng càng cần bảo quản sớm.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/tc/siteContent.aspx?sid=2572\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"假設從 100 個開始，每 30 分鐘倍增，90 分鐘後多少？\u003cspan class=\"vn\" lang=\"vi\">Giả định đầu 100 tế bào, nhân đôi mỗi 30 phút, sau 90 phút?\u003c/span>","o":["200 個","400 個","800 個","300 個"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 90 分鐘有 3 次倍增，100×2×2×2＝800。這是對數期固定條件的假設，不是所有菌或熟飯的實測值。\u003cspan class=\"vn\" lang=\"vi\">90 phút có 3 lần nhân đôi, 100 × 2 × 2 × 2 = 800; giả định pha log cố định, không là số đo mọi loài hay cơm.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：先算倍增幾次，再乘二。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tính số lần nhân đôi rồi nhân hai.\u003c/span>\u003c/div>"},{"q":"熟飯常溫放整晚，隔天再熱就能保證安全嗎？\u003cspan class=\"vn\" lang=\"vi\">Cơm để phòng cả đêm, hâm lại có bảo đảm an toàn?\u003c/span>","o":["不能，部分孢子與已形成毒素的風險仍在 Không, có thể còn bào tử hay độc tố","能，聞起來正常就可以 Có, mùi bình thường là được","能，米飯沒有蛋白質 Có, cơm không có protein","能，菌數下降就代表毒素全消失 Có, giảm khuẩn là hết mọi độc tố"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 仙人掌桿菌孢子可能存活並在不當保存時增殖；其嘔吐型毒素耐熱，不能靠一般再加熱保證消除。應從煮後處理和控溫預防。\u003cspan class=\"vn\" lang=\"vi\">Bào tử B. cereus có thể sống, tăng khi bảo quản sai; độc tố gây nôn bền nhiệt, hâm thường không bảo đảm loại bỏ. Phòng từ xử lý sau nấu và nhiệt.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：煮後控溫，比事後補救重要。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Kiểm soát sau nấu quan trọng hơn cứu sau đó.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/TC/siteContent.aspx?sid=1938\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"切生雞肉的砧板，未清潔消毒就切即食水果，主要風險是？\u003cspan class=\"vn\" lang=\"vi\">Thớt gà sống chưa làm sạch, khử trùng đã cắt quả ăn liền, rủi ro chính?\u003c/span>","o":["水果一定變酸 Quả chắc chua","澱粉立即老化 Tinh bột thoái hóa ngay","病原可能交叉污染水果 Mầm bệnh có thể nhiễm chéo","所有細菌都變孢子 Mọi vi khuẩn thành bào tử"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 生肉可帶入病原；器具、手或滴液可將它帶到即食食品。水果外觀不變也不能證明沒有污染。\u003cspan class=\"vn\" lang=\"vi\">Thịt sống có thể mang mầm bệnh; dụng cụ, tay, dịch truyền sang thức ăn ăn liền. Nhìn không đổi không chứng minh không nhiễm.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：生熟器具要分開，避免交叉污染。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tách dụng cụ sống chín để tránh nhiễm chéo.\u003c/span>\u003c/div>"},{"q":"哪句最能說明病毒與食品的關係？\u003cspan class=\"vn\" lang=\"vi\">Câu nào mô tả virus và thực phẩm phù hợp?\u003c/span>","o":["病毒在果醬裡每 30 分鐘倍增 Virus nhân đôi trong mứt mỗi 30 phút","病毒只怕糖 Virus chỉ sợ đường","病毒都能用氣味辨認 Mọi virus nhận ra bằng mùi","食品可傳播病毒，但病毒不在食品中自行增殖 Thực phẩm truyền virus, virus không tự tăng sinh trong đó"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 例如諾羅病毒可經受污染食品或手傳播；食品中不增殖，不代表沒有感染風險。\u003cspan class=\"vn\" lang=\"vi\">Norovirus có thể truyền qua thức ăn, tay nhiễm; không tăng sinh trong thức ăn không bằng không có nguy cơ.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：食品可以是病毒的傳播媒介。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Thực phẩm có thể là vật truyền virus.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.cdc.gov/norovirus/prevention/index.html\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"食品沒有異味，就能判斷安全嗎？\u003cspan class=\"vn\" lang=\"vi\">Thực phẩm không mùi lạ có xác định an toàn?\u003c/span>","o":["能，病原都會發臭 Có, mọi mầm bệnh gây mùi","不能，還要看處理與保存等證據 Không, cần bằng chứng xử lý, bảo quản","能，只要沒有長黴 Có, không mốc là được","能，只要還在遲滯期 Có, còn pha lag là được"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 外觀、氣味與病原或毒素的存在不一定一致；腐敗和安全也不是兩個完全互斥的問題。\u003cspan class=\"vn\" lang=\"vi\">Nhìn, ngửi không luôn phù hợp sự có mầm bệnh, độc tố; hư hỏng và an toàn không hoàn toàn loại trừ nhau.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：聞起來正常，不代表已證明安全。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Mùi bình thường không chứng minh an toàn.\u003c/span>\u003c/div>"},{"q":"麵包麵糰膨起，常利用酵母產生的什麼？\u003cspan class=\"vn\" lang=\"vi\">Bột bánh mì nở thường dùng nấm men tạo gì?\u003c/span>","o":["乳酸 Axit lactic","氧氣 Oxy","食鹽 Muối","二氧化碳 CO₂"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 酵母酒精發酵可產生 CO₂ 和酒精，氣體有助麵糰膨起；仍需看酵母、配方與製程條件。\u003cspan class=\"vn\" lang=\"vi\">Lên men rượu của nấm men có thể tạo CO₂ và rượu; khí giúp bột nở, còn tùy chủng, công thức, quy trình.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：麵糰利用酵母產生的氣體膨起。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Bột dùng khí nấm men tạo để nở.\u003c/span>\u003c/div>"}]}]}],"a2":true,"track":{"url":"https://qmldcjkllisvfgegkfsz.supabase.co","key":"sb_publishable_xprm7A1B-hQhAMBIMaWOWw_w617svI1"}};</script>
<script>
/*
 * runtime.client.js — 跑在瀏覽器裡的渲染器（17 週共用，逐字內嵌進每份 HTML）
 * 讀 window.__LESSON__ 的資料，把 modules / blocks 畫出來。
 * 互動行為（翻卡、展開、配對、測驗）沿用週1 手寫版的做法，不要另創一套。
 */
(function () {
  var D = window.__LESSON__;
  var SERIES = D.series;
  var $ = function (s) { return document.querySelector(s); };
  // 國合班 A2 版（D.a2）：介面文字加越南文；一般班 U() 只回中文，畫面與原本完全相同
  var A2 = !!D.a2;
  function U(zh, vn) { return A2 ? zh + " " + vn : zh; }

  /* ---------- 學習歷程記錄（Supabase） ----------
     只在 lesson.js 注入 D.track = {url, key} 的週次啟用（lib/tracking.json 的 weeks）；
     其他週 TRACK.on 為 false，send() 是空函式，教材行為完全不變。
     只送「學號代碼」與互動事件，不送姓名。送失敗就丟掉，不重試、不阻擋教材。 */
  var CTX = { mod: null, bi: 0 };   // 目前正在渲染的模組 id 與區塊序號（render 是同步的）
  var TRACK = (function () {
    var cfg = D.track;
    var noop = function () {};
    if (!cfg || !cfg.url || !cfg.key) return { on: false, send: noop, flush: noop, code: function () { return ""; }, setCode: noop };
    var KEY = "ifs_code", DKEY = "ifs_device";
    var rnd = function () { return Math.random().toString(36).slice(2, 10); };
    var sid = rnd() + Date.now().toString(36);
    // device_id：同一支手機／瀏覽器跨次開頁不變。學生後來才填學號代碼時，先前的 anon 事件可靠它回接。
    var did = "";
    try { did = localStorage.getItem(DKEY) || ""; if (!did) { did = "d" + rnd() + rnd(); localStorage.setItem(DKEY, did); } } catch (e) { did = "d" + rnd(); }
    var q = [], timer = null;
    function code() { try { return (localStorage.getItem(KEY) || "").trim(); } catch (e) { return ""; } }
    function setCode(v) { try { localStorage.setItem(KEY, (v || "").trim().slice(0, 20)); } catch (e) {} }
    function cut(s, n) { return s == null ? null : String(s).slice(0, n); }
    // 欄位長度與 payload 大小在前端先截到資料表 CHECK 的上限：PostgREST 批次 INSERT 是原子的，
    // 一筆違反 CHECK 整批都會被拒，而我們失敗即丟，會靜默掉整個 4 秒窗口。
    function send(event, mod, block, payload) {
      var p = payload || {};
      var ps = JSON.stringify(p);
      if (ps.length > 1800) p = { trunc: true, keys: Object.keys(p).slice(0, 10) };
      q.push({
        student_code: cut(code(), 20) || "anon", device_id: cut(did, 40), week: D.week || 0,
        module_id: cut(mod, 30), block_type: cut(block, 10), event: cut(event, 30),
        payload: p, session_id: cut(sid, 40), build: cut(D.build, 16), client_ts: new Date().toISOString(),
        cls: A2 ? "a2" : undefined,   // 國合班與一般班同週分開；一般班不送這欄（JSON 會略過 undefined）
      });
      if (q.length >= 40) flush();
      else if (!timer) timer = setTimeout(flush, 4000);
    }
    function flush() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!q.length) return;
      var body = JSON.stringify(q.splice(0, 50));
      try {
        fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/ifs_lesson_events", {
          method: "POST", keepalive: true, body: body,
          headers: { "Content-Type": "application/json", "apikey": cfg.key, "Prefer": "return=minimal" },
        }).catch(noop);
      } catch (e) { /* 舊瀏覽器沒有 fetch：不記錄 */ }
      if (q.length) timer = setTimeout(flush, 1000);
    }
    window.addEventListener("pagehide", flush);
    return { on: true, send: send, flush: flush, code: code, setCode: setCode };
  })();

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function colorAt(given, i) { return given || SERIES[i % SERIES.length]; }
  function gridCls(n) { return "grid g" + (n === 2 || n === 3 || n === 4 ? n : 3); }
  function listHtml(v) {
    // body 可以是字串或字串陣列；陣列渲染成 <ul>
    if (v == null) return "";
    if (typeof v === "string") return '<p>' + v + '</p>';
    return '<ul>' + v.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
  }

  /* ---------- 區塊標題 ---------- */
  function heading(frag, b) {
    if (b.title) frag.appendChild(el("div", "sec-title", '<span class="bar"></span>' + b.title));
    if (b.hint) frag.appendChild(el("div", "hint", b.hint));
  }

  /* ---------- 各區塊 ---------- */
  var BLOCKS = {};

  BLOCKS.flips = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (d, i) {
      var c = colorAt(d.c, i);
      var card = el("div", "flip");
      if (b.h) card.style.height = b.h + "px";
      card.innerHTML =
        '<div class="flip-in">' +
        '<div class="face front"><div class="cbar" style="background:' + c + '"></div>' +
        '<div class="t">' + d.t + '</div><div class="en">' + (d.en || "") + '</div>' +
        '<div class="tap">▸ ' + U("點我看解釋", "Chạm để xem") + '</div></div>' +
        '<div class="face back"><div class="cbar" style="background:' + c + '"></div>' +
        '<p>' + d.b + '</p></div></div>';
      var mod = CTX.mod, bi = CTX.bi;
      card.onclick = function () {
        if (card.classList.toggle("on")) TRACK.send("flip_open", mod, "flips", { b: bi, i: i, t: d.t });
      };
      g.appendChild(card);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.exp = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div");
    b.items.forEach(function (t, i) {
      var box = el("div", "exp");
      var res = t.res ? '<div style="margin-top:10px;font-size:13px;color:var(--secondary);font-weight:700">🔗 ' + t.res + '</div>' : "";
      box.innerHTML =
        '<button><span class="num">' + (i + 1) + '</span><span>' + t.h + '</span>' +
        '<span class="tag">' + (t.tag || "") + '</span><span class="chev">›</span></button>' +
        '<div class="body">' + listHtml(t.body) + res + '</div>';
      var body = box.querySelector(".body");
      var mod = CTX.mod, bi = CTX.bi;
      box.querySelector("button").onclick = function () {
        var on = box.classList.toggle("on");
        if (!on) { body.style.maxHeight = "0px"; return; }
        TRACK.send("exp_open", mod, "exp", { b: bi, i: i, h: t.h });
        // 用實際內容高度展開，避免長段落被固定 max-height 截掉。
        // 必須先解除 max-height 再量：在 max-height:0 的狀態下量 scrollHeight 會得到 0，
        // 面板就只會開一條縫（實測過）。量完歸零並強制重排，transition 才有起點。
        body.style.maxHeight = "none";
        var h = body.scrollHeight;
        body.style.maxHeight = "0px";
        void body.offsetHeight;
        body.style.maxHeight = h + "px";
      };
      host.appendChild(box);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.cards = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var box = el("div", "card");
      box.style.borderTop = "4px solid " + accent;
      box.innerHTML = '<div class="h">' + c.h + '</div>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        (c.li ? '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>' : "") +
        (c.p ? '<p style="margin-top:8px;font-size:15.5px;color:var(--mid)">' + c.p + '</p>' : "");
      g.appendChild(box);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.timeline = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "tl");
    b.steps.forEach(function (s, i) {
      var st = el("div", "step");
      st.innerHTML = '<div class="dot" style="background:' + colorAt(s.c, i) + '">' + (i + 1) + '</div>' +
        '<h4>' + s.h + '</h4><p>' + s.p + '</p>';
      host.appendChild(st);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.compare = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "cmp");
    [b.left, b.right].forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var col = el("div", "col");
      col.innerHTML = '<div class="cbar" style="background:' + accent + '"></div>' +
        '<h4 style="color:' + accent + '">' + c.h + '</h4>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
      wrap.appendChild(col);
    });
    f.appendChild(wrap);
    if (b.note) f.appendChild(el("div", "cmp-note", b.note));
    return f;
  };

  BLOCKS.table = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "tblwrap");
    var html = '<table class="tbl"><thead><tr>' +
      b.head.map(function (h) { return '<th>' + h + '</th>'; }).join("") + '</tr></thead><tbody>' +
      b.rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join("") + '</tr>';
      }).join("") + '</tbody></table>';
    wrap.innerHTML = html;
    f.appendChild(wrap); return f;
  };

  BLOCKS.note = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    f.appendChild(el("div", "note" + (b.kind ? " " + b.kind : ""), b.text));
    return f;
  };

  BLOCKS.match = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "match-wrap");
    var pool = el("div", "pool"), targets = el("div", "targets");
    var pairs = b.pairs;
    var order = pairs.slice().sort(function () { return Math.random() - 0.5; });
    var selected = null, solved = 0, errors = 0, t0 = null;
    var mod = CTX.mod, bi = CTX.bi;
    var msg = el("div");
    msg.style.cssText = "margin-top:14px;font-weight:700;color:var(--green)";

    function tryMatch(slot, key) {
      if (slot.classList.contains("ok")) return;
      if (t0 === null) t0 = Date.now();
      if (slot.dataset.k === key) {
        slot.classList.add("ok"); slot.classList.remove("bad");
        slot.querySelector(".drop").textContent = key;
        var chip = pool.querySelector('.chip[data-k="' + key + '"]');
        chip.classList.add("used"); chip.classList.remove("sel");
        selected = null; solved++;
        TRACK.send("match_ok", mod, "match", { b: bi, label: key });
        if (solved === pairs.length) {
          msg.textContent = b.done || U("✓ 全部答對！", "Đúng hết!");
          TRACK.send("match_done", mod, "match", { b: bi, n: pairs.length, errors: errors, ms: Date.now() - t0 });
        }
      } else {
        errors++;
        TRACK.send("match_bad", mod, "match", { b: bi, label: key, slot: slot.dataset.k });
        slot.classList.add("bad");
        setTimeout(function () { slot.classList.remove("bad"); }, 350);
      }
    }
    order.forEach(function (q) {
      var c = el("div", "chip"); c.textContent = q.label; c.draggable = true; c.dataset.k = q.label;
      c.addEventListener("dragstart", function (e) { e.dataTransfer.setData("k", q.label); });
      c.onclick = function () {
        if (c.classList.contains("used")) return;
        if (selected === c) { c.classList.remove("sel"); selected = null; return; }
        pool.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("sel"); });
        c.classList.add("sel"); selected = c;
      };
      pool.appendChild(c);
    });
    pairs.forEach(function (q) {
      var s = el("div", "slot"); s.dataset.k = q.label;
      s.innerHTML = '<div class="drop">' + U("拖到這裡", "Kéo vào đây") + '</div><div class="desc">' + q.desc + '</div>';
      s.addEventListener("dragover", function (e) { e.preventDefault(); });
      s.addEventListener("drop", function (e) { e.preventDefault(); tryMatch(s, e.dataTransfer.getData("k")); });
      s.onclick = function () { if (selected) tryMatch(s, selected.dataset.k); };
      targets.appendChild(s);
    });
    host.appendChild(pool); host.appendChild(targets); host.appendChild(msg);
    f.appendChild(host); return f;
  };

  /* 結果代碼：把作答結果編成一串可貼給老師的代碼（FSQ1.<base64>.<檢查碼>）。
     解碼與彙整用專案根目錄的「食品科學概論_測驗成績解碼器.html」。 */
  function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
  function checksum(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1679616; // 36^4
    return h.toString(36);
  }

  BLOCKS.quiz = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var items = b.items, n = items.length;
    var head = el("div", "quiz-head");
    head.innerHTML =
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
      '<input class="qid" placeholder="' + U("學號（交成績必填）", "Mã số SV") + '" style="flex:1;min-width:130px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px">' +
      '<input class="qname" placeholder="' + U("姓名", "Họ tên") + '" style="flex:1;min-width:100px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px"></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
      '<strong class="qprog">' + U("進度", "Tiến độ") + ' 0 / ' + n + '</strong>' +
      '<span class="qscore" style="color:var(--secondary);font-weight:800">' + U("得分", "Điểm") + ' 0</span></div>' +
      '<div class="pbar"><div class="pfill"></div></div>';
    var box = el("div");
    var sb = el("div", "scorebox");
    sb.innerHTML = '<div>' + U("你的成績", "Điểm của bạn") + '</div><div class="big"><span class="fscore">0</span> / ' + n + '</div>' +
      '<div class="smsg" style="margin:8px 0 16px"></div>' +
      '<div class="rcwrap" style="margin:0 auto 16px;max-width:560px;text-align:left">' +
      '<div style="font-weight:700;margin-bottom:6px">' + U("結果代碼（請複製後，貼到老師指定的表單或訊息）", "— Mã kết quả: sao chép và gửi cho thầy/cô") + '</div>' +
      '<textarea class="rcode" readonly rows="3" style="width:100%;box-sizing:border-box;font-family:monospace;font-size:12px;padding:8px;border:1.5px solid var(--line,#ccc);border-radius:8px;resize:none"></textarea>' +
      '<div class="rmsg" style="font-size:13px;color:#B34700;margin-top:4px"></div>' +
      '<button class="btn copyrc" style="margin-top:8px">📋 ' + U("複製結果代碼", "Sao chép mã") + '</button></div>' +
      '<button class="btn ghost">' + U("重新測驗", "Làm lại") + '</button>';

    var answered = 0, score = 0, picks = [], qt0 = null, attempt = 0;
    var mod = CTX.mod, bi = CTX.bi;
    // 測驗的學號欄與頁首的學號代碼同步（兩邊填任一邊都行）
    var qidInput = head.querySelector(".qid");
    if (TRACK.on) {
      if (TRACK.code()) qidInput.value = TRACK.code();
      qidInput.addEventListener("change", function () {
        TRACK.setCode(qidInput.value);
        var top = $("#ifs-code"); if (top) top.value = TRACK.code();
      });
    }
    function updateProg() {
      head.querySelector(".qprog").textContent = U("進度", "Tiến độ") + " " + answered + " / " + n;
      head.querySelector(".qscore").textContent = U("得分", "Điểm") + " " + score;
      head.querySelector(".pfill").style.width = (answered / n * 100) + "%";
    }
    function finish() {
      sb.querySelector(".fscore").textContent = score;
      var pct = score / n, m;
      if (score === n) m = U("本次全對！請再用自己的話說明熟飯的處理、微生物與證據。", "Đúng hết lần này! Hãy giải thích tình huống bằng lời của mình.");
      else if (pct >= 0.8) m = U("很棒！觀念相當扎實。", "Rất tốt!");
      else if (pct >= 0.6) m = U("不錯，再複習幾個弱點就更好。", "Khá tốt, ôn lại vài chỗ nữa nhé.");
      else m = U("建議回到前面單元再看一次翻卡與展開內容。", "Hãy xem lại các phần phía trước.");
      sb.querySelector(".smsg").textContent = m;

      var sid = head.querySelector(".qid").value.trim();
      var sname = head.querySelector(".qname").value.trim();
      var korr = items.map(function (item, i) { return picks[i] === item.a ? 1 : 0; }).join("");
      var payload = JSON.stringify({
        w: D.week || 0, c: A2 ? "a2" : undefined, id: sid, nm: sname, s: score, n: n,
        a: picks, k: korr, t: new Date().toISOString().slice(0, 16),
      });
      var body = b64utf8(payload);
      var code = "FSQ1." + body + "." + checksum(body);
      sb.querySelector(".rcode").value = code;
      sb.querySelector(".rmsg").textContent = sid ? "" : U("⚠ 尚未填學號 —— 請回到測驗上方填入學號後重新測驗，否則老師無法登記成績。", "Chưa nhập mã số SV: hãy nhập ở trên rồi làm lại.");
      TRACK.send("quiz_done", mod, "quiz", { b: bi, attempt: attempt, score: score, n: n, picks: picks, ms: qt0 ? Date.now() - qt0 : null });
      TRACK.flush();

      sb.classList.add("show");
      sb.scrollIntoView({ behavior: "smooth" });
    }
    function pick(qel, item, oi) {
      if (qel.dataset.done === "1") return;
      qel.dataset.done = "1"; answered++;
      if (qt0 === null) qt0 = Date.now();
      picks[parseInt(qel.dataset.qi, 10)] = oi;
      TRACK.send("quiz_answer", mod, "quiz", { b: bi, attempt: attempt, qi: parseInt(qel.dataset.qi, 10), pick: oi, ok: oi === item.a });
      qel.querySelectorAll(".opt").forEach(function (btn, i) {
        btn.classList.add("dim");
        if (i === item.a) btn.classList.add("correct");
        if (i === oi && oi !== item.a) btn.classList.add("wrong");
      });
      var fb = qel.querySelector(".fb");
      if (oi === item.a) { score++; fb.classList.add("good"); fb.innerHTML = U("✓ 正確！", "Đúng!") + item.e; }
      else { fb.classList.add("no"); fb.innerHTML = U("✗ 正解：", "Sai. Đáp án:") + item.o[item.a] + "。" + item.e; }
      fb.classList.add("show"); updateProg();
      if (answered === n) finish();
    }
    function build() {
      box.innerHTML = ""; answered = 0; score = 0; picks = []; qt0 = null; attempt++; updateProg();
      sb.classList.remove("show");
      items.forEach(function (item, qi) {
        var qel = el("div", "q"); qel.dataset.done = "0"; qel.dataset.qi = qi;
        qel.innerHTML = '<div class="qn">第 ' + (qi + 1) + ' 題' + (A2 ? ' · Câu ' + (qi + 1) : '') + '</div><div class="qt">' + item.q + '</div>';
        item.o.forEach(function (opt, oi) {
          var btn = el("button", "opt"); btn.textContent = opt;
          btn.onclick = function () { pick(qel, item, oi); };
          qel.appendChild(btn);
        });
        qel.appendChild(el("div", "fb"));
        box.appendChild(qel);
      });
    }
    sb.querySelector(".copyrc").onclick = function () {
      var ta = sb.querySelector(".rcode");
      ta.select(); ta.setSelectionRange(0, 99999);
      var btn = this;
      function ok() { btn.textContent = U("✓ 已複製，請貼給老師", "Đã sao chép"); setTimeout(function () { btn.textContent = "📋 " + U("複製結果代碼", "Sao chép mã"); }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(ta.value).then(ok, function () { document.execCommand("copy"); ok(); });
      else { document.execCommand("copy"); ok(); }
    };
    sb.querySelector(".ghost").onclick = function () {
      build(); window.scrollTo({ top: 0, behavior: "smooth" });
    };
    build();
    f.appendChild(head); f.appendChild(box); f.appendChild(sb);
    return f;
  };

  /* ---------- 組裝 ---------- */
  var nav = $("#nav"), main = $("#main");
  var curMod = D.modules.length ? D.modules[0].id : null, modT0 = Date.now();
  function switchMod(id, btn) {
    document.querySelectorAll(".module").forEach(function (m) { m.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
    nav.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
    btn.classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (id !== curMod) {
      TRACK.send("module_view", id, null, { from: curMod, ms: Date.now() - modT0 });
      curMod = id; modT0 = Date.now();
    }
  }
  D.modules.forEach(function (m, i) {
    var btn = el("button", i === 0 ? "active" : "", m.nav);
    btn.onclick = function () { switchMod(m.id, btn); };
    nav.appendChild(btn);

    var sec = el("section", "module" + (i === 0 ? " active" : ""));
    sec.id = m.id;
    sec.appendChild(el("div", "lead",
      '<div class="kicker">' + m.kicker + '</div><h2>' + m.h2 + '</h2><p>' + m.lead + '</p>'));
    m.blocks.forEach(function (b, bi) {
      var render = BLOCKS[b.type];
      if (!render) { console.error("未知區塊型別:", b.type); return; }
      CTX.mod = m.id; CTX.bi = bi;
      sec.appendChild(render(b));
    });
    main.appendChild(sec);
  });

  /* ---------- 學號代碼列（只在啟用記錄的週出現） ---------- */
  if (TRACK.on) {
    var bar = el("div", "codebar");
    bar.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;font-size:14px";
    bar.innerHTML = '<label for="ifs-code" style="font-weight:700">' + U("學號代碼", "Mã số SV") + '</label>' +
      '<input id="ifs-code" maxlength="20" placeholder="' + U("例：S001", "VD: S001") + '" style="width:120px;padding:6px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:14px">' +
      '<span style="opacity:.75">' + U("只記錄你的學習歷程（翻卡、配對、測驗），不需要姓名。", "Chỉ ghi lại quá trình học (lật thẻ, ghép cặp, kiểm tra), không cần tên.") + '</span>';
    nav.parentNode.insertBefore(bar, nav);
    var inp = bar.querySelector("#ifs-code");
    inp.value = TRACK.code();
    inp.addEventListener("change", function () {
      TRACK.setCode(inp.value);
      document.querySelectorAll(".qid").forEach(function (x) { x.value = TRACK.code(); });
      TRACK.send("code_set", null, null, {});
    });
    TRACK.send("session_start", curMod, null, {
      device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || "") ? "mobile" : "desktop",
      w: window.innerWidth, build: D.build || null,
    });
    // 停留時間以「頁面可見」為準：切到背景就結算一段 module_leave，回來重新計時。
    // 手機瀏覽器殺分頁常不觸發 pagehide，所以以 visibilitychange→hidden 為主。
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        TRACK.send("module_leave", curMod, null, { ms: Date.now() - modT0 }); TRACK.flush();
      } else {
        modT0 = Date.now();
      }
    });
  }
})();
</script>
