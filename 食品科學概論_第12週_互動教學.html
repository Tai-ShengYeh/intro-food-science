<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品科學概論 第12週 · 互動教學</title>
<style>
  :root{
    --primary:#2D2A6E; --secondary:#5B4FB8; --accent:#00B8B8; --warm:#F5A623; --green:#2FA36B; --red:#D65B5B; --dark:#1A1A3E; --bg:#F4F5FA; --text:#1F1F2E; --mid:#5A5A75; --muted:#9096ac; --border:#E2E2EC; --card:#fff;
  }
/* 版型樣式 — 逐條取自「第1週_互動教學.html」，末段為新增區塊（cmp / tbl / note）。
   這裡只用 var(--x)；色票由 tokens.js 產生 :root 注入。 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:17px}
header{background:linear-gradient(120deg,var(--dark),var(--primary));color:#fff;
  padding:26px 22px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(0,0,0,.15)}
header h1{font-size:31px;font-weight:800;letter-spacing:.5px}
header .sub{color:#b9c7ff;font-size:16px;margin-top:5px}
nav{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.10);color:#dfe4ff;border:none;padding:12px 18px;
  border-radius:10px 10px 0 0;font-size:16.5px;cursor:pointer;font-weight:600;transition:.15s}
nav button:hover{background:rgba(255,255,255,.2)}
nav button.active{background:var(--bg);color:var(--primary)}
main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
.module{display:none;animation:fade .35s}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead{background:var(--dark);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:22px}
.lead .kicker{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px}
.lead h2{font-size:26px;margin:6px 0 8px}
.lead p{color:#cdd3ee;font-size:16.5px}
.sec-title{font-size:23px;font-weight:800;color:var(--primary);margin:30px 0 6px;
  display:flex;align-items:center;gap:10px}
.sec-title .bar{width:6px;height:25px;background:var(--accent);border-radius:3px;display:inline-block}
.hint{color:var(--mid);font-size:15px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* flip cards */
.flip{perspective:1100px;height:200px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px rgba(30,30,60,.08);border:1px solid var(--border)}
.front{background:var(--card)}
.front .t{font-size:21px;font-weight:800;color:var(--primary)}
.front .en{color:var(--muted);font-size:14px;margin-top:3px;font-style:italic}
.front .tap{margin-top:auto;color:var(--accent);font-size:14px;font-weight:700}
.back{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;transform:rotateY(180deg);overflow:auto}
.back p{font-size:16px}
.cbar{height:6px;border-radius:14px 14px 0 0;position:absolute;top:0;left:0;right:0}

/* expandable */
.exp{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.exp>button{width:100%;text-align:left;background:none;border:none;padding:16px 18px;cursor:pointer;
  display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;color:var(--text)}
.exp .num{background:var(--primary);color:#fff;min-width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.exp .chev{margin-left:auto;color:var(--muted);transition:.25s;font-size:20px}
.exp.on .chev{transform:rotate(90deg);color:var(--accent)}
.exp .body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 18px}
.exp.on .body{padding:0 18px 16px 62px}
.exp .body ul{margin-left:16px;color:var(--mid);font-size:16px}
.exp .body p{color:var(--mid);font-size:15.5px}
.exp .tag{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:8px}

/* info card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.card .h{font-weight:800;color:var(--primary);font-size:18px;margin-bottom:6px}
.card .en{color:var(--muted);font-size:13px;font-style:italic}
.card ul{margin:8px 0 0 18px;font-size:15.5px;color:var(--mid)}

/* timeline */
.tl{display:flex;gap:0;flex-wrap:wrap;counter-reset:s}
.tl .step{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 14px 14px;margin:8px;position:relative}
.tl .dot{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;margin-bottom:8px}
.tl .step h4{color:var(--primary);font-size:17.5px;margin-bottom:4px}
.tl .step p{font-size:15px;color:var(--mid)}

/* matching */
.match-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.pool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--secondary);color:#fff;padding:10px 17px;border-radius:22px;font-weight:700;
  cursor:grab;user-select:none;font-size:16.5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chip.used{opacity:.35;pointer-events:none}
.chip.sel{outline:3px solid var(--warm);outline-offset:2px}
.targets{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;border:2px dashed var(--border);border-radius:12px;padding:10px 14px;background:#fafbff}
.slot .desc{flex:1;font-size:16px;color:var(--text)}
.slot .drop{min-width:130px;min-height:44px;border-radius:8px;background:#eef0f8;display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:15px;padding:8px 12px}
.slot.ok{border-color:var(--green);background:#effaf3}
.slot.ok .drop{background:var(--green);color:#fff;font-weight:700}
.slot.bad{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* quiz */
.quiz-head{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.pbar{height:12px;background:#e7e9f4;border-radius:8px;overflow:hidden;margin-top:10px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--secondary));transition:width .4s}
.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.q .qn{color:var(--accent);font-weight:800;font-size:14px}
.q .qt{font-size:19.5px;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fafbff;border:2px solid var(--border);
  border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;font-size:16.5px;transition:.15s}
.opt:hover{border-color:var(--secondary)}
.opt.correct{border-color:var(--green);background:#effaf3;font-weight:700}
.opt.wrong{border-color:var(--red);background:#fdeeee}
.opt.dim{opacity:.6}
.fb{margin-top:8px;font-size:15.5px;padding:11px 14px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.good{background:#effaf3;color:#1c7a4d} .fb.no{background:#fdeeee;color:#a83b3b}
.scorebox{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:16px;
  padding:26px;text-align:center;margin-top:10px;display:none}
.scorebox.show{display:block}
.scorebox .big{font-size:46px;font-weight:800}
.btn{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:10px;
  font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.18)}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;background:#eef0fb;color:var(--secondary);padding:3px 10px;border-radius:20px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px}

/* ===== 新增區塊 ===== */
/* compare：兩欄對照（梅納 vs 焦糖化、冷藏 vs 冷凍…） */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media(max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 18px 18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06);position:relative;overflow:hidden}
.cmp .col .cbar{position:static;height:6px;margin:0 -18px 14px;border-radius:0}
.cmp .col h4{font-size:20px;font-weight:800;margin-bottom:2px}
.cmp .col .en{color:var(--muted);font-size:13px;font-style:italic;margin-bottom:8px}
.cmp .col ul{margin-left:18px;font-size:15.5px;color:var(--mid)}
.cmp .col li{margin-bottom:5px}
.cmp-note{margin-top:12px;background:#eef0fb;border-left:5px solid var(--secondary);
  border-radius:0 10px 10px 0;padding:12px 16px;font-size:16px;color:var(--primary);font-weight:600}

/* table：資料表（維生素、添加物分類…） */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px}
.tbl th{background:var(--primary);color:#fff;text-align:left;padding:12px 14px;font-weight:700;font-size:15px}
.tbl td{padding:11px 14px;border-top:1px solid var(--border);color:var(--mid);vertical-align:top}
.tbl tr:nth-child(even) td{background:#fafbff}
.tbl td:first-child{color:var(--text);font-weight:700}

/* note：重點提示條 */
.note{background:#fff8e9;border-left:5px solid var(--warm);border-radius:0 12px 12px 0;
  padding:14px 18px;margin:14px 0;font-size:16px;color:var(--text)}
.note b{color:var(--primary)}
.note.key{background:#effaf3;border-left-color:var(--green)}
.note.warn{background:#fdeeee;border-left-color:var(--red)}
/* 國合班 A2 互動練習：拼音與越南文（build_a2.js 產生的內容才會用到） */
.py{display:block;font-size:.78em;font-weight:500;color:var(--mid);margin-top:2px}
.vn{display:block;font-size:.88em;font-weight:500;color:var(--secondary);margin-top:2px}
/* Shared classroom tasks: oral response, sentence support, then sample explanation. */
.class-activity{display:grid;gap:12px;min-width:0}
.class-activity .vn{display:block;color:#0E7C7B;font-size:15px;line-height:1.5;margin-top:4px}
.activity-time{color:#0E7C7B;font-weight:700;font-size:15px}
.activity-prompt{font-size:clamp(18px,2.3vw,23px);line-height:1.5}
.sentence-stem{padding:12px 16px;background:#EFFAF3;border-left:5px solid #2FA36B;color:#1A1A3E;line-height:1.6}
.class-activity label{font-size:14px;color:#52526B}
.activity-response{display:block;width:100%;max-width:100%;min-height:72px;border:1.5px solid #A0A0B5;border-radius:8px;padding:10px 12px;resize:vertical;font:inherit;font-size:17px;background:#fff;color:#1F1F2E}
.activity-answer{border:1px solid #E2E2EC;background:#fff;border-radius:8px;padding:10px 14px;font-size:16px;line-height:1.5}
.activity-answer summary{cursor:pointer;font-weight:700;color:#2D2A6E}
.activity-answer p{margin-top:10px}
.activity-response:focus-visible,.activity-answer summary:focus-visible{outline:3px solid #0E7C7B;outline-offset:3px}
.source-note{font-size:13px;color:#52526B;line-height:1.5;overflow-wrap:anywhere;margin-top:10px}
.source-note .vn{display:block;color:#0E7C7B;font-size:13px}
.lesson-links{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.lesson-links a{color:inherit;text-underline-offset:3px}
.feedback-reason,.feedback-transfer{margin-top:6px}
.feedback-transfer{font-weight:600}
@media(max-width:640px){header{position:relative!important}.class-activity{gap:10px}}
@media print{.activity-response{min-height:64px}}


.back .vn{color:#D7FAF3}.tbl-wrap{overflow-x:auto}
</style>
</head>

<script>window.__LESSON__={"week":12,"series":["#2D2A6E","#2FA36B","#F5A623","#5B4FB8","#00B8B8","#D65B5B"],"modules":[{"id":"m-chill","nav":"冷藏","kicker":"MODULE 1 · 冷藏","h2":"冷藏的作用與食品差異","lead":"以冷凍生蝦的流通與家庭處理為主線；蔬果冷藏障害是另類比較，不能把同一保存溫度套到所有食品。","blocks":[{"type":"cards","title":"一包冷凍生蝦：沿路查證\u003cspan class=\"vn\" lang=\"vi\">Một gói tôm sống đông: kiểm tra từng bước\u003c/span>","cols":3,"items":[{"h":"① 工廠冷凍\u003cspan class=\"vn\" lang=\"vi\">Cấp đông tại nhà máy\u003c/span>","p":"看食品中心的降溫曲線，不只看隧道設定。\u003cspan class=\"vn\" lang=\"vi\">Xem đường nhiệt tâm thực phẩm, không chỉ cài đặt hầm.\u003c/span>","c":"#2D2A6E"},{"h":"② 運輸與保存\u003cspan class=\"vn\" lang=\"vi\">Vận chuyển, bảo quản\u003c/span>","p":"看品溫、時間、包裝及溫度波動。\u003cspan class=\"vn\" lang=\"vi\">Xem nhiệt sản phẩm, thời gian, bao bì và dao động.\u003c/span>","c":"#2D2A6E"},{"h":"③ 解凍與烹調\u003cspan class=\"vn\" lang=\"vi\">Rã đông và nấu\u003c/span>","p":"依標示解凍，防交叉污染，適當烹調。\u003cspan class=\"vn\" lang=\"vi\">Rã đông theo nhãn, tránh nhiễm chéo và nấu phù hợp.\u003c/span>","c":"#2D2A6E"}]},{"type":"cards","title":"冷藏：減慢，不是保證停止\u003cspan class=\"vn\" lang=\"vi\">Giữ lạnh: làm chậm, không bảo đảm dừng\u003c/span>","cols":3,"items":[{"h":"微生物\u003cspan class=\"vn\" lang=\"vi\">Vi sinh vật\u003c/span>","p":"可抑制許多菌的生長；部分病原仍能在冷藏中生長。\u003cspan class=\"vn\" lang=\"vi\">Hạn chế nhiều vi sinh vật; vài mầm bệnh vẫn phát triển khi lạnh.\u003c/span>","c":"#2D2A6E"},{"h":"食品反應\u003cspan class=\"vn\" lang=\"vi\">Phản ứng thực phẩm\u003c/span>","p":"多種酵素、化學反應與呼吸變慢，但不一定全停止。\u003cspan class=\"vn\" lang=\"vi\">Nhiều phản ứng enzyme, hóa học, hô hấp chậm, không hẳn dừng hết.\u003c/span>","c":"#2D2A6E"},{"h":"時間與衛生\u003cspan class=\"vn\" lang=\"vi\">Thời gian và vệ sinh\u003c/span>","p":"仍要防污染、控制期限；冷藏不是可靠殺菌步驟。\u003cspan class=\"vn\" lang=\"vi\">Vẫn tránh nhiễm, kiểm soát thời hạn; lạnh không thay bước diệt khuẩn.\u003c/span>","c":"#2D2A6E"}]},{"type":"cards","title":"低溫數字：看來源與位置\u003cspan class=\"vn\" lang=\"vi\">Số nhiệt thấp: xem nguồn và vị trí\u003c/span>","cols":3,"items":[{"h":"台灣 TFDA 衛教\u003cspan class=\"vn\" lang=\"vi\">Hướng dẫn TFDA Đài Loan\u003c/span>","p":"冷藏品溫 ≤7°C、凍結點以上；冷凍品溫 ≤−18°C。\u003cspan class=\"vn\" lang=\"vi\">Sản phẩm lạnh ≤7°C, trên điểm đông; sản phẩm đông ≤−18°C.\u003c/span>","c":"#2D2A6E"},{"h":"設備 ≠ 食品中心\u003cspan class=\"vn\" lang=\"vi\">Thiết bị khác tâm thực phẩm\u003c/span>","p":"冷凍櫃顯示 −18°C，不代表剛放入的蝦已達標。\u003cspan class=\"vn\" lang=\"vi\">Tủ hiển thị −18°C không có nghĩa tâm tôm mới đặt vào đã đạt.\u003c/span>","c":"#2D2A6E"},{"h":"仍要依食品與標示\u003cspan class=\"vn\" lang=\"vi\">Còn tùy thực phẩm và nhãn\u003c/span>","p":"不同食品可有更嚴格或不同的合適條件；不能全套同一溫度。\u003cspan class=\"vn\" lang=\"vi\">Từng thực phẩm có thể cần mức chặt hơn hay khác; không áp một nhiệt cho tất cả.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"本頁數字引用 TFDA 2024 衛教的品溫；運輸設備環境溫度等另有規定，不能混為同一量測。\u003cspan class=\"vn\" lang=\"vi\">Số ở đây là nhiệt sản phẩm trong hướng dẫn TFDA 2024; nhiệt môi trường thiết bị vận chuyển có quy định riêng, không trộn hai phép đo.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/tc/PublishOtherEpaperContent.aspx?id=1530&r=224566166&tid=4916\" target=\"_blank\" rel=\"noopener\">品溫與保存 / Nhiệt sản phẩm: TFDA 2024 ↗\u003c/a>\u003c/p>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/TC/newsContent.aspx?cid=4&id=31086\" target=\"_blank\" rel=\"noopener\">2025 GHP 修正：運輸環境另有規定 / GHP 2025: môi trường vận chuyển ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"冷藏障害：還沒結冰也會受傷\u003cspan class=\"vn\" lang=\"vi\">Tổn thương lạnh: có thể chưa đóng băng\u003c/span>","cols":3,"items":[{"h":"香蕉\u003cspan class=\"vn\" lang=\"vi\">Chuối\u003c/span>","p":"部分香蕉在太低但未結冰的條件，可能褐變、難正常後熟。\u003cspan class=\"vn\" lang=\"vi\">Vài loại chuối quá lạnh nhưng chưa đông có thể nâu, khó chín bình thường.\u003c/span>","c":"#2D2A6E"},{"h":"小黃瓜\u003cspan class=\"vn\" lang=\"vi\">Dưa chuột\u003c/span>","p":"對低溫敏感；可能凹陷、水浸狀，之後更容易腐敗。\u003cspan class=\"vn\" lang=\"vi\">Nhạy lạnh; có thể lõm, úng nước, sau đó dễ hỏng hơn.\u003c/span>","c":"#2D2A6E"},{"h":"番茄\u003cspan class=\"vn\" lang=\"vi\">Cà chua\u003c/span>","p":"成熟度會影響合適保存條件；不能只背同一門檻。\u003cspan class=\"vn\" lang=\"vi\">Độ chín ảnh hưởng điều kiện phù hợp; không học một ngưỡng chung.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"冷藏障害與冰晶造成的凍傷不同；發生條件依品種、成熟度、時間與溫度改變。\u003cspan class=\"vn\" lang=\"vi\">Tổn thương lạnh khác hại do tinh thể đá; tùy giống, độ chín, thời gian và nhiệt.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://postharvest.ucdavis.edu/produce-facts-sheets/banana\" target=\"_blank\" rel=\"noopener\">香蕉品種與時間溫度 / Chuối: UC Davis ↗\u003c/a>\u003c/p>\u003cp class=\"source-note\">\u003ca href=\"https://postharvest.ucdavis.edu/produce-facts-sheets/cucumber\" target=\"_blank\" rel=\"noopener\">小黃瓜 / Dưa chuột: UC Davis ↗\u003c/a>\u003c/p>\u003cp class=\"source-note\">\u003ca href=\"https://postharvest.ucdavis.edu/produce-facts-sheets/tomato\" target=\"_blank\" rel=\"noopener\">番茄成熟度 / Độ chín cà chua: UC Davis ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 1｜還沒結冰，為何受傷？\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 1: Chưa đóng băng, sao bị hại?\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"chilling\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">老師提供紀錄：一批對低溫敏感的香蕉，在凍結點以上的低溫放久後，表皮褐變、後熟異常。能直接說是大冰晶刺破嗎？\u003cspan class=\"vn\" lang=\"vi\">Ghi chép: chuối nhạy lạnh để lâu ở nhiệt thấp nhưng trên điểm đông, vỏ nâu, chín bất thường. Có thể nói ngay do đá lớn làm rách không?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>還沒＿＿，可能是＿＿；還要確認＿＿。\u003cspan class=\"vn\" lang=\"vi\">Chưa ___, có thể là ___; còn cần xác nhận ___.\u003c/span>\u003c/div>\u003clabel for=\"general-w12-chilling\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w12-chilling\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>沒有結冰的證據，可能是冷藏障害；查品種、成熟度、時間與溫度。\u003cspan class=\"vn\" lang=\"vi\">Chưa có bằng chứng đóng băng; có thể tổn thương lạnh; xem giống, độ chín, thời gian và nhiệt.\u003c/span>\u003c/p>\u003cp>冷藏障害不同於結冰損傷；蔬果的條件也不能直接套到生蝦。\u003cspan class=\"vn\" lang=\"vi\">Tổn thương lạnh khác hại do đông; không áp điều kiện rau quả cho tôm sống.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"蔬果採收後，仍有變化\u003cspan class=\"vn\" lang=\"vi\">Rau quả sau thu hoạch vẫn biến đổi\u003c/span>","cols":3,"items":[{"h":"呼吸\u003cspan class=\"vn\" lang=\"vi\">Hô hấp\u003c/span>","p":"組織仍消耗養分；溫度與氣體會影響速率。\u003cspan class=\"vn\" lang=\"vi\">Mô vẫn dùng chất dự trữ; nhiệt và khí ảnh hưởng tốc độ.\u003c/span>","c":"#2D2A6E"},{"h":"後熟型例子\u003cspan class=\"vn\" lang=\"vi\">Ví dụ quả tiếp tục chín\u003c/span>","p":"香蕉、芒果等常有呼吸及乙烯高峰；還要看採收成熟度。\u003cspan class=\"vn\" lang=\"vi\">Chuối, xoài thường có đỉnh hô hấp, ethylene; còn tùy độ trưởng thành khi hái.\u003c/span>","c":"#2D2A6E"},{"h":"非後熟型例子\u003cspan class=\"vn\" lang=\"vi\">Ví dụ không có kiểu đỉnh đó\u003c/span>","p":"草莓等不以相同方式後熟，但仍會呼吸、失水與劣變。\u003cspan class=\"vn\" lang=\"vi\">Dâu tây không chín theo cùng kiểu, nhưng vẫn hô hấp, mất nước, hư hỏng.\u003c/span>","c":"#2D2A6E"}]},{"type":"exp","title":"延伸：蔬果對低溫與乙烯的反應","items":[{"h":"冷藏障害不是凍結傷害","body":["部分熱帶、亞熱帶蔬果在凍結點以上仍可能產生生理傷害；門檻與症狀受品種、成熟度、時間及溫度影響。","UC Davis 對綠熟 Cavendish 香蕉的商業儲運建議為 13–14°C；不能當作所有香蕉成熟階段或所有水果的通用冷藏條件。"]},{"h":"後熟與氣體管理","body":["後熟型果實常有呼吸躍升及乙烯變化；是否正常後熟仍受採收成熟度與品種影響。","非後熟型不等於採收後完全不變或完全不產乙烯；兩類皆有呼吸與劣變。乙烯敏感度與相容儲藏須依品項確認。"]}]}]},{"id":"m-freeze","nav":"冷凍","kicker":"MODULE 2 · 冷凍","h2":"從中心曲線讀速率與品質","lead":"食品組成影響凍結起點和可凍水比例；中心曲線與介質設定不同。快凍常有品質優勢，但不是所有食品共用一個分鐘門檻。","blocks":[{"type":"cards","title":"冷凍曲線：示意不是通用秒表\u003cspan class=\"vn\" lang=\"vi\">Đường đông: sơ đồ, không là đồng hồ chung\u003c/span>","cols":3,"items":[{"h":"降到開始結冰\u003cspan class=\"vn\" lang=\"vi\">Hạ đến bắt đầu đông\u003c/span>","p":"食品的凍結起點受成分影響，不一定是 0°C。\u003cspan class=\"vn\" lang=\"vi\">Điểm bắt đầu đông tùy thành phần, không nhất thiết 0°C.\u003c/span>","c":"#2D2A6E"},{"h":"主要冰晶形成區\u003cspan class=\"vn\" lang=\"vi\">Vùng tạo nhiều tinh thể\u003c/span>","p":"許多食品約 −1～−5°C；實際範圍依食品而變。\u003cspan class=\"vn\" lang=\"vi\">Nhiều thực phẩm khoảng −1 đến −5°C; phạm vi thật tùy loại.\u003c/span>","c":"#2D2A6E"},{"h":"繼續降溫\u003cspan class=\"vn\" lang=\"vi\">Tiếp tục hạ nhiệt\u003c/span>","p":"達預定中心溫度後仍須適當保存；−18°C 不等於水全結冰。\u003cspan class=\"vn\" lang=\"vi\">Đạt nhiệt tâm dự kiến vẫn cần giữ phù hợp; −18°C không nghĩa mọi nước đã đông.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"比較速率需指定食品、尺寸、量測位置和溫度區間；沒有所有食品通用的「30 分鐘快凍」界線。\u003cspan class=\"vn\" lang=\"vi\">So tốc độ cần chỉ rõ thực phẩm, kích thước, vị trí đo và vùng nhiệt; không có ranh giới nhanh 30 phút cho mọi thực phẩm.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/v3630e/v3630e03.htm\" target=\"_blank\" rel=\"noopener\">凍結速率與定義 / Tốc độ và định nghĩa: FAO ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"快凍與冰晶：比較要有條件\u003cspan class=\"vn\" lang=\"vi\">Đông nhanh và tinh thể: so có điều kiện\u003c/span>","cols":3,"items":[{"h":"其他條件相近時\u003cspan class=\"vn\" lang=\"vi\">Khi điều kiện khác tương đương\u003c/span>","p":"較快通過主要結冰區，通常形成較小冰晶。\u003cspan class=\"vn\" lang=\"vi\">Qua vùng đông chính nhanh hơn thường tạo tinh thể nhỏ hơn.\u003c/span>","c":"#2D2A6E"},{"h":"可能減少組織損傷\u003cspan class=\"vn\" lang=\"vi\">Có thể giảm hại mô\u003c/span>","p":"解凍滴液、質地也受原料、貯存及解凍影響。\u003cspan class=\"vn\" lang=\"vi\">Dịch rỉ, kết cấu còn tùy nguyên liệu, lưu trữ, rã đông.\u003c/span>","c":"#2D2A6E"},{"h":"不等於已殺菌\u003cspan class=\"vn\" lang=\"vi\">Không bằng đã diệt khuẩn\u003c/span>","p":"更小冰晶或更快凍結，不能單獨證明食品安全。\u003cspan class=\"vn\" lang=\"vi\">Đá nhỏ hơn hay đông nhanh hơn không tự chứng minh an toàn.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"圖畫是概念示意，不是所有細胞都完整或破裂的保證；冷凍與後續低溫管理要一起看。\u003cspan class=\"vn\" lang=\"vi\">Hình là khái niệm, không bảo đảm mọi tế bào nguyên hay vỡ; cần xét đông và quản lý lạnh sau đó.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/y5979e/y5979e03.htm\" target=\"_blank\" rel=\"noopener\">凍結與品質 / Đông và chất lượng: FAO ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 2｜比較兩條冷凍紀錄\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 2: So hai hồ sơ đông\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"rate\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">假設同批、同尺寸生蝦，同位置量測：A 通過指定主要結冰區需 20 分鐘，B 需 80 分鐘，最後中心都達 −18°C。可推測什麼？\u003cspan class=\"vn\" lang=\"vi\">Giả định tôm cùng lô, cỡ, vị trí đo: A qua vùng đông chính xác định trong 20 phút, B 80 phút, cuối cùng tâm đều −18°C. Có thể suy gì?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>在其他條件相近時，＿＿較快，冰晶通常＿＿；不能保證＿＿。\u003cspan class=\"vn\" lang=\"vi\">Nếu điều kiện khác gần nhau, ___ nhanh hơn, tinh thể thường ___; không bảo đảm ___.\u003c/span>\u003c/div>\u003clabel for=\"general-w12-rate\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w12-rate\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>A 較快，通常有較小冰晶的趨勢；不能只由此證明無菌、營養全保留或最後口感一定較好。\u003cspan class=\"vn\" lang=\"vi\">A nhanh hơn, thường có xu hướng đá nhỏ hơn; chưa chứng minh vô trùng, giữ mọi chất hay kết cấu cuối luôn tốt hơn.\u003c/span>\u003c/p>\u003cp>20 與 80 分鐘是本題假設，並非「小於 30 分鐘一律快凍」的定義。\u003cspan class=\"vn\" lang=\"vi\">20 và 80 phút là giả định, không là định nghĩa dưới 30 phút luôn cấp đông nhanh.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"冷凍方式與 IQF\u003cspan class=\"vn\" lang=\"vi\">Cách cấp đông và IQF\u003c/span>","cols":3,"items":[{"h":"冷風、接觸式\u003cspan class=\"vn\" lang=\"vi\">Gió lạnh, tiếp xúc\u003c/span>","p":"以冷空氣或冷板移熱；適合度看形狀、包裝與產量。\u003cspan class=\"vn\" lang=\"vi\">Lấy nhiệt bằng khí lạnh, tấm lạnh; phù hợp tùy hình, bao bì, sản lượng.\u003c/span>","c":"#2D2A6E"},{"h":"低溫液體或氣體\u003cspan class=\"vn\" lang=\"vi\">Chất lỏng hay khí rất lạnh\u003c/span>","p":"可用液態氮等；介質很冷，不代表食品中心立即同溫。\u003cspan class=\"vn\" lang=\"vi\">Có thể dùng nitơ lỏng; môi chất rất lạnh không nghĩa tâm đạt ngay cùng nhiệt.\u003c/span>","c":"#2D2A6E"},{"h":"IQF：個別快速冷凍\u003cspan class=\"vn\" lang=\"vi\">IQF: cấp đông nhanh từng cá thể\u003c/span>","p":"重點是顆粒分開凍結；不只是一種冷風機器的名字。\u003cspan class=\"vn\" lang=\"vi\">Điểm chính là từng cá thể đông rời; không chỉ tên một máy gió lạnh.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"實際凍結時間受尺寸、裝量、傳熱與設備影響；不能只看介質溫度排名。\u003cspan class=\"vn\" lang=\"vi\">Thời gian thực tùy kích thước, lượng, truyền nhiệt, thiết bị; không xếp hạng chỉ từ nhiệt môi chất.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/y5979e/y5979e03.htm\" target=\"_blank\" rel=\"noopener\">冷凍方法 / Phương pháp đông: FAO ↗\u003c/a>\u003c/p>"},{"type":"exp","title":"延伸：冰晶、傳熱與設備","items":[{"h":"成核與成長","body":["冷凍曲線可能出現過冷與潛熱釋出；形成冰晶後，未凍相濃縮，凍結點會持續改變。示意圖不是所有產品的實測曲線。","冰晶分布與組織損傷也受原料結構、成核、冷凍方式、貯存與解凍影響；不可由快慢單獨保證細胞完整。"]},{"h":"速率比較需指定量測方法","body":["說明食品尺寸、初溫、量測位置、比較溫區及裝量。介質越冷不代表所有產品中心一定以同一速率降溫。","IQF 指個別快速凍結，可使用流體化冷風等不同技術；不是所有急凍產品都必然維持顆粒分離。"]}]},{"type":"match","title":"判讀冷凍紀錄：配對概念","pairs":[{"label":"設備設定溫度","desc":"介質或設備的條件，不能直接代替中心溫度"},{"label":"食品中心溫度","desc":"需用合適方法量測；與時間共同判讀"},{"label":"IQF","desc":"個別快速凍結，重點為顆粒分開"},{"label":"冷藏障害","desc":"凍結點以上仍可能發生的生理傷害"}],"done":"✓ 配對完成！請再用一個食品例子說明。"}]},{"id":"m-damage","nav":"冷凍的品質問題","kicker":"MODULE 3 · 品質","h2":"品質變化、解凍與再冷凍","lead":"凍住後仍有品質反應；安全判斷需時間溫度與污染紀錄。再冷凍是否合適，要分開看安全前提與品質損失。","blocks":[{"type":"cards","title":"冷凍中的品質變化\u003cspan class=\"vn\" lang=\"vi\">Biến đổi chất lượng khi đông\u003c/span>","cols":3,"items":[{"h":"凍結濃縮\u003cspan class=\"vn\" lang=\"vi\">Cô đặc do đông\u003c/span>","p":"水結冰後，未凍相的溶質濃度增加，可能影響反應與蛋白質。\u003cspan class=\"vn\" lang=\"vi\">Nước đóng băng làm chất tan ở pha chưa đông đậm hơn, ảnh hưởng phản ứng, protein.\u003c/span>","c":"#2D2A6E"},{"h":"冷凍乾燒\u003cspan class=\"vn\" lang=\"vi\">Cháy lạnh\u003c/span>","p":"表面失水，變乾、變色；包裝與空氣接觸很重要。\u003cspan class=\"vn\" lang=\"vi\">Bề mặt mất nước, khô, đổi màu; bao bì và tiếp xúc không khí quan trọng.\u003c/span>","c":"#2D2A6E"},{"h":"再結晶\u003cspan class=\"vn\" lang=\"vi\">Tái kết tinh\u003c/span>","p":"冰晶可隨貯存變大；溫度波動常加速此變化。\u003cspan class=\"vn\" lang=\"vi\">Tinh thể có thể lớn dần khi lưu trữ; dao động nhiệt thường làm nhanh hơn.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"冷凍乾燒主要是品質問題，不能單靠它判定安全；控制適當低溫、穩定度、時間與包裝。\u003cspan class=\"vn\" lang=\"vi\">Cháy lạnh chủ yếu là chất lượng, không tự xác định an toàn; kiểm soát mức nhiệt thấp phù hợp, ổn định, thời gian, bao bì.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/freezing-and-food-safety\" target=\"_blank\" rel=\"noopener\">品質與安全 / Chất lượng và an toàn: USDA FSIS ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"再冷凍：先查時間與溫度\u003cspan class=\"vn\" lang=\"vi\">Tái đông: kiểm tra thời gian, nhiệt trước\u003c/span>","cols":3,"items":[{"h":"合適冷藏解凍\u003cspan class=\"vn\" lang=\"vi\">Rã đông lạnh phù hợp\u003c/span>","p":"USDA 指出：在合適冷藏中解凍，可再凍，但品質可能下降。\u003cspan class=\"vn\" lang=\"vi\">USDA: rã đông trong điều kiện lạnh phù hợp có thể tái đông, nhưng giảm chất lượng.\u003c/span>","c":"#2D2A6E"},{"h":"曾長時間失溫\u003cspan class=\"vn\" lang=\"vi\">Đã quá ấm lâu\u003c/span>","p":"不能靠再冷凍把先前風險清除；生蝦久放室溫不保留。\u003cspan class=\"vn\" lang=\"vi\">Tái đông không xóa nguy cơ trước đó; không giữ tôm sống để phòng lâu.\u003c/span>","c":"#2D2A6E"},{"h":"先分裝、看標示\u003cspan class=\"vn\" lang=\"vi\">Chia phần, xem nhãn trước\u003c/span>","p":"減少不必要反覆解凍；確認期限、衛生與後續烹調。\u003cspan class=\"vn\" lang=\"vi\">Giảm rã đông lặp không cần; xác nhận hạn, vệ sinh, nấu tiếp.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"USDA 家庭指南以 ≤40°F（約 4.4°C）冷藏為條件；不可把台灣 ≤7°C 數字直接代入此指引。另須符合產品標示與保存時間。\u003cspan class=\"vn\" lang=\"vi\">Hướng dẫn gia đình USDA dùng lạnh ≤40°F (khoảng 4,4°C); không thay bằng mức ≤7°C Đài Loan. Còn cần theo nhãn và thời gian bảo quản.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/freezing-and-food-safety\" target=\"_blank\" rel=\"noopener\">再冷凍的條件 / Điều kiện tái đông: USDA FSIS ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"生蝦解凍：依產品說明操作\u003cspan class=\"vn\" lang=\"vi\">Rã đông tôm sống: theo hướng dẫn sản phẩm\u003c/span>","cols":3,"items":[{"h":"冷藏解凍\u003cspan class=\"vn\" lang=\"vi\">Rã đông trong tủ lạnh\u003c/span>","p":"USDA：≤40°F（約 4.4°C）；加托盤防滴液污染，預留時間。\u003cspan class=\"vn\" lang=\"vi\">USDA: ≤40°F (khoảng 4,4°C); đặt khay tránh dịch rỉ nhiễm, dành đủ thời gian.\u003c/span>","c":"#2D2A6E"},{"h":"冷水解凍\u003cspan class=\"vn\" lang=\"vi\">Rã đông nước lạnh\u003c/span>","p":"USDA：防漏袋浸冷水，每 30 分鐘換水；解凍後立即烹調。\u003cspan class=\"vn\" lang=\"vi\">USDA: túi chống rò ngâm nước lạnh, thay mỗi 30 phút; nấu ngay sau rã đông.\u003c/span>","c":"#2D2A6E"},{"h":"微波或直接烹調\u003cspan class=\"vn\" lang=\"vi\">Vi sóng hay nấu từ đông\u003c/span>","p":"微波解凍後立即煮；若依標示直接煮凍品，仍需確認熟透。\u003cspan class=\"vn\" lang=\"vi\">Rã đông vi sóng rồi nấu ngay; nếu nhãn cho nấu từ đông, vẫn cần nấu đủ.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"本頁是 USDA 家庭解凍指引摘要；時間依大小與包裝改變。冷水或微波解凍者，先烹調再考慮冷凍，不在桌上久放解凍。\u003cspan class=\"vn\" lang=\"vi\">Tóm tắt hướng dẫn gia đình USDA; thời gian tùy cỡ, bao bì. Sau nước lạnh hay vi sóng, nấu trước khi cân nhắc đông lại; không để lâu trên bàn.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/big-thaw-safe-defrosting-methods\" target=\"_blank\" rel=\"noopener\">解凍方法 / Cách rã đông: USDA FSIS ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 3｜再凍前，先看紀錄\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 3: Xem hồ sơ trước tái đông\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"history\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">生蝦 A 全程在 4°C 冷藏解凍，仍在允許時間內且衛生、標示條件符合；B 在 25°C 桌上放了 6 小時。可以同樣再凍嗎？\u003cspan class=\"vn\" lang=\"vi\">Tôm A rã đông liên tục 4°C, còn trong thời gian cho phép, vệ sinh và nhãn phù hợp; B để bàn 25°C trong 6 giờ. Có tái đông cả hai được không?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>A 在＿＿條件下可考慮＿＿；B 應＿＿，因為＿＿。\u003cspan class=\"vn\" lang=\"vi\">A có thể cân nhắc ___ nếu ___; B cần ___ vì ___.\u003c/span>\u003c/div>\u003clabel for=\"general-w12-history\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w12-history\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>A 可依指引及標示考慮再凍，但品質可能下降；B 應丟棄，不靠再凍或試吃補救。\u003cspan class=\"vn\" lang=\"vi\">A có thể cân nhắc tái đông theo hướng dẫn, nhãn nhưng giảm chất lượng; B bỏ, không cứu bằng tái đông hay nếm.\u003c/span>\u003c/p>\u003cp>USDA 指引以合適冷藏及時間為前提；台灣 TFDA 也提醒易腐食品不要在室溫久放。分清安全條件與品質損失。\u003cspan class=\"vn\" lang=\"vi\">USDA yêu cầu điều kiện lạnh và thời gian phù hợp; TFDA cũng nhắc không để đồ dễ hỏng lâu ở phòng. Tách điều kiện an toàn và mất chất lượng.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"冷鏈：紀錄讓判斷有依據\u003cspan class=\"vn\" lang=\"vi\">Chuỗi lạnh: hồ sơ giúp quyết định\u003c/span>","cols":3,"items":[{"h":"加工 → 倉儲 → 運輸\u003cspan class=\"vn\" lang=\"vi\">Chế biến → kho → vận chuyển\u003c/span>","p":"確認產品與設備的溫度紀錄、時間及包裝。\u003cspan class=\"vn\" lang=\"vi\">Kiểm tra hồ sơ nhiệt sản phẩm, thiết bị, thời gian, bao bì.\u003c/span>","c":"#2D2A6E"},{"h":"販售 → 家庭 → 解凍\u003cspan class=\"vn\" lang=\"vi\">Bán → gia đình → rã đông\u003c/span>","p":"維持適用條件；有失溫時先隔離並評估。\u003cspan class=\"vn\" lang=\"vi\">Giữ điều kiện phù hợp; khi quá ấm, tách riêng để đánh giá.\u003c/span>","c":"#2D2A6E"},{"h":"有冰不等於歷程合格\u003cspan class=\"vn\" lang=\"vi\">Còn đá chưa đủ chứng minh\u003c/span>","p":"要看先前是否失溫；不靠外觀或試吃判安全。\u003cspan class=\"vn\" lang=\"vi\">Cần xem có từng quá ấm; không dùng vẻ ngoài hay nếm để xác định an toàn.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"失溫處置看食品、實測溫度、持續時間與適用要求；不是每次波動都全丟，也不能重新凍硬就當作沒事。\u003cspan class=\"vn\" lang=\"vi\">Xử lý tùy thực phẩm, nhiệt đo, thời gian và yêu cầu áp dụng; không mọi dao động đều phải bỏ hết, cũng không đông cứng lại là xóa vấn đề.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/TC/newsContent.aspx?cid=4&id=31086\" target=\"_blank\" rel=\"noopener\">運輸與紀錄管理 / Vận chuyển và hồ sơ: TFDA 2025 ↗\u003c/a>\u003c/p>"},{"type":"exp","title":"延伸：再結晶與失溫處置","items":[{"h":"穩定不等於永遠不變","body":["再結晶也可能在定溫貯存中進行，溫度波動常加速；儲溫高低、時間及配方都重要。","冰淇淋粗糙可能與冰晶變大有關，也可能涉及其他成分結晶等因素；不能由沙感直接證明曾經失溫。"]},{"h":"品質與食品安全分開","body":["反覆解凍可能增加滴液與質地損失；合適冷藏條件下再凍並非一律不安全。","失溫後須依品項、實測品溫、持續時間、產品標示及適用要求處置；有冰晶不代表之前從未失溫。"]},{"h":"解凍方式與交叉污染","body":["USDA 家庭指南以 ≤40°F（約 4.4°C）作冷藏條件。冷水解凍使用防漏包裝、每 30 分鐘換水；冷水或微波解凍後立即烹調。","使用托盤承接滴液、生熟分開，依產品說明解凍與充分烹調；若有特殊包裝解凍要求，也須依標示操作。"]}]},{"type":"cards","title":"回顧\u003cspan class=\"vn\" lang=\"vi\">Ôn tập\u003c/span>","cols":2,"items":[{"h":"低溫多是抑制，不能取代可靠殺菌\u003cspan class=\"vn\" lang=\"vi\">Lạnh chủ yếu ức chế, không thay diệt khuẩn tin cậy\u003c/span>"},{"h":"凍結速率要說尺寸、位置與溫區\u003cspan class=\"vn\" lang=\"vi\">Tốc độ đông cần cỡ, vị trí đo, vùng nhiệt\u003c/span>"},{"h":"低溫、穩定、包裝與時間共同保品質\u003cspan class=\"vn\" lang=\"vi\">Mức lạnh, ổn định, bao bì, thời gian cùng giữ chất lượng\u003c/span>"},{"h":"解凍與再凍，先查時間溫度歷程\u003cspan class=\"vn\" lang=\"vi\">Rã đông, tái đông: xem lịch sử thời gian nhiệt trước\u003c/span>"}]}]},{"id":"m-quiz","nav":"綜合測驗","kicker":"MODULE 4 · 綜合測驗","h2":"小測驗：檢核學習成效","lead":"與 A2 版共用 10 題核心檢核；依紀錄判斷，讀雙語原因，練習中文回答句。","blocks":[{"type":"quiz","items":[{"q":"冷藏生蝦後，哪個說法合理？\u003cspan class=\"vn\" lang=\"vi\">Sau giữ lạnh tôm sống, câu nào hợp lý?\u003c/span>","o":["所有病原都死了 / Mọi mầm bệnh chết","仍需控制時間、衛生與烹調 / Vẫn kiểm soát thời gian, vệ sinh, nấu","可無限延長期限 / Kéo dài hạn vô hạn","外觀正常就可生吃 / Đẹp thì ăn sống"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 冷藏抑制許多菌，但不是可靠殺菌；部分病原可在冷藏條件生長。\u003cspan class=\"vn\" lang=\"vi\">Lạnh hạn chế nhiều vi sinh vật, không thay diệt khuẩn; vài mầm bệnh phát triển khi lạnh.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：冷藏主要是＿＿，仍需要＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Lạnh chủ yếu ___, vẫn cần ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/freezing-and-food-safety\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"冷凍櫃顯示 −18°C，可以直接推定剛放入的蝦中心也達 −18°C 嗎？\u003cspan class=\"vn\" lang=\"vi\">Tủ hiện −18°C có suy ngay tâm tôm mới đặt cũng −18°C?\u003c/span>","o":["可以，數字一定相同 / Có, chắc cùng số","可以，不需量測 / Có, không cần đo","冷凍櫃設定越低就不用測中心 / Cài tủ càng thấp càng không cần đo tâm","不可以，需時間與食品中心量測 / Không, cần thời gian và đo tâm"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 設備環境與食品中心不是同一溫度；尺寸、裝量與傳熱會影響降溫。\u003cspan class=\"vn\" lang=\"vi\">Môi trường thiết bị khác tâm; cỡ, lượng và truyền nhiệt ảnh hưởng làm lạnh.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：設備溫度是＿＿，食品中心還要＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Nhiệt thiết bị là ___, tâm còn cần ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/y5979e/y5979e03.htm\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"香蕉在凍結點以上低溫久放受傷，可能是？\u003cspan class=\"vn\" lang=\"vi\">Chuối bị hại khi để lạnh trên điểm đông lâu có thể là?\u003c/span>","o":["冷藏障害 / Tổn thương lạnh","一定是大冰晶刺破 / Chắc đá lớn làm rách","所有微生物消失 / Mọi vi sinh vật biến mất","完全沒有反應 / Không còn phản ứng"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 冷藏障害可在未結冰時發生；需看品種、成熟度、溫度與時間。\u003cspan class=\"vn\" lang=\"vi\">Tổn thương lạnh có thể xảy ra chưa đông; tùy giống, độ chín, nhiệt, thời gian.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：冷藏障害和＿＿造成的損傷不同。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tổn thương lạnh khác hại do ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://postharvest.ucdavis.edu/produce-facts-sheets/banana\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"主要冰晶形成區約 −1～−5°C，應如何理解？\u003cspan class=\"vn\" lang=\"vi\">Hiểu vùng tạo nhiều đá khoảng −1 đến −5°C thế nào?\u003c/span>","o":["所有食品固定完全相同 / Mọi thực phẩm giống hệt","到 −5°C 水都結冰 / Đến −5°C mọi nước đông","常見示意範圍，實際依食品而變 / Khoảng minh họa thường gặp, thực tùy loại","只要 30 分鐘就一定快凍 / 30 phút là chắc nhanh"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 食品成分影響凍結起點與結冰比例；比較速率還需指定尺寸、位置與溫區。\u003cspan class=\"vn\" lang=\"vi\">Thành phần ảnh hưởng điểm bắt đầu và tỷ lệ đông; so tốc độ cần cỡ, vị trí, vùng nhiệt.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：這是示意範圍；實際要看＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Đây là khoảng minh họa; thực cần xem ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/y5979e/y5979e03.htm\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"同批同尺寸生蝦，A 過指定結冰區 20 分鐘，B 80 分鐘，可推測？\u003cspan class=\"vn\" lang=\"vi\">Cùng lô cỡ tôm, A qua vùng đông 20 phút, B 80 phút; suy gì?\u003c/span>","o":["A 較快，通常傾向形成較小冰晶 / A nhanh hơn, thường có xu hướng đá nhỏ","A 一定無菌 / A chắc vô trùng","B 一定不能食用 / B chắc không ăn được","A 所有營養都不會損失 / A giữ mọi chất hoàn toàn"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 在其他條件可比時，較快速凍結常有較小冰晶；最終質地與安全仍需其他證據。\u003cspan class=\"vn\" lang=\"vi\">Nếu điều kiện khác so được, đông nhanh thường đá nhỏ hơn; kết cấu cuối, an toàn còn cần bằng chứng.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：A 比 B＿＿，但不能只由此證明＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: A ___ hơn B, nhưng chưa chứng minh ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/v3630e/v3630e03.htm\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"IQF 的重點是？\u003cspan class=\"vn\" lang=\"vi\">Điểm chính của IQF là?\u003c/span>","o":["所有產品都用液態氮 / Mọi sản phẩm dùng nitơ lỏng","食品中心立即等於風溫 / Tâm bằng nhiệt gió ngay","個別顆粒快速凍結，維持分開 / Từng cá thể đông nhanh, giữ rời","保證沒有微生物 / Bảo đảm không vi sinh vật"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> IQF 是個別快速冷凍的概念，可用不同設備，不只是一種機器名稱。\u003cspan class=\"vn\" lang=\"vi\">IQF là cấp đông nhanh từng cá thể, có thể dùng thiết bị khác nhau, không chỉ tên máy.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：IQF 強調＿＿，不是只看＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: IQF nhấn mạnh ___, không chỉ xem ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/y5979e/y5979e03.htm\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"冷凍蝦表面乾白、乾燒，能單靠它判斷安全嗎？\u003cspan class=\"vn\" lang=\"vi\">Tôm đông khô trắng, cháy lạnh có tự xác định an toàn?\u003c/span>","o":["能，乾白一定有毒 / Có, trắng khô chắc độc","能，沒有乾燒就沒病原 / Có, không cháy lạnh thì không mầm bệnh","能，乾燒只在有病原時出現 / Có, cháy lạnh chỉ có khi có mầm bệnh","不能，品質與安全要分開看 / Không, xét riêng chất lượng, an toàn"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 乾燒主要和表面失水有關；也要查時間溫度與污染紀錄，不用試吃判安全。\u003cspan class=\"vn\" lang=\"vi\">Cháy lạnh chủ yếu do bề mặt mất nước; còn xem lịch sử nhiệt, nhiễm, không nếm để kiểm tra.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：乾燒提供＿＿線索；安全還要看＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Cháy lạnh gợi ý ___; an toàn còn xem ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/freezing-and-food-safety\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"冷水或微波解凍生蝦後，依 USDA 家庭指引應？\u003cspan class=\"vn\" lang=\"vi\">Sau rã đông tôm bằng nước lạnh hay vi sóng, USDA khuyên?\u003c/span>","o":["先放桌上等半天 / Để bàn nửa ngày","立即烹調；再凍前先煮 / Nấu ngay; nấu trước khi tái đông","直接再凍就清除風險 / Đông lại xóa nguy cơ","只看有沒有異味 / Chỉ xem mùi"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 這些方法可能使局部升溫；USDA 建議解凍後立即烹調，先烹調再考慮冷凍。\u003cspan class=\"vn\" lang=\"vi\">Các cách này có thể làm vài phần ấm; USDA khuyên nấu ngay, nấu trước khi cân nhắc đông lại.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：用＿＿解凍後，我會立即＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Sau rã đông bằng ___, tôi sẽ ___ ngay.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/big-thaw-safe-defrosting-methods\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"生蝦全程 4°C 解凍、未超允許時間且符合標示，再冷凍的判斷是？\u003cspan class=\"vn\" lang=\"vi\">Tôm rã đông liên tục 4°C, còn thời gian cho phép, theo nhãn; tái đông thế nào?\u003c/span>","o":["可依指引考慮，但品質可能下降 / Có thể theo hướng dẫn, nhưng giảm chất lượng","一定造成中毒 / Chắc gây ngộ độc","品質一定完全相同 / Chất lượng chắc không đổi","可以不管衛生與期限 / Bỏ qua vệ sinh, hạn"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> USDA 合適冷藏解凍條件下可再凍；仍須符合時間、衛生與產品標示，品質不一定相同。\u003cspan class=\"vn\" lang=\"vi\">USDA cho tái đông sau rã đông lạnh phù hợp; vẫn cần thời gian, vệ sinh, nhãn, chất lượng có thể khác.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：在＿＿條件下可考慮再凍，但＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Nếu ___ có thể cân nhắc tái đông, nhưng ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/freezing-and-food-safety\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"生蝦在 25°C 桌上放了 6 小時，再凍硬就能恢復安全嗎？\u003cspan class=\"vn\" lang=\"vi\">Tôm để bàn 25°C 6 giờ, đông cứng lại có khôi phục an toàn?\u003c/span>","o":["能，低溫會消除全部毒素 / Có, lạnh xóa mọi độc tố","能，只要沒有異味 / Có, chỉ cần không mùi","不能，應丟棄，不試吃 / Không, cần bỏ, không nếm","能，包裝好就沒事 / Có, bọc kín là ổn"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 此情境的易腐生蝦長時間失溫，應丟棄；再凍不能清除先前風險，外觀也無法證明安全。\u003cspan class=\"vn\" lang=\"vi\">Tôm sống dễ hỏng quá ấm lâu trong tình huống này cần bỏ; tái đông không xóa nguy cơ, vẻ ngoài chưa chứng minh an toàn.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：我會＿＿，因為時間溫度紀錄顯示＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tôi sẽ ___ vì hồ sơ thời gian nhiệt cho thấy ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/tc/siteContent.aspx?sid=2572\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"}]}]}]};</script>
<script>
/*
 * runtime.client.js — 跑在瀏覽器裡的渲染器（17 週共用，逐字內嵌進每份 HTML）
 * 讀 window.__LESSON__ 的資料，把 modules / blocks 畫出來。
 * 互動行為（翻卡、展開、配對、測驗）沿用週1 手寫版的做法，不要另創一套。
 */
(function () {
  var D = window.__LESSON__;
  var SERIES = D.series;
  var $ = function (s) { return document.querySelector(s); };
  // 國合班 A2 版（D.a2）：介面文字加越南文；一般班 U() 只回中文，畫面與原本完全相同
  var A2 = !!D.a2;
  function U(zh, vn) { return A2 ? zh + " " + vn : zh; }

  /* ---------- 學習歷程記錄（Supabase） ----------
     只在 lesson.js 注入 D.track = {url, key} 的週次啟用（lib/tracking.json 的 weeks）；
     其他週 TRACK.on 為 false，send() 是空函式，教材行為完全不變。
     只送「學號代碼」與互動事件，不送姓名。送失敗就丟掉，不重試、不阻擋教材。 */
  var CTX = { mod: null, bi: 0 };   // 目前正在渲染的模組 id 與區塊序號（render 是同步的）
  var TRACK = (function () {
    var cfg = D.track;
    var noop = function () {};
    if (!cfg || !cfg.url || !cfg.key) return { on: false, send: noop, flush: noop, code: function () { return ""; }, setCode: noop };
    var KEY = "ifs_code", DKEY = "ifs_device";
    var rnd = function () { return Math.random().toString(36).slice(2, 10); };
    var sid = rnd() + Date.now().toString(36);
    // device_id：同一支手機／瀏覽器跨次開頁不變。學生後來才填學號代碼時，先前的 anon 事件可靠它回接。
    var did = "";
    try { did = localStorage.getItem(DKEY) || ""; if (!did) { did = "d" + rnd() + rnd(); localStorage.setItem(DKEY, did); } } catch (e) { did = "d" + rnd(); }
    var q = [], timer = null;
    function code() { try { return (localStorage.getItem(KEY) || "").trim(); } catch (e) { return ""; } }
    function setCode(v) { try { localStorage.setItem(KEY, (v || "").trim().slice(0, 20)); } catch (e) {} }
    function cut(s, n) { return s == null ? null : String(s).slice(0, n); }
    // 欄位長度與 payload 大小在前端先截到資料表 CHECK 的上限：PostgREST 批次 INSERT 是原子的，
    // 一筆違反 CHECK 整批都會被拒，而我們失敗即丟，會靜默掉整個 4 秒窗口。
    function send(event, mod, block, payload) {
      var p = payload || {};
      var ps = JSON.stringify(p);
      if (ps.length > 1800) p = { trunc: true, keys: Object.keys(p).slice(0, 10) };
      q.push({
        student_code: cut(code(), 20) || "anon", device_id: cut(did, 40), week: D.week || 0,
        module_id: cut(mod, 30), block_type: cut(block, 10), event: cut(event, 30),
        payload: p, session_id: cut(sid, 40), build: cut(D.build, 16), client_ts: new Date().toISOString(),
      });
      if (q.length >= 40) flush();
      else if (!timer) timer = setTimeout(flush, 4000);
    }
    function flush() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!q.length) return;
      var body = JSON.stringify(q.splice(0, 50));
      try {
        fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/ifs_lesson_events", {
          method: "POST", keepalive: true, body: body,
          headers: { "Content-Type": "application/json", "apikey": cfg.key, "Prefer": "return=minimal" },
        }).catch(noop);
      } catch (e) { /* 舊瀏覽器沒有 fetch：不記錄 */ }
      if (q.length) timer = setTimeout(flush, 1000);
    }
    window.addEventListener("pagehide", flush);
    return { on: true, send: send, flush: flush, code: code, setCode: setCode };
  })();

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function colorAt(given, i) { return given || SERIES[i % SERIES.length]; }
  function gridCls(n) { return "grid g" + (n === 2 || n === 3 || n === 4 ? n : 3); }
  function listHtml(v) {
    // body 可以是字串或字串陣列；陣列渲染成 <ul>
    if (v == null) return "";
    if (typeof v === "string") return '<p>' + v + '</p>';
    return '<ul>' + v.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
  }

  /* ---------- 區塊標題 ---------- */
  function heading(frag, b) {
    if (b.title) frag.appendChild(el("div", "sec-title", '<span class="bar"></span>' + b.title));
    if (b.hint) frag.appendChild(el("div", "hint", b.hint));
  }

  /* ---------- 各區塊 ---------- */
  var BLOCKS = {};

  BLOCKS.flips = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (d, i) {
      var c = colorAt(d.c, i);
      var card = el("div", "flip");
      if (b.h) card.style.height = b.h + "px";
      card.innerHTML =
        '<div class="flip-in">' +
        '<div class="face front"><div class="cbar" style="background:' + c + '"></div>' +
        '<div class="t">' + d.t + '</div><div class="en">' + (d.en || "") + '</div>' +
        '<div class="tap">▸ ' + U("點我看解釋", "Chạm để xem") + '</div></div>' +
        '<div class="face back"><div class="cbar" style="background:' + c + '"></div>' +
        '<p>' + d.b + '</p></div></div>';
      var mod = CTX.mod, bi = CTX.bi;
      card.onclick = function () {
        if (card.classList.toggle("on")) TRACK.send("flip_open", mod, "flips", { b: bi, i: i, t: d.t });
      };
      g.appendChild(card);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.exp = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div");
    b.items.forEach(function (t, i) {
      var box = el("div", "exp");
      var res = t.res ? '<div style="margin-top:10px;font-size:13px;color:var(--secondary);font-weight:700">🔗 ' + t.res + '</div>' : "";
      box.innerHTML =
        '<button><span class="num">' + (i + 1) + '</span><span>' + t.h + '</span>' +
        '<span class="tag">' + (t.tag || "") + '</span><span class="chev">›</span></button>' +
        '<div class="body">' + listHtml(t.body) + res + '</div>';
      var body = box.querySelector(".body");
      var mod = CTX.mod, bi = CTX.bi;
      box.querySelector("button").onclick = function () {
        var on = box.classList.toggle("on");
        if (!on) { body.style.maxHeight = "0px"; return; }
        TRACK.send("exp_open", mod, "exp", { b: bi, i: i, h: t.h });
        // 用實際內容高度展開，避免長段落被固定 max-height 截掉。
        // 必須先解除 max-height 再量：在 max-height:0 的狀態下量 scrollHeight 會得到 0，
        // 面板就只會開一條縫（實測過）。量完歸零並強制重排，transition 才有起點。
        body.style.maxHeight = "none";
        var h = body.scrollHeight;
        body.style.maxHeight = "0px";
        void body.offsetHeight;
        body.style.maxHeight = h + "px";
      };
      host.appendChild(box);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.cards = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var box = el("div", "card");
      box.style.borderTop = "4px solid " + accent;
      box.innerHTML = '<div class="h">' + c.h + '</div>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        (c.li ? '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>' : "") +
        (c.p ? '<p style="margin-top:8px;font-size:15.5px;color:var(--mid)">' + c.p + '</p>' : "");
      g.appendChild(box);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.timeline = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "tl");
    b.steps.forEach(function (s, i) {
      var st = el("div", "step");
      st.innerHTML = '<div class="dot" style="background:' + colorAt(s.c, i) + '">' + (i + 1) + '</div>' +
        '<h4>' + s.h + '</h4><p>' + s.p + '</p>';
      host.appendChild(st);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.compare = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "cmp");
    [b.left, b.right].forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var col = el("div", "col");
      col.innerHTML = '<div class="cbar" style="background:' + accent + '"></div>' +
        '<h4 style="color:' + accent + '">' + c.h + '</h4>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
      wrap.appendChild(col);
    });
    f.appendChild(wrap);
    if (b.note) f.appendChild(el("div", "cmp-note", b.note));
    return f;
  };

  BLOCKS.table = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "tblwrap");
    var html = '<table class="tbl"><thead><tr>' +
      b.head.map(function (h) { return '<th>' + h + '</th>'; }).join("") + '</tr></thead><tbody>' +
      b.rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join("") + '</tr>';
      }).join("") + '</tbody></table>';
    wrap.innerHTML = html;
    f.appendChild(wrap); return f;
  };

  BLOCKS.note = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    f.appendChild(el("div", "note" + (b.kind ? " " + b.kind : ""), b.text));
    return f;
  };

  BLOCKS.match = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "match-wrap");
    var pool = el("div", "pool"), targets = el("div", "targets");
    var pairs = b.pairs;
    var order = pairs.slice().sort(function () { return Math.random() - 0.5; });
    var selected = null, solved = 0, errors = 0, t0 = null;
    var mod = CTX.mod, bi = CTX.bi;
    var msg = el("div");
    msg.style.cssText = "margin-top:14px;font-weight:700;color:var(--green)";

    function tryMatch(slot, key) {
      if (slot.classList.contains("ok")) return;
      if (t0 === null) t0 = Date.now();
      if (slot.dataset.k === key) {
        slot.classList.add("ok"); slot.classList.remove("bad");
        slot.querySelector(".drop").textContent = key;
        var chip = pool.querySelector('.chip[data-k="' + key + '"]');
        chip.classList.add("used"); chip.classList.remove("sel");
        selected = null; solved++;
        TRACK.send("match_ok", mod, "match", { b: bi, label: key });
        if (solved === pairs.length) {
          msg.textContent = b.done || U("✓ 全部答對！", "Đúng hết!");
          TRACK.send("match_done", mod, "match", { b: bi, n: pairs.length, errors: errors, ms: Date.now() - t0 });
        }
      } else {
        errors++;
        TRACK.send("match_bad", mod, "match", { b: bi, label: key, slot: slot.dataset.k });
        slot.classList.add("bad");
        setTimeout(function () { slot.classList.remove("bad"); }, 350);
      }
    }
    order.forEach(function (q) {
      var c = el("div", "chip"); c.textContent = q.label; c.draggable = true; c.dataset.k = q.label;
      c.addEventListener("dragstart", function (e) { e.dataTransfer.setData("k", q.label); });
      c.onclick = function () {
        if (c.classList.contains("used")) return;
        if (selected === c) { c.classList.remove("sel"); selected = null; return; }
        pool.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("sel"); });
        c.classList.add("sel"); selected = c;
      };
      pool.appendChild(c);
    });
    pairs.forEach(function (q) {
      var s = el("div", "slot"); s.dataset.k = q.label;
      s.innerHTML = '<div class="drop">' + U("拖到這裡", "Kéo vào đây") + '</div><div class="desc">' + q.desc + '</div>';
      s.addEventListener("dragover", function (e) { e.preventDefault(); });
      s.addEventListener("drop", function (e) { e.preventDefault(); tryMatch(s, e.dataTransfer.getData("k")); });
      s.onclick = function () { if (selected) tryMatch(s, selected.dataset.k); };
      targets.appendChild(s);
    });
    host.appendChild(pool); host.appendChild(targets); host.appendChild(msg);
    f.appendChild(host); return f;
  };

  /* 結果代碼：把作答結果編成一串可貼給老師的代碼（FSQ1.<base64>.<檢查碼>）。
     解碼與彙整用專案根目錄的「食品科學概論_測驗成績解碼器.html」。 */
  function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
  function checksum(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1679616; // 36^4
    return h.toString(36);
  }

  BLOCKS.quiz = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var items = b.items, n = items.length;
    var head = el("div", "quiz-head");
    head.innerHTML =
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
      '<input class="qid" placeholder="' + U("學號（交成績必填）", "Mã số SV") + '" style="flex:1;min-width:130px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px">' +
      '<input class="qname" placeholder="' + U("姓名", "Họ tên") + '" style="flex:1;min-width:100px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px"></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
      '<strong class="qprog">' + U("進度", "Tiến độ") + ' 0 / ' + n + '</strong>' +
      '<span class="qscore" style="color:var(--secondary);font-weight:800">' + U("得分", "Điểm") + ' 0</span></div>' +
      '<div class="pbar"><div class="pfill"></div></div>';
    var box = el("div");
    var sb = el("div", "scorebox");
    sb.innerHTML = '<div>' + U("你的成績", "Điểm của bạn") + '</div><div class="big"><span class="fscore">0</span> / ' + n + '</div>' +
      '<div class="smsg" style="margin:8px 0 16px"></div>' +
      '<div class="rcwrap" style="margin:0 auto 16px;max-width:560px;text-align:left">' +
      '<div style="font-weight:700;margin-bottom:6px">' + U("結果代碼（請複製後，貼到老師指定的表單或訊息）", "— Mã kết quả: sao chép và gửi cho thầy/cô") + '</div>' +
      '<textarea class="rcode" readonly rows="3" style="width:100%;box-sizing:border-box;font-family:monospace;font-size:12px;padding:8px;border:1.5px solid var(--line,#ccc);border-radius:8px;resize:none"></textarea>' +
      '<div class="rmsg" style="font-size:13px;color:#B34700;margin-top:4px"></div>' +
      '<button class="btn copyrc" style="margin-top:8px">📋 ' + U("複製結果代碼", "Sao chép mã") + '</button></div>' +
      '<button class="btn ghost">' + U("重新測驗", "Làm lại") + '</button>';

    var answered = 0, score = 0, picks = [], qt0 = null, attempt = 0;
    var mod = CTX.mod, bi = CTX.bi;
    // 測驗的學號欄與頁首的學號代碼同步（兩邊填任一邊都行）
    var qidInput = head.querySelector(".qid");
    if (TRACK.on) {
      if (TRACK.code()) qidInput.value = TRACK.code();
      qidInput.addEventListener("change", function () {
        TRACK.setCode(qidInput.value);
        var top = $("#ifs-code"); if (top) top.value = TRACK.code();
      });
    }
    function updateProg() {
      head.querySelector(".qprog").textContent = U("進度", "Tiến độ") + " " + answered + " / " + n;
      head.querySelector(".qscore").textContent = U("得分", "Điểm") + " " + score;
      head.querySelector(".pfill").style.width = (answered / n * 100) + "%";
    }
    function finish() {
      sb.querySelector(".fscore").textContent = score;
      var pct = score / n, m;
      if (score === n) m = U("本次全對！請再用自己的話說明冷凍生蝦的時間溫度歷程。", "Đúng hết lần này! Hãy giải thích tình huống bằng lời của mình.");
      else if (pct >= 0.8) m = U("很棒！觀念相當扎實。", "Rất tốt!");
      else if (pct >= 0.6) m = U("不錯，再複習幾個弱點就更好。", "Khá tốt, ôn lại vài chỗ nữa nhé.");
      else m = U("建議回到前面單元再看一次翻卡與展開內容。", "Hãy xem lại các phần phía trước.");
      sb.querySelector(".smsg").textContent = m;

      var sid = head.querySelector(".qid").value.trim();
      var sname = head.querySelector(".qname").value.trim();
      var korr = items.map(function (item, i) { return picks[i] === item.a ? 1 : 0; }).join("");
      var payload = JSON.stringify({
        w: D.week || 0, c: A2 ? "a2" : undefined, id: sid, nm: sname, s: score, n: n,
        a: picks, k: korr, t: new Date().toISOString().slice(0, 16),
      });
      var body = b64utf8(payload);
      var code = "FSQ1." + body + "." + checksum(body);
      sb.querySelector(".rcode").value = code;
      sb.querySelector(".rmsg").textContent = sid ? "" : U("⚠ 尚未填學號 —— 請回到測驗上方填入學號後重新測驗，否則老師無法登記成績。", "Chưa nhập mã số SV: hãy nhập ở trên rồi làm lại.");
      TRACK.send("quiz_done", mod, "quiz", { b: bi, attempt: attempt, score: score, n: n, picks: picks, ms: qt0 ? Date.now() - qt0 : null });
      TRACK.flush();

      sb.classList.add("show");
      sb.scrollIntoView({ behavior: "smooth" });
    }
    function pick(qel, item, oi) {
      if (qel.dataset.done === "1") return;
      qel.dataset.done = "1"; answered++;
      if (qt0 === null) qt0 = Date.now();
      picks[parseInt(qel.dataset.qi, 10)] = oi;
      TRACK.send("quiz_answer", mod, "quiz", { b: bi, attempt: attempt, qi: parseInt(qel.dataset.qi, 10), pick: oi, ok: oi === item.a });
      qel.querySelectorAll(".opt").forEach(function (btn, i) {
        btn.classList.add("dim");
        if (i === item.a) btn.classList.add("correct");
        if (i === oi && oi !== item.a) btn.classList.add("wrong");
      });
      var fb = qel.querySelector(".fb");
      if (oi === item.a) { score++; fb.classList.add("good"); fb.innerHTML = U("✓ 正確！", "Đúng!") + item.e; }
      else { fb.classList.add("no"); fb.innerHTML = U("✗ 正解：", "Sai. Đáp án:") + item.o[item.a] + "。" + item.e; }
      fb.classList.add("show"); updateProg();
      if (answered === n) finish();
    }
    function build() {
      box.innerHTML = ""; answered = 0; score = 0; picks = []; qt0 = null; attempt++; updateProg();
      sb.classList.remove("show");
      items.forEach(function (item, qi) {
        var qel = el("div", "q"); qel.dataset.done = "0"; qel.dataset.qi = qi;
        qel.innerHTML = '<div class="qn">第 ' + (qi + 1) + ' 題' + (A2 ? ' · Câu ' + (qi + 1) : '') + '</div><div class="qt">' + item.q + '</div>';
        item.o.forEach(function (opt, oi) {
          var btn = el("button", "opt"); btn.textContent = opt;
          btn.onclick = function () { pick(qel, item, oi); };
          qel.appendChild(btn);
        });
        qel.appendChild(el("div", "fb"));
        box.appendChild(qel);
      });
    }
    sb.querySelector(".copyrc").onclick = function () {
      var ta = sb.querySelector(".rcode");
      ta.select(); ta.setSelectionRange(0, 99999);
      var btn = this;
      function ok() { btn.textContent = U("✓ 已複製，請貼給老師", "Đã sao chép"); setTimeout(function () { btn.textContent = "📋 " + U("複製結果代碼", "Sao chép mã"); }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(ta.value).then(ok, function () { document.execCommand("copy"); ok(); });
      else { document.execCommand("copy"); ok(); }
    };
    sb.querySelector(".ghost").onclick = function () {
      build(); window.scrollTo({ top: 0, behavior: "smooth" });
    };
    build();
    f.appendChild(head); f.appendChild(box); f.appendChild(sb);
    return f;
  };

  /* ---------- 組裝 ---------- */
  var nav = $("#nav"), main = $("#main");
  var curMod = D.modules.length ? D.modules[0].id : null, modT0 = Date.now();
  function switchMod(id, btn) {
    document.querySelectorAll(".module").forEach(function (m) { m.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
    nav.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
    btn.classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (id !== curMod) {
      TRACK.send("module_view", id, null, { from: curMod, ms: Date.now() - modT0 });
      curMod = id; modT0 = Date.now();
    }
  }
  D.modules.forEach(function (m, i) {
    var btn = el("button", i === 0 ? "active" : "", m.nav);
    btn.onclick = function () { switchMod(m.id, btn); };
    nav.appendChild(btn);

    var sec = el("section", "module" + (i === 0 ? " active" : ""));
    sec.id = m.id;
    sec.appendChild(el("div", "lead",
      '<div class="kicker">' + m.kicker + '</div><h2>' + m.h2 + '</h2><p>' + m.lead + '</p>'));
    m.blocks.forEach(function (b, bi) {
      var render = BLOCKS[b.type];
      if (!render) { console.error("未知區塊型別:", b.type); return; }
      CTX.mod = m.id; CTX.bi = bi;
      sec.appendChild(render(b));
    });
    main.appendChild(sec);
  });

  /* ---------- 學號代碼列（只在啟用記錄的週出現） ---------- */
  if (TRACK.on) {
    var bar = el("div", "codebar");
    bar.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;font-size:14px";
    bar.innerHTML = '<label for="ifs-code" style="font-weight:700">學號代碼</label>' +
      '<input id="ifs-code" maxlength="20" placeholder="例：S001" style="width:120px;padding:6px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:14px">' +
      '<span style="opacity:.75">只記錄你的學習歷程（翻卡、配對、測驗），不需要姓名。</span>';
    nav.parentNode.insertBefore(bar, nav);
    var inp = bar.querySelector("#ifs-code");
    inp.value = TRACK.code();
    inp.addEventListener("change", function () {
      TRACK.setCode(inp.value);
      document.querySelectorAll(".qid").forEach(function (x) { x.value = TRACK.code(); });
      TRACK.send("code_set", null, null, {});
    });
    TRACK.send("session_start", curMod, null, {
      device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || "") ? "mobile" : "desktop",
      w: window.innerWidth, build: D.build || null,
    });
    // 停留時間以「頁面可見」為準：切到背景就結算一段 module_leave，回來重新計時。
    // 手機瀏覽器殺分頁常不觸發 pagehide，所以以 visibilitychange→hidden 為主。
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        TRACK.send("module_leave", curMod, null, { ms: Date.now() - modT0 }); TRACK.flush();
      } else {
        modT0 = Date.now();
      }
    });
  }
})();
</script>
</body>
</html>
