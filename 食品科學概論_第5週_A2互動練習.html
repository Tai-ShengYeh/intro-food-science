<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品科學概論 第5週 · 國合班互動練習</title>
<style>
  :root{
    --primary:#2D2A6E; --secondary:#5B4FB8; --accent:#00B8B8; --warm:#F5A623; --green:#2FA36B; --red:#D65B5B; --dark:#1A1A3E; --bg:#F4F5FA; --text:#1F1F2E; --mid:#5A5A75; --muted:#9096ac; --border:#E2E2EC; --card:#fff;
  }
/* 版型樣式 — 逐條取自「第1週_互動教學.html」，末段為新增區塊（cmp / tbl / note）。
   這裡只用 var(--x)；色票由 tokens.js 產生 :root 注入。 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:17px}
header{background:linear-gradient(120deg,var(--dark),var(--primary));color:#fff;
  padding:26px 22px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(0,0,0,.15)}
header h1{font-size:31px;font-weight:800;letter-spacing:.5px}
header .sub{color:#b9c7ff;font-size:16px;margin-top:5px}
nav{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.10);color:#dfe4ff;border:none;padding:12px 18px;
  border-radius:10px 10px 0 0;font-size:16.5px;cursor:pointer;font-weight:600;transition:.15s}
nav button:hover{background:rgba(255,255,255,.2)}
nav button.active{background:var(--bg);color:var(--primary)}
main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
.module{display:none;animation:fade .35s}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead{background:var(--dark);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:22px}
.lead .kicker{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px}
.lead h2{font-size:26px;margin:6px 0 8px}
.lead p{color:#cdd3ee;font-size:16.5px}
.sec-title{font-size:23px;font-weight:800;color:var(--primary);margin:30px 0 6px;
  display:flex;align-items:center;gap:10px}
.sec-title .bar{width:6px;height:25px;background:var(--accent);border-radius:3px;display:inline-block}
.hint{color:var(--mid);font-size:15px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* flip cards */
.flip{perspective:1100px;height:200px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px rgba(30,30,60,.08);border:1px solid var(--border)}
.front{background:var(--card)}
.front .t{font-size:21px;font-weight:800;color:var(--primary)}
.front .en{color:var(--muted);font-size:14px;margin-top:3px;font-style:italic}
.front .tap{margin-top:auto;color:var(--accent);font-size:14px;font-weight:700}
.back{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;transform:rotateY(180deg);overflow:auto}
.back p{font-size:16px}
.cbar{height:6px;border-radius:14px 14px 0 0;position:absolute;top:0;left:0;right:0}

/* expandable */
.exp{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.exp>button{width:100%;text-align:left;background:none;border:none;padding:16px 18px;cursor:pointer;
  display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;color:var(--text)}
.exp .num{background:var(--primary);color:#fff;min-width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.exp .chev{margin-left:auto;color:var(--muted);transition:.25s;font-size:20px}
.exp.on .chev{transform:rotate(90deg);color:var(--accent)}
.exp .body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 18px}
.exp.on .body{padding:0 18px 16px 62px}
.exp .body ul{margin-left:16px;color:var(--mid);font-size:16px}
.exp .body p{color:var(--mid);font-size:15.5px}
.exp .tag{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:8px}

/* info card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.card .h{font-weight:800;color:var(--primary);font-size:18px;margin-bottom:6px}
.card .en{color:var(--muted);font-size:13px;font-style:italic}
.card ul{margin:8px 0 0 18px;font-size:15.5px;color:var(--mid)}

/* timeline */
.tl{display:flex;gap:0;flex-wrap:wrap;counter-reset:s}
.tl .step{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 14px 14px;margin:8px;position:relative}
.tl .dot{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;margin-bottom:8px}
.tl .step h4{color:var(--primary);font-size:17.5px;margin-bottom:4px}
.tl .step p{font-size:15px;color:var(--mid)}

/* matching */
.match-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.pool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--secondary);color:#fff;padding:10px 17px;border-radius:22px;font-weight:700;
  cursor:grab;user-select:none;font-size:16.5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chip.used{opacity:.35;pointer-events:none}
.chip.sel{outline:3px solid var(--warm);outline-offset:2px}
.targets{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;border:2px dashed var(--border);border-radius:12px;padding:10px 14px;background:#fafbff}
.slot .desc{flex:1;font-size:16px;color:var(--text)}
.slot .drop{min-width:130px;min-height:44px;border-radius:8px;background:#eef0f8;display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:15px;padding:8px 12px}
.slot.ok{border-color:var(--green);background:#effaf3}
.slot.ok .drop{background:var(--green);color:#fff;font-weight:700}
.slot.bad{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* quiz */
.quiz-head{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.pbar{height:12px;background:#e7e9f4;border-radius:8px;overflow:hidden;margin-top:10px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--secondary));transition:width .4s}
.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.q .qn{color:var(--accent);font-weight:800;font-size:14px}
.q .qt{font-size:19.5px;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fafbff;border:2px solid var(--border);
  border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;font-size:16.5px;transition:.15s}
.opt:hover{border-color:var(--secondary)}
.opt.correct{border-color:var(--green);background:#effaf3;font-weight:700}
.opt.wrong{border-color:var(--red);background:#fdeeee}
.opt.dim{opacity:.6}
.fb{margin-top:8px;font-size:15.5px;padding:11px 14px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.good{background:#effaf3;color:#1c7a4d} .fb.no{background:#fdeeee;color:#a83b3b}
.scorebox{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:16px;
  padding:26px;text-align:center;margin-top:10px;display:none}
.scorebox.show{display:block}
.scorebox .big{font-size:46px;font-weight:800}
.btn{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:10px;
  font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.18)}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;background:#eef0fb;color:var(--secondary);padding:3px 10px;border-radius:20px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px}

/* ===== 新增區塊 ===== */
/* compare：兩欄對照（梅納 vs 焦糖化、冷藏 vs 冷凍…） */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media(max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 18px 18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06);position:relative;overflow:hidden}
.cmp .col .cbar{position:static;height:6px;margin:0 -18px 14px;border-radius:0}
.cmp .col h4{font-size:20px;font-weight:800;margin-bottom:2px}
.cmp .col .en{color:var(--muted);font-size:13px;font-style:italic;margin-bottom:8px}
.cmp .col ul{margin-left:18px;font-size:15.5px;color:var(--mid)}
.cmp .col li{margin-bottom:5px}
.cmp-note{margin-top:12px;background:#eef0fb;border-left:5px solid var(--secondary);
  border-radius:0 10px 10px 0;padding:12px 16px;font-size:16px;color:var(--primary);font-weight:600}

/* table：資料表（維生素、添加物分類…） */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px}
.tbl th{background:var(--primary);color:#fff;text-align:left;padding:12px 14px;font-weight:700;font-size:15px}
.tbl td{padding:11px 14px;border-top:1px solid var(--border);color:var(--mid);vertical-align:top}
.tbl tr:nth-child(even) td{background:#fafbff}
.tbl td:first-child{color:var(--text);font-weight:700}

/* note：重點提示條 */
.note{background:#fff8e9;border-left:5px solid var(--warm);border-radius:0 12px 12px 0;
  padding:14px 18px;margin:14px 0;font-size:16px;color:var(--text)}
.note b{color:var(--primary)}
.note.key{background:#effaf3;border-left-color:var(--green)}
.note.warn{background:#fdeeee;border-left-color:var(--red)}
/* 國合班 A2 互動練習：拼音與越南文（build_a2.js 產生的內容才會用到） */
.py{display:block;font-size:.78em;font-weight:500;color:var(--mid);margin-top:2px}
.vn{display:block;font-size:.88em;font-weight:500;color:var(--secondary);margin-top:2px}
/* Shared classroom tasks: oral response, sentence support, then sample explanation. */
.class-activity{display:grid;gap:12px;min-width:0}
.class-activity .vn{display:block;color:#0E7C7B;font-size:15px;line-height:1.5;margin-top:4px}
.activity-time{color:#0E7C7B;font-weight:700;font-size:15px}
.activity-prompt{font-size:clamp(18px,2.3vw,23px);line-height:1.5}
.sentence-stem{padding:12px 16px;background:#EFFAF3;border-left:5px solid #2FA36B;color:#1A1A3E;line-height:1.6}
.class-activity label{font-size:14px;color:#52526B}
.activity-response{display:block;width:100%;max-width:100%;min-height:72px;border:1.5px solid #A0A0B5;border-radius:8px;padding:10px 12px;resize:vertical;font:inherit;font-size:17px;background:#fff;color:#1F1F2E}
.activity-answer{border:1px solid #E2E2EC;background:#fff;border-radius:8px;padding:10px 14px;font-size:16px;line-height:1.5}
.activity-answer summary{cursor:pointer;font-weight:700;color:#2D2A6E}
.activity-answer p{margin-top:10px}
.activity-response:focus-visible,.activity-answer summary:focus-visible{outline:3px solid #0E7C7B;outline-offset:3px}
.source-note{font-size:13px;color:#52526B;line-height:1.5;overflow-wrap:anywhere;margin-top:10px}
.source-note .vn{display:block;color:#0E7C7B;font-size:13px}
.lesson-links{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.lesson-links a{color:inherit;text-underline-offset:3px}
.feedback-reason,.feedback-transfer{margin-top:6px}
.feedback-transfer{font-weight:600}
@media(max-width:640px){header{position:relative!important}.class-activity{gap:10px}}
@media print{.activity-response{min-height:64px}}


.back .vn{color:#D7FAF3}.tbl-wrap{overflow-x:auto}
</style>
</head>

<script>window.__LESSON__={"week":5,"series":["#2D2A6E","#2FA36B","#F5A623","#5B4FB8","#00B8B8","#D65B5B"],"modules":[{"id":"m0","nav":"今天 Hôm nay","kicker":"今天學什麼 · Hôm nay học gì","h2":"脂質","lead":"zhīzhí　·　Lipid (chất béo)","blocks":[{"type":"cards","title":"今天學三件事　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Hôm nay học 3 điều\u003c/span>","cols":3,"items":[{"h":"油脂的結構","p":"\u003cspan class=\"vn\">Cấu trúc của dầu mỡ\u003c/span>"},{"h":"熔點、結晶和塑性","p":"\u003cspan class=\"vn\">Điểm nóng chảy, kết tinh và tính dẻo\u003c/span>"},{"h":"油脂為什麼會壞？","p":"\u003cspan class=\"vn\">Vì sao dầu mỡ bị hỏng?\u003c/span>"}]},{"type":"note","title":"看影片：油怎麼變清澈？　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Xem video: dầu trở nên trong thế nào?\u003c/span>","text":"\u003ca href=\"https://www.youtube.com/watch?v=VwHaRjH4KGU&t=619s\" target=\"_blank\" rel=\"noopener\" style=\"font-weight:700\">▶ 粗油變清油的四個步驟\u003c/a>\u003cspan class=\"vn\">Bốn bước biến dầu thô thành dầu trong\u003c/span>\u003cul style=\"margin:10px 0 0;padding-left:22px\">\u003cli>精煉的第一步叫什麼？\u003cspan class=\"vn\">Bước 1 của tinh luyện gọi là gì?\u003c/span>\u003c/li>\u003cli>白土把油裡的什麼帶走？\u003cspan class=\"vn\">Đất tẩy màu lấy đi cái gì trong dầu?\u003c/span>\u003c/li>\u003cli>脫臭要加熱到幾度？\u003cspan class=\"vn\">Khử mùi phải đun nóng đến bao nhiêu độ?\u003c/span>\u003c/li>\u003c/ul>片中溫度是該製程的例子；油變清澈不能取代品質檢測。\u003cspan class=\"vn\" lang=\"vi\">Nhiệt độ trong video là ví dụ của quy trình đó; dầu trong không thay kiểm tra chất lượng.\u003c/span>"},{"type":"cards","title":"一塊奶油餅乾：製作到保存\u003cspan class=\"vn\" lang=\"vi\">Một chiếc bánh quy bơ: từ làm đến bảo quản\u003c/span>","cols":3,"items":[{"h":"① 製作時\u003cspan class=\"vn\" lang=\"vi\">Khi làm\u003c/span>","p":"奶油的固液比例影響混合與口感；和麵粉、水一起看。\u003cspan class=\"vn\" lang=\"vi\">Tỷ lệ rắn–lỏng của bơ ảnh hưởng trộn và kết cấu; xem cùng bột và nước.\u003c/span>","c":"#2D2A6E"},{"h":"② 冷卻、包裝\u003cspan class=\"vn\" lang=\"vi\">Làm nguội, đóng gói\u003c/span>","p":"水分、油脂結晶與包裝影響脆度和風味。\u003cspan class=\"vn\" lang=\"vi\">Nước, kết tinh chất béo và bao bì ảnh hưởng độ giòn và hương.\u003c/span>","c":"#2FA36B"},{"h":"③ 存放後\u003cspan class=\"vn\" lang=\"vi\">Sau bảo quản\u003c/span>","p":"可能吸濕變軟，也可能油脂氧化；不是同一個變化。\u003cspan class=\"vn\" lang=\"vi\">Có thể hút ẩm mềm đi hay chất béo oxy hóa; không phải cùng biến đổi.\u003c/span>","c":"#F5A623"}]}]},{"id":"m1","nav":"生詞 Từ mới","kicker":"生詞 · Từ mới","h2":"本週生詞","lead":"10 個生詞　·　10 từ mới","blocks":[{"type":"flips","cols":3,"items":[{"t":"脂質","en":"zhīzhí","b":"lipid (chất béo)"},{"t":"脂肪酸","en":"zhīfángsuān","b":"axit béo"},{"t":"熔點","en":"róngdiǎn","b":"điểm nóng chảy"},{"t":"結晶","en":"jiéjīng","b":"kết tinh"},{"t":"塑性","en":"sùxìng","b":"tính dẻo"}],"title":"翻卡：生詞　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Lật thẻ: từ mới\u003c/span>"},{"type":"flips","cols":3,"items":[{"t":"氫化","en":"qīnghuà","b":"hydro hóa"},{"t":"反式脂肪","en":"fǎnshì zhīfáng","b":"chất béo trans"},{"t":"酸敗","en":"suānbài","b":"ôi hóa (chất béo)"},{"t":"氧化","en":"yǎnghuà","b":"oxy hóa"},{"t":"抗氧化劑","en":"kàngyǎnghuàjì","b":"chất chống oxy hóa"}]},{"type":"match","title":"配對：中文 ↔ 越南文　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Ghép: tiếng Trung ↔ tiếng Việt\u003c/span>","pairs":[{"label":"脂質","desc":"lipid (chất béo)"},{"label":"脂肪酸","desc":"axit béo"},{"label":"熔點","desc":"điểm nóng chảy"},{"label":"結晶","desc":"kết tinh"},{"label":"塑性","desc":"tính dẻo"},{"label":"氫化","desc":"hydro hóa"},{"label":"反式脂肪","desc":"chất béo trans"},{"label":"酸敗","desc":"ôi hóa (chất béo)"},{"label":"氧化","desc":"oxy hóa"},{"label":"抗氧化劑","desc":"chất chống oxy hóa"}],"done":"✓ 全部答對！Đúng hết!"}]},{"id":"s1","nav":"一 油脂的結構","kicker":"第一段 · Phần 1","h2":"油脂的結構","lead":"Cấu trúc của dầu mỡ","blocks":[{"type":"note","title":"","text":"食用油脂多以三酸甘油酯為主：甘油骨架與三個脂肪酸殘基用酯鍵連接。這是結構示意，不是直接相加的反應式；脂質還包括磷脂與固醇等。\u003cspan class=\"vn\" lang=\"vi\">Dầu mỡ ăn thường chủ yếu là triacylglycerol: khung glycerol nối ba gốc axit béo bằng liên kết este. Đây là mô tả cấu trúc, không phải phương trình cộng trực tiếp; lipid còn gồm phospholipid và sterol.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://openstax.org/books/organic-chemistry/pages/27-1-waxes-fats-and-oils\" target=\"_blank\" rel=\"noopener\">油脂結構 / Cấu trúc dầu mỡ: OpenStax §27.1 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"分類看脂肪酸的碳碳雙鍵\u003cspan class=\"vn\" lang=\"vi\">Phân loại theo nối đôi carbon–carbon của axit béo\u003c/span>","cols":3,"items":[{"h":"飽和：0 個\u003cspan class=\"vn\" lang=\"vi\">No: 0 nối đôi\u003c/span>","p":"例：棕櫚酸 C16:0。油品通常含多種脂肪酸。\u003cspan class=\"vn\" lang=\"vi\">Ví dụ axit palmitic C16:0. Dầu thường có nhiều loại axit béo.\u003c/span>","c":"#2D2A6E"},{"h":"單元不飽和：1 個\u003cspan class=\"vn\" lang=\"vi\">Không no một nối đôi\u003c/span>","p":"例：油酸 C18:1；完整結構還要看位置與順反式。\u003cspan class=\"vn\" lang=\"vi\">Ví dụ axit oleic C18:1; cấu trúc đầy đủ còn cần vị trí và cis/trans.\u003c/span>","c":"#2FA36B"},{"h":"多元不飽和：≥2 個\u003cspan class=\"vn\" lang=\"vi\">Không no nhiều nối đôi: ≥2\u003c/span>","p":"例：亞麻油酸 C18:2；不把所有 ω-3、ω-6 都叫必需脂肪酸。\u003cspan class=\"vn\" lang=\"vi\">Ví dụ axit linoleic C18:2; không gọi mọi omega-3 và omega-6 là thiết yếu.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"本課的兩個必需脂肪酸：亞麻油酸（LA，ω-6）與 α-次亞麻油酸（ALA，ω-3），需由飲食取得。ω-3、ω-6 是結構家族名稱。\u003cspan class=\"vn\" lang=\"vi\">Hai axit béo thiết yếu học trong bài: linoleic (LA, omega-6) và alpha-linolenic (ALA, omega-3), cần lấy từ thức ăn. Omega-3 và omega-6 là tên nhóm cấu trúc.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://ods.od.nih.gov/factsheets/Omega3FattyAcids-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">必需脂肪酸 / Axit béo thiết yếu: NIH ODS ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"順式與反式：比較同類結構\u003cspan class=\"vn\" lang=\"vi\">Cis và trans: so cấu trúc tương ứng\u003c/span>","cols":2,"items":[{"h":"順式 cis\u003cspan class=\"vn\" lang=\"vi\">Hydrogen cùng phía\u003c/span>","p":"雙鍵兩側的氫同側，常使碳鏈彎折、較難緊密排列。\u003cspan class=\"vn\" lang=\"vi\">Hydrogen cùng phía nối đôi, thường làm mạch gấp và khó xếp chặt.\u003c/span>","c":"#2D2A6E"},{"h":"反式 trans\u003cspan class=\"vn\" lang=\"vi\">Hydrogen khác phía\u003c/span>","p":"對應結構較直，常比順式更易緊密排列；不是所有不飽和鏈都彎。\u003cspan class=\"vn\" lang=\"vi\">Cấu trúc tương ứng thẳng hơn, thường dễ xếp chặt hơn cis; không phải mọi mạch không no đều gấp.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"台灣自 2018-07-01 起，食品不得使用不完全（部分）氫化油，以製造日期為準。限制對象是這類原料，不等於所有氫化油或所有來源的反式脂肪都被禁。\u003cspan class=\"vn\" lang=\"vi\">Từ 01/07/2018 tại Đài Loan, không dùng dầu hydro hóa một phần trong thực phẩm, tính theo ngày sản xuất. Quy định nhắm loại nguyên liệu này, không phải cấm mọi dầu hydro hóa hay trans từ mọi nguồn.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/tc/newsContent.aspx?cid=3&id=19820\" target=\"_blank\" rel=\"noopener\">台灣原料使用限制 / Quy định nguyên liệu: TFDA 2016 公告 ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 1｜看懂 C18:1\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 1: Hiểu C18:1\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"label\">\u003cp class=\"activity-time\">1 分鐘 / 1 phút\u003c/p>\u003cp class=\"activity-prompt\">餅乾用油含有 C18:1 脂肪酸。18 和 1 代表什麼？只看這個代號，能確定整份油在室溫是固體嗎？\u003cspan class=\"vn\" lang=\"vi\">Dầu làm bánh quy có axit béo C18:1. Số 18 và 1 nghĩa là gì? Chỉ mã này có xác định cả dầu rắn ở nhiệt độ phòng không?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>18 代表＿＿，1 代表＿＿；還要知道＿＿。\u003cspan class=\"vn\" lang=\"vi\">18 là ___, 1 là ___; còn cần biết ___.\u003c/span>\u003c/div>\u003clabel for=\"a2-w5-label\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w5-label\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>18 代表 18 個碳，1 代表 1 個碳碳雙鍵；還要知道順反式、整體組成與溫度。\u003cspan class=\"vn\" lang=\"vi\">18 là 18 nguyên tử carbon, 1 là một nối đôi carbon–carbon; còn cần biết cis/trans, thành phần tổng thể và nhiệt độ.\u003c/span>\u003c/p>\u003cp>一種脂肪酸的代號，不等於整份油的組成。C18:1 也沒有單獨指定雙鍵位置或順反式。\u003cspan class=\"vn\" lang=\"vi\">Mã của một axit béo không phải thành phần cả dầu. C18:1 cũng không tự chỉ vị trí nối đôi hay dạng cis/trans.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"}]},{"id":"s2","nav":"二 熔點、結晶和塑性","kicker":"第二段 · Phần 2","h2":"熔點、結晶和塑性","lead":"Điểm nóng chảy, kết tinh và tính dẻo","blocks":[{"type":"cards","title":"熔化行為：要控制比較條件\u003cspan class=\"vn\" lang=\"vi\">Nóng chảy: cần giữ điều kiện so sánh\u003c/span>","cols":3,"items":[{"h":"鏈長與雙鍵\u003cspan class=\"vn\" lang=\"vi\">Độ dài mạch và nối đôi\u003c/span>","p":"相近結構比較時，鏈長、順式雙鍵會影響排列與熔點。\u003cspan class=\"vn\" lang=\"vi\">Khi so cấu trúc tương tự, độ dài và nối đôi cis ảnh hưởng xếp mạch và nóng chảy.\u003c/span>","c":"#2D2A6E"},{"h":"整份油的組成\u003cspan class=\"vn\" lang=\"vi\">Thành phần cả dầu\u003c/span>","p":"脂肪酸如何分配在三酸甘油酯上，也影響結晶；常是熔化範圍。\u003cspan class=\"vn\" lang=\"vi\">Phân bố axit béo trong triacylglycerol cũng ảnh hưởng kết tinh; thường có khoảng nóng chảy.\u003c/span>","c":"#2FA36B"},{"h":"溫度與晶型\u003cspan class=\"vn\" lang=\"vi\">Nhiệt độ và dạng tinh thể\u003c/span>","p":"同一份油在不同溫度下，可有不同固體比例；不能只看一個代號。\u003cspan class=\"vn\" lang=\"vi\">Cùng dầu ở nhiệt độ khác có tỷ lệ rắn khác; không chỉ xem một mã.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"比較「較多順式雙鍵，熔點常較低」時，要盡量控制鏈長與其他結構。不能直接用單一脂肪酸代號判斷混合油的固液狀態。\u003cspan class=\"vn\" lang=\"vi\">Khi nói nhiều nối đôi cis thường làm giảm nóng chảy, cần giữ độ dài và cấu trúc khác tương tự. Không dùng một mã axit béo để kết luận trạng thái của dầu hỗn hợp.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://openstax.org/books/organic-chemistry/pages/27-1-waxes-fats-and-oils\" target=\"_blank\" rel=\"noopener\">結構與熔化 / Cấu trúc và nóng chảy: OpenStax ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"結晶、塑性與巧克力\u003cspan class=\"vn\" lang=\"vi\">Kết tinh, tính dẻo và sô-cô-la\u003c/span>","cols":3,"items":[{"h":"大小與網絡\u003cspan class=\"vn\" lang=\"vi\">Kích thước và mạng tinh thể\u003c/span>","p":"晶體大小、形狀與連結影響滑順度；不等於小晶體會自動包住空氣。\u003cspan class=\"vn\" lang=\"vi\">Kích thước, hình dạng và liên kết ảnh hưởng độ mịn; tinh thể nhỏ không tự giữ khí.\u003c/span>","c":"#2D2A6E"},{"h":"固體＋液體\u003cspan class=\"vn\" lang=\"vi\">Rắn + lỏng\u003c/span>","p":"適當固液比例與晶體網絡可產生塑性，方便塗抹、混合。\u003cspan class=\"vn\" lang=\"vi\">Tỷ lệ rắn–lỏng và mạng phù hợp tạo tính dẻo, giúp phết và trộn.\u003c/span>","c":"#2FA36B"},{"h":"可可脂調溫\u003cspan class=\"vn\" lang=\"vi\">Điều nhiệt bơ ca cao\u003c/span>","p":"促進合適晶型與微結構，通常以 V 型為目標；不是保證永久不變。\u003cspan class=\"vn\" lang=\"vi\">Thúc đẩy dạng và vi cấu trúc phù hợp, thường hướng tới dạng V; không bảo đảm không đổi mãi.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"此處調溫指以可可脂為主要脂肪的巧克力；代可可脂塗層未必採同一程序。灰白外觀有不同可能原因，不能只靠顏色認定晶型或是否氧化。\u003cspan class=\"vn\" lang=\"vi\">Điều nhiệt ở đây xét sô-cô-la có bơ ca cao là chất béo chính; lớp phủ dùng chất béo thay thế có thể khác quy trình. Màu trắng có nhiều nguyên nhân, không đủ xác định dạng tinh thể hay oxy hóa.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.1038/s41467-021-25206-1\" target=\"_blank\" rel=\"noopener\">可可脂結晶研究 / Kết tinh bơ ca cao: Nature Communications, 2021 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"起酥與層次：先看配方與製程\u003cspan class=\"vn\" lang=\"vi\">Giòn xốp và phân lớp: xem công thức, quy trình\u003c/span>","cols":2,"items":[{"h":"起酥作用\u003cspan class=\"vn\" lang=\"vi\">Tác dụng làm giòn xốp\u003c/span>","p":"油脂可影響麵粉水合與麵筋發展，使口感較酥；液體油也可用於某些配方。\u003cspan class=\"vn\" lang=\"vi\">Chất béo ảnh hưởng hydrat hóa bột và phát triển gluten, giúp giòn; dầu lỏng cũng dùng được trong một số công thức.\u003c/span>","c":"#2D2A6E"},{"h":"層狀酥皮\u003cspan class=\"vn\" lang=\"vi\">Bột cán nhiều lớp\u003c/span>","p":"需要油脂與麵團的操作性配合；直接換成液體油，不保證保留相同層次。\u003cspan class=\"vn\" lang=\"vi\">Cần chất béo và bột nhào có tính thao tác phù hợp; đổi trực tiếp sang dầu lỏng không bảo đảm giữ cùng lớp.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"短活動 2｜奶油溫度與餅乾製作\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 2: Nhiệt độ bơ và làm bánh quy\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"texture\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">同一配方做餅乾：A 用冷藏硬奶油，B 用回溫、仍有塑性的奶油。哪一組較容易拌開？比較時還要固定什麼？\u003cspan class=\"vn\" lang=\"vi\">Cùng công thức bánh quy: A dùng bơ cứng từ ngăn mát, B dùng bơ ấm hơn vẫn dẻo. Mẫu nào dễ trộn hơn? Cần giữ yếu tố nào giống nhau?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>我預測＿＿較容易＿＿，因為＿＿；比較時固定＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tôi dự đoán ___ dễ ___ hơn vì ___; khi so sánh giữ ___ như nhau.\u003c/span>\u003c/div>\u003clabel for=\"a2-w5-texture\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w5-texture\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>我預測 B 較容易拌開，因為固液比例較適合操作；比較時固定奶油量、其他原料與攪拌方式。\u003cspan class=\"vn\" lang=\"vi\">Tôi dự đoán B dễ trộn hơn vì tỷ lệ rắn–lỏng phù hợp hơn; giữ lượng bơ, nguyên liệu khác và cách trộn như nhau.\u003c/span>\u003c/p>\u003cp>這是對操作性的預測，不表示越軟越好。完全融化與保有塑性不同；成品仍受配方、攪拌及烘焙影響。\u003cspan class=\"vn\" lang=\"vi\">Đây là dự đoán về thao tác, không phải càng mềm càng tốt. Tan hoàn toàn khác với vẫn dẻo; thành phẩm còn tùy công thức, trộn và nướng.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"油脂在食品中的四個角色\u003cspan class=\"vn\" lang=\"vi\">Bốn vai trò của dầu mỡ\u003c/span>","cols":4,"items":[{"h":"傳熱\u003cspan class=\"vn\" lang=\"vi\">Truyền nhiệt\u003c/span>","p":"油可在高於常壓水沸點的溫度傳熱；食物表面與中心溫度不同。\u003cspan class=\"vn\" lang=\"vi\">Dầu truyền nhiệt ở nhiệt độ cao hơn nước sôi áp suất thường; bề mặt và tâm thức ăn khác nhiệt độ.\u003c/span>","c":"#2D2A6E"},{"h":"風味\u003cspan class=\"vn\" lang=\"vi\">Hương vị\u003c/span>","p":"可溶解某些脂溶性香氣，改變風味釋放；不是低脂都沒味道。\u003cspan class=\"vn\" lang=\"vi\">Hòa tan một số chất thơm tan trong chất béo, đổi giải phóng hương; ít béo không có nghĩa vô vị.\u003c/span>","c":"#2FA36B"},{"h":"口感\u003cspan class=\"vn\" lang=\"vi\">Kết cấu\u003c/span>","p":"潤滑、起酥、結晶與界面作用，共同影響口感。\u003cspan class=\"vn\" lang=\"vi\">Bôi trơn, làm giòn, kết tinh và tác động bề mặt cùng ảnh hưởng kết cấu.\u003c/span>","c":"#F5A623"},{"h":"營養\u003cspan class=\"vn\" lang=\"vi\">Dinh dưỡng\u003c/span>","p":"脂肪常用能量換算約 9 kcal/g，並提供必需脂肪酸等。\u003cspan class=\"vn\" lang=\"vi\">Hệ số năng lượng thường dùng khoảng 9 kcal/g chất béo; cung cấp axit béo thiết yếu và vai trò khác.\u003c/span>","c":"#5B4FB8"}]},{"type":"note","title":"","text":"9 kcal/g 是脂肪的一般能量換算係數，不是每克餅乾的熱量。食品熱量還要看脂肪含量與其他成分。\u003cspan class=\"vn\" lang=\"vi\">9 kcal/g là hệ số năng lượng chung cho chất béo, không phải năng lượng mỗi gram bánh quy. Năng lượng thực phẩm còn tùy lượng chất béo và thành phần khác.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/Y5022E/y5022e04.htm\" target=\"_blank\" rel=\"noopener\">換算係數範圍 / Hệ số năng lượng: FAO, Food energy §3 ↗\u003c/a>\u003c/p>"}]},{"id":"s3","nav":"三 油脂為什麼會壞？","kicker":"第三段 · Phần 3","h2":"油脂為什麼會壞？","lead":"Vì sao dầu mỡ bị hỏng?","blocks":[{"type":"cards","title":"兩種酸敗：分清機制\u003cspan class=\"vn\" lang=\"vi\">Hai kiểu ôi: phân biệt cơ chế\u003c/span>","cols":2,"items":[{"h":"水解\u003cspan class=\"vn\" lang=\"vi\">Thủy phân\u003c/span>","p":"酯鍵水解，釋出游離脂肪酸；速度受水、溫度與酵素等影響。\u003cspan class=\"vn\" lang=\"vi\">Liên kết este thủy phân giải phóng axit béo tự do; tốc độ tùy nước, nhiệt độ, enzyme.\u003c/span>","c":"#2D2A6E"},{"h":"氧化\u003cspan class=\"vn\" lang=\"vi\">Oxy hóa\u003c/span>","p":"油脂與氧反應，形成初期與次級產物；光、熱、金屬可影響速率。\u003cspan class=\"vn\" lang=\"vi\">Chất béo phản ứng với oxy, tạo sản phẩm ban đầu và thứ cấp; ánh sáng, nhiệt, kim loại ảnh hưởng tốc độ.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"「有水／有氧」是反應條件提示，不是只要接觸就立即酸敗。酸價 AV、過氧化價 POV 看不同產物，不能單獨代表全部品質。\u003cspan class=\"vn\" lang=\"vi\">Nước/oxy là gợi ý điều kiện phản ứng, không phải cứ tiếp xúc là ôi ngay. AV và POV xét sản phẩm khác nhau, không tự đại diện toàn bộ chất lượng.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.1111/j.1750-3841.2007.00352.x\" target=\"_blank\" rel=\"noopener\">劣變機制 / Cơ chế: Choe & Min, 2007 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"氧化：初期產物還會分解\u003cspan class=\"vn\" lang=\"vi\">Oxy hóa: sản phẩm ban đầu còn phân hủy\u003c/span>","cols":3,"items":[{"h":"① 開始與傳遞\u003cspan class=\"vn\" lang=\"vi\">Khởi đầu và lan truyền\u003c/span>","p":"自氧化可有自由基連鎖；其他條件也會影響反應。\u003cspan class=\"vn\" lang=\"vi\">Tự oxy hóa có thể có chuỗi gốc tự do; điều kiện khác cũng ảnh hưởng.\u003c/span>","c":"#2D2A6E"},{"h":"② 過氧化物\u003cspan class=\"vn\" lang=\"vi\">Peroxide ban đầu\u003c/span>","p":"POV 主要反映初期過氧化物；這些產物可能再分解。\u003cspan class=\"vn\" lang=\"vi\">POV chủ yếu xét peroxide ban đầu; chúng có thể phân hủy tiếp.\u003c/span>","c":"#2FA36B"},{"h":"③ 次級產物\u003cspan class=\"vn\" lang=\"vi\">Sản phẩm thứ cấp\u003c/span>","p":"部分醛、酮等帶來油耗味；沒有異味也不代表沒氧化。\u003cspan class=\"vn\" lang=\"vi\">Một số aldehyde, ketone gây mùi ôi; không mùi lạ không có nghĩa chưa oxy hóa.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"油炸研究顯示，初期過氧化物在高溫可快速分解；POV 低不能單獨證明油新鮮。也不能把油炸研究的數值當成餅乾的保存期限。\u003cspan class=\"vn\" lang=\"vi\">Nghiên cứu chiên cho thấy peroxide ban đầu có thể phân hủy nhanh ở nhiệt cao; POV thấp không tự chứng minh dầu tươi. Không dùng số liệu dầu chiên làm hạn dùng bánh quy.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.5851/kosfa.2020.e54\" target=\"_blank\" rel=\"noopener\">POV 侷限 / Giới hạn POV: Food Science of Animal Resources, 2020 ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 3｜POV 下降，變新鮮了嗎？\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 3: POV giảm, có tươi lại không?\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"storage\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">教學假設：同批餅乾萃取油的過氧化價（POV），隨存放先升高、後下降。能說餅乾又新鮮了嗎？還要看什麼？\u003cspan class=\"vn\" lang=\"vi\">Ví dụ giả định: POV của dầu chiết từ cùng mẻ bánh quy tăng rồi giảm khi bảo quản. Có thể nói bánh tươi lại không? Cần xem thêm gì?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>POV 下降可能因為＿＿；還要看＿＿，不能只靠＿＿。\u003cspan class=\"vn\" lang=\"vi\">POV giảm có thể vì ___; cần xem thêm ___, không chỉ dựa vào ___.\u003c/span>\u003c/div>\u003clabel for=\"a2-w5-storage\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w5-storage\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>POV 下降可能因為初期過氧化物分解；還要看次級氧化指標、包裝與存放條件，不能只靠一個數字。\u003cspan class=\"vn\" lang=\"vi\">POV giảm có thể vì peroxide ban đầu phân hủy; cần xem chỉ số oxy hóa thứ cấp, bao bì và điều kiện bảo quản, không chỉ một con số.\u003c/span>\u003c/p>\u003cp>這是假設情境，不是實測餅乾數據。POV 看初期產物，下降不代表反應倒轉；聞起來正常也不能單獨證明品質良好。\u003cspan class=\"vn\" lang=\"vi\">Đây là tình huống giả định, không phải số đo bánh quy. POV xét sản phẩm ban đầu; giảm không có nghĩa phản ứng đảo ngược. Mùi bình thường cũng không tự chứng minh chất lượng tốt.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"讓氧化慢一點：組合控制\u003cspan class=\"vn\" lang=\"vi\">Làm oxy hóa chậm hơn: kết hợp kiểm soát\u003c/span>","cols":3,"items":[{"h":"減少氧氣\u003cspan class=\"vn\" lang=\"vi\">Giảm oxy\u003c/span>","p":"適當密封、阻氧包材或充氮；開封後條件會改變。\u003cspan class=\"vn\" lang=\"vi\">Đóng kín, bao bì cản oxy hoặc nạp nitơ phù hợp; sau mở điều kiện thay đổi.\u003c/span>","c":"#2D2A6E"},{"h":"減少光與熱\u003cspan class=\"vn\" lang=\"vi\">Giảm ánh sáng và nhiệt\u003c/span>","p":"避光、依標示保存；不同產品的適合溫度不同。\u003cspan class=\"vn\" lang=\"vi\">Tránh sáng, bảo quản theo nhãn; nhiệt độ phù hợp tùy sản phẩm.\u003c/span>","c":"#2FA36B"},{"h":"配方與抗氧化\u003cspan class=\"vn\" lang=\"vi\">Công thức và chống oxy hóa\u003c/span>","p":"適合的抗氧化系統可延緩反應，不能讓已酸敗油脂復原。\u003cspan class=\"vn\" lang=\"vi\">Hệ chống oxy hóa phù hợp làm chậm phản ứng, không phục hồi chất béo đã ôi.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"餅乾要兼顧防潮與阻氧：變軟可和吸濕有關，油耗味可和氧化有關；不能把兩者混成一個指標，也不靠試吃異常食品判斷。\u003cspan class=\"vn\" lang=\"vi\">Bánh quy cần vừa chống ẩm vừa cản oxy: mềm có thể do hút ẩm, mùi ôi có thể do oxy hóa. Không gộp hai việc thành một chỉ số hay nếm thực phẩm bất thường để đánh giá.\u003c/span>"},{"type":"cards","title":"三種加工：改變的東西不同\u003cspan class=\"vn\" lang=\"vi\">Ba cách chế biến: thay đổi khác nhau\u003c/span>","cols":3,"items":[{"h":"氫化\u003cspan class=\"vn\" lang=\"vi\">Hydro hóa\u003c/span>","p":"氫加到雙鍵；部分氫化可形成反式異構物。完全氫化的性質與法規範圍不同。\u003cspan class=\"vn\" lang=\"vi\">Thêm hydro vào nối đôi; hydro hóa một phần có thể tạo đồng phân trans. Loại hoàn toàn khác về tính chất và quy định.\u003c/span>","c":"#2D2A6E"},{"h":"酯交換\u003cspan class=\"vn\" lang=\"vi\">Trao đổi este\u003c/span>","p":"重排脂肪酸在三酸甘油酯中的分布；本身不以改變雙鍵順反式為機制。\u003cspan class=\"vn\" lang=\"vi\">Sắp xếp lại phân bố axit béo trong triacylglycerol; bản thân cơ chế không đổi cis/trans của nối đôi.\u003c/span>","c":"#2FA36B"},{"h":"分提\u003cspan class=\"vn\" lang=\"vi\">Phân đoạn\u003c/span>","p":"控制結晶並分離固液部分；不是把所有油都直接變成同一種固體。\u003cspan class=\"vn\" lang=\"vi\">Kiểm soát kết tinh rồi tách phần rắn–lỏng; không biến mọi dầu thành cùng một chất rắn.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"替代部分氫化油可用配油、分提、酯交換等組合；實際選擇依目標口感與原料。某一步不生成反式脂肪，不等於成品必定零反式。\u003cspan class=\"vn\" lang=\"vi\">Có thể phối trộn, phân đoạn, trao đổi este để thay dầu hydro hóa một phần; chọn theo kết cấu và nguyên liệu. Một bước không tạo trans không có nghĩa thành phẩm chắc chắn bằng không.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/v4700e/v4700e0a.htm\" target=\"_blank\" rel=\"noopener\">加工機制 / Cơ chế chế biến: FAO, Ch.10 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"炸油：多種劣變可能並存\u003cspan class=\"vn\" lang=\"vi\">Dầu chiên: nhiều biến đổi có thể cùng xảy ra\u003c/span>","cols":3,"items":[{"h":"水解\u003cspan class=\"vn\" lang=\"vi\">Thủy phân\u003c/span>","p":"食材帶入水，游離脂肪酸可能增加。\u003cspan class=\"vn\" lang=\"vi\">Nước từ thực phẩm có thể làm tăng axit béo tự do.\u003c/span>","c":"#2D2A6E"},{"h":"氧化\u003cspan class=\"vn\" lang=\"vi\">Oxy hóa\u003c/span>","p":"接觸空氣與加熱，產生不同階段的氧化產物。\u003cspan class=\"vn\" lang=\"vi\">Tiếp xúc không khí và nhiệt tạo các giai đoạn sản phẩm oxy hóa.\u003c/span>","c":"#2FA36B"},{"h":"聚合等變化\u003cspan class=\"vn\" lang=\"vi\">Trùng hợp và biến đổi khác\u003c/span>","p":"部分油脂形成較大分子；顏色、黏度及泡沫只是觀察線索。\u003cspan class=\"vn\" lang=\"vi\">Một phần lipid tạo phân tử lớn hơn; màu, độ nhớt và bọt chỉ là dấu hiệu quan sát.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"台灣食品業油炸用油：總極性化合物達 25% 時，應全部更換新油，不得再用。這是炸油的管理界線，不是 POV、酸價或所有包裝食品共用的限值。\u003cspan class=\"vn\" lang=\"vi\">Tại Đài Loan, dầu dùng chiên trong cơ sở thực phẩm đạt 25% hợp chất phân cực tổng phải thay toàn bộ, không dùng tiếp. Đây là ngưỡng quản lý dầu chiên, không phải giới hạn POV, AV hay mọi thực phẩm đóng gói.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://law.moj.gov.tw/LawClass/LawGetFile.ashx?FileId=0000397353&lan=C\" target=\"_blank\" rel=\"noopener\">台灣 GHP 附件二第 5 點（2025-06-04 版） / GHP Đài Loan, Phụ lục 2.5 ↗\u003c/a>\u003c/p>"}]},{"id":"sum","nav":"重點 Điểm chính","kicker":"今天的重點 · Điểm chính hôm nay","h2":"今天的重點","lead":"Điểm chính hôm nay","blocks":[{"type":"cards","title":"回顧\u003cspan class=\"vn\" lang=\"vi\">Ôn tập\u003c/span>","cols":2,"items":[{"h":"結構、組成與溫度，一起看油脂狀態\u003cspan class=\"vn\" lang=\"vi\">Xem cấu trúc, thành phần và nhiệt độ cùng nhau\u003c/span>"},{"h":"塑性與起酥要配合產品和製程\u003cspan class=\"vn\" lang=\"vi\">Tính dẻo và làm giòn cần phù hợp sản phẩm, quy trình\u003c/span>"},{"h":"水解與氧化不同；POV 低不代表新鮮\u003cspan class=\"vn\" lang=\"vi\">Thủy phân khác oxy hóa; POV thấp không có nghĩa tươi\u003c/span>"},{"h":"防潮、阻氧與數據，各自回答不同問題\u003cspan class=\"vn\" lang=\"vi\">Chống ẩm, cản oxy và số liệu trả lời các câu hỏi khác nhau\u003c/span>"}]},{"type":"note","title":"","text":"回家：看一包餅乾的包裝與保存標示，說明它可能如何防潮、減光與減氧；不要把推測當成檢測結果。\u003cspan class=\"vn\" lang=\"vi\">Về nhà: xem bao bì và nhãn một gói bánh quy, giải thích cách có thể chống ẩm, giảm sáng và oxy; không xem suy đoán là kết quả kiểm tra.\u003c/span>"}]},{"id":"quiz","nav":"練習 Luyện tập","kicker":"練習 · Luyện tập","h2":"課後練習 10 題","lead":"作答後看原因，再練習說一句中文；可重做。Đọc giải thích rồi tập nói một câu tiếng Trung; có thể làm lại.","blocks":[{"type":"quiz","items":[{"q":"「axit béo」是哪個中文？\u003cspan class=\"vn\" lang=\"vi\">\"axit béo\" là từ tiếng Trung nào?\u003c/span>","o":["脂肪酸 zhīfángsuān","脂質 zhīzhí","酸敗 suānbài","氫化 qīnghuà"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 脂肪酸可以接在甘油上形成三酸甘油酯；脂質是較大的分類，還包括磷脂、固醇等。\u003cspan class=\"vn\" lang=\"vi\">Axit béo có thể nối với glycerol thành triacylglycerol; lipid là nhóm rộng hơn, gồm phospholipid và sterol.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：三酸甘油酯含三個脂肪酸殘基。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Triacylglycerol có ba gốc axit béo.\u003c/span>\u003c/div>"},{"q":"餅乾存放後出現油耗味，哪個變化可能相關？\u003cspan class=\"vn\" lang=\"vi\">Bánh quy bảo quản có mùi dầu ôi, biến đổi nào có thể liên quan?\u003c/span>","o":["結晶 Kết tinh","塑性 Tính dẻo","氫化 Hydro hóa","氧化 Oxy hóa"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 部分氧化後的醛、酮等可產生異味；氣味是線索，不能用「沒味道」就保證完全沒有氧化。\u003cspan class=\"vn\" lang=\"vi\">Một số aldehyde, ketone sau oxy hóa có thể gây mùi lạ; mùi là dấu hiệu, không mùi không bảo đảm chưa oxy hóa.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：油耗味可能和油脂氧化有關。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Mùi ôi có thể liên quan oxy hóa lipid.\u003c/span>\u003c/div>"},{"q":"「fǎnshì zhīfáng」是哪個詞？\u003cspan class=\"vn\" lang=\"vi\">\"fǎnshì zhīfáng\" là từ nào?\u003c/span>","o":["飽和脂肪 Chất béo no","順式脂肪 Chất béo cis","反式脂肪 Chất béo trans","脂肪酸 Axit béo"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 反式仍有雙鍵，與飽和不同。台灣禁用食品原料中的部分氫化油，不等於所有來源反式脂肪一律不存在。\u003cspan class=\"vn\" lang=\"vi\">Trans vẫn có nối đôi, khác chất béo no. Đài Loan cấm nguyên liệu dầu hydro hóa một phần, không có nghĩa trans từ mọi nguồn đều không tồn tại.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：反式與飽和是不同分類。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Trans và no là phân loại khác nhau.\u003c/span>\u003c/div>"},{"q":"哪一組是本課所學的兩個必需脂肪酸？\u003cspan class=\"vn\" lang=\"vi\">Cặp nào là hai axit béo thiết yếu học trong bài?\u003c/span>","o":["油酸＋硬脂酸 Oleic + stearic","所有 ω-3＋所有 ω-6 Mọi omega-3 + mọi omega-6","棕櫚酸＋油酸 Palmitic + oleic","亞麻油酸 LA＋α-次亞麻油酸 ALA Linoleic + alpha-linolenic"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> LA 與 ALA 需由飲食取得。ω-3、ω-6 是家族名稱，不能把家族裡每一種脂肪酸都叫成必需。\u003cspan class=\"vn\" lang=\"vi\">LA và ALA cần lấy từ thức ăn. Omega-3 và omega-6 là tên nhóm, không gọi mọi thành viên là thiết yếu.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：LA 和 ALA 是必需脂肪酸。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: LA và ALA là axit béo thiết yếu.\u003c/span>\u003c/div>"},{"q":"同一份奶油冷藏後較硬，較合理的解釋是？\u003cspan class=\"vn\" lang=\"vi\">Cùng một phần bơ cứng hơn sau để ngăn mát, giải thích nào hợp lý hơn?\u003c/span>","o":["證明已氧化 Chứng minh đã oxy hóa","溫度改變固液比例與晶體網絡 Nhiệt độ đổi tỷ lệ rắn–lỏng và mạng tinh thể","脂肪酸數目一定增加 Số axit béo chắc tăng","所有奶油在任何溫度都一樣 Mọi bơ giống nhau ở mọi nhiệt độ"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 同一組成的油脂，溫度會影響結晶與固體比例。回溫較容易操作不等於越軟越好，完全融化也不同於塑性。\u003cspan class=\"vn\" lang=\"vi\">Nhiệt độ ảnh hưởng kết tinh và tỷ lệ rắn của cùng chất béo. Ấm hơn dễ thao tác không có nghĩa càng mềm càng tốt; tan hoàn toàn khác dẻo.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：溫度會影響奶油的固液比例。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Nhiệt độ ảnh hưởng tỷ lệ rắn–lỏng của bơ.\u003c/span>\u003c/div>"},{"q":"台灣食品業炸油的總極性化合物剛好達 25%，應怎麼做？\u003cspan class=\"vn\" lang=\"vi\">Dầu chiên cơ sở thực phẩm tại Đài Loan vừa đạt 25% hợp chất phân cực tổng, cần làm gì?\u003c/span>","o":["等到超過 25% 才處理 Đợi vượt 25% mới xử lý","加入新油就保證恢復 Chỉ thêm dầu mới là bảo đảm phục hồi","只要沒有味道就繼續用 Không mùi thì dùng tiếp","全部更換新油，不再使用 Thay toàn bộ dầu mới, không dùng tiếp"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> GHP 附件二規定「達」25% 就應全部換新，不是超過才處理。此數字是總極性化合物，不是酸價或 POV。\u003cspan class=\"vn\" lang=\"vi\">GHP Phụ lục 2 yêu cầu thay toàn bộ khi đạt 25%, không chờ vượt. Số này là hợp chất phân cực tổng, không phải AV hay POV.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：達到 25%，就要全部換新油。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Đạt 25% thì phải thay toàn bộ dầu mới.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://law.moj.gov.tw/LawClass/LawGetFile.ashx?FileId=0000397353&lan=C\" target=\"_blank\" rel=\"noopener\">台灣炸油範圍 / Dầu chiên Đài Loan: GHP 附件二第 5 點 ↗\u003c/a>\u003c/p>"},{"q":"同一批餅乾要減少光照與氧氣影響，哪種包裝較合適？\u003cspan class=\"vn\" lang=\"vi\">Cùng mẻ bánh quy muốn giảm ánh sáng và oxy, bao bì nào phù hợp hơn?\u003c/span>","o":["透明開口袋 Túi trong để mở","只遮光但一直敞開 Chỉ che sáng nhưng luôn mở","遮光且阻氧、密封良好的包裝 Bao bì che sáng, cản oxy, kín tốt","只看袋子顏色，不看密封 Chỉ xem màu, không xem độ kín"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 深色不自動等於阻氧，密封也不自動等於完全無氧。包材、封口與儲存條件要一起看；餅乾還需要防潮。\u003cspan class=\"vn\" lang=\"vi\">Màu sẫm không tự bằng cản oxy, kín cũng không có nghĩa hoàn toàn không oxy. Cần xem vật liệu, đường kín và bảo quản; bánh còn cần chống ẩm.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：我會選遮光、阻氧又防潮的包裝。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tôi sẽ chọn bao bì che sáng, cản oxy và chống ẩm.\u003c/span>\u003c/div>"},{"q":"主要重新安排三酸甘油酯中脂肪酸分布的是哪個方法？\u003cspan class=\"vn\" lang=\"vi\">Cách nào chủ yếu sắp xếp lại phân bố axit béo trong triacylglycerol?\u003c/span>","o":["酯交換 Trao đổi este","分提 Phân đoạn","部分氫化 Hydro hóa một phần","脫色 Tẩy màu"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 酯交換重排分布；分提是分離不同部分，氫化則改變雙鍵。酯交換本身不以生成反式雙鍵為機制，但不能直接保證成品零反式。\u003cspan class=\"vn\" lang=\"vi\">Trao đổi este sắp xếp lại phân bố; phân đoạn tách các phần, hydro hóa đổi nối đôi. Bản thân trao đổi este không tạo trans theo cơ chế, nhưng không tự bảo đảm thành phẩm bằng không.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：酯交換改變脂肪酸的分布。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Trao đổi este đổi phân bố axit béo.\u003c/span>\u003c/div>"},{"q":"某油的 POV 比之前低，可以直接說什麼？\u003cspan class=\"vn\" lang=\"vi\">POV của dầu thấp hơn trước, có thể kết luận ngay gì?\u003c/span>","o":["一定更新鮮 Chắc chắn tươi hơn","氧化完全倒轉了 Oxy hóa hoàn toàn đảo ngược","資料不足，初期產物可能已分解 Chưa đủ dữ liệu, sản phẩm ban đầu có thể đã phân hủy","所有品質指標都合格 Mọi chỉ số chất lượng đều đạt"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> POV 主要看初期過氧化物。它們可形成也可分解，所以低值或下降都不能單獨證明品質恢復；要配合其他資料。\u003cspan class=\"vn\" lang=\"vi\">POV chủ yếu xét peroxide ban đầu. Chúng có thể hình thành và phân hủy nên giá trị thấp hay giảm không tự chứng minh phục hồi; cần dữ liệu khác.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：POV 低，不一定代表新鮮。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: POV thấp không nhất thiết là tươi.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.5851/kosfa.2020.e54\" target=\"_blank\" rel=\"noopener\">POV 侷限 / Giới hạn POV: 2020 油炸研究 ↗\u003c/a>\u003c/p>"},{"q":"食品配方中的抗氧化系統主要能做什麼？\u003cspan class=\"vn\" lang=\"vi\">Hệ chống oxy hóa trong công thức chủ yếu làm gì?\u003c/span>","o":["保證永遠不壞 Bảo đảm không bao giờ hỏng","延緩氧化，不能讓酸敗油脂復原 Làm chậm oxy hóa, không phục hồi dầu đã ôi","取代所有包裝與保存措施 Thay mọi bao bì và bảo quản","把反式脂肪全部變順式 Đổi mọi trans thành cis"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 抗氧化系統需配合原料、包裝與儲存，效果依配方而異。它不是把劣變反應倒轉，也不能單獨決定保存期限。\u003cspan class=\"vn\" lang=\"vi\">Hệ chống oxy hóa cần kết hợp nguyên liệu, bao bì và bảo quản; hiệu quả tùy công thức. Không đảo ngược biến đổi hay tự quyết định hạn dùng.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：抗氧化只能延緩，還要配合保存。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Chống oxy hóa chỉ làm chậm, còn cần bảo quản phù hợp.\u003c/span>\u003c/div>"}]}]}],"a2":true};</script>
<script>
/*
 * runtime.client.js — 跑在瀏覽器裡的渲染器（17 週共用，逐字內嵌進每份 HTML）
 * 讀 window.__LESSON__ 的資料，把 modules / blocks 畫出來。
 * 互動行為（翻卡、展開、配對、測驗）沿用週1 手寫版的做法，不要另創一套。
 */
(function () {
  var D = window.__LESSON__;
  var SERIES = D.series;
  var $ = function (s) { return document.querySelector(s); };
  // 國合班 A2 版（D.a2）：介面文字加越南文；一般班 U() 只回中文，畫面與原本完全相同
  var A2 = !!D.a2;
  function U(zh, vn) { return A2 ? zh + " " + vn : zh; }

  /* ---------- 學習歷程記錄（Supabase） ----------
     只在 lesson.js 注入 D.track = {url, key} 的週次啟用（lib/tracking.json 的 weeks）；
     其他週 TRACK.on 為 false，send() 是空函式，教材行為完全不變。
     只送「學號代碼」與互動事件，不送姓名。送失敗就丟掉，不重試、不阻擋教材。 */
  var CTX = { mod: null, bi: 0 };   // 目前正在渲染的模組 id 與區塊序號（render 是同步的）
  var TRACK = (function () {
    var cfg = D.track;
    var noop = function () {};
    if (!cfg || !cfg.url || !cfg.key) return { on: false, send: noop, flush: noop, code: function () { return ""; }, setCode: noop };
    var KEY = "ifs_code", DKEY = "ifs_device";
    var rnd = function () { return Math.random().toString(36).slice(2, 10); };
    var sid = rnd() + Date.now().toString(36);
    // device_id：同一支手機／瀏覽器跨次開頁不變。學生後來才填學號代碼時，先前的 anon 事件可靠它回接。
    var did = "";
    try { did = localStorage.getItem(DKEY) || ""; if (!did) { did = "d" + rnd() + rnd(); localStorage.setItem(DKEY, did); } } catch (e) { did = "d" + rnd(); }
    var q = [], timer = null;
    function code() { try { return (localStorage.getItem(KEY) || "").trim(); } catch (e) { return ""; } }
    function setCode(v) { try { localStorage.setItem(KEY, (v || "").trim().slice(0, 20)); } catch (e) {} }
    function cut(s, n) { return s == null ? null : String(s).slice(0, n); }
    // 欄位長度與 payload 大小在前端先截到資料表 CHECK 的上限：PostgREST 批次 INSERT 是原子的，
    // 一筆違反 CHECK 整批都會被拒，而我們失敗即丟，會靜默掉整個 4 秒窗口。
    function send(event, mod, block, payload) {
      var p = payload || {};
      var ps = JSON.stringify(p);
      if (ps.length > 1800) p = { trunc: true, keys: Object.keys(p).slice(0, 10) };
      q.push({
        student_code: cut(code(), 20) || "anon", device_id: cut(did, 40), week: D.week || 0,
        module_id: cut(mod, 30), block_type: cut(block, 10), event: cut(event, 30),
        payload: p, session_id: cut(sid, 40), build: cut(D.build, 16), client_ts: new Date().toISOString(),
      });
      if (q.length >= 40) flush();
      else if (!timer) timer = setTimeout(flush, 4000);
    }
    function flush() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!q.length) return;
      var body = JSON.stringify(q.splice(0, 50));
      try {
        fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/ifs_lesson_events", {
          method: "POST", keepalive: true, body: body,
          headers: { "Content-Type": "application/json", "apikey": cfg.key, "Prefer": "return=minimal" },
        }).catch(noop);
      } catch (e) { /* 舊瀏覽器沒有 fetch：不記錄 */ }
      if (q.length) timer = setTimeout(flush, 1000);
    }
    window.addEventListener("pagehide", flush);
    return { on: true, send: send, flush: flush, code: code, setCode: setCode };
  })();

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function colorAt(given, i) { return given || SERIES[i % SERIES.length]; }
  function gridCls(n) { return "grid g" + (n === 2 || n === 3 || n === 4 ? n : 3); }
  function listHtml(v) {
    // body 可以是字串或字串陣列；陣列渲染成 <ul>
    if (v == null) return "";
    if (typeof v === "string") return '<p>' + v + '</p>';
    return '<ul>' + v.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
  }

  /* ---------- 區塊標題 ---------- */
  function heading(frag, b) {
    if (b.title) frag.appendChild(el("div", "sec-title", '<span class="bar"></span>' + b.title));
    if (b.hint) frag.appendChild(el("div", "hint", b.hint));
  }

  /* ---------- 各區塊 ---------- */
  var BLOCKS = {};

  BLOCKS.flips = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (d, i) {
      var c = colorAt(d.c, i);
      var card = el("div", "flip");
      if (b.h) card.style.height = b.h + "px";
      card.innerHTML =
        '<div class="flip-in">' +
        '<div class="face front"><div class="cbar" style="background:' + c + '"></div>' +
        '<div class="t">' + d.t + '</div><div class="en">' + (d.en || "") + '</div>' +
        '<div class="tap">▸ ' + U("點我看解釋", "Chạm để xem") + '</div></div>' +
        '<div class="face back"><div class="cbar" style="background:' + c + '"></div>' +
        '<p>' + d.b + '</p></div></div>';
      var mod = CTX.mod, bi = CTX.bi;
      card.onclick = function () {
        if (card.classList.toggle("on")) TRACK.send("flip_open", mod, "flips", { b: bi, i: i, t: d.t });
      };
      g.appendChild(card);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.exp = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div");
    b.items.forEach(function (t, i) {
      var box = el("div", "exp");
      var res = t.res ? '<div style="margin-top:10px;font-size:13px;color:var(--secondary);font-weight:700">🔗 ' + t.res + '</div>' : "";
      box.innerHTML =
        '<button><span class="num">' + (i + 1) + '</span><span>' + t.h + '</span>' +
        '<span class="tag">' + (t.tag || "") + '</span><span class="chev">›</span></button>' +
        '<div class="body">' + listHtml(t.body) + res + '</div>';
      var body = box.querySelector(".body");
      var mod = CTX.mod, bi = CTX.bi;
      box.querySelector("button").onclick = function () {
        var on = box.classList.toggle("on");
        if (!on) { body.style.maxHeight = "0px"; return; }
        TRACK.send("exp_open", mod, "exp", { b: bi, i: i, h: t.h });
        // 用實際內容高度展開，避免長段落被固定 max-height 截掉。
        // 必須先解除 max-height 再量：在 max-height:0 的狀態下量 scrollHeight 會得到 0，
        // 面板就只會開一條縫（實測過）。量完歸零並強制重排，transition 才有起點。
        body.style.maxHeight = "none";
        var h = body.scrollHeight;
        body.style.maxHeight = "0px";
        void body.offsetHeight;
        body.style.maxHeight = h + "px";
      };
      host.appendChild(box);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.cards = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var box = el("div", "card");
      box.style.borderTop = "4px solid " + accent;
      box.innerHTML = '<div class="h">' + c.h + '</div>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        (c.li ? '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>' : "") +
        (c.p ? '<p style="margin-top:8px;font-size:15.5px;color:var(--mid)">' + c.p + '</p>' : "");
      g.appendChild(box);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.timeline = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "tl");
    b.steps.forEach(function (s, i) {
      var st = el("div", "step");
      st.innerHTML = '<div class="dot" style="background:' + colorAt(s.c, i) + '">' + (i + 1) + '</div>' +
        '<h4>' + s.h + '</h4><p>' + s.p + '</p>';
      host.appendChild(st);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.compare = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "cmp");
    [b.left, b.right].forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var col = el("div", "col");
      col.innerHTML = '<div class="cbar" style="background:' + accent + '"></div>' +
        '<h4 style="color:' + accent + '">' + c.h + '</h4>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
      wrap.appendChild(col);
    });
    f.appendChild(wrap);
    if (b.note) f.appendChild(el("div", "cmp-note", b.note));
    return f;
  };

  BLOCKS.table = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "tblwrap");
    var html = '<table class="tbl"><thead><tr>' +
      b.head.map(function (h) { return '<th>' + h + '</th>'; }).join("") + '</tr></thead><tbody>' +
      b.rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join("") + '</tr>';
      }).join("") + '</tbody></table>';
    wrap.innerHTML = html;
    f.appendChild(wrap); return f;
  };

  BLOCKS.note = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    f.appendChild(el("div", "note" + (b.kind ? " " + b.kind : ""), b.text));
    return f;
  };

  BLOCKS.match = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "match-wrap");
    var pool = el("div", "pool"), targets = el("div", "targets");
    var pairs = b.pairs;
    var order = pairs.slice().sort(function () { return Math.random() - 0.5; });
    var selected = null, solved = 0, errors = 0, t0 = null;
    var mod = CTX.mod, bi = CTX.bi;
    var msg = el("div");
    msg.style.cssText = "margin-top:14px;font-weight:700;color:var(--green)";

    function tryMatch(slot, key) {
      if (slot.classList.contains("ok")) return;
      if (t0 === null) t0 = Date.now();
      if (slot.dataset.k === key) {
        slot.classList.add("ok"); slot.classList.remove("bad");
        slot.querySelector(".drop").textContent = key;
        var chip = pool.querySelector('.chip[data-k="' + key + '"]');
        chip.classList.add("used"); chip.classList.remove("sel");
        selected = null; solved++;
        TRACK.send("match_ok", mod, "match", { b: bi, label: key });
        if (solved === pairs.length) {
          msg.textContent = b.done || U("✓ 全部答對！", "Đúng hết!");
          TRACK.send("match_done", mod, "match", { b: bi, n: pairs.length, errors: errors, ms: Date.now() - t0 });
        }
      } else {
        errors++;
        TRACK.send("match_bad", mod, "match", { b: bi, label: key, slot: slot.dataset.k });
        slot.classList.add("bad");
        setTimeout(function () { slot.classList.remove("bad"); }, 350);
      }
    }
    order.forEach(function (q) {
      var c = el("div", "chip"); c.textContent = q.label; c.draggable = true; c.dataset.k = q.label;
      c.addEventListener("dragstart", function (e) { e.dataTransfer.setData("k", q.label); });
      c.onclick = function () {
        if (c.classList.contains("used")) return;
        if (selected === c) { c.classList.remove("sel"); selected = null; return; }
        pool.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("sel"); });
        c.classList.add("sel"); selected = c;
      };
      pool.appendChild(c);
    });
    pairs.forEach(function (q) {
      var s = el("div", "slot"); s.dataset.k = q.label;
      s.innerHTML = '<div class="drop">' + U("拖到這裡", "Kéo vào đây") + '</div><div class="desc">' + q.desc + '</div>';
      s.addEventListener("dragover", function (e) { e.preventDefault(); });
      s.addEventListener("drop", function (e) { e.preventDefault(); tryMatch(s, e.dataTransfer.getData("k")); });
      s.onclick = function () { if (selected) tryMatch(s, selected.dataset.k); };
      targets.appendChild(s);
    });
    host.appendChild(pool); host.appendChild(targets); host.appendChild(msg);
    f.appendChild(host); return f;
  };

  /* 結果代碼：把作答結果編成一串可貼給老師的代碼（FSQ1.<base64>.<檢查碼>）。
     解碼與彙整用專案根目錄的「食品科學概論_測驗成績解碼器.html」。 */
  function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
  function checksum(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1679616; // 36^4
    return h.toString(36);
  }

  BLOCKS.quiz = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var items = b.items, n = items.length;
    var head = el("div", "quiz-head");
    head.innerHTML =
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
      '<input class="qid" placeholder="' + U("學號（交成績必填）", "Mã số SV") + '" style="flex:1;min-width:130px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px">' +
      '<input class="qname" placeholder="' + U("姓名", "Họ tên") + '" style="flex:1;min-width:100px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px"></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
      '<strong class="qprog">' + U("進度", "Tiến độ") + ' 0 / ' + n + '</strong>' +
      '<span class="qscore" style="color:var(--secondary);font-weight:800">' + U("得分", "Điểm") + ' 0</span></div>' +
      '<div class="pbar"><div class="pfill"></div></div>';
    var box = el("div");
    var sb = el("div", "scorebox");
    sb.innerHTML = '<div>' + U("你的成績", "Điểm của bạn") + '</div><div class="big"><span class="fscore">0</span> / ' + n + '</div>' +
      '<div class="smsg" style="margin:8px 0 16px"></div>' +
      '<div class="rcwrap" style="margin:0 auto 16px;max-width:560px;text-align:left">' +
      '<div style="font-weight:700;margin-bottom:6px">' + U("結果代碼（請複製後，貼到老師指定的表單或訊息）", "— Mã kết quả: sao chép và gửi cho thầy/cô") + '</div>' +
      '<textarea class="rcode" readonly rows="3" style="width:100%;box-sizing:border-box;font-family:monospace;font-size:12px;padding:8px;border:1.5px solid var(--line,#ccc);border-radius:8px;resize:none"></textarea>' +
      '<div class="rmsg" style="font-size:13px;color:#B34700;margin-top:4px"></div>' +
      '<button class="btn copyrc" style="margin-top:8px">📋 ' + U("複製結果代碼", "Sao chép mã") + '</button></div>' +
      '<button class="btn ghost">' + U("重新測驗", "Làm lại") + '</button>';

    var answered = 0, score = 0, picks = [], qt0 = null, attempt = 0;
    var mod = CTX.mod, bi = CTX.bi;
    // 測驗的學號欄與頁首的學號代碼同步（兩邊填任一邊都行）
    var qidInput = head.querySelector(".qid");
    if (TRACK.on) {
      if (TRACK.code()) qidInput.value = TRACK.code();
      qidInput.addEventListener("change", function () {
        TRACK.setCode(qidInput.value);
        var top = $("#ifs-code"); if (top) top.value = TRACK.code();
      });
    }
    function updateProg() {
      head.querySelector(".qprog").textContent = U("進度", "Tiến độ") + " " + answered + " / " + n;
      head.querySelector(".qscore").textContent = U("得分", "Điểm") + " " + score;
      head.querySelector(".pfill").style.width = (answered / n * 100) + "%";
    }
    function finish() {
      sb.querySelector(".fscore").textContent = score;
      var pct = score / n, m;
      if (score === n) m = U("這 10 題全對！再說明餅乾的口感與油脂保存條件。", "Đúng cả 10 câu! Hãy giải thích kết cấu bánh quy và điều kiện bảo quản chất béo.");
      else if (pct >= 0.8) m = U("很棒！觀念相當扎實。", "Rất tốt!");
      else if (pct >= 0.6) m = U("不錯，再複習幾個弱點就更好。", "Khá tốt, ôn lại vài chỗ nữa nhé.");
      else m = U("建議回到前面單元再看一次翻卡與展開內容。", "Hãy xem lại các phần phía trước.");
      sb.querySelector(".smsg").textContent = m;

      var sid = head.querySelector(".qid").value.trim();
      var sname = head.querySelector(".qname").value.trim();
      var korr = items.map(function (item, i) { return picks[i] === item.a ? 1 : 0; }).join("");
      var payload = JSON.stringify({
        w: D.week || 0, c: A2 ? "a2" : undefined, id: sid, nm: sname, s: score, n: n,
        a: picks, k: korr, t: new Date().toISOString().slice(0, 16),
      });
      var body = b64utf8(payload);
      var code = "FSQ1." + body + "." + checksum(body);
      sb.querySelector(".rcode").value = code;
      sb.querySelector(".rmsg").textContent = sid ? "" : U("⚠ 尚未填學號 —— 請回到測驗上方填入學號後重新測驗，否則老師無法登記成績。", "Chưa nhập mã số SV: hãy nhập ở trên rồi làm lại.");
      TRACK.send("quiz_done", mod, "quiz", { b: bi, attempt: attempt, score: score, n: n, picks: picks, ms: qt0 ? Date.now() - qt0 : null });
      TRACK.flush();

      sb.classList.add("show");
      sb.scrollIntoView({ behavior: "smooth" });
    }
    function pick(qel, item, oi) {
      if (qel.dataset.done === "1") return;
      qel.dataset.done = "1"; answered++;
      if (qt0 === null) qt0 = Date.now();
      picks[parseInt(qel.dataset.qi, 10)] = oi;
      TRACK.send("quiz_answer", mod, "quiz", { b: bi, attempt: attempt, qi: parseInt(qel.dataset.qi, 10), pick: oi, ok: oi === item.a });
      qel.querySelectorAll(".opt").forEach(function (btn, i) {
        btn.classList.add("dim");
        if (i === item.a) btn.classList.add("correct");
        if (i === oi && oi !== item.a) btn.classList.add("wrong");
      });
      var fb = qel.querySelector(".fb");
      if (oi === item.a) { score++; fb.classList.add("good"); fb.innerHTML = U("✓ 正確！", "Đúng!") + item.e; }
      else { fb.classList.add("no"); fb.innerHTML = U("✗ 正解：", "Sai. Đáp án:") + item.o[item.a] + "。" + item.e; }
      fb.classList.add("show"); updateProg();
      if (answered === n) finish();
    }
    function build() {
      box.innerHTML = ""; answered = 0; score = 0; picks = []; qt0 = null; attempt++; updateProg();
      sb.classList.remove("show");
      items.forEach(function (item, qi) {
        var qel = el("div", "q"); qel.dataset.done = "0"; qel.dataset.qi = qi;
        qel.innerHTML = '<div class="qn">第 ' + (qi + 1) + ' 題' + (A2 ? ' · Câu ' + (qi + 1) : '') + '</div><div class="qt">' + item.q + '</div>';
        item.o.forEach(function (opt, oi) {
          var btn = el("button", "opt"); btn.textContent = opt;
          btn.onclick = function () { pick(qel, item, oi); };
          qel.appendChild(btn);
        });
        qel.appendChild(el("div", "fb"));
        box.appendChild(qel);
      });
    }
    sb.querySelector(".copyrc").onclick = function () {
      var ta = sb.querySelector(".rcode");
      ta.select(); ta.setSelectionRange(0, 99999);
      var btn = this;
      function ok() { btn.textContent = U("✓ 已複製，請貼給老師", "Đã sao chép"); setTimeout(function () { btn.textContent = "📋 " + U("複製結果代碼", "Sao chép mã"); }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(ta.value).then(ok, function () { document.execCommand("copy"); ok(); });
      else { document.execCommand("copy"); ok(); }
    };
    sb.querySelector(".ghost").onclick = function () {
      build(); window.scrollTo({ top: 0, behavior: "smooth" });
    };
    build();
    f.appendChild(head); f.appendChild(box); f.appendChild(sb);
    return f;
  };

  /* ---------- 組裝 ---------- */
  var nav = $("#nav"), main = $("#main");
  var curMod = D.modules.length ? D.modules[0].id : null, modT0 = Date.now();
  function switchMod(id, btn) {
    document.querySelectorAll(".module").forEach(function (m) { m.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
    nav.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
    btn.classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (id !== curMod) {
      TRACK.send("module_view", id, null, { from: curMod, ms: Date.now() - modT0 });
      curMod = id; modT0 = Date.now();
    }
  }
  D.modules.forEach(function (m, i) {
    var btn = el("button", i === 0 ? "active" : "", m.nav);
    btn.onclick = function () { switchMod(m.id, btn); };
    nav.appendChild(btn);

    var sec = el("section", "module" + (i === 0 ? " active" : ""));
    sec.id = m.id;
    sec.appendChild(el("div", "lead",
      '<div class="kicker">' + m.kicker + '</div><h2>' + m.h2 + '</h2><p>' + m.lead + '</p>'));
    m.blocks.forEach(function (b, bi) {
      var render = BLOCKS[b.type];
      if (!render) { console.error("未知區塊型別:", b.type); return; }
      CTX.mod = m.id; CTX.bi = bi;
      sec.appendChild(render(b));
    });
    main.appendChild(sec);
  });

  /* ---------- 學號代碼列（只在啟用記錄的週出現） ---------- */
  if (TRACK.on) {
    var bar = el("div", "codebar");
    bar.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;font-size:14px";
    bar.innerHTML = '<label for="ifs-code" style="font-weight:700">學號代碼</label>' +
      '<input id="ifs-code" maxlength="20" placeholder="例：S001" style="width:120px;padding:6px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:14px">' +
      '<span style="opacity:.75">只記錄你的學習歷程（翻卡、配對、測驗），不需要姓名。</span>';
    nav.parentNode.insertBefore(bar, nav);
    var inp = bar.querySelector("#ifs-code");
    inp.value = TRACK.code();
    inp.addEventListener("change", function () {
      TRACK.setCode(inp.value);
      document.querySelectorAll(".qid").forEach(function (x) { x.value = TRACK.code(); });
      TRACK.send("code_set", null, null, {});
    });
    TRACK.send("session_start", curMod, null, {
      device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || "") ? "mobile" : "desktop",
      w: window.innerWidth, build: D.build || null,
    });
    // 停留時間以「頁面可見」為準：切到背景就結算一段 module_leave，回來重新計時。
    // 手機瀏覽器殺分頁常不觸發 pagehide，所以以 visibilitychange→hidden 為主。
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        TRACK.send("module_leave", curMod, null, { ms: Date.now() - modT0 }); TRACK.flush();
      } else {
        modT0 = Date.now();
      }
    });
  }
})();
</script>
</body>
</html>
