<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品科學概論 第17週 · 國合班互動練習</title>
<style>
  :root{
    --primary:#2D2A6E; --secondary:#5B4FB8; --accent:#00B8B8; --warm:#F5A623; --green:#2FA36B; --red:#D65B5B; --dark:#1A1A3E; --bg:#F4F5FA; --text:#1F1F2E; --mid:#5A5A75; --muted:#9096ac; --border:#E2E2EC; --card:#fff;
  }
/* 版型樣式 — 逐條取自「第1週_互動教學.html」，末段為新增區塊（cmp / tbl / note）。
   這裡只用 var(--x)；色票由 tokens.js 產生 :root 注入。 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:17px}
header{background:linear-gradient(120deg,var(--dark),var(--primary));color:#fff;
  padding:26px 22px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(0,0,0,.15)}
header h1{font-size:31px;font-weight:800;letter-spacing:.5px}
header .sub{color:#b9c7ff;font-size:16px;margin-top:5px}
nav{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.10);color:#dfe4ff;border:none;padding:12px 18px;
  border-radius:10px 10px 0 0;font-size:16.5px;cursor:pointer;font-weight:600;transition:.15s}
nav button:hover{background:rgba(255,255,255,.2)}
nav button.active{background:var(--bg);color:var(--primary)}
main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
.module{display:none;animation:fade .35s}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead{background:var(--dark);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:22px}
.lead .kicker{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px}
.lead h2{font-size:26px;margin:6px 0 8px}
.lead p{color:#cdd3ee;font-size:16.5px}
.sec-title{font-size:23px;font-weight:800;color:var(--primary);margin:30px 0 6px;
  display:flex;align-items:center;gap:10px}
.sec-title .bar{width:6px;height:25px;background:var(--accent);border-radius:3px;display:inline-block}
.hint{color:var(--mid);font-size:15px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* flip cards */
.flip{perspective:1100px;height:200px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px rgba(30,30,60,.08);border:1px solid var(--border)}
.front{background:var(--card)}
.front .t{font-size:21px;font-weight:800;color:var(--primary)}
.front .en{color:var(--muted);font-size:14px;margin-top:3px;font-style:italic}
.front .tap{margin-top:auto;color:var(--accent);font-size:14px;font-weight:700}
.back{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;transform:rotateY(180deg);overflow:auto}
.back p{font-size:16px}
.cbar{height:6px;border-radius:14px 14px 0 0;position:absolute;top:0;left:0;right:0}

/* expandable */
.exp{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.exp>button{width:100%;text-align:left;background:none;border:none;padding:16px 18px;cursor:pointer;
  display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;color:var(--text)}
.exp .num{background:var(--primary);color:#fff;min-width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.exp .chev{margin-left:auto;color:var(--muted);transition:.25s;font-size:20px}
.exp.on .chev{transform:rotate(90deg);color:var(--accent)}
.exp .body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 18px}
.exp.on .body{padding:0 18px 16px 62px}
.exp .body ul{margin-left:16px;color:var(--mid);font-size:16px}
.exp .body p{color:var(--mid);font-size:15.5px}
.exp .tag{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:8px}

/* info card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.card .h{font-weight:800;color:var(--primary);font-size:18px;margin-bottom:6px}
.card .en{color:var(--muted);font-size:13px;font-style:italic}
.card ul{margin:8px 0 0 18px;font-size:15.5px;color:var(--mid)}

/* timeline */
.tl{display:flex;gap:0;flex-wrap:wrap;counter-reset:s}
.tl .step{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 14px 14px;margin:8px;position:relative}
.tl .dot{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;margin-bottom:8px}
.tl .step h4{color:var(--primary);font-size:17.5px;margin-bottom:4px}
.tl .step p{font-size:15px;color:var(--mid)}

/* matching */
.match-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.pool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--secondary);color:#fff;padding:10px 17px;border-radius:22px;font-weight:700;
  cursor:grab;user-select:none;font-size:16.5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chip.used{opacity:.35;pointer-events:none}
.chip.sel{outline:3px solid var(--warm);outline-offset:2px}
.targets{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;border:2px dashed var(--border);border-radius:12px;padding:10px 14px;background:#fafbff}
.slot .desc{flex:1;font-size:16px;color:var(--text)}
.slot .drop{min-width:130px;min-height:44px;border-radius:8px;background:#eef0f8;display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:15px;padding:8px 12px}
.slot.ok{border-color:var(--green);background:#effaf3}
.slot.ok .drop{background:var(--green);color:#fff;font-weight:700}
.slot.bad{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* quiz */
.quiz-head{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.pbar{height:12px;background:#e7e9f4;border-radius:8px;overflow:hidden;margin-top:10px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--secondary));transition:width .4s}
.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.q .qn{color:var(--accent);font-weight:800;font-size:14px}
.q .qt{font-size:19.5px;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fafbff;border:2px solid var(--border);
  border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;font-size:16.5px;transition:.15s}
.opt:hover{border-color:var(--secondary)}
.opt.correct{border-color:var(--green);background:#effaf3;font-weight:700}
.opt.wrong{border-color:var(--red);background:#fdeeee}
.opt.dim{opacity:.6}
.fb{margin-top:8px;font-size:15.5px;padding:11px 14px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.good{background:#effaf3;color:#1c7a4d} .fb.no{background:#fdeeee;color:#a83b3b}
.scorebox{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:16px;
  padding:26px;text-align:center;margin-top:10px;display:none}
.scorebox.show{display:block}
.scorebox .big{font-size:46px;font-weight:800}
.btn{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:10px;
  font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.18)}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;background:#eef0fb;color:var(--secondary);padding:3px 10px;border-radius:20px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px}

/* ===== 新增區塊 ===== */
/* compare：兩欄對照（梅納 vs 焦糖化、冷藏 vs 冷凍…） */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media(max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 18px 18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06);position:relative;overflow:hidden}
.cmp .col .cbar{position:static;height:6px;margin:0 -18px 14px;border-radius:0}
.cmp .col h4{font-size:20px;font-weight:800;margin-bottom:2px}
.cmp .col .en{color:var(--muted);font-size:13px;font-style:italic;margin-bottom:8px}
.cmp .col ul{margin-left:18px;font-size:15.5px;color:var(--mid)}
.cmp .col li{margin-bottom:5px}
.cmp-note{margin-top:12px;background:#eef0fb;border-left:5px solid var(--secondary);
  border-radius:0 10px 10px 0;padding:12px 16px;font-size:16px;color:var(--primary);font-weight:600}

/* table：資料表（維生素、添加物分類…） */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px}
.tbl th{background:var(--primary);color:#fff;text-align:left;padding:12px 14px;font-weight:700;font-size:15px}
.tbl td{padding:11px 14px;border-top:1px solid var(--border);color:var(--mid);vertical-align:top}
.tbl tr:nth-child(even) td{background:#fafbff}
.tbl td:first-child{color:var(--text);font-weight:700}

/* note：重點提示條 */
.note{background:#fff8e9;border-left:5px solid var(--warm);border-radius:0 12px 12px 0;
  padding:14px 18px;margin:14px 0;font-size:16px;color:var(--text)}
.note b{color:var(--primary)}
.note.key{background:#effaf3;border-left-color:var(--green)}
.note.warn{background:#fdeeee;border-left-color:var(--red)}
/* 國合班 A2 互動練習：拼音與越南文（build_a2.js 產生的內容才會用到） */
.py{display:block;font-size:.78em;font-weight:500;color:var(--mid);margin-top:2px}
.vn{display:block;font-size:.88em;font-weight:500;color:var(--secondary);margin-top:2px}
/* Shared classroom tasks: oral response, sentence support, then sample explanation. */
.class-activity{display:grid;gap:12px;min-width:0}
.class-activity .vn{display:block;color:#0E7C7B;font-size:15px;line-height:1.5;margin-top:4px}
.activity-time{color:#0E7C7B;font-weight:700;font-size:15px}
.activity-prompt{font-size:clamp(18px,2.3vw,23px);line-height:1.5}
.sentence-stem{padding:12px 16px;background:#EFFAF3;border-left:5px solid #2FA36B;color:#1A1A3E;line-height:1.6}
.class-activity label{font-size:14px;color:#52526B}
.activity-response{display:block;width:100%;max-width:100%;min-height:72px;border:1.5px solid #A0A0B5;border-radius:8px;padding:10px 12px;resize:vertical;font:inherit;font-size:17px;background:#fff;color:#1F1F2E}
.activity-answer{border:1px solid #E2E2EC;background:#fff;border-radius:8px;padding:10px 14px;font-size:16px;line-height:1.5}
.activity-answer summary{cursor:pointer;font-weight:700;color:#2D2A6E}
.activity-answer p{margin-top:10px}
.activity-response:focus-visible,.activity-answer summary:focus-visible{outline:3px solid #0E7C7B;outline-offset:3px}
.source-note{font-size:13px;color:#52526B;line-height:1.5;overflow-wrap:anywhere;margin-top:10px}
.source-note .vn{display:block;color:#0E7C7B;font-size:13px}
.lesson-links{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.lesson-links a{color:inherit;text-underline-offset:3px}
.feedback-reason,.feedback-transfer{margin-top:6px}
.feedback-transfer{font-weight:600}
@media(max-width:640px){header{position:relative!important}.class-activity{gap:10px}}
@media print{.activity-response{min-height:64px}}


.back .vn{color:#D7FAF3}.tbl-wrap{overflow-x:auto}
</style>
</head>

<script>window.__LESSON__={"week":17,"series":["#2D2A6E","#2FA36B","#F5A623","#5B4FB8","#00B8B8","#D65B5B"],"modules":[{"id":"m0","nav":"今天 Hôm nay","kicker":"今天學什麼 · Hôm nay học gì","h2":"食品安全、法規與品質管制","lead":"shípǐn ānquán, fǎguī yǔ pǐnzhí guǎnzhì　·　An toàn thực phẩm, pháp quy và kiểm soát chất lượng","blocks":[{"type":"cards","title":"今天學三件事\u003cspan class=\"vn\" lang=\"vi\">Hôm nay học ba điều\u003c/span>","cols":3,"items":[{"h":"找危害\u003cspan class=\"vn\" lang=\"vi\">Tìm mối nguy\u003c/span>","p":"分出生物、化學、物理性危害。\u003cspan class=\"vn\" lang=\"vi\">Tách mối nguy sinh học, hóa học, vật lý.\u003c/span>","c":"#2D2A6E"},{"h":"管好製程\u003cspan class=\"vn\" lang=\"vi\">Kiểm soát quy trình\u003c/span>","p":"分清 CCP、監測、偏差處理與驗證。\u003cspan class=\"vn\" lang=\"vi\">Tách CCP, giám sát, xử lý sai lệch, thẩm tra.\u003c/span>","c":"#2D2A6E"},{"h":"選感官方法\u003cspan class=\"vn\" lang=\"vi\">Chọn phép thử cảm quan\u003c/span>","p":"有差別、差在哪裡、喜不喜歡分開問。\u003cspan class=\"vn\" lang=\"vi\">Hỏi riêng có khác, khác gì, có thích không.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"看影片：X 光檢查　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Xem video: kiểm tra bằng tia X\u003c/span>","text":"\u003ca href=\"https://www.youtube.com/watch?v=O21pKSXVi68&t=855s\" target=\"_blank\" rel=\"noopener\" style=\"font-weight:700\">▶ 每一根都照 X 光\u003c/a>\u003cspan class=\"vn\">Từng cây một đều được chiếu tia X\u003c/span>\u003cul style=\"margin:10px 0 0;padding-left:22px\">\u003cli>工廠用什麼機器檢查？\u003cspan class=\"vn\">Nhà máy dùng máy gì để kiểm tra?\u003c/span>\u003c/li>\u003cli>是抽查，還是每一根都查？\u003cspan class=\"vn\">Kiểm tra ngẫu nhiên hay kiểm tra từng cây?\u003c/span>\u003c/li>\u003cli>X 光想找出什麼東西？\u003cspan class=\"vn\">Tia X muốn tìm ra cái gì?\u003c/span>\u003c/li>\u003c/ul>觀察影片的檢查對象與流程。X 光檢查不能保證找出所有異物，也不代表已完成殺菌；效果要看異物、食品與設備的驗證。\u003cspan class=\"vn\" lang=\"vi\">Quan sát đối tượng, quy trình trong video. Kiểm tra tia X không bảo đảm tìm mọi vật lạ, không có nghĩa đã diệt khuẩn; hiệu quả tùy vật lạ, thực phẩm, kiểm chứng thiết bị.\u003c/span>"},{"type":"cards","title":"一盒雞肉餐盒：從危害到品質\u003cspan class=\"vn\" lang=\"vi\">Một hộp cơm gà: từ mối nguy đến chất lượng\u003c/span>","cols":3,"items":[{"h":"① 配方與危害\u003cspan class=\"vn\" lang=\"vi\">Công thức, mối nguy\u003c/span>","p":"教學虛擬餐盒含奶醬：想想病原菌、乳過敏原、碎片。\u003cspan class=\"vn\" lang=\"vi\">Hộp cơm giả định có xốt sữa: vi khuẩn gây bệnh, dị ứng sữa, mảnh vụn.\u003c/span>","c":"#2D2A6E"},{"h":"② 製程與紀錄\u003cspan class=\"vn\" lang=\"vi\">Quy trình, hồ sơ\u003c/span>","p":"原料→加熱→冷卻→包裝→冷藏；每一步分析危害。\u003cspan class=\"vn\" lang=\"vi\">Nguyên liệu→gia nhiệt→làm nguội→đóng gói→giữ lạnh; xét từng bước.\u003c/span>","c":"#2D2A6E"},{"h":"③ 改配方之後\u003cspan class=\"vn\" lang=\"vi\">Sau đổi công thức\u003c/span>","p":"新醬汁吃得出不同嗎？這與喜不喜歡是兩個問題。\u003cspan class=\"vn\" lang=\"vi\">Có nhận ra xốt mới khác không? Khác câu hỏi có thích không.\u003c/span>","c":"#2D2A6E"}]}]},{"id":"m1","nav":"生詞 Từ mới","kicker":"生詞 · Từ mới","h2":"本週生詞","lead":"10 個生詞　·　10 từ mới","blocks":[{"type":"flips","cols":3,"items":[{"t":"危害","en":"wéihài","b":"mối nguy"},{"t":"過敏原","en":"guòmǐnyuán","b":"chất gây dị ứng"},{"t":"衛生","en":"wèishēng","b":"vệ sinh"},{"t":"危害分析","en":"wéihài fēnxī","b":"phân tích mối nguy (HA)"},{"t":"追溯","en":"zhuīsù","b":"truy xuất nguồn gốc"}],"title":"翻卡：生詞　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Lật thẻ: từ mới\u003c/span>"},{"type":"flips","cols":3,"items":[{"t":"管制界限","en":"guǎnzhì jièxiàn","b":"giới hạn tới hạn (CL)"},{"t":"監測","en":"jiāncè","b":"giám sát"},{"t":"矯正措施","en":"jiǎozhèng cuòshī","b":"hành động khắc phục"},{"t":"感官評定","en":"gǎnguān píngdìng","b":"đánh giá cảm quan"},{"t":"三角測試","en":"sānjiǎo cèshì","b":"phép thử tam giác"}]},{"type":"match","title":"配對：中文 ↔ 越南文　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Ghép: tiếng Trung ↔ tiếng Việt\u003c/span>","pairs":[{"label":"危害","desc":"mối nguy"},{"label":"過敏原","desc":"chất gây dị ứng"},{"label":"衛生","desc":"vệ sinh"},{"label":"危害分析","desc":"phân tích mối nguy (HA)"},{"label":"追溯","desc":"truy xuất nguồn gốc"},{"label":"管制界限","desc":"giới hạn tới hạn (CL)"},{"label":"監測","desc":"giám sát"},{"label":"矯正措施","desc":"hành động khắc phục"},{"label":"感官評定","desc":"đánh giá cảm quan"},{"label":"三角測試","desc":"phép thử tam giác"}],"done":"✓ 全部答對！Đúng hết!"}]},{"id":"s1","nav":"一 食品的三種危害","kicker":"第一段 · Phần 1","h2":"危害與過敏原：找來源和控制","lead":"Mối nguy, dị ứng: tìm nguồn và kiểm soát","blocks":[{"type":"cards","title":"三類常見危害：先找來源\u003cspan class=\"vn\" lang=\"vi\">Ba nhóm mối nguy thường gặp: tìm nguồn\u003c/span>","cols":3,"items":[{"h":"生物性\u003cspan class=\"vn\" lang=\"vi\">Sinh học\u003c/span>","p":"如沙門氏菌、病毒等；看原料、交叉污染與溫度管理。\u003cspan class=\"vn\" lang=\"vi\">Như Salmonella, virus; xem nguyên liệu, nhiễm chéo, quản lý nhiệt.\u003c/span>","c":"#2D2A6E"},{"h":"化學性\u003cspan class=\"vn\" lang=\"vi\">Hóa học\u003c/span>","p":"如清潔劑殘留、毒素與過敏原；可能有急性或長期影響。\u003cspan class=\"vn\" lang=\"vi\">Như dư chất tẩy, độc tố, chất gây dị ứng; có thể cấp hoặc lâu dài.\u003c/span>","c":"#2D2A6E"},{"h":"物理性\u003cspan class=\"vn\" lang=\"vi\">Vật lý\u003c/span>","p":"如尖銳金屬、玻璃碎片；看大小、形狀與傷害可能。\u003cspan class=\"vn\" lang=\"vi\">Như kim loại sắc, mảnh kính; xét cỡ, hình, khả năng gây thương tích.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"危害是可能造成傷害的因子；風險還要看發生可能與嚴重程度。本課用三類框架，不把所有異物視為同等危險。\u003cspan class=\"vn\" lang=\"vi\">Mối nguy là tác nhân có thể gây hại; rủi ro còn xét khả năng và mức độ. Khóa học dùng ba nhóm, không coi mọi vật lạ nguy hiểm như nhau.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/good-hygiene-practices-haccp-toolbox/haccp/introduction-to-haccp/\" target=\"_blank\" rel=\"noopener\">危害分析框架 / Khung phân tích mối nguy: FAO ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"乳過敏原：殺菌不是解答\u003cspan class=\"vn\" lang=\"vi\">Dị ứng sữa: diệt khuẩn không là đáp án\u003c/span>","cols":3,"items":[{"h":"看配方與原料\u003cspan class=\"vn\" lang=\"vi\">Xem công thức, nguyên liệu\u003c/span>","p":"奶醬可能含乳蛋白；先核對原料資訊與配方。\u003cspan class=\"vn\" lang=\"vi\">Xốt sữa có thể có protein sữa; kiểm tra nguyên liệu, công thức.\u003c/span>","c":"#2D2A6E"},{"h":"防交叉接觸\u003cspan class=\"vn\" lang=\"vi\">Ngăn tiếp xúc chéo\u003c/span>","p":"分開管理、排程與有效清潔；不能只靠一般加熱。\u003cspan class=\"vn\" lang=\"vi\">Quản lý tách, lịch sản xuất, làm sạch hiệu quả; không chỉ gia nhiệt thường.\u003c/span>","c":"#2D2A6E"},{"h":"看完整標示\u003cspan class=\"vn\" lang=\"vi\">Xem đủ nhãn\u003c/span>","p":"依適用法規標示；「可能含有」不能取代必要管制。\u003cspan class=\"vn\" lang=\"vi\">Ghi nhãn theo luật áp dụng; “có thể chứa” không thay kiểm soát cần thiết.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"台灣包裝食品過敏原標示有指定品項與條件；本例只談乳，不列成完整清單。加熱對不同過敏蛋白的影響不同，不能當作可靠的通用去除方法。\u003cspan class=\"vn\" lang=\"vi\">Nhãn dị ứng thực phẩm đóng gói Đài Loan có nhóm, điều kiện cụ thể; ví dụ chỉ nói sữa, không là toàn bộ danh sách. Tác dụng nhiệt tùy protein, không là cách loại bỏ chung tin cậy.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/tc/newsContent.aspx?cid=4&id=t622859\" target=\"_blank\" rel=\"noopener\">台灣過敏原標示 / Nhãn dị ứng Đài Loan: TFDA ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 1｜餐盒裡的三個線索\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 1: ba dấu hiệu trong hộp cơm\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"hazards\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">虛擬雞肉餐盒：原料可能帶沙門氏菌、奶醬含乳蛋白、機器掉落尖銳金屬片。各是哪類危害？一般加熱能解決全部嗎？\u003cspan class=\"vn\" lang=\"vi\">Hộp cơm giả định: nguyên liệu có thể mang Salmonella, xốt có protein sữa, máy rơi mảnh kim loại sắc. Thuộc nhóm nào? Gia nhiệt thường xử lý hết không?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>＿＿是＿＿性危害；還需要＿＿管制。\u003cspan class=\"vn\" lang=\"vi\">___ là mối nguy ___; còn cần kiểm soát ___.\u003c/span>\u003c/div>\u003clabel for=\"a2-w17-hazards\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w17-hazards\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>沙門氏菌是生物性，乳過敏原是化學性，尖銳金屬是物理性。加熱不會可靠地去除過敏原或金屬。\u003cspan class=\"vn\" lang=\"vi\">Salmonella: sinh học; dị ứng sữa: hóa học; kim loại sắc: vật lý. Gia nhiệt không loại tin cậy dị ứng, kim loại.\u003c/span>\u003c/p>\u003cp>不同危害要對應不同措施：原料與製程衛生、過敏原管理、設備與異物控制。\u003cspan class=\"vn\" lang=\"vi\">Mối nguy khác cần biện pháp khác: vệ sinh nguyên liệu, quy trình, quản lý dị ứng, thiết bị và vật lạ.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"}]},{"id":"s2","nav":"二 HACCP：事前…","kicker":"第二段 · Phần 2","h2":"HACCP：界限、監測與偏差","lead":"HACCP: giới hạn, giám sát, sai lệch","blocks":[{"type":"cards","title":"預防與檢驗：各做什麼？\u003cspan class=\"vn\" lang=\"vi\">Phòng ngừa, kiểm nghiệm: mỗi việc làm gì?\u003c/span>","cols":3,"items":[{"h":"製程預防\u003cspan class=\"vn\" lang=\"vi\">Phòng ngừa trong quy trình\u003c/span>","p":"找重要危害，建立能控制它的措施。\u003cspan class=\"vn\" lang=\"vi\">Tìm mối nguy đáng kể, lập biện pháp kiểm soát.\u003c/span>","c":"#2D2A6E"},{"h":"日常監測\u003cspan class=\"vn\" lang=\"vi\">Giám sát hằng ngày\u003c/span>","p":"按計畫觀察或量測，及早發現偏差。\u003cspan class=\"vn\" lang=\"vi\">Quan sát, đo theo kế hoạch để phát hiện sai lệch.\u003c/span>","c":"#2D2A6E"},{"h":"檢驗與驗證\u003cspan class=\"vn\" lang=\"vi\">Kiểm nghiệm, thẩm tra\u003c/span>","p":"抽樣、稽核與紀錄審查可提供證據；一次合格不代表整批無危害。\u003cspan class=\"vn\" lang=\"vi\">Lấy mẫu, đánh giá, xem hồ sơ cung cấp bằng chứng; một mẫu đạt không chứng minh cả lô hết nguy hại.\u003c/span>","c":"#2D2A6E"}]},{"type":"cards","title":"GHP 是基礎，HACCP 管重要危害\u003cspan class=\"vn\" lang=\"vi\">GHP là nền tảng, HACCP kiểm soát mối nguy đáng kể\u003c/span>","cols":3,"items":[{"h":"GHP\u003cspan class=\"vn\" lang=\"vi\">Thực hành vệ sinh tốt\u003c/span>","p":"人員、清潔、水、設備與病媒等基礎衛生管理。\u003cspan class=\"vn\" lang=\"vi\">Vệ sinh người, làm sạch, nước, thiết bị, sinh vật gây hại.\u003c/span>","c":"#2D2A6E"},{"h":"HACCP\u003cspan class=\"vn\" lang=\"vi\">Phân tích mối nguy và CCP\u003c/span>","p":"危害分析重要管制點：依產品與製程設計管制。\u003cspan class=\"vn\" lang=\"vi\">Thiết kế kiểm soát theo sản phẩm và quy trình.\u003c/span>","c":"#2D2A6E"},{"h":"台灣適用範圍\u003cspan class=\"vn\" lang=\"vi\">Phạm vi Đài Loan\u003c/span>","p":"依法公告的類別與規模須符合 HACCP 準則；不能只看產業名稱。\u003cspan class=\"vn\" lang=\"vi\">Nhóm, quy mô được công bố phải theo chuẩn HACCP; không chỉ tên ngành.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"HACCP＝Hazard Analysis and Critical Control Point（危害分析重要管制點）。法規查核日：2026-10-17；GHP、HACCP 的適用規定與生效日期分別查。\u003cspan class=\"vn\" lang=\"vi\">HACCP: Phân tích mối nguy và điểm kiểm soát tới hạn. Ngày kiểm tra luật: 17-10-2026; tra riêng phạm vi, hiệu lực GHP và HACCP.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0040001\" target=\"_blank\" rel=\"noopener\">食安法第 8 條 / Điều 8 ↗\u003c/a>\u003c/p>\u003cp class=\"source-note\">\u003ca href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0040122\" target=\"_blank\" rel=\"noopener\">GHP 準則 / Quy định GHP ↗\u003c/a>\u003c/p>\u003cp class=\"source-note\">\u003ca href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0040116\" target=\"_blank\" rel=\"noopener\">食品安全管制系統準則 / Quy định HACCP ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"七原則：從分析到持續查證\u003cspan class=\"vn\" lang=\"vi\">Bảy nguyên tắc: từ phân tích đến kiểm chứng\u003c/span>","cols":3,"items":[{"h":"① 分析 ② 定 CCP\u003cspan class=\"vn\" lang=\"vi\">Phân tích, xác định CCP\u003c/span>","p":"列重要危害與控制措施，再決定 CCP。\u003cspan class=\"vn\" lang=\"vi\">Liệt kê mối nguy đáng kể, biện pháp rồi xác định CCP.\u003c/span>","c":"#2D2A6E"},{"h":"③ 界限 ④ 監測 ⑤ 矯正\u003cspan class=\"vn\" lang=\"vi\">Giới hạn, giám sát, khắc phục\u003c/span>","p":"界限要有科學依據；監測異常就啟動處理。\u003cspan class=\"vn\" lang=\"vi\">Giới hạn cần cơ sở khoa học; sai lệch thì xử lý.\u003c/span>","c":"#2D2A6E"},{"h":"⑥ 確效與驗證 ⑦ 文件紀錄\u003cspan class=\"vn\" lang=\"vi\">Thẩm định, thẩm tra; tài liệu, hồ sơ\u003c/span>","p":"先證明計畫可行，再持續查執行情形與效果。\u003cspan class=\"vn\" lang=\"vi\">Chứng minh kế hoạch có hiệu lực rồi kiểm tra thực hiện, hiệu quả.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"依 Codex 架構，七原則前還有組隊、描述產品與用途、流程圖及現場確認等準備工作，共 12 步驟；不是只背七個名稱。\u003cspan class=\"vn\" lang=\"vi\">Theo Codex, trước bảy nguyên tắc còn lập nhóm, mô tả sản phẩm, cách dùng, lưu đồ và xác nhận tại chỗ; tổng 12 bước, không chỉ học tên.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/good-hygiene-practices-haccp-toolbox/haccp/introduction-to-haccp/\" target=\"_blank\" rel=\"noopener\">七原則、12 步驟 / Bảy nguyên tắc, 12 bước: FAO ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"CCP 與管制界限：看產品與危害\u003cspan class=\"vn\" lang=\"vi\">CCP, giới hạn tới hạn: xem sản phẩm, mối nguy\u003c/span>","cols":3,"items":[{"h":"CCP 是步驟\u003cspan class=\"vn\" lang=\"vi\">CCP là bước\u003c/span>","p":"在此控制對預防、消除或降到可接受程度很重要。\u003cspan class=\"vn\" lang=\"vi\">Kiểm soát tại đây thiết yếu để ngăn, loại hoặc giảm đến mức chấp nhận.\u003c/span>","c":"#2D2A6E"},{"h":"界限是判準\u003cspan class=\"vn\" lang=\"vi\">Giới hạn là tiêu chí\u003c/span>","p":"須可量測或觀察，且有證據能控制指定危害。\u003cspan class=\"vn\" lang=\"vi\">Phải đo hoặc quan sát được, có bằng chứng kiểm soát mối nguy đã nêu.\u003c/span>","c":"#2D2A6E"},{"h":"不能套固定答案\u003cspan class=\"vn\" lang=\"vi\">Không áp đáp án cố định\u003c/span>","p":"加熱不自動是 CCP；界限也不是所有食品同一組溫度與時間。\u003cspan class=\"vn\" lang=\"vi\">Gia nhiệt không tự là CCP; không dùng cùng nhiệt, thời gian cho mọi thực phẩm.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"先做危害分析，再判斷哪些管制不可缺少；CCP 的數量要有依據。溫度通常還須連著持續時間、食品與量測位置。\u003cspan class=\"vn\" lang=\"vi\">Phân tích trước rồi xét kiểm soát thiết yếu; số CCP cần căn cứ. Nhiệt còn đi cùng thời gian, thực phẩm, vị trí đo.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/good-hygiene-practices-haccp-toolbox/haccp/step-7-determining-critical-control-points/\" target=\"_blank\" rel=\"noopener\">CCP 定義與判定 / Xác định CCP: FAO ↗\u003c/a>\u003c/p>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/good-hygiene-practices-haccp-toolbox/haccp/step-8-establishing-and-validating-critical-limits/\" target=\"_blank\" rel=\"noopener\">有科學依據的界限 / Giới hạn được thẩm định: FAO ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 2｜紀錄沒有達標，怎麼辦？\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 2: hồ sơ chưa đạt, làm gì?\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"deviation\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">紙上模擬：假定某製程已有科學依據，CCP 界限為食品冷點至少 80°C、持續 2 分鐘。紀錄是 79°C、2 分鐘。能直接放行嗎？先說兩件事。此數值不是烹調處方。\u003cspan class=\"vn\" lang=\"vi\">Mô phỏng: giả định quy trình có cơ sở khoa học, giới hạn CCP ở điểm lạnh ≥80°C trong 2 phút. Hồ sơ 79°C, 2 phút. Xuất ngay được không? Nêu hai việc đầu. Số này không là hướng dẫn nấu.\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>紀錄＿＿界限；先＿＿，再＿＿。\u003cspan class=\"vn\" lang=\"vi\">Hồ sơ ___ giới hạn; trước ___, sau ___.\u003c/span>\u003c/div>\u003clabel for=\"a2-w17-deviation\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w17-deviation\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>紀錄未達界限；先停止不合格放行、隔離受影響產品，再通報並依計畫調查與評估處置。\u003cspan class=\"vn\" lang=\"vi\">Hồ sơ chưa đạt; ngừng xuất, cách ly sản phẩm ảnh hưởng, báo cáo rồi điều tra và đánh giá xử lý theo kế hoạch.\u003c/span>\u003c/p>\u003cp>先管住製程與產品；不能改寫紀錄或只靠外觀放行。真實界限須依食品、危害與設備確效。\u003cspan class=\"vn\" lang=\"vi\">Kiểm soát quy trình, sản phẩm; không sửa hồ sơ hay dựa vẻ ngoài để xuất. Giới hạn thật cần thẩm định theo thực phẩm, mối nguy, thiết bị.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"偏差處理：控製程，也管產品\u003cspan class=\"vn\" lang=\"vi\">Xử lý sai lệch: cả quy trình và sản phẩm\u003c/span>","cols":3,"items":[{"h":"先控制與隔離\u003cspan class=\"vn\" lang=\"vi\">Kiểm soát, cách ly trước\u003c/span>","p":"停止不合格放行；辨識並管住受影響產品。\u003cspan class=\"vn\" lang=\"vi\">Ngừng xuất sản phẩm chưa đạt; xác định, giữ sản phẩm bị ảnh hưởng.\u003c/span>","c":"#2D2A6E"},{"h":"查原因與處置\u003cspan class=\"vn\" lang=\"vi\">Tìm nguyên nhân, xử lý\u003c/span>","p":"調整製程，依計畫評估產品；不是補簽就放行。\u003cspan class=\"vn\" lang=\"vi\">Điều chỉnh quy trình, đánh giá sản phẩm theo kế hoạch; không chỉ ký bổ sung.\u003c/span>","c":"#2D2A6E"},{"h":"留證據與追蹤\u003cspan class=\"vn\" lang=\"vi\">Lưu bằng chứng, theo dõi\u003c/span>","p":"記錄時間、批次、偏差、處置與責任人，確認恢復控制。\u003cspan class=\"vn\" lang=\"vi\">Ghi giờ, lô, sai lệch, xử lý, người phụ trách; xác nhận kiểm soát trở lại.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"受影響範圍須依紀錄、監測頻率與調查判斷；重新加熱、銷毀或其他處置都須有適當依據。稽查也看現場與客觀證據。\u003cspan class=\"vn\" lang=\"vi\">Phạm vi ảnh hưởng xét hồ sơ, tần suất giám sát, điều tra; gia nhiệt lại, hủy hay cách khác đều cần căn cứ. Thanh tra còn xem hiện trường, bằng chứng khách quan.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/good-hygiene-practices-haccp-toolbox/haccp/step-10-corrective-actions/\" target=\"_blank\" rel=\"noopener\">矯正措施與受影響產品 / Khắc phục, sản phẩm ảnh hưởng: FAO ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"三個不同問題\u003cspan class=\"vn\" lang=\"vi\">Ba câu hỏi khác nhau\u003c/span>","cols":3,"items":[{"h":"監測 monitoring\u003cspan class=\"vn\" lang=\"vi\">Giám sát\u003c/span>","p":"這批現在有沒有符合界限？按計畫量測或觀察。\u003cspan class=\"vn\" lang=\"vi\">Lô này hiện có đạt giới hạn? Đo hoặc quan sát theo kế hoạch.\u003c/span>","c":"#2D2A6E"},{"h":"確效 validation\u003cspan class=\"vn\" lang=\"vi\">Thẩm định\u003c/span>","p":"這個措施／計畫能控制危害嗎？要有科學證據。\u003cspan class=\"vn\" lang=\"vi\">Biện pháp, kế hoạch có kiểm soát mối nguy? Cần bằng chứng khoa học.\u003c/span>","c":"#2D2A6E"},{"h":"驗證 verification\u003cspan class=\"vn\" lang=\"vi\">Thẩm tra\u003c/span>","p":"計畫有照做、持續有效嗎？如審查紀錄、校正與稽核。\u003cspan class=\"vn\" lang=\"vi\">Có làm theo, tiếp tục hiệu quả? Như xem hồ sơ, hiệu chuẩn, đánh giá.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"本課用「確效」區分 validation、「驗證」區分 verification；中文譯名可能不同，請連同英文與問題一起讀。\u003cspan class=\"vn\" lang=\"vi\">Khóa học dùng 確效 cho validation, 驗證 cho verification; bản dịch có thể khác, đọc cùng tiếng Anh và câu hỏi.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/good-hygiene-practices-haccp-toolbox/haccp/step-11-validation-and-verification/\" target=\"_blank\" rel=\"noopener\">確效與驗證 / Thẩm định, thẩm tra: FAO ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"品管責任：企業、外部查證與政府\u003cspan class=\"vn\" lang=\"vi\">Trách nhiệm: doanh nghiệp, bên ngoài, nhà nước\u003c/span>","cols":3,"items":[{"h":"企業自主管理\u003cspan class=\"vn\" lang=\"vi\">Doanh nghiệp tự quản\u003c/span>","p":"建立衛生與危害控制、追溯及必要紀錄。\u003cspan class=\"vn\" lang=\"vi\">Lập vệ sinh, kiểm soát mối nguy, truy xuất, hồ sơ cần thiết.\u003c/span>","c":"#2D2A6E"},{"h":"外部檢驗／驗證\u003cspan class=\"vn\" lang=\"vi\">Kiểm nghiệm, chứng nhận bên ngoài\u003c/span>","p":"依適用要求或方案查證；一張證書不保證每批零風險。\u003cspan class=\"vn\" lang=\"vi\">Theo yêu cầu, chương trình áp dụng; chứng chỉ không bảo đảm mọi lô hết rủi ro.\u003c/span>","c":"#2D2A6E"},{"h":"政府監督\u003cspan class=\"vn\" lang=\"vi\">Nhà nước giám sát\u003c/span>","p":"依法查核與處理；企業的安全責任不因此消失。\u003cspan class=\"vn\" lang=\"vi\">Kiểm tra, xử lý theo luật; doanh nghiệp vẫn chịu trách nhiệm an toàn.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"這是理解分工的簡化圖，不表示每家食品業都必須參加同一種第三方驗證。\u003cspan class=\"vn\" lang=\"vi\">Đây là sơ đồ phân công đơn giản, không nghĩa mọi doanh nghiệp phải cùng một chứng nhận bên thứ ba.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0040001\" target=\"_blank\" rel=\"noopener\">台灣食安管理責任與適用規範 / Trách nhiệm, phạm vi: Đài Loan ↗\u003c/a>\u003c/p>"}]},{"id":"s3","nav":"三 感官評定：用人來…","kicker":"第三段 · Phần 3","h2":"感官：差異、描述與喜好","lead":"Cảm quan: phân biệt, mô tả, thị hiếu","blocks":[{"type":"cards","title":"先問問題，再選方法與人\u003cspan class=\"vn\" lang=\"vi\">Hỏi trước rồi chọn phương pháp, người\u003c/span>","cols":3,"items":[{"h":"差異試驗\u003cspan class=\"vn\" lang=\"vi\">Phép thử phân biệt\u003c/span>","p":"有沒有可察覺差別？如三角測試。\u003cspan class=\"vn\" lang=\"vi\">Có khác biệt cảm nhận được? Ví dụ tam giác.\u003c/span>","c":"#2D2A6E"},{"h":"描述分析\u003cspan class=\"vn\" lang=\"vi\">Phân tích mô tả\u003c/span>","p":"差在哪裡、強度多少？需合適訓練與共同用語。\u003cspan class=\"vn\" lang=\"vi\">Khác gì, mạnh bao nhiêu? Cần huấn luyện, từ ngữ chung phù hợp.\u003c/span>","c":"#2D2A6E"},{"h":"嗜好性試驗\u003cspan class=\"vn\" lang=\"vi\">Phép thử thị hiếu\u003c/span>","p":"目標消費者喜不喜歡？如喜好度評分。\u003cspan class=\"vn\" lang=\"vi\">Người tiêu dùng mục tiêu có thích? Như chấm mức ưa thích.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"人數依目的、預期差異、誤判風險與統計檢定力規劃；不能把固定人數當所有試驗標準。三角測試不回答喜好或安全。\u003cspan class=\"vn\" lang=\"vi\">Cỡ mẫu tùy mục đích, khác biệt dự kiến, rủi ro sai, lực kiểm định; không có một số chung. Tam giác không trả lời thị hiếu hay an toàn.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.iso.org/standard/76666.html\" target=\"_blank\" rel=\"noopener\">ISO 4120:2021 三角測試適用範圍 / Phạm vi phép thử tam giác ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"三角測試：三個樣品找一個\u003cspan class=\"vn\" lang=\"vi\">Tam giác: tìm một trong ba mẫu\u003c/span>","cols":3,"items":[{"h":"兩同一異\u003cspan class=\"vn\" lang=\"vi\">Hai giống, một khác\u003c/span>","p":"三位隨機碼；平衡 AAB、ABA、BAA 等六種順序。\u003cspan class=\"vn\" lang=\"vi\">Mã ba chữ số ngẫu nhiên; cân bằng sáu thứ tự như AAB, ABA, BAA.\u003c/span>","c":"#2D2A6E"},{"h":"猜對機率 1/3\u003cspan class=\"vn\" lang=\"vi\">Xác suất đoán đúng 1/3\u003c/span>","p":"每人選一個不同者；依預先規劃的統計方法判讀。\u003cspan class=\"vn\" lang=\"vi\">Mỗi người chọn một mẫu khác; đọc theo thống kê định trước.\u003c/span>","c":"#2D2A6E"},{"h":"結論有範圍\u003cspan class=\"vn\" lang=\"vi\">Kết luận có phạm vi\u003c/span>","p":"找得出不同不等於更喜歡；未顯著也不直接證明相同。\u003cspan class=\"vn\" lang=\"vi\">Nhận ra khác không bằng thích hơn; không có ý nghĩa thống kê chưa chứng minh giống.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"短活動 3｜吃得出差別，就是更喜歡？\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 3: nhận ra khác là thích hơn?\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"triangle\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">紙上資料：12 人各獨立做一次三角測試，8 人答對。老師事前給定本模擬的判準：至少 8 人答對，才判有可察覺差異。能說 8 人更喜歡新醬汁嗎？\u003cspan class=\"vn\" lang=\"vi\">Dữ liệu giấy: 12 người độc lập thử tam giác một lần, 8 đúng. Giáo viên định trước quy tắc mô phỏng: ít nhất 8 đúng mới kết luận có khác biệt cảm nhận. Có nói 8 người thích xốt mới hơn không?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>這份資料支持＿＿；要知道喜好，還要＿＿。\u003cspan class=\"vn\" lang=\"vi\">Dữ liệu hỗ trợ ___; muốn biết thị hiếu còn cần ___.\u003c/span>\u003c/div>\u003clabel for=\"a2-w17-triangle\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w17-triangle\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>依本模擬判準，資料支持可察覺差異；不能說 8 人更喜歡新醬汁。要另做目標消費者的喜好試驗。\u003cspan class=\"vn\" lang=\"vi\">Theo quy tắc mô phỏng, có bằng chứng khác biệt cảm nhận; không nói 8 người thích xốt mới hơn. Cần thử thị hiếu với người tiêu dùng mục tiêu.\u003c/span>\u003c/p>\u003cp>本例假設獨立作答、無差異時猜對率 1/3；n=12、至少 8 人答對的二項右尾機率約 0.0188，小於事先選的 0.05。不是所有人數都用 8 人作門檻。\u003cspan class=\"vn\" lang=\"vi\">Giả định độc lập, xác suất đoán 1/3 khi không khác; n=12, xác suất nhị thức từ 8 đúng khoảng 0,0188, nhỏ hơn 0,05 chọn trước. Không dùng ngưỡng 8 cho mọi cỡ mẫu.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"讓感官資料可以比較\u003cspan class=\"vn\" lang=\"vi\">Làm dữ liệu cảm quan so sánh được\u003c/span>","cols":3,"items":[{"h":"盲碼與順序\u003cspan class=\"vn\" lang=\"vi\">Mã mù, thứ tự\u003c/span>","p":"避免品牌線索；隨機並平衡順序，減少先後影響。\u003cspan class=\"vn\" lang=\"vi\">Tránh gợi ý thương hiệu; ngẫu nhiên, cân bằng thứ tự.\u003c/span>","c":"#2D2A6E"},{"h":"一致與獨立\u003cspan class=\"vn\" lang=\"vi\">Nhất quán, độc lập\u003c/span>","p":"控制份量、溫度、環境與休息；避免互相暗示。\u003cspan class=\"vn\" lang=\"vi\">Kiểm soát phần, nhiệt, môi trường, nghỉ; tránh gợi ý nhau.\u003c/span>","c":"#2D2A6E"},{"h":"安全再品評\u003cspan class=\"vn\" lang=\"vi\">An toàn trước khi thử\u003c/span>","p":"先確認樣品與過敏限制；本課活動只判讀紙上資料。\u003cspan class=\"vn\" lang=\"vi\">Xác nhận an toàn, hạn chế dị ứng; hoạt động chỉ đọc dữ liệu trên giấy.\u003c/span>","c":"#2D2A6E"}]}]},{"id":"sum","nav":"重點 Điểm chính","kicker":"今天的重點 · Điểm chính hôm nay","h2":"今天的重點","lead":"Điểm chính hôm nay","blocks":[{"type":"cards","title":"回顧\u003cspan class=\"vn\" lang=\"vi\">Ôn tập\u003c/span>","cols":2,"items":[{"h":"先找危害，再找適合控制\u003cspan class=\"vn\" lang=\"vi\">Tìm mối nguy rồi chọn kiểm soát phù hợp\u003c/span>"},{"h":"CCP 與界限要有產品和科學依據\u003cspan class=\"vn\" lang=\"vi\">CCP, giới hạn cần căn cứ sản phẩm, khoa học\u003c/span>"},{"h":"偏差時先管住產品並留下證據\u003cspan class=\"vn\" lang=\"vi\">Khi sai lệch, giữ sản phẩm, lưu bằng chứng\u003c/span>"},{"h":"差異、描述、喜好：問題不同\u003cspan class=\"vn\" lang=\"vi\">Phân biệt, mô tả, thị hiếu: câu hỏi khác nhau\u003c/span>"}]},{"type":"note","title":"","text":"選一題錯題，寫「我原本想＿＿，現在知道＿＿，因為＿＿」。\u003cspan class=\"vn\" lang=\"vi\">Chọn một câu sai, viết điều đã nghĩ, nay biết và lý do.\u003c/span>"}]},{"id":"quiz","nav":"練習 Luyện tập","kicker":"練習 · Luyện tập","h2":"課後練習 10 題","lead":"10 題核心檢核：判斷後讀雙語原因，再用中文句型說明。10 câu cốt lõi: xét rồi đọc lý do song ngữ, giải thích bằng mẫu câu tiếng Trung.","blocks":[{"type":"quiz","items":[{"q":"奶醬的乳過敏原，在本課屬哪一類？\u003cspan class=\"vn\" lang=\"vi\">Dị ứng sữa trong xốt thuộc nhóm nào?\u003c/span>","o":["生物性 / Sinh học","化學性 / Hóa học","物理性 / Vật lý","只屬風味 / Chỉ hương vị"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 本課把過敏原列入化學性危害；它與病原菌要用不同方式控制。\u003cspan class=\"vn\" lang=\"vi\">Khóa học xếp dị ứng vào hóa học; cần kiểm soát khác mầm bệnh.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：乳過敏原是＿＿；需要＿＿管理。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Dị ứng sữa là ___; cần quản lý ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/tc/newsContent.aspx?cid=4&id=t622859\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"有奶過敏原的產品，怎樣較合理？\u003cspan class=\"vn\" lang=\"vi\">Sản phẩm có dị ứng sữa nên làm gì?\u003c/span>","o":["煮熱就不必標示 / Nấu nóng thì bỏ nhãn","外觀正常就放行 / Nhìn thường thì xuất","只在最後抽一包檢查 / Chỉ kiểm một gói cuối","管原料、接觸與標示 / Quản nguyên liệu, tiếp xúc, nhãn"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 一般加熱不能當可靠的通用去過敏原方法；應管理原料、交叉接觸與適用標示。\u003cspan class=\"vn\" lang=\"vi\">Nhiệt thường không loại dị ứng chung tin cậy; quản nguyên liệu, tiếp xúc chéo, nhãn.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：不能只靠＿＿；還要＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Không chỉ dựa ___; còn cần ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/tc/newsContent.aspx?cid=4&id=t622859\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"GHP 與 HACCP 的關係？\u003cspan class=\"vn\" lang=\"vi\">Quan hệ GHP, HACCP?\u003c/span>","o":["基礎衛生加重要危害控制 / Vệ sinh nền và kiểm soát mối nguy đáng kể","有 HACCP 就不用清潔 / Có HACCP khỏi làm sạch","兩者都是成品抽驗 / Cả hai là kiểm mẫu cuối","只有大工廠要衛生 / Chỉ nhà máy lớn cần vệ sinh"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> GHP 提供日常衛生基礎，HACCP 再依產品與製程控制重要危害。\u003cspan class=\"vn\" lang=\"vi\">GHP là nền vệ sinh, HACCP kiểm soát mối nguy đáng kể theo sản phẩm, quy trình.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：GHP 管＿＿；HACCP 依＿＿設計。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: GHP quản ___; HACCP thiết kế theo ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/good-hygiene-practices-haccp-toolbox/haccp/introduction-to-haccp/\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"哪一個才是 CCP 的判斷重點？\u003cspan class=\"vn\" lang=\"vi\">Điểm chính khi xác định CCP?\u003c/span>","o":["機器最貴 / Máy đắt nhất","一定在最後一步 / Luôn bước cuối","此步的控制對重要危害不可缺少 / Kiểm soát tại bước thiết yếu cho mối nguy đáng kể","只要有加熱就是 / Có nhiệt là CCP"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 先做危害分析；CCP 是控制對預防、消除或降低指定危害至可接受程度很重要的步驟。\u003cspan class=\"vn\" lang=\"vi\">Phân tích trước; CCP là bước kiểm soát thiết yếu để ngăn, loại, giảm mối nguy đến mức chấp nhận.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：這步要管＿＿，是否為 CCP 還看＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Bước kiểm soát ___, là CCP còn xem ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/good-hygiene-practices-haccp-toolbox/haccp/step-7-determining-critical-control-points/\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"熱處理的管制界限，怎麼定？\u003cspan class=\"vn\" lang=\"vi\">Đặt giới hạn nhiệt thế nào?\u003c/span>","o":["所有食品都用同一組數字 / Mọi thực phẩm cùng số","依危害、食品與設備的科學依據 / Theo cơ sở khoa học về mối nguy, thực phẩm, thiết bị","憑顏色好看 / Theo màu đẹp","把昨天平均值當界限 / Dùng trung bình hôm qua"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 界限須有科學依據，且可量測或觀察；熱處理還要說時間與量測位置。\u003cspan class=\"vn\" lang=\"vi\">Giới hạn cần cơ sở, đo hoặc quan sát được; nhiệt còn nêu thời gian, chỗ đo.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：這組界限適用於＿＿，依據是＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Giới hạn áp cho ___, căn cứ là ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/good-hygiene-practices-haccp-toolbox/haccp/step-8-establishing-and-validating-critical-limits/\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"模擬界限 80°C、2 分鐘，紀錄 79°C、2 分鐘，先做什麼？\u003cspan class=\"vn\" lang=\"vi\">Mô phỏng giới hạn 80°C, 2 phút; ghi 79°C, 2 phút, làm gì trước?\u003c/span>","o":["停止放行並管住受影響產品 / Ngừng xuất, giữ sản phẩm ảnh hưởng","補簽到 80°C / Sửa ký thành 80°C","味道好就出貨 / Ngon thì xuất","下批達標就不追這批 / Lô sau đạt thì bỏ lô này"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 這批記錄未達假定界限；應依計畫隔離、通報、調查與評估處置，不能直接放行。\u003cspan class=\"vn\" lang=\"vi\">Lô chưa đạt giới hạn giả định; cách ly, báo cáo, điều tra, đánh giá theo kế hoạch, không xuất ngay.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：本批＿＿；應先＿＿，再＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Lô này ___; trước ___, sau ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/good-hygiene-practices-haccp-toolbox/haccp/step-10-corrective-actions/\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"查科學資料，證明控制措施能控制指定危害，叫什麼？\u003cspan class=\"vn\" lang=\"vi\">Tìm bằng chứng biện pháp kiểm soát được mối nguy gọi gì?\u003c/span>","o":["每批監測 / Giám sát mỗi lô","喜好試驗 / Thử thị hiếu","包裝設計 / Thiết kế bao bì","確效 validation / Thẩm định"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 確效回答「措施能做到嗎」；監測看目前是否達界限，驗證查計畫執行與持續效果。\u003cspan class=\"vn\" lang=\"vi\">Thẩm định hỏi có làm được; giám sát xem hiện đạt, thẩm tra xem thực hiện, hiệu quả tiếp tục.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：確效問＿＿；監測問＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Thẩm định hỏi ___; giám sát hỏi ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/good-hygiene-practices-haccp-toolbox/haccp/step-11-validation-and-verification/\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"三角測試只用猜的，答對機率是多少？\u003cspan class=\"vn\" lang=\"vi\">Tam giác chỉ đoán, xác suất đúng?\u003c/span>","o":["1/2 / Một nửa","2/3 / Hai phần ba","1/3 / Một phần ba","1/4 / Một phần tư"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 三個位置選一個不同者，猜對率 1/3；實際答對數須配合預先規劃的統計判讀。\u003cspan class=\"vn\" lang=\"vi\">Chọn một vị trí khác trong ba, đoán đúng 1/3; số đúng cần đọc theo thống kê định trước.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：猜對率是＿＿；還要看＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Xác suất đoán là ___; còn xem ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.iso.org/standard/76666.html\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"三角測試支持有差異，能直接說什麼？\u003cspan class=\"vn\" lang=\"vi\">Tam giác hỗ trợ có khác, nói được gì?\u003c/span>","o":["有可察覺差別 / Có khác biệt cảm nhận","新配方更受歡迎 / Công thức mới được thích hơn","新配方更安全 / Công thức mới an toàn hơn","營養一定更好 / Chắc bổ hơn"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 差異不代表喜好、安全或營養；要問「更喜歡」，需合適的消費者喜好試驗。\u003cspan class=\"vn\" lang=\"vi\">Khác không bằng thị hiếu, an toàn, bổ; muốn biết thích hơn cần thử thị hiếu phù hợp.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：資料只支持＿＿；不能直接說＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Dữ liệu chỉ hỗ trợ ___; không nói ngay ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.iso.org/standard/76666.html\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"怎麼減少呈送順序的影響？\u003cspan class=\"vn\" lang=\"vi\">Giảm ảnh hưởng thứ tự thế nào?\u003c/span>","o":["全部先給新配方 / Luôn cho công thức mới trước","隨機並平衡順序 / Ngẫu nhiên, cân bằng thứ tự","讓大家討論後一起答 / Bàn rồi trả lời chung","標出品牌讓人參考 / Cho thương hiệu tham khảo"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 順序可能影響判斷；隨機與平衡能減少系統偏差，作答也應獨立。\u003cspan class=\"vn\" lang=\"vi\">Thứ tự có thể ảnh hưởng; ngẫu nhiên, cân bằng giảm lệch hệ thống, trả lời độc lập.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：為減少＿＿，我們會＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Để giảm ___, nhóm sẽ ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.iso.org/standard/76666.html\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"}]}]}],"a2":true,"track":{"url":"https://qmldcjkllisvfgegkfsz.supabase.co","key":"sb_publishable_xprm7A1B-hQhAMBIMaWOWw_w617svI1"}};</script>
<script>
/*
 * runtime.client.js — 跑在瀏覽器裡的渲染器（17 週共用，逐字內嵌進每份 HTML）
 * 讀 window.__LESSON__ 的資料，把 modules / blocks 畫出來。
 * 互動行為（翻卡、展開、配對、測驗）沿用週1 手寫版的做法，不要另創一套。
 */
(function () {
  var D = window.__LESSON__;
  var SERIES = D.series;
  var $ = function (s) { return document.querySelector(s); };
  // 國合班 A2 版（D.a2）：介面文字加越南文；一般班 U() 只回中文，畫面與原本完全相同
  var A2 = !!D.a2;
  function U(zh, vn) { return A2 ? zh + " " + vn : zh; }

  /* ---------- 學習歷程記錄（Supabase） ----------
     只在 lesson.js 注入 D.track = {url, key} 的週次啟用（lib/tracking.json 的 weeks）；
     其他週 TRACK.on 為 false，send() 是空函式，教材行為完全不變。
     只送「學號代碼」與互動事件，不送姓名。送失敗就丟掉，不重試、不阻擋教材。 */
  var CTX = { mod: null, bi: 0 };   // 目前正在渲染的模組 id 與區塊序號（render 是同步的）
  var TRACK = (function () {
    var cfg = D.track;
    var noop = function () {};
    if (!cfg || !cfg.url || !cfg.key) return { on: false, send: noop, flush: noop, code: function () { return ""; }, setCode: noop };
    var KEY = "ifs_code", DKEY = "ifs_device";
    var rnd = function () { return Math.random().toString(36).slice(2, 10); };
    var sid = rnd() + Date.now().toString(36);
    // device_id：同一支手機／瀏覽器跨次開頁不變。學生後來才填學號代碼時，先前的 anon 事件可靠它回接。
    var did = "";
    try { did = localStorage.getItem(DKEY) || ""; if (!did) { did = "d" + rnd() + rnd(); localStorage.setItem(DKEY, did); } } catch (e) { did = "d" + rnd(); }
    var q = [], timer = null;
    function code() { try { return (localStorage.getItem(KEY) || "").trim(); } catch (e) { return ""; } }
    function setCode(v) { try { localStorage.setItem(KEY, (v || "").trim().slice(0, 20)); } catch (e) {} }
    function cut(s, n) { return s == null ? null : String(s).slice(0, n); }
    // 欄位長度與 payload 大小在前端先截到資料表 CHECK 的上限：PostgREST 批次 INSERT 是原子的，
    // 一筆違反 CHECK 整批都會被拒，而我們失敗即丟，會靜默掉整個 4 秒窗口。
    function send(event, mod, block, payload) {
      var p = payload || {};
      var ps = JSON.stringify(p);
      if (ps.length > 1800) p = { trunc: true, keys: Object.keys(p).slice(0, 10) };
      q.push({
        student_code: cut(code(), 20) || "anon", device_id: cut(did, 40), week: D.week || 0,
        module_id: cut(mod, 30), block_type: cut(block, 10), event: cut(event, 30),
        payload: p, session_id: cut(sid, 40), build: cut(D.build, 16), client_ts: new Date().toISOString(),
        cls: A2 ? "a2" : undefined,   // 國合班與一般班同週分開；一般班不送這欄（JSON 會略過 undefined）
      });
      if (q.length >= 40) flush();
      else if (!timer) timer = setTimeout(flush, 4000);
    }
    function flush() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!q.length) return;
      var body = JSON.stringify(q.splice(0, 50));
      try {
        fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/ifs_lesson_events", {
          method: "POST", keepalive: true, body: body,
          headers: { "Content-Type": "application/json", "apikey": cfg.key, "Prefer": "return=minimal" },
        }).catch(noop);
      } catch (e) { /* 舊瀏覽器沒有 fetch：不記錄 */ }
      if (q.length) timer = setTimeout(flush, 1000);
    }
    window.addEventListener("pagehide", flush);
    return { on: true, send: send, flush: flush, code: code, setCode: setCode };
  })();

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function colorAt(given, i) { return given || SERIES[i % SERIES.length]; }
  function gridCls(n) { return "grid g" + (n === 2 || n === 3 || n === 4 ? n : 3); }
  function listHtml(v) {
    // body 可以是字串或字串陣列；陣列渲染成 <ul>
    if (v == null) return "";
    if (typeof v === "string") return '<p>' + v + '</p>';
    return '<ul>' + v.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
  }

  /* ---------- 區塊標題 ---------- */
  function heading(frag, b) {
    if (b.title) frag.appendChild(el("div", "sec-title", '<span class="bar"></span>' + b.title));
    if (b.hint) frag.appendChild(el("div", "hint", b.hint));
  }

  /* ---------- 各區塊 ---------- */
  var BLOCKS = {};

  BLOCKS.flips = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (d, i) {
      var c = colorAt(d.c, i);
      var card = el("div", "flip");
      if (b.h) card.style.height = b.h + "px";
      card.innerHTML =
        '<div class="flip-in">' +
        '<div class="face front"><div class="cbar" style="background:' + c + '"></div>' +
        '<div class="t">' + d.t + '</div><div class="en">' + (d.en || "") + '</div>' +
        '<div class="tap">▸ ' + U("點我看解釋", "Chạm để xem") + '</div></div>' +
        '<div class="face back"><div class="cbar" style="background:' + c + '"></div>' +
        '<p>' + d.b + '</p></div></div>';
      var mod = CTX.mod, bi = CTX.bi;
      card.onclick = function () {
        if (card.classList.toggle("on")) TRACK.send("flip_open", mod, "flips", { b: bi, i: i, t: d.t });
      };
      g.appendChild(card);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.exp = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div");
    b.items.forEach(function (t, i) {
      var box = el("div", "exp");
      var res = t.res ? '<div style="margin-top:10px;font-size:13px;color:var(--secondary);font-weight:700">🔗 ' + t.res + '</div>' : "";
      box.innerHTML =
        '<button><span class="num">' + (i + 1) + '</span><span>' + t.h + '</span>' +
        '<span class="tag">' + (t.tag || "") + '</span><span class="chev">›</span></button>' +
        '<div class="body">' + listHtml(t.body) + res + '</div>';
      var body = box.querySelector(".body");
      var mod = CTX.mod, bi = CTX.bi;
      box.querySelector("button").onclick = function () {
        var on = box.classList.toggle("on");
        if (!on) { body.style.maxHeight = "0px"; return; }
        TRACK.send("exp_open", mod, "exp", { b: bi, i: i, h: t.h });
        // 用實際內容高度展開，避免長段落被固定 max-height 截掉。
        // 必須先解除 max-height 再量：在 max-height:0 的狀態下量 scrollHeight 會得到 0，
        // 面板就只會開一條縫（實測過）。量完歸零並強制重排，transition 才有起點。
        body.style.maxHeight = "none";
        var h = body.scrollHeight;
        body.style.maxHeight = "0px";
        void body.offsetHeight;
        body.style.maxHeight = h + "px";
      };
      host.appendChild(box);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.cards = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var box = el("div", "card");
      box.style.borderTop = "4px solid " + accent;
      box.innerHTML = '<div class="h">' + c.h + '</div>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        (c.li ? '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>' : "") +
        (c.p ? '<p style="margin-top:8px;font-size:15.5px;color:var(--mid)">' + c.p + '</p>' : "");
      g.appendChild(box);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.timeline = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "tl");
    b.steps.forEach(function (s, i) {
      var st = el("div", "step");
      st.innerHTML = '<div class="dot" style="background:' + colorAt(s.c, i) + '">' + (i + 1) + '</div>' +
        '<h4>' + s.h + '</h4><p>' + s.p + '</p>';
      host.appendChild(st);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.compare = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "cmp");
    [b.left, b.right].forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var col = el("div", "col");
      col.innerHTML = '<div class="cbar" style="background:' + accent + '"></div>' +
        '<h4 style="color:' + accent + '">' + c.h + '</h4>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
      wrap.appendChild(col);
    });
    f.appendChild(wrap);
    if (b.note) f.appendChild(el("div", "cmp-note", b.note));
    return f;
  };

  BLOCKS.table = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "tblwrap");
    var html = '<table class="tbl"><thead><tr>' +
      b.head.map(function (h) { return '<th>' + h + '</th>'; }).join("") + '</tr></thead><tbody>' +
      b.rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join("") + '</tr>';
      }).join("") + '</tbody></table>';
    wrap.innerHTML = html;
    f.appendChild(wrap); return f;
  };

  BLOCKS.note = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    f.appendChild(el("div", "note" + (b.kind ? " " + b.kind : ""), b.text));
    return f;
  };

  BLOCKS.match = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "match-wrap");
    var pool = el("div", "pool"), targets = el("div", "targets");
    var pairs = b.pairs;
    var order = pairs.slice().sort(function () { return Math.random() - 0.5; });
    var selected = null, solved = 0, errors = 0, t0 = null;
    var mod = CTX.mod, bi = CTX.bi;
    var msg = el("div");
    msg.style.cssText = "margin-top:14px;font-weight:700;color:var(--green)";

    function tryMatch(slot, key) {
      if (slot.classList.contains("ok")) return;
      if (t0 === null) t0 = Date.now();
      if (slot.dataset.k === key) {
        slot.classList.add("ok"); slot.classList.remove("bad");
        slot.querySelector(".drop").textContent = key;
        var chip = pool.querySelector('.chip[data-k="' + key + '"]');
        chip.classList.add("used"); chip.classList.remove("sel");
        selected = null; solved++;
        TRACK.send("match_ok", mod, "match", { b: bi, label: key });
        if (solved === pairs.length) {
          msg.textContent = b.done || U("✓ 全部答對！", "Đúng hết!");
          TRACK.send("match_done", mod, "match", { b: bi, n: pairs.length, errors: errors, ms: Date.now() - t0 });
        }
      } else {
        errors++;
        TRACK.send("match_bad", mod, "match", { b: bi, label: key, slot: slot.dataset.k });
        slot.classList.add("bad");
        setTimeout(function () { slot.classList.remove("bad"); }, 350);
      }
    }
    order.forEach(function (q) {
      var c = el("div", "chip"); c.textContent = q.label; c.draggable = true; c.dataset.k = q.label;
      c.addEventListener("dragstart", function (e) { e.dataTransfer.setData("k", q.label); });
      c.onclick = function () {
        if (c.classList.contains("used")) return;
        if (selected === c) { c.classList.remove("sel"); selected = null; return; }
        pool.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("sel"); });
        c.classList.add("sel"); selected = c;
      };
      pool.appendChild(c);
    });
    pairs.forEach(function (q) {
      var s = el("div", "slot"); s.dataset.k = q.label;
      s.innerHTML = '<div class="drop">' + U("拖到這裡", "Kéo vào đây") + '</div><div class="desc">' + q.desc + '</div>';
      s.addEventListener("dragover", function (e) { e.preventDefault(); });
      s.addEventListener("drop", function (e) { e.preventDefault(); tryMatch(s, e.dataTransfer.getData("k")); });
      s.onclick = function () { if (selected) tryMatch(s, selected.dataset.k); };
      targets.appendChild(s);
    });
    host.appendChild(pool); host.appendChild(targets); host.appendChild(msg);
    f.appendChild(host); return f;
  };

  /* 結果代碼：把作答結果編成一串可貼給老師的代碼（FSQ1.<base64>.<檢查碼>）。
     解碼與彙整用專案根目錄的「食品科學概論_測驗成績解碼器.html」。 */
  function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
  function checksum(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1679616; // 36^4
    return h.toString(36);
  }

  BLOCKS.quiz = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var items = b.items, n = items.length;
    var head = el("div", "quiz-head");
    head.innerHTML =
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
      '<input class="qid" placeholder="' + U("學號（交成績必填）", "Mã số SV") + '" style="flex:1;min-width:130px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px">' +
      '<input class="qname" placeholder="' + U("姓名", "Họ tên") + '" style="flex:1;min-width:100px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px"></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
      '<strong class="qprog">' + U("進度", "Tiến độ") + ' 0 / ' + n + '</strong>' +
      '<span class="qscore" style="color:var(--secondary);font-weight:800">' + U("得分", "Điểm") + ' 0</span></div>' +
      '<div class="pbar"><div class="pfill"></div></div>';
    var box = el("div");
    var sb = el("div", "scorebox");
    sb.innerHTML = '<div>' + U("你的成績", "Điểm của bạn") + '</div><div class="big"><span class="fscore">0</span> / ' + n + '</div>' +
      '<div class="smsg" style="margin:8px 0 16px"></div>' +
      '<div class="rcwrap" style="margin:0 auto 16px;max-width:560px;text-align:left">' +
      '<div style="font-weight:700;margin-bottom:6px">' + U("結果代碼（請複製後，貼到老師指定的表單或訊息）", "— Mã kết quả: sao chép và gửi cho thầy/cô") + '</div>' +
      '<textarea class="rcode" readonly rows="3" style="width:100%;box-sizing:border-box;font-family:monospace;font-size:12px;padding:8px;border:1.5px solid var(--line,#ccc);border-radius:8px;resize:none"></textarea>' +
      '<div class="rmsg" style="font-size:13px;color:#B34700;margin-top:4px"></div>' +
      '<button class="btn copyrc" style="margin-top:8px">📋 ' + U("複製結果代碼", "Sao chép mã") + '</button></div>' +
      '<button class="btn ghost">' + U("重新測驗", "Làm lại") + '</button>';

    var answered = 0, score = 0, picks = [], qt0 = null, attempt = 0;
    var mod = CTX.mod, bi = CTX.bi;
    // 測驗的學號欄與頁首的學號代碼同步（兩邊填任一邊都行）
    var qidInput = head.querySelector(".qid");
    if (TRACK.on) {
      if (TRACK.code()) qidInput.value = TRACK.code();
      qidInput.addEventListener("change", function () {
        TRACK.setCode(qidInput.value);
        var top = $("#ifs-code"); if (top) top.value = TRACK.code();
      });
    }
    function updateProg() {
      head.querySelector(".qprog").textContent = U("進度", "Tiến độ") + " " + answered + " / " + n;
      head.querySelector(".qscore").textContent = U("得分", "Điểm") + " " + score;
      head.querySelector(".pfill").style.width = (answered / n * 100) + "%";
    }
    function finish() {
      sb.querySelector(".fscore").textContent = score;
      var pct = score / n, m;
      if (score === n) m = U("本次全對！請再用自己的話說明餐盒的危害控制與感官問題。", "Đúng hết lần này! Hãy giải thích tình huống bằng lời của mình.");
      else if (pct >= 0.8) m = U("很棒！觀念相當扎實。", "Rất tốt!");
      else if (pct >= 0.6) m = U("不錯，再複習幾個弱點就更好。", "Khá tốt, ôn lại vài chỗ nữa nhé.");
      else m = U("建議回到前面單元再看一次翻卡與展開內容。", "Hãy xem lại các phần phía trước.");
      sb.querySelector(".smsg").textContent = m;

      var sid = head.querySelector(".qid").value.trim();
      var sname = head.querySelector(".qname").value.trim();
      var korr = items.map(function (item, i) { return picks[i] === item.a ? 1 : 0; }).join("");
      var payload = JSON.stringify({
        w: D.week || 0, c: A2 ? "a2" : undefined, id: sid, nm: sname, s: score, n: n,
        a: picks, k: korr, t: new Date().toISOString().slice(0, 16),
      });
      var body = b64utf8(payload);
      var code = "FSQ1." + body + "." + checksum(body);
      sb.querySelector(".rcode").value = code;
      sb.querySelector(".rmsg").textContent = sid ? "" : U("⚠ 尚未填學號 —— 請回到測驗上方填入學號後重新測驗，否則老師無法登記成績。", "Chưa nhập mã số SV: hãy nhập ở trên rồi làm lại.");
      TRACK.send("quiz_done", mod, "quiz", { b: bi, attempt: attempt, score: score, n: n, picks: picks, ms: qt0 ? Date.now() - qt0 : null });
      TRACK.flush();

      sb.classList.add("show");
      sb.scrollIntoView({ behavior: "smooth" });
    }
    function pick(qel, item, oi) {
      if (qel.dataset.done === "1") return;
      qel.dataset.done = "1"; answered++;
      if (qt0 === null) qt0 = Date.now();
      picks[parseInt(qel.dataset.qi, 10)] = oi;
      TRACK.send("quiz_answer", mod, "quiz", { b: bi, attempt: attempt, qi: parseInt(qel.dataset.qi, 10), pick: oi, ok: oi === item.a });
      qel.querySelectorAll(".opt").forEach(function (btn, i) {
        btn.classList.add("dim");
        if (i === item.a) btn.classList.add("correct");
        if (i === oi && oi !== item.a) btn.classList.add("wrong");
      });
      var fb = qel.querySelector(".fb");
      if (oi === item.a) { score++; fb.classList.add("good"); fb.innerHTML = U("✓ 正確！", "Đúng!") + item.e; }
      else { fb.classList.add("no"); fb.innerHTML = U("✗ 正解：", "Sai. Đáp án:") + item.o[item.a] + "。" + item.e; }
      fb.classList.add("show"); updateProg();
      if (answered === n) finish();
    }
    function build() {
      box.innerHTML = ""; answered = 0; score = 0; picks = []; qt0 = null; attempt++; updateProg();
      sb.classList.remove("show");
      items.forEach(function (item, qi) {
        var qel = el("div", "q"); qel.dataset.done = "0"; qel.dataset.qi = qi;
        qel.innerHTML = '<div class="qn">第 ' + (qi + 1) + ' 題' + (A2 ? ' · Câu ' + (qi + 1) : '') + '</div><div class="qt">' + item.q + '</div>';
        item.o.forEach(function (opt, oi) {
          var btn = el("button", "opt"); btn.textContent = opt;
          btn.onclick = function () { pick(qel, item, oi); };
          qel.appendChild(btn);
        });
        qel.appendChild(el("div", "fb"));
        box.appendChild(qel);
      });
    }
    sb.querySelector(".copyrc").onclick = function () {
      var ta = sb.querySelector(".rcode");
      ta.select(); ta.setSelectionRange(0, 99999);
      var btn = this;
      function ok() { btn.textContent = U("✓ 已複製，請貼給老師", "Đã sao chép"); setTimeout(function () { btn.textContent = "📋 " + U("複製結果代碼", "Sao chép mã"); }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(ta.value).then(ok, function () { document.execCommand("copy"); ok(); });
      else { document.execCommand("copy"); ok(); }
    };
    sb.querySelector(".ghost").onclick = function () {
      build(); window.scrollTo({ top: 0, behavior: "smooth" });
    };
    build();
    f.appendChild(head); f.appendChild(box); f.appendChild(sb);
    return f;
  };

  /* ---------- 組裝 ---------- */
  var nav = $("#nav"), main = $("#main");
  var curMod = D.modules.length ? D.modules[0].id : null, modT0 = Date.now();
  function switchMod(id, btn) {
    document.querySelectorAll(".module").forEach(function (m) { m.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
    nav.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
    btn.classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (id !== curMod) {
      TRACK.send("module_view", id, null, { from: curMod, ms: Date.now() - modT0 });
      curMod = id; modT0 = Date.now();
    }
  }
  D.modules.forEach(function (m, i) {
    var btn = el("button", i === 0 ? "active" : "", m.nav);
    btn.onclick = function () { switchMod(m.id, btn); };
    nav.appendChild(btn);

    var sec = el("section", "module" + (i === 0 ? " active" : ""));
    sec.id = m.id;
    sec.appendChild(el("div", "lead",
      '<div class="kicker">' + m.kicker + '</div><h2>' + m.h2 + '</h2><p>' + m.lead + '</p>'));
    m.blocks.forEach(function (b, bi) {
      var render = BLOCKS[b.type];
      if (!render) { console.error("未知區塊型別:", b.type); return; }
      CTX.mod = m.id; CTX.bi = bi;
      sec.appendChild(render(b));
    });
    main.appendChild(sec);
  });

  /* ---------- 學號代碼列（只在啟用記錄的週出現） ---------- */
  if (TRACK.on) {
    var bar = el("div", "codebar");
    bar.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;font-size:14px";
    bar.innerHTML = '<label for="ifs-code" style="font-weight:700">' + U("學號代碼", "Mã số SV") + '</label>' +
      '<input id="ifs-code" maxlength="20" placeholder="' + U("例：S001", "VD: S001") + '" style="width:120px;padding:6px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:14px">' +
      '<span style="opacity:.75">' + U("只記錄你的學習歷程（翻卡、配對、測驗），不需要姓名。", "Chỉ ghi lại quá trình học (lật thẻ, ghép cặp, kiểm tra), không cần tên.") + '</span>';
    nav.parentNode.insertBefore(bar, nav);
    var inp = bar.querySelector("#ifs-code");
    inp.value = TRACK.code();
    inp.addEventListener("change", function () {
      TRACK.setCode(inp.value);
      document.querySelectorAll(".qid").forEach(function (x) { x.value = TRACK.code(); });
      TRACK.send("code_set", null, null, {});
    });
    TRACK.send("session_start", curMod, null, {
      device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || "") ? "mobile" : "desktop",
      w: window.innerWidth, build: D.build || null,
    });
    // 停留時間以「頁面可見」為準：切到背景就結算一段 module_leave，回來重新計時。
    // 手機瀏覽器殺分頁常不觸發 pagehide，所以以 visibilitychange→hidden 為主。
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        TRACK.send("module_leave", curMod, null, { ms: Date.now() - modT0 }); TRACK.flush();
      } else {
        modT0 = Date.now();
      }
    });
  }
})();
</script>
