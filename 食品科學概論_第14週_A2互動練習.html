<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品科學概論 第14週 · 國合班互動練習</title>
<style>
  :root{
    --primary:#2D2A6E; --secondary:#5B4FB8; --accent:#00B8B8; --warm:#F5A623; --green:#2FA36B; --red:#D65B5B; --dark:#1A1A3E; --bg:#F4F5FA; --text:#1F1F2E; --mid:#5A5A75; --muted:#9096ac; --border:#E2E2EC; --card:#fff;
  }
/* 版型樣式 — 逐條取自「第1週_互動教學.html」，末段為新增區塊（cmp / tbl / note）。
   這裡只用 var(--x)；色票由 tokens.js 產生 :root 注入。 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:17px}
header{background:linear-gradient(120deg,var(--dark),var(--primary));color:#fff;
  padding:26px 22px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(0,0,0,.15)}
header h1{font-size:31px;font-weight:800;letter-spacing:.5px}
header .sub{color:#b9c7ff;font-size:16px;margin-top:5px}
nav{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.10);color:#dfe4ff;border:none;padding:12px 18px;
  border-radius:10px 10px 0 0;font-size:16.5px;cursor:pointer;font-weight:600;transition:.15s}
nav button:hover{background:rgba(255,255,255,.2)}
nav button.active{background:var(--bg);color:var(--primary)}
main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
.module{display:none;animation:fade .35s}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead{background:var(--dark);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:22px}
.lead .kicker{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px}
.lead h2{font-size:26px;margin:6px 0 8px}
.lead p{color:#cdd3ee;font-size:16.5px}
.sec-title{font-size:23px;font-weight:800;color:var(--primary);margin:30px 0 6px;
  display:flex;align-items:center;gap:10px}
.sec-title .bar{width:6px;height:25px;background:var(--accent);border-radius:3px;display:inline-block}
.hint{color:var(--mid);font-size:15px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* flip cards */
.flip{perspective:1100px;height:200px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px rgba(30,30,60,.08);border:1px solid var(--border)}
.front{background:var(--card)}
.front .t{font-size:21px;font-weight:800;color:var(--primary)}
.front .en{color:var(--muted);font-size:14px;margin-top:3px;font-style:italic}
.front .tap{margin-top:auto;color:var(--accent);font-size:14px;font-weight:700}
.back{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;transform:rotateY(180deg);overflow:auto}
.back p{font-size:16px}
.cbar{height:6px;border-radius:14px 14px 0 0;position:absolute;top:0;left:0;right:0}

/* expandable */
.exp{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.exp>button{width:100%;text-align:left;background:none;border:none;padding:16px 18px;cursor:pointer;
  display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;color:var(--text)}
.exp .num{background:var(--primary);color:#fff;min-width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.exp .chev{margin-left:auto;color:var(--muted);transition:.25s;font-size:20px}
.exp.on .chev{transform:rotate(90deg);color:var(--accent)}
.exp .body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 18px}
.exp.on .body{padding:0 18px 16px 62px}
.exp .body ul{margin-left:16px;color:var(--mid);font-size:16px}
.exp .body p{color:var(--mid);font-size:15.5px}
.exp .tag{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:8px}

/* info card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.card .h{font-weight:800;color:var(--primary);font-size:18px;margin-bottom:6px}
.card .en{color:var(--muted);font-size:13px;font-style:italic}
.card ul{margin:8px 0 0 18px;font-size:15.5px;color:var(--mid)}

/* timeline */
.tl{display:flex;gap:0;flex-wrap:wrap;counter-reset:s}
.tl .step{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 14px 14px;margin:8px;position:relative}
.tl .dot{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;margin-bottom:8px}
.tl .step h4{color:var(--primary);font-size:17.5px;margin-bottom:4px}
.tl .step p{font-size:15px;color:var(--mid)}

/* matching */
.match-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.pool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--secondary);color:#fff;padding:10px 17px;border-radius:22px;font-weight:700;
  cursor:grab;user-select:none;font-size:16.5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chip.used{opacity:.35;pointer-events:none}
.chip.sel{outline:3px solid var(--warm);outline-offset:2px}
.targets{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;border:2px dashed var(--border);border-radius:12px;padding:10px 14px;background:#fafbff}
.slot .desc{flex:1;font-size:16px;color:var(--text)}
.slot .drop{min-width:130px;min-height:44px;border-radius:8px;background:#eef0f8;display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:15px;padding:8px 12px}
.slot.ok{border-color:var(--green);background:#effaf3}
.slot.ok .drop{background:var(--green);color:#fff;font-weight:700}
.slot.bad{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* quiz */
.quiz-head{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.pbar{height:12px;background:#e7e9f4;border-radius:8px;overflow:hidden;margin-top:10px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--secondary));transition:width .4s}
.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.q .qn{color:var(--accent);font-weight:800;font-size:14px}
.q .qt{font-size:19.5px;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fafbff;border:2px solid var(--border);
  border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;font-size:16.5px;transition:.15s}
.opt:hover{border-color:var(--secondary)}
.opt.correct{border-color:var(--green);background:#effaf3;font-weight:700}
.opt.wrong{border-color:var(--red);background:#fdeeee}
.opt.dim{opacity:.6}
.fb{margin-top:8px;font-size:15.5px;padding:11px 14px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.good{background:#effaf3;color:#1c7a4d} .fb.no{background:#fdeeee;color:#a83b3b}
.scorebox{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:16px;
  padding:26px;text-align:center;margin-top:10px;display:none}
.scorebox.show{display:block}
.scorebox .big{font-size:46px;font-weight:800}
.btn{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:10px;
  font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.18)}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;background:#eef0fb;color:var(--secondary);padding:3px 10px;border-radius:20px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px}

/* ===== 新增區塊 ===== */
/* compare：兩欄對照（梅納 vs 焦糖化、冷藏 vs 冷凍…） */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media(max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 18px 18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06);position:relative;overflow:hidden}
.cmp .col .cbar{position:static;height:6px;margin:0 -18px 14px;border-radius:0}
.cmp .col h4{font-size:20px;font-weight:800;margin-bottom:2px}
.cmp .col .en{color:var(--muted);font-size:13px;font-style:italic;margin-bottom:8px}
.cmp .col ul{margin-left:18px;font-size:15.5px;color:var(--mid)}
.cmp .col li{margin-bottom:5px}
.cmp-note{margin-top:12px;background:#eef0fb;border-left:5px solid var(--secondary);
  border-radius:0 10px 10px 0;padding:12px 16px;font-size:16px;color:var(--primary);font-weight:600}

/* table：資料表（維生素、添加物分類…） */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px}
.tbl th{background:var(--primary);color:#fff;text-align:left;padding:12px 14px;font-weight:700;font-size:15px}
.tbl td{padding:11px 14px;border-top:1px solid var(--border);color:var(--mid);vertical-align:top}
.tbl tr:nth-child(even) td{background:#fafbff}
.tbl td:first-child{color:var(--text);font-weight:700}

/* note：重點提示條 */
.note{background:#fff8e9;border-left:5px solid var(--warm);border-radius:0 12px 12px 0;
  padding:14px 18px;margin:14px 0;font-size:16px;color:var(--text)}
.note b{color:var(--primary)}
.note.key{background:#effaf3;border-left-color:var(--green)}
.note.warn{background:#fdeeee;border-left-color:var(--red)}
/* 國合班 A2 互動練習：拼音與越南文（build_a2.js 產生的內容才會用到） */
.py{display:block;font-size:.78em;font-weight:500;color:var(--mid);margin-top:2px}
.vn{display:block;font-size:.88em;font-weight:500;color:var(--secondary);margin-top:2px}
/* Shared classroom tasks: oral response, sentence support, then sample explanation. */
.class-activity{display:grid;gap:12px;min-width:0}
.class-activity .vn{display:block;color:#0E7C7B;font-size:15px;line-height:1.5;margin-top:4px}
.activity-time{color:#0E7C7B;font-weight:700;font-size:15px}
.activity-prompt{font-size:clamp(18px,2.3vw,23px);line-height:1.5}
.sentence-stem{padding:12px 16px;background:#EFFAF3;border-left:5px solid #2FA36B;color:#1A1A3E;line-height:1.6}
.class-activity label{font-size:14px;color:#52526B}
.activity-response{display:block;width:100%;max-width:100%;min-height:72px;border:1.5px solid #A0A0B5;border-radius:8px;padding:10px 12px;resize:vertical;font:inherit;font-size:17px;background:#fff;color:#1F1F2E}
.activity-answer{border:1px solid #E2E2EC;background:#fff;border-radius:8px;padding:10px 14px;font-size:16px;line-height:1.5}
.activity-answer summary{cursor:pointer;font-weight:700;color:#2D2A6E}
.activity-answer p{margin-top:10px}
.activity-response:focus-visible,.activity-answer summary:focus-visible{outline:3px solid #0E7C7B;outline-offset:3px}
.source-note{font-size:13px;color:#52526B;line-height:1.5;overflow-wrap:anywhere;margin-top:10px}
.source-note .vn{display:block;color:#0E7C7B;font-size:13px}
.lesson-links{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.lesson-links a{color:inherit;text-underline-offset:3px}
.feedback-reason,.feedback-transfer{margin-top:6px}
.feedback-transfer{font-weight:600}
@media(max-width:640px){header{position:relative!important}.class-activity{gap:10px}}
@media print{.activity-response{min-height:64px}}


.back .vn{color:#D7FAF3}.tbl-wrap{overflow-x:auto}
</style>
</head>

<script>window.__LESSON__={"week":14,"series":["#2D2A6E","#2FA36B","#F5A623","#5B4FB8","#00B8B8","#D65B5B"],"modules":[{"id":"m0","nav":"今天 Hôm nay","kicker":"今天學什麼 · Hôm nay học gì","h2":"發酵與發酵食品","lead":"fāxiào yǔ fāxiào shípǐn　·　Lên men và thực phẩm lên men","blocks":[{"type":"cards","title":"今天學三件事\u003cspan class=\"vn\" lang=\"vi\">Hôm nay học ba điều\u003c/span>","cols":3,"items":[{"h":"看發酵的過程\u003cspan class=\"vn\" lang=\"vi\">Xem quá trình lên men\u003c/span>","p":"分清微生物參與與直接加酸。\u003cspan class=\"vn\" lang=\"vi\">Tách vi sinh vật tham gia và thêm axit trực tiếp.\u003c/span>","c":"#2D2A6E"},{"h":"看優格與乳酪\u003cspan class=\"vn\" lang=\"vi\">Xem sữa chua, phô mai\u003c/span>","p":"連起熱處理、接種、成膠與保存。\u003cspan class=\"vn\" lang=\"vi\">Nối nhiệt, cấy, gel và bảo quản.\u003c/span>","c":"#2D2A6E"},{"h":"看風味與證據\u003cspan class=\"vn\" lang=\"vi\">Xem hương vị, bằng chứng\u003c/span>","p":"發酵、活菌與益生菌分開說。\u003cspan class=\"vn\" lang=\"vi\">Nói riêng lên men, vi sinh vật sống, probiotic.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"看影片：優格怎麼做？　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Xem video: sữa chua được làm thế nào?\u003c/span>","text":"\u003ca href=\"https://www.youtube.com/watch?v=zFI6oTQLxhM&t=679s\" target=\"_blank\" rel=\"noopener\" style=\"font-weight:700\">▶ 觀察這項優格的製程\u003c/a>\u003cspan class=\"vn\">Quan sát quy trình sữa chua này\u003c/span>\u003cul style=\"margin:10px 0 0;padding-left:22px\">\u003cli>發酵的溫度是幾度？\u003cspan class=\"vn\">Nhiệt độ lên men là bao nhiêu độ?\u003c/span>\u003c/li>\u003cli>要發酵幾個小時？\u003cspan class=\"vn\">Phải lên men mấy tiếng?\u003c/span>\u003c/li>\u003c/ul>記錄影片產品的時間與溫度，不把 10 小時當作所有優格的固定時間；還要看菌種、pH 與保存。\u003cspan class=\"vn\" lang=\"vi\">Ghi thời gian, nhiệt của sản phẩm video; không dùng 10 giờ chung mọi sữa chua, còn xem giống, pH, bảo quản.\u003c/span>"},{"type":"cards","title":"一杯優格：從菌到成品\u003cspan class=\"vn\" lang=\"vi\">Một cốc sữa chua: từ vi sinh vật đến sản phẩm\u003c/span>","cols":3,"items":[{"h":"① 菌種與原料\u003cspan class=\"vn\" lang=\"vi\">Giống và nguyên liệu\u003c/span>","p":"選合適菌種，先管理乳品與設備衛生。\u003cspan class=\"vn\" lang=\"vi\">Chọn giống phù hợp, quản lý sữa và vệ sinh thiết bị.\u003c/span>","c":"#2D2A6E"},{"h":"② 產酸與成膠\u003cspan class=\"vn\" lang=\"vi\">Tạo axit, gel\u003c/span>","p":"追蹤時間、溫度與 pH，觀察質地。\u003cspan class=\"vn\" lang=\"vi\">Theo dõi thời gian, nhiệt, pH và kết cấu.\u003c/span>","c":"#2D2A6E"},{"h":"③ 冷卻與標示\u003cspan class=\"vn\" lang=\"vi\">Làm lạnh và nhãn\u003c/span>","p":"控制後酸化、保存與污染；健康宣稱另看證據。\u003cspan class=\"vn\" lang=\"vi\">Kiểm soát axit hóa tiếp, bảo quản, nhiễm; tuyên bố sức khỏe cần bằng chứng.\u003c/span>","c":"#2D2A6E"}]}]},{"id":"m1","nav":"生詞 Từ mới","kicker":"生詞 · Từ mới","h2":"本週生詞","lead":"10 個生詞　·　10 từ mới","blocks":[{"type":"flips","cols":3,"items":[{"t":"發酵","en":"fāxiào","b":"lên men"},{"t":"乳酸菌","en":"rǔsuānjùn","b":"vi khuẩn lactic"},{"t":"酵母","en":"xiàomǔ","b":"nấm men"},{"t":"乳酸發酵","en":"rǔsuān fāxiào","b":"lên men lactic"},{"t":"酒精發酵","en":"jiǔjīng fāxiào","b":"lên men rượu"}],"title":"翻卡：生詞　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Lật thẻ: từ mới\u003c/span>"},{"type":"flips","cols":3,"items":[{"t":"醋酸發酵","en":"cùsuān fāxiào","b":"lên men axetic"},{"t":"優格","en":"yōugé","b":"sữa chua"},{"t":"乳酪","en":"rǔlào","b":"phô mai"},{"t":"凝乳酶","en":"níngrǔméi","b":"rennet (enzyme đông tụ sữa)"},{"t":"醬油","en":"jiàngyóu","b":"nước tương"}]},{"type":"match","title":"配對：中文 ↔ 越南文　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Ghép: tiếng Trung ↔ tiếng Việt\u003c/span>","pairs":[{"label":"發酵","desc":"lên men"},{"label":"乳酸菌","desc":"vi khuẩn lactic"},{"label":"酵母","desc":"nấm men"},{"label":"乳酸發酵","desc":"lên men lactic"},{"label":"酒精發酵","desc":"lên men rượu"},{"label":"醋酸發酵","desc":"lên men axetic"},{"label":"優格","desc":"sữa chua"},{"label":"乳酪","desc":"phô mai"},{"label":"凝乳酶","desc":"rennet (enzyme đông tụ sữa)"},{"label":"醬油","desc":"nước tương"}],"done":"✓ 全部答對！Đúng hết!"}]},{"id":"s1","nav":"一 發酵是什麼？有哪…","kicker":"第一段 · Phần 1","h2":"發酵：過程、作用與證據","lead":"Lên men: quá trình, tác dụng, bằng chứng","blocks":[{"type":"cards","title":"發酵：需要微生物參與\u003cspan class=\"vn\" lang=\"vi\">Lên men: cần vi sinh vật tham gia\u003c/span>","cols":3,"items":[{"h":"食品加工的意思\u003cspan class=\"vn\" lang=\"vi\">Nghĩa trong thực phẩm\u003c/span>","p":"利用所需微生物的生長與酵素作用，改變食品成分。\u003cspan class=\"vn\" lang=\"vi\">Dùng sinh trưởng vi sinh vật mong muốn và enzyme để đổi thành phần.\u003c/span>","c":"#2D2A6E"},{"h":"不只細菌\u003cspan class=\"vn\" lang=\"vi\">Không chỉ vi khuẩn\u003c/span>","p":"乳酸菌、酵母或適合的黴菌，都可參與不同製程。\u003cspan class=\"vn\" lang=\"vi\">Vi khuẩn lactic, nấm men, nấm mốc phù hợp tham gia quy trình khác nhau.\u003c/span>","c":"#2D2A6E"},{"h":"不等於只加酸\u003cspan class=\"vn\" lang=\"vi\">Không bằng chỉ thêm axit\u003c/span>","p":"單純加醋變酸、茶葉自身氧化，不能直接稱微生物發酵。\u003cspan class=\"vn\" lang=\"vi\">Chỉ thêm giấm hay oxy hóa bởi enzyme lá trà không tự là lên men vi sinh.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"食品加工的廣義用法包含製醋與製麴等有氧過程；與生化課對狹義發酵的定義不同。食用時不一定仍有活菌。\u003cspan class=\"vn\" lang=\"vi\">Nghĩa rộng thực phẩm gồm quá trình có oxy như giấm, koji; khác định nghĩa lên men hẹp trong sinh hóa. Khi ăn không nhất thiết còn vi sinh vật sống.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://isappscience.org/creating-a-scientific-definition-of-fermented-foods/\" target=\"_blank\" rel=\"noopener\">發酵食品定義 / Định nghĩa: ISAPP 2021 ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 1｜變酸就叫發酵嗎？\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 1: Chua lên là lên men?\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"definition\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">老師給兩張製程卡：A 以合適乳酸菌培養，記錄產酸；B 只在牛奶中加酸，沒有微生物培養。兩杯都凝固，哪杯有發酵證據？\u003cspan class=\"vn\" lang=\"vi\">Hai thẻ quy trình: A nuôi vi khuẩn lactic phù hợp, ghi tạo axit; B chỉ thêm axit vào sữa, không nuôi vi sinh vật. Cả hai đông; cốc nào có bằng chứng lên men?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>A 有＿＿的證據；B 只有＿＿，不能只靠＿＿判斷。\u003cspan class=\"vn\" lang=\"vi\">A có bằng chứng ___; B chỉ ___, không xét chỉ từ ___.\u003c/span>\u003c/div>\u003clabel for=\"a2-w14-definition\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w14-definition\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>A 有微生物培養及產酸紀錄；B 是直接酸凝固，不能只由凝固或酸味判定發酵。\u003cspan class=\"vn\" lang=\"vi\">A có nuôi vi sinh vật, hồ sơ axit; B đông axit trực tiếp, không suy lên men chỉ từ đông hay chua.\u003c/span>\u003c/p>\u003cp>這是紙上製程比較，不需自行培養或試吃；兩杯安全與否仍要另看衛生與製程。\u003cspan class=\"vn\" lang=\"vi\">So quy trình trên giấy, không cần tự nuôi hay nếm; an toàn cả hai còn cần vệ sinh và xử lý.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"三種常教的轉化\u003cspan class=\"vn\" lang=\"vi\">Ba kiểu chuyển hóa thường học\u003c/span>","cols":3,"items":[{"h":"乳酸發酵\u003cspan class=\"vn\" lang=\"vi\">Lên men lactic\u003c/span>","p":"乳酸菌利用糖產生乳酸；有些類型也產 CO₂、乙醇等。\u003cspan class=\"vn\" lang=\"vi\">Vi khuẩn lactic dùng đường tạo axit lactic; vài kiểu còn CO₂, etanol.\u003c/span>","c":"#2D2A6E"},{"h":"酒精發酵\u003cspan class=\"vn\" lang=\"vi\">Lên men rượu\u003c/span>","p":"酵母可把糖轉成乙醇與 CO₂；麵包常利用氣體膨脹。\u003cspan class=\"vn\" lang=\"vi\">Nấm men chuyển đường thành etanol, CO₂; bánh mì thường dùng khí làm nở.\u003c/span>","c":"#2D2A6E"},{"h":"醋酸的生成\u003cspan class=\"vn\" lang=\"vi\">Tạo axit axetic\u003c/span>","p":"醋酸菌在有氧條件下氧化乙醇；不是只讓酒碰空氣。\u003cspan class=\"vn\" lang=\"vi\">Vi khuẩn axetic oxy hóa etanol khi có oxy; không chỉ để rượu gặp không khí.\u003c/span>","c":"#2D2A6E"}]},{"type":"cards","title":"保存效果：不一定每項都有\u003cspan class=\"vn\" lang=\"vi\">Tác dụng bảo quản: không luôn có mọi yếu tố\u003c/span>","cols":3,"items":[{"h":"酸與乙醇\u003cspan class=\"vn\" lang=\"vi\">Axit và etanol\u003c/span>","p":"可抑制部分微生物；效果看濃度、食品與環境。\u003cspan class=\"vn\" lang=\"vi\">Có thể hạn chế vài vi sinh vật; tùy nồng độ, thực phẩm, môi trường.\u003c/span>","c":"#2D2A6E"},{"h":"競爭\u003cspan class=\"vn\" lang=\"vi\">Cạnh tranh\u003c/span>","p":"菌群可競爭養分與環境，但不會保證排除全部病原。\u003cspan class=\"vn\" lang=\"vi\">Quần thể cạnh tranh dinh dưỡng, môi trường; không bảo đảm loại mọi mầm bệnh.\u003c/span>","c":"#2D2A6E"},{"h":"細菌素\u003cspan class=\"vn\" lang=\"vi\">Bacteriocin\u003c/span>","p":"部分菌株會產生，抑菌範圍與作用條件不同。\u003cspan class=\"vn\" lang=\"vi\">Một số chủng tạo ra, phổ và điều kiện ức chế khác nhau.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"不能只靠酸味、起泡或時間證明安全；原料、菌種、配方、製程、污染與保存都需管理。\u003cspan class=\"vn\" lang=\"vi\">Không chứng minh an toàn chỉ từ chua, bọt, thời gian; cần quản lý nguyên liệu, giống, công thức, quy trình, nhiễm, bảo quản.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://isappscience.org/creating-a-scientific-definition-of-fermented-foods/\" target=\"_blank\" rel=\"noopener\">定義與控制範圍 / Định nghĩa và phạm vi: ISAPP ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"可能的改變：要看產品\u003cspan class=\"vn\" lang=\"vi\">Biến đổi có thể có: tùy sản phẩm\u003c/span>","cols":3,"items":[{"h":"風味\u003cspan class=\"vn\" lang=\"vi\">Hương vị\u003c/span>","p":"酸、香氣、胺基酸等可改變；不一定越久越好。\u003cspan class=\"vn\" lang=\"vi\">Axit, mùi, axit amin có thể đổi; không chắc càng lâu càng ngon.\u003c/span>","c":"#2D2A6E"},{"h":"質地\u003cspan class=\"vn\" lang=\"vi\">Kết cấu\u003c/span>","p":"產酸成膠、產氣膨脹，或酵素軟化等。\u003cspan class=\"vn\" lang=\"vi\">Axit tạo gel, khí làm nở hay enzyme làm mềm.\u003c/span>","c":"#2D2A6E"},{"h":"營養與健康\u003cspan class=\"vn\" lang=\"vi\">Dinh dưỡng và sức khỏe\u003c/span>","p":"某些成分可能增加或減少；不是所有產品都有相同益處。\u003cspan class=\"vn\" lang=\"vi\">Vài chất có thể tăng hay giảm; không mọi sản phẩm cùng lợi ích.\u003c/span>","c":"#2D2A6E"}]}]},{"id":"s2","nav":"二 優格和乳酪：兩種…","kicker":"第二段 · Phần 2","h2":"優格與乳酪：成膠與製程","lead":"Sữa chua, phô mai: gel và quy trình","blocks":[{"type":"cards","title":"優格與乳酪：不要二分過頭\u003cspan class=\"vn\" lang=\"vi\">Sữa chua, phô mai: tránh chia quá cứng\u003c/span>","cols":3,"items":[{"h":"優格的酸凝膠\u003cspan class=\"vn\" lang=\"vi\">Gel axit của sữa chua\u003c/span>","p":"乳酸使 pH 下降，酪蛋白微膠粒的作用改變，形成凝膠。\u003cspan class=\"vn\" lang=\"vi\">Axit lactic hạ pH, đổi tương tác micelle casein, tạo gel.\u003c/span>","c":"#2D2A6E"},{"h":"凝乳酶型乳酪\u003cspan class=\"vn\" lang=\"vi\">Phô mai dùng rennet\u003c/span>","p":"酵素切開 κ-酪蛋白，改變穩定性，合適條件下凝聚。\u003cspan class=\"vn\" lang=\"vi\">Enzyme cắt κ-casein, đổi độ bền, kết tụ khi đủ điều kiện.\u003c/span>","c":"#2D2A6E"},{"h":"乳酪有多種路線\u003cspan class=\"vn\" lang=\"vi\">Phô mai có nhiều cách\u003c/span>","p":"也有酸凝固或酸與酵素並用；不是所有乳酪都需壓製、熟成。\u003cspan class=\"vn\" lang=\"vi\">Còn đông axit hay phối hợp axit, enzyme; không mọi phô mai cần ép, ủ chín.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"pH 約 4.6 常用於說明酪蛋白接近等電區；成膠也受熱處理、組成與溫度影響。此值不是所有危害的安全證明。\u003cspan class=\"vn\" lang=\"vi\">pH khoảng 4,6 thường minh họa vùng gần đẳng điện casein; gel còn tùy nhiệt xử lý, thành phần, nhiệt độ. Không là bằng chứng an toàn cho mọi nguy hại.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://dairyprocessinghandbook.tetrapak.com/chapter/cheese\" target=\"_blank\" rel=\"noopener\">凝固機制與範圍 / Cơ chế đông tụ: Tetra Pak 技術手冊 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"優格工業製程：一個例子\u003cspan class=\"vn\" lang=\"vi\">Quy trình sữa chua công nghiệp: một ví dụ\u003c/span>","cols":3,"items":[{"h":"調整與熱處理\u003cspan class=\"vn\" lang=\"vi\">Điều chỉnh, gia nhiệt\u003c/span>","p":"調整乳組成與均質；手冊例子為 90–95°C、5 分鐘。\u003cspan class=\"vn\" lang=\"vi\">Điều chỉnh thành phần, đồng hóa; ví dụ sổ tay: 90–95°C, 5 phút.\u003c/span>","c":"#2D2A6E"},{"h":"冷卻後接種、發酵\u003cspan class=\"vn\" lang=\"vi\">Hạ nhiệt, cấy và lên men\u003c/span>","p":"熱處理後先降至菌種合適溫度；攪拌型例子約 42–43°C。\u003cspan class=\"vn\" lang=\"vi\">Sau nhiệt cần hạ đến mức phù hợp giống; ví dụ loại khuấy khoảng 42–43°C.\u003c/span>","c":"#2D2A6E"},{"h":"監測、冷卻與保存\u003cspan class=\"vn\" lang=\"vi\">Theo dõi, làm lạnh, bảo quản\u003c/span>","p":"依製程目標監測 pH 等，再降溫減慢產酸，防再污染。\u003cspan class=\"vn\" lang=\"vi\">Theo dõi pH theo mục tiêu rồi hạ nhiệt để chậm tạo axit, tránh tái nhiễm.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"數字為 Tetra Pak 攪拌型優格製程例，不是家庭配方；菌種、配方與產品型態會改變條件。冷卻不代表所有發酵反應完全停止。\u003cspan class=\"vn\" lang=\"vi\">Số là ví dụ sữa chua khuấy của Tetra Pak, không là công thức gia đình; giống, công thức, dạng sản phẩm đổi điều kiện. Làm lạnh không nghĩa mọi phản ứng dừng hẳn.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://dairyprocessinghandbook.tetrapak.com/chapter/fermented-milk-products\" target=\"_blank\" rel=\"noopener\">優格製程例 / Ví dụ quy trình: Tetra Pak 技術手冊 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"接種前加熱，為了什麼？\u003cspan class=\"vn\" lang=\"vi\">Gia nhiệt trước cấy để làm gì?\u003c/span>","cols":3,"items":[{"h":"降低背景微生物\u003cspan class=\"vn\" lang=\"vi\">Giảm vi sinh vật nền\u003c/span>","p":"依驗證的時間溫度處理，減少競爭與危害。\u003cspan class=\"vn\" lang=\"vi\">Xử lý theo thời gian nhiệt kiểm chứng, giảm cạnh tranh, nguy hại.\u003c/span>","c":"#2D2A6E"},{"h":"改變蛋白質作用\u003cspan class=\"vn\" lang=\"vi\">Đổi tương tác protein\u003c/span>","p":"乳清蛋白可變性並參與凝膠，影響稠度、離水。\u003cspan class=\"vn\" lang=\"vi\">Whey protein có thể biến tính, tham gia gel, ảnh hưởng đặc và tách nước.\u003c/span>","c":"#2D2A6E"},{"h":"之後才加菌種\u003cspan class=\"vn\" lang=\"vi\">Sau đó mới thêm giống\u003c/span>","p":"先降至合適接種溫度，避免處理熱破壞菌種。\u003cspan class=\"vn\" lang=\"vi\">Hạ đến nhiệt cấy phù hợp trước, tránh nhiệt làm hại giống.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"短活動 2｜優格製程排順序\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 2: Xếp thứ tự quy trình\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"sequence\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">將四張卡排順序：①冷卻保存 ②適當熱處理 ③降至接種溫度並加菌 ④監測發酵。為什麼不先加菌再高溫處理？\u003cspan class=\"vn\" lang=\"vi\">Xếp bốn thẻ: ①làm lạnh bảo quản ②xử lý nhiệt phù hợp ③hạ nhiệt cấy, thêm giống ④theo dõi lên men. Sao không cấy trước nhiệt cao?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>順序是＿＿；先＿＿，再＿＿，因為＿＿。\u003cspan class=\"vn\" lang=\"vi\">Thứ tự là ___; trước ___ rồi ___ vì ___.\u003c/span>\u003c/div>\u003clabel for=\"a2-w14-sequence\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w14-sequence\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>②→③→④→①；先處理乳再降溫加菌，避免高溫傷害菌種。發酵要看目標與監測，不只看鐘。\u003cspan class=\"vn\" lang=\"vi\">②→③→④→①; xử lý sữa rồi hạ nhiệt, cấy, tránh nhiệt cao hại giống. Theo mục tiêu, theo dõi, không chỉ đồng hồ.\u003c/span>\u003c/p>\u003cp>加熱還影響乳清蛋白與凝膠；後續冷卻主要減慢產酸，不能說全部菌與反應立即停止。\u003cspan class=\"vn\" lang=\"vi\">Nhiệt còn ảnh hưởng whey protein, gel; làm lạnh sau chủ yếu chậm tạo axit, không mọi vi sinh vật, phản ứng dừng ngay.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"乳清：液體不等於純蛋白\u003cspan class=\"vn\" lang=\"vi\">Whey: chất lỏng không bằng protein tinh\u003c/span>","cols":3,"items":[{"h":"含水與多種成分\u003cspan class=\"vn\" lang=\"vi\">Nước và nhiều thành phần\u003c/span>","p":"有水、乳糖、蛋白質、礦物質等；酸乳清與甜乳清不同。\u003cspan class=\"vn\" lang=\"vi\">Có nước, lactose, protein, khoáng; whey axit khác whey ngọt.\u003c/span>","c":"#2D2A6E"},{"h":"UF 與後續加工\u003cspan class=\"vn\" lang=\"vi\">UF và xử lý sau\u003c/span>","p":"可濃縮部分蛋白質，再依產品進一步加工與乾燥。\u003cspan class=\"vn\" lang=\"vi\">Có thể cô một phần protein rồi xử lý, sấy theo sản phẩm.\u003c/span>","c":"#2D2A6E"},{"h":"濃優格的做法\u003cspan class=\"vn\" lang=\"vi\">Cách làm sữa chua đặc\u003c/span>","p":"可瀝除乳清，也可用膜或調整固形物等方式。\u003cspan class=\"vn\" lang=\"vi\">Có thể lọc whey, dùng màng hay điều chỉnh chất khô.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"乳清產量依產品與製程；不把 80–90% 當所有乳品固定值，更不能當蛋白質含量。\u003cspan class=\"vn\" lang=\"vi\">Lượng whey tùy sản phẩm, quy trình; không dùng 80–90% chung mọi sữa hay coi là hàm lượng protein.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://dairyprocessinghandbook.tetrapak.com/chapter/milk-and-whey-fractionation\" target=\"_blank\" rel=\"noopener\">乳清組成與分離 / Thành phần, phân tách whey: Tetra Pak ↗\u003c/a>\u003c/p>"}]},{"id":"s3","nav":"三 泡菜和醬油：植物…","kicker":"第三段 · Phần 3","h2":"植物發酵與產品宣稱","lead":"Lên men thực vật, tuyên bố sản phẩm","blocks":[{"type":"cards","title":"蔬菜發酵：菌相不一定照表換班\u003cspan class=\"vn\" lang=\"vi\">Lên men rau: quần thể không luôn thay theo bảng\u003c/span>","cols":3,"items":[{"h":"配方與鹽\u003cspan class=\"vn\" lang=\"vi\">Công thức và muối\u003c/span>","p":"鹽量、計算基準、溫度與原料會影響菌群。\u003cspan class=\"vn\" lang=\"vi\">Lượng, cơ sở tính muối, nhiệt, nguyên liệu ảnh hưởng quần thể.\u003c/span>","c":"#2D2A6E"},{"h":"可能的演替\u003cspan class=\"vn\" lang=\"vi\">Diễn thế có thể có\u003c/span>","p":"有些酸菜早期有明串珠菌等，後期有較耐酸乳酸菌。\u003cspan class=\"vn\" lang=\"vi\">Vài dưa chua đầu có Leuconostoc, sau có vi khuẩn lactic chịu axit hơn.\u003c/span>","c":"#2D2A6E"},{"h":"看紀錄與合適方法\u003cspan class=\"vn\" lang=\"vi\">Xem hồ sơ, phương pháp phù hợp\u003c/span>","p":"不由酸味推定安全；不用一個 2–3% 套全部泡菜。\u003cspan class=\"vn\" lang=\"vi\">Không suy an toàn từ chua; không áp 2–3% cho mọi dưa muối.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"NCHFP 的酸菜指引是指定高麗菜、鹽與操作的配方；不能換算成所有蔬菜通用鹽水比例。此課以紀錄判讀為活動。\u003cspan class=\"vn\" lang=\"vi\">Hướng dẫn NCHFP có bắp cải, muối, thao tác xác định; không đổi thành tỷ lệ nước muối chung mọi rau. Bài này dùng đọc hồ sơ.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://nchfp.uga.edu/how/can/pickles-and-fermented-products/sauerkraut/\" target=\"_blank\" rel=\"noopener\">指定酸菜配方範圍 / Phạm vi công thức: UGA NCHFP ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"釀造醬油：製麴、醪與整理\u003cspan class=\"vn\" lang=\"vi\">Nước tương ủ: koji, moromi, hoàn thiện\u003c/span>","cols":3,"items":[{"h":"製麴\u003cspan class=\"vn\" lang=\"vi\">Làm koji\u003c/span>","p":"選用合適麴菌，產生蛋白酶、澱粉酶等。\u003cspan class=\"vn\" lang=\"vi\">Chọn nấm koji phù hợp, tạo protease, amylase.\u003c/span>","c":"#2D2A6E"},{"h":"鹽水醪與熟成\u003cspan class=\"vn\" lang=\"vi\">Moromi nước muối và ủ\u003c/span>","p":"酵素持續分解；耐鹽乳酸菌、酵母等參與後續轉化。\u003cspan class=\"vn\" lang=\"vi\">Enzyme tiếp tục phân giải; vi khuẩn lactic, nấm men chịu muối tham gia.\u003c/span>","c":"#2D2A6E"},{"h":"壓榨與產品處理\u003cspan class=\"vn\" lang=\"vi\">Ép và xử lý sản phẩm\u003c/span>","p":"依產品澄清、調整及適當處理；時間與溫度依製程。\u003cspan class=\"vn\" lang=\"vi\">Làm trong, điều chỉnh, xử lý phù hợp; thời gian, nhiệt tùy quy trình.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"以釀造型醬油為例，可用 Aspergillus oryzae 或 A. sojae 等合適菌株；野生黴菌不能直接替代。不同醬油製法不全相同。\u003cspan class=\"vn\" lang=\"vi\">Ví dụ nước tương ủ có thể dùng chủng phù hợp A. oryzae, A. sojae; không thay bằng mốc hoang. Không mọi cách làm nước tương giống nhau.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/t0532e/t0532e10.htm\" target=\"_blank\" rel=\"noopener\">釀造醬油機制 / Cơ chế nước tương ủ: FAO ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"醬油風味：酵素與微生物合作\u003cspan class=\"vn\" lang=\"vi\">Hương nước tương: enzyme và vi sinh vật\u003c/span>","cols":3,"items":[{"h":"蛋白質水解\u003cspan class=\"vn\" lang=\"vi\">Thủy phân protein\u003c/span>","p":"形成胜肽與游離胺基酸；麩胺酸可帶來鮮味。\u003cspan class=\"vn\" lang=\"vi\">Tạo peptide, axit amin tự do; glutamate có thể tạo umami.\u003c/span>","c":"#2D2A6E"},{"h":"糖與發酵產物\u003cspan class=\"vn\" lang=\"vi\">Đường và sản phẩm lên men\u003c/span>","p":"澱粉分解供糖；產酸、乙醇及香氣的程度依菌群。\u003cspan class=\"vn\" lang=\"vi\">Tinh bột cho đường; mức axit, etanol, mùi tùy quần thể.\u003c/span>","c":"#2D2A6E"},{"h":"顏色與熟成\u003cspan class=\"vn\" lang=\"vi\">Màu và ủ chín\u003c/span>","p":"梅納反應等可參與褐色形成；不能只由深色判定品質。\u003cspan class=\"vn\" lang=\"vi\">Maillard và quá trình khác tạo nâu; không xét chất lượng chỉ từ màu đậm.\u003c/span>","c":"#2D2A6E"}]},{"type":"cards","title":"用越南食品練習問問題\u003cspan class=\"vn\" lang=\"vi\">Dùng món Việt tập đặt câu hỏi\u003c/span>","cols":3,"items":[{"h":"Nước mắm 魚露\u003cspan class=\"vn\" lang=\"vi\">Nước mắm\u003c/span>","p":"查原料、鹽與熟成；鮮味常涉及蛋白質分解。\u003cspan class=\"vn\" lang=\"vi\">Xem nguyên liệu, muối, ủ; umami thường liên quan phân giải protein.\u003c/span>","c":"#2D2A6E"},{"h":"Dưa muối 酸菜\u003cspan class=\"vn\" lang=\"vi\">Dưa muối\u003c/span>","p":"查是微生物發酵，還是直接加酸；保存依產品。\u003cspan class=\"vn\" lang=\"vi\">Xem lên men vi sinh hay thêm axit trực tiếp; bảo quản tùy sản phẩm.\u003c/span>","c":"#2D2A6E"},{"h":"Sữa chua、Nem chua\u003cspan class=\"vn\" lang=\"vi\">Sữa chua, nem chua\u003c/span>","p":"查加工與保存；含生肉的發酵食品不能靠酸味證明安全。\u003cspan class=\"vn\" lang=\"vi\">Xem xử lý, bảo quản; đồ lên men có thịt sống không an toàn chỉ vì chua.\u003c/span>","c":"#2D2A6E"}]},{"type":"cards","title":"發酵食品、活菌與益生菌\u003cspan class=\"vn\" lang=\"vi\">Thực phẩm lên men, vi sinh vật sống, probiotic\u003c/span>","cols":3,"items":[{"h":"發酵食品\u003cspan class=\"vn\" lang=\"vi\">Thực phẩm lên men\u003c/span>","p":"看製作過程是否有合適微生物生長與轉化。\u003cspan class=\"vn\" lang=\"vi\">Xem quá trình có sinh trưởng, chuyển hóa vi sinh vật phù hợp.\u003c/span>","c":"#2D2A6E"},{"h":"含活菌\u003cspan class=\"vn\" lang=\"vi\">Có vi sinh vật sống\u003c/span>","p":"還要確認加工、保存後是否仍有活菌及數量。\u003cspan class=\"vn\" lang=\"vi\">Cần xác nhận còn sống, lượng sau xử lý và bảo quản.\u003c/span>","c":"#2D2A6E"},{"h":"益生菌\u003cspan class=\"vn\" lang=\"vi\">Probiotic\u003c/span>","p":"需有合適活菌、足夠量與相應健康益處的證據。\u003cspan class=\"vn\" lang=\"vi\">Cần vi sinh vật sống phù hợp, lượng đủ, bằng chứng lợi ích sức khỏe.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"發酵後加熱的產品仍可屬發酵食品，但不能由名稱推定含活菌或具益生菌效果。\u003cspan class=\"vn\" lang=\"vi\">Sản phẩm gia nhiệt sau lên men vẫn có thể là thực phẩm lên men, nhưng không suy có vi sinh vật sống hay hiệu quả probiotic từ tên.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://isappscience.org/a-roundup-of-the-isapp-consensus-definitions-probiotics-prebiotics-synbiotics-postbiotics-and-fermented-foods/\" target=\"_blank\" rel=\"noopener\">活菌與證據 / Vi sinh vật sống và bằng chứng: ISAPP ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 3｜發酵食品一定含益生菌？\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 3: Lên men chắc có probiotic?\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"claim\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">兩款乳品都有乳酸發酵：A 發酵後再加熱，B 未做此步驟。能直接把 A 或 B 都叫益生菌產品嗎？還缺什麼？\u003cspan class=\"vn\" lang=\"vi\">Hai loại sữa đều lên men lactic: A gia nhiệt sau lên men, B không làm bước đó. Có gọi ngay cả hai là sản phẩm probiotic? Còn thiếu gì?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>兩者都有＿＿；是否含活菌要查＿＿，益生菌還需＿＿。\u003cspan class=\"vn\" lang=\"vi\">Cả hai có ___; còn sống cần xem ___, probiotic còn cần ___.\u003c/span>\u003c/div>\u003clabel for=\"a2-w14-claim\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w14-claim\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>都可有發酵過程；A 活菌可能被降低，B 也要確認菌株、食用時數量與健康益處證據。\u003cspan class=\"vn\" lang=\"vi\">Cả hai có thể có quá trình lên men; A có thể giảm vi sinh vật sống, B vẫn cần chủng, lượng khi ăn, bằng chứng lợi ích.\u003c/span>\u003c/p>\u003cp>「發酵」「含活菌」「益生菌」不是同一個宣稱；口感、酸味與包裝名稱不能替代證據。\u003cspan class=\"vn\" lang=\"vi\">Lên men, có vi sinh vật sống, probiotic không cùng tuyên bố; kết cấu, chua, tên không thay bằng chứng.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"}]},{"id":"sum","nav":"重點 Điểm chính","kicker":"今天的重點 · Điểm chính hôm nay","h2":"今天的重點","lead":"Điểm chính hôm nay","blocks":[{"type":"cards","title":"回顧\u003cspan class=\"vn\" lang=\"vi\">Ôn tập\u003c/span>","cols":2,"items":[{"h":"發酵看過程；酸味不是充分證據\u003cspan class=\"vn\" lang=\"vi\">Lên men xem quá trình; chua chưa đủ bằng chứng\u003c/span>"},{"h":"優格常酸凝膠；乳酪凝固有多種路線\u003cspan class=\"vn\" lang=\"vi\">Sữa chua thường gel axit; phô mai có nhiều cách đông\u003c/span>"},{"h":"菌、酵素、配方與條件共同決定結果\u003cspan class=\"vn\" lang=\"vi\">Vi sinh vật, enzyme, công thức, điều kiện cùng quyết định\u003c/span>"},{"h":"發酵、含活菌與益生菌要分開說\u003cspan class=\"vn\" lang=\"vi\">Nói riêng lên men, có vi sinh vật sống và probiotic\u003c/span>"}]},{"type":"note","title":"","text":"選一題錯題，寫「我原本想＿＿，現在知道＿＿，因為＿＿」。\u003cspan class=\"vn\" lang=\"vi\">Chọn một câu sai, viết điều đã nghĩ, nay biết và lý do.\u003c/span>"}]},{"id":"quiz","nav":"練習 Luyện tập","kicker":"練習 · Luyện tập","h2":"課後練習 10 題","lead":"10 題核心檢核；讀雙語原因，再練習用中文說明條件。10 câu: đọc lý do song ngữ rồi tập nói điều kiện bằng tiếng Trung.","blocks":[{"type":"quiz","items":[{"q":"兩杯乳品都變酸凝固，什麼資料較能支持「有發酵」？\u003cspan class=\"vn\" lang=\"vi\">Hai cốc sữa đều chua, đông; dữ liệu nào hỗ trợ có lên men?\u003c/span>","o":["只看是否濃稠 / Chỉ xem đặc","只聞酸味 / Chỉ ngửi chua","合適微生物培養與轉化的製程紀錄 / Hồ sơ nuôi vi sinh vật phù hợp, chuyển hóa","只看加入多少酸 / Chỉ lượng axit thêm"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 發酵看微生物生長及酵素轉化的過程；直接加酸也可凝固，不能只由酸味判斷。\u003cspan class=\"vn\" lang=\"vi\">Lên men xem sinh trưởng vi sinh vật, chuyển hóa enzyme; thêm axit cũng đông, không chỉ xét chua.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：我看到＿＿紀錄，才支持有發酵。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tôi thấy hồ sơ ___ mới hỗ trợ có lên men.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://isappscience.org/creating-a-scientific-definition-of-fermented-foods/\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"醋酸菌把乙醇轉為醋酸，一般需要？\u003cspan class=\"vn\" lang=\"vi\">Vi khuẩn axetic đổi etanol thành axit axetic thường cần?\u003c/span>","o":["氧氣與合適菌及條件 / Oxy, vi sinh vật, điều kiện phù hợp","只有把酒瓶蓋打開 / Chỉ mở nắp rượu","完全沒有氧氣 / Hoàn toàn không oxy","先達完全無菌再自然產酸 / Vô trùng tuyệt đối rồi tự tạo axit"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 是有氧氧化過程，在食品加工中常稱醋酸發酵；有空氣不等於任何酒都會自動成醋。\u003cspan class=\"vn\" lang=\"vi\">Đây là oxy hóa có oxy, thường gọi lên men axetic trong thực phẩm; có khí không nghĩa mọi rượu tự thành giấm.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：做醋除了乙醇，還需要＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Làm giấm ngoài etanol còn cần ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://isappscience.org/creating-a-scientific-definition-of-fermented-foods/\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"酵母酒精發酵中，麵包常主要利用哪個產物膨脹？\u003cspan class=\"vn\" lang=\"vi\">Lên men rượu của nấm men, bánh mì thường dùng gì làm nở?\u003c/span>","o":["乳酸 / Axit lactic","凝乳酶 / Rennet","麩胺酸 / Glutamate","二氧化碳 CO₂ / CO₂"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 酒精發酵可產乙醇和 CO₂；麵團保留氣體還需要合適結構及製程。\u003cspan class=\"vn\" lang=\"vi\">Có thể tạo etanol, CO₂; giữ khí trong bột còn cần cấu trúc và quy trình phù hợp.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：酵母產生＿＿，麵團需要＿＿來留住它。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Nấm men tạo ___, bột cần ___ để giữ.\u003c/span>\u003c/div>"},{"q":"優格的酸凝膠，pH 約 4.6 常用來說明？\u003cspan class=\"vn\" lang=\"vi\">Gel axit sữa chua, pH khoảng 4,6 minh họa?\u003c/span>","o":["所有微生物都已死亡 / Mọi vi sinh vật đã chết","接近酪蛋白等電區，影響聚集 / Gần vùng đẳng điện casein, ảnh hưởng kết tụ","乳糖全部消失 / Mọi lactose biến mất","所有乳品都可常溫放 / Mọi sữa để thường được"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 接近等電區時作用改變，有利酸凝膠；成膠受組成、熱處理影響，pH 不單獨證明安全。\u003cspan class=\"vn\" lang=\"vi\">Gần đẳng điện đổi tương tác, giúp gel; còn tùy thành phần, nhiệt xử lý; riêng pH chưa chứng minh an toàn.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：pH 4.6 在這裡說明＿＿，不是＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: pH 4,6 ở đây minh họa ___, không phải ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://dairyprocessinghandbook.tetrapak.com/chapter/cheese\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"「所有乳酪都只靠凝乳酶凝固」正確嗎？\u003cspan class=\"vn\" lang=\"vi\">Mọi phô mai chỉ đông nhờ rennet, đúng không?\u003c/span>","o":["不正確，還有酸凝固與組合方式 / Sai, còn đông axit, phối hợp","正確，酸完全不影響乳酪 / Đúng, axit không ảnh hưởng","正確，所有都要壓製熟成 / Đúng, mọi loại cần ép, ủ","不正確，乳酪完全沒有酵素作用 / Sai, phô mai không có enzyme"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 許多乳酪用凝乳酶，也有酸或混合路線；製程與是否熟成依品類。\u003cspan class=\"vn\" lang=\"vi\">Nhiều phô mai dùng rennet, còn axit, phối hợp; quy trình, ủ tùy loại.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：這種乳酪用＿＿；不能推成所有乳酪都＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Loại này dùng ___; không suy mọi loại đều ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://dairyprocessinghandbook.tetrapak.com/chapter/cheese\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"為何優格通常先熱處理乳，再降溫接種？\u003cspan class=\"vn\" lang=\"vi\">Sao thường xử lý nhiệt sữa rồi hạ nhiệt cấy?\u003c/span>","o":["先加菌再高溫可讓菌長更快 / Cấy rồi nhiệt cao giúp mọc nhanh","加熱只為增加酸味 / Nhiệt chỉ để tăng chua","降低背景微生物、改變蛋白質，再保護菌種 / Giảm vi sinh vật nền, đổi protein rồi bảo vệ giống","加熱後不需再防污染 / Sau nhiệt không cần tránh nhiễm"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 適當加熱可降低背景菌並使乳清蛋白變性，影響凝膠；降至合適溫度才接種，仍防再污染。\u003cspan class=\"vn\" lang=\"vi\">Nhiệt phù hợp giảm vi sinh vật nền, biến tính whey protein, ảnh hưởng gel; hạ nhiệt cấy, vẫn tránh tái nhiễm.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：先＿＿，再＿＿，因為＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Trước ___ rồi ___ vì ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://dairyprocessinghandbook.tetrapak.com/chapter/fermented-milk-products\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"優格發酵後冷卻，代表所有產酸立即停止嗎？\u003cspan class=\"vn\" lang=\"vi\">Làm lạnh sau lên men nghĩa mọi tạo axit dừng ngay?\u003c/span>","o":["是，所有菌立刻死亡 / Có, mọi vi sinh vật chết ngay","是，冷卻後 pH 永遠不變 / Có, pH không đổi nữa","是，保存時間不再重要 / Có, thời gian bảo quản không còn quan trọng","不是，主要減慢，仍需控時間與溫度 / Không, chủ yếu chậm lại, vẫn kiểm soát thời gian, nhiệt"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 冷藏減慢菌的活動，不代表完全停止；菌種與保存可能造成後酸化。\u003cspan class=\"vn\" lang=\"vi\">Lạnh làm chậm hoạt động, không dừng hết; giống, bảo quản có thể gây axit hóa tiếp.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：冷卻主要＿＿，仍要管理＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Làm lạnh chủ yếu ___, vẫn quản lý ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://dairyprocessinghandbook.tetrapak.com/chapter/fermented-milk-products\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"醬油製麴時，合適麴菌的重要任務是？\u003cspan class=\"vn\" lang=\"vi\">Trong koji nước tương, nhiệm vụ quan trọng của nấm phù hợp?\u003c/span>","o":["只有把原料染成深色 / Chỉ nhuộm nguyên liệu đậm","產酵素，幫助蛋白質和澱粉分解 / Tạo enzyme giúp phân giải protein, tinh bột","直接保證沒有全部危害 / Bảo đảm không mọi nguy hại","把所有水拿掉 / Bỏ hết nước"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 蛋白酶、澱粉酶等供應後續轉化所需成分；鹽水醪中還有耐鹽菌、酵母參與。\u003cspan class=\"vn\" lang=\"vi\">Protease, amylase cung cấp chất cho chuyển hóa tiếp; moromi còn vi khuẩn, nấm men chịu muối.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：麴菌產生＿＿，後續還有＿＿參與。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Koji tạo ___, sau còn ___ tham gia.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/t0532e/t0532e10.htm\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"發酵後再加熱的乳品，能直接宣稱有活益生菌嗎？\u003cspan class=\"vn\" lang=\"vi\">Sữa gia nhiệt sau lên men có tuyên bố ngay probiotic sống?\u003c/span>","o":["不能，需確認活菌、足夠量與健康益處證據 / Không, cần sống, lượng đủ, bằng chứng lợi ích","能，只要還有酸味 / Có, chỉ cần còn chua","能，只要名稱寫發酵 / Có, chỉ tên ghi lên men","不能，因為加熱後就從未發酵過 / Không, vì sau nhiệt là chưa từng lên men"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 發酵歷史仍存在，但活菌可能被降低；益生菌需相應菌株、活菌量與益處證據，未加熱品也不自動符合。\u003cspan class=\"vn\" lang=\"vi\">Vẫn có lịch sử lên men, nhưng sống có thể giảm; probiotic cần chủng, lượng sống, bằng chứng; chưa gia nhiệt cũng không tự đạt.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：有發酵過程，不一定有＿＿；還要查＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Có lên men không nhất thiết có ___; còn xem ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://isappscience.org/a-roundup-of-the-isapp-consensus-definitions-probiotics-prebiotics-synbiotics-postbiotics-and-fermented-foods/\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"假設一批乳清有 80 kg，能說裡面有 80 kg 乳清蛋白嗎？\u003cspan class=\"vn\" lang=\"vi\">Giả định whey 80 kg có nghĩa 80 kg whey protein?\u003c/span>","o":["能，乳清就是純蛋白 / Có, whey chính là protein tinh","能，UF 後重量一定不變 / Có, sau UF khối lượng không đổi","不能，乳清還有水、乳糖等，需組成資料 / Không, còn nước, lactose, cần dữ liệu thành phần","不能，乳清完全沒有蛋白質 / Không, whey không có protein"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 80 kg 是假設的乳清液總量；蛋白質量需乘實測含量，回收量還受膜與製程影響。\u003cspan class=\"vn\" lang=\"vi\">80 kg là tổng dịch giả định; protein cần nhân hàm lượng đo, thu hồi tùy màng, quy trình.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：乳清總量和＿＿不同，還需要＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tổng whey khác ___, cần thêm ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://dairyprocessinghandbook.tetrapak.com/chapter/milk-and-whey-fractionation\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"}]}]}],"a2":true};</script>
<script>
/*
 * runtime.client.js — 跑在瀏覽器裡的渲染器（17 週共用，逐字內嵌進每份 HTML）
 * 讀 window.__LESSON__ 的資料，把 modules / blocks 畫出來。
 * 互動行為（翻卡、展開、配對、測驗）沿用週1 手寫版的做法，不要另創一套。
 */
(function () {
  var D = window.__LESSON__;
  var SERIES = D.series;
  var $ = function (s) { return document.querySelector(s); };
  // 國合班 A2 版（D.a2）：介面文字加越南文；一般班 U() 只回中文，畫面與原本完全相同
  var A2 = !!D.a2;
  function U(zh, vn) { return A2 ? zh + " " + vn : zh; }

  /* ---------- 學習歷程記錄（Supabase） ----------
     只在 lesson.js 注入 D.track = {url, key} 的週次啟用（lib/tracking.json 的 weeks）；
     其他週 TRACK.on 為 false，send() 是空函式，教材行為完全不變。
     只送「學號代碼」與互動事件，不送姓名。送失敗就丟掉，不重試、不阻擋教材。 */
  var CTX = { mod: null, bi: 0 };   // 目前正在渲染的模組 id 與區塊序號（render 是同步的）
  var TRACK = (function () {
    var cfg = D.track;
    var noop = function () {};
    if (!cfg || !cfg.url || !cfg.key) return { on: false, send: noop, flush: noop, code: function () { return ""; }, setCode: noop };
    var KEY = "ifs_code", DKEY = "ifs_device";
    var rnd = function () { return Math.random().toString(36).slice(2, 10); };
    var sid = rnd() + Date.now().toString(36);
    // device_id：同一支手機／瀏覽器跨次開頁不變。學生後來才填學號代碼時，先前的 anon 事件可靠它回接。
    var did = "";
    try { did = localStorage.getItem(DKEY) || ""; if (!did) { did = "d" + rnd() + rnd(); localStorage.setItem(DKEY, did); } } catch (e) { did = "d" + rnd(); }
    var q = [], timer = null;
    function code() { try { return (localStorage.getItem(KEY) || "").trim(); } catch (e) { return ""; } }
    function setCode(v) { try { localStorage.setItem(KEY, (v || "").trim().slice(0, 20)); } catch (e) {} }
    function cut(s, n) { return s == null ? null : String(s).slice(0, n); }
    // 欄位長度與 payload 大小在前端先截到資料表 CHECK 的上限：PostgREST 批次 INSERT 是原子的，
    // 一筆違反 CHECK 整批都會被拒，而我們失敗即丟，會靜默掉整個 4 秒窗口。
    function send(event, mod, block, payload) {
      var p = payload || {};
      var ps = JSON.stringify(p);
      if (ps.length > 1800) p = { trunc: true, keys: Object.keys(p).slice(0, 10) };
      q.push({
        student_code: cut(code(), 20) || "anon", device_id: cut(did, 40), week: D.week || 0,
        module_id: cut(mod, 30), block_type: cut(block, 10), event: cut(event, 30),
        payload: p, session_id: cut(sid, 40), build: cut(D.build, 16), client_ts: new Date().toISOString(),
      });
      if (q.length >= 40) flush();
      else if (!timer) timer = setTimeout(flush, 4000);
    }
    function flush() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!q.length) return;
      var body = JSON.stringify(q.splice(0, 50));
      try {
        fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/ifs_lesson_events", {
          method: "POST", keepalive: true, body: body,
          headers: { "Content-Type": "application/json", "apikey": cfg.key, "Prefer": "return=minimal" },
        }).catch(noop);
      } catch (e) { /* 舊瀏覽器沒有 fetch：不記錄 */ }
      if (q.length) timer = setTimeout(flush, 1000);
    }
    window.addEventListener("pagehide", flush);
    return { on: true, send: send, flush: flush, code: code, setCode: setCode };
  })();

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function colorAt(given, i) { return given || SERIES[i % SERIES.length]; }
  function gridCls(n) { return "grid g" + (n === 2 || n === 3 || n === 4 ? n : 3); }
  function listHtml(v) {
    // body 可以是字串或字串陣列；陣列渲染成 <ul>
    if (v == null) return "";
    if (typeof v === "string") return '<p>' + v + '</p>';
    return '<ul>' + v.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
  }

  /* ---------- 區塊標題 ---------- */
  function heading(frag, b) {
    if (b.title) frag.appendChild(el("div", "sec-title", '<span class="bar"></span>' + b.title));
    if (b.hint) frag.appendChild(el("div", "hint", b.hint));
  }

  /* ---------- 各區塊 ---------- */
  var BLOCKS = {};

  BLOCKS.flips = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (d, i) {
      var c = colorAt(d.c, i);
      var card = el("div", "flip");
      if (b.h) card.style.height = b.h + "px";
      card.innerHTML =
        '<div class="flip-in">' +
        '<div class="face front"><div class="cbar" style="background:' + c + '"></div>' +
        '<div class="t">' + d.t + '</div><div class="en">' + (d.en || "") + '</div>' +
        '<div class="tap">▸ ' + U("點我看解釋", "Chạm để xem") + '</div></div>' +
        '<div class="face back"><div class="cbar" style="background:' + c + '"></div>' +
        '<p>' + d.b + '</p></div></div>';
      var mod = CTX.mod, bi = CTX.bi;
      card.onclick = function () {
        if (card.classList.toggle("on")) TRACK.send("flip_open", mod, "flips", { b: bi, i: i, t: d.t });
      };
      g.appendChild(card);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.exp = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div");
    b.items.forEach(function (t, i) {
      var box = el("div", "exp");
      var res = t.res ? '<div style="margin-top:10px;font-size:13px;color:var(--secondary);font-weight:700">🔗 ' + t.res + '</div>' : "";
      box.innerHTML =
        '<button><span class="num">' + (i + 1) + '</span><span>' + t.h + '</span>' +
        '<span class="tag">' + (t.tag || "") + '</span><span class="chev">›</span></button>' +
        '<div class="body">' + listHtml(t.body) + res + '</div>';
      var body = box.querySelector(".body");
      var mod = CTX.mod, bi = CTX.bi;
      box.querySelector("button").onclick = function () {
        var on = box.classList.toggle("on");
        if (!on) { body.style.maxHeight = "0px"; return; }
        TRACK.send("exp_open", mod, "exp", { b: bi, i: i, h: t.h });
        // 用實際內容高度展開，避免長段落被固定 max-height 截掉。
        // 必須先解除 max-height 再量：在 max-height:0 的狀態下量 scrollHeight 會得到 0，
        // 面板就只會開一條縫（實測過）。量完歸零並強制重排，transition 才有起點。
        body.style.maxHeight = "none";
        var h = body.scrollHeight;
        body.style.maxHeight = "0px";
        void body.offsetHeight;
        body.style.maxHeight = h + "px";
      };
      host.appendChild(box);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.cards = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var box = el("div", "card");
      box.style.borderTop = "4px solid " + accent;
      box.innerHTML = '<div class="h">' + c.h + '</div>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        (c.li ? '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>' : "") +
        (c.p ? '<p style="margin-top:8px;font-size:15.5px;color:var(--mid)">' + c.p + '</p>' : "");
      g.appendChild(box);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.timeline = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "tl");
    b.steps.forEach(function (s, i) {
      var st = el("div", "step");
      st.innerHTML = '<div class="dot" style="background:' + colorAt(s.c, i) + '">' + (i + 1) + '</div>' +
        '<h4>' + s.h + '</h4><p>' + s.p + '</p>';
      host.appendChild(st);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.compare = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "cmp");
    [b.left, b.right].forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var col = el("div", "col");
      col.innerHTML = '<div class="cbar" style="background:' + accent + '"></div>' +
        '<h4 style="color:' + accent + '">' + c.h + '</h4>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
      wrap.appendChild(col);
    });
    f.appendChild(wrap);
    if (b.note) f.appendChild(el("div", "cmp-note", b.note));
    return f;
  };

  BLOCKS.table = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "tblwrap");
    var html = '<table class="tbl"><thead><tr>' +
      b.head.map(function (h) { return '<th>' + h + '</th>'; }).join("") + '</tr></thead><tbody>' +
      b.rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join("") + '</tr>';
      }).join("") + '</tbody></table>';
    wrap.innerHTML = html;
    f.appendChild(wrap); return f;
  };

  BLOCKS.note = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    f.appendChild(el("div", "note" + (b.kind ? " " + b.kind : ""), b.text));
    return f;
  };

  BLOCKS.match = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "match-wrap");
    var pool = el("div", "pool"), targets = el("div", "targets");
    var pairs = b.pairs;
    var order = pairs.slice().sort(function () { return Math.random() - 0.5; });
    var selected = null, solved = 0, errors = 0, t0 = null;
    var mod = CTX.mod, bi = CTX.bi;
    var msg = el("div");
    msg.style.cssText = "margin-top:14px;font-weight:700;color:var(--green)";

    function tryMatch(slot, key) {
      if (slot.classList.contains("ok")) return;
      if (t0 === null) t0 = Date.now();
      if (slot.dataset.k === key) {
        slot.classList.add("ok"); slot.classList.remove("bad");
        slot.querySelector(".drop").textContent = key;
        var chip = pool.querySelector('.chip[data-k="' + key + '"]');
        chip.classList.add("used"); chip.classList.remove("sel");
        selected = null; solved++;
        TRACK.send("match_ok", mod, "match", { b: bi, label: key });
        if (solved === pairs.length) {
          msg.textContent = b.done || U("✓ 全部答對！", "Đúng hết!");
          TRACK.send("match_done", mod, "match", { b: bi, n: pairs.length, errors: errors, ms: Date.now() - t0 });
        }
      } else {
        errors++;
        TRACK.send("match_bad", mod, "match", { b: bi, label: key, slot: slot.dataset.k });
        slot.classList.add("bad");
        setTimeout(function () { slot.classList.remove("bad"); }, 350);
      }
    }
    order.forEach(function (q) {
      var c = el("div", "chip"); c.textContent = q.label; c.draggable = true; c.dataset.k = q.label;
      c.addEventListener("dragstart", function (e) { e.dataTransfer.setData("k", q.label); });
      c.onclick = function () {
        if (c.classList.contains("used")) return;
        if (selected === c) { c.classList.remove("sel"); selected = null; return; }
        pool.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("sel"); });
        c.classList.add("sel"); selected = c;
      };
      pool.appendChild(c);
    });
    pairs.forEach(function (q) {
      var s = el("div", "slot"); s.dataset.k = q.label;
      s.innerHTML = '<div class="drop">' + U("拖到這裡", "Kéo vào đây") + '</div><div class="desc">' + q.desc + '</div>';
      s.addEventListener("dragover", function (e) { e.preventDefault(); });
      s.addEventListener("drop", function (e) { e.preventDefault(); tryMatch(s, e.dataTransfer.getData("k")); });
      s.onclick = function () { if (selected) tryMatch(s, selected.dataset.k); };
      targets.appendChild(s);
    });
    host.appendChild(pool); host.appendChild(targets); host.appendChild(msg);
    f.appendChild(host); return f;
  };

  /* 結果代碼：把作答結果編成一串可貼給老師的代碼（FSQ1.<base64>.<檢查碼>）。
     解碼與彙整用專案根目錄的「食品科學概論_測驗成績解碼器.html」。 */
  function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
  function checksum(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1679616; // 36^4
    return h.toString(36);
  }

  BLOCKS.quiz = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var items = b.items, n = items.length;
    var head = el("div", "quiz-head");
    head.innerHTML =
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
      '<input class="qid" placeholder="' + U("學號（交成績必填）", "Mã số SV") + '" style="flex:1;min-width:130px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px">' +
      '<input class="qname" placeholder="' + U("姓名", "Họ tên") + '" style="flex:1;min-width:100px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px"></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
      '<strong class="qprog">' + U("進度", "Tiến độ") + ' 0 / ' + n + '</strong>' +
      '<span class="qscore" style="color:var(--secondary);font-weight:800">' + U("得分", "Điểm") + ' 0</span></div>' +
      '<div class="pbar"><div class="pfill"></div></div>';
    var box = el("div");
    var sb = el("div", "scorebox");
    sb.innerHTML = '<div>' + U("你的成績", "Điểm của bạn") + '</div><div class="big"><span class="fscore">0</span> / ' + n + '</div>' +
      '<div class="smsg" style="margin:8px 0 16px"></div>' +
      '<div class="rcwrap" style="margin:0 auto 16px;max-width:560px;text-align:left">' +
      '<div style="font-weight:700;margin-bottom:6px">' + U("結果代碼（請複製後，貼到老師指定的表單或訊息）", "— Mã kết quả: sao chép và gửi cho thầy/cô") + '</div>' +
      '<textarea class="rcode" readonly rows="3" style="width:100%;box-sizing:border-box;font-family:monospace;font-size:12px;padding:8px;border:1.5px solid var(--line,#ccc);border-radius:8px;resize:none"></textarea>' +
      '<div class="rmsg" style="font-size:13px;color:#B34700;margin-top:4px"></div>' +
      '<button class="btn copyrc" style="margin-top:8px">📋 ' + U("複製結果代碼", "Sao chép mã") + '</button></div>' +
      '<button class="btn ghost">' + U("重新測驗", "Làm lại") + '</button>';

    var answered = 0, score = 0, picks = [], qt0 = null, attempt = 0;
    var mod = CTX.mod, bi = CTX.bi;
    // 測驗的學號欄與頁首的學號代碼同步（兩邊填任一邊都行）
    var qidInput = head.querySelector(".qid");
    if (TRACK.on) {
      if (TRACK.code()) qidInput.value = TRACK.code();
      qidInput.addEventListener("change", function () {
        TRACK.setCode(qidInput.value);
        var top = $("#ifs-code"); if (top) top.value = TRACK.code();
      });
    }
    function updateProg() {
      head.querySelector(".qprog").textContent = U("進度", "Tiến độ") + " " + answered + " / " + n;
      head.querySelector(".qscore").textContent = U("得分", "Điểm") + " " + score;
      head.querySelector(".pfill").style.width = (answered / n * 100) + "%";
    }
    function finish() {
      sb.querySelector(".fscore").textContent = score;
      var pct = score / n, m;
      if (score === n) m = U("本次全對！請再用自己的話說明優格的製程、活菌與證據。", "Đúng hết lần này! Hãy giải thích tình huống bằng lời của mình.");
      else if (pct >= 0.8) m = U("很棒！觀念相當扎實。", "Rất tốt!");
      else if (pct >= 0.6) m = U("不錯，再複習幾個弱點就更好。", "Khá tốt, ôn lại vài chỗ nữa nhé.");
      else m = U("建議回到前面單元再看一次翻卡與展開內容。", "Hãy xem lại các phần phía trước.");
      sb.querySelector(".smsg").textContent = m;

      var sid = head.querySelector(".qid").value.trim();
      var sname = head.querySelector(".qname").value.trim();
      var korr = items.map(function (item, i) { return picks[i] === item.a ? 1 : 0; }).join("");
      var payload = JSON.stringify({
        w: D.week || 0, c: A2 ? "a2" : undefined, id: sid, nm: sname, s: score, n: n,
        a: picks, k: korr, t: new Date().toISOString().slice(0, 16),
      });
      var body = b64utf8(payload);
      var code = "FSQ1." + body + "." + checksum(body);
      sb.querySelector(".rcode").value = code;
      sb.querySelector(".rmsg").textContent = sid ? "" : U("⚠ 尚未填學號 —— 請回到測驗上方填入學號後重新測驗，否則老師無法登記成績。", "Chưa nhập mã số SV: hãy nhập ở trên rồi làm lại.");
      TRACK.send("quiz_done", mod, "quiz", { b: bi, attempt: attempt, score: score, n: n, picks: picks, ms: qt0 ? Date.now() - qt0 : null });
      TRACK.flush();

      sb.classList.add("show");
      sb.scrollIntoView({ behavior: "smooth" });
    }
    function pick(qel, item, oi) {
      if (qel.dataset.done === "1") return;
      qel.dataset.done = "1"; answered++;
      if (qt0 === null) qt0 = Date.now();
      picks[parseInt(qel.dataset.qi, 10)] = oi;
      TRACK.send("quiz_answer", mod, "quiz", { b: bi, attempt: attempt, qi: parseInt(qel.dataset.qi, 10), pick: oi, ok: oi === item.a });
      qel.querySelectorAll(".opt").forEach(function (btn, i) {
        btn.classList.add("dim");
        if (i === item.a) btn.classList.add("correct");
        if (i === oi && oi !== item.a) btn.classList.add("wrong");
      });
      var fb = qel.querySelector(".fb");
      if (oi === item.a) { score++; fb.classList.add("good"); fb.innerHTML = U("✓ 正確！", "Đúng!") + item.e; }
      else { fb.classList.add("no"); fb.innerHTML = U("✗ 正解：", "Sai. Đáp án:") + item.o[item.a] + "。" + item.e; }
      fb.classList.add("show"); updateProg();
      if (answered === n) finish();
    }
    function build() {
      box.innerHTML = ""; answered = 0; score = 0; picks = []; qt0 = null; attempt++; updateProg();
      sb.classList.remove("show");
      items.forEach(function (item, qi) {
        var qel = el("div", "q"); qel.dataset.done = "0"; qel.dataset.qi = qi;
        qel.innerHTML = '<div class="qn">第 ' + (qi + 1) + ' 題' + (A2 ? ' · Câu ' + (qi + 1) : '') + '</div><div class="qt">' + item.q + '</div>';
        item.o.forEach(function (opt, oi) {
          var btn = el("button", "opt"); btn.textContent = opt;
          btn.onclick = function () { pick(qel, item, oi); };
          qel.appendChild(btn);
        });
        qel.appendChild(el("div", "fb"));
        box.appendChild(qel);
      });
    }
    sb.querySelector(".copyrc").onclick = function () {
      var ta = sb.querySelector(".rcode");
      ta.select(); ta.setSelectionRange(0, 99999);
      var btn = this;
      function ok() { btn.textContent = U("✓ 已複製，請貼給老師", "Đã sao chép"); setTimeout(function () { btn.textContent = "📋 " + U("複製結果代碼", "Sao chép mã"); }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(ta.value).then(ok, function () { document.execCommand("copy"); ok(); });
      else { document.execCommand("copy"); ok(); }
    };
    sb.querySelector(".ghost").onclick = function () {
      build(); window.scrollTo({ top: 0, behavior: "smooth" });
    };
    build();
    f.appendChild(head); f.appendChild(box); f.appendChild(sb);
    return f;
  };

  /* ---------- 組裝 ---------- */
  var nav = $("#nav"), main = $("#main");
  var curMod = D.modules.length ? D.modules[0].id : null, modT0 = Date.now();
  function switchMod(id, btn) {
    document.querySelectorAll(".module").forEach(function (m) { m.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
    nav.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
    btn.classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (id !== curMod) {
      TRACK.send("module_view", id, null, { from: curMod, ms: Date.now() - modT0 });
      curMod = id; modT0 = Date.now();
    }
  }
  D.modules.forEach(function (m, i) {
    var btn = el("button", i === 0 ? "active" : "", m.nav);
    btn.onclick = function () { switchMod(m.id, btn); };
    nav.appendChild(btn);

    var sec = el("section", "module" + (i === 0 ? " active" : ""));
    sec.id = m.id;
    sec.appendChild(el("div", "lead",
      '<div class="kicker">' + m.kicker + '</div><h2>' + m.h2 + '</h2><p>' + m.lead + '</p>'));
    m.blocks.forEach(function (b, bi) {
      var render = BLOCKS[b.type];
      if (!render) { console.error("未知區塊型別:", b.type); return; }
      CTX.mod = m.id; CTX.bi = bi;
      sec.appendChild(render(b));
    });
    main.appendChild(sec);
  });

  /* ---------- 學號代碼列（只在啟用記錄的週出現） ---------- */
  if (TRACK.on) {
    var bar = el("div", "codebar");
    bar.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;font-size:14px";
    bar.innerHTML = '<label for="ifs-code" style="font-weight:700">學號代碼</label>' +
      '<input id="ifs-code" maxlength="20" placeholder="例：S001" style="width:120px;padding:6px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:14px">' +
      '<span style="opacity:.75">只記錄你的學習歷程（翻卡、配對、測驗），不需要姓名。</span>';
    nav.parentNode.insertBefore(bar, nav);
    var inp = bar.querySelector("#ifs-code");
    inp.value = TRACK.code();
    inp.addEventListener("change", function () {
      TRACK.setCode(inp.value);
      document.querySelectorAll(".qid").forEach(function (x) { x.value = TRACK.code(); });
      TRACK.send("code_set", null, null, {});
    });
    TRACK.send("session_start", curMod, null, {
      device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || "") ? "mobile" : "desktop",
      w: window.innerWidth, build: D.build || null,
    });
    // 停留時間以「頁面可見」為準：切到背景就結算一段 module_leave，回來重新計時。
    // 手機瀏覽器殺分頁常不觸發 pagehide，所以以 visibilitychange→hidden 為主。
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        TRACK.send("module_leave", curMod, null, { ms: Date.now() - modT0 }); TRACK.flush();
      } else {
        modT0 = Date.now();
      }
    });
  }
})();
</script>
</body>
</html>
