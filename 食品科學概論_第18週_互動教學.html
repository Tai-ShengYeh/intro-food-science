<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品科學概論 第18週 · 互動教學</title>
<style>
  :root{
    --primary:#2D2A6E; --secondary:#5B4FB8; --accent:#00B8B8; --warm:#F5A623; --green:#2FA36B; --red:#D65B5B; --dark:#1A1A3E; --bg:#F4F5FA; --text:#1F1F2E; --mid:#5A5A75; --muted:#9096ac; --border:#E2E2EC; --card:#fff;
  }
/* 版型樣式 — 逐條取自「第1週_互動教學.html」，末段為新增區塊（cmp / tbl / note）。
   這裡只用 var(--x)；色票由 tokens.js 產生 :root 注入。 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:17px}
header{background:linear-gradient(120deg,var(--dark),var(--primary));color:#fff;
  padding:26px 22px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(0,0,0,.15)}
header h1{font-size:31px;font-weight:800;letter-spacing:.5px}
header .sub{color:#b9c7ff;font-size:16px;margin-top:5px}
nav{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.10);color:#dfe4ff;border:none;padding:12px 18px;
  border-radius:10px 10px 0 0;font-size:16.5px;cursor:pointer;font-weight:600;transition:.15s}
nav button:hover{background:rgba(255,255,255,.2)}
nav button.active{background:var(--bg);color:var(--primary)}
main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
.module{display:none;animation:fade .35s}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead{background:var(--dark);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:22px}
.lead .kicker{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px}
.lead h2{font-size:26px;margin:6px 0 8px}
.lead p{color:#cdd3ee;font-size:16.5px}
.sec-title{font-size:23px;font-weight:800;color:var(--primary);margin:30px 0 6px;
  display:flex;align-items:center;gap:10px}
.sec-title .bar{width:6px;height:25px;background:var(--accent);border-radius:3px;display:inline-block}
.hint{color:var(--mid);font-size:15px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* flip cards */
.flip{perspective:1100px;height:200px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px rgba(30,30,60,.08);border:1px solid var(--border)}
.front{background:var(--card)}
.front .t{font-size:21px;font-weight:800;color:var(--primary)}
.front .en{color:var(--muted);font-size:14px;margin-top:3px;font-style:italic}
.front .tap{margin-top:auto;color:var(--accent);font-size:14px;font-weight:700}
.back{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;transform:rotateY(180deg);overflow:auto}
.back p{font-size:16px}
.cbar{height:6px;border-radius:14px 14px 0 0;position:absolute;top:0;left:0;right:0}

/* expandable */
.exp{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.exp>button{width:100%;text-align:left;background:none;border:none;padding:16px 18px;cursor:pointer;
  display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;color:var(--text)}
.exp .num{background:var(--primary);color:#fff;min-width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.exp .chev{margin-left:auto;color:var(--muted);transition:.25s;font-size:20px}
.exp.on .chev{transform:rotate(90deg);color:var(--accent)}
.exp .body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 18px}
.exp.on .body{padding:0 18px 16px 62px}
.exp .body ul{margin-left:16px;color:var(--mid);font-size:16px}
.exp .body p{color:var(--mid);font-size:15.5px}
.exp .tag{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:8px}

/* info card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.card .h{font-weight:800;color:var(--primary);font-size:18px;margin-bottom:6px}
.card .en{color:var(--muted);font-size:13px;font-style:italic}
.card ul{margin:8px 0 0 18px;font-size:15.5px;color:var(--mid)}

/* timeline */
.tl{display:flex;gap:0;flex-wrap:wrap;counter-reset:s}
.tl .step{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 14px 14px;margin:8px;position:relative}
.tl .dot{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;margin-bottom:8px}
.tl .step h4{color:var(--primary);font-size:17.5px;margin-bottom:4px}
.tl .step p{font-size:15px;color:var(--mid)}

/* matching */
.match-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.pool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--secondary);color:#fff;padding:10px 17px;border-radius:22px;font-weight:700;
  cursor:grab;user-select:none;font-size:16.5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chip.used{opacity:.35;pointer-events:none}
.chip.sel{outline:3px solid var(--warm);outline-offset:2px}
.targets{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;border:2px dashed var(--border);border-radius:12px;padding:10px 14px;background:#fafbff}
.slot .desc{flex:1;font-size:16px;color:var(--text)}
.slot .drop{min-width:130px;min-height:44px;border-radius:8px;background:#eef0f8;display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:15px;padding:8px 12px}
.slot.ok{border-color:var(--green);background:#effaf3}
.slot.ok .drop{background:var(--green);color:#fff;font-weight:700}
.slot.bad{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* quiz */
.quiz-head{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.pbar{height:12px;background:#e7e9f4;border-radius:8px;overflow:hidden;margin-top:10px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--secondary));transition:width .4s}
.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.q .qn{color:var(--accent);font-weight:800;font-size:14px}
.q .qt{font-size:19.5px;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fafbff;border:2px solid var(--border);
  border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;font-size:16.5px;transition:.15s}
.opt:hover{border-color:var(--secondary)}
.opt.correct{border-color:var(--green);background:#effaf3;font-weight:700}
.opt.wrong{border-color:var(--red);background:#fdeeee}
.opt.dim{opacity:.6}
.fb{margin-top:8px;font-size:15.5px;padding:11px 14px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.good{background:#effaf3;color:#1c7a4d} .fb.no{background:#fdeeee;color:#a83b3b}
.scorebox{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:16px;
  padding:26px;text-align:center;margin-top:10px;display:none}
.scorebox.show{display:block}
.scorebox .big{font-size:46px;font-weight:800}
.btn{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:10px;
  font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.18)}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;background:#eef0fb;color:var(--secondary);padding:3px 10px;border-radius:20px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px}

/* ===== 新增區塊 ===== */
/* compare：兩欄對照（梅納 vs 焦糖化、冷藏 vs 冷凍…） */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media(max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 18px 18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06);position:relative;overflow:hidden}
.cmp .col .cbar{position:static;height:6px;margin:0 -18px 14px;border-radius:0}
.cmp .col h4{font-size:20px;font-weight:800;margin-bottom:2px}
.cmp .col .en{color:var(--muted);font-size:13px;font-style:italic;margin-bottom:8px}
.cmp .col ul{margin-left:18px;font-size:15.5px;color:var(--mid)}
.cmp .col li{margin-bottom:5px}
.cmp-note{margin-top:12px;background:#eef0fb;border-left:5px solid var(--secondary);
  border-radius:0 10px 10px 0;padding:12px 16px;font-size:16px;color:var(--primary);font-weight:600}

/* table：資料表（維生素、添加物分類…） */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px}
.tbl th{background:var(--primary);color:#fff;text-align:left;padding:12px 14px;font-weight:700;font-size:15px}
.tbl td{padding:11px 14px;border-top:1px solid var(--border);color:var(--mid);vertical-align:top}
.tbl tr:nth-child(even) td{background:#fafbff}
.tbl td:first-child{color:var(--text);font-weight:700}

/* note：重點提示條 */
.note{background:#fff8e9;border-left:5px solid var(--warm);border-radius:0 12px 12px 0;
  padding:14px 18px;margin:14px 0;font-size:16px;color:var(--text)}
.note b{color:var(--primary)}
.note.key{background:#effaf3;border-left-color:var(--green)}
.note.warn{background:#fdeeee;border-left-color:var(--red)}
/* 國合班 A2 互動練習：拼音與越南文（build_a2.js 產生的內容才會用到） */
.py{display:block;font-size:.78em;font-weight:500;color:var(--mid);margin-top:2px}
.vn{display:block;font-size:.88em;font-weight:500;color:var(--secondary);margin-top:2px}
/* Shared classroom tasks: oral response, sentence support, then sample explanation. */
.class-activity{display:grid;gap:12px;min-width:0}
.class-activity .vn{display:block;color:#0E7C7B;font-size:15px;line-height:1.5;margin-top:4px}
.activity-time{color:#0E7C7B;font-weight:700;font-size:15px}
.activity-prompt{font-size:clamp(18px,2.3vw,23px);line-height:1.5}
.sentence-stem{padding:12px 16px;background:#EFFAF3;border-left:5px solid #2FA36B;color:#1A1A3E;line-height:1.6}
.class-activity label{font-size:14px;color:#52526B}
.activity-response{display:block;width:100%;max-width:100%;min-height:72px;border:1.5px solid #A0A0B5;border-radius:8px;padding:10px 12px;resize:vertical;font:inherit;font-size:17px;background:#fff;color:#1F1F2E}
.activity-answer{border:1px solid #E2E2EC;background:#fff;border-radius:8px;padding:10px 14px;font-size:16px;line-height:1.5}
.activity-answer summary{cursor:pointer;font-weight:700;color:#2D2A6E}
.activity-answer p{margin-top:10px}
.activity-response:focus-visible,.activity-answer summary:focus-visible{outline:3px solid #0E7C7B;outline-offset:3px}
.source-note{font-size:13px;color:#52526B;line-height:1.5;overflow-wrap:anywhere;margin-top:10px}
.source-note .vn{display:block;color:#0E7C7B;font-size:13px}
.lesson-links{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.lesson-links a{color:inherit;text-underline-offset:3px}
.feedback-reason,.feedback-transfer{margin-top:6px}
.feedback-transfer{font-weight:600}
@media(max-width:640px){header{position:relative!important}.class-activity{gap:10px}}
@media print{.activity-response{min-height:64px}}


.back .vn{color:#D7FAF3}.tbl-wrap{overflow-x:auto}
</style>
</head>

<script>window.__LESSON__={"week":18,"series":["#2D2A6E","#2FA36B","#F5A623","#5B4FB8","#00B8B8","#D65B5B"],"modules":[{"id":"m-review","nav":"全學期回顧","kicker":"MODULE 1 · 總結","h2":"全課整合：成分、變化、保存與證據","lead":"以虛擬冷藏優格統整 18 週：從一般機制出發，再核對個別產品資料與適用條件。不能由食品名稱直接推定 aw、實際菌株、熱處理或保存期限。","blocks":[{"type":"cards","title":"一瓶冷藏優格：能知道多少？\u003cspan class=\"vn\" lang=\"vi\">Một chai sữa chua lạnh: biết được gì?\u003c/span>","cols":3,"items":[{"h":"① 已知\u003cspan class=\"vn\" lang=\"vi\">Đã biết\u003c/span>","p":"虛擬標示摘錄：含乳、需冷藏、開封後儘速飲用。\u003cspan class=\"vn\" lang=\"vi\">Trích nhãn giả định: có sữa, giữ lạnh, dùng sớm sau mở.\u003c/span>","c":"#2D2A6E"},{"h":"② 可以推論\u003cspan class=\"vn\" lang=\"vi\">Có thể suy luận\u003c/span>","p":"乳蛋白可參與酸凝膠；酸與冷藏可能共同限制部分菌。\u003cspan class=\"vn\" lang=\"vi\">Protein sữa có thể tạo gel axit; axit và lạnh có thể hạn chế vài vi sinh vật.\u003c/span>","c":"#2D2A6E"},{"h":"③ 還要查\u003cspan class=\"vn\" lang=\"vi\">Cần tra thêm\u003c/span>","p":"實際 aw、pH、熱處理、菌株與活菌量；標示摘錄沒有提供。\u003cspan class=\"vn\" lang=\"vi\">aw, pH, xử lý nhiệt, chủng, lượng vi sinh sống thực; trích nhãn chưa cho.\u003c/span>","c":"#2D2A6E"}]},{"type":"cards","title":"三欄證據表：已知、推論、待查\u003cspan class=\"vn\" lang=\"vi\">Ba cột bằng chứng: đã biết, suy luận, cần tra\u003c/span>","cols":3,"items":[{"h":"已知：附來源\u003cspan class=\"vn\" lang=\"vi\">Đã biết: có nguồn\u003c/span>","p":"如標示寫「需冷藏」；附照片、品名、批次或日期。\u003cspan class=\"vn\" lang=\"vi\">Như nhãn ghi giữ lạnh; kèm ảnh, tên, lô hoặc ngày.\u003c/span>","c":"#2D2A6E"},{"h":"推論：寫理由\u003cspan class=\"vn\" lang=\"vi\">Suy luận: nêu lý do\u003c/span>","p":"如酸可能限制部分菌；清楚標出假設與條件。\u003cspan class=\"vn\" lang=\"vi\">Như axit có thể hạn chế vài vi sinh vật; ghi giả định, điều kiện.\u003c/span>","c":"#2D2A6E"},{"h":"待查：列方法\u003cspan class=\"vn\" lang=\"vi\">Cần tra: nêu cách\u003c/span>","p":"如 aw、pH、確切熱處理；列量測或原廠資料需求。\u003cspan class=\"vn\" lang=\"vi\">Như aw, pH, nhiệt cụ thể; nêu cần đo hoặc tài liệu nhà sản xuất.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"短活動 1｜把已知和推論分開\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 1: tách đã biết, suy luận\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"evidence\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">看虛擬優格標示摘錄：「含乳、需冷藏、開封後儘速飲用」。同學說「所以 aw＝0.95，而且一定有益生菌」。哪些是已知？哪些還要查？\u003cspan class=\"vn\" lang=\"vi\">Trích nhãn sữa chua giả định: có sữa, giữ lạnh, dùng sớm sau mở. Bạn nói “vậy aw=0,95 và chắc có probiotic”. Điều gì đã biết, điều gì cần tra?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>標示寫＿＿；目前不能判定＿＿，需要＿＿。\u003cspan class=\"vn\" lang=\"vi\">Nhãn ghi ___; chưa kết luận ___, cần ___.\u003c/span>\u003c/div>\u003clabel for=\"general-w18-evidence\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w18-evidence\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>已知是摘錄中的乳與保存要求；實際 aw、特定菌株、活菌量與益處證據仍待查，不能由「優格」直接得出。\u003cspan class=\"vn\" lang=\"vi\">Đã biết sữa, yêu cầu bảo quản trong trích nhãn; aw, chủng, lượng sống, bằng chứng lợi ích cần tra, không suy chỉ từ tên sữa chua.\u003c/span>\u003c/p>\u003cp>分清產品直接資訊、一般機制與個別產品證據；沒資料就明確標「待查」，不要補猜數字。\u003cspan class=\"vn\" lang=\"vi\">Tách thông tin sản phẩm, cơ chế chung, bằng chứng cụ thể; chưa có thì ghi cần tra, không đoán số.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"18 週的主線\u003cspan class=\"vn\" lang=\"vi\">Mạch chính của 18 tuần\u003c/span>","cols":3,"items":[{"h":"成分與變化\u003cspan class=\"vn\" lang=\"vi\">Thành phần, biến đổi\u003c/span>","p":"水、醣、蛋白質、脂質等，影響加工與品質。\u003cspan class=\"vn\" lang=\"vi\">Nước, đường, protein, lipid ảnh hưởng chế biến, chất lượng.\u003c/span>","c":"#2D2A6E"},{"h":"變壞與保存\u003cspan class=\"vn\" lang=\"vi\">Hỏng, bảo quản\u003c/span>","p":"生物、化學、物理變化；不同方法控制不同因素。\u003cspan class=\"vn\" lang=\"vi\">Biến đổi sinh, hóa, vật lý; cách khác kiểm soát yếu tố khác.\u003c/span>","c":"#2D2A6E"},{"h":"控制與查證\u003cspan class=\"vn\" lang=\"vi\">Kiểm soát, kiểm chứng\u003c/span>","p":"衛生、HACCP、感官與證據，讓結論有依據。\u003cspan class=\"vn\" lang=\"vi\">Vệ sinh, HACCP, cảm quan, bằng chứng làm kết luận có căn cứ.\u003c/span>","c":"#2D2A6E"}]},{"type":"cards","title":"結構與條件共同影響性質\u003cspan class=\"vn\" lang=\"vi\">Cấu trúc, điều kiện cùng ảnh hưởng tính chất\u003c/span>","cols":4,"items":[{"h":"水與 aw\u003cspan class=\"vn\" lang=\"vi\">Nước, aw\u003c/span>","p":"含水量不等於 aw；甜或乾都不能換算精確 aw。\u003cspan class=\"vn\" lang=\"vi\">Hàm lượng nước khác aw; ngọt, khô không cho aw chính xác.\u003c/span>","c":"#2D2A6E"},{"h":"醣類\u003cspan class=\"vn\" lang=\"vi\">Saccharide\u003c/span>","p":"澱粉可糊化、老化；梅納反應與焦糖化機制不同。\u003cspan class=\"vn\" lang=\"vi\">Tinh bột có thể hồ hóa, thoái hóa; Maillard khác caramel hóa.\u003c/span>","c":"#2D2A6E"},{"h":"蛋白質\u003cspan class=\"vn\" lang=\"vi\">Protein\u003c/span>","p":"變性、乳化與成膠依蛋白、pH、溫度與處理。\u003cspan class=\"vn\" lang=\"vi\">Biến tính, nhũ hóa, gel tùy protein, pH, nhiệt, xử lý.\u003c/span>","c":"#2D2A6E"},{"h":"脂質\u003cspan class=\"vn\" lang=\"vi\">Lipid\u003c/span>","p":"脂肪酸結構影響熔融；氧化還看氧、光、金屬與條件。\u003cspan class=\"vn\" lang=\"vi\">Cấu trúc axit béo ảnh hưởng nóng chảy; oxy hóa còn tùy oxy, sáng, kim loại, điều kiện.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"aw 影響微生物能否生長，低 aw 仍可能有病原存活。數值須量測並註明條件，不能由成分表直接算出。\u003cspan class=\"vn\" lang=\"vi\">aw ảnh hưởng sinh trưởng; aw thấp vẫn có thể còn mầm bệnh sống. Phải đo và nêu điều kiện, không tính trực tiếp từ nhãn.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-technical-guides/water-activity-aw-foods\" target=\"_blank\" rel=\"noopener\">aw 的定義與控制 / Định nghĩa, kiểm soát aw: FDA ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"維生素、色素、酵素：看條件\u003cspan class=\"vn\" lang=\"vi\">Vitamin, sắc tố, enzyme: xem điều kiện\u003c/span>","cols":3,"items":[{"h":"維生素\u003cspan class=\"vn\" lang=\"vi\">Vitamin\u003c/span>","p":"溶出與分解不同；種類、時間、水量和吃下的份量都重要。\u003cspan class=\"vn\" lang=\"vi\">Hòa ra nước khác phân hủy; loại, giờ, nước, phần ăn đều quan trọng.\u003c/span>","c":"#2D2A6E"},{"h":"色素\u003cspan class=\"vn\" lang=\"vi\">Sắc tố\u003c/span>","p":"顏色受 pH、氧化與加熱等影響；顏色不是安全檢驗。\u003cspan class=\"vn\" lang=\"vi\">Màu tùy pH, oxy hóa, nhiệt; màu không là kiểm nghiệm an toàn.\u003c/span>","c":"#2D2A6E"},{"h":"酵素\u003cspan class=\"vn\" lang=\"vi\">Enzyme\u003c/span>","p":"切蘋果的酵素褐變要看基質、PPO、氧與條件。\u003cspan class=\"vn\" lang=\"vi\">Nâu táo do enzyme tùy cơ chất, PPO, oxy, điều kiện.\u003c/span>","c":"#2D2A6E"}]},{"type":"cards","title":"生長、存活、殺滅：分開說\u003cspan class=\"vn\" lang=\"vi\">Sinh trưởng, sống sót, tiêu diệt: nói riêng\u003c/span>","cols":3,"items":[{"h":"抑制生長\u003cspan class=\"vn\" lang=\"vi\">Ức chế sinh trưởng\u003c/span>","p":"冷凍、低 aw 等可限制生長；存活者在適合條件下可能再長。\u003cspan class=\"vn\" lang=\"vi\">Đông lạnh, aw thấp có thể hạn chế mọc; tế bào sống có thể mọc lại khi phù hợp.\u003c/span>","c":"#2D2A6E"},{"h":"降低存活數\u003cspan class=\"vn\" lang=\"vi\">Giảm số sống sót\u003c/span>","p":"適當處理可殺滅指定目標；效果看條件，還要防再污染。\u003cspan class=\"vn\" lang=\"vi\">Xử lý phù hợp diệt mục tiêu; hiệu quả tùy điều kiện, còn ngăn tái nhiễm.\u003c/span>","c":"#2D2A6E"},{"h":"不能靠外觀\u003cspan class=\"vn\" lang=\"vi\">Không chỉ vẻ ngoài\u003c/span>","p":"看起來、聞起來正常，也不能排除病原菌或毒素。\u003cspan class=\"vn\" lang=\"vi\">Nhìn, ngửi bình thường vẫn không loại trừ mầm bệnh, độc tố.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"冷凍主要用來限制生長，可能使部分細胞受損或死亡，但不能當可靠的通用滅菌步驟；解凍後仍須妥善處理。\u003cspan class=\"vn\" lang=\"vi\">Đông lạnh chủ yếu hạn chế sinh trưởng; có thể làm hỏng, chết vài tế bào nhưng không là diệt khuẩn chung tin cậy; vẫn xử lý đúng sau rã đông.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/freezing-and-food-safety\" target=\"_blank\" rel=\"noopener\">冷凍與微生物 / Đông lạnh, vi sinh vật: USDA ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"柵欄：驗證整個組合\u003cspan class=\"vn\" lang=\"vi\">Rào cản: kiểm chứng cả tổ hợp\u003c/span>","cols":3,"items":[{"h":"選對控制因素\u003cspan class=\"vn\" lang=\"vi\">Chọn yếu tố phù hợp\u003c/span>","p":"溫度、pH、aw、包裝氣體等，對不同目標作用不同。\u003cspan class=\"vn\" lang=\"vi\">Nhiệt, pH, aw, khí bao bì tác động khác nhau lên mục tiêu.\u003c/span>","c":"#2D2A6E"},{"h":"保留必要強度\u003cspan class=\"vn\" lang=\"vi\">Giữ mức kiểm soát cần thiết\u003c/span>","p":"多種方法不自動足夠；要確認組合確實控制重要危害。\u003cspan class=\"vn\" lang=\"vi\">Nhiều cách không tự đủ; xác nhận tổ hợp kiểm soát mối nguy đáng kể.\u003c/span>","c":"#2D2A6E"},{"h":"兼顧品質與成本\u003cspan class=\"vn\" lang=\"vi\">Xét chất lượng, chi phí\u003c/span>","p":"比較安全、風味、營養、資源與使用條件，再決定。\u003cspan class=\"vn\" lang=\"vi\">So an toàn, vị, dinh dưỡng, tài nguyên, điều kiện dùng rồi quyết định.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"圖是概念示意，欄高不是數值效果；不能把各措施的效果直接相加，也不能憑柵欄數量保證保存期限。\u003cspan class=\"vn\" lang=\"vi\">Hình minh họa khái niệm, độ cao không là hiệu quả số; không cộng thẳng tác dụng hay bảo đảm hạn dùng từ số rào cản.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/10791741/\" target=\"_blank\" rel=\"noopener\">柵欄與交互作用 / Rào cản, tương tác: Leistner 2000 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"保存方法（一）：目標與條件\u003cspan class=\"vn\" lang=\"vi\">Bảo quản (1): mục tiêu, điều kiện\u003c/span>","cols":3,"items":[{"h":"熱處理\u003cspan class=\"vn\" lang=\"vi\">Xử lý nhiệt\u003c/span>","p":"巴氏殺菌與商業滅菌目標不同；商業無菌不是所有菌全無。\u003cspan class=\"vn\" lang=\"vi\">Thanh trùng, tiệt trùng thương mại khác mục tiêu; vô trùng thương mại không là hết mọi vi sinh vật.\u003c/span>","c":"#2D2A6E"},{"h":"低溫\u003cspan class=\"vn\" lang=\"vi\">Nhiệt độ thấp\u003c/span>","p":"冷藏與冷凍限制生長；並非所有反應都以同樣方式變慢。\u003cspan class=\"vn\" lang=\"vi\">Lạnh, đông hạn chế sinh trưởng; không phải mọi phản ứng đều chậm như nhau.\u003c/span>","c":"#2D2A6E"},{"h":"乾燥與濃縮\u003cspan class=\"vn\" lang=\"vi\">Sấy, cô đặc\u003c/span>","p":"移水不保證達到同樣 aw；仍看衛生、包裝與保存條件。\u003cspan class=\"vn\" lang=\"vi\">Bỏ nước không bảo đảm cùng aw; còn vệ sinh, bao bì, bảo quản.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"常溫保存須是適合該產品、處理與包裝的已驗證系統；未開封、包裝完整與依標示保存等條件不能省略。\u003cspan class=\"vn\" lang=\"vi\">Bảo quản thường cần hệ đã kiểm chứng phù hợp sản phẩm, xử lý, bao bì; không bỏ điều kiện chưa mở, gói nguyên, theo nhãn.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/shelf-stable-food\" target=\"_blank\" rel=\"noopener\">常溫保存的系統與條件 / Hệ, điều kiện bảo quản thường: USDA ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"保存方法（二）：不能只看名稱\u003cspan class=\"vn\" lang=\"vi\">Bảo quản (2): không chỉ tên gọi\u003c/span>","cols":3,"items":[{"h":"發酵\u003cspan class=\"vn\" lang=\"vi\">Lên men\u003c/span>","p":"菌種與製程可改變酸度、風味等；發酸不直接證明安全。\u003cspan class=\"vn\" lang=\"vi\">Chủng, quy trình đổi axit, vị; chua chưa chứng minh an toàn.\u003c/span>","c":"#2D2A6E"},{"h":"添加物\u003cspan class=\"vn\" lang=\"vi\">Phụ gia\u003c/span>","p":"看用途、使用範圍、限量與實際暴露；ADI 不是食品濃度上限。\u003cspan class=\"vn\" lang=\"vi\">Xem mục đích, phạm vi, giới hạn, phơi nhiễm; ADI không là giới hạn nồng độ.\u003c/span>","c":"#2D2A6E"},{"h":"包裝\u003cspan class=\"vn\" lang=\"vi\">Bao bì\u003c/span>","p":"阻隔、封口與氣體共同作用；減氧不等於殺菌。\u003cspan class=\"vn\" lang=\"vi\">Cản, kín, khí cùng tác động; giảm oxy khác diệt khuẩn.\u003c/span>","c":"#2D2A6E"}]},{"type":"cards","title":"制度、紀錄與人，怎麼配合？\u003cspan class=\"vn\" lang=\"vi\">Hệ thống, hồ sơ, con người phối hợp ra sao?\u003c/span>","cols":3,"items":[{"h":"衛生與危害分析\u003cspan class=\"vn\" lang=\"vi\">Vệ sinh, phân tích mối nguy\u003c/span>","p":"先有 GHP 基礎，再依產品找重要危害與必要控制。\u003cspan class=\"vn\" lang=\"vi\">Có nền GHP rồi tìm mối nguy đáng kể, kiểm soát thiết yếu.\u003c/span>","c":"#2D2A6E"},{"h":"HACCP 與證據\u003cspan class=\"vn\" lang=\"vi\">HACCP, bằng chứng\u003c/span>","p":"界限有依據；監測、矯正、確效與驗證各有任務。\u003cspan class=\"vn\" lang=\"vi\">Giới hạn có căn cứ; giám sát, khắc phục, thẩm định, thẩm tra có vai trò riêng.\u003c/span>","c":"#2D2A6E"},{"h":"感官與消費者\u003cspan class=\"vn\" lang=\"vi\">Cảm quan, người tiêu dùng\u003c/span>","p":"選對方法和人；喜歡不等於安全或營養較好。\u003cspan class=\"vn\" lang=\"vi\">Chọn đúng phương pháp, người; thích không bằng an toàn, bổ hơn.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"短活動 2｜保存判斷還缺什麼？\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 2: xét bảo quản còn thiếu gì?\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"conditions\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">A 是未開封、包裝完整、標示可常溫保存的 UHT 乳；B 是標示須冷藏的優格。A 開封後也能一直常溫放嗎？B 味道酸就能離開冷鏈嗎？\u003cspan class=\"vn\" lang=\"vi\">A: sữa UHT chưa mở, gói nguyên, nhãn cho bảo quản thường; B: sữa chua nhãn yêu cầu lạnh. A mở rồi vẫn để thường mãi? B chua thì bỏ lạnh được không?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>＿＿只適用於＿＿；條件改變後，要＿＿。\u003cspan class=\"vn\" lang=\"vi\">___ chỉ áp dụng khi ___; điều kiện đổi cần ___.\u003c/span>\u003c/div>\u003clabel for=\"general-w18-conditions\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w18-conditions\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>A 的常溫條件只適用指定未開封狀態；開封後依標示妥善冷藏並儘速飲用。B 仍要冷藏；酸味不能取代安全證據。\u003cspan class=\"vn\" lang=\"vi\">Điều kiện thường của A chỉ áp dụng trạng thái chưa mở đã nêu; mở rồi giữ lạnh, dùng sớm theo nhãn. B vẫn cần lạnh, chua không thay bằng chứng an toàn.\u003c/span>\u003c/p>\u003cp>熱處理、密封與保存一起作用；開封增加污染機會，原有條件與期限不能照搬。\u003cspan class=\"vn\" lang=\"vi\">Nhiệt, kín, bảo quản cùng tác động; mở tăng cơ hội nhiễm, không áp nguyên điều kiện và hạn cũ.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"exp","title":"延伸：跨週概念如何連起來","items":[{"h":"結構與條件","body":["澱粉糊化、老化都受含水、加熱與儲存條件影響，不能簡化為只有直鏈澱粉參與所有成膠與老化。蛋白質變性不同於切斷所有肽鍵；乳酸凝膠不同於所有乳酪都只靠同一種凝乳機制。","脂肪熔融還受鏈長、雙鍵位置及脂質組成等影響；不把所有不飽和脂肪視為同一熔點。維生素溶出與分解分開追蹤。"]},{"h":"加工與保存","body":["D 值須指定目標菌、溫度、基質與模型；F 值是指定參考條件的等效致死時間，F₀ 是特定參考定義，不是所有食品都套固定分鐘數。","凍結速率、後續溫度波動、包裝與解凍都影響品質。冷凍乾燥的加熱乾燥階段與產品溫度也須看條件，不是全程固定低溫、一定所有品質最佳。"]},{"h":"安全與品質","body":["低 aw 可以限制生長，仍可能有長期存活；濃縮到某固形物百分比不能直接換成通用 aw。商業無菌是適用保存條件下的目標，不是所有微生物全消失。","發酵、活菌、益生菌是不同概念。HPP、真空、充氮都須連同食品、目標危害、處理與保存評估，不能用技術名決定是否常溫。"]}]}]},{"id":"m-future","nav":"未來趨勢","kicker":"MODULE 2 · 展望","h2":"未來議題：創新要回答哪些證據問題？","lead":"把新蛋白、減少浪費與數位技術連回本課五個方向。以下是課堂評估問題，不是市場預測或特定產品宣傳。","blocks":[{"type":"cards","title":"未來議題：把宣稱變成可查問題\u003cspan class=\"vn\" lang=\"vi\">Tương lai: biến tuyên bố thành câu hỏi kiểm tra được\u003c/span>","cols":3,"items":[{"h":"新蛋白與新製程\u003cspan class=\"vn\" lang=\"vi\">Protein, quy trình mới\u003c/span>","p":"營養、過敏原與製程安全要各自評估；新穎不自動更好。\u003cspan class=\"vn\" lang=\"vi\">Đánh giá riêng dinh dưỡng, dị ứng, an toàn; mới không tự tốt hơn.\u003c/span>","c":"#2D2A6E"},{"h":"AI 與追溯\u003cspan class=\"vn\" lang=\"vi\">AI, truy xuất\u003c/span>","p":"模型需測試適用範圍；數位紀錄仍要查輸入是否可信。\u003cspan class=\"vn\" lang=\"vi\">Mô hình cần thử phạm vi; hồ sơ số vẫn cần kiểm tra đầu vào.\u003c/span>","c":"#2D2A6E"},{"h":"減少浪費\u003cspan class=\"vn\" lang=\"vi\">Giảm lãng phí\u003c/span>","p":"比較實際丟棄量、保存效果與資源代價，不只比包材重量。\u003cspan class=\"vn\" lang=\"vi\">So lượng bỏ, bảo quản, tài nguyên thực, không chỉ cân bao bì.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"這些是依 FAO 前瞻議題提出的課堂檢核問題，不代表特定技術已能取代全部檢驗，也不是產品效能排名。\u003cspan class=\"vn\" lang=\"vi\">Đây là câu hỏi lớp học dựa chủ đề dự báo FAO; không nghĩa công nghệ thay mọi kiểm nghiệm hay bảng xếp hạng sản phẩm.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/newsroom/detail/fao-report-future-food-foresight/en\" target=\"_blank\" rel=\"noopener\">食品安全前瞻 / Dự báo an toàn thực phẩm: FAO 2022 ↗\u003c/a>\u003c/p>"},{"type":"note","title":"","text":"數字與範圍：UNEP 2024 報告估計，2022 年全球零售、餐飲與家庭食物浪費約 10.5 億噸，含不可食部分，約占可供消費者食物的 19%；不等於全供應鏈損失，也不是台灣比例。\u003cspan class=\"vn\" lang=\"vi\">Số, phạm vi: UNEP 2024 ước tính năm 2022 toàn cầu lãng phí khoảng 1,05 tỷ tấn ở bán lẻ, dịch vụ ăn uống, gia đình, gồm phần không ăn được, khoảng 19% thực phẩm cho người tiêu dùng; không là toàn chuỗi hay tỷ lệ Đài Loan.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.unep.org/en/news-and-stories/press-release/world-squanders-over-1-billion-meals-day-un-report\" target=\"_blank\" rel=\"noopener\">全球、2022 年、零售／餐飲／家庭 / Toàn cầu 2022, bán lẻ, ăn uống, gia đình: UNEP ↗\u003c/a>\u003c/p>"},{"type":"exp","title":"延伸：用三個問題讀科技新聞","items":[{"h":"範圍是什麼？","body":["數字屬哪一年、地區與系統邊界？UNEP 2024 的 2022 年 19% 指零售、餐飲與家庭可供消費者食物的浪費，包含不可食部分；不能與供應鏈前段的損失比例直接相加。"]},{"h":"證據怎麼來？","body":["AI、近紅外或線上感測的能力取決於量測目標、校正與獨立驗證、產品與環境範圍；不能宣稱一台儀器能直接取代全部安全檢驗。","數位追溯能協助連結紀錄；輸入錯誤或漏記仍須處理，不會因使用區塊鏈就自動真實。"]},{"h":"改良有什麼代價？","body":["新蛋白要看營養、過敏原、污染與製程等；環境比較要說原料、能源與比較範圍。減少包材若造成更多食物損失，不一定改善整體結果。"]}]}]},{"id":"m-project","nav":"期末專題","kicker":"MODULE 3 · 專題","h2":"期末專題：分析一個產品，讓結論可以查證","lead":"選一個市售食品，以照片與可追溯來源建立證據表，再解釋成分、製程、保存與改良。資料不足時列待查，不用猜數字填空。","blocks":[{"type":"cards","title":"專題四部分：每部分都要有證據\u003cspan class=\"vn\" lang=\"vi\">Bốn phần dự án: mỗi phần có bằng chứng\u003c/span>","cols":4,"items":[{"h":"① 成分\u003cspan class=\"vn\" lang=\"vi\">Thành phần\u003c/span>","p":"拍完整標示，說主要成分與可能功能；未知 aw 要註明。\u003cspan class=\"vn\" lang=\"vi\">Chụp đủ nhãn, nói thành phần, chức năng có thể; aw chưa biết ghi rõ.\u003c/span>","c":"#2D2A6E"},{"h":"② 加工\u003cspan class=\"vn\" lang=\"vi\">Chế biến\u003c/span>","p":"區分產品資料與推測；查不到溫度、菌株就列待查。\u003cspan class=\"vn\" lang=\"vi\">Tách dữ liệu sản phẩm, suy đoán; chưa có nhiệt, chủng thì ghi cần tra.\u003c/span>","c":"#2D2A6E"},{"h":"③ 保存與安全\u003cspan class=\"vn\" lang=\"vi\">Bảo quản, an toàn\u003c/span>","p":"連起製程、包裝、開封前後條件與可能危害。\u003cspan class=\"vn\" lang=\"vi\">Nối quy trình, gói, điều kiện trước sau mở, mối nguy có thể.\u003c/span>","c":"#2D2A6E"},{"h":"④ 改良與溝通\u003cspan class=\"vn\" lang=\"vi\">Cải tiến, giao tiếp\u003c/span>","p":"提出一個建議、預期效果、代價與驗證方法。\u003cspan class=\"vn\" lang=\"vi\">Nêu một đề xuất, hiệu quả dự kiến, đánh đổi, cách kiểm chứng.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"專題回到五個方向：了解成分、讓食品安全、把食品做得更好、開發新食品、解決問題＋一起工作。這是課程簡化方向。\u003cspan class=\"vn\" lang=\"vi\">Dự án nối năm hướng của khóa học: hiểu thành phần, an toàn, chế biến tốt hơn, phát triển mới, giải quyết vấn đề và làm việc nhóm.\u003c/span>"},{"type":"cards","title":"三欄證據表：已知、推論、待查\u003cspan class=\"vn\" lang=\"vi\">Ba cột bằng chứng: đã biết, suy luận, cần tra\u003c/span>","cols":3,"items":[{"h":"已知：附來源\u003cspan class=\"vn\" lang=\"vi\">Đã biết: có nguồn\u003c/span>","p":"如標示寫「需冷藏」；附照片、品名、批次或日期。\u003cspan class=\"vn\" lang=\"vi\">Như nhãn ghi giữ lạnh; kèm ảnh, tên, lô hoặc ngày.\u003c/span>","c":"#2D2A6E"},{"h":"推論：寫理由\u003cspan class=\"vn\" lang=\"vi\">Suy luận: nêu lý do\u003c/span>","p":"如酸可能限制部分菌；清楚標出假設與條件。\u003cspan class=\"vn\" lang=\"vi\">Như axit có thể hạn chế vài vi sinh vật; ghi giả định, điều kiện.\u003c/span>","c":"#2D2A6E"},{"h":"待查：列方法\u003cspan class=\"vn\" lang=\"vi\">Cần tra: nêu cách\u003c/span>","p":"如 aw、pH、確切熱處理；列量測或原廠資料需求。\u003cspan class=\"vn\" lang=\"vi\">Như aw, pH, nhiệt cụ thể; nêu cần đo hoặc tài liệu nhà sản xuất.\u003c/span>","c":"#2D2A6E"}]},{"type":"cards","title":"報告句型：介紹與證據\u003cspan class=\"vn\" lang=\"vi\">Mẫu báo cáo: giới thiệu, bằng chứng\u003c/span>","cols":3,"items":[{"h":"介紹產品\u003cspan class=\"vn\" lang=\"vi\">Giới thiệu sản phẩm\u003c/span>","p":"我們分析＿＿；標示寫＿＿，資料來自＿＿。\u003cspan class=\"vn\" lang=\"vi\">Nhóm phân tích ___; nhãn ghi ___, nguồn là ___.\u003c/span>","c":"#2D2A6E"},{"h":"解釋機制\u003cspan class=\"vn\" lang=\"vi\">Giải thích cơ chế\u003c/span>","p":"我們推測＿＿，因為＿＿；還要確認＿＿。\u003cspan class=\"vn\" lang=\"vi\">Nhóm suy luận ___ vì ___; còn cần xác nhận ___.\u003c/span>","c":"#2D2A6E"},{"h":"說明限制\u003cspan class=\"vn\" lang=\"vi\">Nêu giới hạn\u003c/span>","p":"目前不知道＿＿；不能只靠＿＿判定＿＿。\u003cspan class=\"vn\" lang=\"vi\">Hiện chưa biết ___; không thể chỉ dựa ___ để kết luận ___.\u003c/span>","c":"#2D2A6E"}]},{"type":"cards","title":"報告句型：條件與改良\u003cspan class=\"vn\" lang=\"vi\">Mẫu báo cáo: điều kiện, cải tiến\u003c/span>","cols":3,"items":[{"h":"保存條件\u003cspan class=\"vn\" lang=\"vi\">Điều kiện bảo quản\u003c/span>","p":"標示要求＿＿；開封後還要＿＿。\u003cspan class=\"vn\" lang=\"vi\">Nhãn yêu cầu ___; sau mở còn phải ___.\u003c/span>","c":"#2D2A6E"},{"h":"提出建議\u003cspan class=\"vn\" lang=\"vi\">Nêu đề xuất\u003c/span>","p":"我們建議＿＿，希望改善＿＿，但可能＿＿。\u003cspan class=\"vn\" lang=\"vi\">Đề xuất ___ để cải thiện ___ nhưng có thể ___.\u003c/span>","c":"#2D2A6E"},{"h":"設計查證\u003cspan class=\"vn\" lang=\"vi\">Thiết kế kiểm chứng\u003c/span>","p":"可比較＿＿與＿＿，量測＿＿，再判斷＿＿。\u003cspan class=\"vn\" lang=\"vi\">Có thể so ___ với ___, đo ___ rồi xét ___.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"短活動 3｜用三句話提改良\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 3: ba câu đề xuất cải tiến\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"proposal\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">想讓虛擬冷藏優格的開封提醒更清楚。提出一個改良、可能代價與一個比較方法；不要先宣稱可延長保存期限。\u003cspan class=\"vn\" lang=\"vi\">Muốn nhắc sau mở rõ hơn trên sữa chua lạnh giả định. Nêu một cải tiến, đánh đổi, cách so sánh; chưa tuyên bố kéo dài hạn dùng.\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>我建議＿＿，但可能＿＿；可比較＿＿來檢查。\u003cspan class=\"vn\" lang=\"vi\">Đề xuất ___ nhưng có thể ___; so ___ để kiểm tra.\u003c/span>\u003c/div>\u003clabel for=\"general-w18-proposal\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w18-proposal\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>建議放大開封後冷藏提醒，但會占用版面；可比較原版與新版，請同學找出保存要求，記錄答對率與所需時間。\u003cspan class=\"vn\" lang=\"vi\">Phóng to nhắc giữ lạnh sau mở nhưng chiếm chỗ; so nhãn cũ, mới, nhờ bạn tìm yêu cầu, ghi tỷ lệ đúng và thời gian.\u003c/span>\u003c/p>\u003cp>先定義要改善的是「理解」，用相應資料評估；提醒更清楚不直接證明食品的微生物保存期限變長。\u003cspan class=\"vn\" lang=\"vi\">Xác định cải thiện là hiểu nhãn, dùng dữ liệu phù hợp; rõ hơn không chứng minh hạn vi sinh dài hơn.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"exp","title":"交件前自我檢核（不是教師正式配分）","items":[{"h":"來源與範圍","body":["附完整產品照片、標示與查閱日期；原廠、法規或研究來源須對得上產品與問題。列出已知／推論／待查，實測資料標明方法與條件。","缺少完整資料不能直接宣判產品合法或違法；指出具體疑問、適用條文與仍缺的資訊即可。"]},{"h":"機制與建議","body":["成分要說功能理由，製程與保存要連起控制目標和開封前後條件。改良提出一個可觀察目標、可能代價、比較對象和查證方法。","五個方向：了解成分、讓食品安全、把食品做得更好、開發新食品、解決問題與一起工作。報告分工、互相提問並核對證據，讓每個人都能解釋。"]},{"h":"一分鐘口頭報告","body":["一句介紹產品與來源；一句解釋保存機制與條件；一句說改良、限制與查證。老師若另有格式、頁數或期限，以正式課程要求為準。"]}]},{"type":"cards","title":"回顧\u003cspan class=\"vn\" lang=\"vi\">Ôn tập\u003c/span>","cols":2,"items":[{"h":"成分→變化→保存→查證\u003cspan class=\"vn\" lang=\"vi\">Thành phần→biến đổi→bảo quản→kiểm chứng\u003c/span>"},{"h":"已知、推論、待查分開寫\u003cspan class=\"vn\" lang=\"vi\">Viết riêng đã biết, suy luận, cần tra\u003c/span>"},{"h":"保存要說開封狀態與適用條件\u003cspan class=\"vn\" lang=\"vi\">Bảo quản nêu trạng thái mở, điều kiện\u003c/span>"},{"h":"建議要有理由、代價與查證方法\u003cspan class=\"vn\" lang=\"vi\">Đề xuất có lý do, đánh đổi, cách kiểm chứng\u003c/span>"}]}]},{"id":"m-final","nav":"期末模擬卷","kicker":"MODULE 4 · 期末考","h2":"期末模擬卷：10 題核心＋5 題整合","lead":"前 10 題與 A2 版一致；後 5 題整合熱處理、質量平衡、暴露量、永續與統計判讀。這是練習卷，不宣稱等同正式期末考。","blocks":[{"type":"quiz","items":[{"q":"只看優格成分表，可以知道精確 aw 嗎？\u003cspan class=\"vn\" lang=\"vi\">Chỉ nhãn thành phần sữa chua biết aw chính xác?\u003c/span>","o":["可以，糖排第一就是 0.6 / Có, đường đầu là 0,6","不可以，須合適量測與條件 / Không, cần đo phù hợp, điều kiện","可以，看甜不甜 / Có, xem ngọt không","可以，稠度等於 aw / Có, độ đặc là aw"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 含水量、甜度、稠度不等於 aw；沒有量測資料就應列待查。\u003cspan class=\"vn\" lang=\"vi\">Hàm lượng nước, ngọt, đặc khác aw; chưa có số đo thì ghi cần tra.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：目前不知道＿＿；需要＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Hiện chưa biết ___; cần ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-technical-guides/water-activity-aw-foods\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"標示「需冷藏」，但優格很酸，應怎麼辦？\u003cspan class=\"vn\" lang=\"vi\">Nhãn cần lạnh nhưng sữa chua chua, làm gì?\u003c/span>","o":["改成常溫 / Đổi sang nhiệt thường","只聞味道 / Chỉ ngửi","看包裝顏色 / Xem màu bao bì","仍依標示冷藏 / Vẫn giữ lạnh theo nhãn"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 酸與冷藏可能是同一系統的不同控制；不能只靠酸味取消冷鏈。\u003cspan class=\"vn\" lang=\"vi\">Axit, lạnh có thể cùng hệ kiểm soát; không bỏ lạnh chỉ vì chua.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：雖然＿＿，仍要＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Dù ___, vẫn phải ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/10791741/\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"冷凍主要怎樣保存食品？\u003cspan class=\"vn\" lang=\"vi\">Đông lạnh chủ yếu bảo quản thế nào?\u003c/span>","o":["限制微生物生長，未必殺光 / Hạn chế mọc, chưa chắc diệt hết","把所有孢子殺光 / Diệt hết bào tử","把所有毒素分解 / Phân hủy hết độc tố","任何食品解凍後都可放常溫 / Mọi thực phẩm rã rồi để thường"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 冷凍不能當可靠的通用滅菌；存活者在適合條件下可能再生長。\u003cspan class=\"vn\" lang=\"vi\">Đông không là diệt khuẩn chung tin cậy; tế bào sống có thể mọc lại khi phù hợp.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：冷凍主要＿＿；解凍後仍要＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Đông chủ yếu ___; rã rồi vẫn cần ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/freezing-and-food-safety\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"多加一道柵欄，就一定更安全嗎？\u003cspan class=\"vn\" lang=\"vi\">Thêm một rào cản chắc an toàn hơn?\u003c/span>","o":["一定，數量最多最好 / Chắc, càng nhiều càng tốt","不用管原料 / Khỏi quản nguyên liệu","要驗證對目標危害的整體效果 / Cần kiểm chứng hiệu quả cả hệ với mối nguy mục tiêu","只要選天然方法 / Chỉ cần cách tự nhiên"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 控制效果依目標與組合條件；不是把方法名稱或數量相加就足夠。\u003cspan class=\"vn\" lang=\"vi\">Hiệu quả tùy mục tiêu, điều kiện tổ hợp; không cộng tên, số là đủ.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：這個組合要控制＿＿；需要＿＿證據。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tổ hợp kiểm soát ___; cần bằng chứng ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/10791741/\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"A 乳未開封可常溫；開封後呢？\u003cspan class=\"vn\" lang=\"vi\">Sữa A chưa mở để thường; mở rồi?\u003c/span>","o":["期限與條件完全相同 / Giữ nguyên hạn, điều kiện","依開封後標示妥善保存 / Theo nhãn sau mở","密封倒回就可放常溫 / Đổ lại kín thì để thường","沒有酸味就不限時間 / Chưa chua thì vô hạn"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 開封可能引入污染；未開封條件與期限不能直接照搬，應依標示冷藏並儘速飲用。\u003cspan class=\"vn\" lang=\"vi\">Mở có thể nhiễm; không giữ nguyên điều kiện, hạn chưa mở, cần giữ lạnh, dùng sớm theo nhãn.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：未開封可＿＿；開封後要＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Chưa mở có thể ___; mở rồi cần ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/shelf-stable-food\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"看到「優格」，就能說有益生菌效果嗎？\u003cspan class=\"vn\" lang=\"vi\">Thấy sữa chua là có hiệu quả probiotic?\u003c/span>","o":["還要特定菌株、活菌量與益處證據 / Cần chủng, lượng sống, bằng chứng lợi ích","可以，酸味就是證據 / Có, chua là bằng chứng","可以，所有發酵都相同 / Có, mọi lên men giống nhau","只要包裝寫天然 / Chỉ cần ghi tự nhiên"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 發酵食品、活菌與益生菌不同；產品名或酸味不足以證明特定健康益處。\u003cspan class=\"vn\" lang=\"vi\">Lên men, vi sinh sống, probiotic khác nhau; tên, chua không chứng minh lợi ích cụ thể.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：這是＿＿食品；是否有＿＿效果還要查證。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Đây là thực phẩm ___; có hiệu quả ___ cần kiểm chứng.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://isappscience.org/creating-a-scientific-definition-of-fermented-foods/\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"「標示寫需冷藏」應放證據表哪欄？\u003cspan class=\"vn\" lang=\"vi\">“Nhãn ghi giữ lạnh” thuộc cột nào?\u003c/span>","o":["推測未標出的製程 / Đoán quy trình chưa ghi","感官喜好 / Thị hiếu","已證明所有安全 / Đã chứng minh mọi an toàn","已知，附標示照片來源 / Đã biết, kèm nguồn ảnh nhãn"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 這是可直接核對的標示資訊；實際 aw 與製程細節仍可能未知。\u003cspan class=\"vn\" lang=\"vi\">Đây là thông tin nhãn kiểm tra trực tiếp; aw, chi tiết quy trình có thể chưa biết.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：已知是＿＿，來源為＿＿；待查是＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Đã biết ___, nguồn ___; cần tra ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-technical-guides/water-activity-aw-foods\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"想知道新版優格是否更受歡迎，選哪種？\u003cspan class=\"vn\" lang=\"vi\">Muốn biết sữa chua mới được thích hơn, chọn gì?\u003c/span>","o":["只量中心溫度 / Chỉ đo nhiệt tâm","只做三角測試 / Chỉ thử tam giác","目標消費者喜好試驗 / Thử thị hiếu người tiêu dùng mục tiêu","只數添加物名稱 / Chỉ đếm tên phụ gia"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 三角測試問有無可察覺差別；更受歡迎要以合適目標消費者喜好資料回答。\u003cspan class=\"vn\" lang=\"vi\">Tam giác hỏi khác biệt cảm nhận; được thích hơn cần dữ liệu thị hiếu đúng nhóm.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：我要知道＿＿，所以選＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Muốn biết ___ nên chọn ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.iso.org/standard/76666.html\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"ADI 是什麼基準？\u003cspan class=\"vn\" lang=\"vi\">ADI là cơ sở gì?\u003c/span>","o":["長期每日攝取、每公斤體重的評估基準 / Đánh giá ăn hằng ngày lâu dài trên kg thể trọng","每包食品可加的固定毫克 / mg cố định được thêm mỗi gói","成分表上的百分比 / Phần trăm nhãn","單次中毒的分界 / Ranh giới ngộ độc một lần"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> ADI 針對長期攝取的健康評估，常以 mg/kg 體重/天表示；食品限量與暴露估算須分開。\u003cspan class=\"vn\" lang=\"vi\">ADI đánh giá sức khỏe ăn lâu dài, thường mg/kg thể trọng/ngày; tách giới hạn thực phẩm, ước tính phơi nhiễm.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：ADI 的單位是＿＿；它不是＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Đơn vị ADI ___; khác ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.who.int/news-room/fact-sheets/detail/food-additives\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"哪個改良提案最完整？\u003cspan class=\"vn\" lang=\"vi\">Đề xuất nào đầy đủ nhất?\u003c/span>","o":["換綠色包裝就更環保 / Bao bì xanh là sinh thái hơn","說改善目標、代價與比較方法 / Nêu mục tiêu, đánh đổi, cách so","寫「最新科技」就好 / Chỉ ghi công nghệ mới","先保證期限加倍 / Bảo đảm hạn gấp đôi trước"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 改良要先定義目標，再比較效果與代價；沒有實驗或適當證據不能先保證保存期限。\u003cspan class=\"vn\" lang=\"vi\">Cải tiến xác định mục tiêu rồi so hiệu quả, đánh đổi; chưa có bằng chứng không bảo đảm hạn.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：建議＿＿；比較＿＿來驗證＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Đề xuất ___; so ___ để kiểm chứng ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/10791741/\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"指定溫度與基質下 D＝2 分鐘；理想對數線性模型處理 6 分鐘，降低多少？\u003cspan class=\"vn\" lang=\"vi\">D=2 phút ở nhiệt, nền đã nêu; mô hình log tuyến tính lý tưởng xử lý 6 phút giảm bao nhiêu?\u003c/span>","o":["1 log / Một log","2 log / Hai log","3 log / Ba log","完全零菌 / Hết mọi vi sinh vật"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 6/2＝3D，即存活數降至原來 10⁻³；模型、條件與目標菌不同，不能推成通用烹調處方。\u003cspan class=\"vn\" lang=\"vi\">6/2=3D, số sống còn 10⁻³ ban đầu; tùy mô hình, điều kiện, mục tiêu, không là hướng dẫn nấu chung.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：在＿＿條件下，6 分鐘＝＿＿D。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Trong điều kiện ___, 6 phút=___ D。\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-guides/sterilizing-symbols-d-z-f\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"將含固形物 10% 的 100 kg 液體濃縮到 20%，固形物無損，最後多少？\u003cspan class=\"vn\" lang=\"vi\">100 kg dịch có 10% chất khô cô đến 20%, không mất chất khô, còn bao nhiêu?\u003c/span>","o":["50 kg / 50 kg","20 kg / 20 kg","80 kg / 80 kg","200 kg / 200 kg"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 原固形物 10 kg；10/0.20＝50 kg。這是質量平衡，仍不能直接算出 aw 或保存期限。\u003cspan class=\"vn\" lang=\"vi\">Ban đầu chất khô 10 kg; 10/0,20=50 kg. Cân bằng khối lượng không cho aw, hạn dùng.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：固形物是＿＿kg；成品總量為＿＿kg。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Chất khô ___ kg; tổng sản phẩm ___ kg。\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/V5030E/V5030E0c.htm\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"假設添加物濃度 100 mg/kg，吃 0.2 kg，體重 50 kg，這來源暴露多少？\u003cspan class=\"vn\" lang=\"vi\">Giả định 100 mg/kg, ăn 0,2 kg, thể trọng 50 kg, phơi nhiễm nguồn này bao nhiêu?\u003c/span>","o":["2 mg/kg 體重/天 / 2 mg/kg thể trọng/ngày","20 mg/kg 體重/天 / 20 mg/kg thể trọng/ngày","100 mg/kg 體重/天 / 100 mg/kg thể trọng/ngày","0.4 mg/kg 體重/天 / 0,4 mg/kg thể trọng/ngày"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 吃下 20 mg，再除以 50 kg＝0.4。只計此來源；長期評估還需適當攝食資料與其他來源。\u003cspan class=\"vn\" lang=\"vi\">Ăn 20 mg, chia 50 kg=0,4; chỉ nguồn này, đánh giá lâu dài cần dữ liệu ăn, nguồn khác.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：吃下＿＿mg；除以體重後是＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Ăn ___ mg; chia thể trọng là ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.who.int/news-room/fact-sheets/detail/food-additives\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"用較薄包材但食物報廢增加，能只憑重量說更永續嗎？\u003cspan class=\"vn\" lang=\"vi\">Bao bì mỏng hơn nhưng bỏ thực phẩm tăng, chỉ cân để nói bền vững hơn?\u003c/span>","o":["可以，包材少就是 / Có, ít vật liệu là đủ","不能，要評估整個系統與範圍 / Không, cần xét cả hệ, phạm vi","可以，只比顏色 / Có, chỉ so màu","只要可回收就一定較好 / Tái chế được là luôn tốt hơn"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 應連食物損失、包裝、運輸、保存等評估，並說清楚比較範圍；單一重量不代表總環境影響。\u003cspan class=\"vn\" lang=\"vi\">Xét mất thực phẩm, bao bì, vận chuyển, bảo quản và phạm vi; một khối lượng không đại diện toàn tác động.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：本比較還缺＿＿，所以不能直接說＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: So sánh còn thiếu ___ nên chưa nói ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.unep.org/en/news-and-stories/press-release/world-squanders-over-1-billion-meals-day-un-report\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"三角差異試驗未達顯著，哪個說法合理？\u003cspan class=\"vn\" lang=\"vi\">Thử khác biệt tam giác không có ý nghĩa thống kê, nói gì hợp lý?\u003c/span>","o":["兩產品完全相同 / Hai sản phẩm hoàn toàn giống","一定同樣受歡迎 / Chắc được thích như nhau","此設計未取得足夠差異證據，不能直接證明等同 / Thiết kế chưa đủ bằng chứng khác, không tự chứng minh tương đương","都安全可食 / Đều an toàn ăn"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 未顯著不等於證明沒有差異；若要論相似性，需預先設計相似性試驗及誤判風險、檢定力。\u003cspan class=\"vn\" lang=\"vi\">Không có ý nghĩa không chứng minh không khác; xét tương tự cần thiết kế trước, rủi ro, lực kiểm định.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：這次未取得＿＿；若要證明＿＿，需另規劃。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Chưa đủ ___; muốn chứng minh ___ cần thiết kế thêm.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.iso.org/standard/76666.html\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"}]}]}]};</script>
<script>
/*
 * runtime.client.js — 跑在瀏覽器裡的渲染器（17 週共用，逐字內嵌進每份 HTML）
 * 讀 window.__LESSON__ 的資料，把 modules / blocks 畫出來。
 * 互動行為（翻卡、展開、配對、測驗）沿用週1 手寫版的做法，不要另創一套。
 */
(function () {
  var D = window.__LESSON__;
  var SERIES = D.series;
  var $ = function (s) { return document.querySelector(s); };
  // 國合班 A2 版（D.a2）：介面文字加越南文；一般班 U() 只回中文，畫面與原本完全相同
  var A2 = !!D.a2;
  function U(zh, vn) { return A2 ? zh + " " + vn : zh; }

  /* ---------- 學習歷程記錄（Supabase） ----------
     只在 lesson.js 注入 D.track = {url, key} 的週次啟用（lib/tracking.json 的 weeks）；
     其他週 TRACK.on 為 false，send() 是空函式，教材行為完全不變。
     只送「學號代碼」與互動事件，不送姓名。送失敗就丟掉，不重試、不阻擋教材。 */
  var CTX = { mod: null, bi: 0 };   // 目前正在渲染的模組 id 與區塊序號（render 是同步的）
  var TRACK = (function () {
    var cfg = D.track;
    var noop = function () {};
    if (!cfg || !cfg.url || !cfg.key) return { on: false, send: noop, flush: noop, code: function () { return ""; }, setCode: noop };
    var KEY = "ifs_code", DKEY = "ifs_device";
    var rnd = function () { return Math.random().toString(36).slice(2, 10); };
    var sid = rnd() + Date.now().toString(36);
    // device_id：同一支手機／瀏覽器跨次開頁不變。學生後來才填學號代碼時，先前的 anon 事件可靠它回接。
    var did = "";
    try { did = localStorage.getItem(DKEY) || ""; if (!did) { did = "d" + rnd() + rnd(); localStorage.setItem(DKEY, did); } } catch (e) { did = "d" + rnd(); }
    var q = [], timer = null;
    function code() { try { return (localStorage.getItem(KEY) || "").trim(); } catch (e) { return ""; } }
    function setCode(v) { try { localStorage.setItem(KEY, (v || "").trim().slice(0, 20)); } catch (e) {} }
    function cut(s, n) { return s == null ? null : String(s).slice(0, n); }
    // 欄位長度與 payload 大小在前端先截到資料表 CHECK 的上限：PostgREST 批次 INSERT 是原子的，
    // 一筆違反 CHECK 整批都會被拒，而我們失敗即丟，會靜默掉整個 4 秒窗口。
    function send(event, mod, block, payload) {
      var p = payload || {};
      var ps = JSON.stringify(p);
      if (ps.length > 1800) p = { trunc: true, keys: Object.keys(p).slice(0, 10) };
      q.push({
        student_code: cut(code(), 20) || "anon", device_id: cut(did, 40), week: D.week || 0,
        module_id: cut(mod, 30), block_type: cut(block, 10), event: cut(event, 30),
        payload: p, session_id: cut(sid, 40), build: cut(D.build, 16), client_ts: new Date().toISOString(),
      });
      if (q.length >= 40) flush();
      else if (!timer) timer = setTimeout(flush, 4000);
    }
    function flush() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!q.length) return;
      var body = JSON.stringify(q.splice(0, 50));
      try {
        fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/ifs_lesson_events", {
          method: "POST", keepalive: true, body: body,
          headers: { "Content-Type": "application/json", "apikey": cfg.key, "Prefer": "return=minimal" },
        }).catch(noop);
      } catch (e) { /* 舊瀏覽器沒有 fetch：不記錄 */ }
      if (q.length) timer = setTimeout(flush, 1000);
    }
    window.addEventListener("pagehide", flush);
    return { on: true, send: send, flush: flush, code: code, setCode: setCode };
  })();

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function colorAt(given, i) { return given || SERIES[i % SERIES.length]; }
  function gridCls(n) { return "grid g" + (n === 2 || n === 3 || n === 4 ? n : 3); }
  function listHtml(v) {
    // body 可以是字串或字串陣列；陣列渲染成 <ul>
    if (v == null) return "";
    if (typeof v === "string") return '<p>' + v + '</p>';
    return '<ul>' + v.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
  }

  /* ---------- 區塊標題 ---------- */
  function heading(frag, b) {
    if (b.title) frag.appendChild(el("div", "sec-title", '<span class="bar"></span>' + b.title));
    if (b.hint) frag.appendChild(el("div", "hint", b.hint));
  }

  /* ---------- 各區塊 ---------- */
  var BLOCKS = {};

  BLOCKS.flips = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (d, i) {
      var c = colorAt(d.c, i);
      var card = el("div", "flip");
      if (b.h) card.style.height = b.h + "px";
      card.innerHTML =
        '<div class="flip-in">' +
        '<div class="face front"><div class="cbar" style="background:' + c + '"></div>' +
        '<div class="t">' + d.t + '</div><div class="en">' + (d.en || "") + '</div>' +
        '<div class="tap">▸ ' + U("點我看解釋", "Chạm để xem") + '</div></div>' +
        '<div class="face back"><div class="cbar" style="background:' + c + '"></div>' +
        '<p>' + d.b + '</p></div></div>';
      var mod = CTX.mod, bi = CTX.bi;
      card.onclick = function () {
        if (card.classList.toggle("on")) TRACK.send("flip_open", mod, "flips", { b: bi, i: i, t: d.t });
      };
      g.appendChild(card);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.exp = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div");
    b.items.forEach(function (t, i) {
      var box = el("div", "exp");
      var res = t.res ? '<div style="margin-top:10px;font-size:13px;color:var(--secondary);font-weight:700">🔗 ' + t.res + '</div>' : "";
      box.innerHTML =
        '<button><span class="num">' + (i + 1) + '</span><span>' + t.h + '</span>' +
        '<span class="tag">' + (t.tag || "") + '</span><span class="chev">›</span></button>' +
        '<div class="body">' + listHtml(t.body) + res + '</div>';
      var body = box.querySelector(".body");
      var mod = CTX.mod, bi = CTX.bi;
      box.querySelector("button").onclick = function () {
        var on = box.classList.toggle("on");
        if (!on) { body.style.maxHeight = "0px"; return; }
        TRACK.send("exp_open", mod, "exp", { b: bi, i: i, h: t.h });
        // 用實際內容高度展開，避免長段落被固定 max-height 截掉。
        // 必須先解除 max-height 再量：在 max-height:0 的狀態下量 scrollHeight 會得到 0，
        // 面板就只會開一條縫（實測過）。量完歸零並強制重排，transition 才有起點。
        body.style.maxHeight = "none";
        var h = body.scrollHeight;
        body.style.maxHeight = "0px";
        void body.offsetHeight;
        body.style.maxHeight = h + "px";
      };
      host.appendChild(box);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.cards = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var box = el("div", "card");
      box.style.borderTop = "4px solid " + accent;
      box.innerHTML = '<div class="h">' + c.h + '</div>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        (c.li ? '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>' : "") +
        (c.p ? '<p style="margin-top:8px;font-size:15.5px;color:var(--mid)">' + c.p + '</p>' : "");
      g.appendChild(box);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.timeline = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "tl");
    b.steps.forEach(function (s, i) {
      var st = el("div", "step");
      st.innerHTML = '<div class="dot" style="background:' + colorAt(s.c, i) + '">' + (i + 1) + '</div>' +
        '<h4>' + s.h + '</h4><p>' + s.p + '</p>';
      host.appendChild(st);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.compare = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "cmp");
    [b.left, b.right].forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var col = el("div", "col");
      col.innerHTML = '<div class="cbar" style="background:' + accent + '"></div>' +
        '<h4 style="color:' + accent + '">' + c.h + '</h4>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
      wrap.appendChild(col);
    });
    f.appendChild(wrap);
    if (b.note) f.appendChild(el("div", "cmp-note", b.note));
    return f;
  };

  BLOCKS.table = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "tblwrap");
    var html = '<table class="tbl"><thead><tr>' +
      b.head.map(function (h) { return '<th>' + h + '</th>'; }).join("") + '</tr></thead><tbody>' +
      b.rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join("") + '</tr>';
      }).join("") + '</tbody></table>';
    wrap.innerHTML = html;
    f.appendChild(wrap); return f;
  };

  BLOCKS.note = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    f.appendChild(el("div", "note" + (b.kind ? " " + b.kind : ""), b.text));
    return f;
  };

  BLOCKS.match = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "match-wrap");
    var pool = el("div", "pool"), targets = el("div", "targets");
    var pairs = b.pairs;
    var order = pairs.slice().sort(function () { return Math.random() - 0.5; });
    var selected = null, solved = 0, errors = 0, t0 = null;
    var mod = CTX.mod, bi = CTX.bi;
    var msg = el("div");
    msg.style.cssText = "margin-top:14px;font-weight:700;color:var(--green)";

    function tryMatch(slot, key) {
      if (slot.classList.contains("ok")) return;
      if (t0 === null) t0 = Date.now();
      if (slot.dataset.k === key) {
        slot.classList.add("ok"); slot.classList.remove("bad");
        slot.querySelector(".drop").textContent = key;
        var chip = pool.querySelector('.chip[data-k="' + key + '"]');
        chip.classList.add("used"); chip.classList.remove("sel");
        selected = null; solved++;
        TRACK.send("match_ok", mod, "match", { b: bi, label: key });
        if (solved === pairs.length) {
          msg.textContent = b.done || U("✓ 全部答對！", "Đúng hết!");
          TRACK.send("match_done", mod, "match", { b: bi, n: pairs.length, errors: errors, ms: Date.now() - t0 });
        }
      } else {
        errors++;
        TRACK.send("match_bad", mod, "match", { b: bi, label: key, slot: slot.dataset.k });
        slot.classList.add("bad");
        setTimeout(function () { slot.classList.remove("bad"); }, 350);
      }
    }
    order.forEach(function (q) {
      var c = el("div", "chip"); c.textContent = q.label; c.draggable = true; c.dataset.k = q.label;
      c.addEventListener("dragstart", function (e) { e.dataTransfer.setData("k", q.label); });
      c.onclick = function () {
        if (c.classList.contains("used")) return;
        if (selected === c) { c.classList.remove("sel"); selected = null; return; }
        pool.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("sel"); });
        c.classList.add("sel"); selected = c;
      };
      pool.appendChild(c);
    });
    pairs.forEach(function (q) {
      var s = el("div", "slot"); s.dataset.k = q.label;
      s.innerHTML = '<div class="drop">' + U("拖到這裡", "Kéo vào đây") + '</div><div class="desc">' + q.desc + '</div>';
      s.addEventListener("dragover", function (e) { e.preventDefault(); });
      s.addEventListener("drop", function (e) { e.preventDefault(); tryMatch(s, e.dataTransfer.getData("k")); });
      s.onclick = function () { if (selected) tryMatch(s, selected.dataset.k); };
      targets.appendChild(s);
    });
    host.appendChild(pool); host.appendChild(targets); host.appendChild(msg);
    f.appendChild(host); return f;
  };

  /* 結果代碼：把作答結果編成一串可貼給老師的代碼（FSQ1.<base64>.<檢查碼>）。
     解碼與彙整用專案根目錄的「食品科學概論_測驗成績解碼器.html」。 */
  function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
  function checksum(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1679616; // 36^4
    return h.toString(36);
  }

  BLOCKS.quiz = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var items = b.items, n = items.length;
    var head = el("div", "quiz-head");
    head.innerHTML =
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
      '<input class="qid" placeholder="' + U("學號（交成績必填）", "Mã số SV") + '" style="flex:1;min-width:130px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px">' +
      '<input class="qname" placeholder="' + U("姓名", "Họ tên") + '" style="flex:1;min-width:100px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px"></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
      '<strong class="qprog">' + U("進度", "Tiến độ") + ' 0 / ' + n + '</strong>' +
      '<span class="qscore" style="color:var(--secondary);font-weight:800">' + U("得分", "Điểm") + ' 0</span></div>' +
      '<div class="pbar"><div class="pfill"></div></div>';
    var box = el("div");
    var sb = el("div", "scorebox");
    sb.innerHTML = '<div>' + U("你的成績", "Điểm của bạn") + '</div><div class="big"><span class="fscore">0</span> / ' + n + '</div>' +
      '<div class="smsg" style="margin:8px 0 16px"></div>' +
      '<div class="rcwrap" style="margin:0 auto 16px;max-width:560px;text-align:left">' +
      '<div style="font-weight:700;margin-bottom:6px">' + U("結果代碼（請複製後，貼到老師指定的表單或訊息）", "— Mã kết quả: sao chép và gửi cho thầy/cô") + '</div>' +
      '<textarea class="rcode" readonly rows="3" style="width:100%;box-sizing:border-box;font-family:monospace;font-size:12px;padding:8px;border:1.5px solid var(--line,#ccc);border-radius:8px;resize:none"></textarea>' +
      '<div class="rmsg" style="font-size:13px;color:#B34700;margin-top:4px"></div>' +
      '<button class="btn copyrc" style="margin-top:8px">📋 ' + U("複製結果代碼", "Sao chép mã") + '</button></div>' +
      '<button class="btn ghost">' + U("重新測驗", "Làm lại") + '</button>';

    var answered = 0, score = 0, picks = [], qt0 = null, attempt = 0;
    var mod = CTX.mod, bi = CTX.bi;
    // 測驗的學號欄與頁首的學號代碼同步（兩邊填任一邊都行）
    var qidInput = head.querySelector(".qid");
    if (TRACK.on) {
      if (TRACK.code()) qidInput.value = TRACK.code();
      qidInput.addEventListener("change", function () {
        TRACK.setCode(qidInput.value);
        var top = $("#ifs-code"); if (top) top.value = TRACK.code();
      });
    }
    function updateProg() {
      head.querySelector(".qprog").textContent = U("進度", "Tiến độ") + " " + answered + " / " + n;
      head.querySelector(".qscore").textContent = U("得分", "Điểm") + " " + score;
      head.querySelector(".pfill").style.width = (answered / n * 100) + "%";
    }
    function finish() {
      sb.querySelector(".fscore").textContent = score;
      var pct = score / n, m;
      if (score === n) m = U("本次全對！請再用自己的話說明優格的保存條件與證據限制。", "Đúng hết lần này! Hãy giải thích tình huống bằng lời của mình.");
      else if (pct >= 0.8) m = U("很棒！觀念相當扎實。", "Rất tốt!");
      else if (pct >= 0.6) m = U("不錯，再複習幾個弱點就更好。", "Khá tốt, ôn lại vài chỗ nữa nhé.");
      else m = U("建議回到前面單元再看一次翻卡與展開內容。", "Hãy xem lại các phần phía trước.");
      sb.querySelector(".smsg").textContent = m;

      var sid = head.querySelector(".qid").value.trim();
      var sname = head.querySelector(".qname").value.trim();
      var korr = items.map(function (item, i) { return picks[i] === item.a ? 1 : 0; }).join("");
      var payload = JSON.stringify({
        w: D.week || 0, c: A2 ? "a2" : undefined, id: sid, nm: sname, s: score, n: n,
        a: picks, k: korr, t: new Date().toISOString().slice(0, 16),
      });
      var body = b64utf8(payload);
      var code = "FSQ1." + body + "." + checksum(body);
      sb.querySelector(".rcode").value = code;
      sb.querySelector(".rmsg").textContent = sid ? "" : U("⚠ 尚未填學號 —— 請回到測驗上方填入學號後重新測驗，否則老師無法登記成績。", "Chưa nhập mã số SV: hãy nhập ở trên rồi làm lại.");
      TRACK.send("quiz_done", mod, "quiz", { b: bi, attempt: attempt, score: score, n: n, picks: picks, ms: qt0 ? Date.now() - qt0 : null });
      TRACK.flush();

      sb.classList.add("show");
      sb.scrollIntoView({ behavior: "smooth" });
    }
    function pick(qel, item, oi) {
      if (qel.dataset.done === "1") return;
      qel.dataset.done = "1"; answered++;
      if (qt0 === null) qt0 = Date.now();
      picks[parseInt(qel.dataset.qi, 10)] = oi;
      TRACK.send("quiz_answer", mod, "quiz", { b: bi, attempt: attempt, qi: parseInt(qel.dataset.qi, 10), pick: oi, ok: oi === item.a });
      qel.querySelectorAll(".opt").forEach(function (btn, i) {
        btn.classList.add("dim");
        if (i === item.a) btn.classList.add("correct");
        if (i === oi && oi !== item.a) btn.classList.add("wrong");
      });
      var fb = qel.querySelector(".fb");
      if (oi === item.a) { score++; fb.classList.add("good"); fb.innerHTML = U("✓ 正確！", "Đúng!") + item.e; }
      else { fb.classList.add("no"); fb.innerHTML = U("✗ 正解：", "Sai. Đáp án:") + item.o[item.a] + "。" + item.e; }
      fb.classList.add("show"); updateProg();
      if (answered === n) finish();
    }
    function build() {
      box.innerHTML = ""; answered = 0; score = 0; picks = []; qt0 = null; attempt++; updateProg();
      sb.classList.remove("show");
      items.forEach(function (item, qi) {
        var qel = el("div", "q"); qel.dataset.done = "0"; qel.dataset.qi = qi;
        qel.innerHTML = '<div class="qn">第 ' + (qi + 1) + ' 題' + (A2 ? ' · Câu ' + (qi + 1) : '') + '</div><div class="qt">' + item.q + '</div>';
        item.o.forEach(function (opt, oi) {
          var btn = el("button", "opt"); btn.textContent = opt;
          btn.onclick = function () { pick(qel, item, oi); };
          qel.appendChild(btn);
        });
        qel.appendChild(el("div", "fb"));
        box.appendChild(qel);
      });
    }
    sb.querySelector(".copyrc").onclick = function () {
      var ta = sb.querySelector(".rcode");
      ta.select(); ta.setSelectionRange(0, 99999);
      var btn = this;
      function ok() { btn.textContent = U("✓ 已複製，請貼給老師", "Đã sao chép"); setTimeout(function () { btn.textContent = "📋 " + U("複製結果代碼", "Sao chép mã"); }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(ta.value).then(ok, function () { document.execCommand("copy"); ok(); });
      else { document.execCommand("copy"); ok(); }
    };
    sb.querySelector(".ghost").onclick = function () {
      build(); window.scrollTo({ top: 0, behavior: "smooth" });
    };
    build();
    f.appendChild(head); f.appendChild(box); f.appendChild(sb);
    return f;
  };

  /* ---------- 組裝 ---------- */
  var nav = $("#nav"), main = $("#main");
  var curMod = D.modules.length ? D.modules[0].id : null, modT0 = Date.now();
  function switchMod(id, btn) {
    document.querySelectorAll(".module").forEach(function (m) { m.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
    nav.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
    btn.classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (id !== curMod) {
      TRACK.send("module_view", id, null, { from: curMod, ms: Date.now() - modT0 });
      curMod = id; modT0 = Date.now();
    }
  }
  D.modules.forEach(function (m, i) {
    var btn = el("button", i === 0 ? "active" : "", m.nav);
    btn.onclick = function () { switchMod(m.id, btn); };
    nav.appendChild(btn);

    var sec = el("section", "module" + (i === 0 ? " active" : ""));
    sec.id = m.id;
    sec.appendChild(el("div", "lead",
      '<div class="kicker">' + m.kicker + '</div><h2>' + m.h2 + '</h2><p>' + m.lead + '</p>'));
    m.blocks.forEach(function (b, bi) {
      var render = BLOCKS[b.type];
      if (!render) { console.error("未知區塊型別:", b.type); return; }
      CTX.mod = m.id; CTX.bi = bi;
      sec.appendChild(render(b));
    });
    main.appendChild(sec);
  });

  /* ---------- 學號代碼列（只在啟用記錄的週出現） ---------- */
  if (TRACK.on) {
    var bar = el("div", "codebar");
    bar.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;font-size:14px";
    bar.innerHTML = '<label for="ifs-code" style="font-weight:700">學號代碼</label>' +
      '<input id="ifs-code" maxlength="20" placeholder="例：S001" style="width:120px;padding:6px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:14px">' +
      '<span style="opacity:.75">只記錄你的學習歷程（翻卡、配對、測驗），不需要姓名。</span>';
    nav.parentNode.insertBefore(bar, nav);
    var inp = bar.querySelector("#ifs-code");
    inp.value = TRACK.code();
    inp.addEventListener("change", function () {
      TRACK.setCode(inp.value);
      document.querySelectorAll(".qid").forEach(function (x) { x.value = TRACK.code(); });
      TRACK.send("code_set", null, null, {});
    });
    TRACK.send("session_start", curMod, null, {
      device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || "") ? "mobile" : "desktop",
      w: window.innerWidth, build: D.build || null,
    });
    // 停留時間以「頁面可見」為準：切到背景就結算一段 module_leave，回來重新計時。
    // 手機瀏覽器殺分頁常不觸發 pagehide，所以以 visibilitychange→hidden 為主。
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        TRACK.send("module_leave", curMod, null, { ms: Date.now() - modT0 }); TRACK.flush();
      } else {
        modT0 = Date.now();
      }
    });
  }
})();
</script>
</body>
