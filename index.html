<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品科學概論 · 18 週</title>
<style>
  :root { --primary:#2D2A6E; --secondary:#5B4FB8; --accent:#00B8B8; --warm:#F5A623; --text:#1F1F2E; --mid:#5A5A75; --border:#E2E2EC; --card:#fff; --bg:#F4F5FA; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif; }
  header { background:var(--primary); color:#fff; padding:28px 16px 24px; }
  header .in, main { max-width:860px; margin:0 auto; }
  header a.back { color:#fff; opacity:.8; font-size:14px; text-decoration:none; }
  h1 { margin:6px 0 0; font-size:26px; }
  header p { margin:6px 0 0; opacity:.85; font-size:15px; line-height:1.5; }
  main { padding:20px 16px 48px; display:grid; grid-template-columns:minmax(0,1fr); gap:10px; }
  .wk { display:flex; gap:14px; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .no { flex:none; width:52px; height:52px; border-radius:10px; background:var(--secondary); color:#fff; display:grid; place-items:center; font-weight:700; }
  .intl .no { background:var(--accent); }
  .rev .no { background:var(--warm); }
  .tx { display:grid; gap:3px; min-width:0; flex:1; overflow-wrap:anywhere; }
  .tx b { font-size:17px; color:var(--primary); }
  .tx i { font-style:normal; font-size:13px; color:var(--secondary); }
  .tx small { font-size:13.5px; color:var(--mid); line-height:1.5; }
  .wk a.go { display:flex; gap:14px; align-items:center; flex:1; min-width:0; text-decoration:none; color:inherit; }
  .btns { flex:none; display:flex; flex-direction:column; gap:6px; }
  .sl { font-size:13.5px; font-weight:700; color:var(--secondary); border:1px solid var(--secondary); border-radius:8px; padding:6px 10px; text-decoration:none; white-space:nowrap; text-align:center; }
  .sl:hover { background:var(--secondary); color:#fff; }
  .choose { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
  .pick { display:block; background:var(--card); border:1px solid var(--border); border-top:6px solid var(--secondary); border-radius:14px; padding:22px; text-decoration:none; color:inherit; transition:transform .15s, border-color .15s; }
  .pick.intl { border-top-color:var(--accent); }
  .pick:hover { transform:translateY(-2px); border-color:var(--secondary); }
  .pick b { display:block; font-size:21px; color:var(--primary); }
  .pick i { display:block; font-style:normal; color:var(--secondary); margin-top:2px; }
  .pick p { color:var(--mid); font-size:15px; line-height:1.6; margin:10px 0 0; }
  .pick span.go { display:inline-block; margin-top:12px; font-weight:700; color:var(--secondary); }
  .soon { font-size:12.5px; color:var(--mid); }
  footer { text-align:center; color:var(--mid); font-size:13px; padding:0 16px 32px; }
  @media (max-width:520px) { .wk { flex-wrap:wrap; } .wk a.go { flex:1 1 100%; } .btns { flex-direction:row; width:100%; } .btns .sl { flex:1; } }
</style>
</head>
<body>
<header><div class="in">

</div></header>

<footer></footer>

</html>
