<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品科學概論 第15週 · 國合班互動練習</title>
<style>
  :root{
    --primary:#2D2A6E; --secondary:#5B4FB8; --accent:#00B8B8; --warm:#F5A623; --green:#2FA36B; --red:#D65B5B; --dark:#1A1A3E; --bg:#F4F5FA; --text:#1F1F2E; --mid:#5A5A75; --muted:#9096ac; --border:#E2E2EC; --card:#fff;
  }
/* 版型樣式 — 逐條取自「第1週_互動教學.html」，末段為新增區塊（cmp / tbl / note）。
   這裡只用 var(--x)；色票由 tokens.js 產生 :root 注入。 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:17px}
header{background:linear-gradient(120deg,var(--dark),var(--primary));color:#fff;
  padding:26px 22px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(0,0,0,.15)}
header h1{font-size:31px;font-weight:800;letter-spacing:.5px}
header .sub{color:#b9c7ff;font-size:16px;margin-top:5px}
nav{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.10);color:#dfe4ff;border:none;padding:12px 18px;
  border-radius:10px 10px 0 0;font-size:16.5px;cursor:pointer;font-weight:600;transition:.15s}
nav button:hover{background:rgba(255,255,255,.2)}
nav button.active{background:var(--bg);color:var(--primary)}
main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
.module{display:none;animation:fade .35s}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead{background:var(--dark);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:22px}
.lead .kicker{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px}
.lead h2{font-size:26px;margin:6px 0 8px}
.lead p{color:#cdd3ee;font-size:16.5px}
.sec-title{font-size:23px;font-weight:800;color:var(--primary);margin:30px 0 6px;
  display:flex;align-items:center;gap:10px}
.sec-title .bar{width:6px;height:25px;background:var(--accent);border-radius:3px;display:inline-block}
.hint{color:var(--mid);font-size:15px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* flip cards */
.flip{perspective:1100px;height:200px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px rgba(30,30,60,.08);border:1px solid var(--border)}
.front{background:var(--card)}
.front .t{font-size:21px;font-weight:800;color:var(--primary)}
.front .en{color:var(--muted);font-size:14px;margin-top:3px;font-style:italic}
.front .tap{margin-top:auto;color:var(--accent);font-size:14px;font-weight:700}
.back{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;transform:rotateY(180deg);overflow:auto}
.back p{font-size:16px}
.cbar{height:6px;border-radius:14px 14px 0 0;position:absolute;top:0;left:0;right:0}

/* expandable */
.exp{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.exp>button{width:100%;text-align:left;background:none;border:none;padding:16px 18px;cursor:pointer;
  display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;color:var(--text)}
.exp .num{background:var(--primary);color:#fff;min-width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.exp .chev{margin-left:auto;color:var(--muted);transition:.25s;font-size:20px}
.exp.on .chev{transform:rotate(90deg);color:var(--accent)}
.exp .body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 18px}
.exp.on .body{padding:0 18px 16px 62px}
.exp .body ul{margin-left:16px;color:var(--mid);font-size:16px}
.exp .body p{color:var(--mid);font-size:15.5px}
.exp .tag{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:8px}

/* info card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.card .h{font-weight:800;color:var(--primary);font-size:18px;margin-bottom:6px}
.card .en{color:var(--muted);font-size:13px;font-style:italic}
.card ul{margin:8px 0 0 18px;font-size:15.5px;color:var(--mid)}

/* timeline */
.tl{display:flex;gap:0;flex-wrap:wrap;counter-reset:s}
.tl .step{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 14px 14px;margin:8px;position:relative}
.tl .dot{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;margin-bottom:8px}
.tl .step h4{color:var(--primary);font-size:17.5px;margin-bottom:4px}
.tl .step p{font-size:15px;color:var(--mid)}

/* matching */
.match-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.pool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--secondary);color:#fff;padding:10px 17px;border-radius:22px;font-weight:700;
  cursor:grab;user-select:none;font-size:16.5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chip.used{opacity:.35;pointer-events:none}
.chip.sel{outline:3px solid var(--warm);outline-offset:2px}
.targets{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;border:2px dashed var(--border);border-radius:12px;padding:10px 14px;background:#fafbff}
.slot .desc{flex:1;font-size:16px;color:var(--text)}
.slot .drop{min-width:130px;min-height:44px;border-radius:8px;background:#eef0f8;display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:15px;padding:8px 12px}
.slot.ok{border-color:var(--green);background:#effaf3}
.slot.ok .drop{background:var(--green);color:#fff;font-weight:700}
.slot.bad{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* quiz */
.quiz-head{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.pbar{height:12px;background:#e7e9f4;border-radius:8px;overflow:hidden;margin-top:10px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--secondary));transition:width .4s}
.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.q .qn{color:var(--accent);font-weight:800;font-size:14px}
.q .qt{font-size:19.5px;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fafbff;border:2px solid var(--border);
  border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;font-size:16.5px;transition:.15s}
.opt:hover{border-color:var(--secondary)}
.opt.correct{border-color:var(--green);background:#effaf3;font-weight:700}
.opt.wrong{border-color:var(--red);background:#fdeeee}
.opt.dim{opacity:.6}
.fb{margin-top:8px;font-size:15.5px;padding:11px 14px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.good{background:#effaf3;color:#1c7a4d} .fb.no{background:#fdeeee;color:#a83b3b}
.scorebox{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:16px;
  padding:26px;text-align:center;margin-top:10px;display:none}
.scorebox.show{display:block}
.scorebox .big{font-size:46px;font-weight:800}
.btn{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:10px;
  font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.18)}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;background:#eef0fb;color:var(--secondary);padding:3px 10px;border-radius:20px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px}

/* ===== 新增區塊 ===== */
/* compare：兩欄對照（梅納 vs 焦糖化、冷藏 vs 冷凍…） */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media(max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 18px 18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06);position:relative;overflow:hidden}
.cmp .col .cbar{position:static;height:6px;margin:0 -18px 14px;border-radius:0}
.cmp .col h4{font-size:20px;font-weight:800;margin-bottom:2px}
.cmp .col .en{color:var(--muted);font-size:13px;font-style:italic;margin-bottom:8px}
.cmp .col ul{margin-left:18px;font-size:15.5px;color:var(--mid)}
.cmp .col li{margin-bottom:5px}
.cmp-note{margin-top:12px;background:#eef0fb;border-left:5px solid var(--secondary);
  border-radius:0 10px 10px 0;padding:12px 16px;font-size:16px;color:var(--primary);font-weight:600}

/* table：資料表（維生素、添加物分類…） */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px}
.tbl th{background:var(--primary);color:#fff;text-align:left;padding:12px 14px;font-weight:700;font-size:15px}
.tbl td{padding:11px 14px;border-top:1px solid var(--border);color:var(--mid);vertical-align:top}
.tbl tr:nth-child(even) td{background:#fafbff}
.tbl td:first-child{color:var(--text);font-weight:700}

/* note：重點提示條 */
.note{background:#fff8e9;border-left:5px solid var(--warm);border-radius:0 12px 12px 0;
  padding:14px 18px;margin:14px 0;font-size:16px;color:var(--text)}
.note b{color:var(--primary)}
.note.key{background:#effaf3;border-left-color:var(--green)}
.note.warn{background:#fdeeee;border-left-color:var(--red)}
/* 國合班 A2 互動練習：拼音與越南文（build_a2.js 產生的內容才會用到） */
.py{display:block;font-size:.78em;font-weight:500;color:var(--mid);margin-top:2px}
.vn{display:block;font-size:.88em;font-weight:500;color:var(--secondary);margin-top:2px}
/* Shared classroom tasks: oral response, sentence support, then sample explanation. */
.class-activity{display:grid;gap:12px;min-width:0}
.class-activity .vn{display:block;color:#0E7C7B;font-size:15px;line-height:1.5;margin-top:4px}
.activity-time{color:#0E7C7B;font-weight:700;font-size:15px}
.activity-prompt{font-size:clamp(18px,2.3vw,23px);line-height:1.5}
.sentence-stem{padding:12px 16px;background:#EFFAF3;border-left:5px solid #2FA36B;color:#1A1A3E;line-height:1.6}
.class-activity label{font-size:14px;color:#52526B}
.activity-response{display:block;width:100%;max-width:100%;min-height:72px;border:1.5px solid #A0A0B5;border-radius:8px;padding:10px 12px;resize:vertical;font:inherit;font-size:17px;background:#fff;color:#1F1F2E}
.activity-answer{border:1px solid #E2E2EC;background:#fff;border-radius:8px;padding:10px 14px;font-size:16px;line-height:1.5}
.activity-answer summary{cursor:pointer;font-weight:700;color:#2D2A6E}
.activity-answer p{margin-top:10px}
.activity-response:focus-visible,.activity-answer summary:focus-visible{outline:3px solid #0E7C7B;outline-offset:3px}
.source-note{font-size:13px;color:#52526B;line-height:1.5;overflow-wrap:anywhere;margin-top:10px}
.source-note .vn{display:block;color:#0E7C7B;font-size:13px}
.lesson-links{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.lesson-links a{color:inherit;text-underline-offset:3px}
.feedback-reason,.feedback-transfer{margin-top:6px}
.feedback-transfer{font-weight:600}
@media(max-width:640px){header{position:relative!important}.class-activity{gap:10px}}
@media print{.activity-response{min-height:64px}}


.back .vn{color:#D7FAF3}.tbl-wrap{overflow-x:auto}
</style>
</head>

<script>window.__LESSON__={"week":15,"series":["#2D2A6E","#2FA36B","#F5A623","#5B4FB8","#00B8B8","#D65B5B"],"modules":[{"id":"m0","nav":"今天 Hôm nay","kicker":"今天學什麼 · Hôm nay học gì","h2":"食品添加物","lead":"shípǐn tiānjiāwù　·　Phụ gia thực phẩm","blocks":[{"type":"cards","title":"今天學三件事\u003cspan class=\"vn\" lang=\"vi\">Hôm nay học ba điều\u003c/span>","cols":3,"items":[{"h":"添加物的功能\u003cspan class=\"vn\" lang=\"vi\">Chức năng phụ gia\u003c/span>","p":"分清抑菌、抗氧化與質地調整。\u003cspan class=\"vn\" lang=\"vi\">Tách hạn chế vi sinh vật, chống oxy hóa, kết cấu.\u003c/span>","c":"#2D2A6E"},{"h":"量與單位\u003cspan class=\"vn\" lang=\"vi\">Lượng và đơn vị\u003c/span>","p":"分清 ADI、食品限量與實際暴露。\u003cspan class=\"vn\" lang=\"vi\">Tách ADI, giới hạn thực phẩm, phơi nhiễm thực.\u003c/span>","c":"#2D2A6E"},{"h":"讀成分與警語\u003cspan class=\"vn\" lang=\"vi\">Đọc thành phần, cảnh báo\u003c/span>","p":"對照名稱、功能、警語與適用條件。\u003cspan class=\"vn\" lang=\"vi\">Đối chiếu tên, chức năng, cảnh báo, điều kiện.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"看影片：香腸的添加物　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Xem video: phụ gia trong xúc xích\u003c/span>","text":"\u003ca href=\"https://www.youtube.com/watch?v=6m2j5G0VafY&t=522s\" target=\"_blank\" rel=\"noopener\" style=\"font-weight:700\">▶ 亞硝酸鹽為什麼要加？\u003c/a>\u003cspan class=\"vn\">Vì sao phải thêm nitrit?\u003c/span>\u003cul style=\"margin:10px 0 0;padding-left:22px\">\u003cli>香腸裡面是什麼顏色？\u003cspan class=\"vn\">Bên trong xúc xích có màu gì?\u003c/span>\u003c/li>\u003cli>亞硝酸鹽擋住哪一種菌？\u003cspan class=\"vn\">Nitrit ngăn loại vi khuẩn nào?\u003c/span>\u003c/li>\u003c/ul>影片是特定香腸製程；亞硝酸鹽要連著配方、處理與保存評估，不把它當成單獨安全保證。\u003cspan class=\"vn\" lang=\"vi\">Video là quy trình xúc xích cụ thể; xét nitrit cùng công thức, xử lý, bảo quản, không là bảo đảm riêng.\u003c/span>"},{"type":"cards","title":"一包麵包：看功能，再看證據\u003cspan class=\"vn\" lang=\"vi\">Một gói bánh mì: xem chức năng rồi bằng chứng\u003c/span>","cols":3,"items":[{"h":"① 找成分\u003cspan class=\"vn\" lang=\"vi\">Tìm thành phần\u003c/span>","p":"教學例：丙酸鈣、脂肪酸甘油酯，各做什麼？\u003cspan class=\"vn\" lang=\"vi\">Ví dụ học: canxi propionat, mono-diglycerid làm gì?\u003c/span>","c":"#2D2A6E"},{"h":"② 分清量的基準\u003cspan class=\"vn\" lang=\"vi\">Tách cơ sở lượng\u003c/span>","p":"食品中的濃度、吃下的量、體重基準，不是同一數字。\u003cspan class=\"vn\" lang=\"vi\">Nồng độ trong thực phẩm, lượng ăn, cơ sở thể trọng khác nhau.\u003c/span>","c":"#2D2A6E"},{"h":"③ 看整個產品\u003cspan class=\"vn\" lang=\"vi\">Xem cả sản phẩm\u003c/span>","p":"還要看配方、製程、包裝、保存與標示。\u003cspan class=\"vn\" lang=\"vi\">Còn công thức, quy trình, bao bì, bảo quản, nhãn.\u003c/span>","c":"#2D2A6E"}]}]},{"id":"m1","nav":"生詞 Từ mới","kicker":"生詞 · Từ mới","h2":"本週生詞","lead":"10 個生詞　·　10 từ mới","blocks":[{"type":"flips","cols":3,"items":[{"t":"防腐劑","en":"fángfǔjì","b":"chất bảo quản"},{"t":"抗氧化劑","en":"kàngyǎnghuàjì","b":"chất chống oxy hóa"},{"t":"乳化劑","en":"rǔhuàjì","b":"chất nhũ hóa"},{"t":"著色劑","en":"zhuósèjì","b":"chất tạo màu"},{"t":"甜味劑","en":"tiánwèijì","b":"chất tạo ngọt"}],"title":"翻卡：生詞　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Lật thẻ: từ mới\u003c/span>"},{"type":"flips","cols":3,"items":[{"t":"黏稠劑","en":"niánchóujì","b":"chất làm dày (làm đặc)"},{"t":"保色劑","en":"bǎosèjì","b":"chất giữ màu"},{"t":"亞硝酸鹽","en":"yàxiāosuānyán","b":"nitrit"},{"t":"安全係數","en":"ānquán xìshù","b":"hệ số an toàn"},{"t":"成分表","en":"chéngfènbiǎo","b":"bảng thành phần"}]},{"type":"match","title":"配對：中文 ↔ 越南文　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Ghép: tiếng Trung ↔ tiếng Việt\u003c/span>","pairs":[{"label":"防腐劑","desc":"chất bảo quản"},{"label":"抗氧化劑","desc":"chất chống oxy hóa"},{"label":"乳化劑","desc":"chất nhũ hóa"},{"label":"著色劑","desc":"chất tạo màu"},{"label":"甜味劑","desc":"chất tạo ngọt"},{"label":"黏稠劑","desc":"chất làm dày (làm đặc)"},{"label":"保色劑","desc":"chất giữ màu"},{"label":"亞硝酸鹽","desc":"nitrit"},{"label":"安全係數","desc":"hệ số an toàn"},{"label":"成分表","desc":"bảng thành phần"}],"done":"✓ 全部答對！Đúng hết!"}]},{"id":"s1","nav":"一 添加物有哪些？在…","kicker":"第一段 · Phần 1","h2":"添加物：用途、範圍與功能","lead":"Phụ gia: mục đích, phạm vi, chức năng","blocks":[{"type":"cards","title":"添加物：用途、品項與範圍\u003cspan class=\"vn\" lang=\"vi\">Phụ gia: mục đích, chất và phạm vi\u003c/span>","cols":3,"items":[{"h":"為了技術目的\u003cspan class=\"vn\" lang=\"vi\">Vì mục đích công nghệ\u003c/span>","p":"可用於防腐、抗氧化、乳化、調味、營養強化等。\u003cspan class=\"vn\" lang=\"vi\">Có thể bảo quản, chống oxy hóa, nhũ hóa, tạo vị, tăng cường dinh dưỡng.\u003c/span>","c":"#2D2A6E"},{"h":"台灣用途分類\u003cspan class=\"vn\" lang=\"vi\">Phân nhóm ở Đài Loan\u003c/span>","p":"第一至第十七類，另有第十一之一類甜味劑，共 18 類。\u003cspan class=\"vn\" lang=\"vi\">Nhóm 1–17 cùng nhóm 11-1 chất tạo ngọt, tổng 18 nhóm.\u003c/span>","c":"#2D2A6E"},{"h":"依規定使用\u003cspan class=\"vn\" lang=\"vi\">Dùng theo quy định\u003c/span>","p":"查品項、食品範圍、限量與規格，不能用來掩飾劣質原料。\u003cspan class=\"vn\" lang=\"vi\">Tra chất, loại thực phẩm, giới hạn, quy cách; không che nguyên liệu kém.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"分類序號不是連續的總數；查法規還要看生效日期。本課法規查核日：2026-10-17。\u003cspan class=\"vn\" lang=\"vi\">Số thứ tự không bằng tổng liên tục; tra luật còn xem ngày hiệu lực. Ngày kiểm tra: 17-10-2026.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0040084\" target=\"_blank\" rel=\"noopener\">台灣添加物分類與規範 / Nhóm, quy định Đài Loan ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"四類功能：機制不同\u003cspan class=\"vn\" lang=\"vi\">Bốn chức năng: cơ chế khác nhau\u003c/span>","cols":4,"items":[{"h":"防腐劑\u003cspan class=\"vn\" lang=\"vi\">Chất bảo quản\u003c/span>","p":"抑制微生物生長；例如部分丙酸鹽可用於烘焙品防黴。\u003cspan class=\"vn\" lang=\"vi\">Hạn chế vi sinh vật; ví dụ vài propionat dùng chống mốc trong đồ nướng.\u003c/span>","c":"#2D2A6E"},{"h":"抗氧化劑\u003cspan class=\"vn\" lang=\"vi\">Chất chống oxy hóa\u003c/span>","p":"延緩氧化；不等於可靠的微生物殺菌步驟。\u003cspan class=\"vn\" lang=\"vi\">Làm chậm oxy hóa; không bằng bước diệt vi sinh vật tin cậy.\u003c/span>","c":"#2D2A6E"},{"h":"保色劑\u003cspan class=\"vn\" lang=\"vi\">Chất giữ màu\u003c/span>","p":"亞硝酸鹽在合適醃製系統可助發色及控制部分危害。\u003cspan class=\"vn\" lang=\"vi\">Nitrit trong hệ ướp phù hợp giúp màu, kiểm soát vài nguy hại.\u003c/span>","c":"#2D2A6E"},{"h":"乳化劑\u003cspan class=\"vn\" lang=\"vi\">Chất nhũ hóa\u003c/span>","p":"幫助油水分散及穩定；對組織與老化的作用依品項。\u003cspan class=\"vn\" lang=\"vi\">Giúp phân tán, ổn định dầu nước; tác dụng kết cấu, thoái hóa tùy loại.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"同一物質可有不同功能；食品名稱與添加物名稱不直接證明實際用量或合規。\u003cspan class=\"vn\" lang=\"vi\">Một chất có thể nhiều chức năng; tên thực phẩm, phụ gia không tự chứng minh lượng hay tuân thủ.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0040084\" target=\"_blank\" rel=\"noopener\">品項與使用範圍 / Chất và phạm vi sử dụng ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 1｜替麵包找功能\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 1: Tìm chức năng cho bánh\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"function\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">教學麵包列有「防腐劑（丙酸鈣）」與「脂肪酸甘油酯」。哪一個主要用於抑黴？能由名稱算出各有幾 mg 嗎？\u003cspan class=\"vn\" lang=\"vi\">Nhãn mẫu ghi chất bảo quản (canxi propionat), mono-diglycerid. Chất nào chủ yếu chống mốc? Có tính mỗi chất mấy mg chỉ từ tên?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>＿＿主要用於＿＿；精確用量還要＿＿。\u003cspan class=\"vn\" lang=\"vi\">___ chủ yếu để ___; lượng chính xác còn cần ___.\u003c/span>\u003c/div>\u003clabel for=\"a2-w15-function\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w15-function\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>丙酸鈣可用於抑黴；另一項可作乳化與組織調整等。精確量需濃度或配方資料。\u003cspan class=\"vn\" lang=\"vi\">Canxi propionat có thể chống mốc; chất kia giúp nhũ hóa, kết cấu; cần nồng độ, công thức để biết lượng.\u003c/span>\u003c/p>\u003cp>功能說明不能取代使用範圍、限量與實際檢驗；成分表不是完整定量配方。\u003cspan class=\"vn\" lang=\"vi\">Chức năng không thay phạm vi, giới hạn, kiểm nghiệm; nhãn không là công thức định lượng đầy đủ.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"甜、稠、膨鬆與防褐變\u003cspan class=\"vn\" lang=\"vi\">Ngọt, đặc, xốp và chống nâu\u003c/span>","cols":4,"items":[{"h":"甜味劑\u003cspan class=\"vn\" lang=\"vi\">Chất tạo ngọt\u003c/span>","p":"如阿斯巴甜、蔗糖素；要查品項與適用食品。\u003cspan class=\"vn\" lang=\"vi\">Như aspartam, sucralose; xem chất và thực phẩm cho phép.\u003c/span>","c":"#2D2A6E"},{"h":"粘稠劑（糊料）\u003cspan class=\"vn\" lang=\"vi\">Chất làm đặc\u003c/span>","p":"如關華豆膠、鹿角菜膠等；作用依濃度與食品系統。\u003cspan class=\"vn\" lang=\"vi\">Như guar, carrageenan; tác dụng tùy nồng độ và thực phẩm.\u003c/span>","c":"#2D2A6E"},{"h":"膨脹劑\u003cspan class=\"vn\" lang=\"vi\">Chất tạo xốp\u003c/span>","p":"小蘇打、泡打粉等可產氣；不同於酵母的微生物發酵。\u003cspan class=\"vn\" lang=\"vi\">Baking soda, bột nở tạo khí; khác lên men vi sinh của nấm men.\u003c/span>","c":"#2D2A6E"},{"h":"亞硫酸鹽類\u003cspan class=\"vn\" lang=\"vi\">Sulfit\u003c/span>","p":"可防褐變等；使用範圍、殘留與過敏原標示須分開查。\u003cspan class=\"vn\" lang=\"vi\">Có thể chống nâu; tra riêng phạm vi, dư lượng và nhãn dị ứng.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"功能是理解起點，不是所有食品都能任意加入。\u003cspan class=\"vn\" lang=\"vi\">Chức năng là điểm bắt đầu, không nghĩa được tùy ý thêm vào mọi thực phẩm.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/TC/siteContent.aspx?sid=10160\" target=\"_blank\" rel=\"noopener\">常見添加物功能 / Chức năng thường gặp: TFDA ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"弱有機酸防腐劑：看 pH 與產品\u003cspan class=\"vn\" lang=\"vi\">Chất bảo quản axit yếu: xem pH, sản phẩm\u003c/span>","cols":3,"items":[{"h":"未解離比例\u003cspan class=\"vn\" lang=\"vi\">Tỷ lệ chưa phân ly\u003c/span>","p":"較低 pH 常提高未解離比例，有利進入細胞等抑菌作用。\u003cspan class=\"vn\" lang=\"vi\">pH thấp hơn thường tăng phần chưa phân ly, giúp vào tế bào và ức chế.\u003c/span>","c":"#2D2A6E"},{"h":"不是只靠 pH\u003cspan class=\"vn\" lang=\"vi\">Không chỉ pH\u003c/span>","p":"菌種、食品組成、濃度、溫度與時間都會影響。\u003cspan class=\"vn\" lang=\"vi\">Loài, thành phần, nồng độ, nhiệt, thời gian đều ảnh hưởng.\u003c/span>","c":"#2D2A6E"},{"h":"與其他控制配合\u003cspan class=\"vn\" lang=\"vi\">Phối hợp kiểm soát khác\u003c/span>","p":"可配合酸度、aw、衛生、包裝與適當保存；效果需驗證。\u003cspan class=\"vn\" lang=\"vi\">Có thể phối hợp pH, aw, vệ sinh, bao bì, bảo quản; cần kiểm chứng.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"此處是弱有機酸的作用示意，不是所有防腐劑都共用同一機制或 pH 門檻。\u003cspan class=\"vn\" lang=\"vi\">Đây là cơ chế axit hữu cơ yếu, không mọi chất bảo quản có cùng cơ chế hay ngưỡng pH.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.1111/j.1365-2672.1983.tb02632.x\" target=\"_blank\" rel=\"noopener\">己二烯酸解離與抑菌研究 / Phân ly và ức chế: Eklund 1983 ↗\u003c/a>\u003c/p>"}]},{"id":"s2","nav":"二 ADI：吃多少才…","kicker":"第二段 · Phần 2","h2":"ADI 與暴露量：先看單位","lead":"ADI, phơi nhiễm: xem đơn vị trước","blocks":[{"type":"cards","title":"ADI：長期每日攝取的評估基準\u003cspan class=\"vn\" lang=\"vi\">ADI: cơ sở đánh giá lượng ăn hằng ngày lâu dài\u003c/span>","cols":3,"items":[{"h":"ADI 的意思\u003cspan class=\"vn\" lang=\"vi\">Ý nghĩa ADI\u003c/span>","p":"依現有資料，終生每日攝取而無可察覺健康風險的估計量。\u003cspan class=\"vn\" lang=\"vi\">Ước tính lượng ăn hằng ngày suốt đời không có nguy cơ đáng kể theo dữ liệu hiện có.\u003c/span>","c":"#2D2A6E"},{"h":"單位看體重\u003cspan class=\"vn\" lang=\"vi\">Đơn vị theo thể trọng\u003c/span>","p":"常用 mg／kg 體重／天；不是每公斤食品的濃度。\u003cspan class=\"vn\" lang=\"vi\">Thường mg/kg thể trọng/ngày; khác nồng độ trên kg thực phẩm.\u003c/span>","c":"#2D2A6E"},{"h":"不是建議吃到的量\u003cspan class=\"vn\" lang=\"vi\">Không là lượng nên ăn cho đủ\u003c/span>","p":"也不是每一餐的中毒分界；特殊敏感族群與警語另看。\u003cspan class=\"vn\" lang=\"vi\">Không là ranh giới ngộ độc từng bữa; nhóm nhạy cảm, cảnh báo xét riêng.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"ADI 用於風險評估；法定使用範圍與限量仍須另查，不能直接用 ADI 換成配方添加量。\u003cspan class=\"vn\" lang=\"vi\">ADI dùng đánh giá nguy cơ; vẫn tra phạm vi, giới hạn pháp luật, không đổi trực tiếp ADI thành lượng cho công thức.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.who.int/news-room/fact-sheets/detail/food-additives\" target=\"_blank\" rel=\"noopener\">ADI 定義與評估 / Định nghĩa, đánh giá: WHO ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"從資料到 ADI：簡化流程\u003cspan class=\"vn\" lang=\"vi\">Từ dữ liệu đến ADI: sơ đồ đơn giản\u003c/span>","cols":3,"items":[{"h":"整理證據\u003cspan class=\"vn\" lang=\"vi\">Tổng hợp bằng chứng\u003c/span>","p":"看毒理、代謝及人體等相關資料，選擇合適評估起點。\u003cspan class=\"vn\" lang=\"vi\">Xem độc học, chuyển hóa, dữ liệu người, chọn điểm xuất phát phù hợp.\u003c/span>","c":"#2D2A6E"},{"h":"NOAEL 例子\u003cspan class=\"vn\" lang=\"vi\">Ví dụ NOAEL\u003c/span>","p":"在指定試驗及觀察條件下，未觀察到不良作用的最高測試劑量。\u003cspan class=\"vn\" lang=\"vi\">Liều thử cao nhất không thấy tác dụng hại trong điều kiện thử, quan sát xác định.\u003c/span>","c":"#2D2A6E"},{"h":"套用適當係數\u003cspan class=\"vn\" lang=\"vi\">Dùng hệ số phù hợp\u003c/span>","p":"常見簡化例為 NOAEL ÷ 100；實際起點、係數不一定相同。\u003cspan class=\"vn\" lang=\"vi\">Ví dụ đơn giản thường NOAEL÷100; điểm đầu, hệ số thực có thể khác.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"100 常示意 10 倍種間差異 × 10 倍個體差異；不代表資料不確定性全消失，也不是所有添加物固定算法。\u003cspan class=\"vn\" lang=\"vi\">100 thường minh họa 10 lần khác loài × 10 lần khác cá thể; không xóa mọi bất định hay là phép tính cố định mọi phụ gia.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/files/food/published/Toxicological-Principles-for-the-Safety-Assessment-of-Food-Ingredients.pdf\" target=\"_blank\" rel=\"noopener\">評估起點與係數 / Điểm xuất phát, hệ số: FDA 技術資料 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"三種量：先寫單位\u003cspan class=\"vn\" lang=\"vi\">Ba loại lượng: viết đơn vị trước\u003c/span>","cols":3,"items":[{"h":"食品濃度\u003cspan class=\"vn\" lang=\"vi\">Nồng độ thực phẩm\u003c/span>","p":"例如 mg／kg 食品；濃度 × 吃的食品重量＝攝取 mg。\u003cspan class=\"vn\" lang=\"vi\">Ví dụ mg/kg thực phẩm; nồng độ × khối lượng ăn = mg ăn vào.\u003c/span>","c":"#2D2A6E"},{"h":"體重基準攝取量\u003cspan class=\"vn\" lang=\"vi\">Lượng theo thể trọng\u003c/span>","p":"一天各來源攝取 mg 加總，再除以 kg 體重。\u003cspan class=\"vn\" lang=\"vi\">Cộng mg từ mọi nguồn trong ngày rồi chia kg thể trọng.\u003c/span>","c":"#2D2A6E"},{"h":"比較評估值\u003cspan class=\"vn\" lang=\"vi\">So giá trị đánh giá\u003c/span>","p":"同物質、同單位、相同評估範圍，才能與 ADI 比較。\u003cspan class=\"vn\" lang=\"vi\">Cùng chất, đơn vị, phạm vi mới so ADI được.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"短活動 2｜把單位接起來\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 2: Nối các đơn vị\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"exposure\">\u003cp class=\"activity-time\">3 分鐘 / 3 phút\u003c/p>\u003cp class=\"activity-prompt\">完全假設：添加物 X 的 ADI＝1 mg/kg 體重/天；食品含 X 100 mg/kg，一天吃 200 g，體重 50 kg。此來源攝取多少？\u003cspan class=\"vn\" lang=\"vi\">Hoàn toàn giả định: ADI chất X=1 mg/kg thể trọng/ngày; thực phẩm chứa 100 mg/kg, ăn 200 g/ngày, nặng 50 kg. Nguồn này cho bao nhiêu?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>200 g＝＿＿kg；攝取＝100×＿＿＝＿＿mg；再÷50＝＿＿mg/kg 體重/天。\u003cspan class=\"vn\" lang=\"vi\">200 g=___kg; ăn vào=100×___=___mg; chia 50=___mg/kg thể trọng/ngày.\u003c/span>\u003c/div>\u003clabel for=\"a2-w15-exposure\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w15-exposure\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>0.2 kg；20 mg；0.4 mg/kg 體重/天，是假設 ADI 的 40%。\u003cspan class=\"vn\" lang=\"vi\">0,2 kg; 20 mg; 0,4 mg/kg thể trọng/ngày, bằng 40% ADI giả định.\u003c/span>\u003c/p>\u003cp>只算這項食品；還須加其他同物質來源。假設值不是丙酸鈣的 ADI 或法定限量，也不證明產品合規。\u003cspan class=\"vn\" lang=\"vi\">Chỉ nguồn này; còn cộng nguồn khác cùng chất. Số không là ADI canxi propionat hay giới hạn luật, chưa chứng minh tuân thủ.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"天然、無添加與安全\u003cspan class=\"vn\" lang=\"vi\">Tự nhiên, không phụ gia và an toàn\u003c/span>","cols":3,"items":[{"h":"來源不直接決定安全\u003cspan class=\"vn\" lang=\"vi\">Nguồn không tự quyết định an toàn\u003c/span>","p":"天然或合成都需看物質、用途、劑量與證據。\u003cspan class=\"vn\" lang=\"vi\">Tự nhiên hay tổng hợp đều cần chất, mục đích, liều, bằng chứng.\u003c/span>","c":"#2D2A6E"},{"h":"無添加也可有不同設計\u003cspan class=\"vn\" lang=\"vi\">Không phụ gia vẫn có cách khác\u003c/span>","p":"可能用加工、衛生或包裝控制；不能直接說較好或更危險。\u003cspan class=\"vn\" lang=\"vi\">Có thể kiểm soát bằng xử lý, vệ sinh, bao bì; không suy tốt hơn hay nguy hiểm hơn.\u003c/span>","c":"#2D2A6E"},{"h":"看整體產品\u003cspan class=\"vn\" lang=\"vi\">Xem cả sản phẩm\u003c/span>","p":"安全、營養、過敏、保存與實際食用方式分開確認。\u003cspan class=\"vn\" lang=\"vi\">Xác nhận an toàn, dinh dưỡng, dị ứng, bảo quản, cách ăn.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"ADI 與安全評估不是所有過敏或個人特殊反應的保證；仍須讀適用警語。\u003cspan class=\"vn\" lang=\"vi\">ADI, đánh giá an toàn không bảo đảm mọi phản ứng dị ứng hay cá nhân; vẫn đọc cảnh báo phù hợp.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.who.int/news-room/fact-sheets/detail/food-additives\" target=\"_blank\" rel=\"noopener\">評估範圍 / Phạm vi đánh giá: WHO ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"合規：不只問有沒有列名\u003cspan class=\"vn\" lang=\"vi\">Tuân thủ: không chỉ có tên trong danh mục\u003c/span>","cols":3,"items":[{"h":"非准用品項\u003cspan class=\"vn\" lang=\"vi\">Chất không cho phép\u003c/span>","p":"不能因為用量少，就任意當食品添加物使用。\u003cspan class=\"vn\" lang=\"vi\">Không vì ít mà tùy ý dùng làm phụ gia.\u003c/span>","c":"#2D2A6E"},{"h":"准用品項也有條件\u003cspan class=\"vn\" lang=\"vi\">Chất cho phép vẫn có điều kiện\u003c/span>","p":"用錯食品範圍、超量或不符規格，也可能違規。\u003cspan class=\"vn\" lang=\"vi\">Sai phạm vi thực phẩm, quá lượng, sai quy cách vẫn có thể vi phạm.\u003c/span>","c":"#2D2A6E"},{"h":"污染與蓄意添加不同\u003cspan class=\"vn\" lang=\"vi\">Nhiễm khác cố ý thêm\u003c/span>","p":"包材遷移、環境污染及蓄意摻入，要依證據分清來源。\u003cspan class=\"vn\" lang=\"vi\">Di chuyển từ bao bì, nhiễm môi trường, cố ý pha cần phân biệt bằng chứng.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"查《食品添加物使用範圍及限量暨規格標準》，同時確認品項、食品類別、計算基準與生效日期。\u003cspan class=\"vn\" lang=\"vi\">Tra tiêu chuẩn phụ gia, xác nhận chất, loại thực phẩm, cơ sở tính, ngày hiệu lực.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0040084\" target=\"_blank\" rel=\"noopener\">正面表列與生效範圍 / Danh mục, hiệu lực: 台灣法規 ↗\u003c/a>\u003c/p>"}]},{"id":"s3","nav":"三 看懂成分表","kicker":"第三段 · Phần 3","h2":"名稱、功能與警語","lead":"Tên, chức năng, cảnh báo","blocks":[{"type":"cards","title":"台灣成分標示：分清三件事\u003cspan class=\"vn\" lang=\"vi\">Nhãn Đài Loan: tách ba việc\u003c/span>","cols":3,"items":[{"h":"名稱\u003cspan class=\"vn\" lang=\"vi\">Tên\u003c/span>","p":"添加物要用規定品名或通用名稱，不能只寫「防腐劑」。\u003cspan class=\"vn\" lang=\"vi\">Dùng tên quy định hay thông dụng, không chỉ ghi chất bảo quản.\u003c/span>","c":"#2D2A6E"},{"h":"哪些要加功能？\u003cspan class=\"vn\" lang=\"vi\">Loại nào cần chức năng?\u003c/span>","p":"甜味劑、防腐劑、抗氧化劑，須同時標示功能性名稱。\u003cspan class=\"vn\" lang=\"vi\">Chất tạo ngọt, bảo quản, chống oxy hóa cần ghi thêm tên chức năng.\u003c/span>","c":"#2D2A6E"},{"h":"順序與分欄\u003cspan class=\"vn\" lang=\"vi\">Thứ tự và cột riêng\u003c/span>","p":"與內容物合併標示時依含量由高至低；也可分欄標示添加物。\u003cspan class=\"vn\" lang=\"vi\">Gộp cùng thành phần thì xếp lượng cao đến thấp; có thể ghi phụ gia riêng.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"依台灣施行細則第 9 條與 TFDA 標示說明；不能說所有類別都強制加用途，也不能跨分欄推定精確含量。\u003cspan class=\"vn\" lang=\"vi\">Theo Điều 9 quy tắc Đài Loan và TFDA; không mọi nhóm bắt buộc thêm chức năng, không suy lượng chính xác qua các cột.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0040003\" target=\"_blank\" rel=\"noopener\">名稱與功能標示 / Tên và chức năng: 台灣施行細則 ↗\u003c/a>\u003c/p>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/tc/includes/GetFile.ashx?id=f639057139719594572&type=2\" target=\"_blank\" rel=\"noopener\">合併與分欄例 / Ví dụ gộp, tách: TFDA ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"警語與過敏原：條件要完整\u003cspan class=\"vn\" lang=\"vi\">Cảnh báo, dị ứng: điều kiện đầy đủ\u003c/span>","cols":3,"items":[{"h":"阿斯巴甜\u003cspan class=\"vn\" lang=\"vi\">Aspartam\u003c/span>","p":"須有苯酮尿症相關警語；可用依法規定的同等意義文字。\u003cspan class=\"vn\" lang=\"vi\">Cần cảnh báo liên quan phenylketonuria; có thể dùng chữ tương đương theo quy định.\u003c/span>","c":"#2D2A6E"},{"h":"亞硫酸鹽\u003cspan class=\"vn\" lang=\"vi\">Sulfit\u003c/span>","p":"台灣：使用後終產品二氧化硫殘留 ≥10 mg/kg，須過敏原醒語。\u003cspan class=\"vn\" lang=\"vi\">Đài Loan: dùng sulfit, dư SO₂ thành phẩm ≥10 mg/kg cần cảnh báo dị ứng.\u003c/span>","c":"#2D2A6E"},{"h":"名稱少不等於無過敏原\u003cspan class=\"vn\" lang=\"vi\">Ít tên không nghĩa không dị ứng\u003c/span>","p":"仍須看牛奶、蛋、含麩質穀物等原料與相關醒語。\u003cspan class=\"vn\" lang=\"vi\">Vẫn xem sữa, trứng, ngũ cốc có gluten và cảnh báo.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"10 mg/kg 是此項標示條件，不是所有人的安全攝取量，也不是使用限量。\u003cspan class=\"vn\" lang=\"vi\">10 mg/kg là điều kiện ghi nhãn này, không là lượng ăn an toàn mọi người hay giới hạn sử dụng.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/tc/newsContent.aspx?cid=4&id=t622859\" target=\"_blank\" rel=\"noopener\">過敏原條件 / Điều kiện dị ứng: TFDA 2024 ↗\u003c/a>\u003c/p>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/tc/newsContent.aspx?id=13684\" target=\"_blank\" rel=\"noopener\">苯酮尿症警語 / Cảnh báo PKU: TFDA ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"麵包與火腿：功能推測的範圍\u003cspan class=\"vn\" lang=\"vi\">Bánh mì, giăm bông: phạm vi suy chức năng\u003c/span>","cols":3,"items":[{"h":"麵包中的丙酸鈣\u003cspan class=\"vn\" lang=\"vi\">Canxi propionat trong bánh\u003c/span>","p":"可用於抑黴；脂肪酸甘油酯可影響組織，作用依配方。\u003cspan class=\"vn\" lang=\"vi\">Có thể chống mốc; mono-diglycerid ảnh hưởng kết cấu tùy công thức.\u003c/span>","c":"#2D2A6E"},{"h":"火腿中的亞硝酸鹽\u003cspan class=\"vn\" lang=\"vi\">Nitrit trong giăm bông\u003c/span>","p":"可助發色與危害控制；不代表移除後必然不安全，須看替代設計。\u003cspan class=\"vn\" lang=\"vi\">Giúp màu, kiểm soát nguy hại; bỏ không chắc mất an toàn, xem thiết kế thay thế.\u003c/span>","c":"#2D2A6E"},{"h":"無法只由標示得知\u003cspan class=\"vn\" lang=\"vi\">Không biết chỉ từ nhãn\u003c/span>","p":"通常無法算出添加物精確 mg，更不能直接算個人長期暴露。\u003cspan class=\"vn\" lang=\"vi\">Thường không tính chính xác mg phụ gia hay phơi nhiễm cá nhân lâu dài.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"短活動 3｜功能、名稱與醒語\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 3: Chức năng, tên, cảnh báo\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"label\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">兩張模擬標示：A 只寫「防腐劑」；B 寫「防腐劑（己二烯酸鉀）」。哪張名稱較完整？再說出一項還要查的警語條件。\u003cspan class=\"vn\" lang=\"vi\">Hai nhãn mẫu: A chỉ chất bảo quản; B chất bảo quản (kali sorbat). Nhãn nào đầy đủ tên hơn? Nêu một điều kiện cảnh báo còn cần xem.\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>B 多了＿＿；若有＿＿，還要確認＿＿。\u003cspan class=\"vn\" lang=\"vi\">B thêm ___; nếu có ___ còn xác nhận ___.\u003c/span>\u003c/div>\u003clabel for=\"a2-w15-label\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w15-label\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>B 有具體名稱；例如含阿斯巴甜查苯酮尿症警語，使用亞硫酸鹽查終產品 SO₂ 殘留及醒語條件。\u003cspan class=\"vn\" lang=\"vi\">B có tên chất; ví dụ aspartam xem cảnh báo PKU, sulfit xem dư SO₂ thành phẩm, điều kiện cảnh báo.\u003c/span>\u003c/p>\u003cp>名稱較完整不是整份標示或配方已合規；過敏原門檻也不能當成 ADI 或添加限量。\u003cspan class=\"vn\" lang=\"vi\">Tên đầy đủ hơn không chứng minh cả nhãn, công thức tuân thủ; ngưỡng dị ứng không là ADI hay giới hạn thêm.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"讀標示的三個問題\u003cspan class=\"vn\" lang=\"vi\">Ba câu hỏi đọc nhãn\u003c/span>","cols":3,"items":[{"h":"它有什麼用途？\u003cspan class=\"vn\" lang=\"vi\">Chức năng gì?\u003c/span>","p":"辨認名稱與功能，再找適用規定。\u003cspan class=\"vn\" lang=\"vi\">Nhận tên, chức năng rồi tra quy định.\u003c/span>","c":"#2D2A6E"},{"h":"資料足夠嗎？\u003cspan class=\"vn\" lang=\"vi\">Đủ dữ liệu chưa?\u003c/span>","p":"濃度、攝食量、體重與其他來源，缺哪個？\u003cspan class=\"vn\" lang=\"vi\">Thiếu nồng độ, lượng ăn, thể trọng hay nguồn khác?\u003c/span>","c":"#2D2A6E"},{"h":"產品怎麼保存？\u003cspan class=\"vn\" lang=\"vi\">Bảo quản thế nào?\u003c/span>","p":"依產品標示與實際處理；不由「無添加」推定期限。\u003cspan class=\"vn\" lang=\"vi\">Theo nhãn, xử lý thực; không suy hạn từ không phụ gia.\u003c/span>","c":"#2D2A6E"}]}]},{"id":"sum","nav":"重點 Điểm chính","kicker":"今天的重點 · Điểm chính hôm nay","h2":"今天的重點","lead":"Điểm chính hôm nay","blocks":[{"type":"cards","title":"回顧\u003cspan class=\"vn\" lang=\"vi\">Ôn tập\u003c/span>","cols":2,"items":[{"h":"用途分類含甜味劑，共 18 類\u003cspan class=\"vn\" lang=\"vi\">Tính cả nhóm tạo ngọt: 18 nhóm\u003c/span>"},{"h":"ADI、食品限量與暴露量，基準不同\u003cspan class=\"vn\" lang=\"vi\">ADI, giới hạn thực phẩm, phơi nhiễm khác cơ sở\u003c/span>"},{"h":"名稱要清楚；三類須加功能性名稱\u003cspan class=\"vn\" lang=\"vi\">Tên rõ; ba nhóm cần thêm chức năng\u003c/span>"},{"h":"看產品、證據、警語與保存條件\u003cspan class=\"vn\" lang=\"vi\">Xem sản phẩm, bằng chứng, cảnh báo, bảo quản\u003c/span>"}]},{"type":"note","title":"","text":"選一題錯題，寫「我原本想＿＿，現在知道＿＿，因為＿＿」。\u003cspan class=\"vn\" lang=\"vi\">Chọn một câu sai, viết điều đã nghĩ, nay biết và lý do.\u003c/span>"}]},{"id":"quiz","nav":"練習 Luyện tập","kicker":"練習 · Luyện tập","h2":"課後練習 10 題","lead":"10 題核心檢核；先判斷，再看雙語原因與中文回答句型。10 câu: xét trước rồi đọc lý do song ngữ, mẫu câu tiếng Trung.","blocks":[{"type":"quiz","items":[{"q":"麵包標示「防腐劑（丙酸鈣）」，主要功能是？\u003cspan class=\"vn\" lang=\"vi\">Nhãn bánh ghi chất bảo quản (canxi propionat), chức năng chính?\u003c/span>","o":["把所有澱粉水解 / Thủy phân mọi tinh bột","抑制黴菌等微生物生長 / Hạn chế mốc, vi sinh vật","把油脂變成水 / Biến dầu thành nước","保證食品完全無菌 / Bảo đảm vô trùng tuyệt đối"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 可用於抑黴，但不代表無菌；仍須依准用範圍、用量與產品保存條件。\u003cspan class=\"vn\" lang=\"vi\">Có thể chống mốc nhưng không vô trùng; vẫn theo phạm vi, lượng và bảo quản.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：丙酸鈣可用於＿＿，保存還需要＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Canxi propionat có thể ___, bảo quản còn cần ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0040084\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"某添加物列在准用表中，就能用於任何食品嗎？\u003cspan class=\"vn\" lang=\"vi\">Phụ gia có trong danh mục là dùng mọi thực phẩm được?\u003c/span>","o":["能，只要標示天然 / Có, chỉ cần tự nhiên","能，只要總量少 / Có, chỉ cần ít","能，只看名稱即可 / Có, chỉ cần tên","不能，還要查食品範圍、限量、規格與生效日期 / Không, tra loại thực phẩm, giới hạn, quy cách, hiệu lực"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 准用物質仍有適用條件；用錯食品或超量也可能違規，不是只有非准用品項才有問題。\u003cspan class=\"vn\" lang=\"vi\">Chất cho phép vẫn có điều kiện; sai loại hay quá lượng cũng có thể vi phạm, không chỉ chất cấm.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：我查完品名，還要查＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tra tên xong, tôi còn tra ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0040084\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"弱有機酸防腐劑的效果，怎樣判讀較合理？\u003cspan class=\"vn\" lang=\"vi\">Đánh giá chất bảo quản axit yếu thế nào hợp lý?\u003c/span>","o":["較低 pH 常有利，但還看菌種、食品與濃度 / pH thấp thường có lợi, còn loài, thực phẩm, nồng độ","任何 pH 都完全相同 / Mọi pH giống hệt","pH 低就不用管用量 / pH thấp khỏi xem lượng","pH 7 時所有防腐劑都完全無效 / pH 7 mọi chất bảo quản hết hiệu quả"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 未解離比例與細胞作用是重要機制之一；不能把某個 pH 當成所有產品共用的有效或無效界線。\u003cspan class=\"vn\" lang=\"vi\">Tỷ lệ chưa phân ly, tác động tế bào là cơ chế quan trọng; không dùng một pH chia hiệu quả cho mọi sản phẩm.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：效果除了 pH，還要看＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Ngoài pH, hiệu quả còn tùy ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.1111/j.1365-2672.1983.tb02632.x\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"ADI 常用的單位與意義是？\u003cspan class=\"vn\" lang=\"vi\">Đơn vị, ý nghĩa thường dùng của ADI?\u003c/span>","o":["mg/kg 食品，是每個產品的固定法定濃度 / mg/kg thực phẩm, nồng độ luật cố định","g/包，是一次吃完就安全的量 / g/gói, lượng ăn một lần an toàn","mg/kg 體重/天，長期每日攝取的評估基準 / mg/kg thể trọng/ngày, cơ sở đánh giá lâu dài","每天應吃到的營養目標 / Mục tiêu dinh dưỡng phải ăn đủ"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> ADI 是長期攝取的估計基準，不是食品使用限量、營養建議或每餐中毒分界。\u003cspan class=\"vn\" lang=\"vi\">ADI là cơ sở ước tính lâu dài, khác giới hạn thực phẩm, khuyến nghị dinh dưỡng, ranh giới ngộ độc từng bữa.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：ADI 的 kg 指的是＿＿，不是＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: kg của ADI chỉ ___, không phải ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.who.int/news-room/fact-sheets/detail/food-additives\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"假設 NOAEL＝100 mg/kg 體重/天，採係數 100，ADI 是？\u003cspan class=\"vn\" lang=\"vi\">Giả định NOAEL=100 mg/kg thể trọng/ngày, hệ số 100, ADI?\u003c/span>","o":["100 mg/kg 體重/天 / 100 mg/kg thể trọng/ngày","1 mg/kg 體重/天 / 1 mg/kg thể trọng/ngày","10,000 mg/kg 體重/天 / 10.000 mg/kg thể trọng/ngày","1 mg/kg 食品 / 1 mg/kg thực phẩm"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 100÷100＝1，體重與每日的單位不變。這是假設例，實際評估不一定固定用 100。\u003cspan class=\"vn\" lang=\"vi\">100÷100=1, đơn vị theo thể trọng, ngày giữ nguyên. Giả định này không nghĩa luôn dùng hệ số 100.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：我用＿＿除以＿＿，單位仍是＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tôi lấy ___ chia ___, đơn vị vẫn ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/files/food/published/Toxicological-Principles-for-the-Safety-Assessment-of-Food-Ingredients.pdf\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"假設食品含 X 100 mg/kg，一天吃 200 g，體重 50 kg，此來源攝取量是？\u003cspan class=\"vn\" lang=\"vi\">Giả định 100 mg X/kg thực phẩm, ăn 200 g/ngày, nặng 50 kg, nguồn này cho?\u003c/span>","o":["0.4 mg/kg 體重/天 / 0,4 mg/kg thể trọng/ngày","400 mg/kg 體重/天 / 400 mg/kg thể trọng/ngày","20 mg/kg 體重/天 / 20 mg/kg thể trọng/ngày","100 mg/kg 體重/天 / 100 mg/kg thể trọng/ngày"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 200 g＝0.2 kg，100×0.2＝20 mg，再除 50＝0.4。還要加同物質的其他來源，不能由此判產品合規。\u003cspan class=\"vn\" lang=\"vi\">200 g=0,2 kg; 100×0,2=20 mg, chia 50=0,4. Còn nguồn khác cùng chất, chưa xét tuân thủ sản phẩm.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：先把 g 換成＿＿，算出 mg，再除以＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Đổi g thành ___, tính mg rồi chia ___.\u003c/span>\u003c/div>"},{"q":"台灣以終產品 SO₂ 殘留 ≥10 mg/kg 作亞硫酸鹽過敏原醒語條件，這是？\u003cspan class=\"vn\" lang=\"vi\">Điều kiện Đài Loan dư SO₂ ≥10 mg/kg để ghi cảnh báo sulfit là?\u003c/span>","o":["所有添加物的 ADI / ADI mọi phụ gia","所有人每天可吃 10 mg / Mọi người ăn 10 mg/ngày","所有食品的添加限量 / Giới hạn thêm mọi thực phẩm","特定標示門檻，與 ADI、使用限量不同 / Ngưỡng nhãn cụ thể, khác ADI, giới hạn sử dụng"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 這裡的 kg 是終產品重量、量是 SO₂ 殘留；不是每公斤體重，也不能當作個人不會反應的保證。\u003cspan class=\"vn\" lang=\"vi\">kg ở đây là thành phẩm, lượng là SO₂ dư; không là thể trọng, không bảo đảm cá nhân không phản ứng.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：這是＿＿的門檻，不是＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Đây là ngưỡng ___, không là ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/tc/newsContent.aspx?cid=4&id=t622859\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"台灣哪些類別依施行細則須同時標示功能性名稱？\u003cspan class=\"vn\" lang=\"vi\">Nhóm nào ở Đài Loan cần thêm tên chức năng theo quy tắc?\u003c/span>","o":["所有十八類都一樣 / Cả 18 nhóm đều vậy","只有乳化劑與膨脹劑 / Chỉ nhũ hóa, tạo xốp","甜味劑、防腐劑、抗氧化劑 / Tạo ngọt, bảo quản, chống oxy hóa","所有添加物只寫功能即可 / Mọi phụ gia chỉ ghi chức năng"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 仍須寫品名或通用名稱；三類另加功能性名稱，不能只寫「防腐劑」。\u003cspan class=\"vn\" lang=\"vi\">Vẫn cần tên chất hay tên thông dụng; ba nhóm thêm chức năng, không chỉ chất bảo quản.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：我看到「防腐劑」，還應找＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Thấy chất bảo quản, tôi còn tìm ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0040003\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"添加物與內容物可以分欄，能跨兩欄直接比較精確用量嗎？\u003cspan class=\"vn\" lang=\"vi\">Phụ gia, thành phần ghi riêng cột, có so lượng chính xác qua hai cột?\u003c/span>","o":["不能，標示位置不直接給精確濃度 / Không, vị trí không cho nồng độ chính xác","能，兩欄最後一項一定等量 / Có, cuối hai cột chắc cùng lượng","能，成分表就是完整定量配方 / Có, nhãn là công thức định lượng đầy đủ","能，排後面一定沒有風險 / Có, cuối chắc không nguy cơ"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 合併標示依含量排序，分欄需依規定判讀；即使有排序，也沒有每項精確 mg。\u003cspan class=\"vn\" lang=\"vi\">Gộp theo lượng, cột riêng đọc theo quy định; dù có thứ tự cũng không có mg chính xác.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：標示告訴我＿＿，濃度還需＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Nhãn cho biết ___, nồng độ còn cần ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/tc/includes/GetFile.ashx?id=f639057139719594572&type=2\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"「無添加防腐劑」能直接判定較安全或期限較短嗎？\u003cspan class=\"vn\" lang=\"vi\">Không thêm bảo quản có suy an toàn hơn hay hạn ngắn hơn?\u003c/span>","o":["能，其他條件不用看 / Có, khỏi xem điều kiện khác","不能，還看製程、包裝、配方與保存 / Không, còn xử lý, bao bì, công thức, bảo quản","能，一定有更多病原 / Có, chắc nhiều mầm bệnh hơn","能，一定增加鹽糖 / Có, chắc tăng muối đường"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 產品可能用不同保存設計；要依實際資料比較，不能只由一句宣稱下結論。\u003cspan class=\"vn\" lang=\"vi\">Sản phẩm có thể dùng cách bảo quản khác; so dữ liệu thực, không chỉ một tuyên bố.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：要比較安全與期限，我還需要＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Để so an toàn, hạn, tôi còn cần ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.who.int/news-room/fact-sheets/detail/food-additives\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"}]}]}],"a2":true,"track":{"url":"https://qmldcjkllisvfgegkfsz.supabase.co","key":"sb_publishable_xprm7A1B-hQhAMBIMaWOWw_w617svI1"}};</script>

    var cfg = D.track;
    var noop = function () {};
    if (!cfg || !cfg.url || !cfg.key) return { on: false, send: noop, flush: noop, code: function () { return ""; }, setCode: noop };
    var KEY = "ifs_code", DKEY = "ifs_device";
    var rnd = function () { return Math.random().toString(36).slice(2, 10); };
    var sid = rnd() + Date.now().toString(36);
    // device_id：同一支手機／瀏覽器跨次開頁不變。學生後來才填學號代碼時，先前的 anon 事件可靠它回接。
    var did = "";
    try { did = localStorage.getItem(DKEY) || ""; if (!did) { did = "d" + rnd() + rnd(); localStorage.setItem(DKEY, did); } } catch (e) { did = "d" + rnd(); }
    var q = [], timer = null;
    function code() { try { return (localStorage.getItem(KEY) || "").trim(); } catch (e) { return ""; } }
    function setCode(v) { try { localStorage.setItem(KEY, (v || "").trim().slice(0, 20)); } catch (e) {} }
    function cut(s, n) { return s == null ? null : String(s).slice(0, n); }
    // 欄位長度與 payload 大小在前端先截到資料表 CHECK 的上限：PostgREST 批次 INSERT 是原子的，
    // 一筆違反 CHECK 整批都會被拒，而我們失敗即丟，會靜默掉整個 4 秒窗口。
    function send(event, mod, block, payload) {
      var p = payload || {};
      var ps = JSON.stringify(p);
      if (ps.length > 1800) p = { trunc: true, keys: Object.keys(p).slice(0, 10) };
      q.push({
        student_code: cut(code(), 20) || "anon", device_id: cut(did, 40), week: D.week || 0,
        module_id: cut(mod, 30), block_type: cut(block, 10), event: cut(event, 30),
        payload: p, session_id: cut(sid, 40), build: cut(D.build, 16), client_ts: new Date().toISOString(),
        cls: A2 ? "a2" : undefined,   // 國合班與一般班同週分開；一般班不送這欄（JSON 會略過 undefined）
      });
      if (q.length >= 40) flush();
      else if (!timer) timer = setTimeout(flush, 4000);
    }
    function flush() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!q.length) return;
      var body = JSON.stringify(q.splice(0, 50));
      try {
        fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/ifs_lesson_events", {
          method: "POST", keepalive: true, body: body,
          headers: { "Content-Type": "application/json", "apikey": cfg.key, "Prefer": "return=minimal" },
        }).catch(noop);
      } catch (e) { /* 舊瀏覽器沒有 fetch：不記錄 */ }
      if (q.length) timer = setTimeout(flush, 1000);
    }
    window.addEventListener("pagehide", flush);
    return { on: true, send: send, flush: flush, code: code, setCode: setCode };
  })();

  BLOCKS.match = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "match-wrap");
    var pool = el("div", "pool"), targets = el("div", "targets");
    var pairs = b.pairs;
    var order = pairs.slice().sort(function () { return Math.random() - 0.5; });
    var selected = null, solved = 0, errors = 0, t0 = null;
    var mod = CTX.mod, bi = CTX.bi;
    var msg = el("div");
    msg.style.cssText = "margin-top:14px;font-weight:700;color:var(--green)";

    function tryMatch(slot, key) {
      if (slot.classList.contains("ok")) return;
      if (t0 === null) t0 = Date.now();
      if (slot.dataset.k === key) {
        slot.classList.add("ok"); slot.classList.remove("bad");
        slot.querySelector(".drop").textContent = key;
        var chip = pool.querySelector('.chip[data-k="' + key + '"]');
        chip.classList.add("used"); chip.classList.remove("sel");
        selected = null; solved++;
        TRACK.send("match_ok", mod, "match", { b: bi, label: key });
        if (solved === pairs.length) {
          msg.textContent = b.done || U("✓ 全部答對！", "Đúng hết!");
          TRACK.send("match_done", mod, "match", { b: bi, n: pairs.length, errors: errors, ms: Date.now() - t0 });
        }
      } else {
        errors++;
        TRACK.send("match_bad", mod, "match", { b: bi, label: key, slot: slot.dataset.k });
        slot.classList.add("bad");
        setTimeout(function () { slot.classList.remove("bad"); }, 350);
      }
    }
    order.forEach(function (q) {
      var c = el("div", "chip"); c.textContent = q.label; c.draggable = true; c.dataset.k = q.label;
      c.addEventListener("dragstart", function (e) { e.dataTransfer.setData("k", q.label); });
      c.onclick = function () {
        if (c.classList.contains("used")) return;
        if (selected === c) { c.classList.remove("sel"); selected = null; return; }
        pool.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("sel"); });
        c.classList.add("sel"); selected = c;
      };
      pool.appendChild(c);
    });
    pairs.forEach(function (q) {
      var s = el("div", "slot"); s.dataset.k = q.label;
      s.innerHTML = '<div class="drop">' + U("拖到這裡", "Kéo vào đây") + '</div><div class="desc">' + q.desc + '</div>';
      s.addEventListener("dragover", function (e) { e.preventDefault(); });
      s.addEventListener("drop", function (e) { e.preventDefault(); tryMatch(s, e.dataTransfer.getData("k")); });
      s.onclick = function () { if (selected) tryMatch(s, selected.dataset.k); };
      targets.appendChild(s);
    });
    host.appendChild(pool); host.appendChild(targets); host.appendChild(msg);
    f.appendChild(host); return f;
  };

  /* 結果代碼：把作答結果編成一串可貼給老師的代碼（FSQ1.<base64>.<檢查碼>）。

  }

    bar.innerHTML = '<label for="ifs-code" style="font-weight:700">' + U("學號代碼", "Mã số SV") + '</label>' +
      '<input id="ifs-code" maxlength="20" placeholder="' + U("例：S001", "VD: S001") + '" style="width:120px;padding:6px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:14px">' +
      '<span style="opacity:.75">' + U("只記錄你的學習歷程（翻卡、配對、測驗），不需要姓名。", "Chỉ ghi lại quá trình học (lật thẻ, ghép cặp, kiểm tra), không cần tên.") + '</span>';
    nav.parentNode.insertBefore(bar, nav);
    var inp = bar.querySelector("#ifs-code");
    inp.value = TRACK.code();
    inp.addEventListener("change", function () {
      TRACK.setCode(inp.value);
      document.querySelectorAll(".qid").forEach(function (x) { x.value = TRACK.code(); });
      TRACK.send("code_set", null, null, {});
    });
    TRACK.send("session_start", curMod, null, {
      device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || "") ? "mobile" : "desktop",
      w: window.innerWidth, build: D.build || null,
    });
    // 停留時間以「頁面可見」為準：切到背景就結算一段 module_leave，回來重新計時。
    // 手機瀏覽器殺分頁常不觸發 pagehide，所以以 visibilitychange→hidden 為主。
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        TRACK.send("module_leave", curMod, null, { ms: Date.now() - modT0 }); TRACK.flush();
      } else {
        modT0 = Date.now();
      }
    });
  }
})();
</script>
</body>
</html>
