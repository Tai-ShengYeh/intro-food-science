<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品科學概論 第7週 · 國合班互動練習</title>
<style>
  :root{
    --primary:#2D2A6E; --secondary:#5B4FB8; --accent:#00B8B8; --warm:#F5A623; --green:#2FA36B; --red:#D65B5B; --dark:#1A1A3E; --bg:#F4F5FA; --text:#1F1F2E; --mid:#5A5A75; --muted:#9096ac; --border:#E2E2EC; --card:#fff;
  }
/* 版型樣式 — 逐條取自「第1週_互動教學.html」，末段為新增區塊（cmp / tbl / note）。
   這裡只用 var(--x)；色票由 tokens.js 產生 :root 注入。 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:17px}
header{background:linear-gradient(120deg,var(--dark),var(--primary));color:#fff;
  padding:26px 22px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(0,0,0,.15)}
header h1{font-size:31px;font-weight:800;letter-spacing:.5px}
header .sub{color:#b9c7ff;font-size:16px;margin-top:5px}
nav{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.10);color:#dfe4ff;border:none;padding:12px 18px;
  border-radius:10px 10px 0 0;font-size:16.5px;cursor:pointer;font-weight:600;transition:.15s}
nav button:hover{background:rgba(255,255,255,.2)}
nav button.active{background:var(--bg);color:var(--primary)}
main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
.module{display:none;animation:fade .35s}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead{background:var(--dark);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:22px}
.lead .kicker{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px}
.lead h2{font-size:26px;margin:6px 0 8px}
.lead p{color:#cdd3ee;font-size:16.5px}
.sec-title{font-size:23px;font-weight:800;color:var(--primary);margin:30px 0 6px;
  display:flex;align-items:center;gap:10px}
.sec-title .bar{width:6px;height:25px;background:var(--accent);border-radius:3px;display:inline-block}
.hint{color:var(--mid);font-size:15px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* flip cards */
.flip{perspective:1100px;height:200px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px rgba(30,30,60,.08);border:1px solid var(--border)}
.front{background:var(--card)}
.front .t{font-size:21px;font-weight:800;color:var(--primary)}
.front .en{color:var(--muted);font-size:14px;margin-top:3px;font-style:italic}
.front .tap{margin-top:auto;color:var(--accent);font-size:14px;font-weight:700}
.back{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;transform:rotateY(180deg);overflow:auto}
.back p{font-size:16px}
.cbar{height:6px;border-radius:14px 14px 0 0;position:absolute;top:0;left:0;right:0}

/* expandable */
.exp{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.exp>button{width:100%;text-align:left;background:none;border:none;padding:16px 18px;cursor:pointer;
  display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;color:var(--text)}
.exp .num{background:var(--primary);color:#fff;min-width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.exp .chev{margin-left:auto;color:var(--muted);transition:.25s;font-size:20px}
.exp.on .chev{transform:rotate(90deg);color:var(--accent)}
.exp .body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 18px}
.exp.on .body{padding:0 18px 16px 62px}
.exp .body ul{margin-left:16px;color:var(--mid);font-size:16px}
.exp .body p{color:var(--mid);font-size:15.5px}
.exp .tag{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:8px}

/* info card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.card .h{font-weight:800;color:var(--primary);font-size:18px;margin-bottom:6px}
.card .en{color:var(--muted);font-size:13px;font-style:italic}
.card ul{margin:8px 0 0 18px;font-size:15.5px;color:var(--mid)}

/* timeline */
.tl{display:flex;gap:0;flex-wrap:wrap;counter-reset:s}
.tl .step{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 14px 14px;margin:8px;position:relative}
.tl .dot{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;margin-bottom:8px}
.tl .step h4{color:var(--primary);font-size:17.5px;margin-bottom:4px}
.tl .step p{font-size:15px;color:var(--mid)}

/* matching */
.match-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.pool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--secondary);color:#fff;padding:10px 17px;border-radius:22px;font-weight:700;
  cursor:grab;user-select:none;font-size:16.5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chip.used{opacity:.35;pointer-events:none}
.chip.sel{outline:3px solid var(--warm);outline-offset:2px}
.targets{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;border:2px dashed var(--border);border-radius:12px;padding:10px 14px;background:#fafbff}
.slot .desc{flex:1;font-size:16px;color:var(--text)}
.slot .drop{min-width:130px;min-height:44px;border-radius:8px;background:#eef0f8;display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:15px;padding:8px 12px}
.slot.ok{border-color:var(--green);background:#effaf3}
.slot.ok .drop{background:var(--green);color:#fff;font-weight:700}
.slot.bad{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* quiz */
.quiz-head{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.pbar{height:12px;background:#e7e9f4;border-radius:8px;overflow:hidden;margin-top:10px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--secondary));transition:width .4s}
.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.q .qn{color:var(--accent);font-weight:800;font-size:14px}
.q .qt{font-size:19.5px;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fafbff;border:2px solid var(--border);
  border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;font-size:16.5px;transition:.15s}
.opt:hover{border-color:var(--secondary)}
.opt.correct{border-color:var(--green);background:#effaf3;font-weight:700}
.opt.wrong{border-color:var(--red);background:#fdeeee}
.opt.dim{opacity:.6}
.fb{margin-top:8px;font-size:15.5px;padding:11px 14px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.good{background:#effaf3;color:#1c7a4d} .fb.no{background:#fdeeee;color:#a83b3b}
.scorebox{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:16px;
  padding:26px;text-align:center;margin-top:10px;display:none}
.scorebox.show{display:block}
.scorebox .big{font-size:46px;font-weight:800}
.btn{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:10px;
  font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.18)}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;background:#eef0fb;color:var(--secondary);padding:3px 10px;border-radius:20px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px}

/* ===== 新增區塊 ===== */
/* compare：兩欄對照（梅納 vs 焦糖化、冷藏 vs 冷凍…） */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media(max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 18px 18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06);position:relative;overflow:hidden}
.cmp .col .cbar{position:static;height:6px;margin:0 -18px 14px;border-radius:0}
.cmp .col h4{font-size:20px;font-weight:800;margin-bottom:2px}
.cmp .col .en{color:var(--muted);font-size:13px;font-style:italic;margin-bottom:8px}
.cmp .col ul{margin-left:18px;font-size:15.5px;color:var(--mid)}
.cmp .col li{margin-bottom:5px}
.cmp-note{margin-top:12px;background:#eef0fb;border-left:5px solid var(--secondary);
  border-radius:0 10px 10px 0;padding:12px 16px;font-size:16px;color:var(--primary);font-weight:600}

/* table：資料表（維生素、添加物分類…） */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px}
.tbl th{background:var(--primary);color:#fff;text-align:left;padding:12px 14px;font-weight:700;font-size:15px}
.tbl td{padding:11px 14px;border-top:1px solid var(--border);color:var(--mid);vertical-align:top}
.tbl tr:nth-child(even) td{background:#fafbff}
.tbl td:first-child{color:var(--text);font-weight:700}

/* note：重點提示條 */
.note{background:#fff8e9;border-left:5px solid var(--warm);border-radius:0 12px 12px 0;
  padding:14px 18px;margin:14px 0;font-size:16px;color:var(--text)}
.note b{color:var(--primary)}
.note.key{background:#effaf3;border-left-color:var(--green)}
.note.warn{background:#fdeeee;border-left-color:var(--red)}
/* 國合班 A2 互動練習：拼音與越南文（build_a2.js 產生的內容才會用到） */
.py{display:block;font-size:.78em;font-weight:500;color:var(--mid);margin-top:2px}
.vn{display:block;font-size:.88em;font-weight:500;color:var(--secondary);margin-top:2px}
/* Shared classroom tasks: oral response, sentence support, then sample explanation. */
.class-activity{display:grid;gap:12px;min-width:0}
.class-activity .vn{display:block;color:#0E7C7B;font-size:15px;line-height:1.5;margin-top:4px}
.activity-time{color:#0E7C7B;font-weight:700;font-size:15px}
.activity-prompt{font-size:clamp(18px,2.3vw,23px);line-height:1.5}
.sentence-stem{padding:12px 16px;background:#EFFAF3;border-left:5px solid #2FA36B;color:#1A1A3E;line-height:1.6}
.class-activity label{font-size:14px;color:#52526B}
.activity-response{display:block;width:100%;max-width:100%;min-height:72px;border:1.5px solid #A0A0B5;border-radius:8px;padding:10px 12px;resize:vertical;font:inherit;font-size:17px;background:#fff;color:#1F1F2E}
.activity-answer{border:1px solid #E2E2EC;background:#fff;border-radius:8px;padding:10px 14px;font-size:16px;line-height:1.5}
.activity-answer summary{cursor:pointer;font-weight:700;color:#2D2A6E}
.activity-answer p{margin-top:10px}
.activity-response:focus-visible,.activity-answer summary:focus-visible{outline:3px solid #0E7C7B;outline-offset:3px}
.source-note{font-size:13px;color:#52526B;line-height:1.5;overflow-wrap:anywhere;margin-top:10px}
.source-note .vn{display:block;color:#0E7C7B;font-size:13px}
.lesson-links{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.lesson-links a{color:inherit;text-underline-offset:3px}
.feedback-reason,.feedback-transfer{margin-top:6px}
.feedback-transfer{font-weight:600}
@media(max-width:640px){header{position:relative!important}.class-activity{gap:10px}}
@media print{.activity-response{min-height:64px}}


.back .vn{color:#D7FAF3}.tbl-wrap{overflow-x:auto}
</style>
</head>

<script>window.__LESSON__={"week":7,"series":["#2D2A6E","#2FA36B","#F5A623","#5B4FB8","#00B8B8","#D65B5B"],"modules":[{"id":"m0","nav":"今天 Hôm nay","kicker":"今天學什麼 · Hôm nay học gì","h2":"色素、風味與酵素","lead":"sèsù, fēngwèi yǔ xiàosù　·　Sắc tố, hương vị và enzyme","blocks":[{"type":"cards","title":"今天學三件事　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Hôm nay học 3 điều\u003c/span>","cols":3,"items":[{"h":"食物的顏色從哪裡來？","p":"\u003cspan class=\"vn\">Màu của thực phẩm từ đâu mà có?\u003c/span>"},{"h":"風味：味覺和嗅覺","p":"\u003cspan class=\"vn\">Hương vị: vị giác và khứu giác\u003c/span>"},{"h":"酵素：有用，也有麻煩","p":"\u003cspan class=\"vn\">Enzyme: có ích, nhưng cũng gây rắc rối\u003c/span>"}]},{"type":"note","title":"看影片：胡椒的四種顏色　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Xem video: 4 màu của hạt tiêu\u003c/span>","text":"\u003ca href=\"https://www.youtube.com/watch?v=y7YGYxRzU6o&t=484s\" target=\"_blank\" rel=\"noopener\" style=\"font-weight:700\">▶ 一顆果子，四種胡椒\u003c/a>\u003cspan class=\"vn\">Một quả tiêu, bốn loại tiêu\u003c/span>\u003cul style=\"margin:10px 0 0;padding-left:22px\">\u003cli>影片裡有哪四種胡椒？\u003cspan class=\"vn\">Trong video có 4 loại tiêu nào?\u003c/span>\u003c/li>\u003cli>黑胡椒用什麼顏色的果子做？\u003cspan class=\"vn\">Tiêu đen làm từ quả màu gì?\u003c/span>\u003c/li>\u003cli>做白胡椒，要去掉什麼？\u003cspan class=\"vn\">Làm tiêu trắng phải bỏ phần nào?\u003c/span>\u003c/li>\u003c/ul>胡椒變黑可涉及多酚氧化、葉綠素及其他成分變化；影片是觀察起點，不把所有黑色只歸因一個反應。\u003cspan class=\"vn\" lang=\"vi\">Tiêu đen có thể liên quan oxy hóa polyphenol, đổi diệp lục và thành phần khác; video là điểm quan sát, không quy mọi màu đen cho một phản ứng.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.3390/molecules23020370\" target=\"_blank\" rel=\"noopener\">胡椒加工研究 / Nghiên cứu tiêu: 2018 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"一杯蘋果汁，三個問題\u003cspan class=\"vn\" lang=\"vi\">Một ly nước táo, ba câu hỏi\u003c/span>","cols":3,"items":[{"h":"① 顏色從哪裡來？\u003cspan class=\"vn\" lang=\"vi\">Màu từ đâu?\u003c/span>","p":"紅皮的原有色素，和切面新出現的褐色，機制可能不同。\u003cspan class=\"vn\" lang=\"vi\">Sắc tố vốn có ở vỏ đỏ và màu nâu mới ở mặt cắt có thể khác cơ chế.\u003c/span>","c":"#2D2A6E"},{"h":"② 甜、酸，還是香？\u003cspan class=\"vn\" lang=\"vi\">Ngọt, chua hay thơm?\u003c/span>","p":"把味覺、嗅覺與口感分開描述，再合起來說風味。\u003cspan class=\"vn\" lang=\"vi\">Mô tả vị, mùi và cảm giác miệng riêng rồi nói hương vị.\u003c/span>","c":"#F5A623"},{"h":"③ 利用還是抑制酵素？\u003cspan class=\"vn\" lang=\"vi\">Dùng hay hạn chế enzyme?\u003c/span>","p":"果膠酶可幫助澄清；PPO 造成的切面褐變可能需要控制。\u003cspan class=\"vn\" lang=\"vi\">Pectinase có thể giúp làm trong; hóa nâu do PPO có thể cần kiểm soát.\u003c/span>","c":"#2FA36B"}]}]},{"id":"m1","nav":"生詞 Từ mới","kicker":"生詞 · Từ mới","h2":"本週生詞","lead":"10 個生詞　·　10 từ mới","blocks":[{"type":"flips","cols":3,"items":[{"t":"色素","en":"sèsù","b":"sắc tố (chất màu)"},{"t":"葉綠素","en":"yèlǜsù","b":"diệp lục (chlorophyll)"},{"t":"花青素","en":"huāqīngsù","b":"anthocyanin"},{"t":"肌紅蛋白","en":"jīhóng dànbái","b":"myoglobin"},{"t":"風味","en":"fēngwèi","b":"hương vị"}],"title":"翻卡：生詞　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Lật thẻ: từ mới\u003c/span>"},{"type":"flips","cols":3,"items":[{"t":"味覺","en":"wèijué","b":"vị giác"},{"t":"嗅覺","en":"xiùjué","b":"khứu giác"},{"t":"酵素","en":"xiàosù","b":"enzyme"},{"t":"褐變","en":"hébiàn","b":"hóa nâu"},{"t":"殺菁","en":"shājīng","b":"chần"}]},{"type":"match","title":"配對：中文 ↔ 越南文　\u003cspan style=\"font-weight:500;color:var(--secondary)\">Ghép: tiếng Trung ↔ tiếng Việt\u003c/span>","pairs":[{"label":"色素","desc":"sắc tố (chất màu)"},{"label":"葉綠素","desc":"diệp lục (chlorophyll)"},{"label":"花青素","desc":"anthocyanin"},{"label":"肌紅蛋白","desc":"myoglobin"},{"label":"風味","desc":"hương vị"},{"label":"味覺","desc":"vị giác"},{"label":"嗅覺","desc":"khứu giác"},{"label":"酵素","desc":"enzyme"},{"label":"褐變","desc":"hóa nâu"},{"label":"殺菁","desc":"chần"}],"done":"✓ 全部答對！Đúng hết!"}]},{"id":"s1","nav":"一 食物的顏色從哪裡…","kicker":"第一段 · Phần 1","h2":"食物的顏色從哪裡來？","lead":"Màu của thực phẩm từ đâu mà có?","blocks":[{"type":"cards","title":"四種常見天然色素\u003cspan class=\"vn\" lang=\"vi\">Bốn nhóm sắc tố tự nhiên thường gặp\u003c/span>","cols":4,"items":[{"h":"葉綠素\u003cspan class=\"vn\" lang=\"vi\">Diệp lục\u003c/span>","p":"常見綠色；酸與加熱條件可使它轉為橄欖褐。\u003cspan class=\"vn\" lang=\"vi\">Thường xanh lá; axit và điều kiện nhiệt có thể làm ngả nâu ô liu.\u003c/span>","c":"#2FA36B"},{"h":"類胡蘿蔔素\u003cspan class=\"vn\" lang=\"vi\">Carotenoid\u003c/span>","p":"常見黃、橙、紅；氧、光與加工條件可改變它。\u003cspan class=\"vn\" lang=\"vi\">Thường vàng, cam, đỏ; oxy, sáng và chế biến có thể làm thay đổi.\u003c/span>","c":"#F5A623"},{"h":"花青素\u003cspan class=\"vn\" lang=\"vi\">Anthocyanin\u003c/span>","p":"顏色受 pH、種類、濃度等影響。\u003cspan class=\"vn\" lang=\"vi\">Màu tùy pH, loại, nồng độ và các yếu tố khác.\u003c/span>","c":"#5B4FB8"},{"h":"肌紅蛋白\u003cspan class=\"vn\" lang=\"vi\">Myoglobin\u003c/span>","p":"肉色會隨氧結合、鐵的氧化狀態與加熱而變。\u003cspan class=\"vn\" lang=\"vi\">Màu thịt đổi theo gắn oxy, trạng thái oxy hóa sắt và nhiệt.\u003c/span>","c":"#D65B5B"}]},{"type":"note","title":"","text":"加工可幫助類胡蘿蔔素從組織釋出，餐中脂肪也與吸收有關；但加工同時可能造成損失，不能說所有類胡蘿蔔素都很耐煮。\u003cspan class=\"vn\" lang=\"vi\">Chế biến có thể giúp giải phóng carotenoid khỏi mô, chất béo bữa ăn cũng liên quan hấp thu; nhưng chế biến có thể gây mất, không nói mọi carotenoid đều rất bền khi nấu.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/21923982/\" target=\"_blank\" rel=\"noopener\">胡蘿蔔人體研究 / Nghiên cứu người, cà rốt: 2011 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"青菜保綠，要看哪些條件？\u003cspan class=\"vn\" lang=\"vi\">Giữ màu xanh cần xem gì?\u003c/span>","cols":3,"items":[{"h":"酸與葉綠素\u003cspan class=\"vn\" lang=\"vi\">Axit và diệp lục\u003c/span>","p":"酸可使中心鎂被氫取代，形成橄欖褐的脫鎂葉綠素。\u003cspan class=\"vn\" lang=\"vi\">Axit có thể thay Mg trung tâm bằng H, tạo pheophytin nâu ô liu.\u003c/span>","c":"#2D2A6E"},{"h":"時間、水量與降溫\u003cspan class=\"vn\" lang=\"vi\">Thời gian, nước và làm nguội\u003c/span>","p":"縮短不必要久煮；水量與冷卻方式也影響溶出及質地。\u003cspan class=\"vn\" lang=\"vi\">Tránh nấu lâu không cần; nước và cách làm nguội cũng ảnh hưởng hòa tan và kết cấu.\u003c/span>","c":"#2FA36B"},{"h":"綠不代表營養全保留\u003cspan class=\"vn\" lang=\"vi\">Xanh không bằng giữ mọi chất\u003c/span>","p":"加鹼可能使組織軟爛、影響部分維生素；不以顏色判定營養。\u003cspan class=\"vn\" lang=\"vi\">Thêm kiềm có thể làm mềm nát, ảnh hưởng vài vitamin; không suy dinh dưỡng chỉ từ màu.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"鍋蓋不是唯一原因；比較時要指定食材、酸鹼、時間與水量，也要看口感和營養保留。\u003cspan class=\"vn\" lang=\"vi\">Nắp nồi không phải nguyên nhân duy nhất; cần chỉ rõ nguyên liệu, pH, thời gian, nước và xem cả kết cấu, giữ dinh dưỡng.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC11643711/\" target=\"_blank\" rel=\"noopener\">綠葉菜加工研究 / Nghiên cứu chế biến rau xanh: 2024 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"以紫甘藍汁為例：pH 改變顏色\u003cspan class=\"vn\" lang=\"vi\">Ví dụ nước bắp cải tím: pH đổi màu\u003c/span>","cols":3,"items":[{"h":"加醋後\u003cspan class=\"vn\" lang=\"vi\">Sau thêm giấm\u003c/span>","p":"常向紅、粉紅方向變化。\u003cspan class=\"vn\" lang=\"vi\">Thường chuyển về đỏ, hồng.\u003c/span>","c":"#D65B5B"},{"h":"原汁或加水對照\u003cspan class=\"vn\" lang=\"vi\">Dịch gốc hoặc đối chứng nước\u003c/span>","p":"可呈紫色或偏藍；記錄實際看到的顏色。\u003cspan class=\"vn\" lang=\"vi\">Có thể tím hoặc ngả xanh; ghi màu thực thấy.\u003c/span>","c":"#5B4FB8"},{"h":"加鹼後\u003cspan class=\"vn\" lang=\"vi\">Sau thêm kiềm\u003c/span>","p":"可能偏藍綠，也可能逐漸變化或降解。\u003cspan class=\"vn\" lang=\"vi\">Có thể ngả xanh lam, xanh lục, rồi tiếp tục đổi hay phân hủy.\u003c/span>","c":"#00B8B8"}]},{"type":"note","title":"","text":"這是顏色趨勢示意，不是通用 pH 色卡。品種、色素組成、濃度、時間與溫度都可能影響結果；不把一個顏色換算成精確 pH。\u003cspan class=\"vn\" lang=\"vi\">Đây là xu hướng màu, không phải bảng pH chung. Giống, thành phần sắc tố, nồng độ, thời gian và nhiệt đều ảnh hưởng; không đổi một màu thành pH chính xác.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.1021/jf501991q\" target=\"_blank\" rel=\"noopener\">紫甘藍品種與色澤研究 / Nghiên cứu giống và màu: 2014 ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 1｜先預測，再看顏色\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 1: Dự đoán rồi xem màu\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"color\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">同批紫甘藍汁分兩杯：A 加水，B 加相同體積的醋。預測哪杯較偏紅；要固定哪些條件？\u003cspan class=\"vn\" lang=\"vi\">Chia cùng dịch bắp cải tím thành hai cốc: A thêm nước, B thêm cùng thể tích giấm. Cốc nào dự đoán đỏ hơn? Cần giữ điều kiện nào?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>我預測＿＿，因為＿＿；兩杯要有相同的＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tôi dự đoán ___ vì ___; hai cốc cần cùng ___.\u003c/span>\u003c/div>\u003clabel for=\"a2-w7-color\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w7-color\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>B 常較偏紅；兩杯原汁量、加入液體體積、觀察時間和光線要相同。\u003cspan class=\"vn\" lang=\"vi\">B thường đỏ hơn; giữ cùng lượng dịch gốc, thể tích thêm, thời gian và ánh sáng.\u003c/span>\u003c/p>\u003cp>可用老師示範或照片記錄實際顏色；一個顏色不代表精確 pH，也不代表是否安全。\u003cspan class=\"vn\" lang=\"vi\">Dùng trình diễn hay ảnh để ghi màu thật; một màu không cho pH chính xác hay độ an toàn.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"肌紅蛋白：分清氧結合與氧化\u003cspan class=\"vn\" lang=\"vi\">Myoglobin: phân biệt gắn oxy và oxy hóa\u003c/span>","cols":4,"items":[{"h":"低氧時\u003cspan class=\"vn\" lang=\"vi\">Khi ít oxy\u003c/span>","p":"去氧肌紅蛋白可呈暗紫紅。\u003cspan class=\"vn\" lang=\"vi\">Deoxymyoglobin có thể tím đỏ sẫm.\u003c/span>","c":"#5B4FB8"},{"h":"接觸氧氣\u003cspan class=\"vn\" lang=\"vi\">Tiếp xúc oxy\u003c/span>","p":"氧合肌紅蛋白可呈鮮紅，不等於已證明安全。\u003cspan class=\"vn\" lang=\"vi\">Oxymyoglobin có thể đỏ tươi, không chứng minh an toàn.\u003c/span>","c":"#D65B5B"},{"h":"鐵被氧化\u003cspan class=\"vn\" lang=\"vi\">Sắt bị oxy hóa\u003c/span>","p":"高鐵肌紅蛋白 metmyoglobin 可呈褐色；不同於單指蛋白質變性。\u003cspan class=\"vn\" lang=\"vi\">Metmyoglobin có thể nâu; khác khái niệm chỉ sự biến tính protein.\u003c/span>","c":"#2D2A6E"},{"h":"醃製與加熱\u003cspan class=\"vn\" lang=\"vi\">Ướp và gia nhiệt\u003c/span>","p":"醃肉可形成亞硝基色素；加熱後形成另一類粉紅色素。\u003cspan class=\"vn\" lang=\"vi\">Thịt ướp có thể tạo sắc tố nitrosyl; khi đun tạo dạng sắc tố hồng khác.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"肉色不能單獨判定腐敗、安全或熟度。還要看保存與處理條件；醃肉配方及添加物須依適用規範，不能靠「多加一點」保安全。\u003cspan class=\"vn\" lang=\"vi\">Không dùng riêng màu để xác định hỏng, an toàn hay độ chín. Cần xét bảo quản, xử lý; công thức thịt ướp và phụ gia phải theo quy định, không tự thêm nhiều để bảo đảm an toàn.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/color-meat-and-poultry\" target=\"_blank\" rel=\"noopener\">肉色與安全 / Màu thịt và an toàn: USDA FSIS ↗\u003c/a>\u003c/p>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.22175/mmb.12473\" target=\"_blank\" rel=\"noopener\">肌紅蛋白與醃肉色素 / Myoglobin và sắc tố thịt ướp: AMSA 2023 ↗\u003c/a>\u003c/p>"}]},{"id":"s2","nav":"二 風味：味覺和嗅覺","kicker":"第二段 · Phần 2","h2":"風味：味覺和嗅覺","lead":"Hương vị: vị giác và khứu giác","blocks":[{"type":"cards","title":"常教的五種基本味\u003cspan class=\"vn\" lang=\"vi\">Năm vị cơ bản thường học\u003c/span>","cols":4,"items":[{"h":"甜、酸\u003cspan class=\"vn\" lang=\"vi\">Ngọt, chua\u003c/span>","p":"糖等可有甜味；有機酸等可帶來酸味。\u003cspan class=\"vn\" lang=\"vi\">Đường có thể ngọt; axit hữu cơ có thể tạo chua.\u003c/span>","c":"#F5A623"},{"h":"鹹、苦\u003cspan class=\"vn\" lang=\"vi\">Mặn, đắng\u003c/span>","p":"食鹽可帶來鹹味；不同苦味物質的感受濃度不同。\u003cspan class=\"vn\" lang=\"vi\">Muối có thể mặn; các chất đắng có ngưỡng cảm nhận khác nhau.\u003c/span>","c":"#5B4FB8"},{"h":"鮮味\u003cspan class=\"vn\" lang=\"vi\">Umami\u003c/span>","p":"麩胺酸可帶來鮮味；不是香氣的另一個名字。\u003cspan class=\"vn\" lang=\"vi\">Glutamate có thể tạo umami; không phải tên khác của mùi thơm.\u003c/span>","c":"#2FA36B"},{"h":"辣與涼\u003cspan class=\"vn\" lang=\"vi\">Cay và mát\u003c/span>","p":"主要是化學感覺，例如刺激、灼熱或清涼。\u003cspan class=\"vn\" lang=\"vi\">Chủ yếu là cảm giác hóa học như kích thích, nóng rát hay mát.\u003c/span>","c":"#D65B5B"}]},{"type":"note","title":"","text":"風味由基本味、香氣、口感與溫度等共同形成。苦味不等於有毒，也不能靠試吃判斷食品安全。\u003cspan class=\"vn\" lang=\"vi\">Hương vị do vị cơ bản, mùi, kết cấu và nhiệt cùng tạo nên. Đắng không đồng nghĩa độc; không nếm để kiểm tra an toàn.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.nidcd.nih.gov/health/taste-disorders\" target=\"_blank\" rel=\"noopener\">感官概念 / Khái niệm cảm giác: NIH NIDCD ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"鼻塞時，少了什麼？\u003cspan class=\"vn\" lang=\"vi\">Nghẹt mũi thì giảm gì?\u003c/span>","cols":2,"items":[{"h":"味覺\u003cspan class=\"vn\" lang=\"vi\">Vị giác\u003c/span>","p":"甜、酸、鹹、苦、鮮等基本味；鼻塞不代表全消失。\u003cspan class=\"vn\" lang=\"vi\">Các vị cơ bản; nghẹt mũi không có nghĩa mất hết.\u003c/span>","c":"#2D2A6E"},{"h":"嗅覺\u003cspan class=\"vn\" lang=\"vi\">Khứu giác\u003c/span>","p":"食物香氣可從鼻前或口腔後方到達嗅覺受器。\u003cspan class=\"vn\" lang=\"vi\">Mùi có thể đến qua phía trước mũi hoặc từ sau miệng.\u003c/span>","c":"#5B4FB8"}]},{"type":"cards","title":"同一杯果汁，溫度與配方會影響香氣\u003cspan class=\"vn\" lang=\"vi\">Cùng ly nước quả: nhiệt và công thức ảnh hưởng mùi\u003c/span>","cols":3,"items":[{"h":"聞到之前\u003cspan class=\"vn\" lang=\"vi\">Trước khi ngửi thấy\u003c/span>","p":"香氣分子要從食品釋放，並到達鼻腔。\u003cspan class=\"vn\" lang=\"vi\">Phân tử mùi cần thoát khỏi thực phẩm và đến mũi.\u003c/span>","c":"#2D2A6E"},{"h":"提高溫度\u003cspan class=\"vn\" lang=\"vi\">Tăng nhiệt\u003c/span>","p":"常會改變揮發與釋放；久放或加熱也可能散失或生成香氣。\u003cspan class=\"vn\" lang=\"vi\">Thường đổi bay hơi, giải phóng; để lâu hay đun cũng có thể mất hoặc tạo mùi.\u003c/span>","c":"#D65B5B"},{"h":"糖、油與食品結構\u003cspan class=\"vn\" lang=\"vi\">Đường, dầu và cấu trúc\u003c/span>","p":"影響不同香氣的分配與釋放，不能一律說油脂讓香氣更強。\u003cspan class=\"vn\" lang=\"vi\">Ảnh hưởng phân bố và giải phóng từng mùi; không nói dầu luôn làm thơm hơn.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"短活動 2｜把風味說清楚\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 2: Mô tả hương vị rõ hơn\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"flavor\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">同學說：「蘋果汁很甜、有蘋果香，也有一點酸。」把三個描述分成基本味與香氣。鼻塞時哪部分常變弱？\u003cspan class=\"vn\" lang=\"vi\">Bạn nói nước táo ngọt, có mùi táo và hơi chua. Xếp ba mô tả thành vị cơ bản và mùi. Khi nghẹt mũi phần nào thường yếu đi?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>＿＿是基本味；＿＿是香氣。鼻塞時＿＿常變弱。\u003cspan class=\"vn\" lang=\"vi\">___ là vị cơ bản; ___ là mùi. Khi nghẹt mũi ___ thường yếu đi.\u003c/span>\u003c/div>\u003clabel for=\"a2-w7-flavor\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w7-flavor\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>甜和酸是基本味；蘋果香是香氣。鼻塞時香氣辨識常變弱，不代表甜酸全消失。\u003cspan class=\"vn\" lang=\"vi\">Ngọt, chua là vị cơ bản; mùi táo là mùi. Nghẹt mũi thường giảm nhận mùi, không có nghĩa mất hết ngọt chua.\u003c/span>\u003c/p>\u003cp>風味不只由舌頭或鼻子單獨決定；不必安排試吃也能做分類。\u003cspan class=\"vn\" lang=\"vi\">Hương vị không chỉ do riêng lưỡi hay mũi; có thể phân loại mà không cần nếm.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"}]},{"id":"s3","nav":"三 酵素：有用，也有…","kicker":"第三段 · Phần 3","h2":"酵素：有用，也有麻煩","lead":"Enzyme: có ích, cũng gây rắc rối","blocks":[{"type":"cards","title":"酵素：看目標，再決定用或抑制\u003cspan class=\"vn\" lang=\"vi\">Enzyme: xem mục tiêu rồi dùng hay hạn chế\u003c/span>","cols":4,"items":[{"h":"澱粉酶\u003cspan class=\"vn\" lang=\"vi\">Amylase\u003c/span>","p":"水解澱粉，依種類生成糊精與糖。\u003cspan class=\"vn\" lang=\"vi\">Thủy phân tinh bột, tạo dextrin và đường tùy loại.\u003c/span>","c":"#F5A623"},{"h":"蛋白酶\u003cspan class=\"vn\" lang=\"vi\">Protease\u003c/span>","p":"切開蛋白質；可用於嫩化等加工。\u003cspan class=\"vn\" lang=\"vi\">Cắt protein; có thể dùng làm mềm thịt.\u003c/span>","c":"#D65B5B"},{"h":"果膠酶\u003cspan class=\"vn\" lang=\"vi\">Pectinase\u003c/span>","p":"分解果膠，可協助榨汁或澄清；混濁果汁未必以澄清為目標。\u003cspan class=\"vn\" lang=\"vi\">Phân giải pectin, giúp ép hay làm trong; nước quả đục không luôn cần làm trong.\u003c/span>","c":"#2FA36B"},{"h":"脂解酶\u003cspan class=\"vn\" lang=\"vi\">Lipase\u003c/span>","p":"水解油脂；可用於風味形成，也可能造成水解酸敗。\u003cspan class=\"vn\" lang=\"vi\">Thủy phân chất béo; có thể tạo hương hoặc gây ôi thủy phân.\u003c/span>","c":"#5B4FB8"}]},{"type":"note","title":"","text":"食品常用酵素多是蛋白質。活性受溫度、時間、pH 與食品環境影響；加熱不一定立刻失活，溫度尚未使它失活時，反應也可能加快。\u003cspan class=\"vn\" lang=\"vi\">Enzyme thường dùng trong thực phẩm phần lớn là protein. Hoạt tính tùy nhiệt, thời gian, pH và môi trường; đun không luôn bất hoạt ngay, trước khi bất hoạt phản ứng có thể nhanh hơn.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/30347443/\" target=\"_blank\" rel=\"noopener\">蘋果汁酵素澄清研究 / Nghiên cứu làm trong nước táo: 2018 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"減緩蘋果褐變：看條件與代價\u003cspan class=\"vn\" lang=\"vi\">Làm chậm táo hóa nâu: xem điều kiện và đánh đổi\u003c/span>","cols":4,"items":[{"h":"降 pH\u003cspan class=\"vn\" lang=\"vi\">Giảm pH\u003c/span>","p":"酸可能降低 PPO 活性；程度依來源與條件而異。\u003cspan class=\"vn\" lang=\"vi\">Axit có thể giảm PPO; mức tùy nguồn và điều kiện.\u003c/span>","c":"#2FA36B"},{"h":"減少氧接觸\u003cspan class=\"vn\" lang=\"vi\">Giảm tiếp xúc oxy\u003c/span>","p":"覆蓋或適當包裝可減緩；泡水不等於完全無氧。\u003cspan class=\"vn\" lang=\"vi\">Che phủ, bao bì thích hợp có thể làm chậm; ngâm nước không bằng hết oxy.\u003c/span>","c":"#00B8B8"},{"h":"抗壞血酸\u003cspan class=\"vn\" lang=\"vi\">Axit ascorbic\u003c/span>","p":"可還原醌；消耗後仍可能再褐變。\u003cspan class=\"vn\" lang=\"vi\">Có thể khử quinone; khi cạn vẫn có thể nâu lại.\u003c/span>","c":"#5B4FB8"},{"h":"加熱或低溫\u003cspan class=\"vn\" lang=\"vi\">Gia nhiệt hoặc làm lạnh\u003c/span>","p":"足夠熱處理可鈍化 PPO，但影響質地；低溫多是減慢。\u003cspan class=\"vn\" lang=\"vi\">Nhiệt đủ có thể bất hoạt PPO nhưng đổi kết cấu; lạnh chủ yếu làm chậm.\u003c/span>","c":"#D65B5B"}]},{"type":"note","title":"","text":"PPO 可催化酚類氧化成醌，後續反應形成褐色物質。控制效果須看品種、處理與觀察時間；減少褐變不等於已完成殺菌。\u003cspan class=\"vn\" lang=\"vi\">PPO có thể xúc tác phenol thành quinone, rồi phản ứng tiếp tạo chất nâu. Hiệu quả tùy giống, xử lý và thời gian; giảm nâu không chứng minh đã diệt khuẩn.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/31936660/\" target=\"_blank\" rel=\"noopener\">蘋果切片處理研究 / Nghiên cứu lát táo: 2019 ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 3｜設計蘋果切片對照\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 3: Thiết kế đối chứng lát táo\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"browning\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">同一顆蘋果切兩片：A 加水，B 加相同體積檸檬汁，同時觀察。若 B 較少褐變，能說已殺菌嗎？\u003cspan class=\"vn\" lang=\"vi\">Cắt hai lát cùng quả táo: A thêm nước, B cùng thể tích nước chanh; quan sát cùng lúc. B ít nâu hơn có chứng minh diệt khuẩn không?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>我觀察到＿＿；可能因為＿＿。還不能說＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tôi thấy ___; có thể vì ___. Chưa thể nói ___.\u003c/span>\u003c/div>\u003clabel for=\"a2-w7-browning\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"a2-w7-browning\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>若 B 較少褐變，可能和酸、還原成分等有關；不能因此說已殺菌或可在常溫放更久。\u003cspan class=\"vn\" lang=\"vi\">Nếu B ít nâu hơn, có thể do axit, chất khử; chưa chứng minh diệt khuẩn hay để nhiệt độ phòng lâu hơn.\u003c/span>\u003c/p>\u003cp>固定厚度、處理量、時間與溫度；檸檬汁同時改變多個成分，不能只歸因一種機制。\u003cspan class=\"vn\" lang=\"vi\">Giữ cùng độ dày, lượng xử lý, thời gian, nhiệt; nước chanh đổi nhiều thành phần, không quy hết cho một cơ chế.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"殺菁與冷凍，各自做什麼？\u003cspan class=\"vn\" lang=\"vi\">Chần và đông lạnh làm gì?\u003c/span>","cols":3,"items":[{"h":"殺菁\u003cspan class=\"vn\" lang=\"vi\">Chần\u003c/span>","p":"多數冷凍蔬菜用來鈍化酵素；時間依食材、大小與方法。\u003cspan class=\"vn\" lang=\"vi\">Nhiều rau đông lạnh được chần để bất hoạt enzyme; thời gian tùy rau, cỡ và cách.\u003c/span>","c":"#2D2A6E"},{"h":"微生物\u003cspan class=\"vn\" lang=\"vi\">Vi sinh vật\u003c/span>","p":"殺菁可減少部分微生物，但不是完整的滅菌程序。\u003cspan class=\"vn\" lang=\"vi\">Chần có thể giảm một phần vi sinh vật, không phải quy trình tiệt trùng.\u003c/span>","c":"#D65B5B"},{"h":"冷凍\u003cspan class=\"vn\" lang=\"vi\">Đông lạnh\u003c/span>","p":"抑制微生物生長，未必殺死它們；部分酵素反應仍可能慢慢進行。\u003cspan class=\"vn\" lang=\"vi\">Ức chế phát triển vi sinh vật, không chắc giết chúng; vài phản ứng enzyme vẫn có thể chậm tiếp.\u003c/span>","c":"#00B8B8"}]},{"type":"note","title":"","text":"過短可能不足以鈍化酵素，過長則可能損失色澤、質地與營養。冷凍蔬菜要依產品及後續烹調說明處理，不把一個秒數套用全部。\u003cspan class=\"vn\" lang=\"vi\">Quá ngắn có thể chưa bất hoạt enzyme, quá lâu có thể mất màu, kết cấu, dinh dưỡng. Làm theo hướng dẫn sản phẩm và nấu tiếp, không dùng một thời gian cho mọi loại.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://nchfp.uga.edu/how/freeze/freeze-general-information/blanching-vegetables/\" target=\"_blank\" rel=\"noopener\">殺菁用途與條件 / Mục đích và điều kiện: UGA NCHFP ↗\u003c/a>\u003c/p>"}]},{"id":"sum","nav":"重點 Điểm chính","kicker":"今天的重點 · Điểm chính hôm nay","h2":"今天的重點","lead":"Điểm chính hôm nay","blocks":[{"type":"cards","title":"回顧\u003cspan class=\"vn\" lang=\"vi\">Ôn tập\u003c/span>","cols":2,"items":[{"h":"顏色可提供線索，不能單獨判斷安全\u003cspan class=\"vn\" lang=\"vi\">Màu cung cấp gợi ý, không tự xác định an toàn\u003c/span>"},{"h":"風味同時有基本味、香氣與口感\u003cspan class=\"vn\" lang=\"vi\">Hương vị có vị cơ bản, mùi và cảm giác miệng\u003c/span>"},{"h":"控制褐變要看 PPO、酚、氧及條件\u003cspan class=\"vn\" lang=\"vi\">Kiểm soát hóa nâu xét PPO, phenol, oxy và điều kiện\u003c/span>"},{"h":"殺菁以鈍化酵素為主，不能當作完整滅菌\u003cspan class=\"vn\" lang=\"vi\">Chần chủ yếu bất hoạt enzyme, không thay tiệt trùng\u003c/span>"}]},{"type":"note","title":"","text":"回家：用蘋果汁說明一個「觀察→推測→待查資料」。\u003cspan class=\"vn\" lang=\"vi\">Về nhà: dùng nước táo nói một quan sát, suy luận và dữ liệu còn cần.\u003c/span>"}]},{"id":"quiz","nav":"練習 Luyện tập","kicker":"練習 · Luyện tập","h2":"課後練習 10 題","lead":"10 題核心檢核；看原因，再練習說中文。10 câu cốt lõi; đọc lý do rồi tập nói tiếng Trung.","blocks":[{"type":"quiz","items":[{"q":"「anthocyanin」的中文是？\u003cspan class=\"vn\" lang=\"vi\">Anthocyanin tiếng Trung là gì?\u003c/span>","o":["花青素 huāqīngsù","葉綠素 yèlǜsù","肌紅蛋白 jīhóng dànbái","類胡蘿蔔素 Carotenoid"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 花青素是色素類別之一；紫甘藍汁可示範它受 pH 影響的色澤，但不是通用 pH 色卡。\u003cspan class=\"vn\" lang=\"vi\">Anthocyanin là nhóm sắc tố; nước bắp cải tím minh họa màu tùy pH, không phải bảng pH chung.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：花青素的顏色會受 pH 影響。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Màu anthocyanin tùy pH.\u003c/span>\u003c/div>"},{"q":"真空牛肉由暗紫紅轉鮮紅，較可能因為？\u003cspan class=\"vn\" lang=\"vi\">Thịt bò chân không chuyển tím đỏ sang đỏ tươi có thể do?\u003c/span>","o":["PPO 生成褐色 PPO tạo nâu","中心鎂被拿走 Mg trung tâm bị bỏ","蛋白酶切開肌紅蛋白 Protease cắt myoglobin","肌紅蛋白與氧結合 Myoglobin gắn oxy"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 氧合肌紅蛋白可呈鮮紅；高鐵肌紅蛋白可呈褐色。氧結合、鐵氧化與蛋白質變性要分開，肉色也不能單獨證明安全。\u003cspan class=\"vn\" lang=\"vi\">Oxymyoglobin có thể đỏ tươi, metmyoglobin nâu. Phân biệt gắn oxy, oxy hóa sắt và biến tính; màu riêng không chứng minh an toàn.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：肉變紅，可能和氧結合有關。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Thịt đỏ lên có thể liên quan gắn oxy.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/color-meat-and-poultry\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"「fēngwèi」是哪個詞？\u003cspan class=\"vn\" lang=\"vi\">fēngwèi là từ nào?\u003c/span>","o":["色素 sắc tố","味覺 vị giác","風味 hương vị","酵素 enzyme"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 風味包含基本味、香氣與口感等，不能把甜與蘋果香當成同一種感覺。\u003cspan class=\"vn\" lang=\"vi\">Hương vị gồm vị, mùi và cảm giác miệng; ngọt và mùi táo không cùng cảm giác.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：甜是基本味，蘋果香是香氣。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Ngọt là vị cơ bản, mùi táo là mùi.\u003c/span>\u003c/div>"},{"q":"紫甘藍汁加醋後較偏紅，較適合的解釋是？\u003cspan class=\"vn\" lang=\"vi\">Nước bắp cải tím thêm giấm đỏ hơn, giải thích nào phù hợp?\u003c/span>","o":["pH 改變了色素狀態 pH đổi trạng thái sắc tố","果膠酶增加糖 Pectinase tăng đường","脂解酶製造紅色 Lipase tạo đỏ","肌紅蛋白結合氧 Myoglobin gắn oxy"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 花青素色澤可隨 pH 改變，還受品種、濃度與時間影響；一個顏色不能給出精確 pH。\u003cspan class=\"vn\" lang=\"vi\">Màu anthocyanin đổi theo pH, giống, nồng độ, thời gian; một màu không cho pH chính xác.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：加醋改變 pH，所以顏色可能改變。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Giấm đổi pH nên màu có thể đổi.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.1021/jf501991q\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"想比較胡蘿蔔加工後的營養，哪句較恰當？\u003cspan class=\"vn\" lang=\"vi\">So dinh dưỡng cà rốt sau chế biến, câu nào phù hợp?\u003c/span>","o":["只要顏色沒變就完全沒損失 Không đổi màu là không mất chất","釋出、保留與吸收要分開看 Xét riêng giải phóng, giữ lại và hấp thu","油越多吸收一定越多 Càng nhiều dầu càng hấp thu","所有類胡蘿蔔素都不怕熱 Mọi carotenoid không sợ nhiệt"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 加工可能幫助釋出，也可能損失；吸收還看餐食與個人條件。不能由脂溶性推出永遠耐熱或加油越多越好。\u003cspan class=\"vn\" lang=\"vi\">Chế biến có thể giải phóng hoặc gây mất; hấp thu tùy bữa và cá nhân. Tan trong béo không bằng luôn bền nhiệt hay càng dầu càng tốt.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：保留量和吸收量，是不同問題。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Lượng giữ và lượng hấp thu là khác nhau.\u003c/span>\u003c/div>"},{"q":"鼻塞時蘋果香變弱，但仍覺得甜酸，較可能是？\u003cspan class=\"vn\" lang=\"vi\">Nghẹt mũi giảm mùi táo nhưng vẫn ngọt chua, có thể do?\u003c/span>","o":["甜味全部來自鼻子 Vị ngọt hoàn toàn từ mũi","果汁一定變質 Nước quả chắc hỏng","所有味覺都消失 Mất mọi vị giác","嗅覺受影響，基本味仍可感受 Khứu giác giảm, vẫn cảm được vị cơ bản"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 香氣辨識與基本味不同。鼻塞可減少香氣到達嗅覺受器，不能因此說味覺全消失。\u003cspan class=\"vn\" lang=\"vi\">Nhận mùi khác vị cơ bản; nghẹt mũi giảm mùi đến thụ thể, không chứng minh mất mọi vị giác.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：香氣變弱，不代表甜酸全消失。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Mùi yếu đi không bằng mất hết ngọt chua.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.nidcd.nih.gov/health/taste-disorders\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"想讓某種蘋果汁更澄清，哪種酵素較相關？\u003cspan class=\"vn\" lang=\"vi\">Muốn một loại nước táo trong hơn, enzyme nào liên quan?\u003c/span>","o":["脂解酶 Lipase","蛋白酶 Protease","果膠酶 Pectinase","PPO"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 果膠酶分解果膠，可幫助澄清；是否需要更清，仍取決於產品目標。PPO 主要是本課切面褐變的角色。\u003cspan class=\"vn\" lang=\"vi\">Pectinase phân giải pectin giúp làm trong; có cần trong hay không tùy sản phẩm. PPO liên quan hóa nâu mặt cắt trong bài.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：要澄清果汁，可考慮果膠酶。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Có thể dùng pectinase để làm trong nước quả.\u003c/span>\u003c/div>"},{"q":"蘋果切面在空氣中變褐，主要涉及？\u003cspan class=\"vn\" lang=\"vi\">Mặt táo cắt hóa nâu trong không khí chủ yếu liên quan?\u003c/span>","o":["PPO、酚類與氧 PPO, phenol và oxy","只有糖受熱 Chỉ đường và nhiệt","只有澱粉吸水 Chỉ tinh bột hút nước","甘油與脂肪酸 Glycerol và axit béo"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> PPO 催化酚類生成醌，後續反應形成褐色物質；不必先加熱，與焦糖化和梅納反應不同。\u003cspan class=\"vn\" lang=\"vi\">PPO tạo quinone từ phenol rồi phản ứng tiếp thành chất nâu; không cần đun trước, khác caramel hóa và Maillard.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：這個切面褐變與 PPO 有關。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Hóa nâu mặt cắt này liên quan PPO.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/34730855/\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"檸檬處理的蘋果較少褐變，可以直接得出哪個結論？\u003cspan class=\"vn\" lang=\"vi\">Táo xử lý chanh ít nâu hơn, kết luận trực tiếp nào phù hợp?\u003c/span>","o":["所有細菌都死了 Mọi vi khuẩn đã chết","可在常溫多放幾天 Để phòng thêm vài ngày","PPO 永遠完全停止 PPO ngừng vĩnh viễn","此條件下褐變較少，但安全仍需另評估 Ít nâu trong điều kiện này; an toàn cần đánh giá riêng"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 檸檬可能同時改變 pH 與還原條件；顏色觀察不能取代微生物或保存驗證。\u003cspan class=\"vn\" lang=\"vi\">Chanh có thể đổi pH và điều kiện khử; quan sát màu không thay kiểm tra vi sinh hay bảo quản.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：較少褐變，不代表已殺菌。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Ít nâu không chứng minh đã diệt khuẩn.\u003c/span>\u003c/div>"},{"q":"多數蔬菜冷凍前殺菁，主要是為了？\u003cspan class=\"vn\" lang=\"vi\">Chần nhiều loại rau trước đông lạnh chủ yếu để?\u003c/span>","o":["讓水活性永久歸零 Cho aw về 0 mãi","鈍化酵素，減少後續品質變化 Bất hoạt enzyme, giảm đổi chất lượng","保證殺死所有微生物 Bảo đảm giết mọi vi sinh vật","讓所有維生素增加 Tăng mọi vitamin"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 時間要依食材和大小選擇；殺菁可減少部分微生物，但不是完整滅菌，冷凍也不保證殺死微生物。\u003cspan class=\"vn\" lang=\"vi\">Chọn thời gian theo loại và cỡ; chần giảm vài vi sinh vật, không tiệt trùng; đông lạnh không bảo đảm giết chúng.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：殺菁主要鈍化酵素，不能當作完整滅菌。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Chần chủ yếu bất hoạt enzyme, không thay tiệt trùng.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://nchfp.uga.edu/how/freeze/freeze-general-information/blanching-vegetables/\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"}]}]}],"a2":true,"track":{"url":"https://qmldcjkllisvfgegkfsz.supabase.co","key":"sb_publishable_xprm7A1B-hQhAMBIMaWOWw_w617svI1"}};</script>
<script>
/*
 * runtime.client.js — 跑在瀏覽器裡的渲染器（17 週共用，逐字內嵌進每份 HTML）
 * 讀 window.__LESSON__ 的資料，把 modules / blocks 畫出來。
 * 互動行為（翻卡、展開、配對、測驗）沿用週1 手寫版的做法，不要另創一套。
 */
(function () {
  var D = window.__LESSON__;
  var SERIES = D.series;
  var $ = function (s) { return document.querySelector(s); };
  // 國合班 A2 版（D.a2）：介面文字加越南文；一般班 U() 只回中文，畫面與原本完全相同
  var A2 = !!D.a2;
  function U(zh, vn) { return A2 ? zh + " " + vn : zh; }

  /* ---------- 學習歷程記錄（Supabase） ----------
     只在 lesson.js 注入 D.track = {url, key} 的週次啟用（lib/tracking.json 的 weeks）；
     其他週 TRACK.on 為 false，send() 是空函式，教材行為完全不變。
     只送「學號代碼」與互動事件，不送姓名。送失敗就丟掉，不重試、不阻擋教材。 */
  var CTX = { mod: null, bi: 0 };   // 目前正在渲染的模組 id 與區塊序號（render 是同步的）
  var TRACK = (function () {
    var cfg = D.track;
    var noop = function () {};
    if (!cfg || !cfg.url || !cfg.key) return { on: false, send: noop, flush: noop, code: function () { return ""; }, setCode: noop };
    var KEY = "ifs_code", DKEY = "ifs_device";
    var rnd = function () { return Math.random().toString(36).slice(2, 10); };
    var sid = rnd() + Date.now().toString(36);
    // device_id：同一支手機／瀏覽器跨次開頁不變。學生後來才填學號代碼時，先前的 anon 事件可靠它回接。
    var did = "";
    try { did = localStorage.getItem(DKEY) || ""; if (!did) { did = "d" + rnd() + rnd(); localStorage.setItem(DKEY, did); } } catch (e) { did = "d" + rnd(); }
    var q = [], timer = null;
    function code() { try { return (localStorage.getItem(KEY) || "").trim(); } catch (e) { return ""; } }
    function setCode(v) { try { localStorage.setItem(KEY, (v || "").trim().slice(0, 20)); } catch (e) {} }
    function cut(s, n) { return s == null ? null : String(s).slice(0, n); }
    // 欄位長度與 payload 大小在前端先截到資料表 CHECK 的上限：PostgREST 批次 INSERT 是原子的，
    // 一筆違反 CHECK 整批都會被拒，而我們失敗即丟，會靜默掉整個 4 秒窗口。
    function send(event, mod, block, payload) {
      var p = payload || {};
      var ps = JSON.stringify(p);
      if (ps.length > 1800) p = { trunc: true, keys: Object.keys(p).slice(0, 10) };
      q.push({
        student_code: cut(code(), 20) || "anon", device_id: cut(did, 40), week: D.week || 0,
        module_id: cut(mod, 30), block_type: cut(block, 10), event: cut(event, 30),
        payload: p, session_id: cut(sid, 40), build: cut(D.build, 16), client_ts: new Date().toISOString(),
        cls: A2 ? "a2" : undefined,   // 國合班與一般班同週分開；一般班不送這欄（JSON 會略過 undefined）
      });
      if (q.length >= 40) flush();
      else if (!timer) timer = setTimeout(flush, 4000);
    }
    function flush() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!q.length) return;
      var body = JSON.stringify(q.splice(0, 50));
      try {
        fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/ifs_lesson_events", {
          method: "POST", keepalive: true, body: body,
          headers: { "Content-Type": "application/json", "apikey": cfg.key, "Prefer": "return=minimal" },
        }).catch(noop);
      } catch (e) { /* 舊瀏覽器沒有 fetch：不記錄 */ }
      if (q.length) timer = setTimeout(flush, 1000);
    }
    window.addEventListener("pagehide", flush);
    return { on: true, send: send, flush: flush, code: code, setCode: setCode };
  })();

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function colorAt(given, i) { return given || SERIES[i % SERIES.length]; }
  function gridCls(n) { return "grid g" + (n === 2 || n === 3 || n === 4 ? n : 3); }
  function listHtml(v) {
    // body 可以是字串或字串陣列；陣列渲染成 <ul>
    if (v == null) return "";
    if (typeof v === "string") return '<p>' + v + '</p>';
    return '<ul>' + v.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
  }

  /* ---------- 區塊標題 ---------- */
  function heading(frag, b) {
    if (b.title) frag.appendChild(el("div", "sec-title", '<span class="bar"></span>' + b.title));
    if (b.hint) frag.appendChild(el("div", "hint", b.hint));
  }

  /* ---------- 各區塊 ---------- */
  var BLOCKS = {};

  BLOCKS.flips = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (d, i) {
      var c = colorAt(d.c, i);
      var card = el("div", "flip");
      if (b.h) card.style.height = b.h + "px";
      card.innerHTML =
        '<div class="flip-in">' +
        '<div class="face front"><div class="cbar" style="background:' + c + '"></div>' +
        '<div class="t">' + d.t + '</div><div class="en">' + (d.en || "") + '</div>' +
        '<div class="tap">▸ ' + U("點我看解釋", "Chạm để xem") + '</div></div>' +
        '<div class="face back"><div class="cbar" style="background:' + c + '"></div>' +
        '<p>' + d.b + '</p></div></div>';
      var mod = CTX.mod, bi = CTX.bi;
      card.onclick = function () {
        if (card.classList.toggle("on")) TRACK.send("flip_open", mod, "flips", { b: bi, i: i, t: d.t });
      };
      g.appendChild(card);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.exp = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div");
    b.items.forEach(function (t, i) {
      var box = el("div", "exp");
      var res = t.res ? '<div style="margin-top:10px;font-size:13px;color:var(--secondary);font-weight:700">🔗 ' + t.res + '</div>' : "";
      box.innerHTML =
        '<button><span class="num">' + (i + 1) + '</span><span>' + t.h + '</span>' +
        '<span class="tag">' + (t.tag || "") + '</span><span class="chev">›</span></button>' +
        '<div class="body">' + listHtml(t.body) + res + '</div>';
      var body = box.querySelector(".body");
      var mod = CTX.mod, bi = CTX.bi;
      box.querySelector("button").onclick = function () {
        var on = box.classList.toggle("on");
        if (!on) { body.style.maxHeight = "0px"; return; }
        TRACK.send("exp_open", mod, "exp", { b: bi, i: i, h: t.h });
        // 用實際內容高度展開，避免長段落被固定 max-height 截掉。
        // 必須先解除 max-height 再量：在 max-height:0 的狀態下量 scrollHeight 會得到 0，
        // 面板就只會開一條縫（實測過）。量完歸零並強制重排，transition 才有起點。
        body.style.maxHeight = "none";
        var h = body.scrollHeight;
        body.style.maxHeight = "0px";
        void body.offsetHeight;
        body.style.maxHeight = h + "px";
      };
      host.appendChild(box);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.cards = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var box = el("div", "card");
      box.style.borderTop = "4px solid " + accent;
      box.innerHTML = '<div class="h">' + c.h + '</div>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        (c.li ? '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>' : "") +
        (c.p ? '<p style="margin-top:8px;font-size:15.5px;color:var(--mid)">' + c.p + '</p>' : "");
      g.appendChild(box);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.timeline = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "tl");
    b.steps.forEach(function (s, i) {
      var st = el("div", "step");
      st.innerHTML = '<div class="dot" style="background:' + colorAt(s.c, i) + '">' + (i + 1) + '</div>' +
        '<h4>' + s.h + '</h4><p>' + s.p + '</p>';
      host.appendChild(st);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.compare = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "cmp");
    [b.left, b.right].forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var col = el("div", "col");
      col.innerHTML = '<div class="cbar" style="background:' + accent + '"></div>' +
        '<h4 style="color:' + accent + '">' + c.h + '</h4>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
      wrap.appendChild(col);
    });
    f.appendChild(wrap);
    if (b.note) f.appendChild(el("div", "cmp-note", b.note));
    return f;
  };

  BLOCKS.table = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "tblwrap");
    var html = '<table class="tbl"><thead><tr>' +
      b.head.map(function (h) { return '<th>' + h + '</th>'; }).join("") + '</tr></thead><tbody>' +
      b.rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join("") + '</tr>';
      }).join("") + '</tbody></table>';
    wrap.innerHTML = html;
    f.appendChild(wrap); return f;
  };

  BLOCKS.note = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    f.appendChild(el("div", "note" + (b.kind ? " " + b.kind : ""), b.text));
    return f;
  };

  BLOCKS.match = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "match-wrap");
    var pool = el("div", "pool"), targets = el("div", "targets");
    var pairs = b.pairs;
    var order = pairs.slice().sort(function () { return Math.random() - 0.5; });
    var selected = null, solved = 0, errors = 0, t0 = null;
    var mod = CTX.mod, bi = CTX.bi;
    var msg = el("div");
    msg.style.cssText = "margin-top:14px;font-weight:700;color:var(--green)";

    function tryMatch(slot, key) {
      if (slot.classList.contains("ok")) return;
      if (t0 === null) t0 = Date.now();
      if (slot.dataset.k === key) {
        slot.classList.add("ok"); slot.classList.remove("bad");
        slot.querySelector(".drop").textContent = key;
        var chip = pool.querySelector('.chip[data-k="' + key + '"]');
        chip.classList.add("used"); chip.classList.remove("sel");
        selected = null; solved++;
        TRACK.send("match_ok", mod, "match", { b: bi, label: key });
        if (solved === pairs.length) {
          msg.textContent = b.done || U("✓ 全部答對！", "Đúng hết!");
          TRACK.send("match_done", mod, "match", { b: bi, n: pairs.length, errors: errors, ms: Date.now() - t0 });
        }
      } else {
        errors++;
        TRACK.send("match_bad", mod, "match", { b: bi, label: key, slot: slot.dataset.k });
        slot.classList.add("bad");
        setTimeout(function () { slot.classList.remove("bad"); }, 350);
      }
    }
    order.forEach(function (q) {
      var c = el("div", "chip"); c.textContent = q.label; c.draggable = true; c.dataset.k = q.label;
      c.addEventListener("dragstart", function (e) { e.dataTransfer.setData("k", q.label); });
      c.onclick = function () {
        if (c.classList.contains("used")) return;
        if (selected === c) { c.classList.remove("sel"); selected = null; return; }
        pool.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("sel"); });
        c.classList.add("sel"); selected = c;
      };
      pool.appendChild(c);
    });
    pairs.forEach(function (q) {
      var s = el("div", "slot"); s.dataset.k = q.label;
      s.innerHTML = '<div class="drop">' + U("拖到這裡", "Kéo vào đây") + '</div><div class="desc">' + q.desc + '</div>';
      s.addEventListener("dragover", function (e) { e.preventDefault(); });
      s.addEventListener("drop", function (e) { e.preventDefault(); tryMatch(s, e.dataTransfer.getData("k")); });
      s.onclick = function () { if (selected) tryMatch(s, selected.dataset.k); };
      targets.appendChild(s);
    });
    host.appendChild(pool); host.appendChild(targets); host.appendChild(msg);
    f.appendChild(host); return f;
  };

  /* 結果代碼：把作答結果編成一串可貼給老師的代碼（FSQ1.<base64>.<檢查碼>）。
     解碼與彙整用專案根目錄的「食品科學概論_測驗成績解碼器.html」。 */
  function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
  function checksum(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1679616; // 36^4
    return h.toString(36);
  }

  BLOCKS.quiz = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var items = b.items, n = items.length;
    var head = el("div", "quiz-head");
    head.innerHTML =
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
      '<input class="qid" placeholder="' + U("學號（交成績必填）", "Mã số SV") + '" style="flex:1;min-width:130px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px">' +
      '<input class="qname" placeholder="' + U("姓名", "Họ tên") + '" style="flex:1;min-width:100px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px"></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
      '<strong class="qprog">' + U("進度", "Tiến độ") + ' 0 / ' + n + '</strong>' +
      '<span class="qscore" style="color:var(--secondary);font-weight:800">' + U("得分", "Điểm") + ' 0</span></div>' +
      '<div class="pbar"><div class="pfill"></div></div>';
    var box = el("div");
    var sb = el("div", "scorebox");
    sb.innerHTML = '<div>' + U("你的成績", "Điểm của bạn") + '</div><div class="big"><span class="fscore">0</span> / ' + n + '</div>' +
      '<div class="smsg" style="margin:8px 0 16px"></div>' +
      '<div class="rcwrap" style="margin:0 auto 16px;max-width:560px;text-align:left">' +
      '<div style="font-weight:700;margin-bottom:6px">' + U("結果代碼（請複製後，貼到老師指定的表單或訊息）", "— Mã kết quả: sao chép và gửi cho thầy/cô") + '</div>' +
      '<textarea class="rcode" readonly rows="3" style="width:100%;box-sizing:border-box;font-family:monospace;font-size:12px;padding:8px;border:1.5px solid var(--line,#ccc);border-radius:8px;resize:none"></textarea>' +
      '<div class="rmsg" style="font-size:13px;color:#B34700;margin-top:4px"></div>' +
      '<button class="btn copyrc" style="margin-top:8px">📋 ' + U("複製結果代碼", "Sao chép mã") + '</button></div>' +
      '<button class="btn ghost">' + U("重新測驗", "Làm lại") + '</button>';

    var answered = 0, score = 0, picks = [], qt0 = null, attempt = 0;
    var mod = CTX.mod, bi = CTX.bi;
    // 測驗的學號欄與頁首的學號代碼同步（兩邊填任一邊都行）
    var qidInput = head.querySelector(".qid");
    if (TRACK.on) {
      if (TRACK.code()) qidInput.value = TRACK.code();
      qidInput.addEventListener("change", function () {
        TRACK.setCode(qidInput.value);
        var top = $("#ifs-code"); if (top) top.value = TRACK.code();
      });
    }
    function updateProg() {
      head.querySelector(".qprog").textContent = U("進度", "Tiến độ") + " " + answered + " / " + n;
      head.querySelector(".qscore").textContent = U("得分", "Điểm") + " " + score;
      head.querySelector(".pfill").style.width = (answered / n * 100) + "%";
    }
    function finish() {
      sb.querySelector(".fscore").textContent = score;
      var pct = score / n, m;
      if (score === n) m = U("本次全對！再用自己的話說明蘋果汁的顏色、風味與酵素。", "Đúng hết lần này! Hãy giải thích tình huống bằng lời của mình.");
      else if (pct >= 0.8) m = U("很棒！觀念相當扎實。", "Rất tốt!");
      else if (pct >= 0.6) m = U("不錯，再複習幾個弱點就更好。", "Khá tốt, ôn lại vài chỗ nữa nhé.");
      else m = U("建議回到前面單元再看一次翻卡與展開內容。", "Hãy xem lại các phần phía trước.");
      sb.querySelector(".smsg").textContent = m;

      var sid = head.querySelector(".qid").value.trim();
      var sname = head.querySelector(".qname").value.trim();
      var korr = items.map(function (item, i) { return picks[i] === item.a ? 1 : 0; }).join("");
      var payload = JSON.stringify({
        w: D.week || 0, c: A2 ? "a2" : undefined, id: sid, nm: sname, s: score, n: n,
        a: picks, k: korr, t: new Date().toISOString().slice(0, 16),
      });
      var body = b64utf8(payload);
      var code = "FSQ1." + body + "." + checksum(body);
      sb.querySelector(".rcode").value = code;
      sb.querySelector(".rmsg").textContent = sid ? "" : U("⚠ 尚未填學號 —— 請回到測驗上方填入學號後重新測驗，否則老師無法登記成績。", "Chưa nhập mã số SV: hãy nhập ở trên rồi làm lại.");
      TRACK.send("quiz_done", mod, "quiz", { b: bi, attempt: attempt, score: score, n: n, picks: picks, ms: qt0 ? Date.now() - qt0 : null });
      TRACK.flush();

      sb.classList.add("show");
      sb.scrollIntoView({ behavior: "smooth" });
    }
    function pick(qel, item, oi) {
      if (qel.dataset.done === "1") return;
      qel.dataset.done = "1"; answered++;
      if (qt0 === null) qt0 = Date.now();
      picks[parseInt(qel.dataset.qi, 10)] = oi;
      TRACK.send("quiz_answer", mod, "quiz", { b: bi, attempt: attempt, qi: parseInt(qel.dataset.qi, 10), pick: oi, ok: oi === item.a });
      qel.querySelectorAll(".opt").forEach(function (btn, i) {
        btn.classList.add("dim");
        if (i === item.a) btn.classList.add("correct");
        if (i === oi && oi !== item.a) btn.classList.add("wrong");
      });
      var fb = qel.querySelector(".fb");
      if (oi === item.a) { score++; fb.classList.add("good"); fb.innerHTML = U("✓ 正確！", "Đúng!") + item.e; }
      else { fb.classList.add("no"); fb.innerHTML = U("✗ 正解：", "Sai. Đáp án:") + item.o[item.a] + "。" + item.e; }
      fb.classList.add("show"); updateProg();
      if (answered === n) finish();
    }
    function build() {
      box.innerHTML = ""; answered = 0; score = 0; picks = []; qt0 = null; attempt++; updateProg();
      sb.classList.remove("show");
      items.forEach(function (item, qi) {
        var qel = el("div", "q"); qel.dataset.done = "0"; qel.dataset.qi = qi;
        qel.innerHTML = '<div class="qn">第 ' + (qi + 1) + ' 題' + (A2 ? ' · Câu ' + (qi + 1) : '') + '</div><div class="qt">' + item.q + '</div>';
        item.o.forEach(function (opt, oi) {
          var btn = el("button", "opt"); btn.textContent = opt;
          btn.onclick = function () { pick(qel, item, oi); };
          qel.appendChild(btn);
        });
        qel.appendChild(el("div", "fb"));
        box.appendChild(qel);
      });
    }
    sb.querySelector(".copyrc").onclick = function () {
      var ta = sb.querySelector(".rcode");
      ta.select(); ta.setSelectionRange(0, 99999);
      var btn = this;
      function ok() { btn.textContent = U("✓ 已複製，請貼給老師", "Đã sao chép"); setTimeout(function () { btn.textContent = "📋 " + U("複製結果代碼", "Sao chép mã"); }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(ta.value).then(ok, function () { document.execCommand("copy"); ok(); });
      else { document.execCommand("copy"); ok(); }
    };
    sb.querySelector(".ghost").onclick = function () {
      build(); window.scrollTo({ top: 0, behavior: "smooth" });
    };
    build();
    f.appendChild(head); f.appendChild(box); f.appendChild(sb);
    return f;
  };

  /* ---------- 組裝 ---------- */
  var nav = $("#nav"), main = $("#main");
  var curMod = D.modules.length ? D.modules[0].id : null, modT0 = Date.now();
  function switchMod(id, btn) {
    document.querySelectorAll(".module").forEach(function (m) { m.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
    nav.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
    btn.classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (id !== curMod) {
      TRACK.send("module_view", id, null, { from: curMod, ms: Date.now() - modT0 });
      curMod = id; modT0 = Date.now();
    }
  }
  D.modules.forEach(function (m, i) {
    var btn = el("button", i === 0 ? "active" : "", m.nav);
    btn.onclick = function () { switchMod(m.id, btn); };
    nav.appendChild(btn);

    var sec = el("section", "module" + (i === 0 ? " active" : ""));
    sec.id = m.id;
    sec.appendChild(el("div", "lead",
      '<div class="kicker">' + m.kicker + '</div><h2>' + m.h2 + '</h2><p>' + m.lead + '</p>'));
    m.blocks.forEach(function (b, bi) {
      var render = BLOCKS[b.type];
      if (!render) { console.error("未知區塊型別:", b.type); return; }
      CTX.mod = m.id; CTX.bi = bi;
      sec.appendChild(render(b));
    });
    main.appendChild(sec);
  });

  /* ---------- 學號代碼列（只在啟用記錄的週出現） ---------- */
  if (TRACK.on) {
    var bar = el("div", "codebar");
    bar.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;font-size:14px";
    bar.innerHTML = '<label for="ifs-code" style="font-weight:700">' + U("學號代碼", "Mã số SV") + '</label>' +
      '<input id="ifs-code" maxlength="20" placeholder="' + U("例：S001", "VD: S001") + '" style="width:120px;padding:6px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:14px">' +
      '<span style="opacity:.75">' + U("只記錄你的學習歷程（翻卡、配對、測驗），不需要姓名。", "Chỉ ghi lại quá trình học (lật thẻ, ghép cặp, kiểm tra), không cần tên.") + '</span>';
    nav.parentNode.insertBefore(bar, nav);
    var inp = bar.querySelector("#ifs-code");
    inp.value = TRACK.code();
    inp.addEventListener("change", function () {
      TRACK.setCode(inp.value);
      document.querySelectorAll(".qid").forEach(function (x) { x.value = TRACK.code(); });
      TRACK.send("code_set", null, null, {});
    });
    TRACK.send("session_start", curMod, null, {
      device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || "") ? "mobile" : "desktop",
      w: window.innerWidth, build: D.build || null,
    });
    // 停留時間以「頁面可見」為準：切到背景就結算一段 module_leave，回來重新計時。
    // 手機瀏覽器殺分頁常不觸發 pagehide，所以以 visibilitychange→hidden 為主。
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        TRACK.send("module_leave", curMod, null, { ms: Date.now() - modT0 }); TRACK.flush();
      } else {
        modT0 = Date.now();
      }
    });
  }
})();
</script>
</body>
