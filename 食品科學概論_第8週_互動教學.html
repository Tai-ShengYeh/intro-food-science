<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品科學概論 第8週 · 互動教學</title>
<style>
  :root{
    --primary:#2D2A6E; --secondary:#5B4FB8; --accent:#00B8B8; --warm:#F5A623; --green:#2FA36B; --red:#D65B5B; --dark:#1A1A3E; --bg:#F4F5FA; --text:#1F1F2E; --mid:#5A5A75; --muted:#9096ac; --border:#E2E2EC; --card:#fff;
  }
/* 版型樣式 — 逐條取自「第1週_互動教學.html」，末段為新增區塊（cmp / tbl / note）。
   這裡只用 var(--x)；色票由 tokens.js 產生 :root 注入。 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:17px}
header{background:linear-gradient(120deg,var(--dark),var(--primary));color:#fff;
  padding:26px 22px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(0,0,0,.15)}
header h1{font-size:31px;font-weight:800;letter-spacing:.5px}
header .sub{color:#b9c7ff;font-size:16px;margin-top:5px}
nav{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.10);color:#dfe4ff;border:none;padding:12px 18px;
  border-radius:10px 10px 0 0;font-size:16.5px;cursor:pointer;font-weight:600;transition:.15s}
nav button:hover{background:rgba(255,255,255,.2)}
nav button.active{background:var(--bg);color:var(--primary)}
main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
.module{display:none;animation:fade .35s}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead{background:var(--dark);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:22px}
.lead .kicker{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px}
.lead h2{font-size:26px;margin:6px 0 8px}
.lead p{color:#cdd3ee;font-size:16.5px}
.sec-title{font-size:23px;font-weight:800;color:var(--primary);margin:30px 0 6px;
  display:flex;align-items:center;gap:10px}
.sec-title .bar{width:6px;height:25px;background:var(--accent);border-radius:3px;display:inline-block}
.hint{color:var(--mid);font-size:15px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* flip cards */
.flip{perspective:1100px;height:200px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px rgba(30,30,60,.08);border:1px solid var(--border)}
.front{background:var(--card)}
.front .t{font-size:21px;font-weight:800;color:var(--primary)}
.front .en{color:var(--muted);font-size:14px;margin-top:3px;font-style:italic}
.front .tap{margin-top:auto;color:var(--accent);font-size:14px;font-weight:700}
.back{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;transform:rotateY(180deg);overflow:auto}
.back p{font-size:16px}
.cbar{height:6px;border-radius:14px 14px 0 0;position:absolute;top:0;left:0;right:0}

/* expandable */
.exp{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.exp>button{width:100%;text-align:left;background:none;border:none;padding:16px 18px;cursor:pointer;
  display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;color:var(--text)}
.exp .num{background:var(--primary);color:#fff;min-width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.exp .chev{margin-left:auto;color:var(--muted);transition:.25s;font-size:20px}
.exp.on .chev{transform:rotate(90deg);color:var(--accent)}
.exp .body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 18px}
.exp.on .body{padding:0 18px 16px 62px}
.exp .body ul{margin-left:16px;color:var(--mid);font-size:16px}
.exp .body p{color:var(--mid);font-size:15.5px}
.exp .tag{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:8px}

/* info card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.card .h{font-weight:800;color:var(--primary);font-size:18px;margin-bottom:6px}
.card .en{color:var(--muted);font-size:13px;font-style:italic}
.card ul{margin:8px 0 0 18px;font-size:15.5px;color:var(--mid)}

/* timeline */
.tl{display:flex;gap:0;flex-wrap:wrap;counter-reset:s}
.tl .step{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 14px 14px;margin:8px;position:relative}
.tl .dot{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;margin-bottom:8px}
.tl .step h4{color:var(--primary);font-size:17.5px;margin-bottom:4px}
.tl .step p{font-size:15px;color:var(--mid)}

/* matching */
.match-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.pool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--secondary);color:#fff;padding:10px 17px;border-radius:22px;font-weight:700;
  cursor:grab;user-select:none;font-size:16.5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chip.used{opacity:.35;pointer-events:none}
.chip.sel{outline:3px solid var(--warm);outline-offset:2px}
.targets{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;border:2px dashed var(--border);border-radius:12px;padding:10px 14px;background:#fafbff}
.slot .desc{flex:1;font-size:16px;color:var(--text)}
.slot .drop{min-width:130px;min-height:44px;border-radius:8px;background:#eef0f8;display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:15px;padding:8px 12px}
.slot.ok{border-color:var(--green);background:#effaf3}
.slot.ok .drop{background:var(--green);color:#fff;font-weight:700}
.slot.bad{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* quiz */
.quiz-head{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.pbar{height:12px;background:#e7e9f4;border-radius:8px;overflow:hidden;margin-top:10px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--secondary));transition:width .4s}
.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.q .qn{color:var(--accent);font-weight:800;font-size:14px}
.q .qt{font-size:19.5px;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fafbff;border:2px solid var(--border);
  border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;font-size:16.5px;transition:.15s}
.opt:hover{border-color:var(--secondary)}
.opt.correct{border-color:var(--green);background:#effaf3;font-weight:700}
.opt.wrong{border-color:var(--red);background:#fdeeee}
.opt.dim{opacity:.6}
.fb{margin-top:8px;font-size:15.5px;padding:11px 14px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.good{background:#effaf3;color:#1c7a4d} .fb.no{background:#fdeeee;color:#a83b3b}
.scorebox{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:16px;
  padding:26px;text-align:center;margin-top:10px;display:none}
.scorebox.show{display:block}
.scorebox .big{font-size:46px;font-weight:800}
.btn{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:10px;
  font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.18)}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;background:#eef0fb;color:var(--secondary);padding:3px 10px;border-radius:20px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px}

/* ===== 新增區塊 ===== */
/* compare：兩欄對照（梅納 vs 焦糖化、冷藏 vs 冷凍…） */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media(max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 18px 18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06);position:relative;overflow:hidden}
.cmp .col .cbar{position:static;height:6px;margin:0 -18px 14px;border-radius:0}
.cmp .col h4{font-size:20px;font-weight:800;margin-bottom:2px}
.cmp .col .en{color:var(--muted);font-size:13px;font-style:italic;margin-bottom:8px}
.cmp .col ul{margin-left:18px;font-size:15.5px;color:var(--mid)}
.cmp .col li{margin-bottom:5px}
.cmp-note{margin-top:12px;background:#eef0fb;border-left:5px solid var(--secondary);
  border-radius:0 10px 10px 0;padding:12px 16px;font-size:16px;color:var(--primary);font-weight:600}

/* table：資料表（維生素、添加物分類…） */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px}
.tbl th{background:var(--primary);color:#fff;text-align:left;padding:12px 14px;font-weight:700;font-size:15px}
.tbl td{padding:11px 14px;border-top:1px solid var(--border);color:var(--mid);vertical-align:top}
.tbl tr:nth-child(even) td{background:#fafbff}
.tbl td:first-child{color:var(--text);font-weight:700}

/* note：重點提示條 */
.note{background:#fff8e9;border-left:5px solid var(--warm);border-radius:0 12px 12px 0;
  padding:14px 18px;margin:14px 0;font-size:16px;color:var(--text)}
.note b{color:var(--primary)}
.note.key{background:#effaf3;border-left-color:var(--green)}
.note.warn{background:#fdeeee;border-left-color:var(--red)}
/* 國合班 A2 互動練習：拼音與越南文（build_a2.js 產生的內容才會用到） */
.py{display:block;font-size:.78em;font-weight:500;color:var(--mid);margin-top:2px}
.vn{display:block;font-size:.88em;font-weight:500;color:var(--secondary);margin-top:2px}
/* Shared classroom tasks: oral response, sentence support, then sample explanation. */
.class-activity{display:grid;gap:12px;min-width:0}
.class-activity .vn{display:block;color:#0E7C7B;font-size:15px;line-height:1.5;margin-top:4px}
.activity-time{color:#0E7C7B;font-weight:700;font-size:15px}
.activity-prompt{font-size:clamp(18px,2.3vw,23px);line-height:1.5}
.sentence-stem{padding:12px 16px;background:#EFFAF3;border-left:5px solid #2FA36B;color:#1A1A3E;line-height:1.6}
.class-activity label{font-size:14px;color:#52526B}
.activity-response{display:block;width:100%;max-width:100%;min-height:72px;border:1.5px solid #A0A0B5;border-radius:8px;padding:10px 12px;resize:vertical;font:inherit;font-size:17px;background:#fff;color:#1F1F2E}
.activity-answer{border:1px solid #E2E2EC;background:#fff;border-radius:8px;padding:10px 14px;font-size:16px;line-height:1.5}
.activity-answer summary{cursor:pointer;font-weight:700;color:#2D2A6E}
.activity-answer p{margin-top:10px}
.activity-response:focus-visible,.activity-answer summary:focus-visible{outline:3px solid #0E7C7B;outline-offset:3px}
.source-note{font-size:13px;color:#52526B;line-height:1.5;overflow-wrap:anywhere;margin-top:10px}
.source-note .vn{display:block;color:#0E7C7B;font-size:13px}
.lesson-links{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.lesson-links a{color:inherit;text-underline-offset:3px}
.feedback-reason,.feedback-transfer{margin-top:6px}
.feedback-transfer{font-weight:600}
@media(max-width:640px){header{position:relative!important}.class-activity{gap:10px}}
@media print{.activity-response{min-height:64px}}


.back .vn{color:#D7FAF3}.tbl-wrap{overflow-x:auto}
</style>
</head>

<script>window.__LESSON__={"week":8,"series":["#2D2A6E","#2FA36B","#F5A623","#5B4FB8","#00B8B8","#D65B5B"],"modules":[{"id":"m-map","nav":"重點地圖","kicker":"MODULE 1 · 複習","h2":"前半學期的一條主線","lead":"以夾心餅乾串起食品組成、加工、保存與品質；沿用前七週修正後的概念，先分清觀察與推論，再找驗證資料。","blocks":[{"type":"cards","title":"夾心餅乾：看證據，再下結論\u003cspan class=\"vn\" lang=\"vi\">Bánh quy kẹp nhân: xem bằng chứng rồi kết luận\u003c/span>","cols":3,"items":[{"h":"① 我看到什麼？\u003cspan class=\"vn\" lang=\"vi\">Tôi thấy gì?\u003c/span>","p":"讀成分、份量與保存標示；記下包裝及質地觀察。\u003cspan class=\"vn\" lang=\"vi\">Đọc thành phần, khẩu phần, bảo quản; ghi bao bì và kết cấu.\u003c/span>","c":"#2D2A6E"},{"h":"② 我推測什麼？\u003cspan class=\"vn\" lang=\"vi\">Tôi suy đoán gì?\u003c/span>","p":"成分與製程可能造成吸濕、氧化或結構改變。\u003cspan class=\"vn\" lang=\"vi\">Thành phần, quy trình có thể gây hút ẩm, oxy hóa hay đổi cấu trúc.\u003c/span>","c":"#F5A623"},{"h":"③ 還缺什麼資料？\u003cspan class=\"vn\" lang=\"vi\">Còn thiếu dữ liệu gì?\u003c/span>","p":"成分表不能直接給出 aw、氧化程度或保存期限。\u003cspan class=\"vn\" lang=\"vi\">Danh sách thành phần không trực tiếp cho aw, mức oxy hóa hay hạn dùng.\u003c/span>","c":"#2FA36B"}]},{"type":"timeline","title":"七週的概念地圖","steps":[{"h":"第 1–2 週：食品與水","p":"整合知識處理食品問題；安全需證據。aw 與含水量不同，保存同時看溫度、pH、製程、污染及包裝。"},{"h":"第 3–5 週：三大營養素","p":"組成、結構與條件共同影響糊化、老化、變性、水解、氧化及功能性。"},{"h":"第 6 週：微量營養素","p":"保留總量、實際攝入與吸收利用不同；同基準計算，數值要說明來源和範圍。"},{"h":"第 7 週：色素、風味、酵素","p":"色澤不能單獨判斷安全；風味有基本味、香氣與口感；控制酵素要看條件。"}]},{"type":"cards","title":"含水量、aw、保存：分開回答\u003cspan class=\"vn\" lang=\"vi\">Hàm lượng nước, aw, bảo quản: ba câu hỏi\u003c/span>","cols":3,"items":[{"h":"含水量\u003cspan class=\"vn\" lang=\"vi\">Hàm lượng nước\u003c/span>","p":"問「總共有多少水」；不能直接當作 aw。\u003cspan class=\"vn\" lang=\"vi\">Hỏi có tổng bao nhiêu nước; không trực tiếp là aw.\u003c/span>","c":"#2D2A6E"},{"h":"水活性 aw\u003cspan class=\"vn\" lang=\"vi\">Hoạt độ nước aw\u003c/span>","p":"同溫、平衡時，食品水蒸氣壓 ÷ 純水蒸氣壓；是無單位比值。\u003cspan class=\"vn\" lang=\"vi\">Ở cùng nhiệt độ và cân bằng: áp suất hơi nước thực phẩm chia nước tinh khiết; không đơn vị.\u003c/span>","c":"#00B8B8"},{"h":"保存與安全\u003cspan class=\"vn\" lang=\"vi\">Bảo quản và an toàn\u003c/span>","p":"還看 pH、溫度、製程、污染與包裝；低 aw 不等於無菌。\u003cspan class=\"vn\" lang=\"vi\">Còn xem pH, nhiệt, quy trình, nhiễm bẩn, bao bì; aw thấp không bằng vô trùng.\u003c/span>","c":"#D65B5B"}]},{"type":"note","title":"","text":"本週不把餅乾、果醬等各配上一個固定 aw。產品要在指定溫度平衡後量測；微生物生長界線依種類與其他條件而異。\u003cspan class=\"vn\" lang=\"vi\">Không gán một aw cố định cho mọi bánh quy hay mứt. Cần đo khi cân bằng ở nhiệt độ xác định; giới hạn phát triển tùy loài và điều kiện.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-technical-guides/water-activity-aw-foods\" target=\"_blank\" rel=\"noopener\">aw 定義與量測 / Định nghĩa và đo aw: FDA ↗\u003c/a>\u003c/p>"},{"type":"note","title":"","text":"生長受抑制不等於病原菌已死亡。低水分食品仍須重視衛生及污染控制，不能只憑乾、脆或低 aw 宣告安全。\u003cspan class=\"vn\" lang=\"vi\">Bị ức chế phát triển không bằng mầm bệnh đã chết. Thực phẩm ít nước vẫn cần vệ sinh, kiểm soát nhiễm; khô, giòn hay aw thấp không tự chứng minh an toàn.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/media/184815/download\" target=\"_blank\" rel=\"noopener\">低水分食品風險概念 / Khái niệm rủi ro: FDA 2025 指引草案（非強制法規） ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"結構與功能：不是三句萬用公式\u003cspan class=\"vn\" lang=\"vi\">Cấu trúc và tính chất: không dùng một công thức cho mọi loại\u003c/span>","cols":3,"items":[{"h":"碳水化合物\u003cspan class=\"vn\" lang=\"vi\">Carbohydrate\u003c/span>","p":"有單醣、雙醣與多醣等；澱粉是多醣，糊化還看水與熱。\u003cspan class=\"vn\" lang=\"vi\">Gồm đường đơn, đôi, đa; tinh bột là đa đường, hồ hóa còn tùy nước, nhiệt.\u003c/span>","c":"#2D2A6E"},{"h":"蛋白質\u003cspan class=\"vn\" lang=\"vi\">Protein\u003c/span>","p":"胺基酸以胜肽鍵相連；變性、聚集與水解要分開。\u003cspan class=\"vn\" lang=\"vi\">Axit amin nối bằng liên kết peptide; phân biệt biến tính, tập hợp, thủy phân.\u003c/span>","c":"#D65B5B"},{"h":"脂質\u003cspan class=\"vn\" lang=\"vi\">Lipid\u003c/span>","p":"三酸甘油酯是甘油＋三個脂肪酸；不是所有脂質都長這樣。\u003cspan class=\"vn\" lang=\"vi\">Triacylglycerol gồm glycerol và ba axit béo; không phải mọi lipid đều vậy.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"一般能量估算常用：可利用碳水化合物 4、蛋白質 4、脂肪 9 kcal/g；纖維、糖醇等另有處理，不能把全部碳水化合物一律當成 4。\u003cspan class=\"vn\" lang=\"vi\">Ước tính năng lượng thường dùng carbohydrate khả dụng 4, protein 4, chất béo 9 kcal/g; chất xơ, polyol có cách xử lý riêng, không gán 4 cho mọi carbohydrate.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/Y5022E/y5022e04.htm\" target=\"_blank\" rel=\"noopener\">一般換算係數與限制 / Hệ số và giới hạn: FAO ↗\u003c/a>\u003c/p>"},{"type":"note","title":"","text":"有足夠水與適當加熱時，澱粉粒吸水膨潤、失去部分有序結構；不以 60°C 或顆粒破裂當成全部澱粉的必要條件。冷卻放置時直鏈、支鏈澱粉均可能重新排列。\u003cspan class=\"vn\" lang=\"vi\">Đủ nước và nhiệt phù hợp giúp hạt tinh bột trương, mất một phần trật tự; không dùng 60°C hay vỡ hạt làm điều kiện chung. Khi nguội và để lâu, cả amylose, amylopectin có thể sắp lại.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.1002/star.201100023\" target=\"_blank\" rel=\"noopener\">澱粉熱轉變範圍 / Phạm vi biến đổi tinh bột ↗\u003c/a>\u003c/p>"},{"type":"note","title":"","text":"變性主要改變蛋白質構形，不等於把胜肽主鏈切斷；也不一定立刻凝固。營養、消化性與功能仍需看蛋白質及加工條件。\u003cspan class=\"vn\" lang=\"vi\">Biến tính chủ yếu đổi cấu hình, không bằng cắt mạch peptide và không luôn đông ngay. Dinh dưỡng, tiêu hóa và chức năng còn tùy protein, chế biến.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://openstax.org/books/biology-2e/pages/3-4-proteins\" target=\"_blank\" rel=\"noopener\">蛋白質結構 / Cấu trúc protein: OpenStax ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"油脂：水解、氧化與指標\u003cspan class=\"vn\" lang=\"vi\">Chất béo: thủy phân, oxy hóa và chỉ số\u003c/span>","cols":3,"items":[{"h":"水解\u003cspan class=\"vn\" lang=\"vi\">Thủy phân\u003c/span>","p":"酯鍵斷開，生成游離脂肪酸等；速率受水、溫度、催化條件影響。\u003cspan class=\"vn\" lang=\"vi\">Cắt liên kết ester, tạo axit béo tự do; tốc độ tùy nước, nhiệt, xúc tác.\u003c/span>","c":"#2D2A6E"},{"h":"氧化\u003cspan class=\"vn\" lang=\"vi\">Oxy hóa\u003c/span>","p":"氧參與反應，光、熱等可影響速率；初級產物也會再分解。\u003cspan class=\"vn\" lang=\"vi\">Oxy tham gia, ánh sáng và nhiệt ảnh hưởng tốc độ; sản phẩm sơ cấp có thể phân hủy tiếp.\u003c/span>","c":"#F5A623"},{"h":"AV、POV\u003cspan class=\"vn\" lang=\"vi\">AV, POV\u003c/span>","p":"回答不同問題；POV 低可能是初期，也可能是產物已分解。\u003cspan class=\"vn\" lang=\"vi\">Trả lời câu hỏi khác nhau; POV thấp có thể mới đầu hoặc sản phẩm đã phân hủy.\u003c/span>","c":"#D65B5B"}]},{"type":"note","title":"","text":"不能由「有水」推定立刻明顯水解，也不能用單一 POV 判定新鮮或安全。防潮與阻氧的功能不同，需配合產品與驗證。\u003cspan class=\"vn\" lang=\"vi\">Có nước không có nghĩa thủy phân rõ ngay; không dùng một POV để xác định tươi hay an toàn. Chống ẩm khác cản oxy, cần phù hợp sản phẩm và kiểm chứng.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.1111/j.1750-3841.2007.00352.x\" target=\"_blank\" rel=\"noopener\">加工油脂反應 / Phản ứng dầu khi chế biến: Choe & Min, 2007 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"第 6 週回顧：分類、保留與利用\u003cspan class=\"vn\" lang=\"vi\">Ôn tuần 6: phân loại, giữ lại và sử dụng\u003c/span>","cols":3,"items":[{"h":"脂溶性與水溶性\u003cspan class=\"vn\" lang=\"vi\">Tan trong chất béo, trong nước\u003c/span>","p":"A、D、E、K 與 B 群、C；分類不能直接代表全部儲存或耐熱性。\u003cspan class=\"vn\" lang=\"vi\">A, D, E, K và nhóm B, C; không suy mọi dự trữ, bền nhiệt chỉ từ nhóm.\u003c/span>","c":"#2D2A6E"},{"h":"同批原料算總量\u003cspan class=\"vn\" lang=\"vi\">Tính tổng cùng mẻ\u003c/span>","p":"青菜湯假設：原 100 mg C，煮後菜 60、湯 20，共 80 mg。\u003cspan class=\"vn\" lang=\"vi\">Canh rau giả định: đầu 100 mg C, rau 60, canh 20, tổng 80 mg.\u003c/span>","c":"#2FA36B"},{"h":"含量不等於利用量\u003cspan class=\"vn\" lang=\"vi\">Hàm lượng khác lượng sử dụng\u003c/span>","p":"礦物質可移到水中；攝入量也不同於吸收利用量。\u003cspan class=\"vn\" lang=\"vi\">Khoáng có thể chuyển vào nước; lượng ăn khác lượng hấp thu, sử dụng.\u003c/span>","c":"#00B8B8"}]},{"type":"note","title":"","text":"此數字沿用第 6 週教學假設，不是實測值。喝湯能攝入其中溶出的部分，不能恢復已分解的維生素。\u003cspan class=\"vn\" lang=\"vi\">Các số nối tiếp giả định tuần 6, không phải số đo. Ăn nước canh lấy phần hòa ra, không phục hồi vitamin đã phân hủy.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.ars.usda.gov/research/publications/publication/?seqNo115=225934\" target=\"_blank\" rel=\"noopener\">保留量方法 / Cách tính giữ lại: USDA ARS ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"四種常見天然色素\u003cspan class=\"vn\" lang=\"vi\">Bốn nhóm sắc tố tự nhiên thường gặp\u003c/span>","cols":4,"items":[{"h":"葉綠素\u003cspan class=\"vn\" lang=\"vi\">Diệp lục\u003c/span>","p":"常見綠色；酸與加熱條件可使它轉為橄欖褐。\u003cspan class=\"vn\" lang=\"vi\">Thường xanh lá; axit và điều kiện nhiệt có thể làm ngả nâu ô liu.\u003c/span>","c":"#2FA36B"},{"h":"類胡蘿蔔素\u003cspan class=\"vn\" lang=\"vi\">Carotenoid\u003c/span>","p":"常見黃、橙、紅；氧、光與加工條件可改變它。\u003cspan class=\"vn\" lang=\"vi\">Thường vàng, cam, đỏ; oxy, sáng và chế biến có thể làm thay đổi.\u003c/span>","c":"#F5A623"},{"h":"花青素\u003cspan class=\"vn\" lang=\"vi\">Anthocyanin\u003c/span>","p":"顏色受 pH、種類、濃度等影響。\u003cspan class=\"vn\" lang=\"vi\">Màu tùy pH, loại, nồng độ và các yếu tố khác.\u003c/span>","c":"#5B4FB8"},{"h":"肌紅蛋白\u003cspan class=\"vn\" lang=\"vi\">Myoglobin\u003c/span>","p":"肉色會隨氧結合、鐵的氧化狀態與加熱而變。\u003cspan class=\"vn\" lang=\"vi\">Màu thịt đổi theo gắn oxy, trạng thái oxy hóa sắt và nhiệt.\u003c/span>","c":"#D65B5B"}]},{"type":"cards","title":"三種褐變：先看反應物與條件\u003cspan class=\"vn\" lang=\"vi\">Ba kiểu hóa nâu: xem chất và điều kiện\u003c/span>","cols":3,"items":[{"h":"梅納反應\u003cspan class=\"vn\" lang=\"vi\">Phản ứng Maillard\u003c/span>","p":"還原糖＋胺基化合物；受熱常加快，但不是只能高溫才發生。\u003cspan class=\"vn\" lang=\"vi\">Đường khử + hợp chất amino; nhiệt thường tăng tốc, không chỉ ở nhiệt cao.\u003c/span>","c":"#D65B5B"},{"h":"焦糖化\u003cspan class=\"vn\" lang=\"vi\">Caramel hóa\u003c/span>","p":"糖的熱轉變，不必有胺基；條件依糖種、水分與時間。\u003cspan class=\"vn\" lang=\"vi\">Biến đổi nhiệt của đường, không cần amino; tùy loại đường, nước, thời gian.\u003c/span>","c":"#F5A623"},{"h":"酵素性褐變\u003cspan class=\"vn\" lang=\"vi\">Hóa nâu do enzyme\u003c/span>","p":"例如 PPO、酚、氧；足夠熱處理可鈍化 PPO，低度加熱未必。\u003cspan class=\"vn\" lang=\"vi\">Ví dụ PPO, phenol, oxy; nhiệt đủ có thể bất hoạt PPO, đun nhẹ chưa chắc.\u003c/span>","c":"#5B4FB8"}]},{"type":"note","title":"","text":"同一食品可能同時有多種反應，不能只看褐色就決定原因；也不把「加熱一定阻止褐變」當成通則。\u003cspan class=\"vn\" lang=\"vi\">Cùng thực phẩm có thể có nhiều phản ứng; không xác định nguyên nhân chỉ bằng màu nâu và không nói đun luôn ngăn hóa nâu.\u003c/span>"},{"type":"note","title":"短活動 1｜同樣變褐，原因相同嗎？\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 1: Cùng nâu, có cùng nguyên nhân?\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"distinguish\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">A：蘋果切開後在室溫慢慢變褐；B：還原糖與胺基化合物加熱產生褐色。各提出較可能的機制，還要確認什麼？\u003cspan class=\"vn\" lang=\"vi\">A: táo cắt để phòng nâu dần. B: đường khử và amino gia nhiệt tạo nâu. Nêu cơ chế có thể và dữ liệu cần xác nhận.\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>A 可能是＿＿，B 可能是＿＿；我根據＿＿推測。\u003cspan class=\"vn\" lang=\"vi\">A có thể là ___, B là ___; tôi suy từ ___.\u003c/span>\u003c/div>\u003clabel for=\"general-w8-distinguish\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w8-distinguish\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>A 較可能是 PPO 相關褐變；B 較可能是梅納反應，根據反應物及條件推測。\u003cspan class=\"vn\" lang=\"vi\">A có thể hóa nâu do PPO; B có thể Maillard, suy từ chất và điều kiện.\u003c/span>\u003c/p>\u003cp>同一食品可能有多種反應；要確認反應物、時間、溫度或酵素活性，不只比顏色。\u003cspan class=\"vn\" lang=\"vi\">Một thực phẩm có thể nhiều phản ứng; cần chất, thời gian, nhiệt hay hoạt tính enzyme, không chỉ màu.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"exp","title":"延伸自我檢查：能否說出限制？","items":[{"h":"糊化、成膠與老化","body":["糊化涉及吸水膨潤與有序結構減少；顆粒破裂不是所有情況的必要條件。","成膠是網絡形成，取決於濃度、澱粉結構與條件；老化涉及直鏈和支鏈的重新排列，時間尺度不同。"]},{"h":"變性、凝固與水解","body":["變性主要改變構形，不一定立刻凝固；聚集形成網絡還看濃度、pH 與溫度等。","水解切開胜肽鍵；營養與消化性不能只由「未切斷」推出永遠完全不變。"]},{"h":"POV、AV 與保存","body":["AV 和 POV 回答不同反應問題；初級過氧化物可再分解，所以 POV 低不能獨立保證新鮮。","阻水蒸氣和阻氧是不同性能，不能由包裝外觀推出實際透氧或透濕率。"]},{"h":"殺菁、冷凍與安全","body":["多數冷凍蔬菜的殺菁以鈍化酵素維持品質為主；可減少部分微生物，但不等於完整滅菌。","冷凍抑制生長，不保證殺死病原菌；部分酵素反應仍可能緩慢進行。"]}]}]},{"id":"m-case","nav":"案例討論","kicker":"MODULE 2 · 小組討論","h2":"案例：從成分看一項加工食品","lead":"以下是教學用夾心餅乾案例，並非某項市售產品的實測報告；把成分與外觀當作線索，將尚未證實的內容寫成有條件的推論。","blocks":[{"type":"cards","title":"分析夾心餅乾的四個問題\u003cspan class=\"vn\" lang=\"vi\">Bốn câu hỏi phân tích bánh quy kẹp nhân\u003c/span>","cols":4,"items":[{"h":"成分\u003cspan class=\"vn\" lang=\"vi\">Thành phần\u003c/span>","p":"成分順序提供配方線索；營養量還要看營養標示。\u003cspan class=\"vn\" lang=\"vi\">Thứ tự thành phần gợi công thức; lượng chất còn xem bảng dinh dưỡng.\u003c/span>","c":"#2D2A6E"},{"h":"加工\u003cspan class=\"vn\" lang=\"vi\">Chế biến\u003c/span>","p":"可提出梅納、澱粉轉變、蛋白質變性等可能性，需製程支持。\u003cspan class=\"vn\" lang=\"vi\">Có thể nêu Maillard, biến đổi tinh bột, protein; cần dữ liệu quy trình.\u003c/span>","c":"#F5A623"},{"h":"保存\u003cspan class=\"vn\" lang=\"vi\">Bảo quản\u003c/span>","p":"區分防潮、阻氧與衛生控制；包裝外觀不足以證明性能。\u003cspan class=\"vn\" lang=\"vi\">Phân biệt chống ẩm, oxy và vệ sinh; nhìn bao bì chưa đủ chứng minh tính năng.\u003c/span>","c":"#2FA36B"},{"h":"劣變\u003cspan class=\"vn\" lang=\"vi\">Giảm chất lượng\u003c/span>","p":"可能變軟、油耗味；安全風險與保存期限須另有驗證。\u003cspan class=\"vn\" lang=\"vi\">Có thể mềm, mùi ôi; rủi ro an toàn, hạn dùng cần kiểm chứng riêng.\u003c/span>","c":"#D65B5B"}]},{"type":"note","title":"","text":"台灣包裝食品成分依含量多寡排序，可找前幾項作線索，但不能由排序算出精確百分比、aw 或氧化值；複合原料與其他標示條件仍須看規範。\u003cspan class=\"vn\" lang=\"vi\">Ở Đài Loan, thành phần xếp theo lượng; vài mục đầu là gợi ý, không cho phần trăm chính xác, aw hay chỉ số oxy hóa. Nguyên liệu hỗn hợp và điều kiện khác cần theo quy định.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.mohw.gov.tw/cp-4343-72811-1.html\" target=\"_blank\" rel=\"noopener\">成分排序與範圍 / Thứ tự và phạm vi: 台灣衛福部／TFDA ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"假設案例：同溫下的水分移動\u003cspan class=\"vn\" lang=\"vi\">Tình huống giả định: nước dịch chuyển ở cùng nhiệt độ\u003c/span>","cols":3,"items":[{"h":"夾心 aw＝0.60\u003cspan class=\"vn\" lang=\"vi\">Nhân aw = 0,60\u003c/span>","p":"本課假設量測值，不代表所有夾心。\u003cspan class=\"vn\" lang=\"vi\">Số đo giả định trong bài, không đại diện mọi nhân.\u003c/span>","c":"#5B4FB8"},{"h":"餅乾 aw＝0.30\u003cspan class=\"vn\" lang=\"vi\">Bánh aw = 0,30\u003c/span>","p":"本課假設量測值，不是看成分表算出的。\u003cspan class=\"vn\" lang=\"vi\">Số đo giả định, không tính từ danh sách thành phần.\u003c/span>","c":"#F5A623"},{"h":"有水分傳遞路徑時\u003cspan class=\"vn\" lang=\"vi\">Khi có đường truyền ẩm\u003c/span>","p":"水傾向從夾心移向餅乾；速率仍看阻隔、結構和時間。\u003cspan class=\"vn\" lang=\"vi\">Nước có xu hướng từ nhân sang bánh; tốc độ tùy rào cản, cấu trúc và thời gian.\u003c/span>","c":"#00B8B8"}]},{"type":"note","title":"","text":"在同溫、可交換水分的系統，aw 差提供移動方向的線索。實際質地變化需量測；調整配方或設計阻隔層可能減緩，不能保證完全不變。\u003cspan class=\"vn\" lang=\"vi\">Ở cùng nhiệt và có trao đổi ẩm, chênh aw gợi hướng dịch chuyển. Cần đo đổi kết cấu; chỉnh công thức hay lớp cản có thể làm chậm, không bảo đảm không đổi.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-technical-guides/water-activity-aw-foods\" target=\"_blank\" rel=\"noopener\">水蒸氣壓與平衡概念 / Áp suất hơi và cân bằng: FDA ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 2｜預測水往哪裡走\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 2: Dự đoán hướng ẩm\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"migration\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">假設同溫量測：夾心 aw＝0.60、餅乾 aw＝0.30，中間可交換水分。水傾向往哪裡走？能從兩個數字算出保存幾天嗎？\u003cspan class=\"vn\" lang=\"vi\">Giả định đo cùng nhiệt: nhân aw 0,60, bánh aw 0,30, có trao đổi ẩm. Nước có xu hướng đi đâu? Hai số có cho hạn dùng mấy ngày không?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>水傾向從＿＿到＿＿；還不能知道＿＿，需要＿＿。\u003cspan class=\"vn\" lang=\"vi\">Nước có xu hướng từ ___ sang ___; chưa biết ___, cần ___.\u003c/span>\u003c/div>\u003clabel for=\"general-w8-migration\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w8-migration\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>水傾向從夾心到餅乾；不能由兩個 aw 算出保存天數，還需傳遞速率、包裝、時間與品質／安全資料。\u003cspan class=\"vn\" lang=\"vi\">Nước có xu hướng từ nhân sang bánh; hai aw không cho số ngày bảo quản, cần tốc độ truyền, bao bì, thời gian và dữ liệu chất lượng, an toàn.\u003c/span>\u003c/p>\u003cp>這組數字是教學假設。預測方向不同於量到質地，也不同於已證明產品安全。\u003cspan class=\"vn\" lang=\"vi\">Đây là giả định học tập; dự đoán hướng khác đo kết cấu hay chứng minh an toàn.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"小組報告：把證據說完整\u003cspan class=\"vn\" lang=\"vi\">Báo cáo nhóm: nói đủ bằng chứng\u003c/span>","cols":3,"items":[{"h":"材料與時間\u003cspan class=\"vn\" lang=\"vi\">Tài liệu và thời gian\u003c/span>","p":"一項包裝食品、標示照片、一頁 A4、5 分鐘；至少連結三週。\u003cspan class=\"vn\" lang=\"vi\">Một thực phẩm, ảnh nhãn, một trang A4, 5 phút; nối ít nhất ba tuần.\u003c/span>","c":"#2D2A6E"},{"h":"三句話報告\u003cspan class=\"vn\" lang=\"vi\">Báo cáo bằng ba câu\u003c/span>","p":"我看到＿＿；我推測＿＿，因為＿＿；還要測＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tôi thấy ___; tôi suy đoán ___ vì ___; còn cần đo ___.\u003c/span>","c":"#2FA36B"},{"h":"檢查四項\u003cspan class=\"vn\" lang=\"vi\">Kiểm tra bốn điểm\u003c/span>","p":"有觀察、有機制、有範圍、有待查資料。先自評，再請同學回饋。\u003cspan class=\"vn\" lang=\"vi\">Có quan sát, cơ chế, phạm vi, dữ liệu cần thêm. Tự xem rồi nhận góp ý.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"短活動 3｜把推測改寫成可檢查的話\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 3: Viết suy đoán thành câu kiểm tra được\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"evidence\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">同學說：「包裝很亮，所以一定隔氧；餅乾很脆，所以不會有病原菌。」選一句，分清觀察與推測，補一項需要的證據。\u003cspan class=\"vn\" lang=\"vi\">Bạn nói bao bì bóng nên chắc cản oxy; bánh giòn nên không có mầm bệnh. Chọn một câu, tách quan sát và suy đoán, thêm bằng chứng cần có.\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>我觀察到＿＿；還不能證明＿＿。可以查／測＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tôi thấy ___; chưa chứng minh ___. Có thể tra hay đo ___.\u003c/span>\u003c/div>\u003clabel for=\"general-w8-evidence\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w8-evidence\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>亮是外觀觀察，阻氧要查材料與透氧資料；脆是質地觀察，不能證明無病原菌，需製程與衛生／微生物驗證。\u003cspan class=\"vn\" lang=\"vi\">Bóng là nhìn thấy, cản oxy cần vật liệu và độ truyền oxy; giòn là kết cấu, không chứng minh không mầm bệnh, cần quy trình, vệ sinh hay kiểm tra vi sinh.\u003c/span>\u003c/p>\u003cp>提出要查的證據即可，不把尚未量測的數字或保存期限填成事實。\u003cspan class=\"vn\" lang=\"vi\">Chỉ cần nêu bằng chứng cần tìm, không điền số chưa đo hay hạn dùng như sự thật.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"exp","title":"報告延伸：如何讓推論可被檢查？","items":[{"h":"成分與實際含量","body":["成分順序不給精確營養百分比；複合原料的子成分與營養標示也要分開讀。","先註明實際份量，再計算攝入量；沒有量測的 aw 不填入確定數值。"]},{"h":"加工與反應程度","body":["小麥粉、糖與蛋白質的存在，只能支持可能反應；需要糖種、水量、時間、溫度與其他製程資訊。","不能由成品褐色就宣稱全部來自梅納，也不能由脆就判斷所有澱粉都未糊化。"]},{"h":"證據與回饋","body":["依四項自評：觀察是否具體、機制是否合理、結論是否有範圍、缺少資料是否清楚。","同學回饋句型：「你的觀察是＿＿；推論還需要＿＿來支持。」本週以推理練習為主，未另訂計分權重。"]}]},{"type":"cards","title":"回顧\u003cspan class=\"vn\" lang=\"vi\">Ôn tập\u003c/span>","cols":2,"items":[{"h":"aw、含水量與安全，不能互相直接替代\u003cspan class=\"vn\" lang=\"vi\">aw, hàm lượng nước và an toàn không trực tiếp thay nhau\u003c/span>"},{"h":"糊化、老化、變性與水解，機制不同\u003cspan class=\"vn\" lang=\"vi\">Hồ hóa, thoái hóa, biến tính và thủy phân khác cơ chế\u003c/span>"},{"h":"保留量、吸收量與標示量，分開計算\u003cspan class=\"vn\" lang=\"vi\">Phân biệt lượng giữ, hấp thu và lượng trên nhãn\u003c/span>"},{"h":"觀察 → 有條件推論 → 找證據驗證\u003cspan class=\"vn\" lang=\"vi\">Quan sát → suy luận có điều kiện → tìm bằng chứng\u003c/span>"}]}]},{"id":"m-exam","nav":"期中模擬卷","kicker":"MODULE 3 · 期中考","h2":"期中自我檢核：10 題核心＋5 題延伸","lead":"前 10 題與 A2 版共用；後 5 題加強量測基準、機制與份量應用。先作答，再用雙語解析找出需要複習的概念。","blocks":[{"type":"quiz","items":[{"q":"「phản ứng Maillard」的中文是？\u003cspan class=\"vn\" lang=\"vi\">phản ứng Maillard tiếng Trung là gì?\u003c/span>","o":["梅納反應 méinà fǎnyìng","焦糖化 jiāotánghuà","糊化 húhuà","殺菁 shājīng"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 梅納反應涉及還原糖和胺基化合物；焦糖化不必有胺基。兩者都不需 PPO，不能只用褐色區分。\u003cspan class=\"vn\" lang=\"vi\">Maillard có đường khử và amino; caramel hóa không cần amino. Cả hai không cần PPO; không phân biệt chỉ bằng nâu.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：梅納反應要看還原糖與胺基。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Maillard cần xét đường khử và amino.\u003c/span>\u003c/div>"},{"q":"多數蔬菜冷凍前的殺菁，主要作用是？\u003cspan class=\"vn\" lang=\"vi\">Chần nhiều rau trước đông lạnh chủ yếu để?\u003c/span>","o":["使水活性變成零 Cho aw bằng 0","保證所有病原菌死亡 Bảo đảm mọi mầm bệnh chết","鈍化酵素 Bất hoạt enzyme","把礦物質分解掉 Phân hủy khoáng"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 殺菁以鈍化酵素來維持品質為主，也可減少部分微生物；不是完整滅菌，時間依食材及大小。\u003cspan class=\"vn\" lang=\"vi\">Chần chủ yếu bất hoạt enzyme giữ chất lượng, cũng giảm vài vi sinh vật; không tiệt trùng, thời gian tùy loại và cỡ.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：殺菁不是完整滅菌。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Chần không phải tiệt trùng.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://nchfp.uga.edu/how/freeze/freeze-general-information/blanching-vegetables/\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"「wéishēngsù」是哪個詞？\u003cspan class=\"vn\" lang=\"vi\">wéishēngsù là từ nào?\u003c/span>","o":["維生素 vitamin","微生物 vi sinh vật","葉綠素 diệp lục","水活性 hoạt độ nước"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 維生素和礦物質要分清；維生素保留受種類、形式與加工影響，不能以 C 代表所有維生素。\u003cspan class=\"vn\" lang=\"vi\">Phân biệt vitamin và khoáng; giữ vitamin tùy loại, dạng, chế biến, không dùng C đại diện mọi vitamin.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：維生素 C 不能代表所有維生素。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: C không đại diện mọi vitamin.\u003c/span>\u003c/div>"},{"q":"沿用第 6 週假設：原菜 C 100 mg，煮後菜 60、湯 20。全吃完是多少？\u003cspan class=\"vn\" lang=\"vi\">Giả định tuần 6: đầu 100 mg C, rau sau nấu 60, canh 20. Ăn hết có bao nhiêu?\u003c/span>","o":["100 mg","80 mg","60 mg","20 mg"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 60＋20＝80 mg；喝湯取回其中溶出部分，不會恢復已分解部分。這是攝入總量，不能直接當成吸收量。\u003cspan class=\"vn\" lang=\"vi\">60 + 20 = 80 mg; canh lấy phần hòa ra, không phục hồi phần phân hủy. Lượng ăn không trực tiếp là lượng hấp thu.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：菜加湯共 80 mg，不是全部恢復。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Rau cộng canh 80 mg, chưa phục hồi hết.\u003c/span>\u003c/div>"},{"q":"假設還原糖與胺基化合物受熱產生褐色，較可能是？\u003cspan class=\"vn\" lang=\"vi\">Giả định đường khử và amino đun tạo nâu, có thể là?\u003c/span>","o":["只要褐色就都是焦糖化 Nâu luôn là caramel hóa","PPO 褐變 Hóa nâu PPO","澱粉老化 Thoái hóa tinh bột","梅納反應 Phản ứng Maillard"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 根據反應物與條件判斷，而不是只看顏色。梅納反應不必全靠完整蛋白質，胺基酸等也能提供胺基。\u003cspan class=\"vn\" lang=\"vi\">Xét chất và điều kiện, không chỉ màu; Maillard không chỉ cần protein nguyên vẹn, axit amin cũng cung cấp nhóm amino.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：先看反應物，再判斷機制。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Xem chất phản ứng rồi xét cơ chế.\u003c/span>\u003c/div>"},{"q":"油脂 POV 低，就能保證很新鮮嗎？\u003cspan class=\"vn\" lang=\"vi\">POV dầu thấp có bảo đảm tươi không?\u003c/span>","o":["不能，可能初期或過氧化物已分解 Không, có thể mới đầu hay peroxide đã phân hủy","能，POV 就是保存天數 Có, POV là số ngày bảo quản","能，代表沒有任何氧化 Có, không có oxy hóa","能，也代表沒有微生物 Có, không vi sinh vật"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> POV 主要看初級氧化產物；低值可能有不同原因。需搭配其他指標、保存與製程資料，不能直接當作安全結論。\u003cspan class=\"vn\" lang=\"vi\">POV chủ yếu xét sản phẩm oxy hóa sơ cấp; thấp có nhiều lý do. Cần chỉ số khác, dữ liệu bảo quản và quy trình, không kết luận an toàn.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：POV 低，不一定代表新鮮。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: POV thấp không chắc tươi.\u003c/span>\u003c/div>"},{"q":"只有糖在適當加熱條件下產生焦糖色，較接近？\u003cspan class=\"vn\" lang=\"vi\">Chỉ đường gia nhiệt phù hợp tạo màu caramel, gần với?\u003c/span>","o":["梅納反應 Maillard","PPO 褐變 Hóa nâu PPO","蛋白質變性 Biến tính protein","焦糖化 Caramel hóa"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 焦糖化不必加入胺基化合物；發生條件受糖種、水分、pH、時間影響，不把單一溫度當通則。\u003cspan class=\"vn\" lang=\"vi\">Caramel hóa không cần thêm amino; tùy đường, nước, pH, thời gian, không dùng một nhiệt độ cho mọi loại.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：焦糖化不必有胺基。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Caramel hóa không cần amino.\u003c/span>\u003c/div>"},{"q":"同溫假設：夾心 aw 0.60，餅乾 0.30，可交換水分；方向較可能是？\u003cspan class=\"vn\" lang=\"vi\">Giả định cùng nhiệt: nhân aw 0,60, bánh 0,30, có trao đổi ẩm; hướng nào?\u003c/span>","o":["餅乾到夾心 Bánh sang nhân","夾心到餅乾 Nhân sang bánh","永遠完全不動 Luôn không đổi","只看含水量百分比 Chỉ xem phần trăm nước"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 同溫下 aw 差提供水分移動方向的線索；速率還看阻隔與結構，不能由此算出保存期限。\u003cspan class=\"vn\" lang=\"vi\">Chênh aw cùng nhiệt gợi hướng ẩm; tốc độ còn tùy cản và cấu trúc, chưa cho hạn dùng.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：水傾向從 aw 高處到低處。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Nước có xu hướng từ aw cao sang thấp.\u003c/span>\u003c/div>"},{"q":"只看到成分表，哪項仍需另外量測或驗證？\u003cspan class=\"vn\" lang=\"vi\">Chỉ xem thành phần, mục nào cần đo hay kiểm chứng thêm?\u003c/span>","o":["是否列了小麥粉 Có ghi bột mì không","是否列了植物油 Có ghi dầu không","標示成分的先後順序 Thứ tự thành phần","這個產品的實際 aw 和保存期限 aw thực và hạn dùng"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 成分表提供用料與順序線索，不能直接算出 aw、氧化程度或安全保存天數；前三項也不等於精確營養比例。\u003cspan class=\"vn\" lang=\"vi\">Thành phần gợi nguyên liệu và thứ tự, không trực tiếp cho aw, oxy hóa hay số ngày an toàn; ba mục đầu không là tỷ lệ dinh dưỡng chính xác.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：成分表是線索，不是 aw 測量值。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Thành phần là gợi ý, không phải số đo aw.\u003c/span>\u003c/div>"},{"q":"蛋白質變性與水解，差別較正確的是？\u003cspan class=\"vn\" lang=\"vi\">Biến tính và thủy phân protein khác nhau thế nào?\u003c/span>","o":["兩者都只改顏色 Cả hai chỉ đổi màu","變性一定立刻凝固 Biến tính luôn đông ngay","變性主要改構形；水解切開胜肽鍵 Biến tính đổi cấu hình; thủy phân cắt peptide","兩者都一定增加所有營養 Cả hai tăng mọi dinh dưỡng"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 變性不是把胺基酸主鏈切碎，也不一定凝固；水解才是本題切開胜肽鍵的機制。營養與功能仍要看加工條件。\u003cspan class=\"vn\" lang=\"vi\">Biến tính không cắt mạch axit amin, không luôn đông; thủy phân cắt peptide trong câu này. Dinh dưỡng, chức năng tùy chế biến.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：變性和水解，是不同機制。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Biến tính và thủy phân khác cơ chế.\u003c/span>\u003c/div>"},{"q":"aw 的量測基準，哪項不可省略？\u003cspan class=\"vn\" lang=\"vi\">Cơ sở đo aw cần điều gì?\u003c/span>","o":["同溫度、達到平衡 Cùng nhiệt và cân bằng","只要食品名稱相同 Chỉ cùng tên thực phẩm","只看包裝顏色 Chỉ màu bao bì","把含水量直接除 100 Lấy phần trăm nước chia 100"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> aw 是同溫的蒸氣壓比，不是含水量百分比。不同食品可有相近含水量而 aw 不同，量測條件必須交代。\u003cspan class=\"vn\" lang=\"vi\">aw là tỷ số áp suất hơi cùng nhiệt, không phải phần trăm nước; nước gần nhau vẫn có aw khác, cần nêu điều kiện đo.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：aw 要同溫、平衡後比較。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: So aw cùng nhiệt và cân bằng.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-technical-guides/water-activity-aw-foods\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"澱粉老化的說法，哪句較正確？\u003cspan class=\"vn\" lang=\"vi\">Câu nào phù hợp về thoái hóa tinh bột?\u003c/span>","o":["只有顆粒先破裂才能老化 Chỉ sau vỡ hạt mới thoái hóa","只有直鏈參與 Chỉ amylose tham gia","直鏈與支鏈都可能重新排列，速率依系統 Cả hai có thể sắp lại, tốc độ tùy hệ","所有澱粉都在 60°C 開始 Mọi tinh bột bắt đầu ở 60°C"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 糊化與老化要分開；老化涉及澱粉鏈重新排列，直鏈、支鏈的貢獻與時間尺度可不同。不能只由放置時間推出同一硬度。\u003cspan class=\"vn\" lang=\"vi\">Phân biệt hồ hóa và thoái hóa; các mạch sắp lại, đóng góp và thời gian của amylose, amylopectin khác nhau. Thời gian không tự cho cùng độ cứng.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：澱粉老化要看結構與條件。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Thoái hóa cần xem cấu trúc và điều kiện.\u003c/span>\u003c/div>"},{"q":"肉色變褐就能判斷一定不安全嗎？\u003cspan class=\"vn\" lang=\"vi\">Thịt nâu có chắc không an toàn?\u003c/span>","o":["能，顏色就是菌數 Có, màu là số vi khuẩn","不能，色素狀態和安全要分開評估 Không, cần xét riêng sắc tố và an toàn","能，只要鮮紅就安全 Có, đỏ tươi là an toàn","能，褐色都來自 PPO Có, mọi nâu do PPO"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 高鐵肌紅蛋白可呈褐色，與鐵氧化狀態有關；色澤也受其他條件影響。安全要另看保存、處理與驗證。\u003cspan class=\"vn\" lang=\"vi\">Metmyoglobin có thể nâu do trạng thái sắt; màu còn tùy điều kiện khác. An toàn cần bảo quản, xử lý, kiểm chứng.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：肉色不能單獨判斷安全。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Không đánh giá an toàn chỉ bằng màu thịt.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/color-meat-and-poultry\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"餅乾成分有糖和胺基來源，能直接證明哪個結論？\u003cspan class=\"vn\" lang=\"vi\">Bánh có đường và nguồn amino, chứng minh trực tiếp điều gì?\u003c/span>","o":["保存一定一年 Hạn dùng chắc một năm","一定沒有焦糖化 Chắc không có caramel hóa","全部澱粉都完全糊化 Mọi tinh bột hồ hóa hết","只能提出可能反應，還需糖種與製程條件 Chỉ nêu phản ứng có thể, cần loại đường và quy trình"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 原料是推論線索；還原性、水分、時間和溫度等影響反應。成分存在不等於已量到反應程度。\u003cspan class=\"vn\" lang=\"vi\">Nguyên liệu là gợi ý; tính khử, nước, thời gian, nhiệt ảnh hưởng phản ứng. Có thành phần không bằng đã đo mức phản ứng.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：成分支持假設，製程與量測幫助驗證。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Thành phần hỗ trợ giả thuyết, quy trình và đo giúp kiểm chứng.\u003c/span>\u003c/div>"},{"q":"假設每份 20 g 含鈉 100 mg，一包 60 g 全吃完，鈉多少？\u003cspan class=\"vn\" lang=\"vi\">Giả định mỗi phần 20 g có 100 mg natri, ăn hết gói 60 g có bao nhiêu?\u003c/span>","o":["100 mg","200 mg","300 mg","600 mg"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 60÷20＝3 份，3×100＝300 mg。這是教學假設的攝入量，不能當成個人吸收量或完整商品標籤。\u003cspan class=\"vn\" lang=\"vi\">60 ÷ 20 = 3 phần, 3 × 100 = 300 mg. Đây là lượng ăn giả định, không là hấp thu cá nhân hay nhãn đầy đủ.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：整包三份，數字要乘三。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Cả gói ba phần, nhân ba.\u003c/span>\u003c/div>"}]}]}]};</script>
<script>
/*
 * runtime.client.js — 跑在瀏覽器裡的渲染器（17 週共用，逐字內嵌進每份 HTML）
 * 讀 window.__LESSON__ 的資料，把 modules / blocks 畫出來。
 * 互動行為（翻卡、展開、配對、測驗）沿用週1 手寫版的做法，不要另創一套。
 */
(function () {
  var D = window.__LESSON__;
  var SERIES = D.series;
  var $ = function (s) { return document.querySelector(s); };
  // 國合班 A2 版（D.a2）：介面文字加越南文；一般班 U() 只回中文，畫面與原本完全相同
  var A2 = !!D.a2;
  function U(zh, vn) { return A2 ? zh + " " + vn : zh; }

  /* ---------- 學習歷程記錄（Supabase） ----------
     只在 lesson.js 注入 D.track = {url, key} 的週次啟用（lib/tracking.json 的 weeks）；
     其他週 TRACK.on 為 false，send() 是空函式，教材行為完全不變。
     只送「學號代碼」與互動事件，不送姓名。送失敗就丟掉，不重試、不阻擋教材。 */
  var CTX = { mod: null, bi: 0 };   // 目前正在渲染的模組 id 與區塊序號（render 是同步的）
  var TRACK = (function () {
    var cfg = D.track;
    var noop = function () {};
    if (!cfg || !cfg.url || !cfg.key) return { on: false, send: noop, flush: noop, code: function () { return ""; }, setCode: noop };
    var KEY = "ifs_code", DKEY = "ifs_device";
    var rnd = function () { return Math.random().toString(36).slice(2, 10); };
    var sid = rnd() + Date.now().toString(36);
    // device_id：同一支手機／瀏覽器跨次開頁不變。學生後來才填學號代碼時，先前的 anon 事件可靠它回接。
    var did = "";
    try { did = localStorage.getItem(DKEY) || ""; if (!did) { did = "d" + rnd() + rnd(); localStorage.setItem(DKEY, did); } } catch (e) { did = "d" + rnd(); }
    var q = [], timer = null;
    function code() { try { return (localStorage.getItem(KEY) || "").trim(); } catch (e) { return ""; } }
    function setCode(v) { try { localStorage.setItem(KEY, (v || "").trim().slice(0, 20)); } catch (e) {} }
    function cut(s, n) { return s == null ? null : String(s).slice(0, n); }
    // 欄位長度與 payload 大小在前端先截到資料表 CHECK 的上限：PostgREST 批次 INSERT 是原子的，
    // 一筆違反 CHECK 整批都會被拒，而我們失敗即丟，會靜默掉整個 4 秒窗口。
    function send(event, mod, block, payload) {
      var p = payload || {};
      var ps = JSON.stringify(p);
      if (ps.length > 1800) p = { trunc: true, keys: Object.keys(p).slice(0, 10) };
      q.push({
        student_code: cut(code(), 20) || "anon", device_id: cut(did, 40), week: D.week || 0,
        module_id: cut(mod, 30), block_type: cut(block, 10), event: cut(event, 30),
        payload: p, session_id: cut(sid, 40), build: cut(D.build, 16), client_ts: new Date().toISOString(),
      });
      if (q.length >= 40) flush();
      else if (!timer) timer = setTimeout(flush, 4000);
    }
    function flush() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!q.length) return;
      var body = JSON.stringify(q.splice(0, 50));
      try {
        fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/ifs_lesson_events", {
          method: "POST", keepalive: true, body: body,
          headers: { "Content-Type": "application/json", "apikey": cfg.key, "Prefer": "return=minimal" },
        }).catch(noop);
      } catch (e) { /* 舊瀏覽器沒有 fetch：不記錄 */ }
      if (q.length) timer = setTimeout(flush, 1000);
    }
    window.addEventListener("pagehide", flush);
    return { on: true, send: send, flush: flush, code: code, setCode: setCode };
  })();

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function colorAt(given, i) { return given || SERIES[i % SERIES.length]; }
  function gridCls(n) { return "grid g" + (n === 2 || n === 3 || n === 4 ? n : 3); }
  function listHtml(v) {
    // body 可以是字串或字串陣列；陣列渲染成 <ul>
    if (v == null) return "";
    if (typeof v === "string") return '<p>' + v + '</p>';
    return '<ul>' + v.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
  }

  /* ---------- 區塊標題 ---------- */
  function heading(frag, b) {
    if (b.title) frag.appendChild(el("div", "sec-title", '<span class="bar"></span>' + b.title));
    if (b.hint) frag.appendChild(el("div", "hint", b.hint));
  }

  /* ---------- 各區塊 ---------- */
  var BLOCKS = {};

  BLOCKS.flips = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (d, i) {
      var c = colorAt(d.c, i);
      var card = el("div", "flip");
      if (b.h) card.style.height = b.h + "px";
      card.innerHTML =
        '<div class="flip-in">' +
        '<div class="face front"><div class="cbar" style="background:' + c + '"></div>' +
        '<div class="t">' + d.t + '</div><div class="en">' + (d.en || "") + '</div>' +
        '<div class="tap">▸ ' + U("點我看解釋", "Chạm để xem") + '</div></div>' +
        '<div class="face back"><div class="cbar" style="background:' + c + '"></div>' +
        '<p>' + d.b + '</p></div></div>';
      var mod = CTX.mod, bi = CTX.bi;
      card.onclick = function () {
        if (card.classList.toggle("on")) TRACK.send("flip_open", mod, "flips", { b: bi, i: i, t: d.t });
      };
      g.appendChild(card);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.exp = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div");
    b.items.forEach(function (t, i) {
      var box = el("div", "exp");
      var res = t.res ? '<div style="margin-top:10px;font-size:13px;color:var(--secondary);font-weight:700">🔗 ' + t.res + '</div>' : "";
      box.innerHTML =
        '<button><span class="num">' + (i + 1) + '</span><span>' + t.h + '</span>' +
        '<span class="tag">' + (t.tag || "") + '</span><span class="chev">›</span></button>' +
        '<div class="body">' + listHtml(t.body) + res + '</div>';
      var body = box.querySelector(".body");
      var mod = CTX.mod, bi = CTX.bi;
      box.querySelector("button").onclick = function () {
        var on = box.classList.toggle("on");
        if (!on) { body.style.maxHeight = "0px"; return; }
        TRACK.send("exp_open", mod, "exp", { b: bi, i: i, h: t.h });
        // 用實際內容高度展開，避免長段落被固定 max-height 截掉。
        // 必須先解除 max-height 再量：在 max-height:0 的狀態下量 scrollHeight 會得到 0，
        // 面板就只會開一條縫（實測過）。量完歸零並強制重排，transition 才有起點。
        body.style.maxHeight = "none";
        var h = body.scrollHeight;
        body.style.maxHeight = "0px";
        void body.offsetHeight;
        body.style.maxHeight = h + "px";
      };
      host.appendChild(box);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.cards = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var box = el("div", "card");
      box.style.borderTop = "4px solid " + accent;
      box.innerHTML = '<div class="h">' + c.h + '</div>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        (c.li ? '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>' : "") +
        (c.p ? '<p style="margin-top:8px;font-size:15.5px;color:var(--mid)">' + c.p + '</p>' : "");
      g.appendChild(box);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.timeline = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "tl");
    b.steps.forEach(function (s, i) {
      var st = el("div", "step");
      st.innerHTML = '<div class="dot" style="background:' + colorAt(s.c, i) + '">' + (i + 1) + '</div>' +
        '<h4>' + s.h + '</h4><p>' + s.p + '</p>';
      host.appendChild(st);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.compare = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "cmp");
    [b.left, b.right].forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var col = el("div", "col");
      col.innerHTML = '<div class="cbar" style="background:' + accent + '"></div>' +
        '<h4 style="color:' + accent + '">' + c.h + '</h4>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
      wrap.appendChild(col);
    });
    f.appendChild(wrap);
    if (b.note) f.appendChild(el("div", "cmp-note", b.note));
    return f;
  };

  BLOCKS.table = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "tblwrap");
    var html = '<table class="tbl"><thead><tr>' +
      b.head.map(function (h) { return '<th>' + h + '</th>'; }).join("") + '</tr></thead><tbody>' +
      b.rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join("") + '</tr>';
      }).join("") + '</tbody></table>';
    wrap.innerHTML = html;
    f.appendChild(wrap); return f;
  };

  BLOCKS.note = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    f.appendChild(el("div", "note" + (b.kind ? " " + b.kind : ""), b.text));
    return f;
  };

  BLOCKS.match = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "match-wrap");
    var pool = el("div", "pool"), targets = el("div", "targets");
    var pairs = b.pairs;
    var order = pairs.slice().sort(function () { return Math.random() - 0.5; });
    var selected = null, solved = 0, errors = 0, t0 = null;
    var mod = CTX.mod, bi = CTX.bi;
    var msg = el("div");
    msg.style.cssText = "margin-top:14px;font-weight:700;color:var(--green)";

    function tryMatch(slot, key) {
      if (slot.classList.contains("ok")) return;
      if (t0 === null) t0 = Date.now();
      if (slot.dataset.k === key) {
        slot.classList.add("ok"); slot.classList.remove("bad");
        slot.querySelector(".drop").textContent = key;
        var chip = pool.querySelector('.chip[data-k="' + key + '"]');
        chip.classList.add("used"); chip.classList.remove("sel");
        selected = null; solved++;
        TRACK.send("match_ok", mod, "match", { b: bi, label: key });
        if (solved === pairs.length) {
          msg.textContent = b.done || U("✓ 全部答對！", "Đúng hết!");
          TRACK.send("match_done", mod, "match", { b: bi, n: pairs.length, errors: errors, ms: Date.now() - t0 });
        }
      } else {
        errors++;
        TRACK.send("match_bad", mod, "match", { b: bi, label: key, slot: slot.dataset.k });
        slot.classList.add("bad");
        setTimeout(function () { slot.classList.remove("bad"); }, 350);
      }
    }
    order.forEach(function (q) {
      var c = el("div", "chip"); c.textContent = q.label; c.draggable = true; c.dataset.k = q.label;
      c.addEventListener("dragstart", function (e) { e.dataTransfer.setData("k", q.label); });
      c.onclick = function () {
        if (c.classList.contains("used")) return;
        if (selected === c) { c.classList.remove("sel"); selected = null; return; }
        pool.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("sel"); });
        c.classList.add("sel"); selected = c;
      };
      pool.appendChild(c);
    });
    pairs.forEach(function (q) {
      var s = el("div", "slot"); s.dataset.k = q.label;
      s.innerHTML = '<div class="drop">' + U("拖到這裡", "Kéo vào đây") + '</div><div class="desc">' + q.desc + '</div>';
      s.addEventListener("dragover", function (e) { e.preventDefault(); });
      s.addEventListener("drop", function (e) { e.preventDefault(); tryMatch(s, e.dataTransfer.getData("k")); });
      s.onclick = function () { if (selected) tryMatch(s, selected.dataset.k); };
      targets.appendChild(s);
    });
    host.appendChild(pool); host.appendChild(targets); host.appendChild(msg);
    f.appendChild(host); return f;
  };

  /* 結果代碼：把作答結果編成一串可貼給老師的代碼（FSQ1.<base64>.<檢查碼>）。
     解碼與彙整用專案根目錄的「食品科學概論_測驗成績解碼器.html」。 */
  function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
  function checksum(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1679616; // 36^4
    return h.toString(36);
  }

  BLOCKS.quiz = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var items = b.items, n = items.length;
    var head = el("div", "quiz-head");
    head.innerHTML =
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
      '<input class="qid" placeholder="' + U("學號（交成績必填）", "Mã số SV") + '" style="flex:1;min-width:130px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px">' +
      '<input class="qname" placeholder="' + U("姓名", "Họ tên") + '" style="flex:1;min-width:100px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px"></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
      '<strong class="qprog">' + U("進度", "Tiến độ") + ' 0 / ' + n + '</strong>' +
      '<span class="qscore" style="color:var(--secondary);font-weight:800">' + U("得分", "Điểm") + ' 0</span></div>' +
      '<div class="pbar"><div class="pfill"></div></div>';
    var box = el("div");
    var sb = el("div", "scorebox");
    sb.innerHTML = '<div>' + U("你的成績", "Điểm của bạn") + '</div><div class="big"><span class="fscore">0</span> / ' + n + '</div>' +
      '<div class="smsg" style="margin:8px 0 16px"></div>' +
      '<div class="rcwrap" style="margin:0 auto 16px;max-width:560px;text-align:left">' +
      '<div style="font-weight:700;margin-bottom:6px">' + U("結果代碼（請複製後，貼到老師指定的表單或訊息）", "— Mã kết quả: sao chép và gửi cho thầy/cô") + '</div>' +
      '<textarea class="rcode" readonly rows="3" style="width:100%;box-sizing:border-box;font-family:monospace;font-size:12px;padding:8px;border:1.5px solid var(--line,#ccc);border-radius:8px;resize:none"></textarea>' +
      '<div class="rmsg" style="font-size:13px;color:#B34700;margin-top:4px"></div>' +
      '<button class="btn copyrc" style="margin-top:8px">📋 ' + U("複製結果代碼", "Sao chép mã") + '</button></div>' +
      '<button class="btn ghost">' + U("重新測驗", "Làm lại") + '</button>';

    var answered = 0, score = 0, picks = [], qt0 = null, attempt = 0;
    var mod = CTX.mod, bi = CTX.bi;
    // 測驗的學號欄與頁首的學號代碼同步（兩邊填任一邊都行）
    var qidInput = head.querySelector(".qid");
    if (TRACK.on) {
      if (TRACK.code()) qidInput.value = TRACK.code();
      qidInput.addEventListener("change", function () {
        TRACK.setCode(qidInput.value);
        var top = $("#ifs-code"); if (top) top.value = TRACK.code();
      });
    }
    function updateProg() {
      head.querySelector(".qprog").textContent = U("進度", "Tiến độ") + " " + answered + " / " + n;
      head.querySelector(".qscore").textContent = U("得分", "Điểm") + " " + score;
      head.querySelector(".pfill").style.width = (answered / n * 100) + "%";
    }
    function finish() {
      sb.querySelector(".fscore").textContent = score;
      var pct = score / n, m;
      if (score === n) m = U("本次全對！再用自己的話說明餅乾案例的觀察、推論與證據。", "Đúng hết lần này! Hãy giải thích tình huống bằng lời của mình.");
      else if (pct >= 0.8) m = U("很棒！觀念相當扎實。", "Rất tốt!");
      else if (pct >= 0.6) m = U("不錯，再複習幾個弱點就更好。", "Khá tốt, ôn lại vài chỗ nữa nhé.");
      else m = U("建議回到前面單元再看一次翻卡與展開內容。", "Hãy xem lại các phần phía trước.");
      sb.querySelector(".smsg").textContent = m;

      var sid = head.querySelector(".qid").value.trim();
      var sname = head.querySelector(".qname").value.trim();
      var korr = items.map(function (item, i) { return picks[i] === item.a ? 1 : 0; }).join("");
      var payload = JSON.stringify({
        w: D.week || 0, c: A2 ? "a2" : undefined, id: sid, nm: sname, s: score, n: n,
        a: picks, k: korr, t: new Date().toISOString().slice(0, 16),
      });
      var body = b64utf8(payload);
      var code = "FSQ1." + body + "." + checksum(body);
      sb.querySelector(".rcode").value = code;
      sb.querySelector(".rmsg").textContent = sid ? "" : U("⚠ 尚未填學號 —— 請回到測驗上方填入學號後重新測驗，否則老師無法登記成績。", "Chưa nhập mã số SV: hãy nhập ở trên rồi làm lại.");
      TRACK.send("quiz_done", mod, "quiz", { b: bi, attempt: attempt, score: score, n: n, picks: picks, ms: qt0 ? Date.now() - qt0 : null });
      TRACK.flush();

      sb.classList.add("show");
      sb.scrollIntoView({ behavior: "smooth" });
    }
    function pick(qel, item, oi) {
      if (qel.dataset.done === "1") return;
      qel.dataset.done = "1"; answered++;
      if (qt0 === null) qt0 = Date.now();
      picks[parseInt(qel.dataset.qi, 10)] = oi;
      TRACK.send("quiz_answer", mod, "quiz", { b: bi, attempt: attempt, qi: parseInt(qel.dataset.qi, 10), pick: oi, ok: oi === item.a });
      qel.querySelectorAll(".opt").forEach(function (btn, i) {
        btn.classList.add("dim");
        if (i === item.a) btn.classList.add("correct");
        if (i === oi && oi !== item.a) btn.classList.add("wrong");
      });
      var fb = qel.querySelector(".fb");
      if (oi === item.a) { score++; fb.classList.add("good"); fb.innerHTML = U("✓ 正確！", "Đúng!") + item.e; }
      else { fb.classList.add("no"); fb.innerHTML = U("✗ 正解：", "Sai. Đáp án:") + item.o[item.a] + "。" + item.e; }
      fb.classList.add("show"); updateProg();
      if (answered === n) finish();
    }
    function build() {
      box.innerHTML = ""; answered = 0; score = 0; picks = []; qt0 = null; attempt++; updateProg();
      sb.classList.remove("show");
      items.forEach(function (item, qi) {
        var qel = el("div", "q"); qel.dataset.done = "0"; qel.dataset.qi = qi;
        qel.innerHTML = '<div class="qn">第 ' + (qi + 1) + ' 題' + (A2 ? ' · Câu ' + (qi + 1) : '') + '</div><div class="qt">' + item.q + '</div>';
        item.o.forEach(function (opt, oi) {
          var btn = el("button", "opt"); btn.textContent = opt;
          btn.onclick = function () { pick(qel, item, oi); };
          qel.appendChild(btn);
        });
        qel.appendChild(el("div", "fb"));
        box.appendChild(qel);
      });
    }
    sb.querySelector(".copyrc").onclick = function () {
      var ta = sb.querySelector(".rcode");
      ta.select(); ta.setSelectionRange(0, 99999);
      var btn = this;
      function ok() { btn.textContent = U("✓ 已複製，請貼給老師", "Đã sao chép"); setTimeout(function () { btn.textContent = "📋 " + U("複製結果代碼", "Sao chép mã"); }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(ta.value).then(ok, function () { document.execCommand("copy"); ok(); });
      else { document.execCommand("copy"); ok(); }
    };
    sb.querySelector(".ghost").onclick = function () {
      build(); window.scrollTo({ top: 0, behavior: "smooth" });
    };
    build();
    f.appendChild(head); f.appendChild(box); f.appendChild(sb);
    return f;
  };

  /* ---------- 組裝 ---------- */
  var nav = $("#nav"), main = $("#main");
  var curMod = D.modules.length ? D.modules[0].id : null, modT0 = Date.now();
  function switchMod(id, btn) {
    document.querySelectorAll(".module").forEach(function (m) { m.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
    nav.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
    btn.classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (id !== curMod) {
      TRACK.send("module_view", id, null, { from: curMod, ms: Date.now() - modT0 });
      curMod = id; modT0 = Date.now();
    }
  }
  D.modules.forEach(function (m, i) {
    var btn = el("button", i === 0 ? "active" : "", m.nav);
    btn.onclick = function () { switchMod(m.id, btn); };
    nav.appendChild(btn);

    var sec = el("section", "module" + (i === 0 ? " active" : ""));
    sec.id = m.id;
    sec.appendChild(el("div", "lead",
      '<div class="kicker">' + m.kicker + '</div><h2>' + m.h2 + '</h2><p>' + m.lead + '</p>'));
    m.blocks.forEach(function (b, bi) {
      var render = BLOCKS[b.type];
      if (!render) { console.error("未知區塊型別:", b.type); return; }
      CTX.mod = m.id; CTX.bi = bi;
      sec.appendChild(render(b));
    });
    main.appendChild(sec);
  });

  /* ---------- 學號代碼列（只在啟用記錄的週出現） ---------- */
  if (TRACK.on) {
    var bar = el("div", "codebar");
    bar.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;font-size:14px";
    bar.innerHTML = '<label for="ifs-code" style="font-weight:700">學號代碼</label>' +
      '<input id="ifs-code" maxlength="20" placeholder="例：S001" style="width:120px;padding:6px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:14px">' +
      '<span style="opacity:.75">只記錄你的學習歷程（翻卡、配對、測驗），不需要姓名。</span>';
    nav.parentNode.insertBefore(bar, nav);
    var inp = bar.querySelector("#ifs-code");
    inp.value = TRACK.code();
    inp.addEventListener("change", function () {
      TRACK.setCode(inp.value);
      document.querySelectorAll(".qid").forEach(function (x) { x.value = TRACK.code(); });
      TRACK.send("code_set", null, null, {});
    });
    TRACK.send("session_start", curMod, null, {
      device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || "") ? "mobile" : "desktop",
      w: window.innerWidth, build: D.build || null,
    });
    // 停留時間以「頁面可見」為準：切到背景就結算一段 module_leave，回來重新計時。
    // 手機瀏覽器殺分頁常不觸發 pagehide，所以以 visibilitychange→hidden 為主。
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        TRACK.send("module_leave", curMod, null, { ms: Date.now() - modT0 }); TRACK.flush();
      } else {
        modT0 = Date.now();
      }
    });
  }
})();
</script>
</body>
</html>
