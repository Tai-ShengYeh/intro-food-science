        }

<script>
const META={"width": 1920, "height": 1080, "duration": 96.792, "scenes": [{"index": 0, "start": 0.0, "end": 13.256, "title": "算保留，要用同一批原料", "pause": false}, {"index": 1, "start": 13.256, "end": 27.343, "title": "菜與湯，分開量再相加", "pause": false}, {"index": 2, "start": 27.343, "end": 41.776, "title": "只吃菜，保留多少", "pause": true}, {"index": 3, "start": 41.776, "end": 56.124, "title": "答案：只計菜是30%", "pause": false}, {"index": 4, "start": 56.124, "end": 70.528, "title": "喝湯，也不能還原已分解部分", "pause": false}, {"index": 5, "start": 70.528, "end": 84.365, "title": "標示每100 mL有20 mg", "pause": true}, {"index": 6, "start": 84.365, "end": 96.792, "title": "答案：一整瓶50 mg", "pause": false}]};

const speed=()=>Number(document.querySelector('#speed').value);
