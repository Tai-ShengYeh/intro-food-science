<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品科學概論 第16週 · 互動教學</title>
<style>
  :root{
    --primary:#2D2A6E; --secondary:#5B4FB8; --accent:#00B8B8; --warm:#F5A623; --green:#2FA36B; --red:#D65B5B; --dark:#1A1A3E; --bg:#F4F5FA; --text:#1F1F2E; --mid:#5A5A75; --muted:#9096ac; --border:#E2E2EC; --card:#fff;
  }
/* 版型樣式 — 逐條取自「第1週_互動教學.html」，末段為新增區塊（cmp / tbl / note）。
   這裡只用 var(--x)；色票由 tokens.js 產生 :root 注入。 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:17px}
header{background:linear-gradient(120deg,var(--dark),var(--primary));color:#fff;
  padding:26px 22px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(0,0,0,.15)}
header h1{font-size:31px;font-weight:800;letter-spacing:.5px}
header .sub{color:#b9c7ff;font-size:16px;margin-top:5px}
nav{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.10);color:#dfe4ff;border:none;padding:12px 18px;
  border-radius:10px 10px 0 0;font-size:16.5px;cursor:pointer;font-weight:600;transition:.15s}
nav button:hover{background:rgba(255,255,255,.2)}
nav button.active{background:var(--bg);color:var(--primary)}
main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
.module{display:none;animation:fade .35s}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead{background:var(--dark);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:22px}
.lead .kicker{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px}
.lead h2{font-size:26px;margin:6px 0 8px}
.lead p{color:#cdd3ee;font-size:16.5px}
.sec-title{font-size:23px;font-weight:800;color:var(--primary);margin:30px 0 6px;
  display:flex;align-items:center;gap:10px}
.sec-title .bar{width:6px;height:25px;background:var(--accent);border-radius:3px;display:inline-block}
.hint{color:var(--mid);font-size:15px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* flip cards */
.flip{perspective:1100px;height:200px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px rgba(30,30,60,.08);border:1px solid var(--border)}
.front{background:var(--card)}
.front .t{font-size:21px;font-weight:800;color:var(--primary)}
.front .en{color:var(--muted);font-size:14px;margin-top:3px;font-style:italic}
.front .tap{margin-top:auto;color:var(--accent);font-size:14px;font-weight:700}
.back{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;transform:rotateY(180deg);overflow:auto}
.back p{font-size:16px}
.cbar{height:6px;border-radius:14px 14px 0 0;position:absolute;top:0;left:0;right:0}

/* expandable */
.exp{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.exp>button{width:100%;text-align:left;background:none;border:none;padding:16px 18px;cursor:pointer;
  display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;color:var(--text)}
.exp .num{background:var(--primary);color:#fff;min-width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.exp .chev{margin-left:auto;color:var(--muted);transition:.25s;font-size:20px}
.exp.on .chev{transform:rotate(90deg);color:var(--accent)}
.exp .body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 18px}
.exp.on .body{padding:0 18px 16px 62px}
.exp .body ul{margin-left:16px;color:var(--mid);font-size:16px}
.exp .body p{color:var(--mid);font-size:15.5px}
.exp .tag{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:8px}

/* info card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.card .h{font-weight:800;color:var(--primary);font-size:18px;margin-bottom:6px}
.card .en{color:var(--muted);font-size:13px;font-style:italic}
.card ul{margin:8px 0 0 18px;font-size:15.5px;color:var(--mid)}

/* timeline */
.tl{display:flex;gap:0;flex-wrap:wrap;counter-reset:s}
.tl .step{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 14px 14px;margin:8px;position:relative}
.tl .dot{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;margin-bottom:8px}
.tl .step h4{color:var(--primary);font-size:17.5px;margin-bottom:4px}
.tl .step p{font-size:15px;color:var(--mid)}

/* matching */
.match-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.pool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--secondary);color:#fff;padding:10px 17px;border-radius:22px;font-weight:700;
  cursor:grab;user-select:none;font-size:16.5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chip.used{opacity:.35;pointer-events:none}
.chip.sel{outline:3px solid var(--warm);outline-offset:2px}
.targets{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;border:2px dashed var(--border);border-radius:12px;padding:10px 14px;background:#fafbff}
.slot .desc{flex:1;font-size:16px;color:var(--text)}
.slot .drop{min-width:130px;min-height:44px;border-radius:8px;background:#eef0f8;display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:15px;padding:8px 12px}
.slot.ok{border-color:var(--green);background:#effaf3}
.slot.ok .drop{background:var(--green);color:#fff;font-weight:700}
.slot.bad{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* quiz */
.quiz-head{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.pbar{height:12px;background:#e7e9f4;border-radius:8px;overflow:hidden;margin-top:10px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--secondary));transition:width .4s}
.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.q .qn{color:var(--accent);font-weight:800;font-size:14px}
.q .qt{font-size:19.5px;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fafbff;border:2px solid var(--border);
  border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;font-size:16.5px;transition:.15s}
.opt:hover{border-color:var(--secondary)}
.opt.correct{border-color:var(--green);background:#effaf3;font-weight:700}
.opt.wrong{border-color:var(--red);background:#fdeeee}
.opt.dim{opacity:.6}
.fb{margin-top:8px;font-size:15.5px;padding:11px 14px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.good{background:#effaf3;color:#1c7a4d} .fb.no{background:#fdeeee;color:#a83b3b}
.scorebox{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:16px;
  padding:26px;text-align:center;margin-top:10px;display:none}
.scorebox.show{display:block}
.scorebox .big{font-size:46px;font-weight:800}
.btn{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:10px;
  font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.18)}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;background:#eef0fb;color:var(--secondary);padding:3px 10px;border-radius:20px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px}

/* ===== 新增區塊 ===== */
/* compare：兩欄對照（梅納 vs 焦糖化、冷藏 vs 冷凍…） */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media(max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 18px 18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06);position:relative;overflow:hidden}
.cmp .col .cbar{position:static;height:6px;margin:0 -18px 14px;border-radius:0}
.cmp .col h4{font-size:20px;font-weight:800;margin-bottom:2px}
.cmp .col .en{color:var(--muted);font-size:13px;font-style:italic;margin-bottom:8px}
.cmp .col ul{margin-left:18px;font-size:15.5px;color:var(--mid)}
.cmp .col li{margin-bottom:5px}
.cmp-note{margin-top:12px;background:#eef0fb;border-left:5px solid var(--secondary);
  border-radius:0 10px 10px 0;padding:12px 16px;font-size:16px;color:var(--primary);font-weight:600}

/* table：資料表（維生素、添加物分類…） */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px}
.tbl th{background:var(--primary);color:#fff;text-align:left;padding:12px 14px;font-weight:700;font-size:15px}
.tbl td{padding:11px 14px;border-top:1px solid var(--border);color:var(--mid);vertical-align:top}
.tbl tr:nth-child(even) td{background:#fafbff}
.tbl td:first-child{color:var(--text);font-weight:700}

/* note：重點提示條 */
.note{background:#fff8e9;border-left:5px solid var(--warm);border-radius:0 12px 12px 0;
  padding:14px 18px;margin:14px 0;font-size:16px;color:var(--text)}
.note b{color:var(--primary)}
.note.key{background:#effaf3;border-left-color:var(--green)}
.note.warn{background:#fdeeee;border-left-color:var(--red)}
/* 國合班 A2 互動練習：拼音與越南文（build_a2.js 產生的內容才會用到） */
.py{display:block;font-size:.78em;font-weight:500;color:var(--mid);margin-top:2px}
.vn{display:block;font-size:.88em;font-weight:500;color:var(--secondary);margin-top:2px}
/* Shared classroom tasks: oral response, sentence support, then sample explanation. */
.class-activity{display:grid;gap:12px;min-width:0}
.class-activity .vn{display:block;color:#0E7C7B;font-size:15px;line-height:1.5;margin-top:4px}
.activity-time{color:#0E7C7B;font-weight:700;font-size:15px}
.activity-prompt{font-size:clamp(18px,2.3vw,23px);line-height:1.5}
.sentence-stem{padding:12px 16px;background:#EFFAF3;border-left:5px solid #2FA36B;color:#1A1A3E;line-height:1.6}
.class-activity label{font-size:14px;color:#52526B}
.activity-response{display:block;width:100%;max-width:100%;min-height:72px;border:1.5px solid #A0A0B5;border-radius:8px;padding:10px 12px;resize:vertical;font:inherit;font-size:17px;background:#fff;color:#1F1F2E}
.activity-answer{border:1px solid #E2E2EC;background:#fff;border-radius:8px;padding:10px 14px;font-size:16px;line-height:1.5}
.activity-answer summary{cursor:pointer;font-weight:700;color:#2D2A6E}
.activity-answer p{margin-top:10px}
.activity-response:focus-visible,.activity-answer summary:focus-visible{outline:3px solid #0E7C7B;outline-offset:3px}
.source-note{font-size:13px;color:#52526B;line-height:1.5;overflow-wrap:anywhere;margin-top:10px}
.source-note .vn{display:block;color:#0E7C7B;font-size:13px}
.lesson-links{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.lesson-links a{color:inherit;text-underline-offset:3px}
.feedback-reason,.feedback-transfer{margin-top:6px}
.feedback-transfer{font-weight:600}
@media(max-width:640px){header{position:relative!important}.class-activity{gap:10px}}
@media print{.activity-response{min-height:64px}}


.back .vn{color:#D7FAF3}.tbl-wrap{overflow-x:auto}
</style>
</head>

<header>

<script>window.__LESSON__={"week":16,"series":["#2D2A6E","#2FA36B","#F5A623","#5B4FB8","#00B8B8","#D65B5B"],"modules":[{"id":"m-func","nav":"功能與材料","kicker":"MODULE 1 · 材料","h2":"包裝：材料、整包性能與使用條件","lead":"以洋芋片串起吸濕、氧化、氣體與廢棄處理；包裝與製程、配方及流通共同作用，不是所有食品都追求最高阻隔。","blocks":[{"type":"cards","title":"一包洋芋片：包裝要做什麼？\u003cspan class=\"vn\" lang=\"vi\">Một gói snack khoai tây: bao bì làm gì?\u003c/span>","cols":3,"items":[{"h":"① 防氧化與吸濕\u003cspan class=\"vn\" lang=\"vi\">Chống oxy hóa, hút ẩm\u003c/span>","p":"油脂怕氧化、脆度怕吸濕；材料與密封都重要。\u003cspan class=\"vn\" lang=\"vi\">Dầu dễ oxy hóa, độ giòn bị ẩm; vật liệu và kín đều quan trọng.\u003c/span>","c":"#2D2A6E"},{"h":"② 氣體與保護\u003cspan class=\"vn\" lang=\"vi\">Khí và bảo vệ\u003c/span>","p":"充氮可降低氧接觸並緩衝；仍有殘氧、滲透與漏封問題。\u003cspan class=\"vn\" lang=\"vi\">Nitơ giúp giảm oxy, đệm; vẫn có oxy dư, thấm, rò kín.\u003c/span>","c":"#2D2A6E"},{"h":"③ 使用後去哪裡？\u003cspan class=\"vn\" lang=\"vi\">Sau dùng đi đâu?\u003c/span>","p":"查袋材、污染與當地回收系統，不只看一個標誌。\u003cspan class=\"vn\" lang=\"vi\">Xem vật liệu túi, bẩn, hệ thống địa phương, không chỉ một biểu tượng.\u003c/span>","c":"#2D2A6E"}]},{"type":"cards","title":"包裝的四個功能\u003cspan class=\"vn\" lang=\"vi\">Bốn chức năng bao bì\u003c/span>","cols":4,"items":[{"h":"容納\u003cspan class=\"vn\" lang=\"vi\">Chứa đựng\u003c/span>","p":"定量、運輸與分裝；要配合食品及流通。\u003cspan class=\"vn\" lang=\"vi\">Định lượng, vận chuyển, chia phần; phù hợp thực phẩm, lưu thông.\u003c/span>","c":"#2D2A6E"},{"h":"保護\u003cspan class=\"vn\" lang=\"vi\">Bảo vệ\u003c/span>","p":"控制氣、水、光與碰撞等；封口也是保護的一部分。\u003cspan class=\"vn\" lang=\"vi\">Kiểm soát khí, ẩm, sáng, va chạm; đường kín cũng là một phần.\u003c/span>","c":"#2D2A6E"},{"h":"便利\u003cspan class=\"vn\" lang=\"vi\">Tiện lợi\u003c/span>","p":"易開、可再封或適當加熱；須依設計及使用標示。\u003cspan class=\"vn\" lang=\"vi\">Dễ mở, đóng lại, gia nhiệt phù hợp; theo thiết kế, nhãn dùng.\u003c/span>","c":"#2D2A6E"},{"h":"溝通\u003cspan class=\"vn\" lang=\"vi\">Thông tin\u003c/span>","p":"呈現成分、日期、責任廠商、警語與保存方式等。\u003cspan class=\"vn\" lang=\"vi\">Thể hiện thành phần, ngày, đơn vị, cảnh báo, bảo quản.\u003c/span>","c":"#2D2A6E"}]},{"type":"cards","title":"材料本體好，整包還要看封口\u003cspan class=\"vn\" lang=\"vi\">Vật liệu tốt, cả gói còn cần kín\u003c/span>","cols":4,"items":[{"h":"玻璃\u003cspan class=\"vn\" lang=\"vi\">Thủy tinh\u003c/span>","p":"瓶身對氣體、水氣阻隔高；仍要看瓶蓋、光與破損。\u003cspan class=\"vn\" lang=\"vi\">Thân cản khí, ẩm cao; vẫn xem nắp, ánh sáng, vỡ.\u003c/span>","c":"#2D2A6E"},{"h":"金屬\u003cspan class=\"vn\" lang=\"vi\">Kim loại\u003c/span>","p":"完整金屬層阻光、阻氣佳；接縫、針孔與塗層很重要。\u003cspan class=\"vn\" lang=\"vi\">Lớp kim loại nguyên cản sáng, khí tốt; mối nối, lỗ nhỏ, phủ quan trọng.\u003c/span>","c":"#2D2A6E"},{"h":"塑膠\u003cspan class=\"vn\" lang=\"vi\">Nhựa\u003c/span>","p":"阻隔性依聚合物、厚度、結構及溫濕度而變。\u003cspan class=\"vn\" lang=\"vi\">Cản tùy polymer, dày, cấu trúc, nhiệt ẩm.\u003c/span>","c":"#2D2A6E"},{"h":"紙與紙板\u003cspan class=\"vn\" lang=\"vi\">Giấy, bìa\u003c/span>","p":"提供結構與印刷；塗佈、積層會改變阻隔及回收特性。\u003cspan class=\"vn\" lang=\"vi\">Cho kết cấu, in; phủ, ghép đổi cản và tái chế.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"本體阻隔不等於整個包裝完全不透；要依食品、使用條件與完整包裝評估。\u003cspan class=\"vn\" lang=\"vi\">Cản của vật liệu không nghĩa cả gói không thấm; đánh giá theo thực phẩm, điều kiện, toàn gói.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/meat-and-poultry-packaging\" target=\"_blank\" rel=\"noopener\">包裝材料與適用條件 / Vật liệu và điều kiện: USDA FSIS ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"塑膠：材質名稱只是起點\u003cspan class=\"vn\" lang=\"vi\">Nhựa: tên vật liệu là điểm bắt đầu\u003c/span>","cols":4,"items":[{"h":"PE\u003cspan class=\"vn\" lang=\"vi\">PE\u003c/span>","p":"常有較好阻濕及熱封性；不等於阻氧也最好。\u003cspan class=\"vn\" lang=\"vi\">Thường cản ẩm, hàn tốt; không nghĩa cản oxy tốt nhất.\u003c/span>","c":"#2D2A6E"},{"h":"PET\u003cspan class=\"vn\" lang=\"vi\">PET\u003c/span>","p":"常提供透明與強度；熱充填或微波適用性依實際產品。\u003cspan class=\"vn\" lang=\"vi\">Thường trong, bền; dùng rót nóng, vi sóng tùy sản phẩm cụ thể.\u003c/span>","c":"#2D2A6E"},{"h":"PP\u003cspan class=\"vn\" lang=\"vi\">PP\u003c/span>","p":"常用於耐熱容器；不能只憑 PP 或回收碼 5 就判可微波。\u003cspan class=\"vn\" lang=\"vi\">Thường dùng hộp chịu nhiệt; không chỉ PP hay mã 5 mà suy dùng vi sóng.\u003c/span>","c":"#2D2A6E"},{"h":"EVOH\u003cspan class=\"vn\" lang=\"vi\">EVOH\u003c/span>","p":"常作阻氧層；濕度會影響表現，須配合結構設計。\u003cspan class=\"vn\" lang=\"vi\">Thường là lớp cản oxy; ẩm ảnh hưởng, cần thiết kế cấu trúc.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"加熱前看產品標示的溫度、微波及使用條件；本體、蓋子與其他部件可能不同。\u003cspan class=\"vn\" lang=\"vi\">Trước gia nhiệt xem nhãn nhiệt, vi sóng, cách dùng; thân, nắp, phần khác có thể khác.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/tc/includes/GetFile.ashx?id=f637414792135380934\" target=\"_blank\" rel=\"noopener\">容器微波使用 / Dùng vi sóng: TFDA ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"積層：各層負責不同任務\u003cspan class=\"vn\" lang=\"vi\">Màng ghép: mỗi lớp có nhiệm vụ\u003c/span>","cols":3,"items":[{"h":"支撐與印刷\u003cspan class=\"vn\" lang=\"vi\">Đỡ và in\u003c/span>","p":"紙或塑膠層可提供結構與印刷表面。\u003cspan class=\"vn\" lang=\"vi\">Lớp giấy, nhựa cho cấu trúc, bề mặt in.\u003c/span>","c":"#2D2A6E"},{"h":"阻隔層\u003cspan class=\"vn\" lang=\"vi\">Lớp cản\u003c/span>","p":"可用鋁箔、鍍層或阻隔聚合物；不是所有紙盒都相同。\u003cspan class=\"vn\" lang=\"vi\">Có thể lá nhôm, lớp phủ, polymer cản; không mọi hộp giống nhau.\u003c/span>","c":"#2D2A6E"},{"h":"接觸與封口層\u003cspan class=\"vn\" lang=\"vi\">Lớp tiếp xúc, hàn\u003c/span>","p":"需適合接觸食品、密封與處理條件；層數不是通用標準。\u003cspan class=\"vn\" lang=\"vi\">Phù hợp tiếp xúc thực phẩm, kín, xử lý; số lớp không là chuẩn chung.\u003c/span>","c":"#2D2A6E"}]},{"type":"cards","title":"OTR、WVTR：看單位與條件\u003cspan class=\"vn\" lang=\"vi\">OTR, WVTR: xem đơn vị, điều kiện\u003c/span>","cols":3,"items":[{"h":"OTR 透氧率\u003cspan class=\"vn\" lang=\"vi\">OTR: tốc độ truyền oxy\u003c/span>","p":"表示指定條件下氧氣的透過；比較時先對齊測試基準。\u003cspan class=\"vn\" lang=\"vi\">Truyền oxy ở điều kiện xác định; so phải cùng cơ sở thử.\u003c/span>","c":"#2D2A6E"},{"h":"WVTR 透濕率\u003cspan class=\"vn\" lang=\"vi\">WVTR: tốc độ truyền hơi nước\u003c/span>","p":"表示水蒸氣的透過；不是液態水漏出的速度。\u003cspan class=\"vn\" lang=\"vi\">Truyền hơi nước, không là tốc độ nước lỏng rò ra.\u003c/span>","c":"#2D2A6E"},{"h":"還看面積與封口\u003cspan class=\"vn\" lang=\"vi\">Còn diện tích, kín\u003c/span>","p":"相同條件下數值較低，對該項阻隔較好；不直接等於更長期限。\u003cspan class=\"vn\" lang=\"vi\">Cùng điều kiện, số thấp hơn cản chất đó tốt hơn; không tự là hạn dài hơn.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"要記錄溫度、濕度、厚度、壓差及方法等；OTR、WVTR 與透過係數不能混用。\u003cspan class=\"vn\" lang=\"vi\">Ghi nhiệt, ẩm, độ dày, chênh áp, phương pháp; không trộn OTR, WVTR với hệ số thấm.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.ams.usda.gov/sites/default/files/media/CID%20Therapeutic%20Food%2C%20Ready-To-Use.pdf\" target=\"_blank\" rel=\"noopener\">指定產品的測試條件例 / Ví dụ điều kiện thử: USDA AMS ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 1｜同條件，比較進氧量\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 1: Cùng điều kiện, so lượng oxy vào\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"barrier\">\u003cp class=\"activity-time\">3 分鐘 / 3 phút\u003c/p>\u003cp class=\"activity-prompt\">假設同一測試條件、固定驅動差：膜 A 的 OTR＝2 cm³/m²/天，B＝8。袋膜總面積 0.1 m²，10 天，只算膜透過，A、B 各多少？\u003cspan class=\"vn\" lang=\"vi\">Giả định cùng thử, chênh lệch thúc đẩy cố định: OTR A=2 cm³/m²/ngày, B=8. Tổng diện tích 0,1 m², 10 ngày, chỉ tính qua màng: mỗi loại bao nhiêu?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>進氧量＝OTR ×＿＿×＿＿；A＝＿＿，B＝＿＿cm³。\u003cspan class=\"vn\" lang=\"vi\">Oxy vào=OTR ×___×___; A=___, B=___cm³.\u003c/span>\u003c/div>\u003clabel for=\"general-w16-barrier\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w16-barrier\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>A＝2×0.1×10＝2 cm³；B＝8 cm³，此假設下 A 膜的進氧較少。\u003cspan class=\"vn\" lang=\"vi\">A=2×0,1×10=2 cm³; B=8 cm³, theo giả định A ít oxy vào hơn.\u003c/span>\u003c/p>\u003cp>忽略原有殘氧、漏封、食品耗氧及條件變化；這不是可保存天數，也未比較 WVTR。\u003cspan class=\"vn\" lang=\"vi\">Bỏ qua oxy dư, rò, thực phẩm dùng oxy, đổi điều kiện; không là hạn ngày, chưa so WVTR.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"exp","title":"延伸：從材料本體到整個包裝","items":[{"h":"阻隔指標與條件","body":["OTR、WVTR 需標測試溫度、相對濕度、壓差、方法及單位。膜厚會影響結果；透過係數與透過率的正規化基準不同。","即使材料本體的氣體阻隔很高，封口、瓶蓋、針孔或搬運損傷仍可能成為弱點。整包表現也須驗證。"]},{"h":"假設模型的能力","body":["只有驅動差與條件等維持測試設定時，簡化以 OTR×面積×時間估算穿過膜的氧氣量；本課 A＝2、B＝8 cm³。","包內初始殘氧、漏封、食品耗氧、氣體溶解與條件變動都未計入，不把模型數字直接換成可安全保存天數。"]},{"h":"塑膠與積層的適用範圍","body":["PE、PP、PET、EVOH 的特性還受配方、加工、厚度與濕度影響；EVOH 的阻氧常需防潮設計，不等於受潮後絕對全失效。","鋁箔、鍍層及高阻隔聚合物可以不同組合搭配；無菌紙盒不全是固定六層。PP 不自動等於可微波，應讀各部件的使用條件。"]}]}]},{"id":"m-map","nav":"氣調與活性包裝","kicker":"MODULE 2 · 包裝技術","h2":"氣調、真空、活性與資訊","lead":"氣體組成須與食品、膜、溫度和時間匹配；充氣或抽氣不等於消除全部氧，更不是可靠殺菌步驟。","blocks":[{"type":"cards","title":"MAP 三種常用氣體\u003cspan class=\"vn\" lang=\"vi\">Ba khí thường dùng trong MAP\u003c/span>","cols":3,"items":[{"h":"氧氣 O₂\u003cspan class=\"vn\" lang=\"vi\">Oxy O₂\u003c/span>","p":"可影響肉色與蔬果呼吸，也可能促進氧化。\u003cspan class=\"vn\" lang=\"vi\">Ảnh hưởng màu thịt, hô hấp rau, có thể tăng oxy hóa.\u003c/span>","c":"#2D2A6E"},{"h":"二氧化碳 CO₂\u003cspan class=\"vn\" lang=\"vi\">CO₂\u003c/span>","p":"可抑制部分微生物；溶解與食品反應也影響效果。\u003cspan class=\"vn\" lang=\"vi\">Hạn chế vài vi sinh vật; hòa tan, tương tác thực phẩm ảnh hưởng.\u003c/span>","c":"#2D2A6E"},{"h":"氮氣 N₂\u003cspan class=\"vn\" lang=\"vi\">Nitơ N₂\u003c/span>","p":"相對惰性，可作填充、降氧與緩衝；不保證零氧。\u003cspan class=\"vn\" lang=\"vi\">Tương đối trơ, để đầy, giảm oxy, đệm; không bảo đảm hết oxy.\u003c/span>","c":"#2D2A6E"}]},{"type":"cards","title":"不同食品，要設計不同氣體條件\u003cspan class=\"vn\" lang=\"vi\">Thực phẩm khác cần thiết kế khí khác\u003c/span>","cols":3,"items":[{"h":"紅肉\u003cspan class=\"vn\" lang=\"vi\">Thịt đỏ\u003c/span>","p":"有高氧維色系統，也有低氧、真空等選擇；紅不等於安全。\u003cspan class=\"vn\" lang=\"vi\">Có hệ oxy cao giữ màu, cũng ít oxy, chân không; đỏ không bằng an toàn.\u003c/span>","c":"#2D2A6E"},{"h":"生鮮蔬果\u003cspan class=\"vn\" lang=\"vi\">Rau quả tươi\u003c/span>","p":"呼吸、溫度與膜透氣要匹配；不能套固定 3–5% 氧。\u003cspan class=\"vn\" lang=\"vi\">Cần khớp hô hấp, nhiệt, màng; không áp cố định 3–5% oxy.\u003c/span>","c":"#2D2A6E"},{"h":"洋芋片\u003cspan class=\"vn\" lang=\"vi\">Snack khoai tây\u003c/span>","p":"充氮配合阻氧、阻濕與密封；仍要控制原料與加工衛生。\u003cspan class=\"vn\" lang=\"vi\">Nitơ cùng cản oxy, ẩm, kín; vẫn vệ sinh nguyên liệu, xử lý.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"MAP 可用充氣等主動方式，也可依呼吸與膜透過形成被動氣調；氣體會隨時間改變。\u003cspan class=\"vn\" lang=\"vi\">MAP có thể chủ động bơm khí hay thụ động do hô hấp, truyền qua màng; khí đổi theo thời gian.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/Y4358E/y4358e07.htm\" target=\"_blank\" rel=\"noopener\">蔬果氣調與呼吸 / MAP và hô hấp: FAO ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 2｜零食袋能直接包生菜嗎？\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 2: Túi snack dùng ngay cho rau sống?\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"fit\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">為洋芋片選了低透氣的密封袋，就能用同一設計讓生菜放得一樣久嗎？需要哪兩種資料？\u003cspan class=\"vn\" lang=\"vi\">Đã chọn túi kín ít thấm khí cho snack, có dùng cùng thiết kế giữ rau sống lâu như vậy? Cần hai dữ liệu gì?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>洋芋片主要怕＿＿；生菜還會＿＿，需查＿＿。\u003cspan class=\"vn\" lang=\"vi\">Snack chủ yếu sợ ___; rau còn ___, cần xem ___.\u003c/span>\u003c/div>\u003clabel for=\"general-w16-fit\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w16-fit\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>不能直接套用。洋芋片看氧化、吸濕；生菜還呼吸，要看呼吸速率、溫度與膜透氣，避免不合適的低氧。\u003cspan class=\"vn\" lang=\"vi\">Không áp ngay; snack xem oxy hóa, ẩm; rau còn hô hấp, xem tốc độ hô hấp, nhiệt, truyền khí để tránh oxy thấp không phù hợp.\u003c/span>\u003c/p>\u003cp>包裝要配合食品與流通；阻隔不是越高就適合所有食品，也不以單一氣體比例保證安全。\u003cspan class=\"vn\" lang=\"vi\">Bao bì khớp thực phẩm, lưu thông; cản cao không hợp tất cả, một tỷ lệ khí không bảo đảm an toàn.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"真空與 MAP：減氧不等於殺菌\u003cspan class=\"vn\" lang=\"vi\">Chân không, MAP: giảm oxy không bằng diệt khuẩn\u003c/span>","cols":3,"items":[{"h":"真空\u003cspan class=\"vn\" lang=\"vi\">Chân không\u003c/span>","p":"降低包內空氣量，膜常貼近食品；不是把氧完全抽光。\u003cspan class=\"vn\" lang=\"vi\">Giảm khí trong gói, màng thường sát thực phẩm; không bỏ sạch oxy.\u003c/span>","c":"#2D2A6E"},{"h":"氣調 MAP\u003cspan class=\"vn\" lang=\"vi\">MAP\u003c/span>","p":"調整氣體組成；是否高氧、低氧及比例，依食品設計。\u003cspan class=\"vn\" lang=\"vi\">Điều chỉnh thành phần khí; nhiều, ít oxy, tỷ lệ tùy thực phẩm.\u003c/span>","c":"#2D2A6E"},{"h":"危害與保存\u003cspan class=\"vn\" lang=\"vi\">Nguy hại, bảo quản\u003c/span>","p":"部分厭氧菌可有風險；冷藏食品需時間溫度及其他控制。\u003cspan class=\"vn\" lang=\"vi\">Vài vi khuẩn kỵ khí có nguy cơ; đồ lạnh cần thời gian nhiệt và kiểm soát khác.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"商業常溫真空罐頭還有其他經驗證製程；不能說所有減氧包裝只靠冷藏就足夠，或一定都需冷藏。\u003cspan class=\"vn\" lang=\"vi\">Đồ hộp chân không để thường còn quy trình kiểm chứng khác; không nói mọi giảm oxy chỉ lạnh là đủ hay luôn cần lạnh.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/meat-and-poultry-packaging\" target=\"_blank\" rel=\"noopener\">真空與氣調 / Chân không và MAP: USDA FSIS ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"活性、智慧與追溯資訊\u003cspan class=\"vn\" lang=\"vi\">Chủ động, thông minh, truy xuất\u003c/span>","cols":3,"items":[{"h":"活性包裝\u003cspan class=\"vn\" lang=\"vi\">Bao bì chủ động\u003c/span>","p":"脫氧、除濕等主動調整內部條件；效果看容量與系統。\u003cspan class=\"vn\" lang=\"vi\">Hút oxy, ẩm để chỉnh điều kiện; hiệu quả tùy khả năng, hệ thống.\u003c/span>","c":"#2D2A6E"},{"h":"智慧包裝\u003cspan class=\"vn\" lang=\"vi\">Bao bì thông minh\u003c/span>","p":"TTI 等提供特定時間溫度或品質指標的資訊。\u003cspan class=\"vn\" lang=\"vi\">TTI cho thông tin chỉ tiêu thời gian nhiệt hay chất lượng cụ thể.\u003c/span>","c":"#2D2A6E"},{"h":"不是安全通行證\u003cspan class=\"vn\" lang=\"vi\">Không là giấy bảo đảm an toàn\u003c/span>","p":"指示器有校正與適用範圍；QR 碼本身不會量測微生物。\u003cspan class=\"vn\" lang=\"vi\">Chỉ thị cần hiệu chuẩn, phạm vi; mã QR tự không đo vi sinh vật.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"TTI 可反映特定時間溫度反應，不能證明所有危害不存在；脫氧劑、乾燥劑應依包裝指示使用，不食用。\u003cspan class=\"vn\" lang=\"vi\">TTI phản ánh phản ứng thời gian nhiệt xác định, không chứng minh hết mọi nguy hại; dùng gói hút oxy, ẩm theo hướng dẫn, không ăn.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.efsa.europa.eu/sites/default/files/event/160308b/160308b-p9a.pdf\" target=\"_blank\" rel=\"noopener\">活性與智慧包裝概念 / Khái niệm: EFSA ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"選包裝：先問食品怕什麼\u003cspan class=\"vn\" lang=\"vi\">Chọn bao bì: thực phẩm cần bảo vệ gì?\u003c/span>","cols":3,"items":[{"h":"洋芋片\u003cspan class=\"vn\" lang=\"vi\">Snack khoai tây\u003c/span>","p":"防吸濕、氧化、破碎；包材結構不能只靠外觀認定。\u003cspan class=\"vn\" lang=\"vi\">Tránh ẩm, oxy hóa, vỡ; không xác định cấu trúc chỉ từ vẻ ngoài.\u003c/span>","c":"#2D2A6E"},{"h":"保久乳\u003cspan class=\"vn\" lang=\"vi\">Sữa UHT để thường\u003c/span>","p":"配合食品與無菌充填、阻隔及密封；開封後條件不同。\u003cspan class=\"vn\" lang=\"vi\">Phối hợp thực phẩm, rót vô trùng, cản, kín; sau mở khác điều kiện.\u003c/span>","c":"#2D2A6E"},{"h":"生鮮蔬果與魚露\u003cspan class=\"vn\" lang=\"vi\">Rau tươi, nước mắm\u003c/span>","p":"前者仍呼吸；後者看成分、光與接觸相容性，不只一種瓶材。\u003cspan class=\"vn\" lang=\"vi\">Rau còn hô hấp; nước mắm xem thành phần, sáng, tương thích, không chỉ một vật liệu.\u003c/span>","c":"#2D2A6E"}]},{"type":"exp","title":"延伸：氣體隨時間改變，指示器也有範圍","items":[{"h":"MAP 不只是換掉空氣","body":["主動氣體置換與被動呼吸／膜透過都可形成氣調；最終氣體組成隨食品呼吸、膜透過、溶解與溫度而變。","高氧紅肉維色系統是選項之一，不是所有紅肉都需高氧。低氧蔬果也無通用 3–5% 配方；過低氧或過高 CO₂ 可能傷害產品。"]},{"h":"冷藏不是所有風險的唯一答案","body":["低酸、高 aw 減氧食品需評估肉毒桿菌等危害，控制可能涉及溫度、時間、酸度、製程與其他條件。","常溫商業無菌罐頭與冷藏真空生鮮品不能用同一套前提；不要以「只要冷藏」推定任何產品都安全。"]},{"h":"活性與智慧功能可並存","body":["脫氧劑容量、反應條件、包材透過及密封影響效果；智慧指示器則須與目標變化及使用條件校正。","TTI 不是每次短暫升溫都一定立刻變色，也不排除初始污染；QR／RFID 若只存追溯資料，並非直接感測新鮮度。"]}]}]},{"id":"m-env","nav":"標示與永續","kicker":"MODULE 3 · 標示與永續","h2":"標示、回收與整體環境影響","lead":"一般包裝食品的標示原則與特殊品項公告要一起讀；永續比較同時考慮食品保護、材料、流通與當地實際處理。","blocks":[{"type":"cards","title":"台灣包裝食品標示：先看適用範圍\u003cspan class=\"vn\" lang=\"vi\">Nhãn thực phẩm đóng gói Đài Loan: xem phạm vi\u003c/span>","cols":3,"items":[{"h":"產品與成分\u003cspan class=\"vn\" lang=\"vi\">Sản phẩm, thành phần\u003c/span>","p":"品名、內容物、淨重或容量、添加物名稱與原產地等。\u003cspan class=\"vn\" lang=\"vi\">Tên, thành phần, khối lượng hay thể tích, phụ gia, xuất xứ.\u003c/span>","c":"#2D2A6E"},{"h":"責任與保存資訊\u003cspan class=\"vn\" lang=\"vi\">Đơn vị, thông tin bảo quản\u003c/span>","p":"廠商資料、有效日期；保存與食用方法依產品及規定確認。\u003cspan class=\"vn\" lang=\"vi\">Thông tin đơn vị, hạn; bảo quản, cách dùng theo sản phẩm, quy định.\u003c/span>","c":"#2D2A6E"},{"h":"公告事項與例外\u003cspan class=\"vn\" lang=\"vi\">Mục công bố, ngoại lệ\u003c/span>","p":"營養、過敏原、基改等依適用規定；有些食品有豁免條件。\u003cspan class=\"vn\" lang=\"vi\">Dinh dưỡng, dị ứng, GMO theo quy định; vài loại có điều kiện miễn.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"這是一般包裝食品的讀標示架構，不是所有產品的完整核對清單；並參考施行細則與各項公告。查核日：2026-10-17。\u003cspan class=\"vn\" lang=\"vi\">Đây là khung đọc nhãn thực phẩm đóng gói chung, không là danh sách đầy đủ mọi sản phẩm; còn quy tắc, công bố. Kiểm tra 17-10-2026.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0040001\" target=\"_blank\" rel=\"noopener\">台灣食安法第 22 條 / Điều 22: 台灣法規 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"永續：比較完整系統\u003cspan class=\"vn\" lang=\"vi\">Bền vững: so cả hệ thống\u003c/span>","cols":3,"items":[{"h":"減量與保護一起評估\u003cspan class=\"vn\" lang=\"vi\">Xét giảm vật liệu cùng bảo vệ\u003c/span>","p":"可減少多餘包裝；若破損、浪費增加，也要算進去。\u003cspan class=\"vn\" lang=\"vi\">Giảm bao bì thừa; nếu tăng hư, lãng phí cũng cần tính.\u003c/span>","c":"#2D2A6E"},{"h":"單一材質不保證回收\u003cspan class=\"vn\" lang=\"vi\">Đơn vật liệu chưa bảo đảm tái chế\u003c/span>","p":"還看塗層、標籤、污染、收集與處理設施。\u003cspan class=\"vn\" lang=\"vi\">Còn lớp phủ, nhãn, bẩn, thu gom, cơ sở xử lý.\u003c/span>","c":"#2D2A6E"},{"h":"可分解不是隨處丟\u003cspan class=\"vn\" lang=\"vi\">Phân hủy không nghĩa bỏ bất cứ đâu\u003c/span>","p":"PLA 等須看認證及處理條件；可堆肥不等於可丟塑膠回收。\u003cspan class=\"vn\" lang=\"vi\">PLA xem chứng nhận, điều kiện; compostable không nghĩa bỏ tái chế nhựa.\u003c/span>","c":"#2D2A6E"}]},{"type":"note","title":"","text":"台灣回收依材質、物品類別及當地收運確認；不能說阻隔越好就必然越難回收。\u003cspan class=\"vn\" lang=\"vi\">Ở Đài Loan xem vật liệu, loại đồ, thu gom địa phương; không nói cản càng tốt chắc càng khó tái chế.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://recycle.moenv.gov.tw/Services/QA\" target=\"_blank\" rel=\"noopener\">台灣回收資訊 / Thông tin Đài Loan: 環境部 ↗\u003c/a>\u003c/p>\u003cp class=\"source-note\">\u003ca href=\"https://www.epa.gov/trash-free-waters/frequently-asked-questions-about-plastic-recycling-and-composting\" target=\"_blank\" rel=\"noopener\">可堆肥與回收原理 / Nguyên lý compost, tái chế: US EPA（非台灣收運規則） ↗\u003c/a>\u003c/p>"},{"type":"note","title":"短活動 3｜標示單一材質，就能回收？\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 3: Đơn vật liệu là tái chế được?\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"recycle\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">A 袋寫「單一 PE」，但沾油；B 寫「可堆肥 PLA」。能不查當地規則，就一起放塑膠回收嗎？\u003cspan class=\"vn\" lang=\"vi\">Túi A ghi PE đơn vật liệu nhưng dính dầu; B ghi PLA compostable. Có bỏ cả vào tái chế nhựa mà không tra quy định địa phương?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>我先查＿＿；「可堆肥」不等於＿＿，沾油還需＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tôi tra ___ trước; compostable không bằng ___, dính dầu còn cần ___.\u003c/span>\u003c/div>\u003clabel for=\"general-w16-recycle\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w16-recycle\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>不能。確認物品類別、清潔與當地收運；PLA 看認證及可接收的堆肥設施，不自動混入塑膠回收。\u003cspan class=\"vn\" lang=\"vi\">Không; xem loại đồ, sạch, thu gom địa phương; PLA xem chứng nhận, cơ sở nhận compost, không tự trộn tái chế nhựa.\u003c/span>\u003c/p>\u003cp>材料可技術回收、當地有收與實際被回收是不同階段；保存食物效果也要納入永續比較。\u003cspan class=\"vn\" lang=\"vi\">Có thể tái chế kỹ thuật, địa phương thu, thực sự tái chế là các bước khác nhau; còn xét bảo vệ thực phẩm khi so bền vững.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"exp","title":"延伸：標示與循環系統的界線","items":[{"h":"一般標示與特定要求","body":["台灣食安法第 22 條提供一般包裝食品架構；施行細則與各公告補充內容物、添加物、營養、過敏原等要求，部分項目有豁免或特例。","食品本身的標示，與販售食品容器具的材質、耐熱、一次或重複使用等資訊，適用規範不同。\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/TC/PublishOtherEpaperContent.aspx?id=1592&r=528764586&tid=5414\" target=\"_blank\" rel=\"noopener\">容器使用標示 / Nhãn sử dụng vật chứa: TFDA ↗\u003c/a>\u003c/p>"]},{"h":"可回收不是一個二元材料標籤","body":["材料技術可處理、當地能分類收集、實際進入再生流程，是不同階段；複合層、顏色、標籤及污染會影響。","不把所有紙容器視為不能回收，也不把所有單一 PE 袋視為一定會被回收。臺灣依物品類別、清潔度及地方收運確認。"]},{"h":"可分解、可堆肥與減量","body":["生物基不必然可分解，可分解也不代表任何環境都會快速消失；可堆肥需符合指定認證與接收條件。","減少多餘材料、增加重複使用等須配合清潔、運輸及食品損失評估；不能只比較包材克數就斷定整體環境衝擊較低。"]}]},{"type":"cards","title":"回顧\u003cspan class=\"vn\" lang=\"vi\">Ôn tập\u003c/span>","cols":2,"items":[{"h":"整包保護，要看材料、封口與條件\u003cspan class=\"vn\" lang=\"vi\">Bảo vệ cả gói xem vật liệu, kín, điều kiện\u003c/span>"},{"h":"OTR、WVTR 比較要用同一測試基準\u003cspan class=\"vn\" lang=\"vi\">So OTR, WVTR cần cùng cơ sở thử\u003c/span>"},{"h":"MAP、真空與 TTI 不直接證明安全\u003cspan class=\"vn\" lang=\"vi\">MAP, chân không, TTI không tự chứng minh an toàn\u003c/span>"},{"h":"回收與永續，看產品及當地系統\u003cspan class=\"vn\" lang=\"vi\">Tái chế, bền vững xem sản phẩm, hệ địa phương\u003c/span>"}]}]},{"id":"m-quiz","nav":"綜合測驗","kicker":"MODULE 4 · 綜合測驗","h2":"小測驗：檢核學習成效","lead":"與 A2 版共用 10 題；含 OTR 假設計算、氣調設計與回收判讀，每題附雙語原因及回答句型。","blocks":[{"type":"quiz","items":[{"q":"玻璃瓶身阻隔性高，就能保證整瓶完全不進氧嗎？\u003cspan class=\"vn\" lang=\"vi\">Thân chai thủy tinh cản cao bảo đảm cả chai không vào oxy?\u003c/span>","o":["能，瓶蓋不影響 / Có, nắp không ảnh hưởng","不能，還要看瓶蓋、封口與破損 / Không, còn nắp, kín, hư","能，透明就能判定安全 / Có, trong là an toàn","不能，所有玻璃都大量透氧 / Không, mọi thủy tinh thấm oxy nhiều"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 包裝是整體系統；瓶身材料的阻隔不代替封口完整性、光保護與使用條件。\u003cspan class=\"vn\" lang=\"vi\">Bao bì là hệ thống; cản thân không thay kín, bảo vệ sáng, điều kiện dùng.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：瓶身之外，我還要檢查＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Ngoài thân chai, tôi còn kiểm tra ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/meat-and-poultry-packaging\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"容器印 PP 或回收碼 5，就能直接微波嗎？\u003cspan class=\"vn\" lang=\"vi\">Hộp có PP hay mã 5 là dùng vi sóng ngay?\u003c/span>","o":["能，所有 PP 蓋子都相同 / Có, mọi nắp PP giống nhau","能，不需看食品或時間 / Có, khỏi xem thực phẩm, thời gian","能，只要沒有變形 / Có, chỉ cần chưa biến dạng","不能，須依該產品的微波、溫度及使用標示 / Không, theo nhãn vi sóng, nhiệt, dùng của sản phẩm"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 材質名稱不能取代整個容器的適用條件；蓋、密封膜等可能不同，也要避免不當加熱。\u003cspan class=\"vn\" lang=\"vi\">Tên vật liệu không thay điều kiện cả hộp; nắp, màng có thể khác, tránh gia nhiệt sai.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：我先看＿＿標示，再決定是否加熱。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tôi xem nhãn ___ rồi quyết định gia nhiệt.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fda.gov.tw/tc/includes/GetFile.ashx?id=f637414792135380934\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"假設 OTR＝2 cm³/m²/天，面積 0.1 m²、10 天，固定測試條件下膜透氧量是？\u003cspan class=\"vn\" lang=\"vi\">Giả định OTR=2 cm³/m²/ngày, 0,1 m², 10 ngày, điều kiện cố định, lượng qua màng?\u003c/span>","o":["2 cm³ / 2 cm³","20 cm³ / 20 cm³","0.02 cm³ / 0,02 cm³","200 cm³ / 200 cm³"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 2×0.1×10＝2；忽略殘氧、漏封及驅動差改變，只是教學模型，不是期限估算。\u003cspan class=\"vn\" lang=\"vi\">2×0,1×10=2; bỏ oxy dư, rò, đổi chênh lệch, chỉ mô hình, không là ước tính hạn.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：OTR ×＿＿×＿＿，得到＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: OTR ×___×___ được ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.ams.usda.gov/sites/default/files/media/CID%20Therapeutic%20Food%2C%20Ready-To-Use.pdf\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"兩張膜的 OTR，一張在 23°C、另一張在 38°C 測，能只按數值排名嗎？\u003cspan class=\"vn\" lang=\"vi\">Hai OTR, một đo 23°C, một 38°C, xếp hạng chỉ theo số được?\u003c/span>","o":["能，OTR 永遠不受條件影響 / Có, OTR không tùy điều kiện","能，只要品牌相同 / Có, cùng hãng là được","不能，先對齊溫濕度、厚度、壓差與方法等 / Không, cần cùng nhiệt ẩm, dày, chênh áp, cách thử","不能，OTR 完全不能比較 / Không, OTR không bao giờ so được"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 測試條件影響透過率；同時確認單位及是否以面積、時間正規化，才有可比性。\u003cspan class=\"vn\" lang=\"vi\">Điều kiện ảnh hưởng truyền; xác nhận đơn vị, chuẩn hóa theo diện tích, thời gian để so.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：比較數字前，我先確認＿＿相同。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Trước so số, tôi xác nhận cùng ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.ams.usda.gov/sites/default/files/media/CID%20Therapeutic%20Food%2C%20Ready-To-Use.pdf\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"低透氣的洋芋片袋，可以不調整就用於所有生菜嗎？\u003cspan class=\"vn\" lang=\"vi\">Túi snack ít truyền khí dùng nguyên cho mọi rau sống?\u003c/span>","o":["可以，阻隔越高一定越好 / Có, cản càng cao càng tốt","不可以，還要匹配蔬菜呼吸、溫度與膜透氣 / Không, cần khớp hô hấp rau, nhiệt và màng","可以，生菜採收後完全不呼吸 / Có, rau hái xong hết hô hấp","不可以，所有蔬菜都要完全敞開 / Không, mọi rau đều phải mở hoàn toàn"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 蔬果仍有呼吸；不合適的低氧可能造成厭氧代謝與異味，設計需依品項及流通。\u003cspan class=\"vn\" lang=\"vi\">Rau còn hô hấp; oxy thấp không phù hợp có thể gây chuyển hóa kỵ khí, mùi, cần theo loại và lưu thông.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：生菜還會＿＿，所以要設計＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Rau còn ___ nên cần thiết kế ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/Y4358E/y4358e07.htm\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"紅肉包裝看起來鮮紅，能單靠顏色判定安全嗎？\u003cspan class=\"vn\" lang=\"vi\">Thịt đỏ trong gói đỏ tươi có xét an toàn chỉ từ màu?\u003c/span>","o":["不能，氣體可影響肉色，安全仍看其他證據 / Không, khí đổi màu, an toàn cần bằng chứng khác","能，高氧會殺死所有病原 / Có, oxy cao diệt mọi mầm bệnh","能，真空暗紫就一定腐敗 / Có, chân không tím sẫm chắc hỏng","能，所有紅肉都只能用高氧包裝 / Có, mọi thịt đỏ chỉ gói oxy cao"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 肌紅蛋白狀態會隨氧改變；紅肉可採不同包裝，顏色不代替時間溫度、衛生及處理。\u003cspan class=\"vn\" lang=\"vi\">Myoglobin đổi theo oxy; thịt có nhiều cách gói, màu không thay thời gian nhiệt, vệ sinh, xử lý.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：顏色提供＿＿線索；安全還要看＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Màu gợi ý ___; an toàn còn xem ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/meat-and-poultry-packaging\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"真空或 MAP 包裝，哪個說法合理？\u003cspan class=\"vn\" lang=\"vi\">Về chân không, MAP, câu nào hợp lý?\u003c/span>","o":["兩者都等於商業滅菌 / Cả hai bằng vô trùng thương mại","抽真空必然沒有任何氧 / Chân không chắc hết mọi oxy","所有減氧食品只要冷藏就都足夠 / Mọi giảm oxy chỉ lạnh là đủ","不是殺菌；須依危害及產品搭配其他控制 / Không là diệt khuẩn; phối hợp kiểm soát theo nguy hại, sản phẩm"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 減氧不消除全部危害，部分厭氧菌需留意；常溫罐頭另有驗證製程，冷藏品也須合適時間溫度。\u003cspan class=\"vn\" lang=\"vi\">Giảm oxy không xóa mọi nguy hại, lưu ý vài kỵ khí; đồ hộp có xử lý kiểm chứng khác, đồ lạnh cần thời gian nhiệt.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：這是包裝方式；安全還需要＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Đây là cách gói; an toàn còn cần ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/meat-and-poultry-packaging\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"TTI 顏色正常，能證明沒有所有病原嗎？\u003cspan class=\"vn\" lang=\"vi\">TTI màu bình thường có chứng minh hết mầm bệnh?\u003c/span>","o":["能，TTI 會殺菌 / Có, TTI diệt khuẩn","能，QR 碼也會量病原 / Có, QR cũng đo mầm bệnh","不能，TTI 有特定反應與適用範圍 / Không, TTI có phản ứng, phạm vi xác định","不能，TTI 完全沒有資訊價值 / Không, TTI không có giá trị thông tin"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> TTI 提供特定時間溫度反應資訊；需校正與對應產品，不能涵蓋所有污染或危害。\u003cspan class=\"vn\" lang=\"vi\">TTI cho phản ứng thời gian nhiệt cụ thể; cần hiệu chuẩn, khớp sản phẩm, không bao phủ mọi nhiễm, nguy hại.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：TTI 告訴我＿＿，不能單獨證明＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: TTI cho biết ___, không tự chứng minh ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.efsa.europa.eu/sites/default/files/event/160308b/160308b-p9a.pdf\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"放入適用的脫氧劑，主動降低包內氧，屬於？\u003cspan class=\"vn\" lang=\"vi\">Gói hút oxy phù hợp chủ động giảm oxy thuộc?\u003c/span>","o":["活性包裝 / Bao bì chủ động","只提供資訊的 TTI / TTI chỉ thông tin","保證無菌的包裝 / Bao bì bảo đảm vô trùng","把水全部移出的乾燥設備 / Thiết bị bỏ hết nước"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 活性包裝主動改變條件；脫氧仍依容量、濕度、食品與密封等，不代表同時完成殺菌。\u003cspan class=\"vn\" lang=\"vi\">Bao chủ động đổi điều kiện; hút oxy tùy khả năng, ẩm, thực phẩm, kín, không nghĩa diệt khuẩn.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：脫氧劑改變＿＿；TTI 主要提供＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Gói hút oxy đổi ___; TTI chủ yếu cho ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://www.efsa.europa.eu/sites/default/files/event/160308b/160308b-p9a.pdf\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"},{"q":"單一材質或標可堆肥，能保證當地會回收嗎？\u003cspan class=\"vn\" lang=\"vi\">Đơn vật liệu hay ghi compostable bảo đảm địa phương tái chế?\u003c/span>","o":["能，兩者都直接進同一塑膠回收 / Có, cả hai cùng vào tái chế nhựa","不能，還看物品類別、污染與當地收運處理 / Không, còn loại đồ, bẩn, thu gom xử lý địa phương","能，只看顏色即可 / Có, chỉ xem màu","不能，所有包裝都不能回收 / Không, mọi bao bì không tái chế được"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 可技術回收、收得到、實際回收不同；可堆肥還有特定條件與接收設施，不是隨處分解。\u003cspan class=\"vn\" lang=\"vi\">Khả năng kỹ thuật, được thu, thực tái chế khác nhau; compost còn điều kiện, cơ sở nhận, không tự phân hủy mọi nơi.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：我先查＿＿規則，再處理＿＿。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tôi tra quy định ___ rồi xử lý ___.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://recycle.moenv.gov.tw/Services/QA\" target=\"_blank\" rel=\"noopener\">觀念來源 / Nguồn khái niệm ↗\u003c/a>\u003c/p>"}]}]}]};</script>
<script>
/*
 * runtime.client.js — 跑在瀏覽器裡的渲染器（17 週共用，逐字內嵌進每份 HTML）
 * 讀 window.__LESSON__ 的資料，把 modules / blocks 畫出來。
 * 互動行為（翻卡、展開、配對、測驗）沿用週1 手寫版的做法，不要另創一套。
 */
(function () {
  var D = window.__LESSON__;
  var SERIES = D.series;
  var $ = function (s) { return document.querySelector(s); };
  // 國合班 A2 版（D.a2）：介面文字加越南文；一般班 U() 只回中文，畫面與原本完全相同
  var A2 = !!D.a2;
  function U(zh, vn) { return A2 ? zh + " " + vn : zh; }

  /* ---------- 學習歷程記錄（Supabase） ----------
     只在 lesson.js 注入 D.track = {url, key} 的週次啟用（lib/tracking.json 的 weeks）；
     其他週 TRACK.on 為 false，send() 是空函式，教材行為完全不變。
     只送「學號代碼」與互動事件，不送姓名。送失敗就丟掉，不重試、不阻擋教材。 */
  var CTX = { mod: null, bi: 0 };   // 目前正在渲染的模組 id 與區塊序號（render 是同步的）
  var TRACK = (function () {
    var cfg = D.track;
    var noop = function () {};
    if (!cfg || !cfg.url || !cfg.key) return { on: false, send: noop, flush: noop, code: function () { return ""; }, setCode: noop };
    var KEY = "ifs_code", DKEY = "ifs_device";
    var rnd = function () { return Math.random().toString(36).slice(2, 10); };
    var sid = rnd() + Date.now().toString(36);
    // device_id：同一支手機／瀏覽器跨次開頁不變。學生後來才填學號代碼時，先前的 anon 事件可靠它回接。
    var did = "";
    try { did = localStorage.getItem(DKEY) || ""; if (!did) { did = "d" + rnd() + rnd(); localStorage.setItem(DKEY, did); } } catch (e) { did = "d" + rnd(); }
    var q = [], timer = null;
    function code() { try { return (localStorage.getItem(KEY) || "").trim(); } catch (e) { return ""; } }
    function setCode(v) { try { localStorage.setItem(KEY, (v || "").trim().slice(0, 20)); } catch (e) {} }
    function cut(s, n) { return s == null ? null : String(s).slice(0, n); }
    // 欄位長度與 payload 大小在前端先截到資料表 CHECK 的上限：PostgREST 批次 INSERT 是原子的，
    // 一筆違反 CHECK 整批都會被拒，而我們失敗即丟，會靜默掉整個 4 秒窗口。
    function send(event, mod, block, payload) {
      var p = payload || {};
      var ps = JSON.stringify(p);
      if (ps.length > 1800) p = { trunc: true, keys: Object.keys(p).slice(0, 10) };
      q.push({
        student_code: cut(code(), 20) || "anon", device_id: cut(did, 40), week: D.week || 0,
        module_id: cut(mod, 30), block_type: cut(block, 10), event: cut(event, 30),
        payload: p, session_id: cut(sid, 40), build: cut(D.build, 16), client_ts: new Date().toISOString(),
      });
      if (q.length >= 40) flush();
      else if (!timer) timer = setTimeout(flush, 4000);
    }
    function flush() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!q.length) return;
      var body = JSON.stringify(q.splice(0, 50));
      try {
        fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/ifs_lesson_events", {
          method: "POST", keepalive: true, body: body,
          headers: { "Content-Type": "application/json", "apikey": cfg.key, "Prefer": "return=minimal" },
        }).catch(noop);
      } catch (e) { /* 舊瀏覽器沒有 fetch：不記錄 */ }
      if (q.length) timer = setTimeout(flush, 1000);
    }
    window.addEventListener("pagehide", flush);
    return { on: true, send: send, flush: flush, code: code, setCode: setCode };
  })();

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function colorAt(given, i) { return given || SERIES[i % SERIES.length]; }
  function gridCls(n) { return "grid g" + (n === 2 || n === 3 || n === 4 ? n : 3); }
  function listHtml(v) {
    // body 可以是字串或字串陣列；陣列渲染成 <ul>
    if (v == null) return "";
    if (typeof v === "string") return '<p>' + v + '</p>';
    return '<ul>' + v.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
  }

  /* ---------- 區塊標題 ---------- */
  function heading(frag, b) {
    if (b.title) frag.appendChild(el("div", "sec-title", '<span class="bar"></span>' + b.title));
    if (b.hint) frag.appendChild(el("div", "hint", b.hint));
  }

  /* ---------- 各區塊 ---------- */
  var BLOCKS = {};

  BLOCKS.flips = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (d, i) {
      var c = colorAt(d.c, i);
      var card = el("div", "flip");
      if (b.h) card.style.height = b.h + "px";
      card.innerHTML =
        '<div class="flip-in">' +
        '<div class="face front"><div class="cbar" style="background:' + c + '"></div>' +
        '<div class="t">' + d.t + '</div><div class="en">' + (d.en || "") + '</div>' +
        '<div class="tap">▸ ' + U("點我看解釋", "Chạm để xem") + '</div></div>' +
        '<div class="face back"><div class="cbar" style="background:' + c + '"></div>' +
        '<p>' + d.b + '</p></div></div>';
      var mod = CTX.mod, bi = CTX.bi;
      card.onclick = function () {
        if (card.classList.toggle("on")) TRACK.send("flip_open", mod, "flips", { b: bi, i: i, t: d.t });
      };
      g.appendChild(card);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.exp = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div");
    b.items.forEach(function (t, i) {
      var box = el("div", "exp");
      var res = t.res ? '<div style="margin-top:10px;font-size:13px;color:var(--secondary);font-weight:700">🔗 ' + t.res + '</div>' : "";
      box.innerHTML =
        '<button><span class="num">' + (i + 1) + '</span><span>' + t.h + '</span>' +
        '<span class="tag">' + (t.tag || "") + '</span><span class="chev">›</span></button>' +
        '<div class="body">' + listHtml(t.body) + res + '</div>';
      var body = box.querySelector(".body");
      var mod = CTX.mod, bi = CTX.bi;
      box.querySelector("button").onclick = function () {
        var on = box.classList.toggle("on");
        if (!on) { body.style.maxHeight = "0px"; return; }
        TRACK.send("exp_open", mod, "exp", { b: bi, i: i, h: t.h });
        // 用實際內容高度展開，避免長段落被固定 max-height 截掉。
        // 必須先解除 max-height 再量：在 max-height:0 的狀態下量 scrollHeight 會得到 0，
        // 面板就只會開一條縫（實測過）。量完歸零並強制重排，transition 才有起點。
        body.style.maxHeight = "none";
        var h = body.scrollHeight;
        body.style.maxHeight = "0px";
        void body.offsetHeight;
        body.style.maxHeight = h + "px";
      };
      host.appendChild(box);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.cards = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var box = el("div", "card");
      box.style.borderTop = "4px solid " + accent;
      box.innerHTML = '<div class="h">' + c.h + '</div>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        (c.li ? '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>' : "") +
        (c.p ? '<p style="margin-top:8px;font-size:15.5px;color:var(--mid)">' + c.p + '</p>' : "");
      g.appendChild(box);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.timeline = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "tl");
    b.steps.forEach(function (s, i) {
      var st = el("div", "step");
      st.innerHTML = '<div class="dot" style="background:' + colorAt(s.c, i) + '">' + (i + 1) + '</div>' +
        '<h4>' + s.h + '</h4><p>' + s.p + '</p>';
      host.appendChild(st);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.compare = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "cmp");
    [b.left, b.right].forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var col = el("div", "col");
      col.innerHTML = '<div class="cbar" style="background:' + accent + '"></div>' +
        '<h4 style="color:' + accent + '">' + c.h + '</h4>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
      wrap.appendChild(col);
    });
    f.appendChild(wrap);
    if (b.note) f.appendChild(el("div", "cmp-note", b.note));
    return f;
  };

  BLOCKS.table = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "tblwrap");
    var html = '<table class="tbl"><thead><tr>' +
      b.head.map(function (h) { return '<th>' + h + '</th>'; }).join("") + '</tr></thead><tbody>' +
      b.rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join("") + '</tr>';
      }).join("") + '</tbody></table>';
    wrap.innerHTML = html;
    f.appendChild(wrap); return f;
  };

  BLOCKS.note = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    f.appendChild(el("div", "note" + (b.kind ? " " + b.kind : ""), b.text));
    return f;
  };

  BLOCKS.match = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "match-wrap");
    var pool = el("div", "pool"), targets = el("div", "targets");
    var pairs = b.pairs;
    var order = pairs.slice().sort(function () { return Math.random() - 0.5; });
    var selected = null, solved = 0, errors = 0, t0 = null;
    var mod = CTX.mod, bi = CTX.bi;
    var msg = el("div");
    msg.style.cssText = "margin-top:14px;font-weight:700;color:var(--green)";

    function tryMatch(slot, key) {
      if (slot.classList.contains("ok")) return;
      if (t0 === null) t0 = Date.now();
      if (slot.dataset.k === key) {
        slot.classList.add("ok"); slot.classList.remove("bad");
        slot.querySelector(".drop").textContent = key;
        var chip = pool.querySelector('.chip[data-k="' + key + '"]');
        chip.classList.add("used"); chip.classList.remove("sel");
        selected = null; solved++;
        TRACK.send("match_ok", mod, "match", { b: bi, label: key });
        if (solved === pairs.length) {
          msg.textContent = b.done || U("✓ 全部答對！", "Đúng hết!");
          TRACK.send("match_done", mod, "match", { b: bi, n: pairs.length, errors: errors, ms: Date.now() - t0 });
        }
      } else {
        errors++;
        TRACK.send("match_bad", mod, "match", { b: bi, label: key, slot: slot.dataset.k });
        slot.classList.add("bad");
        setTimeout(function () { slot.classList.remove("bad"); }, 350);
      }
    }
    order.forEach(function (q) {
      var c = el("div", "chip"); c.textContent = q.label; c.draggable = true; c.dataset.k = q.label;
      c.addEventListener("dragstart", function (e) { e.dataTransfer.setData("k", q.label); });
      c.onclick = function () {
        if (c.classList.contains("used")) return;
        if (selected === c) { c.classList.remove("sel"); selected = null; return; }
        pool.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("sel"); });
        c.classList.add("sel"); selected = c;
      };
      pool.appendChild(c);
    });
    pairs.forEach(function (q) {
      var s = el("div", "slot"); s.dataset.k = q.label;
      s.innerHTML = '<div class="drop">' + U("拖到這裡", "Kéo vào đây") + '</div><div class="desc">' + q.desc + '</div>';
      s.addEventListener("dragover", function (e) { e.preventDefault(); });
      s.addEventListener("drop", function (e) { e.preventDefault(); tryMatch(s, e.dataTransfer.getData("k")); });
      s.onclick = function () { if (selected) tryMatch(s, selected.dataset.k); };
      targets.appendChild(s);
    });
    host.appendChild(pool); host.appendChild(targets); host.appendChild(msg);
    f.appendChild(host); return f;
  };

  /* 結果代碼：把作答結果編成一串可貼給老師的代碼（FSQ1.<base64>.<檢查碼>）。
     解碼與彙整用專案根目錄的「食品科學概論_測驗成績解碼器.html」。 */
  function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
  function checksum(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1679616; // 36^4
    return h.toString(36);
  }

  BLOCKS.quiz = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var items = b.items, n = items.length;
    var head = el("div", "quiz-head");
    head.innerHTML =
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
      '<input class="qid" placeholder="' + U("學號（交成績必填）", "Mã số SV") + '" style="flex:1;min-width:130px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px">' +
      '<input class="qname" placeholder="' + U("姓名", "Họ tên") + '" style="flex:1;min-width:100px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px"></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
      '<strong class="qprog">' + U("進度", "Tiến độ") + ' 0 / ' + n + '</strong>' +
      '<span class="qscore" style="color:var(--secondary);font-weight:800">' + U("得分", "Điểm") + ' 0</span></div>' +
      '<div class="pbar"><div class="pfill"></div></div>';
    var box = el("div");
    var sb = el("div", "scorebox");
    sb.innerHTML = '<div>' + U("你的成績", "Điểm của bạn") + '</div><div class="big"><span class="fscore">0</span> / ' + n + '</div>' +
      '<div class="smsg" style="margin:8px 0 16px"></div>' +
      '<div class="rcwrap" style="margin:0 auto 16px;max-width:560px;text-align:left">' +
      '<div style="font-weight:700;margin-bottom:6px">' + U("結果代碼（請複製後，貼到老師指定的表單或訊息）", "— Mã kết quả: sao chép và gửi cho thầy/cô") + '</div>' +
      '<textarea class="rcode" readonly rows="3" style="width:100%;box-sizing:border-box;font-family:monospace;font-size:12px;padding:8px;border:1.5px solid var(--line,#ccc);border-radius:8px;resize:none"></textarea>' +
      '<div class="rmsg" style="font-size:13px;color:#B34700;margin-top:4px"></div>' +
      '<button class="btn copyrc" style="margin-top:8px">📋 ' + U("複製結果代碼", "Sao chép mã") + '</button></div>' +
      '<button class="btn ghost">' + U("重新測驗", "Làm lại") + '</button>';

    var answered = 0, score = 0, picks = [], qt0 = null, attempt = 0;
    var mod = CTX.mod, bi = CTX.bi;
    // 測驗的學號欄與頁首的學號代碼同步（兩邊填任一邊都行）
    var qidInput = head.querySelector(".qid");
    if (TRACK.on) {
      if (TRACK.code()) qidInput.value = TRACK.code();
      qidInput.addEventListener("change", function () {
        TRACK.setCode(qidInput.value);
        var top = $("#ifs-code"); if (top) top.value = TRACK.code();
      });
    }
    function updateProg() {
      head.querySelector(".qprog").textContent = U("進度", "Tiến độ") + " " + answered + " / " + n;
      head.querySelector(".qscore").textContent = U("得分", "Điểm") + " " + score;
      head.querySelector(".pfill").style.width = (answered / n * 100) + "%";
    }
    function finish() {
      sb.querySelector(".fscore").textContent = score;
      var pct = score / n, m;
      if (score === n) m = U("本次全對！請再用自己的話說明洋芋片的包裝、氣體與回收條件。", "Đúng hết lần này! Hãy giải thích tình huống bằng lời của mình.");
      else if (pct >= 0.8) m = U("很棒！觀念相當扎實。", "Rất tốt!");
      else if (pct >= 0.6) m = U("不錯，再複習幾個弱點就更好。", "Khá tốt, ôn lại vài chỗ nữa nhé.");
      else m = U("建議回到前面單元再看一次翻卡與展開內容。", "Hãy xem lại các phần phía trước.");
      sb.querySelector(".smsg").textContent = m;

      var sid = head.querySelector(".qid").value.trim();
      var sname = head.querySelector(".qname").value.trim();
      var korr = items.map(function (item, i) { return picks[i] === item.a ? 1 : 0; }).join("");
      var payload = JSON.stringify({
        w: D.week || 0, c: A2 ? "a2" : undefined, id: sid, nm: sname, s: score, n: n,
        a: picks, k: korr, t: new Date().toISOString().slice(0, 16),
      });
      var body = b64utf8(payload);
      var code = "FSQ1." + body + "." + checksum(body);
      sb.querySelector(".rcode").value = code;
      sb.querySelector(".rmsg").textContent = sid ? "" : U("⚠ 尚未填學號 —— 請回到測驗上方填入學號後重新測驗，否則老師無法登記成績。", "Chưa nhập mã số SV: hãy nhập ở trên rồi làm lại.");
      TRACK.send("quiz_done", mod, "quiz", { b: bi, attempt: attempt, score: score, n: n, picks: picks, ms: qt0 ? Date.now() - qt0 : null });
      TRACK.flush();

      sb.classList.add("show");
      sb.scrollIntoView({ behavior: "smooth" });
    }
    function pick(qel, item, oi) {
      if (qel.dataset.done === "1") return;
      qel.dataset.done = "1"; answered++;
      if (qt0 === null) qt0 = Date.now();
      picks[parseInt(qel.dataset.qi, 10)] = oi;
      TRACK.send("quiz_answer", mod, "quiz", { b: bi, attempt: attempt, qi: parseInt(qel.dataset.qi, 10), pick: oi, ok: oi === item.a });
      qel.querySelectorAll(".opt").forEach(function (btn, i) {
        btn.classList.add("dim");
        if (i === item.a) btn.classList.add("correct");
        if (i === oi && oi !== item.a) btn.classList.add("wrong");
      });
      var fb = qel.querySelector(".fb");
      if (oi === item.a) { score++; fb.classList.add("good"); fb.innerHTML = U("✓ 正確！", "Đúng!") + item.e; }
      else { fb.classList.add("no"); fb.innerHTML = U("✗ 正解：", "Sai. Đáp án:") + item.o[item.a] + "。" + item.e; }
      fb.classList.add("show"); updateProg();
      if (answered === n) finish();
    }
    function build() {
      box.innerHTML = ""; answered = 0; score = 0; picks = []; qt0 = null; attempt++; updateProg();
      sb.classList.remove("show");
      items.forEach(function (item, qi) {
        var qel = el("div", "q"); qel.dataset.done = "0"; qel.dataset.qi = qi;
        qel.innerHTML = '<div class="qn">第 ' + (qi + 1) + ' 題' + (A2 ? ' · Câu ' + (qi + 1) : '') + '</div><div class="qt">' + item.q + '</div>';
        item.o.forEach(function (opt, oi) {
          var btn = el("button", "opt"); btn.textContent = opt;
          btn.onclick = function () { pick(qel, item, oi); };
          qel.appendChild(btn);
        });
        qel.appendChild(el("div", "fb"));
        box.appendChild(qel);
      });
    }
    sb.querySelector(".copyrc").onclick = function () {
      var ta = sb.querySelector(".rcode");
      ta.select(); ta.setSelectionRange(0, 99999);
      var btn = this;
      function ok() { btn.textContent = U("✓ 已複製，請貼給老師", "Đã sao chép"); setTimeout(function () { btn.textContent = "📋 " + U("複製結果代碼", "Sao chép mã"); }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(ta.value).then(ok, function () { document.execCommand("copy"); ok(); });
      else { document.execCommand("copy"); ok(); }
    };
    sb.querySelector(".ghost").onclick = function () {
      build(); window.scrollTo({ top: 0, behavior: "smooth" });
    };
    build();
    f.appendChild(head); f.appendChild(box); f.appendChild(sb);
    return f;
  };

  /* ---------- 組裝 ---------- */
  var nav = $("#nav"), main = $("#main");
  var curMod = D.modules.length ? D.modules[0].id : null, modT0 = Date.now();
  function switchMod(id, btn) {
    document.querySelectorAll(".module").forEach(function (m) { m.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
    nav.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
    btn.classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (id !== curMod) {
      TRACK.send("module_view", id, null, { from: curMod, ms: Date.now() - modT0 });
      curMod = id; modT0 = Date.now();
    }
  }
  D.modules.forEach(function (m, i) {
    var btn = el("button", i === 0 ? "active" : "", m.nav);
    btn.onclick = function () { switchMod(m.id, btn); };
    nav.appendChild(btn);

    var sec = el("section", "module" + (i === 0 ? " active" : ""));
    sec.id = m.id;
    sec.appendChild(el("div", "lead",
      '<div class="kicker">' + m.kicker + '</div><h2>' + m.h2 + '</h2><p>' + m.lead + '</p>'));
    m.blocks.forEach(function (b, bi) {
      var render = BLOCKS[b.type];
      if (!render) { console.error("未知區塊型別:", b.type); return; }
      CTX.mod = m.id; CTX.bi = bi;
      sec.appendChild(render(b));
    });
    main.appendChild(sec);
  });

  /* ---------- 學號代碼列（只在啟用記錄的週出現） ---------- */
  if (TRACK.on) {
    var bar = el("div", "codebar");
    bar.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;font-size:14px";
    bar.innerHTML = '<label for="ifs-code" style="font-weight:700">學號代碼</label>' +
      '<input id="ifs-code" maxlength="20" placeholder="例：S001" style="width:120px;padding:6px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:14px">' +
      '<span style="opacity:.75">只記錄你的學習歷程（翻卡、配對、測驗），不需要姓名。</span>';
    nav.parentNode.insertBefore(bar, nav);
    var inp = bar.querySelector("#ifs-code");
    inp.value = TRACK.code();
    inp.addEventListener("change", function () {
      TRACK.setCode(inp.value);
      document.querySelectorAll(".qid").forEach(function (x) { x.value = TRACK.code(); });
      TRACK.send("code_set", null, null, {});
    });
    TRACK.send("session_start", curMod, null, {
      device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || "") ? "mobile" : "desktop",
      w: window.innerWidth, build: D.build || null,
    });
    // 停留時間以「頁面可見」為準：切到背景就結算一段 module_leave，回來重新計時。
    // 手機瀏覽器殺分頁常不觸發 pagehide，所以以 visibilitychange→hidden 為主。
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        TRACK.send("module_leave", curMod, null, { ms: Date.now() - modT0 }); TRACK.flush();
      } else {
        modT0 = Date.now();
      }
    });
  }
})();
</script>
