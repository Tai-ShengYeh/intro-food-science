<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品科學概論 第3週 · 互動教學</title>
<style>
  :root{
    --primary:#2D2A6E; --secondary:#5B4FB8; --accent:#00B8B8; --warm:#F5A623; --green:#2FA36B; --red:#D65B5B; --dark:#1A1A3E; --bg:#F4F5FA; --text:#1F1F2E; --mid:#5A5A75; --muted:#9096ac; --border:#E2E2EC; --card:#fff;
  }
/* 版型樣式 — 逐條取自「第1週_互動教學.html」，末段為新增區塊（cmp / tbl / note）。
   這裡只用 var(--x)；色票由 tokens.js 產生 :root 注入。 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:17px}
header{background:linear-gradient(120deg,var(--dark),var(--primary));color:#fff;
  padding:26px 22px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(0,0,0,.15)}
header h1{font-size:31px;font-weight:800;letter-spacing:.5px}
header .sub{color:#b9c7ff;font-size:16px;margin-top:5px}
nav{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.10);color:#dfe4ff;border:none;padding:12px 18px;
  border-radius:10px 10px 0 0;font-size:16.5px;cursor:pointer;font-weight:600;transition:.15s}
nav button:hover{background:rgba(255,255,255,.2)}
nav button.active{background:var(--bg);color:var(--primary)}
main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
.module{display:none;animation:fade .35s}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead{background:var(--dark);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:22px}
.lead .kicker{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px}
.lead h2{font-size:26px;margin:6px 0 8px}
.lead p{color:#cdd3ee;font-size:16.5px}
.sec-title{font-size:23px;font-weight:800;color:var(--primary);margin:30px 0 6px;
  display:flex;align-items:center;gap:10px}
.sec-title .bar{width:6px;height:25px;background:var(--accent);border-radius:3px;display:inline-block}
.hint{color:var(--mid);font-size:15px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* flip cards */
.flip{perspective:1100px;height:200px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px rgba(30,30,60,.08);border:1px solid var(--border)}
.front{background:var(--card)}
.front .t{font-size:21px;font-weight:800;color:var(--primary)}
.front .en{color:var(--muted);font-size:14px;margin-top:3px;font-style:italic}
.front .tap{margin-top:auto;color:var(--accent);font-size:14px;font-weight:700}
.back{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;transform:rotateY(180deg);overflow:auto}
.back p{font-size:16px}
.cbar{height:6px;border-radius:14px 14px 0 0;position:absolute;top:0;left:0;right:0}

/* expandable */
.exp{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.exp>button{width:100%;text-align:left;background:none;border:none;padding:16px 18px;cursor:pointer;
  display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;color:var(--text)}
.exp .num{background:var(--primary);color:#fff;min-width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.exp .chev{margin-left:auto;color:var(--muted);transition:.25s;font-size:20px}
.exp.on .chev{transform:rotate(90deg);color:var(--accent)}
.exp .body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 18px}
.exp.on .body{padding:0 18px 16px 62px}
.exp .body ul{margin-left:16px;color:var(--mid);font-size:16px}
.exp .body p{color:var(--mid);font-size:15.5px}
.exp .tag{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:8px}

/* info card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.card .h{font-weight:800;color:var(--primary);font-size:18px;margin-bottom:6px}
.card .en{color:var(--muted);font-size:13px;font-style:italic}
.card ul{margin:8px 0 0 18px;font-size:15.5px;color:var(--mid)}

/* timeline */
.tl{display:flex;gap:0;flex-wrap:wrap;counter-reset:s}
.tl .step{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 14px 14px;margin:8px;position:relative}
.tl .dot{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;margin-bottom:8px}
.tl .step h4{color:var(--primary);font-size:17.5px;margin-bottom:4px}
.tl .step p{font-size:15px;color:var(--mid)}

/* matching */
.match-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.pool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--secondary);color:#fff;padding:10px 17px;border-radius:22px;font-weight:700;
  cursor:grab;user-select:none;font-size:16.5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chip.used{opacity:.35;pointer-events:none}
.chip.sel{outline:3px solid var(--warm);outline-offset:2px}
.targets{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;border:2px dashed var(--border);border-radius:12px;padding:10px 14px;background:#fafbff}
.slot .desc{flex:1;font-size:16px;color:var(--text)}
.slot .drop{min-width:130px;min-height:44px;border-radius:8px;background:#eef0f8;display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:15px;padding:8px 12px}
.slot.ok{border-color:var(--green);background:#effaf3}
.slot.ok .drop{background:var(--green);color:#fff;font-weight:700}
.slot.bad{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* quiz */
.quiz-head{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.pbar{height:12px;background:#e7e9f4;border-radius:8px;overflow:hidden;margin-top:10px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--secondary));transition:width .4s}
.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.q .qn{color:var(--accent);font-weight:800;font-size:14px}
.q .qt{font-size:19.5px;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fafbff;border:2px solid var(--border);
  border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;font-size:16.5px;transition:.15s}
.opt:hover{border-color:var(--secondary)}
.opt.correct{border-color:var(--green);background:#effaf3;font-weight:700}
.opt.wrong{border-color:var(--red);background:#fdeeee}
.opt.dim{opacity:.6}
.fb{margin-top:8px;font-size:15.5px;padding:11px 14px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.good{background:#effaf3;color:#1c7a4d} .fb.no{background:#fdeeee;color:#a83b3b}
.scorebox{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:16px;
  padding:26px;text-align:center;margin-top:10px;display:none}
.scorebox.show{display:block}
.scorebox .big{font-size:46px;font-weight:800}
.btn{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:10px;
  font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.18)}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;background:#eef0fb;color:var(--secondary);padding:3px 10px;border-radius:20px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px}

/* ===== 新增區塊 ===== */
/* compare：兩欄對照（梅納 vs 焦糖化、冷藏 vs 冷凍…） */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media(max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 18px 18px;
  box-shadow:0 3px 10px rgba(30,30,60,.06);position:relative;overflow:hidden}
.cmp .col .cbar{position:static;height:6px;margin:0 -18px 14px;border-radius:0}
.cmp .col h4{font-size:20px;font-weight:800;margin-bottom:2px}
.cmp .col .en{color:var(--muted);font-size:13px;font-style:italic;margin-bottom:8px}
.cmp .col ul{margin-left:18px;font-size:15.5px;color:var(--mid)}
.cmp .col li{margin-bottom:5px}
.cmp-note{margin-top:12px;background:#eef0fb;border-left:5px solid var(--secondary);
  border-radius:0 10px 10px 0;padding:12px 16px;font-size:16px;color:var(--primary);font-weight:600}

/* table：資料表（維生素、添加物分類…） */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 3px 10px rgba(30,30,60,.06)}
.tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px}
.tbl th{background:var(--primary);color:#fff;text-align:left;padding:12px 14px;font-weight:700;font-size:15px}
.tbl td{padding:11px 14px;border-top:1px solid var(--border);color:var(--mid);vertical-align:top}
.tbl tr:nth-child(even) td{background:#fafbff}
.tbl td:first-child{color:var(--text);font-weight:700}

/* note：重點提示條 */
.note{background:#fff8e9;border-left:5px solid var(--warm);border-radius:0 12px 12px 0;
  padding:14px 18px;margin:14px 0;font-size:16px;color:var(--text)}
.note b{color:var(--primary)}
.note.key{background:#effaf3;border-left-color:var(--green)}
.note.warn{background:#fdeeee;border-left-color:var(--red)}
/* 國合班 A2 互動練習：拼音與越南文（build_a2.js 產生的內容才會用到） */
.py{display:block;font-size:.78em;font-weight:500;color:var(--mid);margin-top:2px}
.vn{display:block;font-size:.88em;font-weight:500;color:var(--secondary);margin-top:2px}
/* Shared classroom tasks: oral response, sentence support, then sample explanation. */
.class-activity{display:grid;gap:12px;min-width:0}
.class-activity .vn{display:block;color:#0E7C7B;font-size:15px;line-height:1.5;margin-top:4px}
.activity-time{color:#0E7C7B;font-weight:700;font-size:15px}
.activity-prompt{font-size:clamp(18px,2.3vw,23px);line-height:1.5}
.sentence-stem{padding:12px 16px;background:#EFFAF3;border-left:5px solid #2FA36B;color:#1A1A3E;line-height:1.6}
.class-activity label{font-size:14px;color:#52526B}
.activity-response{display:block;width:100%;max-width:100%;min-height:72px;border:1.5px solid #A0A0B5;border-radius:8px;padding:10px 12px;resize:vertical;font:inherit;font-size:17px;background:#fff;color:#1F1F2E}
.activity-answer{border:1px solid #E2E2EC;background:#fff;border-radius:8px;padding:10px 14px;font-size:16px;line-height:1.5}
.activity-answer summary{cursor:pointer;font-weight:700;color:#2D2A6E}
.activity-answer p{margin-top:10px}
.activity-response:focus-visible,.activity-answer summary:focus-visible{outline:3px solid #0E7C7B;outline-offset:3px}
.source-note{font-size:13px;color:#52526B;line-height:1.5;overflow-wrap:anywhere;margin-top:10px}
.source-note .vn{display:block;color:#0E7C7B;font-size:13px}
.lesson-links{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.lesson-links a{color:inherit;text-underline-offset:3px}
.feedback-reason,.feedback-transfer{margin-top:6px}
.feedback-transfer{font-weight:600}
@media(max-width:640px){header{position:relative!important}.class-activity{gap:10px}}
@media print{.activity-response{min-height:64px}}


.back .vn{color:#D7FAF3}.tbl-wrap{overflow-x:auto}
</style>
</head>

<script>window.__LESSON__={"week":3,"series":["#2D2A6E","#2FA36B","#F5A623","#5B4FB8","#00B8B8","#D65B5B"],"modules":[{"id":"m-class","nav":"醣類分類","kicker":"MODULE 1 · 單元一","h2":"醣類怎麼分類？從一個糖單位開始","lead":"用同一片麵包連結醣類分類、澱粉糊化與老化、非酵素褐變。食品是混合物，先分清分子，再解釋觀察。","blocks":[{"type":"cards","title":"一片麵包，串起今天的三件事\u003cspan class=\"vn\" lang=\"vi\">Một lát bánh mì nối ba nội dung\u003c/span>","cols":3,"items":[{"h":"① 烘焙時\u003cspan class=\"vn\" lang=\"vi\">Khi nướng bánh\u003c/span>","p":"麵粉中的澱粉，在水與熱作用下糊化。\u003cspan class=\"vn\" lang=\"vi\">Tinh bột trong bột mì hồ hóa nhờ nước và nhiệt.\u003c/span>","c":"#2D2A6E"},{"h":"② 冷卻、存放\u003cspan class=\"vn\" lang=\"vi\">Làm nguội, bảo quản\u003c/span>","p":"澱粉老化與水分遷移，影響麵包心硬度。\u003cspan class=\"vn\" lang=\"vi\">Thoái hóa tinh bột và di chuyển của nước ảnh hưởng độ cứng ruột bánh.\u003c/span>","c":"#2FA36B"},{"h":"③ 再烤成吐司\u003cspan class=\"vn\" lang=\"vi\">Nướng lại thành bánh mì nướng\u003c/span>","p":"表面可能有梅納反應；其他變化依配方和加熱條件而定。\u003cspan class=\"vn\" lang=\"vi\">Bề mặt có thể có phản ứng Maillard; biến đổi khác tùy công thức và gia nhiệt.\u003c/span>","c":"#F5A623"}]},{"type":"flips","title":"一、依「醣單位數目」分成四類（點卡片翻面）","hint":"本課採 FAO 聚合度分類；其他文獻界線可能不同。","cols":4,"items":[{"t":"單醣：1 個\u003cspan class=\"vn\" lang=\"vi\">Đường đơn: 1\u003c/span>","en":"Monosaccharide","c":"#2D2A6E","b":"葡萄糖、果糖、半乳糖。\u003cspan class=\"vn\" lang=\"vi\">Glucose, fructose, galactose.\u003c/span>"},{"t":"雙醣：2 個\u003cspan class=\"vn\" lang=\"vi\">Đường đôi: 2\u003c/span>","en":"Disaccharide","c":"#2FA36B","b":"蔗糖、乳糖、麥芽糖。\u003cspan class=\"vn\" lang=\"vi\">Sucrose, lactose, maltose.\u003c/span>"},{"t":"寡醣：3–9 個\u003cspan class=\"vn\" lang=\"vi\">Oligosaccharide: 3–9\u003c/span>","en":"Oligosaccharide","c":"#F5A623","b":"本課採 FAO 的分類界線。\u003cspan class=\"vn\" lang=\"vi\">Bài này dùng ranh giới phân loại của FAO.\u003c/span>"},{"t":"多醣：10 個以上\u003cspan class=\"vn\" lang=\"vi\">Polysaccharide: từ 10\u003c/span>","en":"Polysaccharide","c":"#5B4FB8","b":"澱粉、纖維素、果膠。\u003cspan class=\"vn\" lang=\"vi\">Tinh bột, cellulose, pectin.\u003c/span>"}]},{"type":"note","title":"","text":"本課依 FAO 以聚合度分類：寡醣 3–9、多醣 ≥10；其他文獻可能採不同界線。圖為示意，不是比例圖。\u003cspan class=\"vn\" lang=\"vi\">Bài này theo FAO: oligosaccharide 3–9, polysaccharide ≥10; tài liệu khác có thể dùng ranh giới khác. Hình chỉ minh họa, không theo tỷ lệ.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/w8079e/w8079e07.htm\" target=\"_blank\" rel=\"noopener\">分類依據 / Phân loại: FAO ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"三個重要的雙醣\u003cspan class=\"vn\" lang=\"vi\">Ba loại đường đôi\u003c/span>","cols":3,"items":[{"h":"蔗糖\u003cspan class=\"vn\" lang=\"vi\">Sucrose\u003c/span>","p":"葡萄糖＋果糖；砂糖的主成分。\u003cspan class=\"vn\" lang=\"vi\">Glucose + fructose; thành phần chính của đường cát.\u003c/span>","c":"#2D2A6E"},{"h":"乳糖\u003cspan class=\"vn\" lang=\"vi\">Lactose\u003c/span>","p":"葡萄糖＋半乳糖；需要乳糖酶分解。\u003cspan class=\"vn\" lang=\"vi\">Glucose + galactose; cần enzyme lactase để phân giải.\u003c/span>","c":"#2FA36B"},{"h":"麥芽糖\u003cspan class=\"vn\" lang=\"vi\">Maltose\u003c/span>","p":"葡萄糖＋葡萄糖；可由澱粉分解產生。\u003cspan class=\"vn\" lang=\"vi\">Glucose + glucose; có thể tạo ra khi tinh bột bị phân giải.\u003c/span>","c":"#F5A623"}]},{"type":"cards","title":"還原糖：先看反應性\u003cspan class=\"vn\" lang=\"vi\">Đường khử: chú ý khả năng phản ứng\u003c/span>","cols":3,"items":[{"h":"葡萄糖、果糖\u003cspan class=\"vn\" lang=\"vi\">Glucose, fructose\u003c/span>","p":"都是單醣，也是還原糖。\u003cspan class=\"vn\" lang=\"vi\">Đều là đường đơn và đường khử.\u003c/span>","c":"#2D2A6E"},{"h":"乳糖、麥芽糖\u003cspan class=\"vn\" lang=\"vi\">Lactose, maltose\u003c/span>","p":"都是雙醣，也是還原糖。\u003cspan class=\"vn\" lang=\"vi\">Đều là đường đôi và đường khử.\u003c/span>","c":"#2FA36B"},{"h":"蔗糖\u003cspan class=\"vn\" lang=\"vi\">Sucrose\u003c/span>","p":"是雙醣，未水解時不是還原糖。\u003cspan class=\"vn\" lang=\"vi\">Là đường đôi, không phải đường khử khi chưa thủy phân.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"甜度會受濃度、溫度和食品配方影響；不把一組相對甜度數字當成所有食品的固定值。還原糖遇到可反應的胺基，可參與梅納反應。\u003cspan class=\"vn\" lang=\"vi\">Độ ngọt phụ thuộc nồng độ, nhiệt độ và công thức. Không dùng một bộ số cho mọi thực phẩm. Đường khử có thể phản ứng với nhóm amin trong phản ứng Maillard.\u003c/span>"},{"type":"match","title":"術語配對挑戰","hint":"把上方標籤拖到（或先點標籤再點空格）對應的描述。全部答對即通關。","done":"✓ 全部答對！醣類名詞已經分清楚了。","pairs":[{"label":"蔗糖","desc":"葡萄糖＋果糖；未水解時不是還原糖"},{"label":"乳糖","desc":"葡萄糖＋半乳糖；可由乳糖酶分解"},{"label":"麥芽糖","desc":"葡萄糖＋葡萄糖；可由澱粉分解產生"},{"label":"纖維素","desc":"植物多醣；人體缺少適合的纖維素酶"},{"label":"寡醣","desc":"本課採 3–9 個單醣單位；有些可消化，有些不可消化"}]},{"type":"note","title":"短活動 1｜麵包裡有什麼醣？\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 1: Bánh mì có loại saccharide nào?\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"classify\">\u003cp class=\"activity-time\">1 分鐘 / 1 phút\u003c/p>\u003cp class=\"activity-prompt\">麵包配方有麵粉和砂糖。麵粉中的澱粉、砂糖中的蔗糖，各屬哪一類？\u003cspan class=\"vn\" lang=\"vi\">Công thức bánh mì có bột mì và đường cát. Tinh bột trong bột mì và sucrose trong đường cát thuộc loại nào?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>＿＿屬於＿＿，因為它有＿＿。\u003cspan class=\"vn\" lang=\"vi\">___ thuộc nhóm ___ vì có ___.\u003c/span>\u003c/div>\u003clabel for=\"general-w3-classify\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w3-classify\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>蔗糖屬於雙醣，因為它有兩個單醣單位。澱粉屬於多醣。\u003cspan class=\"vn\" lang=\"vi\">Sucrose là đường đôi vì có hai đơn vị đường đơn. Tinh bột là polysaccharide.\u003c/span>\u003c/p>\u003cp>分類看分子的單醣單位數，不看食品甜不甜；麵粉也不是純澱粉。\u003cspan class=\"vn\" lang=\"vi\">Phân loại theo số đơn vị đường đơn trong phân tử, không theo vị ngọt; bột mì cũng không phải tinh bột tinh khiết.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"}]},{"id":"m-starch","nav":"澱粉：糊化與老化","kicker":"MODULE 2 · 單元二","h2":"澱粉：勾芡、卡士達與隔夜麵包的科學","lead":"一般未改質澱粉可在冷水中分散，但要適量水與足夠加熱才會充分糊化；稠度、成膠和老化受到分子結構及配方共同影響。","blocks":[{"type":"compare","title":"一、澱粉的兩種分子：amylose 與 amylopectin","hint":"不要把常見範例 25%／75% 當成所有澱粉的固定組成。","left":{"h":"直鏈澱粉 Amylose","en":"Mainly linear","c":"#2D2A6E","li":["主要為 α-1,4 長鏈，部分分子可能有少量分枝","糊化後較容易形成網絡與凝膠；受濃度及其他成分影響","早期回凝常較快，但不是麵包長期硬化的唯一來源"]},"right":{"h":"支鏈澱粉 Amylopectin","en":"Branched","c":"#F5A623","li":["α-1,4 主鏈與 α-1,6 分枝","支鏈也會重新排列與結晶；不可寫成「不會老化」","糯性原料通常以支鏈為主，比例仍依品種而異"]},"note":"太白粉的原料可能是馬鈴薯、木薯等；比較前先確認產品成分標示。"},{"type":"note","title":"","text":"25%／75% 不是所有澱粉的固定比例；透明、黏稠、成膠與老化也受濃度、加工和保存條件影響。\u003cspan class=\"vn\" lang=\"vi\">25%/75% không phải tỷ lệ cố định của mọi tinh bột. Độ trong, độ sánh, tạo gel và thoái hóa còn tùy nồng độ, chế biến và bảo quản.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.1146/annurev.food.102308.124211\" target=\"_blank\" rel=\"noopener\">澱粉與加工 / Tinh bột: Delcour et al., 2010 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"糊化 → 冷卻與老化\u003cspan class=\"vn\" lang=\"vi\">Hồ hóa → làm nguội và thoái hóa\u003c/span>","cols":3,"items":[{"h":"① 原生澱粉粒\u003cspan class=\"vn\" lang=\"vi\">Hạt tinh bột tự nhiên\u003c/span>","p":"冷水中可分散；一般未改質澱粉不會因此充分糊化。\u003cspan class=\"vn\" lang=\"vi\">Có thể phân tán trong nước lạnh; tinh bột thường chưa biến tính không hồ hóa đầy đủ chỉ vì vậy.\u003c/span>","c":"#2D2A6E"},{"h":"② 水＋足夠加熱\u003cspan class=\"vn\" lang=\"vi\">Nước + gia nhiệt đủ\u003c/span>","p":"顆粒吸水膨潤、有序結構減少；長時間加熱或攪拌可使顆粒破裂。\u003cspan class=\"vn\" lang=\"vi\">Hạt hút nước, trương nở, giảm cấu trúc có trật tự; đun lâu hoặc khuấy có thể làm vỡ hạt.\u003c/span>","c":"#F5A623"},{"h":"③ 冷卻、存放\u003cspan class=\"vn\" lang=\"vi\">Làm nguội, bảo quản\u003c/span>","p":"分子重新排列，可能變硬或離水；直鏈、支鏈都可能參與。\u003cspan class=\"vn\" lang=\"vi\">Phân tử sắp xếp lại, có thể cứng hơn hoặc tách nước; cả amylose và amylopectin có thể tham gia.\u003c/span>","c":"#5B4FB8"}]},{"type":"note","title":"","text":"糊化不是所有澱粉都在 60°C 開始；溫度範圍取決於來源、水量與配方。「顆粒破裂」不是判定糊化開始的必要條件。\u003cspan class=\"vn\" lang=\"vi\">Không phải mọi tinh bột bắt đầu hồ hóa ở 60°C; khoảng nhiệt độ tùy nguồn, lượng nước và công thức. Hạt vỡ không phải điều kiện cần để bắt đầu hồ hóa.\u003c/span>"},{"type":"cards","title":"勾芡：觀察三個條件\u003cspan class=\"vn\" lang=\"vi\">Làm sánh: xem ba điều kiện\u003c/span>","cols":3,"items":[{"h":"先分散，再加熱\u003cspan class=\"vn\" lang=\"vi\">Phân tán trước, rồi đun\u003c/span>","p":"一般澱粉先用冷水拌開，再加入熱湯攪拌；減少結塊。\u003cspan class=\"vn\" lang=\"vi\">Hòa tinh bột thường với nước lạnh, rồi cho vào súp nóng và khuấy để giảm vón cục.\u003c/span>","c":"#2D2A6E"},{"h":"配方裡的糖\u003cspan class=\"vn\" lang=\"vi\">Đường trong công thức\u003c/span>","p":"足量的糖常使糊化更困難；效果取決於糖量和水量。\u003cspan class=\"vn\" lang=\"vi\">Đủ đường thường làm hồ hóa khó hơn; hiệu quả tùy lượng đường và nước.\u003c/span>","c":"#2FA36B"},{"h":"酸＋加熱時間\u003cspan class=\"vn\" lang=\"vi\">Axit + thời gian đun\u003c/span>","p":"酸性條件下久煮可能使澱粉分解、變稀；依澱粉與配方測試。\u003cspan class=\"vn\" lang=\"vi\">Đun lâu trong môi trường axit có thể phân giải tinh bột, làm loãng; cần thử theo loại và công thức.\u003c/span>","c":"#F5A623"}]},{"type":"cards","title":"無餡烘焙麵包：口感與安全分開看\u003cspan class=\"vn\" lang=\"vi\">Bánh mì nướng không nhân: tách kết cấu và an toàn\u003c/span>","cols":2,"items":[{"h":"冷藏約 4°C\u003cspan class=\"vn\" lang=\"vi\">Ngăn mát khoảng 4°C\u003c/span>","p":"研究條件下，回凝與麵包心硬化常比 25°C 更快。\u003cspan class=\"vn\" lang=\"vi\">Trong điều kiện nghiên cứu, tái kết tinh và cứng ruột bánh thường nhanh hơn ở 25°C.\u003c/span>","c":"#2D2A6E"},{"h":"冷凍約 −18°C\u003cspan class=\"vn\" lang=\"vi\">Cấp đông khoảng −18°C\u003c/span>","p":"可延緩老化，並非完全停止；包裝與解凍方式也重要。\u003cspan class=\"vn\" lang=\"vi\">Có thể làm chậm thoái hóa, không dừng hoàn toàn; bao bì và cách rã đông cũng quan trọng.\u003c/span>","c":"#2FA36B"}]},{"type":"note","title":"","text":"範圍：一般烘焙麵包的口感研究，實際結果依配方、包裝與時間而異。含餡麵包、熟飯仍依保存標示及衛生原則處理；不能為了口感忽略安全。\u003cspan class=\"vn\" lang=\"vi\">Phạm vi: nghiên cứu kết cấu bánh mì nướng; kết quả tùy công thức, bao bì và thời gian. Bánh có nhân và cơm chín vẫn cần bảo quản theo nhãn và nguyên tắc vệ sinh, không bỏ qua an toàn vì kết cấu.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.1002/star.201100023\" target=\"_blank\" rel=\"noopener\">25／4／−18°C 比較 / So sánh: Aguirre et al., 2011 ↗\u003c/a>\u003c/p>"},{"type":"note","title":"","text":"適當回熱可使部分回凝結構鬆開、口感變軟，但不等於回到剛出爐狀態；變軟也不是安全證明。\u003cspan class=\"vn\" lang=\"vi\">Gia nhiệt lại phù hợp có thể làm lỏng một phần cấu trúc tái kết tinh, giúp mềm hơn, nhưng không trở lại hoàn toàn như mới nướng; mềm hơn không chứng minh an toàn.\u003c/span>"},{"type":"note","title":"","text":"麵包老化包含澱粉回凝與水分在成分間重新分配；烘焙條件也會改變後續硬化。冷凍醬汁的離水另受冰晶與凍融循環影響，不能簡化成「冷凍都加速老化」。\u003cspan class=\"vn\" lang=\"vi\">Bánh mì bị cũ gồm tái kết tinh tinh bột và phân bố lại nước; điều kiện nướng cũng ảnh hưởng độ cứng sau đó. Tách nước của sốt đông lạnh còn do tinh thể đá và chu kỳ đông–rã; không nói cấp đông luôn tăng tốc thoái hóa.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.1016/j.foodchem.2013.06.031\" target=\"_blank\" rel=\"noopener\">麵包心與保存 / Ruột bánh: Bosmans et al., 2013 ↗\u003c/a>\u003c/p>"},{"type":"cards","title":"延伸示範：等條件比較兩種澱粉","cols":3,"items":[{"h":"① 先確認與秤重\u003cspan class=\"vn\" lang=\"vi\">Xác nhận và cân\u003c/span>","p":"確認原料標示；兩組秤相同澱粉與水的質量。\u003cspan class=\"vn\" lang=\"vi\">Xem nhãn; cân cùng khối lượng tinh bột và nước cho hai mẫu.\u003c/span>","c":"#2D2A6E"},{"h":"② 同樣加熱與攪拌\u003cspan class=\"vn\" lang=\"vi\">Đun và khuấy như nhau\u003c/span>","p":"控制加熱時間、溫度與攪拌，記錄稠度及透明度。\u003cspan class=\"vn\" lang=\"vi\">Giữ thời gian, nhiệt độ và khuấy giống nhau; ghi độ sánh và độ trong.\u003c/span>","c":"#2FA36B"},{"h":"③ 冷卻後再觀察\u003cspan class=\"vn\" lang=\"vi\">Quan sát sau làm nguội\u003c/span>","p":"同樣包裝與時間，觀察成膠或離水；不要預設某種一定比較好。\u003cspan class=\"vn\" lang=\"vi\">Cùng bao bì và thời gian, quan sát gel hoặc tách nước; không định trước loại nào luôn tốt hơn.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"短活動 2｜麵包變硬，怎麼解釋？\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 2: Vì sao bánh mì cứng hơn?\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"observe\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">同批無餡麵包、相同包裝，冷藏後變硬。寫一個可能原因，以及比較時要控制的條件。\u003cspan class=\"vn\" lang=\"vi\">Bánh mì không nhân cùng mẻ, cùng bao bì, cứng hơn sau khi để ngăn mát. Nêu một nguyên nhân có thể và điều kiện cần giữ giống nhau khi so sánh.\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>我觀察到＿＿；可能因為＿＿。比較時要讓＿＿一樣。\u003cspan class=\"vn\" lang=\"vi\">Tôi thấy ___; có thể vì ___. Khi so sánh cần giữ ___ giống nhau.\u003c/span>\u003c/div>\u003clabel for=\"general-w3-observe\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w3-observe\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>我觀察到麵包變硬；可能因為澱粉老化。比較時要讓配方、包裝和保存時間一樣。\u003cspan class=\"vn\" lang=\"vi\">Tôi thấy bánh mì cứng hơn; có thể do tinh bột thoái hóa. Cần giữ công thức, bao bì và thời gian bảo quản giống nhau.\u003c/span>\u003c/p>\u003cp>老化和水分遷移都會影響硬度；只摸到變硬，不能證明唯一原因或判定安全。\u003cspan class=\"vn\" lang=\"vi\">Thoái hóa và sự di chuyển của nước đều ảnh hưởng độ cứng; chỉ thấy cứng hơn không chứng minh một nguyên nhân duy nhất hay độ an toàn.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"}]},{"id":"m-fiber","nav":"纖維與增稠劑","kicker":"MODULE 3 · 單元三","h2":"纖維、消化與增稠：三種不同問題","lead":"能不能消化，要看酵素與結構；能不能增稠，要看水合、濃度與配方。不要把所有寡醣當纖維，也不要把所有凝膠材料當成醣類。","blocks":[{"type":"cards","title":"纖維和增稠劑，不是同一分類\u003cspan class=\"vn\" lang=\"vi\">Chất xơ và chất làm đặc không cùng cách phân loại\u003c/span>","cols":4,"items":[{"h":"纖維素\u003cspan class=\"vn\" lang=\"vi\">Cellulose\u003c/span>","p":"人體缺少分解它的纖維素酶；不是「所有 β 鍵都不能分解」。\u003cspan class=\"vn\" lang=\"vi\">Cơ thể thiếu cellulase để phân giải cellulose; không phải mọi liên kết β đều không phân giải được.\u003c/span>","c":"#2D2A6E"},{"h":"寡醣\u003cspan class=\"vn\" lang=\"vi\">Oligosaccharide\u003c/span>","p":"有些可消化，有些可被腸道菌利用；不能全部算成纖維。\u003cspan class=\"vn\" lang=\"vi\">Có loại tiêu hóa được, có loại được vi khuẩn ruột sử dụng; không phải tất cả là chất xơ.\u003c/span>","c":"#2FA36B"},{"h":"果膠\u003cspan class=\"vn\" lang=\"vi\">Pectin\u003c/span>","p":"植物多醣；凝膠條件依種類不同。\u003cspan class=\"vn\" lang=\"vi\">Polysaccharide thực vật; điều kiện tạo gel tùy loại.\u003c/span>","c":"#F5A623"},{"h":"明膠\u003cspan class=\"vn\" lang=\"vi\">Gelatin\u003c/span>","p":"動物來源的蛋白質；可成膠，但不是醣類。\u003cspan class=\"vn\" lang=\"vi\">Protein nguồn động vật; tạo gel nhưng không phải saccharide.\u003c/span>","c":"#5B4FB8"}]},{"type":"note","title":"","text":"酵素要能辨認特定結構。例如乳糖也有 β 鍵，卻可由乳糖酶分解。不同纖維的發酵程度不同，不把所有纖維一律寫成 0 kcal。\u003cspan class=\"vn\" lang=\"vi\">Enzyme cần nhận đúng cấu trúc. Lactose cũng có liên kết β nhưng được lactase phân giải. Mức lên men của chất xơ khác nhau; không ghi tất cả là 0 kcal.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://www.fao.org/4/w8079e/w8079e0h.htm\" target=\"_blank\" rel=\"noopener\">消化與結構 / Tiêu hóa: FAO ↗\u003c/a>\u003c/p>"},{"type":"note","title":"","text":"果膠延伸：高甲氧基果膠常靠糖與酸成膠；低甲氧基果膠可靠鈣離子成膠。要先看原料種類與配方。\u003cspan class=\"vn\" lang=\"vi\">Mở rộng: pectin methoxyl cao thường tạo gel nhờ đường và axit; loại methoxyl thấp có thể tạo gel với ion canxi. Cần xem loại nguyên liệu và công thức.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/9067088/\" target=\"_blank\" rel=\"noopener\">果膠種類 / Các loại pectin: Thakur et al., 1997 ↗\u003c/a>\u003c/p>"},{"type":"note","title":"","text":"有些纖維可被腸道菌發酵，有些較難；溶解性、黏度與發酵性是不同性質。這些性質會影響食品與生理作用，不能只用「可溶／不可溶」推論全部效果。\u003cspan class=\"vn\" lang=\"vi\">Một số chất xơ được vi khuẩn ruột lên men, một số khó hơn. Độ hòa tan, độ nhớt và khả năng lên men là các tính chất khác nhau; không suy ra mọi tác dụng chỉ từ hòa tan hay không hòa tan.\u003c/span>"},{"type":"note","title":"","text":"糊精是澱粉部分分解得到的混合物，不保證都比較甜；「變甜」不能單獨證明生成糊精。\u003cspan class=\"vn\" lang=\"vi\">Dextrin là hỗn hợp từ tinh bột phân giải một phần, không bảo đảm luôn ngọt hơn; vị ngọt hơn không tự chứng minh có dextrin.\u003c/span>"}]},{"id":"m-brown","nav":"褐變反應","kicker":"MODULE 4 · 單元四","h2":"非酵素褐變：看反應物，再看加工條件","lead":"褐色是觀察，反應機制是推論。梅納反應與焦糖化可以在同一食品中並存，但不能只靠顏色認定比例。","blocks":[{"type":"cards","title":"兩種非酵素褐變：看反應物\u003cspan class=\"vn\" lang=\"vi\">Hai kiểu hóa nâu không enzyme: xem chất phản ứng\u003c/span>","cols":2,"items":[{"h":"梅納反應\u003cspan class=\"vn\" lang=\"vi\">Phản ứng Maillard\u003c/span>","p":"還原糖＋可反應的胺基；胺基可來自胺基酸、胜肽或蛋白質。\u003cspan class=\"vn\" lang=\"vi\">Đường khử + nhóm amin phản ứng được; nhóm amin có thể từ axit amin, peptide hoặc protein.\u003c/span>","c":"#2D2A6E"},{"h":"焦糖化\u003cspan class=\"vn\" lang=\"vi\">Caramel hóa\u003c/span>","p":"糖受熱發生一連串反應；不需要胺基參與。\u003cspan class=\"vn\" lang=\"vi\">Đường biến đổi qua nhiều phản ứng khi đun nóng; không cần nhóm amin.\u003c/span>","c":"#F5A623"}]},{"type":"note","title":"","text":"這是兩種非酵素褐變，不是全部褐變。實際食品可能有多種反應，不能只看「有無蛋白質」或顏色判定。\u003cspan class=\"vn\" lang=\"vi\">Đây là hai kiểu hóa nâu không enzyme, không phải mọi kiểu hóa nâu. Thực phẩm có thể có nhiều phản ứng; không kết luận chỉ từ protein hay màu.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.1021/acs.jafc.7b00882\" target=\"_blank\" rel=\"noopener\">梅納反應物與條件 / Maillard: Lund & Ray, 2017 ↗\u003c/a>\u003c/p>"},{"type":"note","title":"","text":"焦糖化沒有一個適用所有糖與食品的固定起始溫度；糖的種類、水量、時間與酸鹼條件都會影響。純糖加熱成糖色，是較清楚的例子。\u003cspan class=\"vn\" lang=\"vi\">Caramel hóa không có một nhiệt độ bắt đầu chung cho mọi đường và thực phẩm; còn tùy loại đường, lượng nước, thời gian và pH. Đun đường tinh khiết thành nước màu là ví dụ rõ hơn.\u003c/span>\u003cp class=\"source-note\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/21175200/\" target=\"_blank\" rel=\"noopener\">溫度與時間 / Nhiệt độ và thời gian: Lee et al., 2011 ↗\u003c/a>\u003c/p>"},{"type":"flips","title":"影響梅納反應的條件（點卡片）","cols":4,"items":[{"t":"溫度與時間\u003cspan class=\"vn\" lang=\"vi\">Nhiệt độ và thời gian\u003c/span>","b":"加熱常加快反應；不能只看爐溫，還要看食品溫度與時間。\u003cspan class=\"vn\" lang=\"vi\">Gia nhiệt thường tăng tốc phản ứng; xem cả nhiệt độ thực phẩm và thời gian.\u003c/span>","c":"#2D2A6E"},{"t":"水活性 aw\u003cspan class=\"vn\" lang=\"vi\">Hoạt độ nước aw\u003c/span>","b":"水太少可能限制移動，太多可能稀釋；沒有通用最快區間。\u003cspan class=\"vn\" lang=\"vi\">Quá ít nước có thể hạn chế di chuyển, quá nhiều có thể pha loãng; không có khoảng nhanh nhất chung.\u003c/span>","c":"#2FA36B"},{"t":"酸鹼條件\u003cspan class=\"vn\" lang=\"vi\">Độ pH\u003c/span>","b":"其他條件相同時，偏鹼常較快；實際效果仍看配方。\u003cspan class=\"vn\" lang=\"vi\">Khi điều kiện khác như nhau, pH kiềm thường nhanh hơn; còn tùy công thức.\u003c/span>","c":"#F5A623"},{"t":"反應物種類\u003cspan class=\"vn\" lang=\"vi\">Loại chất phản ứng\u003c/span>","b":"要有還原糖與可反應胺基；不是任何糖都相同。\u003cspan class=\"vn\" lang=\"vi\">Cần đường khử và nhóm amin phản ứng được; không phải mọi đường đều giống nhau.\u003c/span>","c":"#5B4FB8"}]},{"type":"cards","title":"烤吐司：把觀察和推論分開\u003cspan class=\"vn\" lang=\"vi\">Bánh mì nướng: tách quan sát và suy luận\u003c/span>","cols":3,"items":[{"h":"先觀察\u003cspan class=\"vn\" lang=\"vi\">Quan sát trước\u003c/span>","p":"變褐、變香、表面變乾。\u003cspan class=\"vn\" lang=\"vi\">Nâu hơn, thơm hơn, bề mặt khô hơn.\u003c/span>","c":"#2D2A6E"},{"h":"再推論\u003cspan class=\"vn\" lang=\"vi\">Rồi suy luận\u003c/span>","p":"有還原糖、胺基與加熱，推測有梅納反應。\u003cspan class=\"vn\" lang=\"vi\">Có đường khử, nhóm amin và gia nhiệt: dự đoán có Maillard.\u003c/span>","c":"#2FA36B"},{"h":"補證據\u003cspan class=\"vn\" lang=\"vi\">Thêm bằng chứng\u003c/span>","p":"焦糖化與澱粉降解依條件而定；不能保證三個反應都有。\u003cspan class=\"vn\" lang=\"vi\">Caramel hóa và phân giải tinh bột tùy điều kiện; không bảo đảm luôn có ba phản ứng.\u003c/span>","c":"#F5A623"}]},{"type":"exp","title":"延伸：用條件解釋現象","items":[{"h":"蔗糖不是還原糖，為何配方仍可能有梅納反應？","body":["配方可能本來含有葡萄糖、乳糖等還原糖；蔗糖水解後也可產生葡萄糖與果糖。","仍需要可反應的胺基；不能把純糖系統與含蛋白質的複合食品混為一談。"]},{"h":"水活性高低，能直接預測褐變最快點嗎？","body":["不能。水會影響反應物移動與稀釋，最佳區域取決於反應物、溫度及食品基質。","第 2 週的 aw 是水的可利用性指標，不是反應速率本身；需要在指定條件下比較。"]},{"h":"烤吐司變甜，是否證明生成糊精？","body":["不能。糊精是不同鏈長的混合物，甜度並非固定；水分、香氣和其他糖也可能改變感受。","先描述觀察，再提出可比較的條件或分析方法。"]}]},{"type":"note","title":"短活動 3｜吐司變褐，證據夠嗎？\u003cspan class=\"vn\" lang=\"vi\">Hoạt động 3: Bánh mì nâu hơn, đủ bằng chứng chưa?\u003c/span>","text":"\u003cdiv class=\"class-activity\" data-activity=\"reason\">\u003cp class=\"activity-time\">2 分鐘 / 2 phút\u003c/p>\u003cp class=\"activity-prompt\">吐司烤後變褐、變香。已知配方有還原糖和蛋白質。你推測什麼反應？只靠顏色能確定嗎？\u003cspan class=\"vn\" lang=\"vi\">Bánh mì nướng nâu hơn và thơm hơn. Biết công thức có đường khử và protein. Bạn dự đoán phản ứng gì? Chỉ dựa vào màu có chắc không?\u003c/span>\u003c/p>\u003cdiv class=\"sentence-stem\">\u003cb>中文句型 / Mẫu câu tiếng Trung\u003c/b>\u003cbr>我推測有＿＿，因為＿＿；但只看＿＿還不夠。\u003cspan class=\"vn\" lang=\"vi\">Tôi dự đoán có ___ vì ___; nhưng chỉ nhìn ___ là chưa đủ.\u003c/span>\u003c/div>\u003clabel for=\"general-w3-reason\">先和同學說，再寫一兩句。 / \u003cspan lang=\"vi\">Nói với bạn rồi viết một hoặc hai câu.\u003c/span>\u003c/label>\u003ctextarea id=\"general-w3-reason\" class=\"activity-response\" rows=\"2\" placeholder=\"寫下你的回答 / Viết câu trả lời\">\u003c/textarea>\u003cdetails class=\"activity-answer\">\u003csummary>參考回答（不只一種） / \u003cspan lang=\"vi\">Câu trả lời tham khảo\u003c/span>\u003c/summary>\u003cp>我推測有梅納反應，因為有還原糖、胺基來源和加熱；但只看顏色還不夠。\u003cspan class=\"vn\" lang=\"vi\">Tôi dự đoán có phản ứng Maillard vì có đường khử, nguồn nhóm amin và gia nhiệt; nhưng chỉ nhìn màu là chưa đủ.\u003c/span>\u003c/p>\u003cp>這是根據原料與條件的推論。若要分辨貢獻，還要比較配方、加熱條件或分析資料。\u003cspan class=\"vn\" lang=\"vi\">Đây là suy luận từ nguyên liệu và điều kiện. Muốn phân biệt mức đóng góp cần so sánh công thức, điều kiện gia nhiệt hoặc dữ liệu phân tích.\u003c/span>\u003c/p>\u003c/details>\u003c/div>"},{"type":"cards","title":"回顧與應用","cols":2,"items":[{"h":"分類看單醣單位數；食品可能是混合物\u003cspan class=\"vn\" lang=\"vi\">Phân loại theo số đơn vị đường đơn; thực phẩm có thể là hỗn hợp\u003c/span>"},{"h":"糊化要看水與熱；直鏈、支鏈都可能老化\u003cspan class=\"vn\" lang=\"vi\">Hồ hóa cần xem nước và nhiệt; cả amylose và amylopectin có thể thoái hóa\u003c/span>"},{"h":"麵包硬化不只失水；保存同時考慮安全\u003cspan class=\"vn\" lang=\"vi\">Bánh mì cứng không chỉ do mất nước; bảo quản cũng cần an toàn\u003c/span>"},{"h":"褐變先看反應物與條件，顏色不是唯一證據\u003cspan class=\"vn\" lang=\"vi\">Xem chất phản ứng và điều kiện; màu không phải bằng chứng duy nhất\u003c/span>"}]}]},{"id":"m-quiz","nav":"綜合測驗","kicker":"MODULE 5 · 綜合測驗","h2":"小測驗：檢核學習成效","lead":"與 A2 版共用 10 題核心檢核；作答後讀解釋，再用中文說明。分子結構、配方比較與加工條件保留為延伸內容。","blocks":[{"type":"quiz","items":[{"q":"「tinh bột」是哪個中文？\u003cspan class=\"vn\" lang=\"vi\">\"tinh bột\" là từ tiếng Trung nào?\u003c/span>","o":["果膠 Pectin","澱粉 Tinh bột","明膠 Gelatin","乳糖 Lactose"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 澱粉是多醣，明膠是蛋白質；不能因為都能讓食品變稠，就分成同一類。\u003cspan class=\"vn\" lang=\"vi\">Tinh bột là polysaccharide, gelatin là protein; cùng làm đặc không có nghĩa cùng loại.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：澱粉是多醣。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tinh bột là polysaccharide.\u003c/span>\u003c/div>"},{"q":"葡萄糖和果糖屬於哪一類？\u003cspan class=\"vn\" lang=\"vi\">Glucose và fructose thuộc nhóm nào?\u003c/span>","o":["雙醣 Đường đôi","多醣 Polysaccharide","單醣 Đường đơn","蛋白質 Protein"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 每個分子各是一個單醣單位。甜不甜不是分類依據；蔗糖則由兩個單醣組成。\u003cspan class=\"vn\" lang=\"vi\">Mỗi phân tử là một đơn vị đường đơn. Không phân loại theo vị ngọt; sucrose gồm hai đơn vị.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：葡萄糖是單醣；蔗糖是雙醣。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Glucose là đường đơn; sucrose là đường đôi.\u003c/span>\u003c/div>"},{"q":"「méinà fǎnyìng」是哪個詞？\u003cspan class=\"vn\" lang=\"vi\">\"méinà fǎnyìng\" là từ nào?\u003c/span>","o":["梅納反應 Maillard","焦糖化 Caramel hóa","糊化 Hồ hóa","老化 Thoái hóa"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 梅納反應的起始反應物包括還原糖與可反應的胺基；焦糖化不需要胺基。兩者都是非酵素褐變的例子。\u003cspan class=\"vn\" lang=\"vi\">Maillard bắt đầu từ đường khử và nhóm amin phản ứng được; caramel hóa không cần nhóm amin. Cả hai là ví dụ hóa nâu không enzyme.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：梅納反應需要還原糖和胺基。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Maillard cần đường khử và nhóm amin.\u003c/span>\u003c/div>"},{"q":"哪個雙醣由「葡萄糖＋半乳糖」組成？\u003cspan class=\"vn\" lang=\"vi\">Đường đôi nào gồm glucose + galactose?\u003c/span>","o":["蔗糖 Sucrose","麥芽糖 Maltose","澱粉 Tinh bột","乳糖 Lactose"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 乳糖由葡萄糖與半乳糖組成，可由乳糖酶分解。蔗糖則是葡萄糖＋果糖，麥芽糖是兩個葡萄糖。分類時先看組成。\u003cspan class=\"vn\" lang=\"vi\">Lactose gồm glucose và galactose, được lactase phân giải. Sucrose gồm glucose và fructose; maltose gồm hai glucose. Khi phân loại hãy xem thành phần trước.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：乳糖需要乳糖酶分解。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Lactose cần lactase để phân giải.\u003c/span>\u003c/div>"},{"q":"一般未改質澱粉充分糊化，哪組條件最合適？\u003cspan class=\"vn\" lang=\"vi\">Điều kiện nào phù hợp nhất để tinh bột thường chưa biến tính hồ hóa đầy đủ?\u003c/span>","o":["只有冷水 Chỉ nước lạnh","只有乾熱 Chỉ nhiệt khô","適量水＋足夠加熱 Đủ nước + gia nhiệt đủ","完全不加水也不加熱 Không nước, không nhiệt"],"a":2,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 糊化需要合適的水量與熱，溫度範圍依澱粉及配方而異。冷水可分散澱粉，但不等於已經糊化。\u003cspan class=\"vn\" lang=\"vi\">Hồ hóa cần lượng nước và nhiệt phù hợp; khoảng nhiệt độ tùy tinh bột và công thức. Phân tán trong nước lạnh không có nghĩa đã hồ hóa.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：冷水先拌開，再加熱。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Hòa với nước lạnh trước, rồi đun.\u003c/span>\u003c/div>"},{"q":"人體不能分解纖維素，主要是因為什麼？\u003cspan class=\"vn\" lang=\"vi\">Vì sao cơ thể không phân giải được cellulose?\u003c/span>","o":["所有 β 鍵都不能分解 Mọi liên kết β đều không phân giải được","只因為分子大 Chỉ vì phân tử lớn","加熱後變成蛋白質 Sau khi đun thành protein","缺少適合的纖維素酶 Thiếu enzyme cellulase phù hợp"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 酵素要辨認特定結構。乳糖也有 β 鍵，卻能由乳糖酶分解；不能把纖維素的情形推廣到所有 β 鍵。\u003cspan class=\"vn\" lang=\"vi\">Enzyme nhận cấu trúc cụ thể. Lactose cũng có liên kết β nhưng được lactase phân giải; không áp dụng kết luận về cellulose cho mọi liên kết β.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：人體缺少分解纖維素的酵素。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Cơ thể thiếu enzyme phân giải cellulose.\u003c/span>\u003c/div>"},{"q":"關於直鏈和支鏈澱粉，哪句正確？\u003cspan class=\"vn\" lang=\"vi\">Câu nào đúng về amylose và amylopectin?\u003c/span>","o":["比例依來源而異，兩者都可能老化 Tỷ lệ tùy nguồn, cả hai có thể thoái hóa","所有澱粉都是 25%／75% Mọi tinh bột đều 25%/75%","支鏈永遠不老化 Amylopectin không bao giờ thoái hóa","比例只由保存溫度決定 Tỷ lệ chỉ do nhiệt độ bảo quản quyết định"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 原料與品種會改變組成。直鏈常較快形成凝膠；支鏈也會重新排列，與麵包存放後的硬化有關。\u003cspan class=\"vn\" lang=\"vi\">Nguồn và giống làm thay đổi thành phần. Amylose thường tạo gel nhanh hơn; amylopectin cũng sắp xếp lại và liên quan đến cứng bánh khi bảo quản.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：支鏈澱粉也會老化。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Amylopectin cũng thoái hóa.\u003c/span>\u003c/div>"},{"q":"同批無餡麵包冷藏後變硬，哪個解釋最合理？\u003cspan class=\"vn\" lang=\"vi\">Bánh mì không nhân cùng mẻ cứng hơn sau khi để ngăn mát. Giải thích nào hợp lý nhất?\u003c/span>","o":["一定只有失水 Chắc chắn chỉ do mất nước","只要回熱就完全恢復原狀 Chỉ cần đun lại là trở về hoàn toàn như ban đầu","冷藏只改變顏色，不改變結構 Ngăn mát chỉ đổi màu, không đổi cấu trúc","老化及水分遷移都可能影響 Thoái hóa và di chuyển nước đều có thể ảnh hưởng"],"a":3,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 硬度受到澱粉回凝、水分遷移與配方等影響。一般烘焙麵包的研究不能直接當作熟飯或含餡麵包的保存指示。\u003cspan class=\"vn\" lang=\"vi\">Độ cứng tùy tái kết tinh tinh bột, di chuyển nước và công thức. Không dùng nghiên cứu bánh mì thường làm hướng dẫn bảo quản cơm hay bánh có nhân.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：麵包變硬可能和澱粉老化有關。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Bánh mì cứng hơn có thể liên quan đến thoái hóa tinh bột.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://doi.org/10.1002/star.201100023\" target=\"_blank\" rel=\"noopener\">麵包研究 / Nghiên cứu bánh mì: Aguirre et al., 2011 ↗\u003c/a>\u003c/p>"},{"q":"只加熱純砂糖製作糖色，不需胺基的主要褐變稱為什麼？\u003cspan class=\"vn\" lang=\"vi\">Đun đường cát tinh khiết làm nước màu, kiểu hóa nâu không cần nhóm amin gọi là gì?\u003c/span>","o":["糊化 Hồ hóa","焦糖化 Caramel hóa","老化 Thoái hóa","乳化 Nhũ hóa"],"a":1,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 焦糖化是糖受熱的一連串變化；沒有所有糖共用的單一起始溫度。肉或麵包等混合食品可能同時有其他反應。\u003cspan class=\"vn\" lang=\"vi\">Caramel hóa gồm nhiều biến đổi của đường khi đun; không có một nhiệt độ bắt đầu chung cho mọi loại đường. Thịt hay bánh mì có thể có phản ứng khác cùng lúc.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：純糖加熱可發生焦糖化。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Đun đường tinh khiết có thể gây caramel hóa.\u003c/span>\u003c/div>\u003cp class=\"source-note\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/21175200/\" target=\"_blank\" rel=\"noopener\">糖的加熱條件 / Gia nhiệt đường: Lee et al., 2011 ↗\u003c/a>\u003c/p>"},{"q":"吐司變褐又變香，已知有還原糖和蛋白質，可以怎麼說？\u003cspan class=\"vn\" lang=\"vi\">Bánh mì nâu và thơm hơn, có đường khử và protein. Có thể nói gì?\u003c/span>","o":["推測有梅納反應，還要看條件 Dự đoán có Maillard, cần xem điều kiện","只看顏色就能確定所有反應 Chỉ màu đủ xác định mọi phản ứng","保證每次都同時有三種反應 Luôn chắc có ba phản ứng","變褐就證明內部安全 Nâu hơn chứng minh bên trong an toàn"],"a":0,"e":"\u003cdiv class=\"feedback-reason\">\u003cb>為什麼？ / Vì sao?\u003c/b> 還原糖、胺基來源與加熱支持梅納反應的推論，但顏色不能量出各反應的貢獻，也不能證明內部安全。\u003cspan class=\"vn\" lang=\"vi\">Đường khử, nguồn nhóm amin và gia nhiệt hỗ trợ suy luận Maillard; màu không định lượng đóng góp từng phản ứng hay chứng minh an toàn bên trong.\u003c/span>\u003c/div>\u003cdiv class=\"feedback-transfer\">練習說：我推測有梅納反應，因為原料和加熱條件適合。\u003cspan class=\"vn\" lang=\"vi\">Tập nói: Tôi dự đoán có Maillard vì nguyên liệu và điều kiện gia nhiệt phù hợp.\u003c/span>\u003c/div>"}]}]}]};</script>
<script>
/*
 * runtime.client.js — 跑在瀏覽器裡的渲染器（17 週共用，逐字內嵌進每份 HTML）
 * 讀 window.__LESSON__ 的資料，把 modules / blocks 畫出來。
 * 互動行為（翻卡、展開、配對、測驗）沿用週1 手寫版的做法，不要另創一套。
 */
(function () {
  var D = window.__LESSON__;
  var SERIES = D.series;
  var $ = function (s) { return document.querySelector(s); };
  // 國合班 A2 版（D.a2）：介面文字加越南文；一般班 U() 只回中文，畫面與原本完全相同
  var A2 = !!D.a2;
  function U(zh, vn) { return A2 ? zh + " " + vn : zh; }

  /* ---------- 學習歷程記錄（Supabase） ----------
     只在 lesson.js 注入 D.track = {url, key} 的週次啟用（lib/tracking.json 的 weeks）；
     其他週 TRACK.on 為 false，send() 是空函式，教材行為完全不變。
     只送「學號代碼」與互動事件，不送姓名。送失敗就丟掉，不重試、不阻擋教材。 */
  var CTX = { mod: null, bi: 0 };   // 目前正在渲染的模組 id 與區塊序號（render 是同步的）
  var TRACK = (function () {
    var cfg = D.track;
    var noop = function () {};
    if (!cfg || !cfg.url || !cfg.key) return { on: false, send: noop, flush: noop, code: function () { return ""; }, setCode: noop };
    var KEY = "ifs_code", DKEY = "ifs_device";
    var rnd = function () { return Math.random().toString(36).slice(2, 10); };
    var sid = rnd() + Date.now().toString(36);
    // device_id：同一支手機／瀏覽器跨次開頁不變。學生後來才填學號代碼時，先前的 anon 事件可靠它回接。
    var did = "";
    try { did = localStorage.getItem(DKEY) || ""; if (!did) { did = "d" + rnd() + rnd(); localStorage.setItem(DKEY, did); } } catch (e) { did = "d" + rnd(); }
    var q = [], timer = null;
    function code() { try { return (localStorage.getItem(KEY) || "").trim(); } catch (e) { return ""; } }
    function setCode(v) { try { localStorage.setItem(KEY, (v || "").trim().slice(0, 20)); } catch (e) {} }
    function cut(s, n) { return s == null ? null : String(s).slice(0, n); }
    // 欄位長度與 payload 大小在前端先截到資料表 CHECK 的上限：PostgREST 批次 INSERT 是原子的，
    // 一筆違反 CHECK 整批都會被拒，而我們失敗即丟，會靜默掉整個 4 秒窗口。
    function send(event, mod, block, payload) {
      var p = payload || {};
      var ps = JSON.stringify(p);
      if (ps.length > 1800) p = { trunc: true, keys: Object.keys(p).slice(0, 10) };
      q.push({
        student_code: cut(code(), 20) || "anon", device_id: cut(did, 40), week: D.week || 0,
        module_id: cut(mod, 30), block_type: cut(block, 10), event: cut(event, 30),
        payload: p, session_id: cut(sid, 40), build: cut(D.build, 16), client_ts: new Date().toISOString(),
      });
      if (q.length >= 40) flush();
      else if (!timer) timer = setTimeout(flush, 4000);
    }
    function flush() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!q.length) return;
      var body = JSON.stringify(q.splice(0, 50));
      try {
        fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/ifs_lesson_events", {
          method: "POST", keepalive: true, body: body,
          headers: { "Content-Type": "application/json", "apikey": cfg.key, "Prefer": "return=minimal" },
        }).catch(noop);
      } catch (e) { /* 舊瀏覽器沒有 fetch：不記錄 */ }
      if (q.length) timer = setTimeout(flush, 1000);
    }
    window.addEventListener("pagehide", flush);
    return { on: true, send: send, flush: flush, code: code, setCode: setCode };
  })();

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function colorAt(given, i) { return given || SERIES[i % SERIES.length]; }
  function gridCls(n) { return "grid g" + (n === 2 || n === 3 || n === 4 ? n : 3); }
  function listHtml(v) {
    // body 可以是字串或字串陣列；陣列渲染成 <ul>
    if (v == null) return "";
    if (typeof v === "string") return '<p>' + v + '</p>';
    return '<ul>' + v.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
  }

  /* ---------- 區塊標題 ---------- */
  function heading(frag, b) {
    if (b.title) frag.appendChild(el("div", "sec-title", '<span class="bar"></span>' + b.title));
    if (b.hint) frag.appendChild(el("div", "hint", b.hint));
  }

  /* ---------- 各區塊 ---------- */
  var BLOCKS = {};

  BLOCKS.flips = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (d, i) {
      var c = colorAt(d.c, i);
      var card = el("div", "flip");
      if (b.h) card.style.height = b.h + "px";
      card.innerHTML =
        '<div class="flip-in">' +
        '<div class="face front"><div class="cbar" style="background:' + c + '"></div>' +
        '<div class="t">' + d.t + '</div><div class="en">' + (d.en || "") + '</div>' +
        '<div class="tap">▸ ' + U("點我看解釋", "Chạm để xem") + '</div></div>' +
        '<div class="face back"><div class="cbar" style="background:' + c + '"></div>' +
        '<p>' + d.b + '</p></div></div>';
      var mod = CTX.mod, bi = CTX.bi;
      card.onclick = function () {
        if (card.classList.toggle("on")) TRACK.send("flip_open", mod, "flips", { b: bi, i: i, t: d.t });
      };
      g.appendChild(card);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.exp = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div");
    b.items.forEach(function (t, i) {
      var box = el("div", "exp");
      var res = t.res ? '<div style="margin-top:10px;font-size:13px;color:var(--secondary);font-weight:700">🔗 ' + t.res + '</div>' : "";
      box.innerHTML =
        '<button><span class="num">' + (i + 1) + '</span><span>' + t.h + '</span>' +
        '<span class="tag">' + (t.tag || "") + '</span><span class="chev">›</span></button>' +
        '<div class="body">' + listHtml(t.body) + res + '</div>';
      var body = box.querySelector(".body");
      var mod = CTX.mod, bi = CTX.bi;
      box.querySelector("button").onclick = function () {
        var on = box.classList.toggle("on");
        if (!on) { body.style.maxHeight = "0px"; return; }
        TRACK.send("exp_open", mod, "exp", { b: bi, i: i, h: t.h });
        // 用實際內容高度展開，避免長段落被固定 max-height 截掉。
        // 必須先解除 max-height 再量：在 max-height:0 的狀態下量 scrollHeight 會得到 0，
        // 面板就只會開一條縫（實測過）。量完歸零並強制重排，transition 才有起點。
        body.style.maxHeight = "none";
        var h = body.scrollHeight;
        body.style.maxHeight = "0px";
        void body.offsetHeight;
        body.style.maxHeight = h + "px";
      };
      host.appendChild(box);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.cards = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var g = el("div", gridCls(b.cols || 4));
    b.items.forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var box = el("div", "card");
      box.style.borderTop = "4px solid " + accent;
      box.innerHTML = '<div class="h">' + c.h + '</div>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        (c.li ? '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>' : "") +
        (c.p ? '<p style="margin-top:8px;font-size:15.5px;color:var(--mid)">' + c.p + '</p>' : "");
      g.appendChild(box);
    });
    f.appendChild(g); return f;
  };

  BLOCKS.timeline = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "tl");
    b.steps.forEach(function (s, i) {
      var st = el("div", "step");
      st.innerHTML = '<div class="dot" style="background:' + colorAt(s.c, i) + '">' + (i + 1) + '</div>' +
        '<h4>' + s.h + '</h4><p>' + s.p + '</p>';
      host.appendChild(st);
    });
    f.appendChild(host); return f;
  };

  BLOCKS.compare = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "cmp");
    [b.left, b.right].forEach(function (c, i) {
      var accent = colorAt(c.c, i);
      var col = el("div", "col");
      col.innerHTML = '<div class="cbar" style="background:' + accent + '"></div>' +
        '<h4 style="color:' + accent + '">' + c.h + '</h4>' +
        (c.en ? '<div class="en">' + c.en + '</div>' : "") +
        '<ul>' + c.li.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>';
      wrap.appendChild(col);
    });
    f.appendChild(wrap);
    if (b.note) f.appendChild(el("div", "cmp-note", b.note));
    return f;
  };

  BLOCKS.table = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var wrap = el("div", "tblwrap");
    var html = '<table class="tbl"><thead><tr>' +
      b.head.map(function (h) { return '<th>' + h + '</th>'; }).join("") + '</tr></thead><tbody>' +
      b.rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join("") + '</tr>';
      }).join("") + '</tbody></table>';
    wrap.innerHTML = html;
    f.appendChild(wrap); return f;
  };

  BLOCKS.note = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    f.appendChild(el("div", "note" + (b.kind ? " " + b.kind : ""), b.text));
    return f;
  };

  BLOCKS.match = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var host = el("div", "match-wrap");
    var pool = el("div", "pool"), targets = el("div", "targets");
    var pairs = b.pairs;
    var order = pairs.slice().sort(function () { return Math.random() - 0.5; });
    var selected = null, solved = 0, errors = 0, t0 = null;
    var mod = CTX.mod, bi = CTX.bi;
    var msg = el("div");
    msg.style.cssText = "margin-top:14px;font-weight:700;color:var(--green)";

    function tryMatch(slot, key) {
      if (slot.classList.contains("ok")) return;
      if (t0 === null) t0 = Date.now();
      if (slot.dataset.k === key) {
        slot.classList.add("ok"); slot.classList.remove("bad");
        slot.querySelector(".drop").textContent = key;
        var chip = pool.querySelector('.chip[data-k="' + key + '"]');
        chip.classList.add("used"); chip.classList.remove("sel");
        selected = null; solved++;
        TRACK.send("match_ok", mod, "match", { b: bi, label: key });
        if (solved === pairs.length) {
          msg.textContent = b.done || U("✓ 全部答對！", "Đúng hết!");
          TRACK.send("match_done", mod, "match", { b: bi, n: pairs.length, errors: errors, ms: Date.now() - t0 });
        }
      } else {
        errors++;
        TRACK.send("match_bad", mod, "match", { b: bi, label: key, slot: slot.dataset.k });
        slot.classList.add("bad");
        setTimeout(function () { slot.classList.remove("bad"); }, 350);
      }
    }
    order.forEach(function (q) {
      var c = el("div", "chip"); c.textContent = q.label; c.draggable = true; c.dataset.k = q.label;
      c.addEventListener("dragstart", function (e) { e.dataTransfer.setData("k", q.label); });
      c.onclick = function () {
        if (c.classList.contains("used")) return;
        if (selected === c) { c.classList.remove("sel"); selected = null; return; }
        pool.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("sel"); });
        c.classList.add("sel"); selected = c;
      };
      pool.appendChild(c);
    });
    pairs.forEach(function (q) {
      var s = el("div", "slot"); s.dataset.k = q.label;
      s.innerHTML = '<div class="drop">' + U("拖到這裡", "Kéo vào đây") + '</div><div class="desc">' + q.desc + '</div>';
      s.addEventListener("dragover", function (e) { e.preventDefault(); });
      s.addEventListener("drop", function (e) { e.preventDefault(); tryMatch(s, e.dataTransfer.getData("k")); });
      s.onclick = function () { if (selected) tryMatch(s, selected.dataset.k); };
      targets.appendChild(s);
    });
    host.appendChild(pool); host.appendChild(targets); host.appendChild(msg);
    f.appendChild(host); return f;
  };

  /* 結果代碼：把作答結果編成一串可貼給老師的代碼（FSQ1.<base64>.<檢查碼>）。
     解碼與彙整用專案根目錄的「食品科學概論_測驗成績解碼器.html」。 */
  function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
  function checksum(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1679616; // 36^4
    return h.toString(36);
  }

  BLOCKS.quiz = function (b) {
    var f = document.createDocumentFragment(); heading(f, b);
    var items = b.items, n = items.length;
    var head = el("div", "quiz-head");
    head.innerHTML =
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
      '<input class="qid" placeholder="' + U("學號（交成績必填）", "Mã số SV") + '" style="flex:1;min-width:130px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px">' +
      '<input class="qname" placeholder="' + U("姓名", "Họ tên") + '" style="flex:1;min-width:100px;padding:8px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:15px"></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
      '<strong class="qprog">' + U("進度", "Tiến độ") + ' 0 / ' + n + '</strong>' +
      '<span class="qscore" style="color:var(--secondary);font-weight:800">' + U("得分", "Điểm") + ' 0</span></div>' +
      '<div class="pbar"><div class="pfill"></div></div>';
    var box = el("div");
    var sb = el("div", "scorebox");
    sb.innerHTML = '<div>' + U("你的成績", "Điểm của bạn") + '</div><div class="big"><span class="fscore">0</span> / ' + n + '</div>' +
      '<div class="smsg" style="margin:8px 0 16px"></div>' +
      '<div class="rcwrap" style="margin:0 auto 16px;max-width:560px;text-align:left">' +
      '<div style="font-weight:700;margin-bottom:6px">' + U("結果代碼（請複製後，貼到老師指定的表單或訊息）", "— Mã kết quả: sao chép và gửi cho thầy/cô") + '</div>' +
      '<textarea class="rcode" readonly rows="3" style="width:100%;box-sizing:border-box;font-family:monospace;font-size:12px;padding:8px;border:1.5px solid var(--line,#ccc);border-radius:8px;resize:none"></textarea>' +
      '<div class="rmsg" style="font-size:13px;color:#B34700;margin-top:4px"></div>' +
      '<button class="btn copyrc" style="margin-top:8px">📋 ' + U("複製結果代碼", "Sao chép mã") + '</button></div>' +
      '<button class="btn ghost">' + U("重新測驗", "Làm lại") + '</button>';

    var answered = 0, score = 0, picks = [], qt0 = null, attempt = 0;
    var mod = CTX.mod, bi = CTX.bi;
    // 測驗的學號欄與頁首的學號代碼同步（兩邊填任一邊都行）
    var qidInput = head.querySelector(".qid");
    if (TRACK.on) {
      if (TRACK.code()) qidInput.value = TRACK.code();
      qidInput.addEventListener("change", function () {
        TRACK.setCode(qidInput.value);
        var top = $("#ifs-code"); if (top) top.value = TRACK.code();
      });
    }
    function updateProg() {
      head.querySelector(".qprog").textContent = U("進度", "Tiến độ") + " " + answered + " / " + n;
      head.querySelector(".qscore").textContent = U("得分", "Điểm") + " " + score;
      head.querySelector(".pfill").style.width = (answered / n * 100) + "%";
    }
    function finish() {
      sb.querySelector(".fscore").textContent = score;
      var pct = score / n, m;
      if (score === n) m = U("這 10 題全對！試著說明麵包從烘焙到保存的變化。", "Đúng cả 10 câu! Hãy giải thích biến đổi của bánh mì từ nướng đến bảo quản.");
      else if (pct >= 0.8) m = U("很棒！觀念相當扎實。", "Rất tốt!");
      else if (pct >= 0.6) m = U("不錯，再複習幾個弱點就更好。", "Khá tốt, ôn lại vài chỗ nữa nhé.");
      else m = U("建議回到前面單元再看一次翻卡與展開內容。", "Hãy xem lại các phần phía trước.");
      sb.querySelector(".smsg").textContent = m;

      var sid = head.querySelector(".qid").value.trim();
      var sname = head.querySelector(".qname").value.trim();
      var korr = items.map(function (item, i) { return picks[i] === item.a ? 1 : 0; }).join("");
      var payload = JSON.stringify({
        w: D.week || 0, c: A2 ? "a2" : undefined, id: sid, nm: sname, s: score, n: n,
        a: picks, k: korr, t: new Date().toISOString().slice(0, 16),
      });
      var body = b64utf8(payload);
      var code = "FSQ1." + body + "." + checksum(body);
      sb.querySelector(".rcode").value = code;
      sb.querySelector(".rmsg").textContent = sid ? "" : U("⚠ 尚未填學號 —— 請回到測驗上方填入學號後重新測驗，否則老師無法登記成績。", "Chưa nhập mã số SV: hãy nhập ở trên rồi làm lại.");
      TRACK.send("quiz_done", mod, "quiz", { b: bi, attempt: attempt, score: score, n: n, picks: picks, ms: qt0 ? Date.now() - qt0 : null });
      TRACK.flush();

      sb.classList.add("show");
      sb.scrollIntoView({ behavior: "smooth" });
    }
    function pick(qel, item, oi) {
      if (qel.dataset.done === "1") return;
      qel.dataset.done = "1"; answered++;
      if (qt0 === null) qt0 = Date.now();
      picks[parseInt(qel.dataset.qi, 10)] = oi;
      TRACK.send("quiz_answer", mod, "quiz", { b: bi, attempt: attempt, qi: parseInt(qel.dataset.qi, 10), pick: oi, ok: oi === item.a });
      qel.querySelectorAll(".opt").forEach(function (btn, i) {
        btn.classList.add("dim");
        if (i === item.a) btn.classList.add("correct");
        if (i === oi && oi !== item.a) btn.classList.add("wrong");
      });
      var fb = qel.querySelector(".fb");
      if (oi === item.a) { score++; fb.classList.add("good"); fb.innerHTML = U("✓ 正確！", "Đúng!") + item.e; }
      else { fb.classList.add("no"); fb.innerHTML = U("✗ 正解：", "Sai. Đáp án:") + item.o[item.a] + "。" + item.e; }
      fb.classList.add("show"); updateProg();
      if (answered === n) finish();
    }
    function build() {
      box.innerHTML = ""; answered = 0; score = 0; picks = []; qt0 = null; attempt++; updateProg();
      sb.classList.remove("show");
      items.forEach(function (item, qi) {
        var qel = el("div", "q"); qel.dataset.done = "0"; qel.dataset.qi = qi;
        qel.innerHTML = '<div class="qn">第 ' + (qi + 1) + ' 題' + (A2 ? ' · Câu ' + (qi + 1) : '') + '</div><div class="qt">' + item.q + '</div>';
        item.o.forEach(function (opt, oi) {
          var btn = el("button", "opt"); btn.textContent = opt;
          btn.onclick = function () { pick(qel, item, oi); };
          qel.appendChild(btn);
        });
        qel.appendChild(el("div", "fb"));
        box.appendChild(qel);
      });
    }
    sb.querySelector(".copyrc").onclick = function () {
      var ta = sb.querySelector(".rcode");
      ta.select(); ta.setSelectionRange(0, 99999);
      var btn = this;
      function ok() { btn.textContent = U("✓ 已複製，請貼給老師", "Đã sao chép"); setTimeout(function () { btn.textContent = "📋 " + U("複製結果代碼", "Sao chép mã"); }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(ta.value).then(ok, function () { document.execCommand("copy"); ok(); });
      else { document.execCommand("copy"); ok(); }
    };
    sb.querySelector(".ghost").onclick = function () {
      build(); window.scrollTo({ top: 0, behavior: "smooth" });
    };
    build();
    f.appendChild(head); f.appendChild(box); f.appendChild(sb);
    return f;
  };

  /* ---------- 組裝 ---------- */
  var nav = $("#nav"), main = $("#main");
  var curMod = D.modules.length ? D.modules[0].id : null, modT0 = Date.now();
  function switchMod(id, btn) {
    document.querySelectorAll(".module").forEach(function (m) { m.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
    nav.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
    btn.classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (id !== curMod) {
      TRACK.send("module_view", id, null, { from: curMod, ms: Date.now() - modT0 });
      curMod = id; modT0 = Date.now();
    }
  }
  D.modules.forEach(function (m, i) {
    var btn = el("button", i === 0 ? "active" : "", m.nav);
    btn.onclick = function () { switchMod(m.id, btn); };
    nav.appendChild(btn);

    var sec = el("section", "module" + (i === 0 ? " active" : ""));
    sec.id = m.id;
    sec.appendChild(el("div", "lead",
      '<div class="kicker">' + m.kicker + '</div><h2>' + m.h2 + '</h2><p>' + m.lead + '</p>'));
    m.blocks.forEach(function (b, bi) {
      var render = BLOCKS[b.type];
      if (!render) { console.error("未知區塊型別:", b.type); return; }
      CTX.mod = m.id; CTX.bi = bi;
      sec.appendChild(render(b));
    });
    main.appendChild(sec);
  });

  /* ---------- 學號代碼列（只在啟用記錄的週出現） ---------- */
  if (TRACK.on) {
    var bar = el("div", "codebar");
    bar.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;font-size:14px";
    bar.innerHTML = '<label for="ifs-code" style="font-weight:700">學號代碼</label>' +
      '<input id="ifs-code" maxlength="20" placeholder="例：S001" style="width:120px;padding:6px 10px;border:1.5px solid var(--line,#ccc);border-radius:8px;font-size:14px">' +
      '<span style="opacity:.75">只記錄你的學習歷程（翻卡、配對、測驗），不需要姓名。</span>';
    nav.parentNode.insertBefore(bar, nav);
    var inp = bar.querySelector("#ifs-code");
    inp.value = TRACK.code();
    inp.addEventListener("change", function () {
      TRACK.setCode(inp.value);
      document.querySelectorAll(".qid").forEach(function (x) { x.value = TRACK.code(); });
      TRACK.send("code_set", null, null, {});
    });
    TRACK.send("session_start", curMod, null, {
      device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || "") ? "mobile" : "desktop",
      w: window.innerWidth, build: D.build || null,
    });
    // 停留時間以「頁面可見」為準：切到背景就結算一段 module_leave，回來重新計時。
    // 手機瀏覽器殺分頁常不觸發 pagehide，所以以 visibilitychange→hidden 為主。
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        TRACK.send("module_leave", curMod, null, { ms: Date.now() - modT0 }); TRACK.flush();
      } else {
        modT0 = Date.now();
      }
    });
  }
})();
</script>
</body>
</html>
